<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · el cliente de datos</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">midiendo…</pre>

<!-- Stub de supabase-js: el CDN no se alcanza desde aqui. Registra cada
     createClient con sus opciones, que es justo lo que se quiere medir. -->
<script>
window.__creados = [];
window.supabase = {
  createClient(url, key, opts) {
    const c = {
      __url: url, __key: key, __opts: opts || null,
      __storageKey: (opts && opts.auth && opts.auth.storageKey) || ('sb-' + url.split('//')[1].split('.')[0] + '-auth-token'),
      auth: {
        getSession: async () => ({ data: { session: null } }),
        onAuthStateChange(){ return { data:{ subscription:{ unsubscribe(){} } } }; },
        signInWithPassword: async () => ({ data:null, error:{ message:'stub' } }),
        signOut: async () => ({}),
      },
      from(){ return this; }, select(){ return this; }, order(){ return this; },
      channel(){ return { on(){return this;}, subscribe(){return this;} }; },
      functions:{ invoke: async()=>({}) },
    };
    window.__creados.push(c);
    return c;
  }
};
</script>
<script src="/js/auth.js"></script>
<script src="/js/chat.js"></script>

<script>
const out = document.getElementById('out'); const L=[];
function log(s){L.push(s); out.textContent=L.join('\n');}
setTimeout(() => {
  log('clientes creados por auth.js + chat.js: ' + window.__creados.length);
  window.__creados.forEach((c,i) => {
    log('  #'+i+'  storageKey=' + c.__storageKey + '  opts=' + JSON.stringify(c.__opts));
  });
  const auth = window.faroSb;
  const datos = (typeof _sb !== 'undefined') ? _sb : null;
  log('window.faroSb es el cliente #' + window.__creados.indexOf(auth));
  log('_sb (el que usan chat/finanzas/destellos/inventario/redaccion/push) es el #' + window.__creados.indexOf(datos));
  log('_sb === window.faroSb : ' + (datos === auth));
  log('misma llave de almacenamiento: ' + (auth && datos && auth.__storageKey === datos.__storageKey));
  log('');
  log('VEREDICTO: ' + (datos === auth
    ? 'un solo cliente: la sesion viaja en todas las consultas'
    : 'DOS clientes distintos y con distinta llave de sesion; el de datos nunca ve la sesion de Supabase Auth -> todas sus consultas van como rol anon'));
  /* El veredicto tambien va en el titulo: en tanda solo se lee la pestaña.
     Aprueba solo si hay UN cliente y de verdad existe, que es lo unico que
     esta sonda mide; si auth.js no llego a crear ninguno, tampoco vale. */
  const fallos = (auth && datos === auth) ? 0 : 1;
  document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · cliente de datos';
}, 300);
</script>
</body></html>
