<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · el selector vuelve a Josue</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/_dev/harness-login-real.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

window.addEventListener('load', async () => {
  await esperar(2000);
  const w = f.contentWindow, d = f.contentDocument;
  try {
    const sb = w.faroSb;
    const form  = d.getElementById('login-form');
    const userEl = d.getElementById('login-user');
    const passEl = d.getElementById('login-pass');
    const errEl  = d.getElementById('login-error');

    log('── 1. QUE MUESTRA EL SELECTOR AL ABRIR ──');
    log('  value           = ' + userEl.value);
    log('  selectedIndex   = ' + userEl.selectedIndex);
    log('  texto visible   = "' + userEl.options[userEl.selectedIndex].text + '"');
    const cs = w.getComputedStyle(userEl);
    log('  visible?        display=' + cs.display + ' visibility=' + cs.visibility
        + ' opacity=' + cs.opacity + ' alto=' + userEl.getBoundingClientRect().height + 'px');
    log('  name (autofill) = ' + JSON.stringify(userEl.getAttribute('name')));
    log('  hay <option selected>? ' + [...userEl.options].some(o => o.defaultSelected));
    log('  primera opcion tiene value vacio (placeholder)? ' + (userEl.options[0].value === ''));

    log('\n── 2. A QUE CORREO SE MANDA LA CONTRASENA SI NO SE TOCA ──');
    let recibido = null;
    sb.auth.signInWithPassword = async (args) => {
      recibido = args;
      return { data: { user: null, session: null },
               error: { message: 'Invalid login credentials', status: 400, code: 'invalid_credentials' } };
    };
    passEl.value = 'LaClaveBuenaDeAngelly';
    form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    await esperar(300);
    log('  correo enviado  = ' + (recibido && recibido.email));
    log('  mensaje mostrado= "' + (errEl.hidden ? '(ninguno)' : errEl.textContent.trim()) + '"');
    log('  el nombre equivocado sigue a la vista: "'
        + userEl.options[userEl.selectedIndex].text + '"');

    log('\n── 3. HAY MEMORIA DE QUIEN ENTRO? ──');
    /* Entrada correcta de Angelly, luego se mira si queda rastro. */
    const antesLS = Object.keys(w.localStorage);
    userEl.value = 'angelly';
    sb.auth.signInWithPassword = async (args) => {
      recibido = args;
      return { data: { session: { user: { email: 'angelly@faro.local', user_metadata: { miembro: 'angelly' } } } }, error: null };
    };
    passEl.value = 'LaClaveBuenaDeAngelly';
    form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    await esperar(400);
    log('  entro?          = ' + JSON.stringify(w.verificarSesion()));
    log('  correo enviado  = ' + (recibido && recibido.email));
    log('  tras form.reset() el selector queda en: "'
        + userEl.options[userEl.selectedIndex].text + '" (value=' + userEl.value + ')');
    const nuevas = Object.keys(w.localStorage).filter(k => !antesLS.includes(k));
    log('  claves nuevas en localStorage: ' + JSON.stringify(nuevas));
    log('  alguna guarda el miembro elegido? '
        + nuevas.some(k => /angelly/i.test(String(w.localStorage.getItem(k)))));

    log('\n── 4. Y AL VOLVER A ABRIR (recarga limpia) ──');
    log('  el HTML no lleva ningun <option selected> ni codigo que lo rellene,');
    log('  asi que la recarga vuelve a la primera opcion. Confirmado arriba en 1.');
  } catch (e) {
    log('ERROR EN LA SONDA: ' + e.message);
  }
});
</script>
</body>
</html>
