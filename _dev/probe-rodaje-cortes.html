<!DOCTYPE html>
<html lang="es">

<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}

<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Sonda del BANCO DE CORTES de El Rodaje (`js/tools/rodaje-cortes.js`).

   Esto convierte una grabación larga en un archivo por toma. Lo que puede
   salir mal aquí no es «se ve feo»:

   1. QUE EL ARCHIVO SE SUBA A ALGÚN SITIO. No debe salir del aparato
      NUNCA, y la pantalla tiene que decirlo: nadie da por hecho que un
      sitio web no sube el archivo que le das, y una grabación de catorce
      minutos subiendo por la conexión de una tableta es una factura que
      nadie pidió.

   2. QUE EL CORTE DE AUDIO NO CAIGA DONDE SE DIJO. Es la única salida
      exacta que tiene esta pestaña: si el WAV sale con otra duración, lo
      que llega al montaje está corrido y no se nota hasta ahí.

   3. QUE SE PROMETA LO QUE ESTE APARATO NO PUEDE. En el Safari de un iPad
      no existe `captureStream` y el video no se puede cortar de ninguna
      manera. Hay que decirlo ANTES de marcar cuarenta entradas.

   4. QUE ABRIR OTRO ARCHIVO ARRASTRE LAS MARCAS DEL ANTERIOR. La misma
      secuencia se corta de dos grabaciones (la buena y la repetida), y
      mezclarlas saca los trozos equivocados sin avisar.

   5. QUE MIRAR OTRA PESTAÑA PIERDA EL ARCHIVO ABIERTO. En una tableta,
      volver a buscarlo son cinco toques y la carpeta equivocada dos veces.

   6. QUE LOS TIEMPOS SALGAN AMBIGUOS. Van a otro programa: un «2:05» se
      lee como dos horas en unos y dos minutos en otros.

   Como en las demás sondas: se ejecuta el index.html de verdad con una
   base de mentira a nivel de fetch, y el archivo de sonido se FABRICA
   aquí —un tono de tres segundos— para poder cortarlo de verdad. */

const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

function nuevaBase(w){
  const estado = { tablas: {
    rodaje_proyectos: [{ id:1, pid:'p-cor', titulo:'Intuición', tesis:'', estado:'montaje',
                         dur_obj:600, cam_pct:30, cam_bloque:45, url:'', notas:'' }],
    rodaje_bloques: [
      { id:20, pid:'p-cor', bid:'b-1', orden:1, clase:'camara', titulo:'La flecha rota', dur:30,
        guion:'¿Alguna vez…?', visual:'', notas:'', rotulo:'', listo:true, fids:[], sfx:[], musica:{} },
      { id:21, pid:'p-cor', bid:'b-2', orden:2, clase:'camara', titulo:'Amor fati · con acentos', dur:45,
        guion:'Ve a la hija…', visual:'', notas:'', rotulo:'', listo:true, fids:[], sfx:[], musica:{} },
      { id:22, pid:'p-cor', bid:'b-3', orden:3, clase:'grafico', titulo:'El universo bloque', dur:20,
        guion:'', visual:'', notas:'', rotulo:'', listo:false, fids:[], sfx:[], musica:{} },
    ],
    rodaje_fuentes: [], rodaje_reels: [],
  }};
  const filtra = (filas, params) => filas.filter(fila =>
    [...params.entries()].every(([c, v]) => ['select','order','limit','offset'].includes(c) ||
      (v.startsWith('eq.') ? String(fila[c]) === v.slice(3) : true)));
  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url, location.origin);
    if (!u.pathname.startsWith('/rest/v1/')) return new Response('{}', { status: 200 });
    const t = u.pathname.replace('/rest/v1/', '');
    if (!estado.tablas[t]) return new Response(JSON.stringify({code:'42P01'}), {status:404});
    let r = filtra(estado.tablas[t], u.searchParams);
    [...u.searchParams.getAll('order')].reverse().forEach(o => {
      const [c,d] = o.split('.');
      r = [...r].sort((a,b)=>(a[c]>b[c]?1:a[c]<b[c]?-1:0)*(d==='desc'?-1:1));
    });
    return new Response(JSON.stringify(r), {status:200, headers:{'Content-Type':'application/json'}});
  };
  return estado;
}

(async function corre(){
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await esperar(1300);
  const w = f.contentWindow;
  const g = id => w.document.getElementById(id);

  if (w.eval('typeof initRodaje') !== 'function') {
    log('✘ index.html no cargó js/tools/rodaje.js');
    document.title = 'SUSPENDE · cortes de El Rodaje'; return;
  }
  if (!w.FaroCortes) {
    log('✘ index.html no cargó js/tools/rodaje-cortes.js');
    document.title = 'SUSPENDE · cortes de El Rodaje'; return;
  }
  w.eval('window.verificarSesion = () => ({ user: "josue", nombre: "Josué Edmundo" })');
  w.confirm = () => true;
  w.alert = () => {};
  try { w.localStorage.removeItem('FARO_ROD_CORTES_V1'); } catch(e) {}

  const C = w.FaroCortes;
  nuevaBase(w);

  /* ═══ 1. EL RELOJ NO PUEDE SER AMBIGUO ═══
     Estos tiempos van a OTRO programa. Un «2:05» se lee como dos horas y
     cinco minutos en unos y como dos minutos y cinco segundos en otros, y
     esa ambigüedad se paga cortando mal. Con horas siempre y con
     milésimas, no hay dos lecturas. */
  log('── 1. Los tiempos salen sin ambigüedad posible ──');
  ok(C.relojMs(125.5) === '00:02:05.500',
     '125,5 s → 00:02:05.500 (horas siempre, milésimas siempre)',
     'el reloj de exportar no es el de ffmpeg: ' + C.relojMs(125.5));
  ok(C.relojMs(3725.25) === '01:02:05.250',
     'y más de una hora también', 'mal por encima de la hora: ' + C.relojMs(3725.25));
  ok(C.relojMs(0) === '00:00:00.000' && C.relojMs(-5) === '00:00:00.000',
     'y el cero y los negativos no rompen nada', 'el cero o un negativo dan basura');

  /* ═══ 2. EL NOMBRE DEL ARCHIVO AGUANTA EN CUALQUIER SISTEMA ═══ */
  log('');
  log('── 2. Los clips salen nombrados y ordenados ──');
  const n1 = C.nombre({ titulo: 'Amor fati · ¿y si "sí"?' }, 0, 'wav');
  ok(/^01 - /.test(n1),
     'el número de orden va DELANTE: los clips se ordenan solos en la carpeta («' + n1 + '»)',
     'el nombre no empieza por el número de orden: ' + n1);
  ok(!/[·¿"?]/.test(n1) && !/[áéíóúñ]/i.test(n1.replace(/\.wav$/,'')) === false || !/[·"?]/.test(n1),
     'y sin caracteres que rompan en algún sistema de archivos',
     'el nombre lleva caracteres peligrosos: ' + n1);
  ok(C.nombre({ titulo: '' }, 11, 'mp4') === '12 - sin titulo.mp4',
     'y un bloque sin título no deja un nombre vacío',
     'un título vacío da: ' + C.nombre({ titulo: '' }, 11, 'mp4'));

  /* ═══ 3. ⚠️ EL CORTE DE AUDIO CAE DONDE SE DIJO ═══
     Es la única salida exacta de esta pestaña. Se fabrica un tono de tres
     segundos, se corta de 1,0 a 2,5 y se cuentan los BYTES del WAV: si el
     corte estuviera corrido, el tamaño no cuadraría. */
  log('');
  log('── 3. El corte de audio es exacto, byte a byte ──');
  const medida = await w.eval(`(async () => {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const sr = 44100, seg = 3;
    const buf = A.createBuffer(2, sr * seg, sr);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = Math.sin(i / 30) * 0.5;
    }
    const blob = FaroCortes.wavDe(buf, 1.0, 2.5);
    const cab = new DataView(await blob.slice(0, 44).arrayBuffer());
    const txt = o => String.fromCharCode(cab.getUint8(o),cab.getUint8(o+1),cab.getUint8(o+2),cab.getUint8(o+3));
    try { A.close(); } catch(e) {}
    return { bytes: blob.size, tipo: blob.type, riff: txt(0), wave: txt(8), data: txt(36),
             canales: cab.getUint16(22, true), sr: cab.getUint32(24, true),
             bits: cab.getUint16(34, true), datos: cab.getUint32(40, true),
             entero: (await FaroCortes.wavDe(buf, 0, 3).arrayBuffer()).byteLength };
  })()`);

  const esperados = 44 + Math.round(1.5 * 44100) * 2 * 2;   // 1,5 s · estéreo · 16 bits
  ok(medida.bytes === esperados,
     'cortar de 1,0 a 2,5 da exactamente 1,5 s de muestras (' + medida.bytes + ' bytes)',
     'el corte NO cae donde se dijo: ' + medida.bytes + ' bytes, se esperaban ' + esperados);
  ok(medida.riff === 'RIFF' && medida.wave === 'WAVE' && medida.data === 'data',
     'y es un WAV de verdad, con su cabecera en su sitio',
     'la cabecera del WAV está mal: ' + medida.riff + '/' + medida.wave + '/' + medida.data);
  ok(medida.canales === 2 && medida.sr === 44100 && medida.bits === 16,
     'con los canales, la frecuencia y los bits que dice la cabecera',
     'la cabecera miente: ' + medida.canales + 'ch ' + medida.sr + 'Hz ' + medida.bits + 'bit');
  ok(medida.datos === medida.bytes - 44,
     'y el tamaño declarado dentro coincide con el real (si no, medio programa lo abre mal)',
     'el tamaño declarado no coincide: ' + medida.datos + ' vs ' + (medida.bytes - 44));
  ok(medida.tipo === 'audio/wav', 'y se entrega como audio/wav', 'el tipo es ' + medida.tipo);
  ok(medida.entero === 44 + 3 * 44100 * 2 * 2,
     'y cortar el archivo entero devuelve el archivo entero',
     'cortar de 0 al final no da el archivo entero: ' + medida.entero);

  /* Y los bordes, que es donde se cuelga cualquier cortador. */
  const bordes = await w.eval(`(async () => {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const buf = A.createBuffer(1, 44100, 44100);
    const r = {
      vacio:   FaroCortes.wavDe(buf, 1, 1).size,
      alReves: FaroCortes.wavDe(buf, 0.8, 0.2).size,
      pasado:  FaroCortes.wavDe(buf, 0.5, 99).size,
      negativo:FaroCortes.wavDe(buf, -5, 0.5).size,
    };
    try { A.close(); } catch(e) {}
    return r;
  })()`);
  ok(bordes.vacio === 44 && bordes.alReves === 44,
     'un corte de duración cero o del revés no revienta: da un WAV vacío',
     'un corte imposible rompe: ' + JSON.stringify(bordes));
  ok(bordes.pasado === 44 + Math.round(0.5*44100)*2 && bordes.negativo === 44 + Math.round(0.5*44100)*2,
     'y pasarse del final o pedir un tiempo negativo se recorta al archivo',
     'no se recorta a los límites del archivo: ' + JSON.stringify(bordes));

  /* ═══ 4. LA PANTALLA ═══ */
  log('');
  log('── 4. La pestaña dice lo que hay que decir ──');
  const alto = f.style.height;
  w.document.getElementById('app-container').style.display = '';
  w.document.getElementById('login-screen').style.display = 'none';
  w.eval('switchView("view-rodaje")');
  await esperar(900);
  w.eval('_rodPestana = "cortes"; rodPintarPestanas(); rodRender();');
  await esperar(400);

  const cuerpo = g('rod-cuerpo');
  ok(/no sale de este aparato/i.test(cuerpo.textContent),
     '⚠️ dice que el archivo NO sale del aparato, sin que nadie lo pregunte',
     'no dice que el archivo se queda aquí: nadie da por hecho que un sitio web no lo sube');
  ok(/ffmpeg/i.test(cuerpo.textContent),
     'y que los tiempos y las órdenes de ffmpeg funcionan siempre',
     'no ofrece la salida que no depende de nada');
  ok(/captureStream|no puede cortar video|Cortar VIDEO/i.test(cuerpo.textContent),
     'y dice ANTES qué puede y qué no puede este navegador',
     'no dice lo que este aparato no puede: se descubriría tras marcar cuarenta entradas');
  ok(!!g('rod-cor-archivo'),
     'y trae el botón para abrir la grabación',
     'no hay forma de abrir un archivo');

  /* ═══ 5. ABRIR, MARCAR Y CORTAR ═══ */
  log('');
  log('── 5. Abrir una grabación, marcar una toma y sacarla ──');
  /* Se fabrica un WAV de verdad de seis segundos y se le entrega como si
     lo hubiera elegido del aparato. */
  await w.eval(`(async () => {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const sr = 44100, buf = A.createBuffer(1, sr * 6, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.sin(i / 25) * 0.4;
    const blob = FaroCortes.wavDe(buf, 0, 6);
    try { A.close(); } catch(e) {}
    const file = new File([blob], 'grabacion del sábado.wav', { type: 'audio/wav' });
    FaroCortes.abrir(file, () => {});
  })()`);
  await esperar(600);

  const c2 = g('rod-cuerpo');
  ok(/grabacion del sábado\.wav/.test(c2.textContent),
     'la grabación aparece con su nombre',
     'no se ve el archivo abierto');
  ok(!!c2.querySelector('.rod-cor-medio'),
     'y con su reproductor',
     'no hay reproductor');
  ok(c2.querySelectorAll('[data-cor-bid]').length === 3,
     'y salen las tres tomas de la secuencia, sin volver a escribirlas',
     'no salen las tomas: ' + c2.querySelectorAll('[data-cor-bid]').length);

  /* Se marca la primera toma como lo haría un dedo: entrada y salida. */
  const fila = c2.querySelector('[data-cor-bid="b-1"]');
  const botones = [...fila.querySelectorAll('button')].map(b => b.textContent);
  const medio = c2.querySelector('.rod-cor-medio');
  medio.currentTime = 1.5;
  await esperar(150);
  [...fila.querySelectorAll('button')].find(b => /Entrada/.test(b.textContent)).click();
  await esperar(300);

  const m1 = w.FaroCortes._marcas()['b-1'];
  ok(m1 && Math.abs(m1.ini - 1.5) < 0.3,
     'marcar la entrada guarda el segundo donde estaba el reproductor',
     'la entrada no se guardó: ' + JSON.stringify(m1));
  ok(m1 && Math.abs(m1.fin - (m1.ini + 30)) < 0.01,
     'y propone la salida con la duración prevista del bloque (30 s), que casi siempre está cerca',
     'no propone la salida: ' + JSON.stringify(m1));
  void botones;

  /* Y ahora la salida de verdad, dentro del archivo. */
  const fila2 = g('rod-cuerpo').querySelector('[data-cor-bid="b-1"]');
  const medio2 = g('rod-cuerpo').querySelector('.rod-cor-medio');
  medio2.currentTime = 4.0;
  await esperar(150);
  [...fila2.querySelectorAll('button')].find(b => /Salida/.test(b.textContent)).click();
  await esperar(300);
  const m2 = w.FaroCortes._marcas()['b-1'];
  ok(m2 && Math.abs(m2.fin - 4.0) < 0.3,
     'y marcar la salida la pisa con el segundo de verdad',
     'la salida no se pisó: ' + JSON.stringify(m2));

  /* ⚠️ Y SE BAJA. Se intercepta la descarga para ver qué archivo sale y
     con qué nombre, sin dejar que el navegador lo guarde de verdad. */
  /* ⚠️ El clip se atrapa en `createObjectURL`, NO leyéndolo con `fetch`.
     El fetch de esta sonda es el PostgREST de mentira y contesta «{}» a
     todo lo que no sea /rest/v1/: leer el blob por ahí devolvía dos bytes
     y la comprobación acusaba al cortador de un fallo que era de la
     sonda. Se guarda el Blob de verdad al crearse la dirección. */
  const bajado = await w.eval(`(async () => {
    let visto = null, ultimoBlob = null;
    const origURL = URL.createObjectURL;
    URL.createObjectURL = function (b) { ultimoBlob = b; return origURL.call(URL, b); };
    const orig = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.hasAttribute('download')) { visto = { nombre: this.getAttribute('download'), blob: ultimoBlob }; return; }
      return orig.apply(this, arguments);
    };
    const fila = document.querySelector('[data-cor-bid="b-1"]');
    [...fila.querySelectorAll('button')].find(b => /Audio/.test(b.textContent)).click();
    await new Promise(r => setTimeout(r, 1800));
    HTMLAnchorElement.prototype.click = orig;
    URL.createObjectURL = origURL;
    if (!visto || !visto.blob) return { nombre: visto ? visto.nombre : '', bytes: 0, tipo: '' };
    return { nombre: visto.nombre, bytes: visto.blob.size, tipo: visto.blob.type };
  })()`);

  ok(bajado.nombre === '01 - La flecha rota.wav',
     '⬇ y el clip sale con el nombre del bloque y su número: «' + bajado.nombre + '»',
     'el clip no sale bien nombrado: «' + bajado.nombre + '»');
  const esperado5 = 44 + Math.round(2.5 * 44100) * 2;   // 1,5 → 4,0 s, mono
  ok(Math.abs(bajado.bytes - esperado5) < 44100,
     '⚠️ y con los 2,5 s que se marcaron, no con otros (' + bajado.bytes + ' bytes)',
     'el clip bajado NO tiene la duración marcada: ' + bajado.bytes + ', se esperaban ~' + esperado5);

  /* ═══ 5-bis. EL MANDO SE TOCA CON EL DEDO ═══
     Siete botones en una fila caben en una tableta y no en un teléfono:
     se quedaban en 38 px de ancho, por debajo de los 44 de la casa. Y
     envueltos era peor —el último caía en un segundo renglón y justo
     debajo del botón flotante de Destellos, que se lo comía—. Ahora los
     de ±5 s se retiran por debajo de 400 px. Esto se mide, no se supone:
     es de pantalla, y de pantalla no se sabe nada leyendo el código. */
  log('');
  log('── 5-bis. El mando cabe en una fila y se toca con el dedo ──');
  const mando = g('rod-cuerpo').querySelector('.rod-cor-mando');
  const cajas = [...mando.querySelectorAll('button')]
    .map(b => b.getBoundingClientRect())
    .filter(c => c.width > 0);
  const filas = new Set(cajas.map(c => Math.round(c.top))).size;
  const menorAncho = Math.min(...cajas.map(c => Math.round(c.width)));
  const menorAlto  = Math.min(...cajas.map(c => Math.round(c.height)));
  ok(filas === 1,
     '⚠️ los botones del mando caben en UNA fila (' + cajas.length + ' visibles)',
     'el mando se parte en ' + filas + ' filas: el último cae debajo del botón flotante y no se puede tocar');
  ok(menorAncho >= 44 && menorAlto >= 44,
     'y ninguno baja de 44×44, que es lo que un dedo acierta sin mirar (' +
       menorAncho + '×' + menorAlto + ' px)',
     'hay un botón del mando de ' + menorAncho + '×' + menorAlto + ' px: por debajo de 44 se falla el toque');
  ok(cajas.length >= 5,
     'y quedan al menos los cinco que no tienen sustituto (±1 s, ±0,1 s y reproducir)',
     'se escondieron botones que no se pueden hacer de otra manera');

  /* ═══ 6. LOS TIEMPOS Y ffmpeg ═══ */
  log('');
  log('── 6. Lo que sale para el otro programa ──');
  const tiempos = w.eval('FaroCortes.tiempos(rodTiempos(_rodBlo))');
  ok(/00:00:0[12]\./.test(tiempos) && /La flecha rota/.test(tiempos),
     'los tiempos salen con su toma al lado y en formato de montaje',
     'los tiempos no salen bien:\n' + tiempos.slice(0, 300));
  ok(!/b-2|b-3/.test(tiempos) && (tiempos.match(/→/g) || []).length === 1,
     'y solo las tomas marcadas: una marcada, una línea',
     'salen tomas sin marcar');

  const ff = w.eval('FaroCortes.ffmpeg(rodTiempos(_rodBlo))');
  ok(/ffmpeg -ss 00:00:0/.test(ff) && /-c copy/.test(ff),
     'y la orden de ffmpeg sale escrita y sin pérdida',
     'la orden de ffmpeg no sale:\n' + ff.slice(0, 300));
  ok(/grabacion del sábado\.wav/.test(ff),
     'con el nombre real del archivo dentro',
     'la orden no nombra el archivo abierto');
  /* En un archivo de audio no hay fotograma clave que valga, así que ahí
     la advertencia sobra y lo que tiene que decir es lo contrario: que el
     corte cae donde dice. Se comprueban las DOS ramas. */
  ok(/no hay fotograma clave|cae\n?# donde dice|sin volver a codificar/.test(ff),
     '⚠️ y con un archivo de audio dice que el corte cae donde dice, sin fotogramas de por medio',
     'la nota de ffmpeg para audio no es la correcta:\n' + ff.slice(0, 400));
  const ffVideo = w.eval(`(() => {
    FaroCortes._ponArchivo('grabacion.mp4', 999, true);
    const t = FaroCortes.ffmpeg(rodTiempos(_rodBlo));
    FaroCortes._ponArchivo('grabacion del sábado.wav', 1, false);
    return t;
  })()`);
  ok(/fotograma clave más cercano/.test(ffVideo),
     'y con un video, que la orden rápida se pega al fotograma clave más cercano',
     'con video no explica la diferencia entre la orden rápida y la exacta: elegir mal cuesta un corte adelantado');
  ok(/libx264/.test(ffVideo) && /-c copy/.test(ffVideo),
     'y ofrece las dos: la que no toca la imagen y la exacta',
     'con video no ofrece las dos órdenes');

  /* ═══ 7. MIRAR OTRA PESTAÑA NO PIERDE EL ARCHIVO ═══ */
  log('');
  log('── 7. El archivo abierto sobrevive a cambiar de pestaña ──');
  const antes = g('rod-cuerpo').querySelector('.rod-cor-medio');
  w.eval('_rodPestana = "citas"; rodPintarPestanas(); rodRender();');
  await esperar(300);
  w.eval('_rodPestana = "cortes"; rodPintarPestanas(); rodRender();');
  await esperar(400);
  const despues = g('rod-cuerpo').querySelector('.rod-cor-medio');
  ok(despues === antes,
     '⚠️ vuelve el MISMO reproductor, con su archivo: no hay que buscarlo otra vez en el aparato',
     'el reproductor se creó de nuevo: el archivo abierto se perdió al mirar otra pestaña');
  ok(w.FaroCortes._marcas()['b-1'] && w.FaroCortes._marcas()['b-1'].fin > 0,
     'y las marcas siguen puestas',
     'las marcas se perdieron al cambiar de pestaña');

  /* ═══ 8. LAS MARCAS SON DE ESA GRABACIÓN, NO DEL PROYECTO ═══
     La misma secuencia se corta de dos grabaciones —la buena y la
     repetida—, y arrastrar las marcas de una a la otra saca los trozos
     equivocados sin avisar de nada. */
  log('');
  log('── 8. Otra grabación no hereda las marcas de la anterior ──');
  const guardado = w.localStorage.getItem('FARO_ROD_CORTES_V1');
  ok(guardado && /b-1/.test(guardado),
     'las marcas se guardan en el aparato, con la firma del archivo',
     'las marcas no se guardaron: volver mañana obligaría a marcar todo otra vez');

  await w.eval(`(async () => {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const buf = A.createBuffer(1, 44100 * 4, 44100);
    const blob = FaroCortes.wavDe(buf, 0, 4);
    try { A.close(); } catch(e) {}
    FaroCortes.abrir(new File([blob], 'la repetida.wav', { type: 'audio/wav' }), () => {});
  })()`);
  await esperar(500);
  ok(Object.keys(w.FaroCortes._marcas()).length === 0,
     '⚠️ al abrir otra grabación las marcas empiezan de cero',
     'la segunda grabación heredó las marcas de la primera: sacaría los trozos equivocados');

  /* Y volver a la primera las recupera. */
  await w.eval(`(async () => {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const sr = 44100, buf = A.createBuffer(1, sr * 6, sr);
    const blob = FaroCortes.wavDe(buf, 0, 6);
    try { A.close(); } catch(e) {}
    FaroCortes.abrir(new File([blob], 'grabacion del sábado.wav', { type: 'audio/wav' }), () => {});
  })()`);
  await esperar(500);
  ok(w.FaroCortes._marcas()['b-1'] && w.FaroCortes._marcas()['b-1'].fin > 0,
     'y volver a la de antes recupera lo que ya estaba marcado',
     'volver a la grabación de antes no recupera sus marcas');

  /* ═══ 9. SIN BLOQUES NO HAY NADA QUE CORTAR ═══ */
  log('');
  log('── 9. Los bordes de la pestaña ──');
  w.eval('_rodBlo = []; rodRender();');
  await esperar(300);
  ok(/Secuencia/.test(g('rod-cuerpo').textContent) && /cortar/.test(g('rod-cuerpo').textContent),
     'sin bloques, dice que primero va la secuencia y a dónde ir',
     'sin bloques no explica qué falta');
  f.style.height = alto;

  /* ═══ 10. SI EL BANCO NO CARGA, EL RODAJE SIGUE ENTERO ═══
     Es la razón de que esto viva en su propio archivo: lo único que toca
     sonido, grabador y descargas no puede llevarse por delante el cuaderno
     de dirección, que es lo que siempre tiene que funcionar. */
  log('');
  log('── 10. Sin el banco de cortes, El Rodaje sigue entero ──');
  const banco = w.FaroCortes;
  w.FaroCortes = null;
  await w.eval('rodCargarProyecto()');
  await esperar(500);
  w.eval('_rodPestana = "cortes"; rodPintarPestanas(); rodRender();');
  await esperar(300);
  ok(/rodaje-cortes\.js/.test(g('rod-cuerpo').textContent),
     'la pestaña dice qué archivo falta',
     'no dice qué falta');
  w.eval('_rodPestana = "secuencia"; rodPintarPestanas(); rodRender();');
  await esperar(300);
  ok(!!g('rod-lista'),
     'y la secuencia sigue pintándose como si nada',
     'sin el banco de cortes se rompió el cuaderno de dirección');
  w.FaroCortes = banco;

  log('');
  log(fallos === 0 ? 'RESULTADO: APRUEBA' : `RESULTADO: SUSPENDE · ${fallos} fallo(s)`);
  document.title = fallos === 0 ? 'APRUEBA · cortes de El Rodaje' : 'SUSPENDE · cortes de El Rodaje';
})().catch(e => {
  log('✘ la sonda reventó: ' + (e && e.message) + '\n' + (e && e.stack));
  log('RESULTADO: SUSPENDE');
  document.title = 'SUSPENDE · cortes de El Rodaje';
});
</script>
</body>
</html>
