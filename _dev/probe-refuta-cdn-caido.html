<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · index.html sin el CDN</title></head>
<body>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = m => { out.textContent += m + '\n'; };

(async function () {
  /* 1. ¿Se alcanza el CDN desde este navegador? */
  let cdnOk = false;
  try {
    const r = await fetch('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', { mode: 'no-cors' });
    cdnOk = true;
    log('fetch al CDN: no lanzó (tipo ' + r.type + ')');
  } catch (e) {
    log('fetch al CDN: FALLA -> ' + e.message);
  }
  log('CDN alcanzable: ' + cdnOk);

  /* 2. Cargar index.html de verdad en un iframe del mismo origen. */
  const f = document.createElement('iframe');
  f.style.cssText = 'width:400px;height:600px';
  f.src = '/index.html';
  document.body.appendChild(f);

  await new Promise(res => { f.onload = res; setTimeout(res, 12000); });
  await new Promise(res => setTimeout(res, 6000));   /* tiempo al DOMContentLoaded async */

  const w = f.contentWindow, d = f.contentDocument;
  log('');
  log('── dentro de index.html ──');
  log('window.supabase         : ' + typeof w.supabase);
  log('window.faroSb           : ' + (w.faroSb === null ? 'null' : typeof w.faroSb));
  log('typeof verificarSesion  : ' + typeof w.verificarSesion);
  log('verificarSesion()       : ' + JSON.stringify(w.verificarSesion ? w.verificarSesion() : 'n/a'));

  const app = d.getElementById('app-container');
  const login = d.getElementById('login-screen');
  const err = d.getElementById('login-error');
  log('app-container display   : ' + (app ? (app.style.display || '(vacío)') : 'NO EXISTE'));
  log('app-container visible   : ' + (app ? (app.getBoundingClientRect().height > 0) : 'n/a'));
  log('login-screen display    : ' + (login ? (login.style.display || '(vacío)') : 'NO EXISTE'));
  log('login-screen visible    : ' + (login ? (login.getBoundingClientRect().height > 0) : 'n/a'));
  log('mensaje de error oculto : ' + (err ? err.hidden : 'n/a'));
  log('texto del error         : ' + (err ? err.textContent.trim() : 'n/a'));

  /* 3. ¿Cargó el resto del contenido local, aunque esté oculto? */
  log('');
  log('── contenido local (¿está ahí, solo escondido?) ──');
  log('typeof MISIONES/misiones: ' + typeof w.MISIONES + ' / ' + typeof w.misiones + ' / ' + typeof w.FARO_MISIONES);
  log('typeof renderHome       : ' + typeof w.renderHome);
  log('typeof load             : ' + typeof w.load);
  const vistas = d.querySelectorAll('#app-container .view');
  log('vistas dentro del app   : ' + vistas.length);

  /* 4. ¿Sirve la contraseña correcta si el CDN no está? */
  log('');
  log('── intento de entrar con el formulario ──');
  try {
    const r = await w.iniciarSesion('josue', 'loquesea');
    log('iniciarSesion() devuelve: ' + r + '  (false = no entra pase lo que pase)');
  } catch (e) {
    log('iniciarSesion() lanza: ' + e.message);
  }

  /* 5. ¿El service worker guarda el script del CDN? */
  log('');
  log('── caché del service worker ──');
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await new Promise(res => setTimeout(res, 4000));
    const keys = await caches.keys();
    log('cachés: ' + JSON.stringify(keys));
    for (const k of keys) {
      const c = await caches.open(k);
      const req = await c.keys();
      log('  ' + k + ' -> ' + req.length + ' entradas');
      req.forEach(r => log('     · ' + r.url));
    }
    const hit = await caches.match('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    log('¿supabase-js en caché?  : ' + !!hit);
    await reg.unregister();
  } catch (e) {
    log('service worker: ' + e.message);
  }

  /* 6. ¿mision.html se abre sin el CDN? */
  log('');
  log('── otra puerta: mision.html ──');
  const f2 = document.createElement('iframe');
  f2.src = '/mision.html?id=1';
  document.body.appendChild(f2);
  await new Promise(res => { f2.onload = res; setTimeout(res, 8000); });
  await new Promise(res => setTimeout(res, 3000));
  try {
    const d2 = f2.contentDocument;
    log('mision.html carga script supabase: ' + !!d2.querySelector('script[src*="jsdelivr"]'));
    log('mision.html carga auth.js        : ' + !!d2.querySelector('script[src*="auth.js"]'));
    log('mision.html tiene login-screen   : ' + !!d2.getElementById('login-screen'));
    log('texto visible (120 chars)        : ' + (d2.body.innerText || '').replace(/\s+/g, ' ').slice(0, 120));
  } catch (e) {
    log('mision.html: ' + e.message);
  }

  log('');
  log('FIN');
})();
</script>
</body>
</html>
