<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de la Persuasión, etapa 2</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-persuasion-sesgos/sesgos.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta de la Persuasión: bancos, laboratorio,
   pruebas impresas con su propio nombre, casos del proyecto, ficha, y que la
   aplicación muestre la ruta con DOS etapas construidas y el sello familiar. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones (las 14 del molde y Casos del proyecto)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Persuasión · Etapa 2 de 6/.test(d.body.textContent), 'se presenta como etapa 2 de 6', 'no se presenta como etapa de la ruta');
    ok(!/promesa en doce palabras|audiencia concreta|característica y beneficio/i.test(d.body.textContent), 'sin restos de la etapa de la que se copió', 'quedan textos de Para quién y qué le cambia');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'anclaje,confirmacion,perdida,hundido', 'laboratorio con los 4 sesgos', 'sesgos: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 8, 'los 8 sesgos de la línea', 'sesgos en la línea: ' + dentro('timelineData.length'));
    ok(/faro_psi_sesgos/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/El anclaje/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en el anclaje', 'abre en otro sesgo');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la sala de espejos se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|La máquina que predice|Quién decide de verdad|Para quién y qué le cambia/.test(rotulos), 'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      const cajas = casos.querySelectorAll('.card');
      ok(cajas.length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + cajas.length);
      const txt = casos.textContent;
      ['doscientos mil', 'setecientas horas', 'millón de vistas', 'ya usa M.E.T.A.S', 'la oferta se cae', 'queja ruidosa', 'el nombre suena bien', 'seis etapas']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok((txt.match(/El sesgo que trabaja/g) || []).length === 8, 'los ocho casos nombran su sesgo', 'casos con sesgo nombrado: ' + (txt.match(/El sesgo que trabaja/g) || []).length);
      ok((txt.match(/La pregunta que lo desactiva/g) || []).length >= 6, 'cada caso trae su pregunta antídoto', 'antídotos: ' + (txt.match(/La pregunta que lo desactiva/g) || []).length);
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas de la decisión en frío/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/hoja de las cinco preguntas/i.test(txt), 'trae la hoja de las cinco preguntas', 'falta la hoja de las cinco preguntas');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/setecientas horas|200\.000|millón de vistas/.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-persuasion-sesgos.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/Cuaderno de decisiones/i.test(txt), 'la ficha trae el cuaderno de decisiones', 'la ficha no trae el cuaderno de decisiones');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    const rec = d.querySelector('#s-recursos a[href*="ficha-persuasion-sesgos"]');
    ok(!!rec, 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const cards = [...da.querySelectorAll('.ruta-card')];
    const casa = cards.find(c => /Ruta de la Persuasión/.test(c.textContent));
    ok(!!casa, 'la Ruta de la Persuasión está en el mapa', 'no aparece la ruta');
    if (casa) {
      /* Cuentas sacadas del CATÁLOGO, no escritas a mano: las de a mano se
         quedaron viejas al crecer la ruta y la sonda suspendía sin que hubiera
         nada roto. Salió a la luz el día que estrenó veredicto en el título. */
      const construidasR = wa.eval('MISSIONS.filter(m => m.ruta === "persuasion").length');
      const totalR = wa.eval('RUTAS.persuasion.etapas');
      ok(casa.querySelectorAll('.re-link').length === construidasR, 'con sus ' + construidasR + ' etapas construidas ya tocables', 'etapas tocables: ' + casa.querySelectorAll('.re-link').length + ', construidas: ' + construidasR);
      ok(casa.querySelectorAll('.ruta-etapa-futura').length === totalR - construidasR, 'y el resto por construir, con nombre', 'futuras: ' + casa.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalR - construidasR));
      ok(/Sesgos: los atajos que deciden por ti/.test(casa.textContent), 'la etapa 2 sale con el título de la misión', 'la etapa 2 sigue saliendo como prevista');
      ok(/Marcos: quien pone el marco/i.test(casa.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="psi"]');
    ok(!!chip, 'la materia Psicología y Persuasión tiene su chip', 'no hay chip de Psicología');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      const enMateria = wa.eval('MISSIONS.filter(m => m.materia === "psi").length');
      ok(tarjetas.length === enMateria, 'la materia muestra sus ' + enMateria + ' misiones', 'muestra ' + tarjetas.length);
      const sesgos = tarjetas.find(t => /Sesgos/.test(t.textContent));
      ok(!!sesgos && /🔒/.test(sesgos.textContent), 'la misión de sesgos lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); }
  /* El veredicto va en el título porque es lo que se lee al correr las sondas
     en tanda: un cuerpo verde con la pestaña de siempre sale como no aprobada. */
  document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Persuasión etapa 2';
});
</script>
</body>
</html>
