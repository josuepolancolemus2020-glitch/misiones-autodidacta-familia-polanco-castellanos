<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · storageKey con supabase-js REAL</title>
<script src="/_dev/vendor/supabase.js"></script>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">midiendo…</pre>
<script>
const out = document.getElementById('out');
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }

const URL_ = 'https://bzrnjvalpwlcnpszvwim.supabase.co';
const KEY_ = 'sb_publishable_74mJW5LoxPZOWtIi7YrBEw_0y9JjSfM';
const REF  = 'bzrnjvalpwlcnpszvwim';

/* Un JWT falso pero bien formado, que no caduca hasta 2035. No se llama a la
   red: solo se comprueba QUE CLAVE de localStorage lee cada cliente. */
function jwt(){
  const b64 = o => btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return b64({alg:'HS256',typ:'JWT'}) + '.' +
         b64({sub:'00000000-0000-0000-0000-000000000001', role:'authenticated',
              email:'jael@faro.local', exp: 2069999999, iat: 1700000000,
              aud:'authenticated', session_id:'sess-1'}) + '.firmafalsa';
}
function sesionFalsa(){
  const t = jwt();
  return { access_token: t, refresh_token: 'r1', token_type:'bearer',
           expires_in: 999999999, expires_at: 2069999999,
           user: { id:'00000000-0000-0000-0000-000000000001', aud:'authenticated',
                   role:'authenticated', email:'jael@faro.local',
                   user_metadata:{miembro:'jael'}, app_metadata:{} } };
}

window.addEventListener('load', async () => {
  log('supabase-js real cargado: ' + !!(window.supabase && window.supabase.createClient));
  log('storageKey por defecto esperada: sb-' + REF + '-auth-token');
  log('');

  localStorage.clear();

  /* ── ESCENARIO A · tal y como esta el codigo hoy ──────────────────── */
  log('══ A · COMO ESTA HOY: auth con storageKey propio, datos sin el ══');
  const A_auth = supabase.createClient(URL_, KEY_, {
    auth: { persistSession:true, autoRefreshToken:false, storageKey:'faro_auth' } });
  const A_datos = supabase.createClient(URL_, KEY_);   // el _sb de chat.js

  /* Se simula el signInWithPassword de auth.js escribiendo la sesion en la
     clave que ESE cliente usa, que es exactamente lo que hace supabase-js. */
  localStorage.setItem('faro_auth', JSON.stringify(sesionFalsa()));

  log('localStorage tiene: ' + JSON.stringify(Object.keys(localStorage)));
  const sa1 = await A_auth.auth.getSession();
  const sa2 = await A_datos.auth.getSession();
  log('  cliente de AUTH  (faro_auth) ve sesion? ' + (sa1.data.session ? 'SI · '+sa1.data.session.user.email : 'NO'));
  log('  cliente de DATOS (por defecto) ve sesion? ' + (sa2.data.session ? 'SI · '+sa2.data.session.user.email : 'NO'));

  /* Y lo que de verdad importa: que Authorization manda el cliente de datos. */
  let visto = null;
  const fetchReal = window.fetch;
  window.fetch = function(u, o){
    if (String(u).indexOf('/rest/v1/') !== -1) {
      const h = (o && o.headers) || {};
      const get = k => (h.get ? h.get(k) : (h[k] || h[k.toLowerCase()]));
      visto = String(get('Authorization') || get('authorization') || '(sin cabecera)');
      return Promise.resolve(new Response('[]', {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return fetchReal.apply(this, arguments);
  };
  await A_datos.from('inventario').select('*');
  const esAnon = visto && visto.indexOf(KEY_) !== -1;
  log('  Authorization que sale en la consulta a «inventario»:');
  log('    ' + (visto || '(no se vio)').slice(0, 90));
  log('    ¿es la clave publicable (rol anon)? ' + (esAnon ? 'SI' : 'no') +
      '   ¿es el token de la sesion? ' + (visto && visto.indexOf('.firmafalsa') !== -1 ? 'SI' : 'no'));
  log('');

  /* ── ESCENARIO B · el contraste: la MISMA storageKey ──────────────── */
  log('══ B · CONTRASTE: los dos clientes con la clave POR DEFECTO ══');
  localStorage.clear();
  const B_auth  = supabase.createClient(URL_, KEY_, {
    auth: { persistSession:true, autoRefreshToken:false } });
  const B_datos = supabase.createClient(URL_, KEY_);
  localStorage.setItem('sb-' + REF + '-auth-token', JSON.stringify(sesionFalsa()));

  const sb2 = await B_datos.auth.getSession();
  log('  cliente de DATOS ve sesion? ' + (sb2.data.session ? 'SI · '+sb2.data.session.user.email : 'NO'));
  visto = null;
  await B_datos.from('inventario').select('*');
  log('  Authorization en la consulta a «inventario»:');
  log('    ' + (visto || '(no se vio)').slice(0, 90));
  log('    ¿lleva el token de la sesion? ' + (visto && visto.indexOf('.firmafalsa') !== -1 ? 'SI' : 'no'));

  window.fetch = fetchReal;
  log('');
  log('FIN');
});
</script>
</body>
</html>
