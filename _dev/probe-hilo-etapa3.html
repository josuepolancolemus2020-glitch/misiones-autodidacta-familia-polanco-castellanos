<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Hilo que Tira, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-hilo-forma-formas/forma-formas.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta del Hilo que Tira (Storytelling): esta
   etapa ES la regla de oro de la materia en acción, así que la sonda la
   vigila con más saña que a ninguna otra. Bancos, laboratorio, los ocho
   casos, el guion, las seis lecturas con sus preguntas dentro, el marcador,
   la impresión, la ficha, la materia y la ruta en el mapa.

   Las reglas propias de la materia que aquí se vigilan con más saña:
     1. NINGUNA ESTRUCTURA SIN AUTOR Y AÑO. Cada estructura que la etapa
        menciona (Aristóteles, Freytag 1863, Campbell 1949, Todorov 1969,
        Field 1979, Snyder 2005, Booker 2004, Reagan y colegas 2016, Le Guin
        1986, Alison 2019) va con su año, y el kishōtenketsu se declara sin
        autor único, que es su etiqueta correcta.
     2. CAMPBELL (1949) VA SIEMPRE CON LA OBJECIÓN DE DUNDES.
     3. LAS SEIS FORMAS (REAGAN Y COLEGAS, 2016) VAN SIEMPRE CON SU CORPUS Y
        SU LÍMITE (1,327 obras, casi todo occidental y en inglés).

   La comprobación de estructuras mira las cinco secciones de PROSA (Aprende,
   Estructura, Casos, Guion y Lecturas), no la página entera: los bancos
   pintan rótulos que son fichas de juego (es la trampa 1 de la norma
   5-nonies).

   El guion largo se busca con su escape de código (u2014), nunca con el
   caracter puesto directo en este archivo: una sonda que lo llevara dentro
   se suspenderia sola, siendo ella misma la primera en incumplir la regla
   que revisa.   */
const RAYA = new RegExp('\\u2014');
const RAYAS_G = new RegExp('\\u2014', 'g');
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda hilo etapa 3'; };
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Hilo que Tira · Etapa 3 de 12/.test(d.body.textContent), 'se presenta como etapa 3 de 12', 'no se presenta como etapa 3 de la ruta');
    const cuerpo = d.body.textContent.replace(/\s+/g, ' ');
    /* Restos del mold profundo (Brújula) y de las dos etapas de las que se
       copió (cadena-hueco y deseo-obstaculo), que no deberían quedar. */
    ok(!/Pueblo Exacto|Anselmo Sotelo|prueba del conector|Parker y Stone|Sternberg|representatividad|tasa base|Tversky|Kahneman|rueda de la fortuna|Nicanor Sabella|Don Aciar|objeto de deseo|Onofre Pardal|John Truby|Lajos Egri|querer vs necesitar/i.test(cuerpo),
       'sin restos de otras misiones ni del molde original', 'queda temario de otra misión en la página');
    ok(!RAYA.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(RAYAS_G) || []).length + ' guiones largos');
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content;
    ok(/FORMA DE LAS FORMAS/.test(banda) && /FREYTAG/.test(banda) && !/EL DESEO/.test(banda) && !/LA CADENA/.test(banda),
       'la banda del encabezado es de esta etapa (FORMA DE LAS FORMAS y FREYTAG, sin EL DESEO ni LA CADENA)', 'la banda dice: ' + banda.slice(0, 70));
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);
    ok(d.querySelectorAll('#timelineTrack .tl-node').length === dentro('timelineData.length'),
       'y la línea de tiempo arrancó con sus ' + dentro('timelineData.length') + ' fechas', 'hitos pintados: ' + d.querySelectorAll('#timelineTrack .tl-node').length);
    ok((d.getElementById('lab-display').textContent || '').trim().length > 40, 'el laboratorio arrancó con una ficha puesta', 'el laboratorio arrancó vacío');

    log('\n── LA REGLA DE ORO: NINGUNA ESTRUCTURA SIN AUTOR Y AÑO ──');
    /* Se mira por BLOQUE (cada .card de las cinco secciones de prosa, y cada
       tarjeta de lectura), no con una ventana de caracteres: esta etapa
       repite sus estructuras muchas veces dentro de un mismo cuento, guion o
       careo (porque el tema ES esa estructura), y exigir la fecha pegada a
       CADA mención volvería la prosa una lista de citas. Lo que de verdad
       exige la regla de oro es que ningún bloque hable de una estructura sin
       fecharla en algún punto de ese mismo bloque. El track de la línea de
       tiempo se excluye: sus tarjetas solo llevan una etiqueta corta (el
       apellido) hasta que se toca, y el texto completo vive en tlInfoText. */
    const prosa5 = ['s-aprende', 's-estructura', 's-casos', 's-guion', 's-lecturas']
      .map(id => (d.getElementById(id) || {}).textContent || '').join(' ').replace(/\s+/g, ' ');
    const bloquesProsa = [...d.querySelectorAll('#s-aprende .card, #s-estructura .card, #s-casos .card, #s-guion .card, #s-lecturas .card')]
      .filter(c => !c.querySelector('#timelineTrack'));
    let huerfanas = 0, plantillas = 0, ejemplo = '';
    const rePl = /monomito|pir[áa]mide|tres actos|quince golpes|siete tramas|seis formas|viaje del escritor|save the cat/gi;
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (rePl.test(txt)) {
        rePl.lastIndex = 0;
        plantillas++;
        if (!/\b(1[4-9]\d\d|20[0-2]\d|s\.\s*IV|siglo IV)\b/.test(txt)) { huerfanas++; if (!ejemplo) ejemplo = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }
    });
    ok(huerfanas === 0, 'toda plantilla que asoma (en ' + plantillas + ' bloque(s)) lleva su año en ese mismo bloque', 'hay ' + huerfanas + ' bloque(s) con plantilla huérfana: ' + ejemplo);
    ok(/Arist[óo]teles/.test(prosa5) && /(s\.\s*IV a\. ?C\.|siglo IV a\. ?C\.)/.test(prosa5), 'principio, medio y fin se atribuyen a Aristóteles (s. IV a. C.)', 'falta Aristóteles con su fecha');
    ok(/Freytag/.test(prosa5) && /1863/.test(prosa5), 'la pirámide a Freytag (1863)', 'la pirámide va sin Freytag (1863)');
    ok(/Campbell/.test(prosa5) && /1949/.test(prosa5), 'el monomito a Campbell (1949)', 'el monomito va sin Campbell (1949)');
    ok(/Todorov/.test(prosa5) && /1969/.test(prosa5), 'equilibrio-ruptura-equilibrio a Todorov (1969)', 'falta Todorov (1969)');
    ok(/Field/.test(prosa5) && /1979/.test(prosa5), 'el paradigma de tres actos a Syd Field (1979)', 'falta Field (1979)');
    ok(/Snyder/.test(prosa5) && /2005/.test(prosa5), 'los quince golpes a Blake Snyder (2005)', 'falta Snyder (2005)');
    ok(/Reagan/.test(prosa5) && /2016/.test(prosa5) && /1,?327/.test(prosa5), 'las seis formas a Reagan y colegas (2016), con las 1,327 obras', 'falta Reagan (2016) o la cifra de obras');
    ok(/Le Guin/.test(prosa5) && /1986/.test(prosa5), 'la teoría de la bolsa a Le Guin (1986)', 'falta Le Guin (1986)');
    ok(/Alison/.test(prosa5) && /2019/.test(prosa5), 'meandro, espiral y red a Jane Alison (2019)', 'falta Alison (2019)');
    ok(/kish[oō]tenketsu/i.test(prosa5) && /sin autor [úu]nico/i.test(prosa5), 'el kishōtenketsu se declara forma tradicional sin autor único', 'el kishōtenketsu no se declara sin autor');
    ok(/ninguna estructura se cita sin autor|autor, a[ñn]o y cr[íi]tica|con su autor y su a[ñn]o|autor y (su )?año/i.test(cuerpo),
       'la regla de oro está escrita a la vista', 'la regla de oro de la ruta no aparece');

    log('\n── LA PAREJA INCÓMODA: CAMPBELL SIEMPRE CON DUNDES (por bloque) ──');
    let citadosC = 0, peladosC = 0, muestraC = '';
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (/Campbell/.test(txt)) {
        citadosC++;
        if (!/Dundes/.test(txt)) { peladosC++; if (!muestraC) muestraC = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }
    });
    ok(citadosC >= 1 && peladosC === 0, 'Campbell (1949) se cita siempre con la objeción de Dundes, en el mismo bloque', 'hay ' + peladosC + ' bloque(s) con Campbell sin Dundes: ' + muestraC);

    log('\n── LA MEDICIÓN SIEMPRE CON SU LÍMITE: REAGAN (2016) Y SU CORPUS (por bloque) ──');
    let citadosR = 0, peladosR = 0, muestraR = '';
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (/Reagan/.test(txt)) {
        citadosR++;
        if (!/occidental|Occidente/i.test(txt)) { peladosR++; if (!muestraR) muestraR = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }
    });
    ok(citadosR >= 1 && peladosR === 0, 'Reagan y colegas (2016) se citan siempre con el límite del corpus occidental, en el mismo bloque', 'hay ' + peladosR + ' bloque(s) sin el límite: ' + muestraR);

    log('\n── EL CONCEPTO DE LA ETAPA ──');
    ok(/peripecia/i.test(cuerpo) && /reconocimiento/i.test(cuerpo), 'la peripecia y el reconocimiento de Aristóteles', 'faltan la peripecia y el reconocimiento');
    ok(/protocolo/i.test(cuerpo) && /cinco movimientos/i.test(cuerpo), 'el protocolo de cinco movimientos', 'falta el protocolo de cinco movimientos');
    ok(/etiqueta de estatus/i.test(cuerpo), 'la etiqueta de estatus se nombra', 'falta la etiqueta de estatus');
    ok(/plantilla (de industria|comercial)/i.test(cuerpo), 'la plantilla de industria/comercial se nombra', 'falta la plantilla de industria');
    ok(/Dundes/.test(cuerpo) && /no (es|comprobable)/i.test(cuerpo), 'la objeción de Dundes al monomito', 'falta la objeción de Dundes');
    ok(/kish[oō]tenketsu/i.test(cuerpo) && /giro/i.test(cuerpo), 'el kishōtenketsu y su giro sin choque', 'falta el kishōtenketsu');
    ok(/pendiente/i.test(cuerpo), 'lo que no se comprueba se deja pendiente', 'no se explica qué se hace con lo no comprobado');
    ok(/lempira/i.test(cuerpo) || /L \d/.test(cuerpo), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');
    ok(/Vonnegut/.test(cuerpo) && /rechaz/i.test(cuerpo), 'la tesis de Vonnegut, rechazada', 'falta la tesis rechazada de Vonnegut');

    log('\n── LOS OCHO CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos').textContent.replace(/\s+/g, ' ');
    ok((casos.match(/Caso \d/g) || []).length === 8, 'los ocho casos están', 'casos: ' + (casos.match(/Caso \d/g) || []).length);
    ok(/M\.E\.T\.A\.S/.test(casos), 'y salen de este proyecto', 'los casos no hablan del proyecto');
    ok(/L \d|lempira/i.test(casos), 'con sus cifras en lempiras', 'los casos van sin lempiras');
    ok(/autor/i.test(casos) && /a[ñn]o/i.test(casos) && /cr[íi]tica/i.test(casos), 'cada caso fecha y critica una estructura', 'los casos no fechan ni critican');
    ok(/etiqueta/i.test(casos), 'con la etiqueta de estatus puesta', 'los casos no ponen etiqueta');
    ok(/la pregunta que decide/i.test(casos) && /la condici[óo]n/i.test(casos), 'cada caso termina en la pregunta que decide y su condición', 'los casos no cierran como manda la norma 3');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const g = d.getElementById('s-guion').textContent.replace(/\s+/g, ' ');
    ok((g.match(/Escena \d/g) || []).length === 7, 'las siete escenas', 'escenas: ' + (g.match(/Escena \d/g) || []).length);
    ok(/VOZ/.test(g) && /IMAGEN:/.test(g) && /TEXTO EN PANTALLA:/.test(g), 'cada escena lleva VOZ, IMAGEN y TEXTO', 'faltan las tres pistas');
    ok(/gancho en fr[íi]o/i.test(g), 'el gancho en frío', 'falta el gancho');
    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');
    ok(/La forma de las formas/.test(g), 'y el cierre nombra la misión', 'el cierre no nombra la misión');
    ok(/Vonnegut/.test(g) && /rechaz/i.test(g), 'y el guion cumple su propia herramienta: su protagonista tiene un autor, un año y un límite reconocido', 'el guion no lleva su propio ejemplo fechado y criticado');

    log('\n── LAS SEIS LECTURAS (normas 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    const tl = lect.textContent.replace(/\s+/g, ' ');
    const claves = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
    ok(claves.every(k => !!d.getElementById('lect-' + k)), 'las seis tarjetas están, con sus ids',
       'faltan: ' + claves.filter(k => !d.getElementById('lect-' + k)).join(', '));
    ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'y no hay ninguna de más',
       'tarjetas: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
    ok(claves.every(k => !!d.querySelector('#lect-' + k + ' .lect-nota')), 'cada una con su nota de estatus', 'alguna tarjeta va sin lect-nota');
    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
       'y avisa de las preguntas de cada lectura y del plegado', 'la entrada no explica las preguntas ni el plegado');
    ok(/ejercicios? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl),
       'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
    ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis en el mismo saco');
    ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
    ok(/papeles/i.test(tl) && /no personas/i.test(tl), 'y dice que el careo firma con papeles', 'la etiqueta no dice cómo firma sus turnos el careo');
    ok(/nunca ocurrieron/i.test(tl), 'y que los encuentros de las entrevistas nunca ocurrieron', 'falta la declaración de ficción');
    ok(/Campbell/.test(tl) && /Dundes/.test(tl), 'la sección repite el aviso de la materia con su ejemplo', 'la sección de lecturas no repite el aviso de la materia');
    ok(/El cat[áa]logo de las formas/.test(tl), 'el cuento a la manera de Borges', 'falta el cuento');
    ok(/ventera/.test(tl) && /Bracamonte/.test(tl), 'el capítulo cervantino, con sus personajes de venta', 'falta el capítulo');
    ok(/La especie que necesita un molde/.test(tl), 'el ensayo a la manera de Harari', 'falta el ensayo');
    ok(/Soler Serrano/.test(tl) && /A fondo/.test(tl), 'la entrevista, con las señas reales del entrevistador', 'la entrevista no declara quién es Soler Serrano');
    ok(/Quintero/.test(tl) && /Gala/.test(tl) && /Loco de la Colina/i.test(tl), 'la conversación del Loco de la Colina', 'falta la conversación');

    log('\n── LA ENTREVISTA IMAGINADA, Y SU CUIDADO PROPIO ──');
    const entr = d.getElementById('lect-entrevista');
    const nEntr = (entr.querySelector('.lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nEntr), 'la entrevista se declara IMAGINADA, en mayúsculas y a la vista', 'la entrevista no se declara imaginada');
    ok(/nunca ocurri/i.test(nEntr) && /1904/.test(nEntr) && /1987/.test(nEntr),
       'y da las fechas reales de Campbell (1904 · 1987)', 'no da las fechas reales de Campbell');
    ok(/entrevistas imposibles/i.test(nEntr), 'con el género al que se acoge, el de las entrevistas imposibles', 'no declara el género de la pieza');
    ok(/invenci[óo]n de la casa/i.test(nEntr), 'y declara que las palabras atribuidas son invención de la casa', 'no declara como invención lo que se le hace decir');
    ok(/reales y comprobables/i.test(nEntr) && /1949/.test(nEntr), 'mientras las obras y las fechas son reales y comprobables', 'la nota no separa lo inventado de lo comprobable');
    ok(/SOLER SERRANO\./.test(entr.textContent) && /CAMPBELL\./.test(entr.textContent), 'los turnos se firman con el nombre en mayúsculas y punto (sin raya de diálogo)', 'los turnos de la entrevista no se firman al estilo de la casa');
    ok(/Dundes/.test(entr.textContent) && /(se lo concedo|concede|concedo)/i.test(entr.textContent), 'y Campbell CONCEDE la crítica de Dundes dentro de la entrevista', 'la entrevista no incluye la concesión de la crítica de Dundes');
    const nGala = (d.querySelector('#lect-gala .lect-nota') || {}).textContent || '';
    ok(/nunca ocurri/i.test(nGala), 'la conversación de Quintero y Gala también se declara imaginada', 'la conversación no se declara imaginada');
    ok(/\(silencio/.test(d.getElementById('lect-gala').textContent), 'y los silencios de Quintero van escritos como acotación', 'la conversación va sin los silencios');

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    const careo = d.getElementById('lect-debate');
    const tc = careo.textContent.replace(/\s+/g, ' ');
    const nota = (careo.querySelector('.lect-nota') || {}).textContent || '';
    ok(/MODERACI[ÓO]N\./.test(tc), 'los turnos de moderación firman en mayúscula', 'no hay turnos de MODERACIÓN');
    ok(/LA DEFENSA\./.test(tc) && /LA OBJECI[ÓO]N\./.test(tc), 'y los de la defensa y la objeción', 'faltan los papeles de defensa y objeción');
    ok(!/Ejercicio de estilo de la casa/i.test(nota), 'el careo NO lleva la etiqueta del pastiche', 'al careo le pusieron etiqueta de pastiche');
    ok(/palabras inventadas en boca de nadie/i.test(nota), 'y su nota declara que no se le pone palabra a nadie', 'la nota del careo no lo declara');
    ok(/mejor versi[óo]n/i.test(nota), 'y que cada postura va en su mejor versión (regla del acero)', 'la nota no declara la regla del acero');
    ok(/La pregunta en disputa, una sola/.test(tc), '1. la pregunta en disputa', 'falta la pregunta en disputa');
    ok(/Las r[ée]plicas, cruzadas/.test(tc), '4. las réplicas cruzadas', 'faltan las réplicas');
    ok(/El terreno com[úu]n, que casi siempre/.test(tc), '5. el terreno común', 'falta el terreno común');
    ok(/Lo que sigue en disputa/.test(tc), '6. y qué dato lo resolvería', 'el careo no dice qué dato lo resolvería');
    const i1 = tc.indexOf('La pregunta en disputa, una sola');
    const i2 = tc.indexOf('LA DEFENSA.');
    const i3 = tc.indexOf('LA OBJECIÓN.');
    const i4 = tc.indexOf('Las réplicas, cruzadas');
    const i5 = tc.indexOf('El terreno común, que casi siempre');
    const i6 = tc.indexOf('Lo que sigue en disputa');
    ok(i1 >= 0 && i1 < i2 && i2 < i3 && i3 < i4 && i4 < i5 && i5 < i6,
       'y las seis partes van en orden: pregunta, postura A, postura B, réplicas, terreno común y lo que sigue', 'las partes del careo están desordenadas');
    ok(/Reagan/.test(tc) && /2016/.test(tc) && /1,?327/.test(tc), 'la defensa se apoya en Reagan y colegas (2016) con su cifra', 'la defensa no lleva su fuente completa');
    ok(/Le Guin/.test(tc) && /1986/.test(tc), 'y la objeción trae a Le Guin (1986)', 'falta Le Guin (1986)');
    ok(/Alison/.test(tc) && /2019/.test(tc), 'con Alison (2019)', 'falta Alison (2019)');
    ok(/kish[oō]tenketsu/i.test(tc), 'y el kishōtenketsu como ejemplo de forma que el método no puede ver', 'falta el kishōtenketsu en el careo');
    ok(/se concede/i.test(tc) && /concesi[óo]n es sincera/i.test(tc), 'las réplicas conceden de verdad, no de boquilla', 'ninguna réplica concede nada');

      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "hilo").length');
      const totalCat = wa.eval('RUTAS.hilo.etapas');
      ok(construidasCat === 3, 'el catálogo cuenta tres etapas construidas en el Hilo', 'construidas en el catálogo: ' + construidasCat);
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok([...ruta.querySelectorAll('.re-link')].some(a => /La forma de las formas/.test(a.textContent)),
         'la etapa 3 ya es tocable, con el título de la misión', 'la etapa 3 no sale tocable con su título');
      ok([...ruta.querySelectorAll('.re-link')].some(a => /El deseo y el obst[áa]culo/.test(a.textContent)),
         'y la etapa 2 sigue tocable', 'la etapa 2 desapareció del mapa');
      ok(!/Etapa por construir/.test(ruta.textContent) && !ruta.querySelector('.ruta-etapa-futura')?.textContent.match(/forma de las formas/i),
         'y la etapa 3 ya no queda anunciada como «por construir»', 'la etapa 3 sigue anunciada como pendiente además de construida');
    }
    const grupo = [...da.querySelectorAll('.materia-grupo')].find(x => (x.querySelector('.materia-nombre') || {}).textContent === 'Storytelling');
    ok(!!grupo, 'la materia Storytelling tiene su grupo en el mapa de rutas', 'no hay grupo de Storytelling');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="story"]');
    ok(!!chip, 'la materia Storytelling tiene su chip en la portada', 'no hay chip de Storytelling');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      const delStory = wa.eval('MISSIONS.filter(m=>m.materia==="story").length');
      ok(cards.length === delStory, 'la materia muestra sus ' + delStory + ' misiones', 'muestra ' + cards.length + ' de ' + delStory);
      const mia = cards.find(c => /La forma de las formas/.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /📐/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="hilo"&&m.etapa===3).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 3 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
