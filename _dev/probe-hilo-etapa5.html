<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Hilo que Tira, etapa 5</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-hilo-mostrar-contar/mostrar-contar.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 5 de la Ruta del Hilo que Tira (Storytelling): mostrar,
   contar y cuándo cada uno, y por qué «muestra, no cuentes» está mal citada.
   Bancos, laboratorio, los ocho casos, el guion, las seis lecturas con sus
   preguntas dentro, el marcador, la impresión, la ficha, la materia y la
   ruta en el mapa.

   Las reglas propias de la materia que aquí se vigilan con más saña:
     1. NINGUNA HERRAMIENTA SIN AUTOR Y AÑO. Cada herramienta que la etapa
        menciona (Lubbock 1921, James 1907-1909, Chéjov 1886, Booth 1961,
        Le Guin 1998, Gardner 1984, Paivio 1971) va con su año.
     2. LA CITA DE LA LUNA (atribuida a Chéjov) VA SIEMPRE DECLARADA COMO
        NO ESCRITA POR ÉL: es una paráfrasis del siglo XX.
     3. LA CARTA REAL DE CHÉJOV (1886) VA SIEMPRE CON SU FECHA Y EL VIDRIO
        DE BOTELLA (su detalle completo, no solo el nombre).

   La comprobación de herramientas mira las cinco secciones de PROSA
   (Aprende, Estructura, Casos, Guion y Lecturas), no la página entera: los
   bancos pintan rótulos que son fichas de juego (es la trampa 1 de la
   norma 5-nonies).

   El guion largo se busca con su escape de código (u2014), nunca con el
   caracter puesto directo en este archivo: una sonda que lo llevara dentro
   se suspenderia sola, siendo ella misma la primera en incumplir la regla
   que revisa.   */
const RAYA = new RegExp('\\u2014');
const RAYAS_G = new RegExp('\\u2014', 'g');
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda hilo etapa 5'; };
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Hilo que Tira · Etapa 5 de 12/.test(d.body.textContent), 'se presenta como etapa 5 de 12', 'no se presenta como etapa 5 de la ruta');
    const cuerpo = d.body.textContent.replace(/\s+/g, ' ');
    /* Restos del temario de la etapa 4 (de la que se copió el molde) que no
       deberían quedar como TEMA propio. Un cruce de una sola línea hacia la
       etapa 4 (el enlace de Recursos, el recuerdo del arranque en Aprende,
       o «ya vistos en la etapa 4» en la ficha) es legítimo y se espera de
       toda misión de esta ruta, así que «giro de valor», «La Gaviota» y
       «Stanislavski» no se cazan sueltos: lo que no debe quedar es el
       DESARROLLO de esas herramientas (Mamet, Bazin, Goldman, el
       no-acontecimiento, la escena francesa, el plano secuencia como tema
       propio) ni el resto de moldes anteriores. */
    ok(!/Mamet|Bazin|Goldman|no-acontecimiento|escena francesa|plano secuencia|Freytag|Vonnegut|kish[oō]tenketsu|Ar[áa]uz|Bracamonte|Campbell|monomito|Todorov/i.test(cuerpo),
       'sin restos de temario de la etapa 4 ni de otro molde', 'queda temario de otra misión en la página');
    ok(!RAYA.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(RAYAS_G) || []).length + ' guiones largos');
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content;
    ok(/MOSTRAR/.test(banda) && /CH[ÉE]JOV/i.test(banda) && !/LA ESCENA/.test(banda) && !/MCKEE/.test(banda) && !/FORMA DE LAS FORMAS/.test(banda) && !/EL DESEO/.test(banda) && !/LA CADENA/.test(banda),
       'la banda del encabezado es de esta etapa (MOSTRAR y CHÉJOV, sin LA ESCENA ni MCKEE ni otras etapas)', 'la banda dice: ' + banda.slice(0, 70));
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);
    ok(d.querySelectorAll('#timelineTrack .tl-node').length === dentro('timelineData.length'),
       'y la línea de tiempo arrancó con sus ' + dentro('timelineData.length') + ' fechas', 'hitos pintados: ' + d.querySelectorAll('#timelineTrack .tl-node').length);
    ok((d.getElementById('lab-display').textContent || '').trim().length > 40, 'el laboratorio arrancó con una ficha puesta', 'el laboratorio arrancó vacío');

    log('\n── LA REGLA DE ORO: NINGUNA HERRAMIENTA SIN AUTOR Y AÑO ──');
    const prosa5 = ['s-aprende', 's-estructura', 's-casos', 's-guion', 's-lecturas']
      .map(id => (d.getElementById(id) || {}).textContent || '').join(' ').replace(/\s+/g, ' ');
    const bloquesProsa = [...d.querySelectorAll('#s-aprende .card, #s-estructura .card, #s-casos .card, #s-guion .card, #s-lecturas .card')]
      .filter(c => !c.querySelector('#timelineTrack') && !c.querySelector('.type-grid') && !c.querySelector('.stat-bar'));
    let huerfanas = 0, herramientas = 0, ejemplo = '';
    const reHer = /mostrar y contar|dramatizar, dramatizar|el vidrio de (la )?botella|el dial de mostrar y contar|contar es leg[íi]timo|la regla mal usada|la distancia narrativa/gi;
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (reHer.test(txt)) {
        reHer.lastIndex = 0;
        herramientas++;
        if (!/\b(1[5-9]\d\d|19\d\d|20[0-2]\d)\b/.test(txt)) { huerfanas++; if (!ejemplo) ejemplo = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }
    });
    ok(huerfanas === 0, 'toda herramienta que asoma (en ' + herramientas + ' bloque(s)) lleva su año en ese mismo bloque', 'hay ' + huerfanas + ' bloque(s) con herramienta huérfana: ' + ejemplo);
    ok(/Lubbock/.test(prosa5) && /1921/.test(prosa5), 'la distinción mostrar/contar a Lubbock (1921)', 'falta Lubbock (1921)');
    ok(/James/.test(prosa5) && /(1907|1909)/.test(prosa5), 'dramatizar a James (1907-1909)', 'falta James (1907-1909)');
    ok(/Ch[ée]jov/.test(prosa5) && /1886/.test(prosa5), 'el detalle concreto a Chéjov (1886)', 'falta Chéjov (1886)');
    ok(/Booth/.test(prosa5) && /1961/.test(prosa5), 'contar es legítimo a Booth (1961)', 'falta Booth (1961)');
    ok(/Le Guin/.test(prosa5) && /1998/.test(prosa5), 'la regla mal usada a Le Guin (1998)', 'falta Le Guin (1998)');
    ok(/Gardner/.test(prosa5) && /1984/.test(prosa5), 'el dial de la distancia a Gardner (1984)', 'falta Gardner (1984)');
    ok(/Paivio/.test(prosa5) && /1971/.test(prosa5), 'la doble codificación a Paivio (1971)', 'falta Paivio (1971)');
    ok(/ninguna herramienta se cita sin autor|autor, a[ñn]o y l[íi]mite|con su autor y su a[ñn]o|autor y (su )?año/i.test(cuerpo),
       'la regla de oro está escrita a la vista', 'la regla de oro de la ruta no aparece');

    log('\n── LA MALA CITA, DECLARADA A LA VISTA ──');
    let citasLuna = 0, sinAclarar = 0, muestraLuna = '';
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (/luna brilla/i.test(txt) && /vidrio roto/i.test(txt)) {
        citasLuna++;
        if (!/nunca\s+(la\s+)?escrib|no son (sus )?palabras|no est[áa] en ninguna parte|no es de Ch[ée]jov|par[áa]frasis/i.test(txt)) { sinAclarar++; if (!muestraLuna) muestraLuna = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }
    });
    ok(citasLuna >= 1, 'la frase de la luna y el vidrio roto aparece', 'la frase de la luna no aparece en ningún bloque');
    ok(sinAclarar === 0, 'y siempre declarada como NO escrita por Chéjov, en el mismo bloque', 'hay ' + sinAclarar + ' bloque(s) con la cita sin su aclaración: ' + muestraLuna);
    ok(/Aleksandr/.test(cuerpo) && /10 de mayo de 1886/.test(cuerpo), 'la carta real trae su destinatario y su fecha exacta', 'falta el destinatario o la fecha exacta de la carta');

    log('\n── EL CONCEPTO DE LA ETAPA ──');
    ok(/qu[ée] se muestra/i.test(cuerpo) && /qu[ée] se cuenta/i.test(cuerpo) && /el detalle/i.test(cuerpo), 'el dial de mostrar y contar (qué se muestra, qué se cuenta, el detalle)', 'falta el dial de mostrar y contar');
    ok(/el dial de mostrar y contar/i.test(cuerpo), 'y se nombra como herramienta reutilizable', 'no se nombra el dial como herramienta');
    ok(/escena/i.test(cuerpo) && /panorama/i.test(cuerpo), 'la escena y el panorama de Lubbock', 'faltan la escena y el panorama');
    ok(/dramatizar/i.test(cuerpo), 'dramatizar, dramatizar de James', 'falta dramatizar');
    ok(/pendiente/i.test(cuerpo), 'lo que no se comprueba se deja pendiente', 'no se explica qué se hace con lo no comprobado');
    ok(/lempira/i.test(cuerpo) || /L \d/.test(cuerpo), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');
    ok(/doble codificaci[óo]n/i.test(cuerpo), 'la doble codificación, de Paivio', 'falta la doble codificación');
    ok(/efecto de concreci[óo]n/i.test(cuerpo) && /Sadoski/.test(cuerpo), 'el efecto de concreción, de Sadoski, Goetz y Fritz', 'falta el efecto de concreción');

    log('\n── LOS OCHO CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos').textContent.replace(/\s+/g, ' ');
    ok((casos.match(/Caso \d/g) || []).length === 8, 'los ocho casos están', 'casos: ' + (casos.match(/Caso \d/g) || []).length);
    ok(/M\.E\.T\.A\.S/.test(casos), 'y salen de este proyecto', 'los casos no hablan del proyecto');
    ok(/L \d|lempira/i.test(casos), 'con sus cifras en lempiras', 'los casos van sin lempiras');
    ok(/qu[ée] se muestra/i.test(casos) && /qu[ée] se cuenta/i.test(casos), 'cada caso aplica el dial de mostrar y contar', 'los casos no aplican el dial');
    ok(/la pregunta que decide/i.test(casos) && /la condici[óo]n/i.test(casos), 'cada caso termina en la pregunta que decide y su condición', 'los casos no cierran como manda la norma 3');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const g = d.getElementById('s-guion').textContent.replace(/\s+/g, ' ');
    ok((g.match(/Escena \d/g) || []).length === 7, 'las siete escenas', 'escenas: ' + (g.match(/Escena \d/g) || []).length);
    ok(/VOZ/.test(g) && /IMAGEN:/.test(g) && /TEXTO EN PANTALLA:/.test(g), 'cada escena lleva VOZ, IMAGEN y TEXTO', 'faltan las tres pistas');
    ok(/gancho en fr[íi]o/i.test(g), 'el gancho en frío', 'falta el gancho');
    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');
    ok(/Mostrar, contar y cu[áa]ndo cada uno/i.test(g) && /Ruta del Hilo que Tira/.test(g), 'y el cierre nombra la misión', 'el cierre no nombra la misión');
    ok(/luna brilla/i.test(g) && /vidrio roto/i.test(g) && /1886/.test(g), 'y el guion lleva su propio ejemplo fechado: la frase mal atribuida y el año 1886', 'el guion no lleva su propio ejemplo fechado');

    log('\n── LAS SEIS LECTURAS (normas 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    const tl = lect.textContent.replace(/\s+/g, ' ');
    const claves = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
    ok(claves.every(k => !!d.getElementById('lect-' + k)), 'las seis tarjetas están, con sus ids',
       'faltan: ' + claves.filter(k => !d.getElementById('lect-' + k)).join(', '));
    ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'y no hay ninguna de más',
       'tarjetas: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
    ok(claves.every(k => !!d.querySelector('#lect-' + k + ' .lect-nota')), 'cada una con su nota de estatus', 'alguna tarjeta va sin lect-nota');
    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
       'y avisa de las preguntas de cada lectura y del plegado', 'la entrada no explica las preguntas ni el plegado');
    ok(/ejercicios? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl),
       'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
    ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis en el mismo saco');
    ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
    ok(/papeles/i.test(tl) && /no personas/i.test(tl), 'y dice que el careo firma con papeles', 'la etiqueta no dice cómo firma sus turnos el careo');
    ok(/nunca ocurrieron/i.test(tl), 'y que los encuentros de las entrevistas nunca ocurrieron', 'falta la declaración de ficción');
    ok(/Lubbock/.test(tl) && /1921/.test(tl), 'la sección repite el aviso de la materia con su ejemplo', 'la sección de lecturas no repite el aviso de la materia');
    ok(/La luna que Ch[ée]jov no escribi[óo]/.test(tl), 'el cuento a la manera de Borges', 'falta el cuento');
    ok(/Toribio/.test(tl) && /Pantoja/.test(tl), 'el capítulo cervantino, con sus personajes de venta', 'falta el capítulo');
    ok(/La especie que confunde la luna con el vidrio/.test(tl), 'el ensayo a la manera de Harari', 'falta el ensayo');
    ok(/Soler Serrano/.test(tl) && /A fondo/.test(tl), 'la entrevista, con las señas reales del entrevistador', 'la entrevista no declara quién es Soler Serrano');
    ok(/Quintero/.test(tl) && /Delibes/.test(tl) && /Loco de la Colina/i.test(tl), 'la conversación del Loco de la Colina', 'falta la conversación');

    log('\n── LA ENTREVISTA IMAGINADA, Y SU CUIDADO PROPIO ──');
    const entr = d.getElementById('lect-entrevista');
    const nEntr = (entr.querySelector('.lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nEntr), 'la entrevista se declara IMAGINADA, en mayúsculas y a la vista', 'la entrevista no se declara imaginada');
    ok(/nunca ocurri/i.test(nEntr) && /1860/.test(nEntr) && /1904/.test(nEntr),
       'y da las fechas reales de Chéjov (1860 · 1904)', 'no da las fechas reales de Chéjov');
    ok(/entrevistas imposibles/i.test(nEntr), 'con el género al que se acoge, el de las entrevistas imposibles', 'no declara el género de la pieza');
    ok(/invenci[óo]n de la casa/i.test(nEntr), 'y declara que las palabras atribuidas son invención de la casa', 'no declara como invención lo que se le hace decir');
    ok(/reales y comprobables/i.test(nEntr) && /1886/.test(nEntr), 'mientras las obras y las fechas son reales y comprobables', 'la nota no separa lo inventado de lo comprobable');
    ok(/SOLER SERRANO\./.test(entr.textContent) && /CH[ÉE]JOV\./.test(entr.textContent), 'los turnos se firman con el nombre en mayúsculas y punto (sin raya de diálogo)', 'los turnos de la entrevista no se firman al estilo de la casa');
    ok(/nunca\s+(la\s+)?escrib|no son (sus )?palabras/i.test(entr.textContent) && /1886/.test(entr.textContent), 'y Chéjov CORRIGE el mito dentro de la entrevista, con la fecha real de su carta', 'la entrevista no incluye la autocorrección del mito');
    const nGala = (d.querySelector('#lect-gala .lect-nota') || {}).textContent || '';
    ok(/nunca ocurri/i.test(nGala), 'la conversación de Quintero y Delibes también se declara imaginada', 'la conversación no se declara imaginada');
    ok(/\(silencio/.test(d.getElementById('lect-gala').textContent), 'y los silencios de Quintero van escritos como acotación', 'la conversación va sin los silencios');
    ok(d.getElementById('lect-gala').dataset.voz === 'Quintero y Delibes' || /data-voz="Quintero y Delibes"/.test(d.getElementById('lect-gala').outerHTML),
       'y la tarjeta declara su voz propia (Quintero y Delibes) para los bancos', 'falta el data-voz de Quintero y Delibes en la tarjeta');

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    const careo = d.getElementById('lect-debate');
    const tc = careo.textContent.replace(/\s+/g, ' ');
    const nota = (careo.querySelector('.lect-nota') || {}).textContent || '';
    ok(/MODERACI[ÓO]N\./.test(tc), 'los turnos de moderación firman en mayúscula', 'no hay turnos de MODERACIÓN');
    ok(/LA DEFENSA\./.test(tc) && /LA OBJECI[ÓO]N\./.test(tc), 'y los de la defensa y la objeción', 'faltan los papeles de defensa y objeción');
    ok(!/Ejercicio de estilo de la casa/i.test(nota), 'el careo NO lleva la etiqueta del pastiche', 'al careo le pusieron etiqueta de pastiche');
    ok(/palabras inventadas en boca de nadie/i.test(nota), 'y su nota declara que no se le pone palabra a nadie', 'la nota del careo no lo declara');
    ok(/mejor versi[óo]n/i.test(nota), 'y que cada postura va en su mejor versión (regla del acero)', 'la nota no declara la regla del acero');
    ok(/La pregunta en disputa, una sola/.test(tc), '1. la pregunta en disputa', 'falta la pregunta en disputa');
    ok(/Las r[ée]plicas, cruzadas/.test(tc), '4. las réplicas cruzadas', 'faltan las réplicas');
    ok(/El terreno com[úu]n, que casi siempre/.test(tc), '5. el terreno común', 'falta el terreno común');
    ok(/Lo que sigue en disputa/.test(tc), '6. y qué dato lo resolvería', 'el careo no dice qué dato lo resolvería');
    const i1 = tc.indexOf('La pregunta en disputa, una sola');
    const i2 = tc.indexOf('LA DEFENSA.');
    const i3 = tc.indexOf('LA OBJECIÓN.');
    const i4 = tc.indexOf('Las réplicas, cruzadas');
    const i5 = tc.indexOf('El terreno común, que casi siempre');
    const i6 = tc.indexOf('Lo que sigue en disputa');
    ok(i1 >= 0 && i1 < i2 && i2 < i3 && i3 < i4 && i4 < i5 && i5 < i6,
       'y las seis partes van en orden: pregunta, postura A, postura B, réplicas, terreno común y lo que sigue', 'las partes del careo están desordenadas');
    ok(/Lubbock/.test(tc) && /1921/.test(tc) && /James/.test(tc) && /(1907|1909)/.test(tc), 'la pregunta trae el linaje real, Lubbock (1921) sobre James (1907-1909)', 'falta el linaje real en la pregunta del careo');
    ok(/Booth/.test(tc) && /1961/.test(tc), 'la objeción se apoya en Booth (1961)', 'falta Booth (1961) en el careo');
    ok(/Le Guin/.test(tc) && /1998/.test(tc), 'y en Le Guin (1998)', 'falta Le Guin (1998) en el careo');
    ok(/Paivio/.test(tc) && /1971/.test(tc), 'la defensa se apoya en Paivio (1971)', 'falta Paivio (1971) en el careo');
    ok(/se concede/i.test(tc), 'las réplicas conceden de verdad, no de boquilla', 'ninguna réplica concede nada');
    ok(!RAYA.test(tc), 'y el careo va sin guiones largos, tampoco en los turnos', 'el careo trae guiones largos');

    log('\n── LOS TRES BANCOS DE LAS LECTURAS ──');
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 de completar', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 de análisis complejo', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q=>q.o.length===4)'), 'y las 30 de comprensión traen sus cuatro opciones', 'alguna de comprensión no tiene cuatro opciones');

    ok(repisa && repisa.querySelectorAll('.re-card').length === w.RECURSOS_ENLACES.enlaces.length,
       'y pinta sus ' + w.RECURSOS_ENLACES.enlaces.length + ' tarjetas', 'la repisa no pinta todas sus tarjetas');
    ok(repisa && repisa.querySelectorAll('[data-re-asa]').length === w.RECURSOS_ENLACES.enlaces.length,
       'cada una con su asa para moverla', 'alguna tarjeta se quedó sin asa');
    /* La etiqueta de estatus no es opcional: es la regla de oro de esta
       ruta aplicada a lo que hizo una máquina. */
    ok(repisa && /repaso/.test(repisa.textContent) && /máquina/.test(repisa.textContent),
       'la repisa dice a la vista que eso lo hizo una máquina y es material de repaso', 'la repisa cuelga material de máquina sin su etiqueta');
    ok([...(repisa ? repisa.querySelectorAll('a.re-card') : [])].every(a => /^https?:\/\//.test(a.getAttribute('href') || '')),
       'las tarjetas que enlazan lo hacen solo por http o https', 'hay una tarjeta con un enlace que no es http');
    const fichaP = [...d.querySelectorAll('#s-recursos p')].find(x => /Ficha de estudio imprimible/.test(x.textContent));
    ok(!!repisa && !!fichaP && (repisa.compareDocumentPosition(fichaP) & Node.DOCUMENT_POSITION_FOLLOWING) > 0,
       'y va la primera de Recursos, antes de la ficha', 'la repisa no va primero');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => (c.querySelector('.ruta-nombre') || {}).textContent === 'Ruta del Hilo que Tira');
    ok(!!ruta, 'la Ruta del Hilo que Tira está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(/Fundamentos del relato/.test(ruta.textContent), 'con su dominio a la vista (Fundamentos del relato)', 'la tarjeta no dice su dominio');
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "hilo").length');
      const totalCat = wa.eval('RUTAS.hilo.etapas');
      /* La cuenta sale del CATÁLOGO, no escrita a mano. Escrita a
         mano («construidasCat === 5») esta línea suspendía sola en
         cuanto la ruta crecía, sin que hubiera nada roto: es la
         lección de la Casa Cerrada, y la arrastraban las diez sondas
         del Hilo a la vez. Lo que hay que comprobar es que ESTA
         etapa conste construida, no cuántas había el día que se
         escribió la sonda. */
      ok(wa.eval('MISSIONS.some(m => m.ruta === "hilo" && m.etapa === 5)'),
         'el catálogo trae construida la etapa 5 (de ' + construidasCat + ' del Hilo)', 'la etapa 5 no consta construida en el catálogo');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok([...ruta.querySelectorAll('.re-link')].some(a => /Mostrar, contar/.test(a.textContent)),
         'la etapa 5 ya es tocable, con el título de la misión', 'la etapa 5 no sale tocable con su título');
      ok([...ruta.querySelectorAll('.re-link')].some(a => /La escena/.test(a.textContent)),
         'y la etapa 4 sigue tocable', 'la etapa 4 desapareció del mapa');
      ok(!/Etapa por construir/.test(ruta.textContent) && !ruta.querySelector('.ruta-etapa-futura')?.textContent.match(/mostrar,? contar/i),
         'y la etapa 5 ya no queda anunciada como «por construir»', 'la etapa 5 sigue anunciada como pendiente además de construida');
    }
    const grupo = [...da.querySelectorAll('.materia-grupo')].find(x => (x.querySelector('.materia-nombre') || {}).textContent === 'Storytelling');
    ok(!!grupo, 'la materia Storytelling tiene su grupo en el mapa de rutas', 'no hay grupo de Storytelling');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="story"]');
    ok(!!chip, 'la materia Storytelling tiene su chip en la portada', 'no hay chip de Storytelling');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      const delStory = wa.eval('MISSIONS.filter(m=>m.materia==="story").length');
      ok(cards.length === delStory, 'la materia muestra sus ' + delStory + ' misiones', 'muestra ' + cards.length + ' de ' + delStory);
      const mia = cards.find(c => /Mostrar, contar/.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /🪞/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="hilo"&&m.etapa===5).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 5 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
