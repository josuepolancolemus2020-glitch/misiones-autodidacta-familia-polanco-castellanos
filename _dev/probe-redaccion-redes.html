<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Redacción: 📣 piezas para redes</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:390px;height:700px;border:0;background:#fff;float:right}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Sonda de 📣 Redes (js/tools/redaccion-redes.js), ordenada por gravedad:

     1. que la cuenta de X sea PONDERADA (un enlace 23, un emoji 2, una
        tilde 1): contar a secas aprobaría un post que X rechaza;
     2. que un hilo salga en partes de 280 SIN cortar frases y sin perder
        ni una palabra, con la última parte llevando las fuentes;
     3. que las fuentes de la nota VIAJEN con la pieza y salgan donde cada
        red las admite (al pie en Facebook, aparte en LinkedIn y en X), y
        que una pendiente salga DELATADA;
     4. que nada del texto ni de las fuentes llegue al HTML: veneno en un
        texto y en una fuente se tiene que ver como texto;
     5. que sin la tabla (42P01) la herramienta funcione entera y lo DIGA,
        y que con la tabla la subida llegue como upsert con la pieza dentro;
     6. que retirar sea de dos toques en el mismo sitio y sin confirm(),
        y que se pueda devolver.

   Como las demás de esta familia: ejecuta el index.html de verdad con
   una base de mentira a nivel de fetch, pulsa los botones de verdad, y
   de cada prueba mira lo que quedó (en el DOM, en localStorage o en lo
   que viajó a la base), no lo que la pantalla dice que pasó. */

const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));
async function hasta(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 4000)) { if (fn()) return true; await esperar(50); }
  return fn();
}
function termina() {
  const v = fallos ? 'SUSPENDE' : 'APRUEBA';
  log(`\nRESULTADO: ${v}${fallos ? ` (${fallos} fallo${fallos === 1 ? '' : 's'})` : ''}`);
  document.title = `${v} · redacción: redes`;
}

(async function corre(){
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await esperar(1200);
  const w = f.contentWindow, d = f.contentWindow.document;

  /* La base de mentira. `modo` decide si la tabla de redes existe. Apunta
     cada llamada para poder afirmar «este upsert llevó la pieza dentro». */
  const llamadas = [];
  let modo = 'sin-tabla';
  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url);
    const metodo = (init && init.method) || 'GET';
    const cabs = new Headers((init && init.headers) || {});
    llamadas.push({ ruta: u.pathname + u.search, metodo, cuerpo: (init && init.body) || null, prefer: cabs.get('Prefer') || '' });
    if (u.pathname.endsWith('/redaccion_redes')) {
      if (modo === 'sin-tabla') {
        return new Response(JSON.stringify({ code: '42P01', message: 'relation "public.redaccion_redes" does not exist' }),
          { status: 404, headers: { 'Content-Type': 'application/json' } });
      }
      if (metodo === 'POST') return new Response('[]', { status: 201, headers: { 'Content-Type': 'application/json' } });
      return new Response('[]', { status: 200, headers: { 'Content-Type': 'application/json' } });
    }
    const unSolo = (cabs.get('Accept') || '').includes('pgrst.object');
    return new Response(unSolo ? 'null' : '[]', { status: 200, headers: { 'Content-Type': 'application/json' } });
  };
  let confirms = 0;
  w.confirm = () => { confirms++; return true; };
  let copiado = '';
  try { Object.defineProperty(w.navigator, 'clipboard', { value: { writeText: async t => { copiado = t; } }, configurable: true }); } catch (e) {}
  try { w.localStorage.removeItem('faro_redaccion_redes_v1'); } catch (e) {}

  if (w.eval('typeof initRedaccion') !== 'function' || w.eval('typeof rrdRender') !== 'function') {
    log('✘ index.html no cargó js/tools/redaccion.js o js/tools/redaccion-redes.js');
    fallos++; termina(); return;
  }

  d.getElementById('login-screen').style.display = 'none';
  d.getElementById('app-container').style.display = '';
  w.eval("switchView('view-redaccion')");
  await esperar(500);
  // La nota de prueba se siembra con una función porque hay que volver a
  // sembrarla más abajo: el botón de volver de la pieza pasa por
  // switchView('view-redaccion'), que vuelve a correr initRedaccion(), y con
  // la nube de mentira eso deja _redNotas en cero.
  const sembrarNota = () => w.eval(`
    _redEdiciones = [{ id: 1, numero: 1, titulo: 'Nº 01 · prueba', fecha_cierre: null, archivada: false }];
    _redNotas = [
      { id: 1, edicion_id: 1, autor: 'josue', titulo: 'La bandera entre una batalla cromática',
        seccion: 'ACTUALIDAD', tipo: 'Artículo', estado: 'revision',
        entradilla: 'Una entradilla corta que presenta el tema.',
        cuerpo: 'Primer párrafo con una idea ajena<sup class="red-cita" contenteditable="false" data-ref="Bueno, G. (1972). Ensayos materialistas. Taurus.">[1]</sup> y sigue.<br><br>Segundo párrafo con otra idea sin fuente todavía<sup class="red-cita red-cita-pendiente" contenteditable="false">[2?]</sup>. Y una frase más para que haya cuerpo. Y otra frase larga que cuenta algo del acontecer educativo del país con detalle suficiente para pasar de una parte.<br><br>Tercer párrafo. Termina aquí.',
        en_portada: false, eliminada: false, eliminada_at: null, actualizado_at: '2026-09-05T10:00:00Z' },
    ];
    _redPapelera = true; _redLoaded = true; _redEdicion = 1;
    redRender();
  `);
  sembrarNota();
  await esperar(200);
  const texto = id => (d.getElementById(id) || {}).textContent || '';
  const g = expr => w.eval(expr);   // las variables `let` del módulo no cuelgan de window

  log('── 1. La cuenta de X es ponderada ──');
  const lx = s => w.rrdLargoX(s);
  ok(lx('hola') === 4, '«hola» son 4', '«hola» dio ' + lx('hola'));
  ok(lx('ñandú á') === 7, 'las tildes y la eñe valen 1 («ñandú á» = 7)', '«ñandú á» dio ' + lx('ñandú á'));
  ok(lx('https://ejemplo.com/una/ruta/muy/larga/que/sigue/y/sigue/mas') === 23,
     'un enlace vale 23 pase lo que pase', 'el enlace dio ' + lx('https://ejemplo.com/una/ruta/muy/larga/que/sigue/y/sigue/mas'));
  ok(lx('😀') === 2, 'un emoji vale 2', '«😀» dio ' + lx('😀'));
  ok(lx('a 😀 b') === 6, '«a 😀 b» son 6', '«a 😀 b» dio ' + lx('a 😀 b'));
  ok(lx('mira ejemplo.com/x ya') === 4 + 1 + 23 + 1 + 2, 'un dominio pelado también cobra 23', 'el dominio pelado dio ' + lx('mira ejemplo.com/x ya'));

  log('── 2. Partir en hilo: partes de 280, sin cortar frases ni perder palabras ──');
  const largo = Array.from({ length: 9 }, (_, i) =>
    `Esta es la frase número ${i + 1} del texto largo, que cuenta una cosa con bastante detalle para que ocupe sitio de verdad. ` +
    `Y aquí viene una segunda oración de la frase ${i + 1}, también con su punto final.`).join(' ');
  const partes = w.rrdPartirHilo(largo, 280, w.rrdLargoX, 7);
  ok(partes.length >= 4, `sale en ${partes.length} partes`, 'salió en una sola parte');
  ok(partes.every(p => w.rrdLargoX(p) <= 273), 'todas caben en 280 con sitio para el « n/N»',
     'alguna parte pasa: ' + partes.map(p => w.rrdLargoX(p)).join(', '));
  ok(partes.every(p => /[.!?…]["»)]?$/.test(p)), 'ninguna parte corta una frase por la mitad',
     'hay partes cortadas: ' + partes.filter(p => !/[.!?…]["»)]?$/.test(p)).map(p => p.slice(-30)).join(' | '));
  const norm = s => s.replace(/\s+/g, ' ').trim();
  ok(norm(partes.join(' ')) === norm(largo), 'no se pierde ni una palabra', 'el texto repartido no es el original');
  const num = w.rrdNumerar(['a', 'b', 'c']);
  ok(num[0] === 'a 1/3' && num[2] === 'c 3/3', 'la numeración va « n/N» al final', 'numeró: ' + JSON.stringify(num));

  log('── 3. Sin la tabla: funciona entera y lo DICE ──');
  await hasta(() => g('_rrdNube') !== 'mirando', 5000);
  ok(g('_rrdNube') === 'sin-tabla', 'con 42P01 sabe que falta el SQL', 'el estado de la nube es ' + g('_rrdNube'));
  const chip = d.querySelector('.red-ed-chip.rrd-chip');
  ok(!!chip, 'el chip 📣 Redes está en la fila de ediciones', 'no hay chip 📣 Redes');
  chip && chip.click();
  await esperar(150);
  ok(g('_redEdicion') === 'redes', 'tocarlo abre el espacio de redes', 'no abrió: _redEdicion = ' + g('_redEdicion'));
  ok(/Solo en este aparato.*redaccion_redes\.sql/.test(texto('red-list')),
     'y la barra dice «Solo en este aparato: falta correr redaccion_redes.sql»', 'la barra no nombra el archivo: ' + texto('red-list').slice(0, 120));
  ok(d.getElementById('red-rrd-nueva-btn').style.display !== 'none' && d.getElementById('red-nueva-nota-btn').style.display === 'none',
     'la fila de acciones enseña «Nueva pieza» y esconde «Nueva nota»', 'las acciones no cambiaron');
  ok(texto('red-ed-titulo').includes('Redes'), 'la cabecera dice 📣 Redes', 'la cabecera dice: ' + texto('red-ed-titulo'));

  log('── 4. De la nota a un hilo en X, con sus citas ──');
  w.eval('redOpenEditor(1)');
  await esperar(150);
  const btnRedes = d.getElementById('red-e-redes-btn');
  ok(!!btnRedes, 'el editor de la nota tiene «Llevar a redes»', 'no está el botón');
  btnRedes.click();
  await esperar(250);
  const ov = d.getElementById('rrd-elegir-overlay');
  ok(ov.style.display === 'flex', 'se abre la hoja «¿Para qué red?»', 'la hoja no se abrió');
  const opciones = [...d.querySelectorAll('#rrd-elegir-lista .rrd-elegir-item')];
  ok(opciones.length === 7, `trae ${opciones.length} opciones`, 'trae ' + opciones.length + ' opciones');
  const hiloBtn = opciones.find(b => /hilo en X/i.test(b.textContent));
  hiloBtn && hiloBtn.click();
  await esperar(250);
  ok(d.getElementById('view-redaccion-pieza').classList.contains('active'), 'abre el editor de la pieza', 'no abrió el editor de la pieza');
  let p = w.rrdPieza(g('_rrdId'));
  ok(p && p.red === 'x' && p.clase === 'hilo' && p.nota_id === 1, 'la pieza es un hilo de X colgado de la nota 1',
     'la pieza es: ' + JSON.stringify(p && { red: p.red, clase: p.clase, nota_id: p.nota_id }));
  ok(p && p.fuentes.length === 2 && p.fuentes[0].ref.includes('Bueno') && !p.fuentes[1].ref,
     'trae las dos citas de la nota, una con referencia y una pendiente', 'las fuentes son: ' + JSON.stringify(p && p.fuentes));
  ok(p && p.texto.includes('La bandera') && p.texto.includes('Tercer párrafo'), 'el texto trae título y cuerpo', 'el texto no trae la nota');
  let salida = w.rrdSalida(p);
  ok(salida.partes && salida.partes.length >= 3, `el hilo sale en ${salida.partes && salida.partes.length} partes`, 'el hilo no sale en partes');
  ok(salida.partes.every(x => w.rrdLargoX(x) <= 280), 'todas las partes, numeradas, caben en 280',
     'pasa alguna: ' + salida.partes.map(x => w.rrdLargoX(x)).join(', '));
  const ultima = salida.partes[salida.partes.length - 1];
  ok(/📚 Fuentes/.test(salida.partes.slice(-2).join('\n')), 'las fuentes van en la última parte', 'la última parte es: ' + ultima.slice(0, 80));
  ok(/PENDIENTE/.test(salida.partes.join('\n')), 'la cita sin referencia sale DELATADA', 'la pendiente no sale delatada');
  ok(/ 1\/\d+$/.test(salida.partes[0]) && new RegExp(' ' + salida.partes.length + '/' + salida.partes.length + '$').test(ultima),
     'y llevan su n/N', 'no llevan numeración: ' + salida.partes[0].slice(-10));
  ok(salida.pendientes === 1 && texto('rrd-e-avisos').includes('sin referencia'), 'el editor avisa de la fuente pendiente', 'no avisa: ' + texto('rrd-e-avisos'));
  const cajas = d.querySelectorAll('#rrd-e-partes .rrd-parte');
  ok(cajas.length === salida.partes.length, 'la pantalla pinta una caja por parte, con su cuenta', `pinta ${cajas.length} cajas para ${salida.partes.length} partes`);
  ok(d.getElementById('rrd-e-nota').textContent.includes('La bandera'), 'y dice de qué nota sale', 'no nombra la nota');

  log('── 5. De la nota a un post de Facebook: las fuentes al pie y el corte de «Ver más» ──');
  w.eval('redOpenEditor(1)');
  await esperar(120);
  d.getElementById('red-e-redes-btn').click();
  await esperar(200);
  ok(texto('rrd-elegir-lista').includes('ya tiene 1 pieza'), 'la hoja avisa de la pieza que esta nota ya tiene', 'no avisa de la pieza existente: ' + texto('rrd-elegir-lista').slice(-80));
  const fbBtn = [...d.querySelectorAll('#rrd-elegir-lista .rrd-elegir-item')].find(b => /Facebook/.test(b.textContent));
  fbBtn && fbBtn.click();
  await esperar(250);
  p = w.rrdPieza(g('_rrdId'));
  salida = w.rrdSalida(p);
  ok(p.red === 'facebook' && !salida.partes && /📚 Fuentes\n\[1\] Bueno/.test(salida.principal) && /\[2\] ⚠️ PENDIENTE/.test(salida.principal),
     'las fuentes salen al pie del post, numeradas, con la pendiente delatada', 'la salida es: ' + salida.principal.slice(-160));
  ok(salida.aparte === null, 'y nada va aparte', 'hay un bloque aparte que no toca');
  const visto = d.querySelector('#rrd-e-gancho .rrd-gancho-visto');
  ok(visto && [...visto.textContent].length === 125, 'se enseñan los 125 caracteres que se ven antes de «Ver más»',
     'el gancho enseña ' + (visto ? [...visto.textContent].length : 'nada'));
  ok(/\d+ \/ 63206 caracteres/.test(texto('rrd-e-contador')), 'el contador cuenta contra 63.206', 'el contador dice: ' + texto('rrd-e-contador'));
  ok(texto('rrd-e-salida').includes('Lo que se pega en Facebook'), 'y la salida se enseña tal como se pega', 'no hay salida');

  log('── 6. LinkedIn: el enlace y las fuentes van al primer comentario; un enlace malo no entra ──');
  const pl = w.rrdNueva('linkedin', 'post', { texto: 'Un post profesional.', fuentes: [{ ref: 'Forster, E. M. (1927). Aspects of the Novel.' }] });
  w.rrdAbrir(pl.id);
  await esperar(150);
  const enl = d.getElementById('rrd-e-enlace');
  enl.value = 'www.policastsapien.com/nota';
  enl.dispatchEvent(new w.Event('input', { bubbles: true }));
  await esperar(300);
  ok(texto('rrd-e-enlace-nota').includes('Se entiende https://www.policastsapien.com/nota'), 'un dominio sin https se entiende y se dice cómo', 'la nota dice: ' + texto('rrd-e-enlace-nota'));
  salida = w.rrdSalida(w.rrdPieza(pl.id));
  ok(salida.aparte && salida.aparte.titulo === 'Para el primer comentario' && salida.aparte.texto.includes('https://www.policastsapien.com/nota') && salida.aparte.texto.includes('Forster'),
     'el enlace y la fuente salen aparte, para el primer comentario', 'aparte: ' + JSON.stringify(salida.aparte));
  ok(!salida.principal.includes('policastsapien.com') && !salida.principal.includes('Forster'), 'y NO dentro del post', 'el post lleva el enlace o la fuente dentro');
  ok(texto('rrd-e-salida').includes('primer comentario') && texto('rrd-e-salida').includes('baja el alcance'), 'la pantalla explica por qué', 'la pantalla no lo explica');
  enl.value = 'javascript:alert(1)';
  enl.dispatchEvent(new w.Event('input', { bubbles: true }));
  await esperar(300);
  ok(w.rrdPieza(pl.id).enlace === '' && texto('rrd-e-enlace-nota').includes('No parece una dirección'),
     'un javascript: no se guarda y la pantalla dice qué poner', 'guardó: ' + JSON.stringify(w.rrdPieza(pl.id).enlace));
  ok(w.rrdEnlace('java\tscript:alert(1)') === '' && w.rrdEnlace('JavaScript:alert(1)') === '' && w.rrdEnlace('https://a.com/"x') === '',
     'ni con tabulador ni en mayúsculas ni con comillas', 'un enlace envenenado pasó el cedazo');

  log('── 7. Un post de X que no cabe: rojo, propone el hilo, y ✂️ lo parte ──');
  const px = w.rrdNueva('x', 'post', { texto: largo });
  w.rrdAbrir(px.id);
  await esperar(200);
  ok(d.getElementById('rrd-e-contador').className.includes('rrd-cont-rojo'), 'el contador va en rojo', 'el contador no está en rojo: ' + d.getElementById('rrd-e-contador').className);
  ok(/Sobran \d+ \(tope 280\)/.test(texto('rrd-e-avisos')) && /Hilo/.test(texto('rrd-e-avisos')), 'dice cuánto sobra y propone el hilo', 'el aviso dice: ' + texto('rrd-e-avisos'));
  const partir = d.getElementById('rrd-e-partir-btn');
  ok(partir.style.display !== 'none', 'aparece ✂️ Partir en hilo', 'no aparece el botón de partir');
  partir.click();
  await esperar(300);
  const pxx = w.rrdPieza(px.id);
  ok(pxx.clase === 'hilo', 'al partir pasa a 🧵 Hilo', 'la clase sigue siendo ' + pxx.clase);
  ok(pxx.texto.includes('\n\n---\n\n'), 'y las partes van separadas por ---', 'no hay separadores');
  salida = w.rrdSalida(pxx);
  ok(salida.partes.every(x => w.rrdLargoX(x) <= 280), 'todas caben en 280', 'pasa alguna: ' + salida.partes.map(x => w.rrdLargoX(x)).join(', '));

  log('── 8. Un guion se mide en segundos hablados ──');
  const guion400 = Array.from({ length: 400 }, (_, i) => 'palabra' + i).join(' ');
  const pg = w.rrdNueva('tiktok', 'guion', { texto: guion400 });
  let an = w.rrdAnalisis(pg);
  ok(an.segundos === 160 && an.estado === 'amarillo', '400 palabras son ≈2:40 y en TikTok avisa en ámbar (pasa del minuto)', `dio ${an.segundos} s y estado ${an.estado}`);
  pg.texto = Array.from({ length: 1600 }, (_, i) => 'p' + i).join(' ');
  an = w.rrdAnalisis(pg);
  ok(an.estado === 'rojo' && /tope de 10:00/.test(an.avisos.join(' ')), '1.600 palabras pasan del tope de 10:00 y va en rojo', 'dio ' + an.estado + ' · ' + an.avisos.join(' | '));
  const py = w.rrdNueva('youtube', 'guion', { texto: guion400 });
  an = w.rrdAnalisis(py);
  ok(an.estado === 'ok', 'en YouTube (largo) no hay tope', 'en YouTube dio ' + an.estado);
  py.opciones = { shorts: true };
  an = w.rrdAnalisis(py);
  ok(an.estado === 'ok' && w.rrdAnalisis(Object.assign({}, py, { texto: Array.from({ length: 500 }, () => 'x').join(' ') })).estado === 'rojo',
     'como Short, 2:40 cabe y 3:20 no', 'el tope del Short no muerde');
  ok(w.rrdSalida(pg).aparte === null, 'un guion sin fuentes no saca nada aparte', 'sacó algo aparte sin fuentes');
  pg.fuentes = [{ ref: 'Una fuente' }];
  ok(/rótulos/.test((w.rrdSalida(pg).aparte || {}).titulo || ''), 'con fuentes, salen aparte para los rótulos', 'no salen para los rótulos');

  log('── 9. Veneno en el texto y en una fuente: se ve como texto ──');
  // El cierre de script va partido: escrito entero cerraría ESTE script.
  const veneno = '<img src=x onerror="window.top.__x=1"> "><scr' + 'ipt>window.top.__y=1</scr' + 'ipt>';
  const pv = w.rrdNueva('facebook', 'post', { texto: 'Hola ' + veneno, titulo: 'T ' + veneno, fuentes: [{ ref: 'F ' + veneno }] });
  w.rrdAbrir(pv.id);
  await esperar(200);
  ok(!d.querySelector('#view-redaccion-pieza img') && !d.querySelector('#view-redaccion-pieza script'),
     'el editor no fabricó ni un <img> ni un <script>', 'el veneno entró como HTML en el editor');
  ok(d.querySelector('#rrd-e-salida .rrd-salida-texto').textContent.includes('<img src=x'), 'la salida lo enseña como texto', 'la salida no enseña el veneno como texto');
  w.eval("_redEdicion = 'redes'; switchView('view-redaccion'); redRender();");
  await esperar(200);
  ok(!d.querySelector('#red-list img') && !d.querySelector('#red-list script'), 'la lista tampoco', 'el veneno entró como HTML en la lista');
  ok([...d.querySelectorAll('#red-list .red-nota-titulo')].some(e => e.textContent.includes('<img src=x')), 'y el rótulo envenenado se lee tal cual', 'el rótulo no se ve');
  ok(!window.__x && !window.__y, 'nada corrió', 'ALGO CORRIÓ');

  log('── 10. Lo guardado vive en el aparato ──');
  let local = {};
  try { local = JSON.parse(w.localStorage.getItem('faro_redaccion_redes_v1')) || {}; } catch (e) {}
  ok(Array.isArray(local.piezas) && local.piezas.length >= 6, `localStorage guarda las ${local.piezas && local.piezas.length} piezas`, 'no hay piezas en localStorage');
  ok(local.piezas.some(x => x.nota_id === 1 && x.clase === 'hilo'), 'con el hilo de la nota dentro', 'el hilo no está en el aparato');
  ok(llamadas.filter(c => c.ruta.includes('redaccion_redes') && c.metodo === 'POST').length === 0,
     'y sin la tabla no se intentó ni una subida', 'se intentó subir sin tabla');

  log('── 11. Con la tabla: la subida llega como upsert con la pieza dentro ──');
  modo = 'puesta';
  await w.rrdInit();
  await esperar(200);
  ok(g('_rrdNube') === 'puesta', 'la nube pasa a «puesta»', 'la nube es ' + g('_rrdNube'));
  const subidas = llamadas.filter(c => c.ruta.includes('redaccion_redes') && c.metodo === 'POST');
  ok(subidas.length >= 6, `al volver la tabla suben las ${subidas.length} pendientes solas`, 'no subieron las pendientes: ' + subidas.length);

  ok(tan.value === 'Creemos que la bandera importa 𝗺𝘂𝗰𝗵𝗼.', 'sin selección, 𝗡 pone en negrita la palabra bajo el cursor (y deja el punto en paz)', 'el recuadro dice: ' + tan.value);
  // El cursor pegado al final de una palabra es esa palabra
  const iEsp = tan.value.indexOf(' la ');
  tan.setSelectionRange(iEsp, iEsp);
  negBtn.click();
  await esperar(250);
  ok(tan.value === 'Creemos 𝗾𝘂𝗲 la bandera importa 𝗺𝘂𝗰𝗵𝗼.', 'con el cursor pegado al final de «que», 𝗡 toma «que»', 'el recuadro dice: ' + tan.value);
  ok(/2 palabras en negrita/.test(avN.textContent), 'y el aviso cuenta dos', 'el aviso dice: ' + avN.textContent);
  // Sin nada que poner en negrita: no cambia nada y lo dice
  tan.value = '';
  tan.dispatchEvent(new w.Event('input', { bubbles: true }));
  await esperar(250);
  ok(avN.style.display === 'none', '(sin texto, el aviso está recogido)', 'el aviso sigue con el texto vacío: ' + avN.textContent);
  negBtn.click();
  await esperar(100);
  ok(tan.value === '' && avN.style.display !== 'none' && /Selecciona/.test(avN.textContent), 'sin nada que poner en negrita, no cambia nada y el aviso dice qué hacer', 'cambió el texto o no avisó: ' + avN.textContent);
  tan.value = 'Creemos que la bandera importa mucho para todos.';
  tan.dispatchEvent(new w.Event('input', { bubbles: true }));
  await esperar(250);
  tan.setSelectionRange(0, tan.value.length);
  negBtn.click();
  await esperar(250);
  ok(w.rrdNegritaCuenta(tan.value) === 8 && avN.classList.contains('rrd-aviso-rojo') && /🔴/.test(avN.textContent), 'una frase entera en negrita sale en ROJO', 'cuenta ' + w.rrdNegritaCuenta(tan.value) + ', clase ' + avN.className + ': ' + avN.textContent);
  negBtn.click();                       // todo sigue seleccionado: vuelve entero
  await esperar(250);
  ok(tan.value === 'Creemos que la bandera importa mucho para todos.', 'y otro toque devuelve la frase entera con sus letras', 'el recuadro dice: ' + tan.value);

  // En X la cuenta y el aviso lo cobran
  const pxNeg = w.rrdNueva('x', 'post', { texto: '𝗵𝗼𝗹𝗮 mundo' });
  w.rrdAbrir(pxNeg.id);
  await esperar(300);
  ok(/^14 \/ 280/.test(texto('rrd-e-contador')), 'en una pieza de X el contador cobra la negrita al doble («𝗵𝗼𝗹𝗮 mundo» = 14)', 'el contador dice: ' + texto('rrd-e-contador'));
  ok(/cuesta 2 unidades/.test(d.getElementById('rrd-e-negrita-aviso').textContent), 'y el aviso de X lo dice con el número', 'el aviso de X dice: ' + d.getElementById('rrd-e-negrita-aviso').textContent);

  // El corrector la señala y no busca erratas dentro
  const pcNeg = w.rrdNueva('facebook', 'post', { texto: 'Creemos que la 𝗯𝗮𝗻𝗱𝗲𝗿𝗮 𝗶𝗺𝗽𝗼𝗿𝘁𝗮 mucho. Fué asi.' });
  w.rrdAbrir(pcNeg.id);
  await esperar(250);
  d.getElementById('rrd-e-corr-btn').click();
  await esperar(400);
  const hsN = g('_corHallazgos');
  const hNeg = hsN.find(h => h.regla.id === 'redes-negrita');
  ok(!!hNeg && hNeg.original === '𝗯𝗮𝗻𝗱𝗲𝗿𝗮 𝗶𝗺𝗽𝗼𝗿𝘁𝗮' && hNeg.regla.nivel === 'revisa' && hNeg.regla.zona, 'el corrector señala la negrita Unicode con su regla (revisa, zona) sobre el trozo exacto', 'hallazgos: ' + hsN.map(h => h.regla.id + ':' + h.original).join(' | '));
  const iNeg = pcNeg.texto.indexOf('𝗯𝗮𝗻𝗱𝗲𝗿𝗮'), fNeg = pcNeg.texto.indexOf(' mucho');
  ok(hsN.every(h => h.regla.id === 'redes-negrita' || h.fin <= iNeg || h.ini >= fNeg), 'y ninguna otra regla mira dentro de la negrita', 'algo casó dentro: ' + hsN.filter(h => h.regla.id !== 'redes-negrita' && !(h.fin <= iNeg || h.ini >= fNeg)).map(h => h.regla.id + ':' + h.original).join(','));
  ok(hsN.some(h => h.original === 'Fué'), 'mientras que la errata de fuera («Fué») sí se caza', 'no cazó «Fué»');
  ok(/símbolos, no letras/.test(hNeg ? hNeg.regla.titulo : ''), 'y su tarjeta se titula por lo que es', 'título: ' + (hNeg && hNeg.regla.titulo));
  w.eval('corCerrar(); corDespintar()');

  /* ════════════════════════════════════════════════════════════════
     17. ✍️ REMARCAR Y CORREGIR DESDE LA VISTA PREVIA
     ════════════════════════════════════════════════════════════════
     Ordenada por gravedad, y lo primero es lo único que de verdad
     hace daño: que la caja escriba EN OTRO SITIO. La vista previa no
     es el texto —lleva pegados el enlace, el bloque de fuentes y la
     numeración del hilo—, así que el trozo hay que localizarlo; y un
     trozo que aparece dos veces, sin un sitio exacto que comprobar,
     NO se adivina (la regla del reanclaje de La Voz Prestada). Se
     comprobó al revés, dejando que eligiera la primera aparición:
     la sonda suspende diciendo que cambió la que no era.

     Y se selecciona con EVENTOS DE PUNTERO de verdad y se mide la
     caja con elementFromPoint: lo que puede fallar aquí es de
     pantalla —una caja que sale fuera del borde, un `<pre>` que no
     deja seleccionar, una caja que se cierra a sí misma al darle el
     foco a su propio campo— y nada de eso se ve llamando funciones. */
  log('── 17. ✍️ Remarcar y corregir desde la vista previa ──');

  const pvis = w.rrdNueva('facebook', 'post', {
    texto: 'Reflexión sobre los extranjerismos\n\nObservo que el idioma se mezcla con el ingles. Otra frase que se suele utilizar es trendt por reto.',
    fuentes: [{ ref: 'Bueno, G. (1972). Ensayos materialistes. Taurus.' }] });
  w.rrdAbrir(pvis.id);
  await esperar(900);

  const preV = d.querySelector('#rrd-e-salida .rrd-vista');
  ok(!!preV, 'la vista previa se puede remarcar (lleva .rrd-vista)', 'la caja «Lo que se pega» no es remarcable');
  ok(preV && preV.childNodes.length === 1 && preV.firstChild.nodeType === 3,
     'y es UN solo nodo de texto: el desplazamiento de la selección es el del texto',
     'la vista tiene ' + (preV ? preV.childNodes.length : 0) + ' nodos');
  ok(!!d.querySelector('#rrd-e-salida .rrd-vista-pista'),
     'y se explica con palabras encima, como el arrastre de la repisa', 'no hay ninguna nota que lo explique');

  /* Seleccionar un trozo de la vista con el ratón, como se hace. */
  const cajaV = d.getElementById('rrd-vista-caja');
  const traer = t => {
    const pre = d.querySelector('#rrd-e-salida .rrd-vista') || d.querySelector('#rrd-e-partes .rrd-vista');
    const i = pre.textContent.indexOf(t);
    if (i < 0) return null;
    const r = d.createRange();
    r.setStart(pre.firstChild, i); r.setEnd(pre.firstChild, i + t.length);
    const sc = d.querySelector('#view-redaccion-pieza .view-scroll');
    sc.scrollTop += r.getBoundingClientRect().top - 120;
    return { pre, r: d.createRange(), i, t };
  };
  const arrastrar = t => {
    const pre = d.querySelector('#rrd-e-salida .rrd-vista') || d.querySelector('#rrd-e-partes .rrd-vista');
    const i = pre.textContent.indexOf(t);
    const r = d.createRange();
    r.setStart(pre.firstChild, i); r.setEnd(pre.firstChild, i + t.length);
    const caja = r.getBoundingClientRect();
    const y = caja.top + caja.height / 2;
    const ev = (tipo, x) => pre.dispatchEvent(new w.PointerEvent(tipo, {
      bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', button: 0, buttons: 1 }));
    ev('pointerdown', caja.left + 1);
    const sel = w.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    ev('pointermove', caja.right - 1);
    ev('pointerup', caja.right - 1);
    w.document.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true, pointerType: 'mouse' }));
  };

  traer('trendt'); arrastrar('trendt');
  await esperar(250);
  ok(cajaV.style.display === 'block', 'al soltar el ratón sale la caja de corregir', 'la caja no salió');
  ok(/Corregir en el texto/.test(texto('rrd-vista-t') || cajaV.textContent),
     'y dice en qué campo va a escribir', 'la caja dice: ' + cajaV.textContent.slice(0, 60));
  const campoV = cajaV.querySelector('.rrd-vista-campo');
  ok(campoV && campoV.value === 'trendt', 'con el trozo seleccionado dentro', 'el campo dice: ' + (campoV && campoV.value));
  ok(!w.CSS || !w.CSS.highlights || !!w.CSS.highlights.get('rrd-marca'),
     'el trozo queda REMARCADO (sin eso, al escribir en la caja se pierde de vista)', 'no se remarcó');
  const rc = cajaV.getBoundingClientRect();
  ok(rc.left >= 0 && rc.right <= w.innerWidth + 1 && rc.top >= 0 && rc.bottom <= w.innerHeight + 1,
     'y sale entera dentro de la pantalla', `la caja se sale: ${Math.round(rc.left)}..${Math.round(rc.right)} de ${w.innerWidth}`);
  ok(d.elementFromPoint(rc.left + rc.width / 2, rc.top + 6) &&
     cajaV.contains(d.elementFromPoint(rc.left + rc.width / 2, rc.top + 6)),
     'y es ella la que recibe el dedo, no lo que hay debajo', 'algo tapa la caja de corregir');

  campoV.value = 'trend';
  cajaV.querySelector('.rrd-vista-ok').click();
  await esperar(400);
  ok(w.rrdPieza(pvis.id).texto.includes('es trend por') && !w.rrdPieza(pvis.id).texto.includes('trendt'),
     'cambiarlo escribe en el TEXTO de la pieza', 'la pieza dice: ' + w.rrdPieza(pvis.id).texto.slice(-60));
  ok(d.getElementById('rrd-e-texto').value === w.rrdPieza(pvis.id).texto, 'y el recuadro de escribir va al día', 'el recuadro se quedó viejo');
  ok(texto('rrd-e-salida').includes('es trend por'), 'y la vista previa también', 'la vista no se enteró');
  ok(cajaV.style.display === 'none', 'la caja se cierra sola al cambiar', 'la caja se quedó abierta');

  /* Un trozo que sale de una FUENTE se corrige en su fuente, no en el texto */
  traer('materialistes'); arrastrar('materialistes');
  await esperar(250);
  ok(/la fuente \[1\]/.test(cajaV.textContent), 'un trozo del bloque «📚 Fuentes» se corrige EN SU FUENTE',
     'dice: ' + cajaV.textContent.slice(0, 70));
  cajaV.querySelector('.rrd-vista-campo').value = 'materialistas';
  cajaV.querySelector('.rrd-vista-ok').click();
  await esperar(400);
  ok(w.rrdPieza(pvis.id).fuentes[0].ref.includes('materialistas'), 'y escribe en la fuente', 'la fuente dice: ' + w.rrdPieza(pvis.id).fuentes[0].ref);
  ok(!w.rrdPieza(pvis.id).texto.includes('materialistas'), 'sin tocar el texto', 'escribió también en el texto');

  /* Lo que escribe la herramienta no se corrige, y se DICE por qué */
  traer('Fuentes'); arrastrar('Fuentes');
  await esperar(250);
  ok(!cajaV.querySelector('.rrd-vista-campo') && /no sale de lo que escribiste/.test(cajaV.textContent),
     'el rótulo «📚 Fuentes» no se corrige, y la caja explica por qué', 'la caja dice: ' + cajaV.textContent.slice(0, 80));

  /* ⚠️ Lo que de verdad importa: un trozo repetido sin sitio exacto NO
     se adivina. Con el desplazamiento de la vista principal sí se sabe
     cuál es —y se comprueba carácter por carácter—; sin él, se niega. */
  const pr = w.rrdNueva('facebook', 'post', { texto: 'La palabra contexto se usa mucho. Y otra vez la palabra contexto aquí.' });
  w.rrdAbrir(pr.id);
  await esperar(800);
  const dosVeces = (() => {
    const pre = d.querySelector('#rrd-e-salida .rrd-vista');
    const t = pre.textContent;
    const seg = t.indexOf('palabra contexto', t.indexOf('palabra contexto') + 1);
    const r = d.createRange();
    r.setStart(pre.firstChild, seg); r.setEnd(pre.firstChild, seg + 16);
    const sel = w.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    return { esperado: seg, donde: w.rrdVistaDonde(w.rrdVistaSeleccion()) };
  })();
  ok(dosVeces.donde.campo === 'texto' && dosVeces.donde.ini === dosVeces.esperado,
     'con dos apariciones iguales, se corrige LA QUE SE SELECCIONÓ (el desplazamiento manda, comprobado)',
     'iba a cambiar la de la posición ' + dosVeces.donde.ini + ' en vez de la ' + dosVeces.esperado);
  const sinSitio = (() => {
    const v = w.rrdVistaSeleccion();
    v.ini = -1; v.cual = 'aparte';        // como una parte del hilo que no se pudo situar
    return w.rrdVistaDonde(v);
  })();
  ok(!!sinSitio.error && /más de una vez/.test(sinSitio.error),
     'y sin un sitio exacto que comprobar, NO se adivina: se dice y no se toca nada',
     'adivinó y se puso a cambiar ' + JSON.stringify(sinSitio));

  /* En un hilo de X la vista previa son las partes, y también se corrigen */
  const ph = w.rrdNueva('x', 'hilo', { texto: Array.from({ length: 6 }, (_, i) =>
    `Esta es la frase numero ${i + 1} del hilo, que cuenta una cosa con detalle para ocupar sitio y obligar a repartir. Aqui va la segunda oracion, con su punto.`).join(' ') });
  w.rrdAbrir(ph.id);
  await esperar(300);
  w.rrdPartirAhora();
  await hasta(() => d.querySelectorAll('#rrd-e-partes .rrd-vista').length >= 3, 4000);
  const presH = d.querySelectorAll('#rrd-e-partes .rrd-vista');
  ok(presH.length >= 3, `las ${presH.length} partes del hilo también se remarcan`, 'las partes no son remarcables');
  ok(!!d.querySelector('#rrd-e-partes .rrd-vista-pista'), 'y llevan su nota encima', 'las partes no lo explican');
  const enParte = (() => {
    const pre = presH[1];
    const i = pre.textContent.indexOf('detalle');
    const r = d.createRange();
    r.setStart(pre.firstChild, i); r.setEnd(pre.firstChild, i + 7);
    const sel = w.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    return w.rrdVistaDonde(w.rrdVistaSeleccion());
  })();
  ok(enParte.campo === 'texto' && !enParte.error,
     'y una palabra repetida en SEIS partes se sitúa igual, por el sitio de su parte en el texto',
     'en la parte 2 dijo: ' + JSON.stringify(enParte));
  const antesDeParte = w.rrdPieza(ph.id).texto;
  w.rrdVistaAbrir(w.rrdVistaSeleccion());
  await esperar(150);
  cajaV.querySelector('.rrd-vista-campo').value = 'DETALLE';
  cajaV.querySelector('.rrd-vista-ok').click();
  await esperar(500);
  const trasParte = w.rrdPieza(ph.id).texto;
  ok(trasParte.split('DETALLE').length === 2 && trasParte.indexOf('DETALLE') === enParte.ini,
     'corregir desde la parte 2 cambia SOLO esa, y en su sitio',
     'cambió ' + (trasParte.split('DETALLE').length - 1) + ' sitios, el primero en ' + trasParte.indexOf('DETALLE') + ' (se esperaba ' + enParte.ini + ')');

  /* Mientras se mueve la selección la caja NO está: en una tableta cada
     pausa la plantaría encima del párrafo que hay que leer. */
  w.eval('rrdVistaCerrar()');
  // Se vuelve a pedir: corregir rehízo la vista previa y los `<pre>` de
  // antes ya no cuelgan del documento (seleccionar en un nodo suelto no
  // selecciona nada, y la sonda estaría midiendo su propio despiste).
  const preH = d.querySelectorAll('#rrd-e-partes .rrd-vista')[0];
  const mueve = n => {
    const r = d.createRange();
    r.setStart(preH.firstChild, n); r.setEnd(preH.firstChild, n + 10);
    const sel = w.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  };
  mueve(5);
  await esperar(600);
  ok(!!w.rrdVistaSeleccion(), 'la selección sigue puesta: la vista previa no se rehace sola y se la lleva',
     'la vista previa se rehizo y se llevó por delante el trozo seleccionado');
  ok(cajaV.style.display === 'none', 'con el dedo, a los 600 ms la caja todavía NO está (se está seleccionando)', 'la caja salió encima del párrafo mientras se selecciona');
  /* ⚠️ El número se pide con eval, NUNCA como w.RRD_SEL_ESPERA: un
     `const` de arriba del archivo no cuelga de window, así que eso daba
     undefined, esperar(NaN) esperaba CERO y la sonda suspendía diciendo
     que la caja no salía nunca cuando salía perfectamente. */
  const espera = g('RRD_SEL_ESPERA');
  await esperar(espera - 600 + 500);
  ok(cajaV.style.display === 'block', `pasados los ${espera / 1000} s quieta, sale`,
     'la caja no salió nunca · selección=' + JSON.stringify(String(w.getSelection())) +
     ' · la ve la herramienta=' + !!w.rrdVistaSeleccion());
  mueve(30);
  await esperar(150);
  ok(cajaV.style.display === 'none', 'y mover la selección la cierra al instante', 'la caja se quedó puesta al mover la selección');
  w.eval('rrdVistaCerrar()');

  /* ⚠️ Y escribir en el recuadro NO puede mover la pantalla. Medir el
     alto poniéndolo en `auto` encogía el recuadro de golpe, todo lo de
     abajo subía, el navegador reanclaba y la pantalla se iba sola a la
     vista previa. Se mide en píxeles, que esto no se ve leyendo el
     código. */
  log('── 17-bis. Escribir no mueve la pantalla ──');
  const plar = w.rrdNueva('facebook', 'post', { texto: Array.from({ length: 8 }, (_, i) =>
    'Observo como el idioma se mezcla con el ingles, y palabras como skill, promt o facto son ya anglicismos cotidianos de las redes sociales. Parrafo ' + (i + 1) + '.').join('\n\n') });
  w.rrdAbrir(plar.id);
  await esperar(800);
  const scL = d.querySelector('#view-redaccion-pieza .view-scroll');
  const taL = d.getElementById('rrd-e-texto');
  const medio = Math.floor(taL.value.length / 2);
  taL.focus(); taL.setSelectionRange(medio, medio);
  await esperar(200);
  const y0 = scL.scrollTop;
  for (const c of 'Y esta frase se escribe de seguido, como se escribe de verdad.') {
    taL.setRangeText(c, taL.selectionStart, taL.selectionStart, 'end');
    taL.dispatchEvent(new w.Event('input', { bubbles: true }));
  }
  const y1 = scL.scrollTop;
  await esperar(1200);
  const y2 = scL.scrollTop;
  ok(Math.abs(y1 - y0) <= 2 && Math.abs(y2 - y0) <= 2,
     'escribiendo seguido con el cursor a la vista, la pantalla no se mueve ni un píxel',
     `la pantalla se fue sola: ${y0} → ${y1} → ${y2} (salto de ${y2 - y0} px)`);
  for (let i = 0; i < 30; i++) {
    taL.setRangeText('', taL.selectionStart - 1, taL.selectionStart, 'end');
    taL.dispatchEvent(new w.Event('input', { bubbles: true }));
  }
  await esperar(1200);
  ok(Math.abs(scL.scrollTop - y0) <= 2, 'y borrando tampoco —que es cuando sí hay que volver a medir el alto—',
     `borrando se fue a ${scL.scrollTop} desde ${y0}`);
  ok(taL.scrollHeight <= taL.clientHeight + 6, 'y el recuadro sigue midiendo lo que ocupa su texto',
     `el recuadro mide ${taL.clientHeight} y su texto ${taL.scrollHeight}`);

  termina();
})().catch(e => { fallos++; log('✘ la sonda reventó: ' + (e && e.stack || e)); termina(); });
</script>
</body>
</html>
