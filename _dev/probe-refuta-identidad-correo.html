<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · de donde sale la identidad</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:400px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo...</pre>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

window.addEventListener('load', async () => {
  await esperar(2500);
  const w = f.contentWindow;
  try {
    log('_mapearSesion accesible: ' + (typeof w._mapearSesion));
    const casos = [
      ['metadatos que el propio usuario puede escribir',
       { user: { id: 'uuid-de-un-desconocido', email: 'desconocido@gmail.com', user_metadata: { miembro: 'josue' } } }],
      ['correo ajeno cuya parte local coincide',
       { user: { id: 'uuid-2', email: 'josue@loquesea.com', user_metadata: {} } }],
      ['correo ajeno con mayusculas',
       { user: { id: 'uuid-3', email: 'JOSUE@attacker.example', user_metadata: {} } }],
      ['metadatos basura + correo ajeno que coincide',
       { user: { id: 'uuid-4', email: 'angelly@evil.tld', user_metadata: { miembro: 'no-existe' } } }],
      ['sin confirmar el correo (email_confirmed_at ausente)',
       { user: { id: 'uuid-5', email: 'jael@evil.tld', user_metadata: {} } }],
      ['desconocido sin coincidencia (control)',
       { user: { id: 'uuid-6', email: 'zzz@evil.tld', user_metadata: {} } }],
    ];
    for (const [nombre, ses] of casos) {
      let r; try { r = w._mapearSesion(ses); } catch (e) { r = 'ERROR ' + e.message; }
      log('\n' + nombre + '\n  correo=' + ses.user.email +
          ' meta=' + JSON.stringify(ses.user.user_metadata) +
          '\n  -> ' + JSON.stringify(r));
    }
    log('\nMIEMBROS declarados: ' + JSON.stringify(Object.keys(w.MIEMBROS || {})));
  } catch (e) { log('X ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
