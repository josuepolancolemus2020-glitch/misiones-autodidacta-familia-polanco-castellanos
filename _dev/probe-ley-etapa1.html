<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de la Ley y sus Grietas, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-ley-fuerza-norma/fuerza-norma.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta de la Ley y sus Grietas: bancos,
   laboratorio, pruebas impresas con su nombre, los ocho casos, la ficha y la
   ruta empezando a poblarse.

   Y una comprobación que NO tiene ninguna otra misión del proyecto: que no se
   cite ningún artículo fuera de la lista comprobada. Es la regla de la ruta
   (capítulo 1 del compendio) convertida en prueba, porque una regla que solo
   está escrita en un documento se salta sola dentro de seis meses. Aquí un
   artículo inventado pone la sonda en rojo. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* Los únicos artículos que esta misión tiene derecho a citar: son los que se
   comprobaron contra fuente el 11 de agosto de 2026 y están apuntados en la
   cabecera de _dev/inyecta-bancos-ley-fuerza.js. Para añadir uno hay que
   comprobarlo primero y luego meterlo aquí, en ese orden. */
const ARTICULOS_COMPROBADOS = ['16', '17', '18', '70', '157', '205', '320', '321'];

/* Se lee del HTML con las etiquetas cambiadas por espacios, NO de textContent:
   textContent pega el final de un elemento con el principio del siguiente, y
   «Artículo 18» seguido de un «1.» de la lista de al lado se leía como el
   artículo 181, que no existe. La sonda daba un fallo que no era. */
function textoSeparado(nodoOHtml) {
  const html = typeof nodoOHtml === 'string' ? nodoOHtml : nodoOHtml.innerHTML;
  return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
}

function articulosCitados(texto) {
  const encontrados = new Set();
  const re = /\b(?:art[íi]culos?|arts?\.)\s*(\d{1,3})(?:\s*,\s*(\d{1,3}))?(?:\s*y\s*(\d{1,3}))?/gi;
  let m;
  while ((m = re.exec(texto)) !== null) {
    for (let i = 1; i < m.length; i++) if (m[i]) encontrados.add(m[i]);
  }
  return [...encontrados];
}

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Ley y sus Grietas · Etapa 1 de 12/.test(d.body.textContent), 'se presenta como etapa 1 de 12', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de «Llaves y secretos», y su vocabulario no
       tiene nada que hacer aquí. */
    ok(!/clave anónima|clave de servicio|rotar la clave|\.gitignore|custodio|firma del APK|Casa Cerrada/i.test(d.body.textContent),
       'sin restos de la misión de la que se copió', 'queda el temario de Llaves y secretos');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── NADA SE CITA DE MEMORIA (la regla de esta ruta) ──');
    const citadosMision = articulosCitados(textoSeparado(d.body));
    const intrusos = citadosMision.filter(n => !ARTICULOS_COMPROBADOS.includes(n));
    ok(intrusos.length === 0,
       'los ' + citadosMision.length + ' artículos citados están en la lista comprobada',
       'artículos citados sin comprobar: ' + intrusos.join(', '));
    ok(citadosMision.includes('321') && citadosMision.includes('70'),
       'cita el par 70 y 321, que es el corazón de la etapa', 'falta el par 70 / 321');
    ok(/11 de agosto de 2026/.test(d.body.textContent), 'dice cuándo se comprobaron las fuentes', 'no dice la fecha de comprobación');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    /* El molde llama «a» al índice correcto de evalMCBank y «c» al de qzData.
       Confundirlos deja la evaluación final calificando al azar sin que se
       note en pantalla, así que se comprueba aquí. */
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('Object.keys(parteData).join(",")') === 'norma,escalones,vida,facultad', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas de la fuerza de una norma', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_ley_fuerza/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/en qué norma dice usted que puede exigirme esto/i.test(texto), 'trae la pregunta de ventanilla', 'falta la pregunta de la etapa');
    ok(/expresamente le confiere la ley|confiere expresamente|le confiere la ley/i.test(texto), 'explica la facultad expresa del art. 321', 'no explica el 321');
    ok(/no perjudique a otro/i.test(texto), 'explica lo que puede el particular (art. 70)', 'no explica el 70');
    ok(/validez/i.test(texto) && /vigencia/i.test(texto) && /eficacia/i.test(texto), 'separa validez, vigencia y eficacia', 'no separa las tres');
    ok(/riesgo dormido/i.test(texto), 'nombra la norma dormida', 'no aparece el riesgo dormido');
    ok(/prevalece el tratado/i.test(texto), 'coloca el tratado por encima de la ley', 'no explica el lugar del tratado');
    ok(/coacción/i.test(texto) && /legitimidad/i.test(texto) && /costumbre/i.test(texto), 'las tres patas del cumplimiento', 'faltan patas del cumplimiento');
    ok(/siempre se ha hecho así/i.test(texto), 'desarma «siempre se ha hecho así»', 'no aparece la costumbre de oficina');
    ok(/no se publicó|sin publicación|La Gaceta/i.test(texto), 'explica que sin publicación no obliga', 'no habla de la publicación');
    ok(/circular/i.test(texto), 'distingue el papel que no es norma', 'no aparece la circular');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Qué es una norma/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en la norma', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="norma"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el papel sobre la mesa se genera', 'prueba competencial vacía');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(textoSeparado).join(' · ');
    ok(!/Llaves y secretos|El llavero|Las seis palancas|La puerta de la casa digital|El código que no confía|Verificar|El presupuesto real|Pedir bien|Etapa 4 · Ciberseguridad/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');
    const citadosPruebas = articulosCitados(rotulos).filter(n => !ARTICULOS_COMPROBADOS.includes(n));
    ok(citadosPruebas.length === 0, 'las pruebas tampoco citan artículos sin comprobar', 'en las pruebas: ' + citadosPruebas.join(', '));

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['circular', 'autoría', 'reglamento', 'siempre se ha hecho así', 'tratado', 'dormida', 'publicó', '157']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length === 8, 'los ocho casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/hoja de ventanilla/i.test(txt), 'trae la hoja de ventanilla', 'falta la hoja de ventanilla');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/circular|acuerdo|tratado|instructivo|siempre se ha hecho/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-ley-fuerza-norma.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja de ventanilla, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja en blanco', 'falta la hoja de ventanilla en blanco');
    ok(/Una hoja de ventanilla ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/La pirámide: quién manda sobre quién/i.test(txtF), 'la ficha trae la pirámide', 'falta la pirámide');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    const citadosFicha = articulosCitados(textoSeparado(txtF)).filter(n => !ARTICULOS_COMPROBADOS.includes(n));
    ok(citadosFicha.length === 0, 'la ficha tampoco cita artículos sin comprobar', 'en la ficha: ' + citadosFicha.join(', '));
    ok(!!d.querySelector('#s-recursos a[href*="ficha-ley-fuerza-norma"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ley = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de la Ley y sus Grietas/.test(c.textContent));
    ok(!!ley, 'la Ruta de la Ley está en el mapa', 'no aparece la ruta');
    if (ley) {
      /* Estas dos cuentas suben cada vez que se construye una etapa de la
         ruta. No es una comprobación frágil: es la que avisa de que la misión
         nueva llegó al catálogo, así que se actualiza a propósito. */
      /* Cuentas sacadas del CATÁLOGO, no escritas a mano: las de a mano se
         quedaron viejas al crecer la ruta y la sonda suspendía sin que
         hubiera nada roto (la lección de la Casa Cerrada, en CLAUDE.md). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "ley").length');
      const totalCat = wa.eval('RUTAS.ley.etapas');
      ok(ley.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ley.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ley.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ley.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok(/De dónde saca su fuerza la ley/.test(ley.textContent), 'la etapa 1 sale con el título de la misión', 'la etapa 1 sigue saliendo como prevista');
      ok(/La grieta/i.test(ley.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ley.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="ley"]');
    ok(!!chip, 'la materia Derecho y Ley tiene su chip', 'no hay chip de Derecho y Ley');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      const enMateriaCat = wa.eval('MISSIONS.filter(m => m.materia === "ley").length');
      ok(tarjetas.length === enMateriaCat, 'la materia muestra sus ' + enMateriaCat + ' misiones', 'muestra ' + tarjetas.length);
      const t = tarjetas.find(x => /fuerza la ley/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    /* Estas sondas son anteriores a la norma del título y no lo ponían: decían
       «todo en orden» en su cuerpo y dejaban la pestaña sin APRUEBA, así que en
       tanda salían como no aprobadas sin tener un solo fallo. La casa las lee
       por el título (CLAUDE.md). */
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda ley etapa 1';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
