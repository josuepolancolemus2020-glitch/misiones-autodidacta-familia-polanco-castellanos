<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · token caducado sin red</title></head>
<body>
<pre id="out"></pre>
<script src="/_dev/vendor/supabase.js"></script>
<script>
const out = document.getElementById('out');
const log = m => { out.textContent += m + '\n'; };

const URLSB = 'https://bzrnjvalpwlcnpszvwim.supabase.co';
const KEYSB = 'sb_publishable_74mJW5LoxPZOWtIi7YrBEw_0y9JjSfM';

function sesionFalsa(segundos) {
  const exp = Math.floor(Date.now() / 1000) + segundos;
  return {
    access_token: 'aaa.bbb.ccc',
    token_type: 'bearer',
    expires_in: segundos,
    expires_at: exp,
    refresh_token: 'refresh-de-jael',
    user: {
      id: '00000000-0000-4000-8000-000000000001',
      aud: 'authenticated',
      role: 'authenticated',
      email: 'jael@faro.local',
      email_confirmed_at: '2026-01-01T00:00:00Z',
      app_metadata: { provider: 'email' },
      user_metadata: { miembro: 'jael' },
      created_at: '2026-01-01T00:00:00Z',
      updated_at: '2026-01-01T00:00:00Z',
      identities: [],
addd: 0
    },
  };
}

const fetchReal = window.fetch.bind(window);
let redCaida = false;
window.fetch = function (...args) {
  if (redCaida) return Promise.reject(new TypeError('Failed to fetch'));
  return fetchReal(...args);
};

function cliente(storageKey) {
  return supabase.createClient(URLSB, KEYSB, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey },
  });
}

(async function () {
  log('supabase cargado: ' + (typeof supabase === 'object'));

  /* ── Control 1: formato de almacenamiento correcto (sesion VIVA, con red) ── */
  localStorage.setItem('ctl_viva', JSON.stringify(sesionFalsa(3600)));
  const c1 = cliente('ctl_viva');
  const r1 = await c1.auth.getSession();
  log('');
  log('── CONTROL · sesion viva en almacenamiento ──');
  log('  sesion devuelta : ' + (r1.data && r1.data.session ? 'SI (' + r1.data.session.user.email + ')' : 'NO'));
  log('  error           : ' + (r1.error ? r1.error.name + ': ' + r1.error.message : 'ninguno'));

  /* ── Caso del revisor: token CADUCADO y sin red ── */
  localStorage.setItem('faro_auth', JSON.stringify(sesionFalsa(-60)));
  redCaida = true;
  const c2 = cliente('faro_auth');
  const t0 = Date.now();
  let r2, boom = null;
  const conTope = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r('__TIMEOUT__'), ms))]);
  try { r2 = await conTope(c2.auth.getSession(), 20000); } catch (e) { boom = e; }
  if (r2 === '__TIMEOUT__') { log('  getSession() SIGUE COLGADA tras 20 s (reintentos sin red)'); r2 = { data: { session: null }, error: { name: 'TIMEOUT', message: '20 s sin responder' } }; }
  log('');
  log('── CASO · token caducado + red caida ──');
  if (boom) {
    log('  getSession() LANZO : ' + boom.name + ': ' + boom.message);
  } else {
    log('  data.session       : ' + (r2.data && r2.data.session ? 'SI' : 'null'));
    log('  error              : ' + (r2.error ? r2.error.name + ': ' + r2.error.message : 'ninguno'));
  }
  log('  tardo (ms)         : ' + (Date.now() - t0));

  /* Lo que hace auth.js exactamente en la linea 175-176 */
  let mapeado = null;
  try {
    const rr = await Promise.race([c2.auth.getSession(), new Promise(r=>setTimeout(()=>r({data:{session:null}}),8000))]);
    const { data } = rr;
    mapeado = data && data.session ? 'HAY SESION' : 'null -> pantalla de entrada';
  } catch (_) { mapeado = 'EXCEPCION -> catch -> pantalla de entrada'; }
  log('  auth.js decide     : ' + mapeado);

  /* ¿Queda huella local del telefono autorizado? */
  const quedan = Object.keys(localStorage).filter(k => k.indexOf('faro_auth') === 0);
  log('  claves faro_auth*  : ' + JSON.stringify(quedan));
  const crudo = localStorage.getItem('faro_auth');
  log('  sesion sigue en el telefono: ' + (crudo ? 'SI (' + crudo.length + ' bytes, refresh_token intacto: ' + (crudo.indexOf('refresh-de-jael') > -1) + ')' : 'NO, borrada'));

  /* ── La otra puerta: contrasena correcta sin red ── */
  const r3 = await Promise.race([
    c2.auth.signInWithPassword({ email: 'jael@faro.local', password: 'la-buena' }).catch(e => ({ error: e })),
    new Promise(r => setTimeout(() => r({ error: { name: 'TIMEOUT', message: 'no respondio en 15 s' } }), 15000)),
  ]);
  log('');
  log('── CASO · signInWithPassword sin red ──');
  log('  error : ' + (r3.error ? (r3.error.name || 'Error') + ': ' + r3.error.message : 'ninguno'));
  log('  sesion: ' + (r3.data && r3.data.session ? 'SI' : 'NO'));

  /* ── Token AUN VIVO pero sin red: ¿deja entrar? ── */
  localStorage.setItem('vivo_sin_red', JSON.stringify(sesionFalsa(3600)));
  const c4 = cliente('vivo_sin_red');
  const r4 = await Promise.race([
    c4.auth.getSession().catch(e => ({ error: e })),
    new Promise(r => setTimeout(() => r({ error: { name: 'TIMEOUT', message: 'no respondio en 10 s' } }), 10000)),
  ]);
  log('');
  log('── CASO · token vivo + red caida ──');
  log('  data.session : ' + (r4.data && r4.data.session ? 'SI -> entra' : 'null -> NO entra'));
  log('  error        : ' + (r4.error ? r4.error.name + ': ' + r4.error.message : 'ninguno'));

  log('');
  log('FIN');
})();
</script>
</body>
</html>
