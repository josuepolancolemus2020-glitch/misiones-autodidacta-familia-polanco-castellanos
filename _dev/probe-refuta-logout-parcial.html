<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · refutar logout parcial</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:340px;height:150px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out">midiendo…</pre>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const REF = 'bzrnjvalpwlcnpszvwim';
const CLAVE_DEFECTO = 'sb-' + REF + '-auth-token';

/* Doble de supabase-js fiel en LO QUE IMPORTA AQUI:
   · cada cliente tiene SU storageKey (por defecto sb-<ref>-auth-token);
   · persistSession: la sesion se lee de localStorage al crear el cliente
     y se borra de localStorage al hacer signOut;
   · signOut() solo toca SU propia clave y SU propia sesion en memoria. */
const DOBLE = `
window.__reg = { clientes: [], toques: [], signOuts: [] };
(function(){
  const REF='` + REF + `';
  let n = 0;
  function cliente(url, key, opts){
    const id = 'cli' + (++n);
    const sk = (opts && opts.auth && opts.auth.storageKey) || ('sb-'+REF+'-auth-token');
    let sesion = null;
    try { sesion = JSON.parse(localStorage.getItem(sk) || 'null'); } catch(_) {}
    const guardar = () => { try { sesion ? localStorage.setItem(sk, JSON.stringify(sesion))
                                         : localStorage.removeItem(sk); } catch(_){} };
    const cli = { __id:id, __storageKey:sk };
    window.__reg.clientes.push({ id:id, storageKey:sk, sesionAlNacer: !!sesion });
    const qb = (tabla) => {
      const rec = () => window.__reg.toques.push({ cliente:id, tabla:tabla,
        token: sesion ? ('SESION de ' + sesion.user.email) : 'clave publicable (anon)' });
      const p = { then:(res)=>{ rec(); return Promise.resolve({data:[],error:null}).then(res); } };
      ['select','insert','update','delete','upsert','order','limit','eq','neq','gte','lt','single','not','in','is','filter','range','maybeSingle','match','or','lte','gt','contains','overlaps','ilike','like'].forEach(m=>{p[m]=()=>p;});
      return p;
    };
    cli.from = t => qb(t);
    cli.channel = () => { const ch={on:()=>ch,subscribe:()=>ch}; return ch; };
    cli.removeChannel = () => {};
    cli.functions = { invoke: () => Promise.resolve({data:null,error:null}) };
    cli.auth = {
      get storageKey(){ return sk; },
      getSession: () => Promise.resolve({ data:{ session: sesion }, error:null }),
      getUser: () => Promise.resolve({ data:{ user: sesion && sesion.user }, error:null }),
      onAuthStateChange: () => ({ data:{ subscription:{ unsubscribe(){} } } }),
      signInWithPassword: (c) => { sesion = { access_token:'TOK-'+id, user:{ email:c.email, user_metadata:{} } };
                                   guardar(); return Promise.resolve({ data:{ session:sesion, user:sesion.user }, error:null }); },
      signInWithOtp: () => Promise.resolve({ data:{}, error:null }),
      setSession: (s) => { sesion = s; guardar(); return Promise.resolve({ data:{session:s}, error:null }); },
      signOut: () => { window.__reg.signOuts.push({ cliente:id, storageKey:sk, teniaSesion: !!sesion });
                       sesion = null; guardar(); return Promise.resolve({ error:null }); }
    };
    return cli;
  }
  window.supabase = { createClient: cliente };
})();
`;

window.addEventListener('load', async () => {
  /* Alguien entro por el enlace magico del panel Antena: supabase-js dejo la
     sesion bajo la clave POR DEFECTO. El iframe es del mismo origen. */
  const SES = { access_token:'TOKEN-ENLACE-MAGICO', refresh_token:'r',
                expires_at: Math.floor(Date.now()/1000)+3600,
                user:{ id:'u-antena', email:'antena@correo-real.com', user_metadata:{} } };
  localStorage.setItem(CLAVE_DEFECTO, JSON.stringify(SES));
  localStorage.removeItem('faro_auth');
  log('sembrado: localStorage["' + CLAVE_DEFECTO + '"] = sesion de enlace magico');
  log('');

  let html = await (await fetch('/index.html')).text();
  html = html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2"><\/script>/,
                      '<scr'+'ipt>' + DOBLE + '</scr'+'ipt>');
  html = html.replace(/<head>/i, '<head><base href="/">');
  const doc = f.contentDocument; doc.open(); doc.write(html); doc.close();
  await esperar(3000);

  const w = f.contentWindow, d = f.contentDocument, R = w.__reg || {};
  log('¿doble instalado? ' + (R.clientes ? 'si' : 'NO — la medicion no vale'));
  log('CLIENTES: ' + R.clientes.map(c => c.id+' key='+c.storageKey+' nace-con-sesion='+c.sesionAlNacer).join('  |  '));
  try { log('_sb === faroSb ? ' + w.eval('typeof _sb!=="undefined" && _sb && _sb === window.faroSb')); } catch(e){}
  try { log('_sb.__id=' + w.eval('_sb.__id') + '   faroSb.__id=' + w.faroSb.__id); } catch(e){}
  log('');

  const s1 = await w.eval('_sb.auth.getSession()');
  log('ANTES DE CERRAR SESION');
  log('  _sb (el que consulta las tablas) tiene sesion? ' + (s1.data.session ? 'SI · '+s1.data.session.user.email : 'no'));
  log('  verificarSesion() = ' + JSON.stringify(w.verificarSesion()));
  log('  claves: ' + JSON.stringify(Object.keys(localStorage).filter(k=>/auth|faro|sb-/.test(k))));
  log('');

  const btn = d.getElementById('logout-btn');
  log('boton #logout-btn existe? ' + !!btn + ' → se pulsa');
  if (btn) btn.click(); else await w.cerrarSesion();
  await esperar(1200);

  const s2 = await w.eval('_sb.auth.getSession()');
  log('DESPUES DE PULSAR «CERRAR SESION»');
  log('  signOut() se llamo sobre: ' + JSON.stringify(R.signOuts));
  log('  _sb tiene sesion todavia? ' + (s2.data.session ? 'SI · '+s2.data.session.user.email : 'no'));
  log('  ¿sigue el token en localStorage["'+CLAVE_DEFECTO+'"]? ' + (localStorage.getItem(CLAVE_DEFECTO) ? 'SI' : 'no'));
  log('  claves: ' + JSON.stringify(Object.keys(localStorage).filter(k=>/auth|faro|sb-/.test(k))));
  log('  verificarSesion() = ' + JSON.stringify(w.verificarSesion()));
  const app = d.getElementById('app-container'), lg = d.getElementById('login-screen');
  log('  pantalla: login display=' + (lg?getComputedStyle(lg).display:'n/d') + '   app display=' + (app?getComputedStyle(app).display:'n/d'));
  log('');

  const antes = R.toques.length;
  for (const fn of ['initInventario','initFinanzas','initDestellos','chatLoadHistory','initRedaccion']) {
    if (typeof w[fn] === 'function') { try { await w[fn](); } catch(e){ log('  '+fn+' lanzo: '+e.message); } }
    else log('  '+fn+' no existe');
  }
  await esperar(900);
  log('CONSULTAS DEL INTRUSO TRAS EL CIERRE DE SESION:');
  const t = R.toques.slice(antes);
  if (!t.length) log('  (ninguna)');
  t.slice(0,12).forEach(x => log('  ' + x.cliente + ' → ' + x.tabla + '   [' + x.token + ']'));
  log('');

  /* Contraste: el boton «Salir» del panel Antena SI cierra ese cliente. */
  await w.eval('_sb.auth.setSession(' + JSON.stringify(SES) + ')');
  const bAnt = d.getElementById('ant-logout-btn');
  log('CONTRASTE · sesion repuesta en _sb; se pulsa «Salir» de Antena (existe? '+!!bAnt+')');
  if (bAnt) { bAnt.click(); await esperar(900); }
  const s3 = await w.eval('_sb.auth.getSession()');
  log('  _sb tiene sesion? ' + (s3.data.session ? 'SI' : 'no') +
      '   token en localStorage? ' + (localStorage.getItem(CLAVE_DEFECTO) ? 'SI' : 'no'));
  log('');
  log('FIN');
});
</script>
</body>
</html>
