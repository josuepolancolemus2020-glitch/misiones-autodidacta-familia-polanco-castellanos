<body>
<div id="login-screen"><form id="login-form">
  <select id="login-user"><option value="jael">jael</option></select>
  <input id="login-pass" type="password">
  <div id="login-error" hidden></div>
  <button class="login-btn" type="submit">Entrar</button>
</form></div>
<div id="app-container" style="display:none"></div>
<div id="push-banner" style="display:none">
  <span id="push-banner-text"></span><button id="push-banner-btn">A</button><button id="push-banner-dismiss">x</button>
</div>
<pre id="out">midiendo…</pre>

<script>
const L=[],REG=[];
function log(s){L.push(s);const o=document.getElementById('out');if(o)o.textContent=L.join('\n');}
const KEY_PUB='sb_publishable_74mJW5LoxPZOWtIi7YrBEw_0y9JjSfM';
const UID='11111111-1111-1111-1111-111111111111';
function b64u(o){return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
const JWT=b64u({alg:'HS256',typ:'JWT'})+'.'+b64u({sub:UID,role:'authenticated',aud:'authenticated',
  email:'jael@faro.local',exp:2069999999,iat:1700000000,session_id:'s1'})+'.firma';
const SES={access_token:JWT,refresh_token:'r1',token_type:'bearer',expires_in:999999999,expires_at:2069999999,
  user:{id:UID,aud:'authenticated',role:'authenticated',email:'jael@faro.local',
        user_metadata:{miembro:'jael'},app_metadata:{},created_at:'2024-01-01T00:00:00Z'}};

/* Servidor emulado: aplica LITERALMENTE las politicas de
   supabase/sql/seguridad_familia.sql:78-88 sobre push_subscriptions. */
const real=window.fetch.bind(window);
window.fetch=function(input,init){
  const url=String(input&&input.url?input.url:input);
  const met=((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
  const hs=(init&&init.headers)||(input&&input.headers)||{};
  const get=k=>{try{return hs.get?hs.get(k):(hs[k]||hs[k.toLowerCase()]);}catch(_){return null;}};
  const auth=String(get('Authorization')||get('authorization')||'');
  const body=(init&&init.body)?String(init.body):'';

  if(url.indexOf('/auth/v1/token')!==-1)
    return Promise.resolve(new Response(JSON.stringify(SES),{status:200,headers:{'Content-Type':'application/json'}}));
  if(url.indexOf('/auth/v1/user')!==-1)
    return Promise.resolve(new Response(JSON.stringify(SES.user),{status:200,headers:{'Content-Type':'application/json'}}));

  if(url.indexOf('/rest/v1/push_subscriptions')!==-1){
    const rol = auth.indexOf(JWT)!==-1 ? 'authenticated'
              : (auth.indexOf(KEY_PUB)!==-1 ? 'anon' : '?');
    let filas=[]; try{filas=JSON.parse(body);}catch(_){}
    if(!Array.isArray(filas)) filas=[filas];
    const uid = filas.length ? filas[0].user_id : undefined;
    REG.push(met+' push_subscriptions  rol='+rol+'  user_id enviado='+(uid===undefined?'(ausente)':JSON.stringify(uid)));
    /* Politicas: to authenticated, with check (user_id = auth.uid()) */
    if(rol!=='authenticated')
      return Promise.resolve(new Response(JSON.stringify({code:'42501',
        message:'new row violates row-level security policy for table "push_subscriptions"'}),
        {status:403,headers:{'Content-Type':'application/json'}}));
    if(uid!==UID)  /* NULL = auth.uid() -> NULL -> no pasa el WITH CHECK */
      return Promise.resolve(new Response(JSON.stringify({code:'42501',
        message:'new row violates row-level security policy for table "push_subscriptions"'}),
        {status:403,headers:{'Content-Type':'application/json'}}));
    return Promise.resolve(new Response('[]',{status:201,headers:{'Content-Type':'application/json'}}));
  }
  if(url.indexOf('/rest/v1/')!==-1)
    return Promise.resolve(new Response('[]',{status:200,headers:{'Content-Type':'application/json'}}));
  return real(input,init);
};
localStorage.clear();
window.toast=m=>log('    toast(): «'+m+'»');

/* Telefono con permiso ya concedido y una suscripcion push valida */
window.Notification={permission:'granted',requestPermission:async()=>'granted'};
if(!('PushManager' in window)) window.PushManager=function(){};
const fakeSub={toJSON:()=>({endpoint:'https://fcm.googleapis.com/E1',keys:{p256dh:'P256',auth:'AUTH'}})};
Object.defineProperty(navigator,'serviceWorker',{configurable:true,value:{ready:Promise.resolve(
  {pushManager:{getSubscription:async()=>fakeSub,subscribe:async()=>fakeSub}})}});
</script>

<script src="/_dev/vendor/supabase.js"></script>
<script src="/js/auth.js"></script>

<script>
window.addEventListener('load',async()=>{
  await new Promise(r=>setTimeout(r,300));
  log('══ A · el arranque automatico (DOMContentLoaded de push.js) ══');
  log('  peticiones ya vistas por el servidor:');
  REG.forEach(r=>log('    '+r));
  log('  verificarSesion() en ese instante: '+JSON.stringify(verificarSesion()));
  log('');

  log('══ B · con sesion INICIADA de verdad ══');
  log('  iniciarSesion → '+await iniciarSesion('jael','clave-correcta'));
  log('  verificarSesion() → '+JSON.stringify(verificarSesion()));
  log('  ¿verificarSesion() trae el uid de auth.users? '+
      ('id' in (verificarSesion()||{}) ? 'SI' : 'NO — solo '+Object.keys(verificarSesion()||{}).join(', ')));
  REG.length=0;
  const r=await pushSubscribe();
  log('  pushSubscribe() → '+JSON.stringify(r));
  REG.forEach(x=>log('    '+x));
  log('');

  log('══ C · prueba del arreglo que propone el revisor: SOLO añadir user_id ══');
  REG.length=0;
  const conUid=await _sb.from("push_subscriptions").upsert(
    {member_id:'jael',nombre:'Jael',endpoint:'https://fcm.googleapis.com/E1',p256dh:'P',auth:'A',user_id:UID},
    {onConflict:'endpoint'});
  REG.forEach(x=>log('    '+x));
  log('  resultado: '+(conUid.error?('RECHAZADO '+conUid.error.code):'ACEPTADO'));
  log('');

  log('══ D · el arreglo completo: cliente con sesion (faroSb) + user_id ══');
  REG.length=0;
  const bien=await window.faroSb.from("push_subscriptions").upsert(
    {member_id:'jael',nombre:'Jael',endpoint:'https://fcm.googleapis.com/E1',p256dh:'P',auth:'A',user_id:UID},
    {onConflict:'endpoint'});
  REG.forEach(x=>log('    '+x));
  log('  resultado: '+(bien.error?('RECHAZADO '+bien.error.code):'ACEPTADO'));
  log('');

  log('══ E · control: cliente con sesion pero SIN user_id ══');
  REG.length=0;
  const sinUid=await window.faroSb.from("push_subscriptions").upsert(
    {member_id:'jael',nombre:'Jael',endpoint:'https://fcm.googleapis.com/E2',p256dh:'P',auth:'A'},
    {onConflict:'endpoint'});
  REG.forEach(x=>log('    '+x));
  log('  resultado: '+(sinUid.error?('RECHAZADO '+sinUid.error.code):'ACEPTADO'));
  log('');
  log('FIN');
});
</script>
