<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Recursos y fichas</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}
iframe{width:380px;height:400px;border:0;background:#fff;margin-right:8px}</style>
</head>
<body>
<iframe id="m1" src="/misiones/autocapacitacion-metas/modulo-1-panorama.html"></iframe>
<iframe id="m2" src="/misiones/autocapacitacion-metas/modulo-2-frontend.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba que los dos módulos tengan su sección de Recursos con la ficha
   enlazada, y que las fichas existan y traigan su pauta. */
const out = document.getElementById('out');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

async function revisaModulo(id, nombre, fichaEsperada) {
  const d = document.getElementById(id).contentDocument;
  log('\n── ' + nombre.toUpperCase() + ' ──');
  const sec = d.getElementById('s-recursos');
  ok(!!sec, 'tiene la sección de Recursos', 'falta la sección de Recursos');
  ok(d.querySelectorAll('.sec').length === 14, '14 secciones, como las misiones de M.E.T.A.S', 'secciones: ' + d.querySelectorAll('.sec').length);
  ok(!!d.querySelector('.nav-t[data-s="s-recursos"]'), 'está en la barra de navegación', 'no aparece en la barra');
  if (!sec) return;
  const ficha = sec.querySelector('a[href*="fichas/"]');
  ok(ficha && ficha.getAttribute('href').includes(fichaEsperada), 'enlaza su ficha (' + fichaEsperada + ')', 'no enlaza la ficha correcta');
  const fuentes = sec.querySelectorAll('ul a[href^="http"]');
  ok(fuentes.length >= 4, fuentes.length + ' fuentes verificables enlazadas', 'solo ' + fuentes.length + ' fuentes');
  /* La ficha debe existir de verdad, no solo estar enlazada */
  const url = new URL(ficha.getAttribute('href'), document.getElementById(id).src).pathname;
  const r = await fetch(url);
  const txt = r.ok ? await r.text() : '';
  ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
  ok(/Pauta completa de respuestas/.test(txt), 'la ficha trae su pauta de respuestas', 'la ficha no trae pauta');
  ok(/css\/ficha\.css/.test(txt), 'la ficha usa la hoja común de fichas', 'la ficha no enlaza la hoja común');
  /* Las dos fichas de Autocapacitación nacieron con tres páginas y pasaron a
     las diez de la norma 6 sin que esta sonda se enterara: llevaba meses en
     rojo por una expectativa vieja, no por un fallo. */
  ok((txt.match(/class="pagina"/g) || []).length === 10, 'la ficha tiene 10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
}

window.addEventListener('load', async () => {
  await esperar(1200);
  try {
    await revisaModulo('m1', 'Módulo 1 · Panorama', 'ficha-autocap-modulo-1.html');
    await revisaModulo('m2', 'Módulo 2 · El frontend', 'ficha-autocap-modulo-2.html');
    const hoja = await fetch('/fichas/css/ficha.css');
    log('\n── HOJA DE FICHAS ──');
    ok(hoja.ok, 'css/ficha.css responde (' + hoja.status + ')', 'la hoja común no responde');
    const css = hoja.ok ? await hoja.text() : '';
    ok(/@page \{ size: letter/.test(css), 'está configurada para papel carta', 'no fija el tamaño carta');
    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message); }
});
</script>
</body>
</html>
