<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Expediente Dorado, etapa 5</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-dorado-escoces-dorado/escoces-dorado.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 5 de la Ruta del Expediente Dorado (Crítica al
   Capitalismo, materia 27 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y SEIS lecturas, con las dos
   entrevistas de la norma 5-quinquies y su etiqueta de «nunca ocurrió», y el
   CAREO de la norma 5-nonies, que no imita a nadie) y las TRES BATERÍAS, que
   desde la norma 5-nonies viven DENTRO de cada lectura y no juntas al final:
   30 de comprensión lectora, 12 de completar y 12 de análisis complejo, es
   decir 5, 2 y 2 por voz. Con la impresión comprobada de verdad.

   La REGLA DEL ESTUDIO MAYOR rige también aquí, y en esta etapa se cruza con
   su propio contenido más que en ninguna otra, porque la etapa entera trata
   de cómo se cita un clásico. Se comprueba fuente por fuente: las DOS OBRAS
   de Smith como FUENTES PRIMARIAS, con sus años (1759 y 1776) y con las
   direcciones que la etapa exige de memoria, es decir libro IV capítulo 2
   para la ÚNICA aparición de la mano invisible, libro I capítulo 2 para el
   carnicero, libro I capítulo 10 para los del mismo oficio y libro I
   capítulo 8 para los patrones; la SEXTA EDICIÓN DE 1790 como el dato que
   desarma la excusa de la obra de juventud superada; la GLASGOW EDITION
   (Oxford, desde 1976) como edición académica de referencia, que aquí se
   nombra porque las citas van PARAFRASEADAS y eso se declara; Viner (1927)
   como CLÁSICO DE LA INTERPRETACIÓN, y de Chicago, es decir no del bando al
   que le convenía; Rothschild (2001) como HISTORIA INTELECTUAL; Stigler
   (1971) como EL ACERO DEL BANDO CONTRARIO, que discute la coherencia y no
   los pasajes; y Ross (1995) como BIOGRAFÍA ESTÁNDAR.

   Cuatro cuidados del compendio se comprueban a máquina porque gobiernan la
   misión. Uno: NINGUNA CITA SIN OBRA, AÑO Y CAPÍTULO. Dos: LA CONTRACITA es
   la prueba de lectura, y sin ella la etapa no está enseñada. Tres: el test
   CORTA EN LAS DOS DIRECCIONES, contra el devoto y contra el detractor.
   Cuatro: DESCUBRIR QUE A UN AUTOR LO CITAN MAL NO LO VUELVE ALIADO DE UNO,
   que es el error simétrico y en esta etapa es el más dulce de todos.

   Y el CERO PARTIDISMO HONDUREÑO ACTUAL, con la regla propia de la materia:
   la cita de autoridad entra COMO CATEGORÍA y no como caso con nombre
   propio. Por eso la comprobación descuenta antes la frase donde se enuncia
   esa misma regla, que nombra al partido justamente para decir que no se le
   pone etiqueta a ninguno. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Expediente Dorado · Etapa 5 de 7/.test(d.body.textContent), 'se presenta como etapa 5 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 4 de esta misma ruta. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-dorado-gran-fuga"], a[href*="ruta-dorado-fallas-maquina"], a[href*="ruta-dorado-dinero-no-compra"], a[href*="ruta-dorado-dos-facturas"], a[href*="ruta-rojo-acero-juicio"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/hoja de la factura|curva del elefante|tasa de descuento|identidad de Kaya/i.test(cuerpoSinEnlaces),
       'sin las piezas de la etapa 4 (las dos facturas)', 'queda la estructura de la etapa 4 de esta ruta');
    const fuenteCruda = await (await fetch('/misiones/ruta-dorado-escoces-dorado/escoces-dorado.html')).text();
    /* Mismo criterio que arriba, pero sobre el archivo: fuera los puntos de
       Recursos que remiten a las etapas hermanas, porque ahí sí se las nombra
       a propósito. */
    const fuente = fuenteCruda.replace(/<li>(?:(?!<\/li>)[\s\S])*?ruta-dorado-(?:gran-fuga|fallas-maquina|dinero-no-compra|dos-facturas)[\s\S]*?<\/li>/g, '');
    ok(!/Piketty|Rognlie|Corlett|Keeling|IPCC|Weitzman|Pindyck|Chetty|Milanović/i.test(fuente),
       'y en la prosa de la misión no queda ni un nombre de aquel temario', 'queda vocabulario de la etapa 4 en la prosa');
    ok(!/hoja del bien|hoja de la falla|hoja de la cifra|monopsonio|Titmuss|Sandel|Deaton/i.test(fuente),
       'ni de las etapas 1, 2 y 3 de la ruta', 'queda vocabulario de las etapas anteriores en la prosa');
    ok(!/🌡️|🩸|🔧|📒/.test(cuerpoSinEnlaces), 'sin los emojis de las misiones molde', 'queda un emoji de otra etapa fuera de los enlaces');
    ok(!/La Mettrie|brocha gorda|batán|hombre de paja|Holodomor/i.test(cuerpoSinEnlaces),
       'sin restos de otras misiones del arco', 'queda vocabulario de otra misión del Estudio Mayor');
    /* Y lo que SÍ tiene que quedar: las cuatro etapas anteriores remitidas. */
    ok(/etapa 1/i.test(d.body.textContent) && /etapa 2/i.test(d.body.textContent) && /etapa 3/i.test(d.body.textContent) && /etapa 4/i.test(d.body.textContent),
       'las cuatro etapas anteriores se remiten', 'no se remite a las etapas anteriores');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-dorado-gran-fuga"]') && !!d.querySelector('#s-recursos a[href*="ruta-dorado-fallas-maquina"]') && !!d.querySelector('#s-recursos a[href*="ruta-dorado-dinero-no-compra"]') && !!d.querySelector('#s-recursos a[href*="ruta-dorado-dos-facturas"]'),
       'Recursos enlaza las cuatro etapas anteriores de la ruta', 'falta el enlace a alguna etapa anterior');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-rojo-acero-juicio"]'),
       'y sigue enlazando el expediente gemelo', 'falta el enlace al expediente gemelo');
    ok(/regla del acero/i.test(d.body.textContent), 'y nombra la regla del acero, que aquí se aplica a Stigler', 'no se nombra la regla del acero');
    /* El guion largo se busca por su código y no escrito, aquí y en todas
       las comprobaciones de más abajo: si la sonda lo llevara literal, el
       grep con el que se revisa el repositorio la contaría a ella entre los
       infractores y el aviso dejaría de servir para lo que se hizo. */
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');
    /* Cero partidismo hondureño actual. Se descuenta antes la frase donde se
       ENUNCIA la regla de selección, que nombra al partido justamente para
       decir que no se le pone etiqueta a ninguno. */
    const sinRegla = d.body.textContent.replace(/no se etiqueta a ning[úu]n funcionario, a ning[úu]n partido ni a nadie en campaña/gi, '')
                                       .replace(/a una persona con pleito abierto/gi, '');
    ok(!/\b(partido|diputad|alcalde|candidat)[a-zóí]*\b/i.test(sinRegla),
       'ni un político vivo ni un partido nombrado (cero partidismo actual)', 'aparece un cargo o un partido de la política de hoy');
    ok(/como categoría/i.test(d.body.textContent) && /nombre propio/i.test(d.body.textContent),
       'y la regla de selección: la cita de autoridad entra como categoría', 'falta la regla de selección de esta materia');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/teoría de los sentimientos morales/i.test(texto0) && /1759/.test(texto0),
       '«La teoría de los sentimientos morales» (1759), con su año', 'falta la primera obra con su año');
    ok(/riqueza de las naciones/i.test(texto0) && /1776/.test(texto0),
       '«La riqueza de las naciones» (1776), con su año', 'falta la segunda obra con su año');
    ok(/cinco libros/i.test(texto0), 'y dicho que tiene cinco libros dentro', 'no se dice que la obra tiene cinco libros');
    /* La pieza que más fácil se pierde, y la que esta etapa entera exige. */
    ok(/una sola vez|una vez/i.test(texto0) && /libro IV/i.test(texto0) && /capítulo 2/i.test(texto0),
       'la mano invisible aparece UNA vez, y con su dirección exacta', 'no se dice cuántas veces aparece ni dónde');
    ok(/invertir en su propio país|su propio país/i.test(texto0),
       'y qué dice de verdad ese párrafo', 'no se cuenta de qué habla el párrafo de la mano invisible');
    ok(/libro I/i.test(texto0) && /capítulo 10/i.test(texto0) && /conspiración/i.test(texto0),
       'la contracita del libro I, capítulo 10, con su dirección', 'falta la contracita de los del mismo oficio');
    ok(/capítulo 8/i.test(texto0) && /(patrones|combinación)/i.test(texto0),
       'y el libro I, capítulo 8, con la combinación de los patrones', 'falta el pasaje de los patrones');
    ok(/libro V/i.test(texto0) && /(impuesto|contribuyan|proporción)/i.test(texto0),
       'y el libro V, con los impuestos', 'falta el libro V y los impuestos');
    ok(/educación pública/i.test(texto0), 'y la educación pública que Smith deduce del libro V', 'falta la educación pública');
    ok(/sexta edición/i.test(texto0) && /1790/.test(texto0),
       'la sexta edición de 1790, que desarma la excusa de la obra de juventud', 'falta el dato de la sexta edición');
    ok(/Glasgow/.test(texto0) && /1976/.test(texto0),
       'la Glasgow Edition, con su año de arranque', 'falta la edición académica de referencia');
    ok(/parafrase/i.test(texto0), 'y la honradez declarada: las citas de esta misión van parafraseadas', 'no se declara que las citas son paráfrasis');
    ok(/Viner/.test(texto0) && /1927/.test(texto0) && /Journal of Political Economy/.test(texto0),
       'Viner (1927) con la revista donde publicó', 'falta Viner con su fuente');
    ok(/Chicago/.test(texto0), 'y de dónde venía, que es el detalle que hay que decir en voz alta', 'no se dice de dónde venía Viner');
    ok(/Rothschild/.test(texto0) && /2001/.test(texto0) && /Economic Sentiments/.test(texto0),
       'Rothschild (2001) con el título de su obra', 'falta Rothschild con su obra');
    ok(/Stigler/.test(texto0) && /1971/.test(texto0),
       'Stigler (1971), el acero del bando contrario', 'falta el acero de Stigler');
    ok(/coherencia|coherente/i.test(texto0) && /capturan/i.test(texto0),
       'y su argumento dicho entero: discute la coherencia, no los pasajes', 'no se cuenta qué sostiene Stigler');
    ok(/Ross/.test(texto0) && /1995/.test(texto0), 'Ross (1995), la biografía estándar', 'falta la biografía estándar');
    ok(/1778/.test(texto0) && /aduana/i.test(texto0), 'y la ironía documentada de la aduana, desde 1778', 'falta el dato de la aduana');
    ok(/pastiche/i.test(texto0) && /no obra de esos autores/i.test(texto0),
       'y el pastiche de las lecturas declarado', 'el pastiche no se declara en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 16,
       'los cuatro bancos de la evaluación (15, 15, 15 y 16 pares)', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'libros,carnicero,incomodo,test', 'laboratorio con las 4 piezas de la etapa', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 10, 'los 10 momentos del camino del límite', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    ok(/faro_dorado_escoces/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/más citado y menos leído/i.test(texto), 'el planteamiento: el autor más citado y menos leído', 'falta el planteamiento de la etapa');
    ok(/obra/i.test(texto) && /capítulo/i.test(texto) && /párrafo/i.test(texto),
       'la regla de la etapa: obra, capítulo y párrafo', 'falta la regla que ordena la etapa');
    ok(/contracita/i.test(texto), 'la contracita, con ese nombre', 'falta la contracita');
    ok(/citarlo contra sí mismo|que le estorbe|que le estorba|se la quita/i.test(texto),
       'y explicada como la prueba de lectura', 'no se explica para qué sirve la contracita');
    ok(/dos libros/i.test(texto) && /1759/.test(texto) && /1776/.test(texto),
       'los dos libros con sus años', 'faltan los dos libros con sus años');
    ok(/espectador imparcial/i.test(texto), 'y el espectador imparcial del primero', 'falta el espectador imparcial');
    ok(/sexta edición/i.test(texto) && /1790/.test(texto),
       'la sexta edición de 1790, y qué excusa desarma', 'falta el dato de la sexta edición');
    ok(/una sola vez/i.test(texto) && /libro IV/i.test(texto),
       'que la mano invisible aparece una sola vez, y dónde', 'no se dice cuántas veces aparece');
    ok(/carnicero/i.test(texto) && /panadero/i.test(texto), 'la frase del carnicero y el panadero', 'falta la frase del carnicero');
    ok(/no necesita santos|no hace falta bondad/i.test(texto),
       'y lo que afirma: el sistema no necesita santos', 'no se dice qué afirma la frase del carnicero');
    ok(/no hace falta ley|no necesite reglas|no necesita reglas/i.test(texto),
       'y lo que NO afirma: que no hagan falta reglas', 'no se dice qué no afirma la frase del carnicero');
    ok(/conspiración contra el público/i.test(texto), 'el pasaje de los del mismo oficio', 'falta el pasaje del capítulo 10');
    ok(/combinación tácita/i.test(texto), 'el de la combinación tácita de los patrones', 'falta el pasaje del capítulo 8');
    ok(/floreciente y feliz/i.test(texto) && /pobres y miserables/i.test(texto),
       'y la frase que ningún cartel enmarca, del mismo capítulo 8', 'falta la frase de la sociedad floreciente');
    ok(/algo más que en esa proporción|algo más que en proporción/i.test(texto),
       'los impuestos del libro V, en sus propias palabras', 'falta el pasaje de los impuestos');
    ok(/estúpido e ignorante/i.test(texto), 'el lado oscuro de la división del trabajo', 'falta el pasaje de la división del trabajo');
    ok(/defensa/i.test(texto) && /justicia/i.test(texto) && /obras/i.test(texto),
       'y los tres deberes del soberano', 'faltan los tres deberes del soberano');
    ok(/test de la fecha/i.test(texto) && /cinco preguntas/i.test(texto),
       'el test de la fecha y del libro, con sus cinco preguntas', 'falta el test con su nombre');
    ok(/hoja de la cita/i.test(texto), 'la hoja de la cita, con ese nombre', 'falta la hoja de la cita');
    ok(/no lo (convierte|vuelve) (en )?aliado/i.test(texto), 'y el aviso contra el error simétrico', 'falta el aviso del error simétrico');
    ok(/en las dos direcciones/i.test(texto), 'y que el test corta en las dos direcciones', 'no se dice que el test corta en las dos direcciones');
    /* Las fronteras declaradas de esta etapa. */
    ok(/Economía política/i.test(texto) && /(Ricardo|Keynes|pensamiento económico)/i.test(texto),
       'la historia del pensamiento económico remitida a Economía política', 'no se remite la historia del pensamiento');
    ok(/Filosofía/.test(texto), 'y la filosofía moral remitida a Filosofía', 'no se remite la filosofía moral');
    ok(/etapa 6/i.test(texto) && /neoliberal/i.test(texto), 'y la palabra «neoliberal» remitida a la etapa 6', 'la etapa no dice qué viene después');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/don Tulio/i.test(tg), 'el guion tiene personaje, y no es una clase hablada', 'el guion no tiene personaje');
      ok(/7:10|6:20 a 7:10/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(18\d\d|19\d\d|20\d\d)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/1759/.test(tg) && /1776/.test(tg) && /1790/.test(tg) && /1927/.test(tg) && /1971/.test(tg) && /1976/.test(tg) && /2001/.test(tg),
         'el guion trae las fechas de la etapa', 'al guion le faltan fechas');
      /* El guion tiene que dar la dirección de la cita y traer la
         contracita, que es la destreza de la etapa. */
      ok(/una sola vez|una vez/i.test(tg) && /libro IV|cinco libros/i.test(tg),
         'y dice que la frase aparece una vez, con su sitio', 'el guion no dice cuántas veces aparece');
      ok(/conspiración contra el público/i.test(tg),
         'y trae la contracita del libro I, capítulo 10', 'el guion no trae la contracita');
      ok(/cinco preguntas/i.test(tg) && /contracita/i.test(tg),
         'y enseña el test con sus cinco preguntas', 'el guion no enseña el test');
      ok(/no lo (convierte|vuelve) (en )?aliado|de los nuestros/i.test(tg),
         'y contesta la objeción del error simétrico', 'el guion no contesta la objeción del público');
      ok(/Stigler/.test(tg), 'y pone el acero del bando contrario', 'el guion no pone el acero');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      /* Seis tarjetas, ni cinco ni siete: la sexta es el careo de la norma
         5-nonies, y sin ella la sección vuelve a contar solo posturas ya
         decididas. Se cuentan por sus ids, que son los que el aparato de
         lecturas y la impresión usan para reconocerlas. */
      const clavesLect = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
      ok(clavesLect.every(k => !!d.getElementById('lect-' + k)),
         'las seis tarjetas de lectura están, con sus ids',
         'faltan tarjetas: ' + clavesLect.filter(k => !d.getElementById('lect-' + k)).join(', '));
      ok(d.querySelectorAll('#s-lecturas .card[id^="lect-"]').length === 6,
         'y no hay ninguna de más', 'tarjetas de lectura: ' + d.querySelectorAll('#s-lecturas .card[id^="lect-"]').length);
      ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl),
         'la tarjeta de entrada ya anuncia seis y no cinco', 'la entrada de Lecturas sigue anunciando cinco');
      ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
         'y avisa de que cada lectura trae sus preguntas debajo y de que las seis empiezan plegadas',
         'la entrada no explica las preguntas de cada lectura ni el plegado');
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl), 'las tres voces de estilo están nombradas', 'faltan las voces');
      ok(/Soler Serrano/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl), 'y las voces de las dos entrevistas también', 'faltan las voces de las entrevistas');
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      /* La etiqueta de la tarjeta de entrada tiene que separar los dos
         estatus: los CINCO PRIMEROS son pastiche declarado (y dos de ellos,
         entrevistas imaginadas), y el SEXTO es un careo que no imita a nadie
         y cuyos turnos firman papeles. Meterlos todos en el mismo saco haría
         que el careo pareciera un pastiche más, que es justo lo que no es. */
      ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis lecturas en el mismo saco');
      ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
      ok(/papeles/i.test(tl) && /no personas/i.test(tl),
         'y dice que en el careo los turnos los firman papeles y no personas', 'la etiqueta no dice cómo firma sus turnos el careo');
      ok(/Los subrayados de mi padre/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/escrutinio/.test(tl) && /barbero/.test(tl) && /sobrina/.test(tl), 'el capítulo cervantino está, con el escrutinio de la librería adentro', 'falta el capítulo cervantino');
      ok(/La especie que cita sin leer/.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las dos entrevistas de la norma 5-quinquies, con sus ids fijos y su
         etiqueta reforzada: con entrevistados de verdad no basta declarar la
         voz, hay que declarar que EL ENCUENTRO NUNCA OCURRIÓ. */
      const cardEntrev = d.getElementById('lect-entrevista');
      const cardGala = d.getElementById('lect-gala');
      ok(!!cardEntrev, 'la entrevista de la casa está, con su id lect-entrevista', 'falta la tarjeta lect-entrevista');
      ok(!!cardGala, 'la conversación del Loco de la Colina está, con su id lect-gala', 'falta la tarjeta lect-gala');
      ok(!!cardEntrev && /nunca ocurrió/i.test((cardEntrev.querySelector('.lect-nota') || {}).textContent || ''),
         'la nota de la entrevista declara que el encuentro nunca ocurrió', 'la entrevista no declara la ficción del encuentro');
      ok(!!cardGala && /nunca ocurrió/i.test((cardGala.querySelector('.lect-nota') || {}).textContent || ''),
         'y la de la conversación también', 'la conversación no declara la ficción del encuentro');
      ok(/El hombre que mandó quemar sus papeles/.test(tl) && /SOLER SERRANO/.test(tl) && /SMITH/.test(tl),
         'la entrevista trae su título y sus dos hablantes en mayúsculas', 'la entrevista no tiene forma de entrevista');
      ok(/La mitad que nadie enmarca/.test(tl) && /QUINTERO/.test(tl) && /GALA/.test(tl),
         'la conversación trae su título y sus dos hablantes en mayúsculas', 'la conversación no tiene forma de diálogo');
      ok(/A Fondo/.test(tl) && /1976 a 1981/.test(tl) && /Kirkcaldy/.test(tl) && /1723/.test(tl),
         'ancla real: el entrevistador con su programa y el entrevistado con sus fechas', 'faltan las señas reales de la entrevista');
      ok(/1940/.test(tl) && /2022/.test(tl) && /1930/.test(tl) && /2023/.test(tl),
         'ancla real: las fechas vitales de Quintero y de Gala', 'faltan las fechas de Quintero y Gala');
      ok(!!cardGala && /\(Silencio/.test(cardGala.textContent),
         'los silencios de Quintero van escritos como acotación', 'la conversación no trae los silencios en acotación');
      /* Las rayas de diálogo del capítulo cervantino son guiones largos y
         violan la norma 1-bis: van en paréntesis. */
      ok(/\(dijo el cura\)|\(respondió ella\)|\(dijo la sobrina\)|\(replicó el barbero\)|\(dijo el barbero\)|\(prosiguió Sancho\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL, y en esta etapa
         eso significa que cada atribución tiene que ser exacta. */
      ok(/reales y comprobables/i.test(tl) && /citas inventadas/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/1759/.test(tl) && /1776/.test(tl), 'anclas reales: los años de las dos obras', 'faltan los años de las dos obras dentro de los textos');
      ok(/libro IV/i.test(tl) && /capítulo 2/i.test(tl), 'ancla real: la dirección de la mano invisible', 'falta la dirección de la mano invisible dentro de los textos');
      ok(/capítulo 10/i.test(tl) && /conspiración/i.test(tl), 'ancla real: el libro I capítulo 10', 'falta la contracita dentro de los textos');
      ok(/capítulo 8/i.test(tl) || /pobres y miserables/i.test(tl), 'ancla real: el libro I capítulo 8', 'falta el pasaje de los salarios dentro de los textos');
      ok(/libro V/i.test(tl) && /(proporción|estúpido e ignorante)/i.test(tl), 'ancla real: el libro V, con sus dos pasajes', 'falta el libro V dentro de los textos');
      ok(/sexta edición/i.test(tl) && /1790/.test(tl), 'ancla real: la sexta edición de 1790', 'falta la sexta edición dentro de los textos');
      ok(/Viner/.test(tl) && /1927/.test(tl) && /Journal of Political Economy/.test(tl),
         'ancla real: Viner (1927) con su revista', 'falta Viner dentro de los textos');
      ok(/Rothschild/.test(tl) && /2001/.test(tl) && /Economic Sentiments/.test(tl),
         'ancla real: Rothschild (2001) con su título', 'falta Rothschild dentro de los textos');
      ok(/Stigler/.test(tl) && /1971/.test(tl), 'ancla real: Stigler (1971), el acero', 'falta Stigler dentro de los textos');
      ok(/Glasgow/.test(tl) && /1976/.test(tl), 'ancla real: la Glasgow Edition desde 1976', 'falta la edición académica dentro de los textos');
      ok(/Ross/.test(tl) && /1995/.test(tl), 'ancla real: Ross (1995), la biografía', 'falta la biografía dentro de los textos');
      ok(/1778/.test(tl) && /aduana/i.test(tl), 'ancla real: la aduana de Edimburgo desde 1778', 'falta el dato de la aduana dentro de los textos');
      ok(/escrutinio/i.test(tl) && /1605/.test(tl) && /(capítulo sexto|sexto de la primera parte)/i.test(tl),
         'ancla real declarada: el donoso escrutinio (Quijote I, 6, de 1605)', 'falta el ancla real del capítulo cervantino');
      /* Y las anclas cervantinas de las otras misiones NO se repiten. */
      ok(!/batanes|rebuzno|bodas de Camacho|yelmo de Mambrino|galeotes|Edad de Oro|Montesinos|Juan Haldudo|encina|báculo|azotes|Barataria/i.test(tl),
         'no repite las anclas cervantinas ya usadas en la serie', 'repite un ancla ya usada en otra misión');
      /* Las tres lecturas deben ENSEÑAR el tema, no solo sonar bonito */
      ok(/(de qué libro|capítulo|dirección)/i.test(tl) && /(contracita|le estorbe|apunte al lado contrario)/i.test(tl),
         'las lecturas enseñan el tema de la etapa', 'las lecturas no tocan el tema');
      ok(/(leer|abrir|leído)/i.test(tl), 'y traen la lección de abrir el libro en vez de repetir la frase', 'los textos no cargan la lección de leer');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie: enfrenta
       dos posturas que alguien sostiene de verdad en la literatura. Por eso
       su etiqueta es distinta y por eso aquí se exige lo contrario que a los
       otros cinco: que NO diga «no es obra de ese autor» (no hay autor
       imitado) y que sí declare que los turnos los firman papeles. En ESTA
       etapa la regla pesa doble: la misión entera enseña a cazar frases
       puestas en boca de quien no las dijo, y los dos lados de esta disputa
       los sostienen investigadores vivos. Ponerles diálogo inventado sería
       cometer, en la lectura número seis, el delito de las otras cinco. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent;
      const notaC = (careo.querySelector('.lect-nota') || {}).textContent || '';
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no poner palabras inventadas en boca de nadie|no se le pone a nadie una palabra en la boca|no personas/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(/tercera persona/i.test(notaC), 'y que los autores se citan en tercera persona, como fuentes', 'el careo no declara que cita en tercera persona');
      ok(/mejor versión/i.test(notaC), 'y que cada postura va en su mejor versión (el acero antes del juicio)', 'el careo no declara la regla del acero');
      /* Las seis partes obligatorias, y en su orden (norma 5-nonies). */
      ok(/pregunta en disputa/i.test(tc), '1. plantea la pregunta en disputa', 'al careo le falta la pregunta en disputa');
      ok(/LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc), '2 y 3. las dos posturas tienen turno propio', 'al careo le falta una de las dos posturas');
      ok(/(Vienen las réplicas|réplicas)/i.test(tc), '4. hay réplicas en las dos direcciones', 'al careo le faltan las réplicas');
      ok(/(aceptan las dos|lo que las dos posturas aceptan|terreno común)/i.test(tc), '5. dice qué aceptan las dos posturas', 'al careo le falta el terreno común');
      ok(/sigue en disputa/i.test(tc), '6. dice qué sigue en disputa', 'el careo no dice qué queda sin resolver');
      ok(/dato lo resolvería|dato resolvería|qué dato/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');
      /* Las anclas de ESTA disputa, que son reales y comprobables, con sus
         revistas y sus números: una disputa sin fuentes citadas por autor y
         año no es un careo, es un ejercicio de redacción. */
      ok(/Rothschild/.test(tc) && /1994/.test(tc) && /American Economic Review/.test(tc),
         'ancla real: Rothschild (1994) en la American Economic Review', 'falta el artículo de 1994 de Rothschild');
      ok(/Economic Sentiments/.test(tc) && /2001/.test(tc), 'ancla real: «Economic Sentiments» (2001)', 'falta el libro de 2001 de Rothschild');
      ok(/Kennedy/.test(tc) && /2009/.test(tc) && /Econ Journal Watch/.test(tc),
         'ancla real: Kennedy (2009) en Econ Journal Watch', 'falta Kennedy con su revista');
      ok(/Samuels/.test(tc) && /Erasing the Invisible Hand/.test(tc) && /2011/.test(tc),
         'ancla real: Samuels, «Erasing the Invisible Hand» (2011)', 'falta Samuels');
      ok(/Klein/.test(tc) && /Lucas/.test(tc) && /Economic Affairs/.test(tc) && /2011/.test(tc),
         'ancla real: Klein y Lucas (2011) en Economic Affairs', 'falta el lado de Klein y Lucas con su revista');
      ok(/Tuc[ií]dides/.test(tc), 'ancla real: el elogio de Smith a Tucídides en sus lecciones de retórica', 'falta el apoyo retórico de Klein y Lucas');
      ok(/Arrow/.test(tc) && /Hahn/.test(tc) && /1971/.test(tc) && /Nozick/.test(tc) && /1974/.test(tc),
         'ancla real: Arrow y Hahn (1971) y Nozick (1974)', 'faltan los testigos anteriores a la disputa');
      /* Y lo que la norma exige de esos tres: entran como TESTIGOS, no como
         parte. Colocarlos de litigantes sería inventarles una postura en un
         pleito en el que nunca entraron, que es la falta de esta etapa. */
      ok(/testigos/i.test(tc) || /nunca tomaron parte/i.test(notaC) || /Ninguno de los tres entró en esta disputa/i.test(tc),
         'y entran declarados como testigos, no como parte litigante', 'el careo mete en el pleito a quien nunca entró en él');
      ok(/Samuelson/.test(tc) && /1948/.test(tc), 'ancla real: el manual de Samuelson (1948), la fecha de la fama', 'falta la genealogía del emblema');
      ok(/Viner/.test(tc) && /1927/.test(tc) && /Journal of Political Economy/.test(tc),
         'ancla real: Viner (1927) en el terreno común', 'falta Viner dentro del careo');
      ok(/Darwin|origen de las especies/i.test(tc) && /1859/.test(tc),
         'ancla real: el ejemplo de método de 1859', 'falta el ejemplo de Darwin');
      ok(/Cannan/.test(tc) && /1896/.test(tc) && /Lothian/.test(tc) && /1958/.test(tc),
         'ancla real: los cuadernos de clase de Cannan (1896) y Lothian (1958)', 'falta la comprobación de los papeles');
      /* Que las dos posturas estén de verdad, y no una y su caricatura. */
      ok(/Concedid/i.test(tc) && /se acepta/i.test(tc), 'cada lado le concede algo al otro', 'ningún lado concede nada: es un careo de paja');
      ok(/una sola vez/i.test(tc) && /libro IV/i.test(tc), 'las dos aceptan el conteo y su dirección', 'el careo no fija lo que nadie discute');
      ok(/sin obra, libro y capítulo/i.test(tc) || /las dos prohíben/i.test(tc),
         'y las dos prohíben usar la frase suelta, gane quien gane', 'el careo no deja la lección que no depende del resultado');
    }

    log('\n── LAS BATERÍAS DE LAS LECTURAS (normas 5-quater, 5-quinquies y 5-nonies) ──');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'existe el logro de las lecturas (lect_master)', 'falta el logro lect_master');
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos baterías POR
       LECTURA. Sin esto, una lectura se publica con su tarjeta de preguntas
       vacía y nadie se entera hasta que un alumno la abre. Y las etiquetas se
       escriben exactamente así: el aparato reparte por ellas. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis sin pauta o con pauta corta');
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada una dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* El número de cabeza («7.») era el del banco global. Con dos por lectura
       ese número mentiría, porque cada lectura empieza a contar por uno. */
    ok(dentro('lectAnalisisBank.every(q => !/^\\s*\\d+\\./.test(q.q))'),
       'y ninguna arrastra el número del banco viejo', 'algún análisis sigue numerado con el número global');

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');
    w.go('s-lecturas'); await esperar(400);
    ok(typeof w.FaroLecturas === 'object', 'el aparato de lecturas arrancó', 'FaroLecturas no existe');
    const voces = w.FaroLecturas.voces();
    ok(voces.length === 6, 'el aparato monta las seis lecturas', 'monta ' + voces.length);
    ok(voces.every(v => v.comprension === 5 && v.completar === 2 && v.analisis === 2),
       'y cada una con sus 5, 2 y 2 preguntas', 'alguna lectura se queda sin preguntas: '
       + voces.map(v => v.clave + ' ' + v.comprension + '/' + v.completar + '/' + v.analisis).join(' · '));
    /* Todas cerradas al entrar: es la mitad del encargo. Y se comprueba con
       el alto calculado, no con el atributo, porque ya pasó una vez que un
       display de la tarjeta le ganaba a [hidden] y el pliegue se veía
       abierto igual (las etapas de «Mis Rutas»). */
    ok(voces.every(v => !v.abierta), 'las seis empiezan plegadas', 'alguna empieza abierta');
    const cuerpos = [...d.querySelectorAll('#s-lecturas .lect-cuerpo')];
    ok(cuerpos.length === 6, 'cada lectura tiene su pliegue', 'pliegues: ' + cuerpos.length);
    ok(cuerpos.every(c => w.getComputedStyle(c).display === 'none'),
       'y de verdad no ocupan sitio (display calculado, no solo [hidden])', 'algún pliegue se ve abierto');
    const indice = d.getElementById('lectIndice');
    ok(!!indice, 'existe el índice para elegir lectura', 'falta el índice');
    ok(!!indice && indice.querySelectorAll('.lect-ind-btn').length === 6, 'con sus seis botones', 'botones del índice: ' + (indice ? indice.querySelectorAll('.lect-ind-btn').length : 0));
    /* La leyenda del código de colores va arriba del todo, antes de subrayar
       nada (norma 5-septies). En las misiones con lecturas nunca aparecía,
       porque el marcador la buscaba dentro de la primera zona y la primera
       zona ES una tarjeta. Ahora vive en el índice. */
    ok(!!indice && !!indice.querySelector('.fm-leyenda'), 'y con la leyenda del código de colores', 'la leyenda no está arriba');

    log('\n── ABRIR UNA LECTURA, Y SUS PROPIAS PREGUNTAS ──');
    d.querySelector('#lectIndice .lect-ind-btn[data-va="debate"]').click();
    await esperar(500);
    const careoCard = d.getElementById('lect-debate');
    ok(careoCard.classList.contains('lect-abierta'), 'tocar el índice abre esa lectura', 'no se abrió');
    ok(w.getComputedStyle(careoCard.querySelector('.lect-cuerpo')).display !== 'none', 'y su pliegue se ve', 'el pliegue sigue oculto');
    /* Acordeón: abrir una cierra la anterior, o volvemos a las veinte
       pantallas de alto que el encargo viene a quitar. */
    d.querySelector('#lectIndice .lect-ind-btn[data-va="borges"]').click();
    await esperar(400);
    ok(!careoCard.classList.contains('lect-abierta'), 'y abrir otra cierra la anterior', 'quedan dos abiertas a la vez');

    const bloques = careoCard.querySelectorAll('.lect-bloque');
    ok(bloques.length === 3, 'cada lectura trae sus tres baterías dentro', 'baterías del careo: ' + bloques.length);
    ok(!d.querySelector('#lcQ, #lfQ, #laQ'), 'y ya no hay una batería suelta al final de la sección', 'sigue la batería vieja al final');

    /* Contestar de verdad, en la lectura de Borges, y que pague XP. */
    const borgesCard = d.getElementById('lect-borges');
    const bloqueC = borgesCard.querySelector('.lect-bloque[data-b="c"]');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    log('\n── LA MARCA DE LECTURA, QUE LA PONE EL LECTOR (norma 5-nonies) ──');

    const btnAqui = d.getElementById('fmBtnAqui');

    ok(aqui.length && aqui[0].textContent.length > 0 && parrL.textContent.indexOf(aqui[0].textContent) >= 0,
       'sobre las palabras del texto, no sobre el párrafo entero', 'la marca no cayó dentro del párrafo');
    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖, aunque cruce una negrita', 'salió más de un marcador');
    const lug = w.FaroMarcador.lugar();
    ok(!!lug && lug.l === 'borges', 'el marcador la apunta', 'no apuntó nada: ' + JSON.stringify(lug));
    ok(!!w.localStorage.getItem(dentro('SAVE_KEY') + '_lugar'), 'y la guarda en este aparato', 'no quedó guardada');
    /* No puede añadir alto: en una ficha, un renglón de más parte una

    /* Y lo que costó media hora encontrar la primera vez: el párrafo

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón

       impresora. Lo que no puede faltar en ninguna hoja es la etiqueta del
       estatus: un pastiche impreso sin declarar es la fuente inflada que
       esta materia enseña a cazar. */
    const abiertos = [];
    const openReal = w.open;
    w.open = function () {
      const doc = { write(s) { abiertos.push(s); }, close() {} };

    try {

      w.imprimirLectura('harari');

      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      /* Las dos entrevistas sueltas: su etiqueta impresa tiene que declarar
         que el encuentro nunca ocurrió, porque una entrevista en papel
         parece un acta y viaja sola. */
      w.imprimirLectura('entrevista');
      const hv = abiertos[abiertos.length - 1] || '';

         'la entrevista se imprime con su texto completo', 'la entrevista no se imprime');
      ok(/mejor oficio para un muerto/.test(hv), 'y hasta su última respuesta', 'la hoja de la entrevista sale cortada');
      ok(/nunca ocurrió/i.test(hv), 'y con la etiqueta del encuentro que nunca ocurrió', 'la entrevista impresa no declara la ficción');
      ok(/real y comprobable/i.test(hv), 'y con la regla de la erudición real', 'la hoja de la entrevista no trae la regla de los datos reales');
      ok(!/\u2014/.test(hv), 'y sin guiones largos (norma 1-bis)', 'la hoja de la entrevista trae guiones largos');

      w.imprimirLectura('gala');
      const hg = abiertos[abiertos.length - 1] || '';
      ok(/La mitad que nadie enmarca/.test(hg) && /QUINTERO/.test(hg) && /GALA/.test(hg),
         'la conversación se imprime con su texto completo', 'la conversación no se imprime');
      ok(/que vaya al libro/.test(hg), 'y hasta su aforismo final', 'la hoja de la conversación sale cortada');
      ok(/nunca ocurrió/i.test(hg), 'y con la etiqueta del encuentro que nunca ocurrió', 'la conversación impresa no declara la ficción');
      ok(!/\u2014/.test(hg), 'y sin guiones largos', 'la hoja de la conversación trae guiones largos');

      /* El careo suelto lleva la etiqueta CONTRARIA a la de los otros cinco:
         la suya, la del careo, y NO la del pastiche. Una hoja de careo que
         dijera «no es obra de ese autor» estaría declarando que imita a

      w.imprimirLectura('debate');
      const hd = abiertos[abiertos.length - 1] || '';

      ok(/Careo escrito por la casa sobre una disputa real/i.test(hd),
         'con la etiqueta del careo que pone el aparato compartido', 'el careo sale sin su etiqueta');
      ok(/Careo escrito por esta casa sobre una disputa que existe de verdad/i.test(hd),
         'y con la nota propia de esta misión, que nombra la disputa', 'la hoja del careo sale sin su nota');
      ok(!/NO es obra de ese autor/i.test(hd), 'y NO con la del pastiche, porque no imita a nadie', 'el careo sale etiquetado como pastiche');
      ok(!/\u2014/.test(hd), 'y sin guiones largos', 'el careo impreso trae guiones largos');

      ok(/Preguntas de esta lectura/.test(hd), 'y con sus propias preguntas detrás', 'la hoja del careo sale sin sus preguntas');
      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');
      ok((hd.match(/class="op"/g) || []).length === 20, 'sus 5 preguntas con sus 20 opciones', 'opciones del careo: ' + (hd.match(/class="op"/g) || []).length);
      ok(/Preguntas de esta lectura/.test(hb), 'y el cuento también sale con las suyas', 'la hoja del cuento sale sin preguntas');

      w.imprimirTodasLasLecturas();
      const h3 = abiertos[abiertos.length - 1] || '';
      ok(/Los subrayados de mi padre/.test(h3) && /escrutinio/.test(h3) && /La especie que cita sin leer/.test(h3),
         'el pliego junto trae las tres lecturas de estilo', 'el pliego no sale completo');
      ok(/El hombre que mandó quemar sus papeles/.test(h3) && /La mitad que nadie enmarca/.test(h3),

      ok(/¿Cuánto pesa la mano invisible\?/.test(h3) && /LA DEFENSA\./.test(h3),
         'y el careo: las SEIS lecturas en un solo pliego', 'al pliego le falta el careo');
      ok((h3.match(/page-break-before/g) || []).length >= 6, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h3), 'y el pliego declara el pastiche de las tres voces', 'el pliego no declara el pastiche');
      ok(/nunca ocurrió/i.test(h3), 'y la ficción de las dos entrevistas', 'el pliego no declara que los encuentros nunca ocurrieron');
      ok(/careo/i.test(h3) && /papeles/i.test(h3),
         'y que el sexto es un careo con turnos firmados por papeles', 'el pliego no separa el estatus del careo');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con 30 de comprensión', 'al pliego de preguntas le falta una sección');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok(/nunca ocurrió/i.test(hp), 'y el pliego de preguntas también declara la ficción de las entrevistas', 'el pliego de preguntas no declara la ficción');
      ok(/careo/i.test(hp), 'y nombra el careo, que no imita a nadie', 'el pliego de preguntas no distingue el careo');
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(!/\u2014/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

      /* Los rótulos de las DOS PRUEBAS IMPRESAS: es ahí donde vive el número
         de etapa, y es el sitio exacto donde el molde arrastró el nombre de
         la misión anterior en misiones pasadas. Se imprimen de verdad y se
         lee el documento. Hay que GENERARLAS primero: printEval se planta si
         no existe _evalPrintData, y entonces se leería el pliego anterior. */
      w.go('s-evaluacion'); await esperar(150);
      w.genEval(); await esperar(250);
      w.genEvalCrit(); await esperar(250);
      w.printEval();
      const he = abiertos[abiertos.length - 1] || '';
      ok(/El escocés dorado/i.test(he) && /Etapa 5 · Estudio Mayor/.test(he),
         'la evaluación impresa lleva el nombre y la etapa correctos', 'la evaluación impresa trae el rótulo de otra misión');
      ok(!/Etapa [1-46-9] · Estudio Mayor|Etapa [1-46-9] de \d|La gran fuga|dos facturas/i.test(he),
         'y no arrastra el rótulo de otra etapa ni de la misión molde', 'la evaluación impresa dice otra etapa');
      ok(!/undefined/.test(he), 'y no imprime undefined', 'la evaluación impresa trae un undefined');
      w.printEvalCrit();
      const hec = abiertos[abiertos.length - 1] || '';
      ok(/La cita sobre la mesa/.test(hec) && /El escocés dorado/i.test(hec),
         'la competencial impresa lleva su nombre propio', 'la competencial impresa trae el rótulo de otra misión');
      ok(/Etapa 5 · Estudio Mayor/.test(hec), 'y su número de etapa correcto', 'la competencial impresa no dice etapa 5');
      ok(!/Etapa [1-46-9] · Estudio Mayor|Etapa [1-46-9] de \d|cifra sobre la mesa|bien sobre la mesa/i.test(hec),
         'y tampoco arrastra el de otra misión', 'la competencial impresa arrastra el rótulo de otra etapa');
      ok(!/undefined/.test(hec), 'y no imprime undefined en ninguna pauta', 'la competencial impresa trae un undefined');
    } finally { w.open = openReal; }

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/dos libros/i.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en los dos libros', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="libros"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.labShowParte('test'); await esperar(150);
    ok(/contracita/i.test(d.getElementById('lab-display').textContent) || /cinco preguntas/i.test(d.getElementById('lab-display').textContent),
       'y las demás piezas pintan su contenido', 'el laboratorio no pinta la pieza del test');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-tareas'); await esperar(150);
    w.genTask(); await esperar(200);
    const tareas = d.getElementById('tgOut').textContent;
    ok(tareas.length > 200, 'el generador de tareas produce su hoja', 'generador vacío');
    ok(!/Deaton|gran fuga|horquilla|2,5 y 4/i.test(tareas), 'el ejemplo del generador es de esta misión', 'el generador arrastra el ejemplo de la misión molde');
    w.go('s-aprende'); await esperar(150);
    w.startMethod(); await esperar(1400);
    w.resolveMethod(true); await esperar(200);
    ok(/libro IV/i.test(d.getElementById('methodResult').textContent) && /contracita/i.test(d.getElementById('methodResult').textContent),
       'la simulación es la de esta etapa (la frase enmarcada, con su dirección y su contracita)', 'la simulación arrastra la del molde');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la cita sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/escocés dorado/i.test(rotulos) && /La cita sobre la mesa/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'los rótulos no traen el nombre de esta misión');
    ok(!/Etapa [1-46-9] · Estudio Mayor|Etapa [1-46-9] de \d/.test(rotulos), 'y no dicen otra etapa', 'los rótulos de pantalla dicen otra etapa');
    ok(!/gran fuga|cifra sobre la mesa|bien sobre la mesa|falla sobre la mesa|hombre máquina|bisturí|vigía/i.test(rotulos),
       'y no traen el nombre de otra misión', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      ok(casos.querySelectorAll('.ex-box').length === 9, 'y cada caso trae su caja de diagnóstico', 'cajas de diagnóstico: ' + casos.querySelectorAll('.ex-box').length);
      const txt = casos.textContent;
      ['tío', 'primo', 'pulperías', 'patrones', 'Jael', 'Angelly', 'autoridad', 'cita esta casa']
        .forEach(k => { if (!new RegExp(k.replace(/\./g, '\\.'), 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O|esta casa/i.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      /* Cada caso tiene que trabajar la cita, que es la destreza de la etapa. */
      ok(/libro IV/i.test(txt) && /capítulo 10/i.test(txt) && /libro V/i.test(txt),
         'los casos trabajan con direcciones exactas de libro y capítulo', 'los casos no traen las direcciones');
      ok(/contracita/i.test(txt), 'y al menos uno nombra la contracita', 'ningún caso nombra la contracita');
      ok(/calendario/i.test(txt), 'y otro resuelve la atribución por fechas', 'ningún caso usa el argumento del calendario');
      ok(/hoja de la cita/i.test(txt), 'trae la hoja de la cita', 'falta la hoja de la cita');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/no lo (convierte|vuelve) (en )?aliado|no convierte a Smith en partidario/i.test(txt),
         'y el freno contra el error simétrico, escrito en los casos', 'los casos no traen el freno del error simétrico');
      ok(/no prueba|NO prueba/.test(txt), 'y al menos un caso dice qué NO prueba su cita', 'ningún caso declara los límites de su cita');
      /* El giro hacia adentro: uno de los ocho casos audita el proyecto propio. */
      ok(/parafrase/i.test(txt) && /capítulo/i.test(txt),
         'al menos un caso audita cómo cita esta casa, y declara la paráfrasis', 'ningún caso audita las citas del proyecto');
      /* Y la regla de selección de esta materia. */
      ok(/como categoría/i.test(txt) && /nombre propio/i.test(txt),
         'los casos declaran la regla de selección del patio', 'los casos no declaran la regla de selección');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/tío|primo|pulperías|patrones|Jael|Angelly|casa/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/NINGUNA CITA SIN OBRA, AÑO Y CAPÍTULO/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/LA MANO INVISIBLE APARECE UNA VEZ/.test(banda) && /LIBRO IV CAPÍTULO 2/.test(banda), 'y trae el dato central con su dirección', 'la banda no trae la dirección de la mano invisible');
    ok(/EL CARNICERO ESTÁ EN EL I, 2/.test(banda) && /LOS DEL MISMO OFICIO EN EL I, 10/.test(banda), 'y las otras dos direcciones del libro I', 'la banda no trae las direcciones del libro I');
    ok(/LOS IMPUESTOS Y LA ESCUELA EN EL V/.test(banda), 'y el libro V, con los impuestos y la escuela', 'la banda no trae el libro V');
    ok(/SENTIMIENTOS MORALES 1759/.test(banda) && /RIQUEZA DE LAS NACIONES 1776/.test(banda), 'y las dos obras con su año', 'la banda no trae las dos obras');
    ok(/SEXTA EDICIÓN 1790/.test(banda), 'y la sexta edición, que desarma la excusa', 'la banda no trae la sexta edición');
    ok(/VINER 1927/.test(banda) && /STIGLER 1971/.test(banda), 'y la pareja de intérpretes, con el acero incluido', 'la banda no trae a Viner ni a Stigler');
    ok(/TRAE LA CONTRACITA/.test(banda), 'y la consigna de la etapa', 'la banda no trae la contracita');
    ok(!/HORQUILLA|IPCC|KEELING|PIKETTY|ELEFANTE|TASA DE DESCUENTO/.test(banda), 'sin las palabras de la etapa 4 de la ruta', 'la banda sigue siendo la de las dos facturas');
    ok(!/SANDEL|TITMUSS|PIGOU|COASE|MONOPSONIO|DEATON|LA GRAN FUGA/.test(banda),
       'sin las palabras de las etapas 1, 2 y 3', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-dorado-escoces-dorado.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja de la cita, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja de la cita en blanco', 'falta la hoja de la cita');
    ok(/Una hoja de la cita ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/avisos al llenarla/i.test(txtF), 'con sus avisos', 'faltan los avisos de la hoja');
    ok(/Cómo se usa, en tres reglas/i.test(txtF), 'y sus reglas de uso', 'faltan las reglas de uso de la hoja');
    ok(/1759/.test(txtF) && /1776/.test(txtF) && /1790/.test(txtF), 'la ficha trae las tres fechas de Smith', 'faltan fechas de Smith en la ficha');
    ok(/libro IV/i.test(txtF) && /capítulo 2/i.test(txtF) && /una sola vez/i.test(txtF), 'y la dirección de la mano invisible con su «una sola vez»', 'falta la dirección de la mano invisible en la ficha');
    ok(/capítulo 10/i.test(txtF) && /conspiración/i.test(txtF), 'la ficha trae la contracita del libro I capítulo 10', 'falta la contracita en la ficha');
    ok(/capítulo 8/i.test(txtF) && /combinación tácita/i.test(txtF), 'y el pasaje de los patrones', 'falta el pasaje de los patrones en la ficha');
    ok(/libro V/i.test(txtF) && /proporción/i.test(txtF) && /educación pública/i.test(txtF), 'y el libro V con los impuestos y la escuela', 'falta el libro V en la ficha');
    ok(/estúpido e ignorante/i.test(txtF), 'y el lado oscuro de la división del trabajo', 'falta el pasaje de la división del trabajo');
    ok(/Viner/.test(txtF) && /1927/.test(txtF) && /Chicago/.test(txtF), 'la ficha trae a Viner con su procedencia', 'falta Viner en la ficha');
    ok(/Stigler/.test(txtF) && /1971/.test(txtF), 'y el acero de Stigler', 'falta el acero en la ficha');
    ok(/Rothschild/.test(txtF) && /2001/.test(txtF), 'y Rothschild con la historia de la frase', 'falta Rothschild en la ficha');
    ok(/Ross/.test(txtF) && /1995/.test(txtF) && /1778/.test(txtF), 'y la biografía estándar con el dato de la aduana', 'falta la biografía en la ficha');
    ok(/Glasgow/.test(txtF) && /1976/.test(txtF), 'la ficha nombra la edición académica de referencia', 'falta la Glasgow Edition en la ficha');
    ok(/parafrase/i.test(txtF), 'y declara que sus citas van parafraseadas', 'la ficha no declara la paráfrasis');
    ok(/contracita/i.test(txtF), 'la ficha trae la contracita como herramienta', 'falta la contracita como herramienta');
    ok(/en las dos direcciones/i.test(txtF), 'y dice que el test corta en las dos direcciones', 'la ficha no dice que el test corta en las dos direcciones');
    ok(/no lo (convierte|vuelve) (en )?aliado/i.test(txtF), 'con su aviso contra el error simétrico', 'falta el aviso del error simétrico');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok((txtF.match(/<ol\b/g) || []).length === (txtF.match(/<\/ol>/g) || []).length, 'ninguna lista quedó partida entre dos hojas', 'hay listas abiertas sin cerrar');
    ok(/fuente primaria/i.test(txtF) && /el acero/i.test(txtF) && /biografía estándar/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/Piketty|Keeling|IPCC|Sandel|Titmuss|Pigou|Minsky/i.test(txtF),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos de las etapas anteriores');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-dorado-escoces-dorado"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Dorado/.test(c.textContent));
    ok(!!ruta, 'la Ruta del Expediente Dorado está en el mapa', 'no aparece la ruta');
    if (ruta) {
      /* Cuentas sacadas del CATÁLOGO, no escritas a mano: las de a mano se
         quedaron viejas al crecer la ruta y la sonda suspendía sin que
         hubiera nada roto (la lección de la Casa Cerrada, en CLAUDE.md). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "dorado").length');
      const totalCat = wa.eval('RUTAS.dorado.etapas');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok(/La gran fuga/i.test(ruta.textContent) && /Las fallas de la máquina/i.test(ruta.textContent) && /Lo que el dinero no debe comprar/i.test(ruta.textContent) && /Las dos facturas/i.test(ruta.textContent) && /El escocés dorado/i.test(ruta.textContent),
         'las cinco etapas construidas salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La palabra gastada/.test(ruta.textContent) && /Visto desde el patio/.test(ruta.textContent), 'las dos siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    /* El expediente gemelo tiene que seguir en pie al lado, porque la Bóveda
       no acepta uno sin el otro y eso vive en el mapa, no solo en el texto. */
    const rutaRoja = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Rojo/.test(c.textContent));
    ok(!!rutaRoja, 'y la Ruta del Expediente Rojo sigue en el mapa, al lado', 'no aparece el expediente gemelo');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /escocés dorado/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /🪶/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda el escocés dorado etapa 5';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda el escocés dorado etapa 5'; }
});
</script>
</body>
