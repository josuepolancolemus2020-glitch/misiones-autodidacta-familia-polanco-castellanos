<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de las Gafas a la Vista, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-gafas-palabra-expediente/gafas-expediente.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta de las Gafas a la Vista (Estudio de las
   Ideologías, materia 25 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, y
   LAS DOS SECCIONES DE LA NORMA 5: el guion de video con su estructura y
   las seis lecturas (norma 5-nonies: las tres voces, las dos entrevistas
   imaginadas y el careo) con su etiqueta de estatus, plegadas en acordeón
   y con sus 5, 2 y 2 preguntas dentro de cada texto.

   La REGLA DEL ESTATUS del compendio rige también aquí: Destutt de Tracy
   con 1796 y su etiqueta de clásico de historia de las ideas (se cita por
   el origen del término), «La ideología alemana» escrita en 1845-1846 y
   PUBLICADA COMPLETA EN 1932, la carta de Engels a Franz Mehring del 14 de
   julio de 1893 como la fuente REAL de «falsa conciencia» (la frase exacta
   no está en la obra publicada de Marx, y ese matiz es medio módulo),
   Mannheim 1929 como clásico sólido con debates vivos, y Geertz 1964 (en
   «La interpretación de las culturas», 1973) como clásico sólido; y el
   pastiche de las cinco primeras lecturas declarado como pastiche, porque
   una misión que enseñara a pedir fuentes citando mal las suyas sería el
   error que quiere evitar. El careo es el caso contrario y por eso se
   comprueba al revés: no lleva etiqueta de pastiche porque no imita a
   nadie, y sus turnos los firman papeles y no personas. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de las Gafas a la Vista · Etapa 1 de 7/.test(d.body.textContent), 'se presenta como etapa 1 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 1 del Expediente Rojo. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"], a[href*="ruta-atomos-contra-miedo"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent.replace(/dentro de la propia tradici[óo]n marxista/gi, '');
    })();
    ok(!/hombre de acero|hombre de paja|marxista|Caplan|prueba de Turing|Farm to Factory|báscula pareja|horquilla|Expediente Rojo/i.test(cuerpoSinEnlaces),
       'sin restos de la misión de la que se copió', 'queda vocabulario del acero o del expediente rojo');
    ok(!/tetrafármaco|Epicuro|Lucrecio|vigía|timón|metacognición/i.test(cuerpoSinEnlaces),
       'sin restos de las otras misiones del Estudio Mayor', 'queda vocabulario de los átomos o del espejo');
    /* La raya se escribe escapada (\u2014) a propósito: la norma 1-bis se
       comprueba con un grep, y una sonda que llevara el carácter dentro
       saldría ella misma en la lista de infractores cada vez. */
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');

    log('\n── LA REGLA DEL ESTATUS (la regla del Estudio Mayor) ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/1796/.test(texto0) && /Destutt de Tracy/.test(texto0), 'Destutt de Tracy con el año del término (1796)', 'falta el origen de la palabra con su autor');
    ok(/1801/.test(texto0) && /1815/.test(texto0) && /clásico de historia de las ideas/i.test(texto0),
       'Elementos de ideología (1801 a 1815) con su etiqueta', 'falta la obra de Tracy etiquetada');
    ok(/por el origen del término/i.test(texto0) && /no se lee entera?/i.test(texto0),
       'se declara que Tracy se cita por el origen y no se lee entero', 'no se declara cómo entra Tracy');
    ok(/1845/.test(texto0) && /1846/.test(texto0) && /1932/.test(texto0),
       'La ideología alemana con las dos fechas (escrita y publicada completa)', 'faltan las fechas de La ideología alemana');
    ok(/fuente primaria/i.test(texto0), 'La ideología alemana entra como fuente primaria', 'no se declara la fuente primaria');
    ok(/Mehring/.test(texto0) && /14 de julio de 1893/.test(texto0),
       'la carta a Franz Mehring, con su fecha exacta', 'falta la carta de 1893 con fecha');
    ok(/no est[áa] en la obra publicada de Marx/i.test(texto0),
       'se dice EXPLÍCITO que «falsa conciencia» no está en la obra publicada de Marx', 'no se dice el matiz que es medio módulo');
    ok(/Mannheim/.test(texto0) && /1929/.test(texto0) && /clásico sólido/i.test(texto0),
       'Mannheim (1929) como clásico sólido', 'falta Mannheim etiquetado');
    ok(/debates vivos/i.test(texto0), 'y con sus debates vivos declarados', 'falta el matiz de los debates vivos');
    ok(/Geertz/.test(texto0) && /1964/.test(texto0) && /1973/.test(texto0),
       'Geertz con 1964 y con el libro de 1973', 'falta Geertz con sus dos fechas');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'tracy,camara,falsa,mapa', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos del expediente', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    /* Dos rótulos que ve el usuario y que la mudanza a seis lecturas dejó
       atrás. No son adorno: el logro se concede en js/lecturas.js al llegar
       a 30 respuestas de comprensión, así que uno que prometa 25 promete un
       premio que no llega cuando lo dice. */
    ok(/30 preguntas/.test(dentro('ACHIEVEMENTS.lect_master.label')),
       'el logro de lectura cuenta las 30 preguntas de comprensión',
       'el logro sigue diciendo: ' + dentro('ACHIEVEMENTS.lect_master.label'));
    ok(/seis lecturas/.test(dentro('compartirMision.toString()')) && !/cinco lecturas/.test(dentro('compartirMision.toString()')),
       'y lo que se manda por WhatsApp anuncia las seis lecturas', 'el mensaje de WhatsApp sigue invitando a cinco lecturas');
    /* Las tres baterías de las lecturas, ya repartidas por voz (norma
       5-nonies): 30 de comprensión, 12 de completar y 12 de análisis, que
       son 5, 2 y 2 por cada una de las seis lecturas. Los totales solos no
       bastan: un banco de 12 con seis de una voz y ninguna de otra da el
       mismo total y deja una lectura sin preguntas. */
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis con pauta corta o sin pauta');
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada una dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* Los enunciados no llevan número escrito a mano, y esto se comprueba
       AQUÍ, sobre el banco, y no en la pantalla: js/lecturas.js los pinta
       con sinNumero(), así que un «11.» pegado delante se ve impecable en la
       tarjeta y sale doble («11. 11.») en el pliego de las 54, que es donde
       nadie lo mira hasta tenerlo impreso. Y encima mentiría, porque dentro
       de la tarjeta la pregunta se rotula «Pregunta 1 de 2». */
    ok(dentro('lectComprensionBank.concat(lectCompletarBank).concat(lectAnalisisBank).every(q => !/^\\s*\\d+\\./.test(q.q))'),
       'ningún enunciado de las lecturas trae número escrito a mano',
       'enunciados que arrastran el número del banco global: '
       + dentro('lectComprensionBank.concat(lectCompletarBank).concat(lectAnalisisBank).filter(q => /^\\s*\\d+\\./.test(q.q)).map(q => q.q.slice(0, 20)).join(" | ")'));
    /* Ahora cada pregunta vive DENTRO de un solo texto, así que un enunciado
       que se conteste con varias lecturas a la vez ya no se puede contestar
       desde donde está. Ya pasó con los enunciados 1, 2, 6, 8 y 10, que
       hablaban de «las tres lecturas» desde un banco global que ya no existe. */
    ok(dentro('lectAnalisisBank.every(q => !/las tres lecturas|los tres textos|tres voces|las seis lecturas/.test(q.q))'),
       'ningún enunciado de análisis pide varias lecturas a la vez', 'hay enunciados que se contestan con otros textos');
    /* Y ninguna etiqueta puede ser un apaño de los de antes («las cinco»,
       «todas», «Borges y Harari»): la etiqueta ES la lectura donde vive la
       pregunta, y una que nombre varias no cae en ninguna. */
    ok(dentro('[...new Set(lectCompletarBank.concat(lectAnalisisBank).map(q => q.t))].every(t => ["Borges","Cervantes","Harari","Entrevista","Quintero y Gala","Debate"].indexOf(t) >= 0)'),
       'las etiquetas de completar y análisis son las seis voces y ninguna más',
       'quedan etiquetas viejas: ' + dentro('[...new Set(lectCompletarBank.concat(lectAnalisisBank).map(q => q.t))].join(", ")'));
    ok(/faro_gafas_expediente/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/nació ciencia y quedó insulto/i.test(texto), 'nació ciencia y quedó insulto', 'falta la frase que ordena el expediente');
    ok(/Napole/.test(texto) && /ideólogos/i.test(texto), 'Napoleón y la burla de los «ideólogos»', 'falta la torcedura de la palabra');
    ok(/cámara oscura/i.test(texto), 'la cámara oscura de Marx y Engels', 'falta la cámara oscura');
    ok(/clase dominante/i.test(texto), 'las ideas dominantes son las de la clase dominante', 'falta la tesis de las ideas dominantes');
    ok(/falsa conciencia/i.test(texto), 'la falsa conciencia', 'falta la falsa conciencia');
    ok(/autoinmuniza/i.test(texto) && /despierto entre dormidos/i.test(texto),
       'su crítica: se autoinmuniza y el que la usa se declara despierto entre dormidos', 'falta la crítica de la falsa conciencia');
    ok(/relacionismo/i.test(texto) && /relativismo/i.test(texto), 'el relacionismo, distinguido del relativismo', 'falta la distinción de Mannheim');
    ok(/no es (una )?patología/i.test(texto) && /mapa/i.test(texto), 'la ideología como mapa y no como patología', 'falta el giro de Geertz');
    ok(/sentido común/i.test(texto), 'el uso tramposo: «sentido común» para el propio bando', 'falta el uso tramposo');
    ok(/gafas a la vista/i.test(texto), 'la meta: tener las gafas a la vista', 'falta la meta declarada');
    ok(/regla de pago/i.test(texto), 'la regla de pago (uno propio por cada ajeno)', 'falta la regla de pago');
    ok(/no es instrumento, es arma|no es un instrumento, es un arma/i.test(texto),
       'el detector que no se prueba en casa es arma', 'falta el cuidado central del compendio');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl) && /Gabilondo/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl),
         'las cinco primeras voces están nombradas', 'faltan voces en la sección');
      ok(/ejercicio(s)? de estilo/i.test(tl) && /no son obra de esos autores/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      /* La entradilla tiene que contar seis y nombrar el careo: si sigue
         diciendo cinco, el índice enseña una lectura que la sección niega. */
      ok(/[Ss]eis lecturas/.test(tl) && /careo/i.test(tl), 'la entradilla cuenta seis y nombra el careo', 'la entradilla sigue hablando de cinco');
      ok(/[Cc]ada lectura trae sus propias preguntas/.test(tl) && /plegadas/i.test(tl),
         'y avisa de que cada lectura trae sus preguntas y de que empiezan plegadas', 'la entradilla no explica el plegado ni las preguntas de dentro');
      ok(/El hombre que miraba sin gafas/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/Donde se cuenta/.test(tl) && /Sancho/.test(tl) && /don Quijote/.test(tl), 'el capítulo cervantino está, con Sancho adentro', 'falta el capítulo cervantino');
      ok(/Los mapas invisibles/.test(tl) && /sapiens/i.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las rayas de diálogo del capítulo cervantino son guiones largos y
         violan la norma 1-bis: van en paréntesis. Se comprueba aquí porque
         es el error que se cazó en la misión anterior. */
      ok(/\(dijo don Quijote\)|\(respondió Sancho\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL. La sonda exige las
         anclas comprobables y la declaración de datos reales. */
      ok(/reales/i.test(tl) && /citas (apócrifas|inventadas)/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/Destutt de Tracy/.test(tl) && /1796/.test(tl), 'ancla real: Destutt de Tracy y 1796', 'falta el origen del término dentro de los textos');
      ok(/Elementos de ideología/.test(tl) && /1801/.test(tl) && /1815/.test(tl), 'ancla real: Elementos de ideología (1801 a 1815)', 'falta la obra de Tracy');
      ok(/Napole/.test(tl), 'ancla real: Napoleón y los «ideólogos»', 'falta Napoleón');
      ok(/Mehring/.test(tl) && /14 de julio de 1893/.test(tl), 'ancla real: la carta de Engels a Mehring (1893)', 'falta la carta con su fecha');
      ok(/Mannheim/.test(tl) && /1929/.test(tl) && /Ideología y utopía/.test(tl), 'ancla real: Mannheim, Ideología y utopía (1929)', 'falta Mannheim con su obra');
      ok(/Geertz/.test(tl) && /1964/.test(tl) && /1973/.test(tl), 'ancla real: Geertz (1964) y el libro de 1973', 'falta Geertz con sus fechas');
      ok(/1932/.test(tl), 'ancla real: la publicación completa de 1932', 'falta la fecha de publicación');
      ok(/1605/.test(tl) && /(capítulo cuarenta y cuatro|I, 44|capítulo 44)/i.test(tl), 'ancla real: la bacía y el yelmo (Quijote I, 44 a 45, de 1605)', 'falta el ancla del Quijote');
      ok(/1933/.test(tl), 'ancla real: Mannheim sale de Alemania en 1933', 'falta el dato biográfico comprobable');
      /* Las dos entrevistas de la norma 5-quinquies: ids fijos, y cada una
         con su nota que declara EXPLÍCITO que el encuentro nunca ocurrió,
         porque una entrevista imaginada sin declarar sería una cita
         apócrifa de cuerpo entero. */
      const cardEnt = d.getElementById('lect-entrevista'), cardGala = d.getElementById('lect-gala');

      /* El pliego pide 10 a 14 intercambios contados como pares

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');

    /* Anclaje: con las preguntas metidas DENTRO de su texto, un enunciado que
       nombre algo que no está en esa tarjeta obliga a cerrarla y a buscarlo
       en otra, que es justo lo que la norma 5-nonies vino a quitar. Pasó con
       la segunda de Cervantes, que mandaba traducir la sentencia de don

    const nombresEtapa = ['Mannheim', 'Geertz', 'Thompson', 'Eagleton', 'Freeden', 'Seliger', 'Geuss',
                          'Larraín', 'Ricoeur', 'Borges', 'Cervantes', 'Harari', 'Napoleón', 'Tracy',

      dentro('lectAnalisisBank.filter(q => q.t === "' + v.voz + '").map(q => q.q)').forEach(q => {
        nombresEtapa.forEach(n => {

    ok(!!d.querySelector('link[href*="lecturas.css"]'), 'la misión carga la hoja del aparato de lecturas', 'falta css/lecturas.css');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

       al lado del texto desconcentra justo mientras se lee. Si alguien la
       devuelve, esto lo caza: aquí se recorre la lectura entera y no

    w.localStorage.removeItem(dentro('SAVE_KEY') + '_lugar');
    const psL = [...d.querySelectorAll('#lect-borges .lect-cuerpo p.lect-p')];
    psL[Math.min(4, psL.length - 1)].scrollIntoView({ block: 'center' });

    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');

    /* LA PONE EL LECTOR, desde la misma barra con la que subraya, y va
       pegada a LAS PALABRAS elegidas, no al párrafo entero. */
    const parrL = psL[0];
    const altoAntes = parrL.getBoundingClientRect().height;
    seleccionar(parrL, 10, 26);
    await esperar(420);
    const btnAqui = d.getElementById('fmBtnAqui');
    ok(!!btnAqui && btnAqui.style.display !== 'none', 'la barra de marcar trae «Aquí me quedé»', 'no está el botón de la marca de lectura');

    const abiertos = [];

    const prosa = h => h.replace(/<[^>]+>/g, '');

      w.imprimirLectura('harari');

      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');

      ok((h6.match(/page-break-before/g) || []).length >= 6, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h6) && /nunca ocurri/i.test(h6),

      ok(/careo/i.test(h6), 'y declara aparte el careo, que no imita a nadie', 'el pliego mete el careo en el saco del pastiche');

      ok(/La palabra con expediente/.test(ruta.textContent), 'la etapa 1 sale con el título de la misión', 'la etapa 1 no sale con su título');
      ok(/El eje y la gente sin mapa/.test(ruta.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /palabra con expediente/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda gafas etapa 1';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda gafas etapa 1'; }
});
</script>
</body>
</html>
