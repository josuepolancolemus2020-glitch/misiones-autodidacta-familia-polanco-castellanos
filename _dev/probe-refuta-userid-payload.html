<!doctype html>
<meta charset="utf-8">
<title>Sonda: ¿que columnas manda el upsert de push.js?</title>
<pre id="out">corriendo…</pre>
<div id="push-banner" style="display:none">
  <span id="push-banner-text"></span>
  <button id="push-banner-btn">Activar</button>
  <button id="push-banner-dismiss">x</button>
</div>
<script>
const L = [];
const log = m => { L.push(m); document.getElementById('out').textContent = L.join('\n'); };

// ── Fingimos el entorno de un telefono con permiso YA concedido ──
window.Notification = { permission: 'granted', requestPermission: async () => 'granted' };
if (!('PushManager' in window)) window.PushManager = function () {};
const fakeSub = {
  toJSON: () => ({ endpoint: 'https://fcm.googleapis.com/ENDPOINT', keys: { p256dh: 'P256', auth: 'AUTH' } })
};
Object.defineProperty(navigator, 'serviceWorker', {
  configurable: true,
  value: { ready: Promise.resolve({ pushManager: {
    getSubscription: async () => fakeSub,
    subscribe: async () => fakeSub,
  } }) }
});

// ── Espia del cliente Supabase: capturamos el cuerpo exacto del upsert ──
let CAPTURA = null;
window._sb = {
  from(t) {
    return { upsert(fila, opts) {
      CAPTURA = { tabla: t, fila, opts };
      return Promise.resolve({ error: null });
    } };
  }
};
// push.js lee la variable global _sb (declarada con const en chat.js). Como
// aqui no cargamos chat.js, la definimos nosotros en el ambito global.
var _sb = window._sb;

// La sesion, como la devolveria auth.js tras entrar Josue.
function verificarSesion() { return { user: 'josue', nombre: 'Josué Edmundo' }; }
function toast(m) { log('  toast: ' + m); }
</script>
<script src="../js/push.js"></script>
<script>
window.addEventListener('load', async () => {
  await new Promise(r => setTimeout(r, 400));
  log('¿pushSubscribe corrio solo al abrir la app? ' + (CAPTURA ? 'SI' : 'NO'));
  if (CAPTURA) {
    log('tabla: ' + CAPTURA.tabla);
    log('opts:  ' + JSON.stringify(CAPTURA.opts));
    log('columnas que manda el cliente: ' + Object.keys(CAPTURA.fila).join(', '));
    log('¿manda user_id? ' + ('user_id' in CAPTURA.fila ? 'SI' : 'NO'));
    log('fila: ' + JSON.stringify(CAPTURA.fila));
  }
  // Ahora simulamos el rechazo de la politica RLS y vemos que ve la familia.
  CAPTURA = null;
  _sb.from = () => ({ upsert: () => Promise.resolve({
    error: { code: '42501', message: 'new row violates row-level security policy for table "push_subscriptions"' } }) });
  log('--- con la politica RLS rechazando el INSERT ---');
  const r = await pushSubscribe();
  log('pushSubscribe() devuelve: ' + JSON.stringify(r));
  document.getElementById('push-banner-btn').click();
  await new Promise(r => setTimeout(r, 300));
  log('FIN');
});
</script>
