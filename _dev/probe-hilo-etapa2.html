iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}

<body>
<iframe id="m" src="/misiones/ruta-hilo-deseo-obstaculo/deseo-obstaculo.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta del Hilo que Tira (Storytelling): el deseo, la
   apuesta, el obstáculo con cara y como función, y el querer contra el necesitar.
   Bancos, laboratorio, los ocho casos, el guion, las seis lecturas con sus
   preguntas dentro, el marcador, la impresión, la ficha, la materia y la ruta en
   el mapa.

   Las reglas propias de la materia que aquí se vigilan con más saña:
     1. NINGUNA ESTRUCTURA SIN AUTOR Y AÑO. Cada fuente del motor (Propp 1928,
        McKee 1997, Truby 2007, Egri 1946, Aristóteles, Lévi-Strauss 1960) va con
        su año, y toda plantilla que asome (monomito) con el suyo.
     2. KIDD Y CASTANO (2013) VA SIEMPRE CON PANERO (2016).
     3. EL OBSTÁCULO ES UNA FUNCIÓN, NO UN VILLANO (Propp): la etapa lo repite y
        la sonda lo exige, porque es lo que más se confunde.

   La comprobación de estructuras mira las cinco secciones de PROSA (Aprende,
   Estructura, Casos, Guion y Lecturas), no la página entera: los bancos pintan
   rótulos que son fichas de juego (es la trampa 1 de la norma 5-nonies).

   El guion largo se busca con su escape (\u2014) y no con el caracter puesto:
   una sonda que llevara el caracter dentro se suspenderia sola.   */
const RAYA = new RegExp('\\u2014');
const RAYAS_G = new RegExp('\\u2014', 'g');
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda hilo etapa 2'; };
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Hilo que Tira · Etapa 2 de 12/.test(d.body.textContent), 'se presenta como etapa 2 de 12', 'no se presenta como etapa 2 de la ruta');
    const cuerpo = d.body.textContent.replace(/\s+/g, ' ');
    /* Restos de la etapa 1 (de la que se copió) y de la Brújula (molde original). */
    ok(!/Pueblo Exacto|Anselmo Sotelo|prueba del conector|Parker y Stone|Sternberg|representatividad|tasa base|Tversky|Kahneman|rueda de la fortuna/i.test(cuerpo),
       'sin restos de la etapa 1 ni del molde original', 'queda temario de otra misión en la página');
    ok(!RAYA.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(RAYAS_G) || []).length + ' guiones largos');
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content;
    ok(/EL DESEO/.test(banda) && /OBST[ÁA]CULO/.test(banda) && !/LA CADENA/.test(banda) && !/REPRESENTATIVIDAD/.test(banda),
       'la banda del encabezado es de esta etapa (EL DESEO y EL OBSTÁCULO, sin LA CADENA)', 'la banda dice: ' + banda.slice(0, 70));
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);
    ok(d.querySelectorAll('#timelineTrack .tl-node').length === dentro('timelineData.length'),
       'y la línea de tiempo arrancó con sus ' + dentro('timelineData.length') + ' fechas', 'hitos pintados: ' + d.querySelectorAll('#timelineTrack .tl-node').length);
    ok((d.getElementById('lab-display').textContent || '').trim().length > 40, 'el laboratorio arrancó con una ficha puesta', 'el laboratorio arrancó vacío');

    log('\n── LA REGLA DE ORO: NINGUNA ESTRUCTURA SIN AUTOR Y AÑO ──');
    const prosa5 = ['s-aprende', 's-estructura', 's-casos', 's-guion', 's-lecturas']
      .map(id => (d.getElementById(id) || {}).textContent || '').join(' ').replace(/\s+/g, ' ');
    let plantillas = 0, huerfanas = 0, ejemplo = '';
    const rePl = /monomito|viaje del h[ée]roe|tres actos|pir[áa]mide|quince golpes/gi; let mPl;
    while ((mPl = rePl.exec(prosa5)) !== null) {
      plantillas++;
      const cerca = prosa5.slice(Math.max(0, mPl.index - 320), mPl.index + 320);
      if (!/\b(18\d\d|19\d\d|20[01]\d)\b/.test(cerca)) { huerfanas++; if (!ejemplo) ejemplo = cerca.slice(0, 120); }
    }
    ok(huerfanas === 0, 'toda plantilla que asoma (' + plantillas + ') lleva su año al lado', 'hay ' + huerfanas + ' plantilla(s) huérfana(s): ' + ejemplo);
    ok(/Propp/.test(prosa5) && /1928/.test(prosa5), 'las funciones se atribuyen a Propp (1928)', 'las funciones van sin Propp (1928)');
    ok(/McKee/.test(prosa5) && /1997/.test(prosa5), 'el objeto de deseo a McKee (1997)', 'el objeto de deseo va sin McKee (1997)');
    ok(/Truby/.test(prosa5) && /2007/.test(prosa5), 'el querer contra el necesitar a Truby (2007)', 'querer vs necesitar va sin Truby (2007)');
    ok(/Egri/.test(prosa5) && /1946/.test(prosa5), 'la premisa a Egri (1946)', 'la premisa va sin Egri (1946)');
    ok(/Arist[óo]teles/.test(prosa5) && /Po[ée]tica/.test(prosa5), 'la unidad de la acción a Aristóteles y su «Poética»', 'la unidad de la acción va sin Aristóteles');
    ok(/L[ée]vi-Strauss/.test(prosa5) && /1960/.test(prosa5), 'la crítica al formalismo a Lévi-Strauss (1960)', 'falta Lévi-Strauss (1960)');
    ok(/ninguna estructura se cita sin autor|autor, a[ñn]o y cr[íi]tica|autor y su a[ñn]o|con su autor y su a[ñn]o/i.test(cuerpo),
       'la regla de oro está escrita a la vista', 'la regla de oro de la ruta no aparece');

    log('\n── LA ETIQUETA INCÓMODA: 2013 VA SIEMPRE CON 2016 ──');
    let citados = 0, pelados = 0, muestra = '';
    const reK = /Kidd|Castano/g; let mK;
    while ((mK = reK.exec(prosa5)) !== null) {
      citados++;
      const ancho = prosa5.slice(Math.max(0, mK.index - 700), mK.index + 700);
      if (!/Panero|2016/.test(ancho)) { pelados++; if (!muestra) muestra = ancho.slice(0, 120); }
    }
    ok(citados >= 1 && pelados === 0, 'Kidd y Castano (2013) se cita con la réplica de Panero y colegas (2016)', 'hay ' + pelados + ' cita(s) sin la réplica: ' + muestra);
    ok(/r[ée]plica fallida/i.test(cuerpo), 'y con su etiqueta de estatus, «hallazgo con réplica fallida»', 'la réplica fallida no se etiqueta');

    log('\n── EL CONCEPTO DE LA ETAPA ──');
    ok(/Morfolog[íi]a del cuento/.test(cuerpo) && /1928/.test(cuerpo), '«Morfología del cuento» aparece con su año', 'falta Propp (1928) con su obra');
    ok(/31 funciones|treinta y una funciones/i.test(cuerpo) && /esferas de acci[óo]n/i.test(cuerpo), 'las 31 funciones y las siete esferas de acción', 'faltan las funciones o las esferas de acción');
    ok(/funci[óo]n, no una persona|funci[óo]n, no un villano|una funci[óo]n.{0,20}no un villano|no un villano/i.test(cuerpo),
       'el obstáculo se declara función y no villano', 'no se declara que el obstáculo es función y no villano');
    ok(/objeto de deseo/i.test(cuerpo), 'el objeto de deseo se nombra', 'falta el objeto de deseo');
    ok(/querer/i.test(cuerpo) && /necesitar/i.test(cuerpo), 'el querer contra el necesitar', 'falta querer contra necesitar');
    ok(/unidad de la acci[óo]n/i.test(cuerpo), 'la unidad de la acción de Aristóteles', 'falta la unidad de la acción');
    ok(/premisa/i.test(cuerpo) && /Egri/.test(cuerpo), 'la premisa con Egri', 'falta la premisa de Egri');
    ok(/concreto/i.test(cuerpo) && /(se pueda ver|se puede ver|momento.{0,20}consigue)/i.test(cuerpo), 'el deseo concreto, que se puede ver cumplirse', 'no se exige que el deseo sea concreto');
    ok(/apuesta/i.test(cuerpo), 'la apuesta (lo que se pierde)', 'falta la apuesta');
    ok(/con cara/i.test(cuerpo) && /«la vida»|la vida/i.test(cuerpo), 'el obstáculo con cara, y que «la vida» no vale', 'no se exige obstáculo con cara');
    ok(/L[ée]vi-Strauss/.test(cuerpo) && /1966/.test(cuerpo), 'la disputa Propp-Lévi-Strauss, con la réplica de 1966', 'falta la réplica de Propp (1966)');
    ok(/lempira/i.test(cuerpo) || /L \d/.test(cuerpo), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');

    log('\n── LOS OCHO CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos').textContent.replace(/\s+/g, ' ');
    ok((casos.match(/Caso \d/g) || []).length === 8, 'los ocho casos están', 'casos: ' + (casos.match(/Caso \d/g) || []).length);
    ok(/M\.E\.T\.A\.S/.test(casos), 'y salen de este proyecto', 'los casos no hablan del proyecto');
    ok(/L \d|lempira/i.test(casos), 'con sus cifras en lempiras', 'los casos van sin lempiras');
    ok(/deseo/i.test(casos) && /obst[áa]culo/i.test(casos) && /apuesta/i.test(casos), 'el deseo, la apuesta y el obstáculo trabajan dentro de los casos', 'los casos no usan las cuatro piezas');
    ok(/querer/i.test(casos) && /necesita/i.test(casos), 'con el querer contra el necesitar', 'los casos no separan querer de necesitar');
    ok(/la pregunta que decide/i.test(casos) && /la condici[óo]n/i.test(casos), 'cada caso termina en la pregunta que decide y su condición', 'los casos no cierran como manda la norma 3');
    ok(/misma p[áa]gina/i.test(casos) && /anexo/i.test(casos), 'y el freno está: la historia y la tabla en la misma página, no en un anexo', 'los casos no ponen el freno del dato');
    ok(/permiso/i.test(casos), 'con el permiso por escrito cuando la historia es de otra persona', 'los casos no piden permiso para contar a otro');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const g = d.getElementById('s-guion').textContent.replace(/\s+/g, ' ');
    ok((g.match(/Escena \d/g) || []).length === 7, 'las siete escenas', 'escenas: ' + (g.match(/Escena \d/g) || []).length);
    ok(/VOZ/.test(g) && /IMAGEN:/.test(g) && /TEXTO EN PANTALLA:/.test(g), 'cada escena lleva VOZ, IMAGEN y TEXTO', 'faltan las tres pistas');
    ok(/gancho en fr[íi]o/i.test(g), 'el gancho en frío', 'falta el gancho');
    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');
    ok(/El deseo y el obst[áa]culo/.test(g), 'y el cierre nombra la misión', 'el cierre no nombra la misión');
    ok(/Propp/.test(g) && /deseo/i.test(g) && /obst[áa]culo/i.test(g), 'y el guion cumple su propia herramienta: su protagonista quiere algo y tiene un obstáculo', 'el guion no lleva su propio deseo y obstáculo');

    log('\n── LAS SEIS LECTURAS (normas 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    const tl = lect.textContent.replace(/\s+/g, ' ');
    const claves = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
    ok(claves.every(k => !!d.getElementById('lect-' + k)), 'las seis tarjetas están, con sus ids',
       'faltan: ' + claves.filter(k => !d.getElementById('lect-' + k)).join(', '));
    ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'y no hay ninguna de más',
       'tarjetas: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
    ok(claves.every(k => !!d.querySelector('#lect-' + k + ' .lect-nota')), 'cada una con su nota de estatus', 'alguna tarjeta va sin lect-nota');
    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
       'y avisa de las preguntas de cada lectura y del plegado', 'la entrada no explica las preguntas ni el plegado');
    ok(/ejercicios? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl),
       'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
    ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis en el mismo saco');
    ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
    ok(/papeles/i.test(tl) && /no personas/i.test(tl), 'y dice que el careo firma con papeles', 'la etiqueta no dice cómo firma sus turnos el careo');
    ok(/nunca ocurrieron/i.test(tl), 'y que los encuentros de las entrevistas nunca ocurrieron', 'falta la declaración de ficción');
    ok(/Kidd y Castano/.test(tl) && /Panero/.test(tl), 'la sección repite el aviso de la materia con su ejemplo', 'la sección de lecturas no repite el aviso de la materia');
    ok(/El segundo bibliotecario/.test(tl), 'el cuento a la manera de Borges', 'falta el cuento');
    ok(/ventera/.test(tl) && /mozo/.test(tl), 'el capítulo cervantino, con su venta', 'falta el capítulo');
    ok(/La especie que quiere/.test(tl), 'el ensayo a la manera de Harari', 'falta el ensayo');
    ok(/Soler Serrano/.test(tl) && /A fondo/.test(tl), 'la entrevista, con las señas reales del entrevistador', 'la entrevista no declara quién es Soler Serrano');
    ok(/Quintero/.test(tl) && /Gala/.test(tl) && /Loco de la Colina/i.test(tl), 'la conversación del Loco de la Colina', 'falta la conversación');

    log('\n── LA ENTREVISTA IMAGINADA, Y SU CUIDADO PROPIO ──');
    const entr = d.getElementById('lect-entrevista');
    const nEntr = (entr.querySelector('.lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nEntr), 'la entrevista se declara IMAGINADA, en mayúsculas y a la vista', 'la entrevista no se declara imaginada');
    ok(/nunca ocurri/i.test(nEntr) && /1970/.test(nEntr) && /1976/.test(nEntr),
       'y dice por qué no pudo ocurrir: Propp murió en 1970 y «A fondo» empezó en 1976', 'no explica que el encuentro era imposible');
    ok(/entrevistas imposibles/i.test(nEntr), 'con el género al que se acoge, el de las entrevistas imposibles', 'no declara el género de la pieza');
    ok(/invenci[óo]n de la casa/i.test(nEntr), 'y declara que las palabras atribuidas son invención de la casa', 'no declara como invención lo que se le hace decir');
    ok(/reales y comprobables/i.test(nEntr) && /Morfolog[íi]a del cuento/.test(nEntr), 'mientras las obras y las fechas son reales y comprobables', 'la nota no separa lo inventado de lo comprobable');
    ok(/SOLER SERRANO\./.test(entr.textContent) && /PROPP\./.test(entr.textContent), 'los turnos se firman con el nombre en mayúsculas y punto (sin raya de diálogo)', 'los turnos de la entrevista no se firman al estilo de la casa');
    const nGala = (d.querySelector('#lect-gala .lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nGala) && /nunca ocurri/i.test(nGala), 'la conversación de Quintero y Gala también se declara imaginada', 'la conversación no se declara imaginada');
    ok(/\(silencio\)/.test(d.getElementById('lect-gala').textContent), 'y los silencios de Quintero van escritos como acotación', 'la conversación va sin los silencios');

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    const careo = d.getElementById('lect-debate');
    const tc = careo.textContent.replace(/\s+/g, ' ');
    const nota = (careo.querySelector('.lect-nota') || {}).textContent || '';
    ok(/MODERACI[ÓO]N\./.test(tc), 'los turnos de moderación firman en mayúscula', 'no hay turnos de MODERACIÓN');
    ok(/LA DEFENSA\./.test(tc) && /LA OBJECI[ÓO]N\./.test(tc), 'y los de la defensa y la objeción', 'faltan los papeles de defensa y objeción');
    ok(!/Ejercicio de estilo de la casa/i.test(nota), 'el careo NO lleva la etiqueta del pastiche', 'al careo le pusieron etiqueta de pastiche');
    ok(/palabras inventadas en boca de nadie/i.test(nota), 'y su nota declara que no se le pone palabra a nadie', 'la nota del careo no lo declara');
    ok(/mejor versi[óo]n/i.test(nota), 'y que cada postura va en su mejor versión (regla del acero)', 'la nota no declara la regla del acero');
    ok(/La pregunta en disputa, una sola/.test(tc), '1. la pregunta en disputa', 'falta la pregunta en disputa');
    ok(/Las r[ée]plicas, cruzadas/.test(tc), '4. las réplicas cruzadas', 'faltan las réplicas');
    ok(/El terreno com[úu]n, que casi siempre/.test(tc), '5. el terreno común', 'falta el terreno común');
    ok(/Lo que sigue en disputa/.test(tc), '6. y qué dato lo resolvería', 'el careo no dice qué dato lo resolvería');
    const i1 = tc.indexOf('La pregunta en disputa, una sola');
    const i2 = tc.indexOf('LA DEFENSA.');
    const i3 = tc.indexOf('LA OBJECIÓN.');
    const i4 = tc.indexOf('Las réplicas, cruzadas');
    const i5 = tc.indexOf('El terreno común, que casi siempre');
    const i6 = tc.indexOf('Lo que sigue en disputa');
    ok(i1 >= 0 && i1 < i2 && i2 < i3 && i3 < i4 && i4 < i5 && i5 < i6,
       'y las seis partes van en orden: pregunta, postura A, postura B, réplicas, terreno común y lo que sigue', 'las partes del careo están desordenadas');
    ok(/Morfolog[íi]a del cuento/.test(tc) && /1928/.test(tc), 'la defensa se apoya en la «Morfología del cuento» (1928)', 'la defensa no lleva su fuente');
    ok(/Dundes/.test(tc) && /1964/.test(tc), 'y en la aplicación de Dundes (1964) a los cuentos norteamericanos', 'falta Dundes (1964)');
    ok(/structure et la forme|estructura profunda/i.test(tc) && /1960/.test(tc), 'la objeción trae a Lévi-Strauss (1960) con su ensayo', 'falta Lévi-Strauss (1960) con su ensayo');
    ok(/Greimas/.test(tc) && /1966/.test(tc) && /actancial/i.test(tc), 'con el modelo actancial de Greimas (1966)', 'falta Greimas (1966) y el modelo actancial');
    ok(/Estructura e historia/.test(tc) && /1966/.test(tc), 'y la réplica de Propp (1966)', 'falta la réplica de Propp (1966)');
    ok(/se concede/i.test(tc) && /concesi[óo]n es sincera/i.test(tc), 'las réplicas conceden de verdad, no de boquilla', 'ninguna réplica concede nada');
    ok(/deseo/i.test(tc) && /oposici[óo]n/i.test(tc), 'y el terreno común pone el deseo y la oposición en el centro, que es el motor de la etapa', 'el careo no dice en qué coinciden');
    ok(!RAYA.test(tc), 'y el careo va sin guiones largos, tampoco en los turnos', 'el careo trae guiones largos');

    log('\n── LOS TRES BANCOS DE LAS LECTURAS ──');
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 de completar', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 de análisis complejo', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q=>q.o.length===4)'), 'y las 30 de comprensión traen sus cuatro opciones', 'alguna de comprensión no tiene cuatro opciones');
    const voces = ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'];
    voces.forEach(v => {
      const c = dentro('lectComprensionBank.filter(q=>q.t===' + JSON.stringify(v) + ').length');
      const f = dentro('lectCompletarBank.filter(q=>q.t===' + JSON.stringify(v) + ').length');
      const a = dentro('lectAnalisisBank.filter(q=>q.t===' + JSON.stringify(v) + ').length');
      ok(c === 5 && f === 2 && a === 2, '  ' + v + ': 5 de comprensión, 2 de completar y 2 de análisis',

    ok(nRutasStory >= 2, 'con sus varias rutas de especialización (' + nRutasStory + ')', 'Storytelling volvió a tener una sola ruta');
    ok(grupo && grupo.querySelectorAll('.ruta-card').length === nRutasStory,
       'y el grupo las pinta todas', 'el grupo pinta ' + (grupo ? grupo.querySelectorAll('.ruta-card').length : 0) + ' de ' + nRutasStory);
    if (grupo) {
      const bMat = grupo.querySelector('.materia-toggle');
      if (bMat.getAttribute('aria-expanded') !== 'true') { bMat.click(); await esperar(120); }
      const panelMat = da.getElementById(bMat.getAttribute('aria-controls'));
      ok(panelMat && !panelMat.hidden, 'al abrir el grupo se ven sus rutas', 'las rutas del grupo no se ven');
      const cardsStory = [...grupo.querySelectorAll('.ruta-card')];
      ok(cardsStory.every(c => c.querySelector('.ruta-toggle').getAttribute('aria-expanded') === 'false'),
         'y las rutas arrancan plegadas, no volcadas de golpe', 'alguna ruta de Storytelling arranca abierta');
      const tHilo = ruta.querySelector('.ruta-toggle');
      tHilo.click(); await esperar(120);
      const listaR = da.getElementById(tHilo.getAttribute('aria-controls'));
      ok(tHilo.getAttribute('aria-expanded') === 'true' && listaR && !listaR.hidden,
         'y al abrir la ruta del Hilo se ven sus doce etapas', 'la ruta del Hilo no abrió sus etapas');
    }
    const colorStory = wa.getComputedStyle(da.documentElement).getPropertyValue('--story').trim();
    ok(/^#|rgb/.test(colorStory), 'la materia trae su color propio en app.css (--story: ' + colorStory + ')', 'la materia no tiene color declarado');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="story"]');
    ok(!!chip, 'la materia Storytelling tiene su chip en la portada', 'no hay chip de Storytelling');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      const delStory = wa.eval('MISSIONS.filter(m=>m.materia==="story").length');
      ok(cards.length === delStory, 'la materia muestra sus ' + delStory + ' misiones', 'muestra ' + cards.length + ' de ' + delStory);
      const mia = cards.find(c => /El deseo y el obst[áa]culo/.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /🎯/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="hilo"&&m.etapa===2).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 2 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
