<script>
/* Comprueba la etapa 12 de la Ruta del Hilo que Tira (Storytelling): el
   taller, revisión con método y la prueba de dominio. Es el CIERRE de la
   ruta, la duodécima y última puerta, hacia la Ruta del Taller Mayor.
   Bancos, laboratorio, los ocho casos, el guion, las seis lecturas con sus
   preguntas dentro, el marcador, la impresión, la ficha, la materia y la
   ruta en el mapa.

   Las reglas propias de la materia que aquí se vigilan con más saña:
     1. NINGUNA HERRAMIENTA SIN AUTOR Y AÑO. Cada herramienta que la etapa
        menciona (Lamott 1994, Sommers 1980, Quiller-Couch 1914/1916,
        Elbow 1973, Egri 1946, Murray 1973) va con su año, en las cinco
        secciones de prosa. El ensayo trae además Pinker 2014 y Rozenblit
        y Keil 2002.
     2. LA GRIETA A LA VISTA: revisar es re-ver la estructura, no corregir
        la ortografía; editar no es revisar.
     3. LA MALA CITA declarada: «matar a tus amados» NO es de Faulkner, es
        de Quiller-Couch (1914), igual que la etapa 5 hizo con Chéjov.
     4. LA LISTA MAESTRA: esta etapa RECOGE y nombra las once herramientas
        de las etapas anteriores, por su nombre.
     5. LA REVISIÓN CON MÉTODO (tres pasadas) y LA PRUEBA DE DOMINIO (la
        misma historia en 30 segundos, 3 minutos y 30 minutos) son la
        herramienta reutilizable de la etapa.
     6. ES EL CIERRE: declara que cierra el Hilo y abre la Ruta del Taller
        Mayor, y en el catálogo las etapas FUTURAS del Hilo son CERO.
     7. CUIDADO ESPECIAL: NO deben aparecer como TEMA de esta etapa las
        marcas propias de la etapa 11 (Kuleshov, Eisenstein, Balázs,
        Quintiliano, primer plano, montaje, Fernán Gómez, actio); pero
        «contar sin la página» SÍ es legítimo, porque la lista maestra lo
        nombra como la undécima herramienta de la ruta.

   La comprobación de herramientas mira las cinco secciones de PROSA
   (Aprende, Estructura, Casos, Guion y Lecturas), no la página entera: los
   bancos pintan rótulos que son fichas de juego (es la trampa 1 de la
   norma 5-nonies).

   El guion largo se busca con su escape de código (u2014), nunca con el
   caracter puesto directo en este archivo: una sonda que lo llevara dentro
   se suspendería sola, siendo ella misma la primera en incumplir la regla
   que revisa.

   El resto de la etapa 11 y de etapas más viejas se busca con límites de
   palabra que no disparen con palabras legítimas de esta etapa. */
const RAYA = new RegExp('\\u2014');
const RAYAS_G = new RegExp('\\u2014', 'g');
const RE_ANY_YEAR = /\b(1[5-9]\d\d|19\d\d|20[0-2]\d)\b/;
const RE_RESTOS_11 = /\bKuleshov\b|\bEisenstein\b|\bBal[áa]zs\b|\bQuintiliano\b|primer plano|\bmontaje\b|\bFern[áa]n G[óo]mez\b|\bactio\b/i;
/* «El dial de mostrar y contar» (etapa 5) y «no-acontecimiento» (etapa 4) se
   sacan de esta lista a propósito: son justo dos de los nombres exactos que
   la lista maestra de esta etapa 12 tiene que citar (norma de la lista
   maestra), así que aquí no son un resto, son la tarea. */
const RE_RESTOS_VIEJOS = /focalizaci[óo]n|narrador no fiable|autor impl[íi]cito|\bBooth\b|\bStanzel\b|\bBally\b|Cide Hamete|Mart[íi]n Gaite|Lubbock|Le Guin|Gardner|Delibes|mostrar,? no cuentes|vidrio de botella|Mamet|Goldman|escena francesa|plano secuencia|Freytag|Vonnegut|kish[oō]tenketsu|Ar[áa]uz|Bracamonte|Campbell|monomito|Todorov|Hitchcock|Truffaut|Baldwin|O'Connor|Sontag|catarsis|sentimentalismo|oxitocina|S[áa]nchez Ferlosio|Bernays|Unamuno|Sunstein|Brehm|Slater|Rouner|Fisher|reactancia|ethos|pathos|(?<![a-záéíóúñA-ZÁÉÍÓÚÑ])logos\b|Anzuelo|\bWolfe\b|\bCapote\b|\bLejeune\b|\bMalcolm\b|\bCooke\b|\bFrey\b|\bJimmy\b|Chaves Nogales|Parry y Lord|\bOng\b(?!\w)|Rubin.{0,10}1995|Paivio|Csapo/i;
const out = document.getElementById('out');

const esperar = ms => new Promise(r => setTimeout(r, ms));

function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda hilo etapa 12'; };
  try {
    log('── LA MISIÓN ──');

    ok(/EL TALLER/.test(banda) && /QUILLER-COUCH/i.test(banda) && /LAMOTT/i.test(banda) && !/KULESHOV/i.test(banda) && !/CONTAR DE PIE/i.test(banda) && !/LA HISTORIA DE VERDAD/.test(banda) && !/LA HISTORIA QUE PERSUADE/.test(banda) && !/EMOCI[ÓO]N SIN CHANTAJE/.test(banda) && !/TIEMPO DEL RELATO/.test(banda) && !/VOZ Y EL PUNTO DE VISTA/.test(banda) && !/MOSTRAR/.test(banda) && !/LA ESCENA/.test(banda) && !/FORMA DE LAS FORMAS/.test(banda) && !/EL DESEO/.test(banda) && !/LA CADENA/.test(banda),
       'la banda del encabezado es de esta etapa (EL TALLER, QUILLER-COUCH y LAMOTT, sin restos de otras etapas)', 'la banda dice: ' + banda.slice(0, 70));
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);
    ok(d.querySelectorAll('#timelineTrack .tl-node').length === dentro('timelineData.length'),
       'y la línea de tiempo arrancó con sus ' + dentro('timelineData.length') + ' fechas', 'hitos pintados: ' + d.querySelectorAll('#timelineTrack .tl-node').length);
    ok((d.getElementById('lab-display').textContent || '').trim().length > 40, 'el laboratorio arrancó con una ficha puesta', 'el laboratorio arrancó vacío');

    log('\n── LA REGLA DE ORO: NINGUNA HERRAMIENTA SIN AUTOR Y AÑO ──');
    const prosa12 = ['s-aprende', 's-estructura', 's-casos', 's-guion', 's-lecturas']
      .map(id => (d.getElementById(id) || {}).textContent || '').join(' ').replace(/\s+/g, ' ');
    const bloquesProsa = [...d.querySelectorAll('#s-aprende .card, #s-estructura .card, #s-casos .card, #s-guion .card, #s-lecturas .card')]
      .filter(c => !c.querySelector('#timelineTrack') && !c.querySelector('.type-grid') && !c.querySelector('.stat-bar'));
    let huerfanas = 0, herramientas = 0, ejemplo = '';
    const reHer = /el primer borrador (es )?malo|revisar es re-ver|matar a tus amados|el lector de prueba|\bla premisa\b|terminar cortando|se termina cuando corta/gi;
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (reHer.test(txt)) {
        reHer.lastIndex = 0;
        herramientas++;
        if (!RE_ANY_YEAR.test(txt)) { huerfanas++; if (!ejemplo) ejemplo = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }

    ok(huerfanas === 0, 'toda herramienta que asoma (en ' + herramientas + ' bloque(s)) lleva su año en ese mismo bloque', 'hay ' + huerfanas + ' bloque(s) con herramienta huérfana: ' + ejemplo);
    ok(/Lamott/.test(prosa12) && /1994/.test(prosa12), 'el primer borrador malo a Lamott (1994)', 'falta Lamott (1994)');
    ok(/Sommers/.test(prosa12) && /1980/.test(prosa12), 'revisar es re-ver a Sommers (1980)', 'falta Sommers (1980)');
    ok(/Quiller-Couch/.test(prosa12) && /(1914|1916)/.test(prosa12), 'matar a tus amados a Quiller-Couch (1914)', 'falta Quiller-Couch (1914)');
    ok(/Elbow/.test(prosa12) && /1973/.test(prosa12), 'el lector de prueba a Elbow (1973)', 'falta Elbow (1973)');
    ok(/Egri/.test(prosa12) && /1946/.test(prosa12), 'la premisa a Egri (1946)', 'falta Egri (1946)');
    ok(/Murray/.test(prosa12) && /1973/.test(prosa12), 'terminar cortando a Murray (1973)', 'falta Murray (1973)');
    ok(/Pinker/.test(prosa12) && /2014/.test(prosa12), 'la maldición del conocimiento a Pinker (2014) en el ensayo', 'falta Pinker (2014) en el ensayo');
    ok(/Rozenblit/.test(prosa12) && /Keil/.test(prosa12) && /2002/.test(prosa12), 'y la ilusión de profundidad explicativa a Rozenblit y Keil (2002)', 'falta Rozenblit y Keil (2002)');
    ok(/ninguna herramienta se cita sin autor|autor, a[ñn]o y l[íi]mite|con su autor y su a[ñn]o|autor y (su )?año/i.test(cuerpo),
       'la regla de oro está escrita a la vista', 'la regla de oro de la ruta no aparece');

    log('\n── LA GRIETA A LA VISTA ──');
    ok(/revisar es re-ver/i.test(cuerpo), 'se declara que revisar es re-ver', 'no se declara que revisar es re-ver');
    ok(/corregir la ortograf[íi]a/i.test(cuerpo) && /(no es revisar|editar no es revisar|no lo es)/i.test(cuerpo), 'y que corregir la ortografía no es revisar', 'no se desarma la confusión de corregir la ortografía');
    ok(/editar no es revisar|editar es la superficie/i.test(cuerpo), 'editar no es revisar, declarado', 'no se declara que editar no es revisar');
    ok(/primer borrador (es )?malo/i.test(cuerpo) && /1994/.test(cuerpo), 'y que el primer borrador se supone malo (Lamott, 1994)', 'falta el permiso del primer borrador malo');

    log('\n── LA MALA CITA DE «MATAR A TUS AMADOS» ──');
    ok(/matar a tus amados/i.test(cuerpo), 'la frase aparece', 'no aparece la frase «matar a tus amados»');
    ok(/(no es de Faulkner|se le atribuye|Quiller-Couch)/i.test(cuerpo) && /Faulkner/.test(cuerpo), 'y se declara la mala atribución a Faulkner, con el autor real', 'no se declara la mala atribución');
    ok(/Twain/.test(cuerpo) || /Wilde/.test(cuerpo) || /Chesterton/.test(cuerpo), 'con al menos otro nombre al que también se le atribuye mal', 'falta un segundo nombre de la mala atribución');

    log('\n── LA LISTA MAESTRA: LAS ONCE HERRAMIENTAS DE LA RUTA ──');

    const nombradas = new Set((cuerpo.match(reMaestra) || []).map(s => s.toLowerCase()));
    ok(nombradas.size >= 5, 'al menos cinco de las once herramientas de la lista maestra aparecen por su nombre (aparecieron ' + nombradas.size + ')', 'solo aparecen ' + nombradas.size + ' de las once, con menos de cinco');
    ok(/contar sin la p[áa]gina/i.test(cuerpo), 'y «contar sin la página» (etapa 11) aparece de forma legítima, como parte de la lista', 'no se nombra «contar sin la página» dentro de la lista maestra');

    log('\n── LA REVISIÓN CON MÉTODO Y LA PRUEBA DE DOMINIO ──');
    ok(/tres pasadas|la pasada de diagn[óo]stico/i.test(cuerpo), 'las tres pasadas de la revisión con método', 'faltan las tres pasadas');
    ok(/revisi[óo]n con m[ée]todo/i.test(cuerpo), 'y se nombra como herramienta reutilizable', 'no se nombra la revisión con método');
    ok(/30 segundos|treinta segundos/i.test(cuerpo) && /(3 minutos|tres minutos)/i.test(cuerpo) && /(30 minutos|treinta minutos)/i.test(cuerpo),
       'la prueba de dominio, con sus tres duraciones (30 segundos, 3 minutos, 30 minutos)', 'faltan las tres duraciones de la prueba de dominio');
    ok(/lempira/i.test(cuerpo) || /L \d/.test(cuerpo), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');

    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');

    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),

    ok(!w.FaroTaller, 'y NO monta el taller de la memoria (no corresponde a esta etapa)', 'el taller de la memoria se coló en esta misión');

    const pedidos = [...d.querySelectorAll('script[src], link[href]')]
      .map(el => el.getAttribute('src') || el.getAttribute('href'))
      .filter(u => u && !/^(https?:|data:|mailto:)/.test(u));
    const faltan = [];
    for (const u of pedidos) {
      try {
        const r = await fetch(new URL(u, d.baseURI).href, { method: 'GET' });
        if (!r.ok) faltan.push(u + ' (' + r.status + ')');
      } catch (e) { faltan.push(u + ' (no se pudo pedir)'); }
    }
    ok(faltan.length === 0, 'los ' + pedidos.length + ' archivos que pide la página existen', 'faltan: ' + faltan.join(', '));

    log('\n── LA FICHA (normas 6 y 5-octies) ──');
    let fichaOk = false;
    try { const rf = await fetch('/fichas/ficha-hilo-el-taller.html'); fichaOk = rf.ok; } catch (e) {}
    ok(fichaOk, 'la ficha responde', 'la ficha no responde por HTTP');
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:900px;height:600px;border:0;position:absolute;left:-9999px;';
    fr.src = '/fichas/ficha-hilo-el-taller.html';
    document.body.appendChild(fr);
    await new Promise(r => { fr.onload = r; });
    await esperar(700);
    const fd = fr.contentDocument;
    const txtF = fd.body.textContent.replace(/\s+/g, ' ');
    ok(fd.querySelectorAll('.pagina').length === 10, 'la ficha tiene sus diez páginas', 'páginas: ' + fd.querySelectorAll('.pagina').length);
    ok(/El taller/.test(txtF) && /Hilo que Tira/.test(txtF), 'y es la de esta etapa', 'la ficha no es de esta misión');
    ok(!RE_RESTOS_11.test(txtF), 'sin restos de la etapa 11', 'la ficha arrastra temario de la etapa 11');
    ok(!/focalizaci[óo]n|narrador no fiable|autor impl[íi]cito|\bBooth\b|\bStanzel\b|\bBally\b|Cide Hamete|Mart[íi]n Gaite|Lubbock|Le Guin|Gardner|Delibes|mostrar,? no cuentes|vidrio de botella|Mamet|Goldman|escena francesa|Freytag|Vonnegut|kish[oō]tenketsu|Ar[áa]uz|monomito/i.test(txtF), 'ni de otras rutas o etapas viejas', 'la ficha arrastra temario de otra misión');
    ok(!RAYA.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok(/Pauta del ejercicio/i.test(txtF), 'con la pauta de los ejercicios', 'la ficha no trae pauta');
    ok(/protocolo/i.test(txtF) && /autor/i.test(txtF) && /l[íi]mite/i.test(txtF), 'el protocolo trabaja también en el papel', 'la ficha no enseña el protocolo de la etapa');
    ok(/1914/.test(txtF), 'y Quiller-Couch viaja impreso con su año', 'la ficha calla el año de Quiller-Couch');
    ok(/1973/.test(txtF), 'con Elbow o Murray, fechados', 'la ficha cita a Elbow o Murray sin su año');
    ok(/1980/.test(txtF), 'y Sommers, con su año', 'la ficha no trae a Sommers con su año');
    ok(/Taller Mayor/.test(txtF), 'y la ficha declara la puerta al Taller Mayor', 'la ficha no menciona el Taller Mayor');
    ok(/lecturas-marcador\.js/.test(fd.documentElement.innerHTML), 'la ficha trae el marcador (norma 5-octies)', 'la ficha no trae el marcador');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-hilo-el-taller"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');
    fr.remove();

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => (c.querySelector('.ruta-nombre') || {}).textContent === 'Ruta del Hilo que Tira');
    ok(!!ruta, 'la Ruta del Hilo que Tira está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(/Fundamentos del relato/.test(ruta.textContent), 'con su dominio a la vista (Fundamentos del relato)', 'la tarjeta no dice su dominio');
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "hilo").length');
      const totalCat = wa.eval('RUTAS.hilo.etapas');
      /* La cuenta sale del CATÁLOGO, no escrita a mano. Escrita a
         mano («construidasCat === 12») esta línea suspendía sola en
         cuanto la ruta crecía, sin que hubiera nada roto: es la
         lección de la Casa Cerrada, y la arrastraban las diez sondas
         del Hilo a la vez. Lo que hay que comprobar es que ESTA
         etapa conste construida, no cuántas había el día que se
         escribió la sonda. */
      ok(wa.eval('MISSIONS.some(m => m.ruta === "hilo" && m.etapa === 12)'),
         'el catálogo trae construida la etapa 12 (de ' + construidasCat + ' del Hilo)', 'la etapa 12 no consta construida en el catálogo');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(totalCat - construidasCat === 0, 'y con las doce construidas, las etapas futuras del Hilo son CERO (el cierre de la ruta)', 'quedan ' + (totalCat - construidasCat) + ' etapas futuras sin construir, y deberían ser 0');
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 0, 'y no queda ninguna tarjeta de «por construir» en el Hilo', 'quedan ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ' tarjetas de etapa futura');
      ok([...ruta.querySelectorAll('.re-link')].some(a => /El taller/.test(a.textContent)),
         'la etapa 12 ya es tocable, con el título de la misión', 'la etapa 12 no sale tocable con su título');
      ok([...ruta.querySelectorAll('.re-link')].some(a => /Contar de pie y contar en imagen/.test(a.textContent)),
         'y la etapa 11 sigue tocable', 'la etapa 11 desapareció del mapa');
    }
    const grupo = [...da.querySelectorAll('.materia-grupo')].find(x => (x.querySelector('.materia-nombre') || {}).textContent === 'Storytelling');
    ok(!!grupo, 'la materia Storytelling tiene su grupo en el mapa de rutas', 'no hay grupo de Storytelling');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="story"]');
    ok(!!chip, 'la materia Storytelling tiene su chip en la portada', 'no hay chip de Storytelling');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      const delStory = wa.eval('MISSIONS.filter(m=>m.materia==="story").length');
      ok(cards.length === delStory, 'la materia muestra sus ' + delStory + ' misiones', 'muestra ' + cards.length + ' de ' + delStory);
      const mia = cards.find(c => /El taller/.test(c.textContent) && /revisi[óo]n con m[ée]todo/i.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /✂️/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="hilo"&&m.etapa===12).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 12 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
