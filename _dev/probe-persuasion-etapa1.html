<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de la Persuasión, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-persuasion-palancas/palancas-influencia.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la misión nueva (bancos, laboratorio, pruebas, ficha) y que la
   Ruta del Poder ya muestre su primera etapa construida. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones (las 14 del molde y Casos del proyecto)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Persuasión · Etapa 1 de 6/.test(d.body.textContent), 'se presenta como etapa 1 de 6', 'no se presenta como etapa de la ruta');
    ok(!/activo|pasivo|patrimonio/i.test(d.querySelector('#s-aprende').textContent), 'sin restos de la etapa de la que se copió', 'quedan textos de Activos y Pasivos');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('Object.keys(parteData).join(",")') === 'urgencia,favor,autoridad,social', 'laboratorio con las 4 tácticas', 'tácticas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 6, 'las 6 palancas', 'palancas: ' + dentro('timelineData.length'));
    ok(/faro_persuasion/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Urgencia fabricada/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en la urgencia', 'abre en otra táctica');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el Simulacro de Presión se genera', 'simulacro vacío');
    ok(!/Panorama M\.E\.T\.A\.S|Activos y Pasivos · Ruta del Poder/.test(crit + d.body.textContent), 'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      const cajas = casos.querySelectorAll('.card');
      ok(cajas.length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + cajas.length);
      const txt = casos.textContent;
      ['ONG', 'departamentos', 'inversionista', 'editorial', 'coherencia', 'convencer', 'patrocinio', 'anuncios']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/M\.E\.T\.A\.S/.test(txt), 'los casos son sobre el futuro de M.E.T.A.S', 'los casos no mencionan el proyecto');
      ok(/Respuesta serena|respuesta serena/.test(txt), 'cada caso trae su respuesta serena', 'los casos no traen respuesta');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    /* La prueba competencial decide sobre el proyecto, no sobre casos genéricos */
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/M\.E\.T\.A\.S/.test(decisiones) && /inversionista/.test(decisiones),
      'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');
    ok(/guion de la respuesta serena/i.test(casos ? casos.textContent : ''), 'trae el guion de cuatro frases', 'falta el guion de la respuesta');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-persuasion-palancas.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    /* La ficha creció a diez hojas con la norma 6 (26 de julio de 2026); la
       sonda es anterior y esperaba tres. El número correcto es el de la norma. */
    ok((txt.match(/class="pagina"/g) || []).length === 10, 'las 10 páginas de la norma 6', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/El caso del proyecto/.test(txt), 'la ficha trae el caso del proyecto con su pauta', 'la ficha no trae caso del proyecto');
    ok(/La tabla de las seis palancas/.test(txt), 'trae la tabla de palancas para llenar', 'no trae la tabla de palancas');
    ok(/Pauta (completa )?de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    const rec = d.querySelector('#s-recursos a[href*="ficha-persuasion"]');
    ok(!!rec, 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const cards = [...da.querySelectorAll('.ruta-card')];
    const poder = cards.find(c => /Ruta de la Persuasión/.test(c.textContent));
    ok(!!poder, 'la Ruta de la Persuasión está en el mapa', 'no aparece la ruta');
    if (poder) {
      /* Cuentas sacadas del CATÁLOGO, no escritas a mano: las de a mano se
         quedaron viejas al crecer la ruta y la sonda suspendía sin que hubiera
         nada roto. Salió a la luz el día que estrenó veredicto en el título. */
      const construidasR = wa.eval('MISSIONS.filter(m => m.ruta === "persuasion").length');
      const totalR = wa.eval('RUTAS.persuasion.etapas');
      ok(poder.querySelectorAll('.re-link').length === construidasR, 'con sus ' + construidasR + ' etapas construidas ya tocables', 'etapas tocables: ' + poder.querySelectorAll('.re-link').length + ', construidas: ' + construidasR);
      ok(poder.querySelectorAll('.ruta-etapa-futura').length === totalR - construidasR, 'y el resto por construir, con nombre', 'futuras: ' + poder.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalR - construidasR));
      ok(/Sesgos/.test(poder.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    da.querySelector('.fam-chip[data-materia="psi"]').click(); await esperar(250);
    const enMateria = wa.eval('MISSIONS.filter(m => m.materia === "psi").length');
    ok(da.querySelectorAll('#missions-container .mission-card').length === enMateria, 'la materia Psicología y Persuasión muestra sus ' + enMateria + ' misiones', 'muestra ' + da.querySelectorAll('#missions-container .mission-card').length);

    /* El veredicto va al título: es lo que se lee al correr las sondas en tanda. */
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · persuasión etapa 1';
    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { document.title = 'SUSPENDE · persuasión etapa 1'; log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
