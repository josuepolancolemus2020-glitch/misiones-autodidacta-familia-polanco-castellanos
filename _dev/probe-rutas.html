<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Rutas, materias y botón de actualizar</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:900px;border:0;background:#fff}pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Siembra la sesión de Josué (el «login» solo elige perfil) y comprueba:
   - que el botón 🔄 esté en TODOS los encabezados,
   - que las materias del adulto aparezcan y filtren,
   - que el mapa de rutas pinte etapas hechas y etapas por construir. */
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  if (!sembrado) {
    sembrado = true;
    try {
      w.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
      w.localStorage.removeItem('faro_v1');   /* las cuentas se miden desde cero */
    } catch (e) {}
    f.contentWindow.location.reload();
    return;
  }
  await esperar(900);
  try {
    log('── BOTÓN DE ACTUALIZAR ──');
    const headers = d.querySelectorAll('.app-header');
    const conBoton = [...headers].filter(h => h.querySelector('.refresh-btn')).length;
    ok(headers.length > 0 && conBoton === headers.length,
      'el botón 🔄 está en los ' + headers.length + ' encabezados',
      conBoton + ' de ' + headers.length + ' encabezados lo tienen');
    ok(typeof w.faroForzarActualizacion === 'function', 'la función de actualización está disponible', 'falta la función de actualización');
    const b = d.querySelector('.refresh-btn');
    ok(b && /Actualizar/.test(b.getAttribute('title') || ''), 'dice qué hace al mantenerlo pulsado', 'sin title explicativo');

    log('\n── MATERIAS ──');
    /* La lista va escrita porque el ORDEN es un contrato (las escolares
       primero, después las del adulto y el Estudio Mayor al final), y eso no se
       puede sacar del catálogo sin dar por bueno cualquier orden. Storytelling
       entró el 24 de agosto de 2026 entre Derecho y el Estudio Mayor. */
    const mats = w.eval('MATERIAS.map(m=>m.id).join(",")');
    ok(mats === 'esp,mat,cnat,csoc,epis,ing,psi,mkt,eco,pol,cib,ia,ley,story,mayor',
      '15 materias: 5 escolares, 9 del adulto y el Estudio Mayor', 'materias: ' + mats);
    /* La CUENTA de chips, en cambio, sale del catálogo: escrita a mano, añadir
       una materia suspendía esta sonda sin que hubiera nada roto, y encima
       dejaba pasar el caso contrario, el de una materia sin su chip en
       index.html (que van escritos a mano y no se generan). */
    const nChips = d.querySelectorAll('#materia-chips .fam-chip').length;
    const nMats = w.eval('MATERIAS.length');
    ok(nChips === nMats + 1, (nMats + 1) + ' chips (Todas + las ' + nMats + ' materias)', 'chips: ' + nChips + ', se esperaban ' + (nMats + 1));
    /* Y que cada materia tenga SU chip, no solo que las cuentas cuadren. */
    const sinChip = w.eval('MATERIAS.map(m=>m.id)').filter(id => !d.querySelector('#materia-chips .fam-chip[data-materia="' + id + '"]'));
    ok(sinChip.length === 0, 'y cada materia tiene el suyo, con su data-materia', 'sin chip: ' + sinChip.join(', '));
    w.switchView('view-misiones'); await esperar(200);
    d.querySelector('.fam-chip[data-materia="ing"]').click(); await esperar(250);
    ok(d.querySelectorAll('#missions-container .mission-card').length === 2,
      'la materia Ingeniería del Sistema filtra sus 2 misiones',
      'muestra ' + d.querySelectorAll('#missions-container .mission-card').length + ' misiones');

    log('\n── MAPA DE RUTAS ──');
    w.switchView('view-rutas'); await esperar(300);
    const cards = d.querySelectorAll('.ruta-card');
    const totalRutas = w.eval('Object.keys(RUTAS).length');
    ok(cards.length === totalRutas, 'las ' + totalRutas + ' rutas del catálogo están en el mapa', 'rutas: ' + cards.length + ' de ' + totalRutas);
    /* El Estudio Mayor entero se declaró antes de construirse (como la Ley):
       el mapa tiene que enseñar cada ruta con todas sus etapas tituladas. */
    const pantalla = [...cards].find(c => /Ruta de la Pantalla Leída/.test(c.textContent));
    ok(!!pantalla, 'la Ruta de la Pantalla Leída está en el mapa', 'falta la ruta de cine');
    if (pantalla) {
      ok(pantalla.querySelectorAll('.ruta-etapa-futura').length === 7, 'con sus 7 etapas por construir', 'futuras: ' + pantalla.querySelectorAll('.ruta-etapa-futura').length);
      ok(/El cineclub de la casa/.test(pantalla.textContent), 'y las etapas llevan su título del compendio', 'las etapas salen sin título');
      ok(!/Etapa por construir/.test(pantalla.textContent), 'ninguna queda con el rótulo genérico', 'hay etapas sin título');
    }
    /* El Expediente Rojo ya tiene la etapa 1 construida (El acero antes del
       juicio): 1 tocable y 6 previstas, siempre 7 en total. */
    const rojo = [...cards].find(c => /Ruta del Expediente Rojo/.test(c.textContent));
    ok(!!rojo && rojo.querySelectorAll('.re-link').length === 1 && rojo.querySelectorAll('.ruta-etapa-futura').length === 6,
       'el Expediente Rojo declara sus 7 etapas (1 construida y 6 previstas)', 'falta el Expediente Rojo completo');
    /* Las Gafas a la Vista van por la etapa 3 (La palabra con expediente, El
       bisturí de Freeden y El mapa de las familias): 3 tocables y 4 previstas,
       siempre 7 en total. Los títulos de las construidas tienen que venir de
       MISSIONS, y por eso sus claves se borraron de ETAPAS_PREVISTAS.gafas.
       Esta cuenta sube cada vez que se construye una etapa de la ruta. */
    const gafas = [...cards].find(c => /Ruta de las Gafas a la Vista/.test(c.textContent));
    ok(!!gafas && gafas.querySelectorAll('.re-link').length === 3 && gafas.querySelectorAll('.ruta-etapa-futura').length === 4,
       'las Gafas a la Vista declaran sus 7 etapas (3 construidas y 4 previstas)', 'falta la ruta de las Gafas completa');
    if (gafas) ok(/La palabra con expediente/.test(gafas.textContent) && /El bisturí de Freeden/.test(gafas.textContent) && /El mapa de las familias/.test(gafas.textContent) && !/Etapa por construir/.test(gafas.textContent),
       'las etapas 1, 2 y 3 de las Gafas toman su título de MISSIONS', 'alguna etapa construida de las Gafas no sale con su título');
    /* Cinco rutas del adulto van por la etapa 3 y la Casa Cerrada por la 4.
       Si alguna se queda corta es que la misión nueva no llegó al catálogo. */
    [['Ruta de la Persuasión', 3], ['Ruta de la Marca', 3], ['Ruta del Poder', 3],
     ['Ruta de la Máquina que Predice', 3], ['Ruta del Poder Político', 3],
     ['Ruta de la Casa Cerrada', 4]].forEach(([nombre, tocables]) => {
      const r = [...cards].find(c => (c.querySelector('.ruta-nombre') || {}).textContent === nombre);
      if (!r) { fallos++; log('  ✘ falta ' + nombre); return; }
      const n = r.querySelectorAll('.re-link').length;
      ok(n === tocables, nombre + ': ' + n + ' etapas tocables', nombre + ': ' + n + ' etapas tocables y se esperaban ' + tocables);
    });
    const ing = [...cards].find(c => /Ingeniería del Sistema/.test(c.textContent));
    ok(!!ing, 'está la Ruta de la Ingeniería del Sistema', 'falta la ruta técnica');
    if (ing) {
      const etapas = ing.querySelectorAll('.ruta-etapa');
      const hechas = ing.querySelectorAll('.re-link');
      const futuras = ing.querySelectorAll('.ruta-etapa-futura');
      /* La Ingeniería cambió de formato: 2 misiones normales y, de la etapa 3 a
         la 10, las asignaciones metalingüísticas de js/data/asignaciones.js.
         Por eso ya no le quedan etapas «por construir». */
      ok(etapas.length === 10, 'muestra las 10 etapas', 'etapas: ' + etapas.length);
      ok(hechas.length === 10, '10 etapas tocables: 2 misiones y 8 asignaciones', 'tocables: ' + hechas.length);
      ok(futuras.length === 0, 'ninguna queda «por construir»', 'futuras: ' + futuras.length);
      ok(/El testamento técnico/.test(ing.textContent), 'las asignaciones salen con su nombre', 'las asignaciones no aparecen');
      ok(/0 de 10 etapas recorridas/.test(ing.textContent), 'la cuenta arranca en 0 de 10', 'cuenta: ' + (ing.querySelector('.ruta-cuenta') || {}).textContent);
    }
    /* La Ley es la ruta más larga del mapa y la que va más atrás: doce etapas
       salidas del compendio y las tres primeras construidas. Se comprueba
       aparte porque es el caso que mezcla las dos cosas, etapas tocables y
       etapas en gris, y porque el título de las construidas tiene que venir de
       MISSIONS y no de ETAPAS_PREVISTAS. Estas cuentas suben cada vez que se
       construye una etapa. */
    const ley = [...cards].find(c => /Ruta de la Ley y sus Grietas/.test(c.textContent));
    ok(!!ley, 'está la Ruta de la Ley y sus Grietas', 'falta la ruta de la ley');
    if (ley) {
      ok(ley.querySelectorAll('.ruta-etapa').length === 12, 'muestra las 12 etapas del compendio', 'etapas: ' + ley.querySelectorAll('.ruta-etapa').length);
      ok(ley.querySelectorAll('.ruta-etapa-futura').length === 9, '9 van «Por construir»', 'futuras: ' + ley.querySelectorAll('.ruta-etapa-futura').length);
      ok(ley.querySelectorAll('.re-link').length === 3, 'las etapas 1, 2 y 3 ya se pueden tocar', 'tocables: ' + ley.querySelectorAll('.re-link').length);
      ok(/0 de 12 etapas recorridas · 3 construidas/.test(ley.textContent), 'la cuenta dice 0 de 12 y 3 construidas', 'cuenta: ' + (ley.querySelector('.ruta-cuenta') || {}).textContent);
      ok(/De dónde saca su fuerza la ley/.test(ley.textContent) && /Anatomía de la Constitución de 1982/.test(ley.textContent) && /Los derechos y la coletilla/.test(ley.textContent),
         'las etapas 1, 2 y 3 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(!/Etapa por construir/.test(ley.textContent), 'cada etapa sale con su nombre, no con el rótulo genérico', 'alguna etapa no tiene título en ETAPAS_PREVISTAS');
    }
    ok(d.querySelector('.qa-item[data-qa="view-rutas"]') && d.querySelector('.drawer-item[data-view="view-rutas"]'),
      'hay entrada en Acceso Rápido y en el menú', 'falta alguna entrada a Mis Rutas');

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    /* El veredicto va también en el título, como en las demás sondas: es lo que
       lee el corredor sin tener que interpretar el texto de la salida. */
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda de rutas';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda de rutas'; }
};
</script>
</body>
</html>
