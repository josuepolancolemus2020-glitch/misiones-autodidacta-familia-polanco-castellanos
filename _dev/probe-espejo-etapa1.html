<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de la Máquina que se Mira, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-espejo-vigia-timon/vigia-timon.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta de la Máquina que se Mira, que además es la
   primera misión del Estudio Mayor: bancos, laboratorio, pruebas impresas con
   su nombre, los ocho casos, la ficha, la materia nueva y la ruta en el mapa.

   La regla de esta ruta no es la de la Ley (artículos comprobados): es la
   REGLA DEL ESTATUS del compendio: ningún estudio entra sin su etiqueta. La
   sonda exige que los dos clásicos que sostienen la etapa (Flavell 1979,
   Nelson y Narens 1990) aparezcan CON año y CON etiqueta, porque una misión
   que enseñara a auditar partes citando estudios sin estatus sería el error
   que quiere evitar.

   Desde la norma 5-nonies vigila además las SEIS lecturas: el careo con sus
   seis partes y sus anclas reales, que las seis empiecen plegadas, que cada
   una traiga sus propias preguntas dentro y que la batería vieja del final
   ya no exista.

   Un detalle que no es capricho: los guiones largos que esta sonda caza se
   escriben aquí escapados (\u2014). Si se escribieran tal cual, la propia
   sonda saldría en el grep de la norma 1-bis y daría por sucio un archivo
   que está limpio. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Máquina que se Mira · Etapa 1 de 6/.test(d.body.textContent), 'se presenta como etapa 1 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 3 de la Ley, y su vocabulario no
       va aquí. Se mira todo, porque esta ruta no tiene motivo para nombrar
       coletillas ni artículos en ninguna sección. */
    ok(!/coletilla|orden público|La Gaceta|jurisprudencia|artículo 72|remisión|Casa Cerrada/i.test(d.body.textContent),
       'sin restos de la misión de la que se copió', 'queda el temario de la etapa de la Ley');
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');

    log('\n── LA REGLA DEL ESTATUS (la regla del Estudio Mayor) ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Flavell/.test(texto0) && /1979/.test(texto0), 'Flavell aparece con su año', 'falta Flavell con 1979');
    ok(/Nelson y Narens/.test(texto0) && /1990/.test(texto0), 'Nelson y Narens aparecen con su año', 'falta Nelson y Narens con 1990');
    ok(/clásico sólido/i.test(texto0), 'las fuentes llevan su etiqueta de estatus', 'ninguna fuente lleva etiqueta');
    ok(/Dunlosky/.test(texto0) && /Koriat/.test(texto0), 'anuncia las fuentes de las etapas siguientes', 'faltan Dunlosky y Koriat en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    /* El molde llama «a» al índice correcto de evalMCBank y «c» al de qzData.
       Confundirlos deja la evaluación final calificando al azar. */
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('Object.keys(parteData).join(",")') === 'niveles,vigia,timon,brecha', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos de la sesión vigilada', 'momentos: ' + dentro('timelineData.length'));
    ok(/faro_espejo_vigia/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/metacognición/i.test(texto), 'nombra la metacognición', 'no aparece la palabra metacognición');
    ok(/nivel objeto/i.test(texto) && /metanivel/i.test(texto), 'los dos pisos con su nombre técnico', 'faltan nivel objeto y metanivel');
    ok(/monitoreo/i.test(texto) && /control/i.test(texto), 'monitoreo y control', 'faltan monitoreo y control');
    ok(/vigía/i.test(texto) && /timón/i.test(texto), 'el vigía y el timón', 'falta la metáfora de la casa');
    ok(/datos malos/i.test(texto), 'la falla habitual: decidir bien sobre datos malos', 'no aparece la falla habitual');
    ok(/cuaderno cerrado|material cerrado/i.test(texto), 'la lectura fiable: el material cerrado', 'no aparece el cuaderno cerrado');
    ok(/Reconocer no es recordar/i.test(texto), 'reconocer no es recordar', 'falta la distinción reconocer/recordar');
    ok(/brecha/i.test(texto) && /predicción/i.test(texto), 'la predicción y la brecha', 'faltan predicción y brecha');
    ok(/registro/i.test(texto), 'el registro del vigía', 'no aparece el registro');
    ok(/seguir|cambiar|abandonar/i.test(texto), 'las decisiones del timón', 'faltan las tres decisiones');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Los dos pisos/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en los dos pisos', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="niveles"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la sesión sobre la mesa se genera', 'prueba competencial vacía');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(!/coletilla|Ley y sus Grietas|derecho sobre la mesa|Etapa 3|Derecho y Ley/i.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['relee|relectura', 'técnica', '3,500', 'entendieron', 'compendio', 'XP', 'fluy', 'registro']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length === 8, 'los ocho casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/hoja del vigía/i.test(txt), 'trae la hoja del vigía', 'falta la hoja del vigía');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/3,500|entendieron|flashcards|hoja en blanco|registro/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');



    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/don Neto/i.test(tg), 'el guion tiene personaje propio, y no es una clase hablada', 'el guion no tiene personaje');
      ok(/7:10|6:20 a 7:10/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entran el nombre y las fechas, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(18\d\d|19\d\d|20\d\d)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/1979/.test(tg) && /1990/.test(tg) && /1997/.test(tg) && /2013/.test(tg),
         'el guion trae las fechas de la etapa (Flavell, Nelson y Narens, Koriat, Dunlosky)', 'al guion le faltan fechas');
      ok(/datos malos/i.test(tg), 'y la frase de la etapa: decidir bien sobre datos malos', 'el guion no trae la falla habitual');
      ok(/hoja en blanco/i.test(tg) && /brecha/i.test(tg), 'y la herramienta: la hoja en blanco y la brecha', 'el guion no enseña la herramienta');
      ok(/vigía/i.test(tg) && /timón/i.test(tg) && /nivel objeto/i.test(tg) && /metanivel/i.test(tg),
         'y los dos pisos con sus dos oficios', 'el guion no nombra los dos pisos');
      ok(/seguir/i.test(tg) && /cambiar/i.test(tg) && /abandonar/i.test(tg),
         'y las tres decisiones del timón', 'el guion no trae las tres decisiones');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl) && /Punset/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl),
         'las cinco primeras voces están nombradas', 'faltan voces en la sección');
      ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(/La libreta de dos columnas/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/bachiller/.test(tl) && /moza/.test(tl) && /venta/.test(tl), 'el capítulo cervantino está, con su venta y su examen', 'falta el capítulo cervantino');
      ok(/El animal que cree que sabe/.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las dos entrevistas nuevas (norma 5-quinquies), con la etiqueta que
         declara que el encuentro nunca ocurrió: sin esa declaración serían
         justo el parte falso con buena cara que la etapa enseña a cazar. */
      const cardEnt = d.getElementById('lect-entrevista');
      const cardGala = d.getElementById('lect-gala');
      ok(!!cardEnt, 'existe la tarjeta lect-entrevista', 'falta #lect-entrevista');
      ok(!!cardEnt && /nunca ocurrió/i.test((cardEnt.querySelector('.lect-nota') || {}).textContent || ''),
         'y su nota declara que el encuentro nunca ocurrió', 'la entrevista no declara la ficción');
      ok(!!cardGala, 'existe la tarjeta lect-gala', 'falta #lect-gala');
      ok(!!cardGala && /nunca ocurrió/i.test((cardGala.querySelector('.lect-nota') || {}).textContent || ''),
         'y la de Quintero y Gala también lo declara', 'la conversación no declara la ficción');
      ok(/PUNSET\./.test(tl) && /FLAVELL\./.test(tl) && /QUINTERO\./.test(tl) && /GALA\./.test(tl),
         'el diálogo va con nombre en mayúsculas y punto, sin raya (norma 1-bis)', 'el diálogo no usa el formato de teatro');
      ok(/\(Silencio/.test(tl), 'los silencios de Quintero van en acotación', 'faltan los silencios en acotación');
      ok(/entrevistas imposibles/i.test(tl) && /Calvino/.test(tl), 'la entrevista se ancla al género real de las entrevistas imposibles', 'falta el ancla del género');
      /* La entrada de la sección tiene que anunciar el reparto nuevo: seis
         textos, cada uno con SUS preguntas, y las seis plegadas al entrar
         (norma 5-nonies). Es lo primero que lee quien llega. */
      ok(/Seis lecturas/i.test(tl) && /careo/i.test(tl), 'la entrada anuncia seis lecturas y nombra el careo', 'la entrada sigue hablando de cinco');
      ok(/sus propias preguntas debajo/i.test(tl) && /plegadas/i.test(tl),
         'y avisa de que cada lectura trae sus preguntas y de que empiezan plegadas', 'la entrada no avisa del reparto nuevo');
      ok(/Por qué seis voces/i.test(tl) && /disputa que sigue abierta/i.test(tl),
         'la tarjeta final explica qué hace el careo que las otras cinco no pueden', 'la tarjeta final sigue siendo la de cinco voces');
      /* La regla del autor: la erudición interna es REAL, con sus años. */
      ok(/1976/.test(tl) && /1979/.test(tl) && /American Psychologist/.test(tl), 'ancla real: Flavell con 1976, 1979 y su revista', 'faltan las fechas de Flavell dentro de los textos');
      ok(/Nelson/.test(tl) && /Narens/.test(tl) && /1990/.test(tl), 'ancla real: Nelson y Narens (1990)', 'falta el mapa de 1990 dentro de los textos');
      ok(/Koriat/.test(tl) && /1997/.test(tl), 'ancla real: Koriat (1997) y sus pistas', 'falta Koriat dentro de los textos');
      ok(/Dunlosky/.test(tl) && /2013/.test(tl), 'ancla real: Dunlosky y colegas (2013)', 'falta la monografía de 2013 dentro de los textos');
      ok(/Piaget/.test(tl) && /1963/.test(tl), 'ancla real: el libro de Flavell sobre Piaget (1963)', 'falta el libro de 1963');
      ok(/Redes/.test(tl) && /1996/.test(tl), 'ancla real: el programa «Redes» con sus años', 'falta la seña real de Punset');
      /* Dos candados que nacieron de un dato falso publicado: la nota de la
         entrevista decía que Flavell murió en 2023, y murió el 13 de marzo
         de 2025 (obituario de Stanford, junio de 2025). Como la nota viaja
         impresa junto a la promesa de que toda fecha es real, se fija aquí
         el año bueno y se veta el malo. Y la norma 5-quinquies pide además
         alguna entrevista REAL del entrevistador: por «Redes» pasaron de
         verdad Oliver Sacks, Jane Goodall y Daniel Goleman. */
      const notaEnt = !!cardEnt && ((cardEnt.querySelector('.lect-nota') || {}).textContent || '');
      ok(/1928-2025/.test(notaEnt) && !/1928-2023/.test(notaEnt),
         'las fechas vitales de Flavell son las reales (1928-2025)', 'la nota trae mal las fechas de Flavell');
      ok(/Sacks|Goodall|Goleman/.test(notaEnt),
         'la nota de Punset nombra entrevistas reales de «Redes» (norma 5-quinquies)', 'la nota no da ninguna entrevista real de Punset');
      ok(/loco de la colina/i.test(tl) && /perro verde/i.test(tl), 'ancla real: los programas de Quintero', 'faltan las señas reales de Quintero');
      ok(/Troylo/.test(tl) && /Anillos para una dama/.test(tl) && /1973/.test(tl) && /manuscrito carmesí/i.test(tl),
         'anclas reales de Gala: Troylo, el teatro de 1973 y el Planeta', 'faltan las señas reales de Gala');
      /* Las seis lecturas deben ENSEÑAR la etapa, no solo sonar bonito. */
      ok(/cuaderno cerrado|material cerrado|papel guardado/i.test(tl) && /brecha/i.test(tl) && /predicción|predicho/i.test(tl),
         'las lecturas enseñan la etapa: comprobación, predicción y brecha', 'las lecturas no tocan el tema');
      ok(/monitoreo/i.test(tl) && /control/i.test(tl) && /nivel objeto/i.test(tl) && /metanivel/i.test(tl),
         'y traen el mapa técnico con sus nombres', 'las lecturas no traen el mapa técnico');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie: enfrenta
       dos posturas reales. Por eso su etiqueta es distinta y por eso aquí se
       exige lo contrario que a los otros cinco: que NO diga «no es obra de
       ese autor» (no hay autor imitado) y que sí diga que los turnos los
       firman papeles y no personas. Ponerle palabras inventadas en la boca a
       una investigadora viva sería justo el parte falso que la etapa caza. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent;
      const notaC = (careo.querySelector('.lect-nota') || {}).textContent || '';
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no se le pone a nadie una palabra en la boca|no personas/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(/mejor versión/i.test(notaC), 'y que cada postura va en su mejor versión (el acero antes del juicio)', 'el careo no declara la regla del acero');
      ok(/pregunta en disputa/i.test(tc), '1. plantea la pregunta en disputa', 'al careo le falta la pregunta en disputa');
      ok(/reducción de discrepancia/i.test(tc), '2. la postura A: la reducción de discrepancia', 'falta la primera postura');
      ok(/región de aprendizaje próximo/i.test(tc), '3. la postura B: la región de aprendizaje próximo', 'falta la segunda postura');
      ok(/réplicas/i.test(tc), '4. las réplicas, cada lado contestando al otro', 'al careo le faltan las réplicas');
      ok(/terreno común|concedo/i.test(tc), '5. dice qué aceptan las dos posturas', 'al careo le falta el terreno común');
      ok(/sigue en disputa/i.test(tc), '6. dice qué sigue en disputa', 'el careo no dice qué queda sin resolver');
      ok(/dato lo resolvería|dato resolvería|Qué dato/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');
      /* Las anclas de la disputa, que son reales y comprobables: autores,
         años y revistas que aparecen de verdad dentro de este careo. */

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    const abiertos = [];
    const openReal = w.open;
    w.open = function () {
      const doc = { write(s) { abiertos.push(s); }, close() {} };
      return { document: doc, print() {}, focus() {}, close() {} };
    };
    try {

      w.imprimirLectura('cervantes');
      const hc = abiertos[abiertos.length - 1] || '';
      ok(/bachiller/.test(hc) && /moza/.test(hc) && /ventero/.test(hc),
         'el capítulo cervantino se imprime completo', 'el capítulo no se imprime');

         'los diálogos cervantinos van en comillas, no con raya', 'el capítulo perdió sus diálogos en comillas');
      ok(!/\u2014/.test(hc), 'y sin guiones largos (norma 1-bis)', 'la hoja del capítulo trae guiones largos');

      w.imprimirLectura('harari');
      const hh = abiertos[abiertos.length - 1] || '';
      ok(/El animal que cree que sabe/.test(hh) && /la única especie que estudia/.test(hh),
         'el ensayo se imprime completo', 'el ensayo no se imprime');
      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      w.imprimirLectura('entrevista');
      const he4 = abiertos[abiertos.length - 1] || '';
      ok(/ya estoy listo/.test(he4) && /FLAVELL\./.test(he4) && /PUNSET\./.test(he4),
         'la entrevista se imprime completa', 'la entrevista no se imprime');
      ok(/nunca ocurrió/i.test(he4), 'y su hoja declara que el encuentro nunca ocurrió', 'la entrevista impresa no declara la ficción');
      ok(/Entrevista imaginada/i.test(he4), 'con la etiqueta propia del género', 'la entrevista impresa lleva la etiqueta equivocada');

      w.imprimirLectura('gala');
      const hg = abiertos[abiertos.length - 1] || '';
      ok(/QUINTERO\./.test(hg) && /GALA\./.test(hg) && /el espejo deja de adular/.test(hg),
         'la conversación se imprime completa, hasta el aforismo', 'la conversación no se imprime');
      ok(/nunca ocurrió/i.test(hg), 'y su hoja declara que la charla nunca ocurrió', 'la conversación impresa no declara la ficción');

      w.imprimirLectura('debate');
      const hd = abiertos[abiertos.length - 1] || '';
      ok(/LA OBJECIÓN\./.test(hd) && /Metcalfe/.test(hd) && /trabajo en vano/.test(hd),
         'el careo se imprime completo', 'el careo no se imprime');
      ok(/Careo escrito por la casa/i.test(hd), 'con su etiqueta propia, la del careo', 'el careo sale sin su etiqueta');
      ok(!/NO es obra de ese autor/i.test(hd), 'y NO con la del pastiche, porque no imita a nadie', 'el careo sale etiquetado como pastiche');
      ok(!/\u2014/.test(hd), 'y sin guiones largos', 'el careo impreso trae guiones largos');
      /* Cada lectura se imprime con SUS preguntas y su pauta en hoja aparte
         (normas 5-quater y 5-nonies): así una hoja suelta sirve sola. */
      ok(/Preguntas de esta lectura/.test(hd), 'y con sus propias preguntas detrás', 'la hoja del careo sale sin sus preguntas');
      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');
      ok((hd.match(/class="op"/g) || []).length === 20, 'sus 5 preguntas con sus 20 opciones', 'opciones del careo: ' + (hd.match(/class="op"/g) || []).length);
      ok(/Preguntas de esta lectura/.test(hb), 'y el cuento también sale con las suyas', 'la hoja del cuento sale sin preguntas');

      w.imprimirTodasLasLecturas();
      const h5 = abiertos[abiertos.length - 1] || '';
      ok(/La libreta de dos columnas/.test(h5) && /bachiller/.test(h5) && /El animal que cree que sabe/.test(h5) && /ya estoy listo/.test(h5) && /el espejo deja de adular/.test(h5) && /LA OBJECIÓN\./.test(h5),
         'las seis lecturas se imprimen juntas en un solo pliego', 'el pliego de las seis no sale completo');
      ok((h5.match(/page-break-before/g) || []).length >= 6, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h5) && /nunca ocurri/i.test(h5),
         'y el pliego declara el pastiche y la ficción de las entrevistas', 'el pliego de las seis no declara la ficción');
      ok(/careo escrito por la casa sobre una disputa real/i.test(h5),
         'y dice que el sexto es un careo, no un pastiche más', 'el pliego mete el careo en el saco del pastiche');
      ok(/John H\. Flavell/.test(h5), 'y nombra a los invitados de esta etapa, no a los de otra misión', 'el pliego trae los invitados de otra misión');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con 30 de comprensión', 'al pliego de preguntas le falta una sección');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(/nunca ocurrieron|nunca ocurrió/i.test(hp), 'y el pliego declara la ficción de las entrevistas', 'el pliego de preguntas no declara la ficción');
      ok(!/\u2014/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');
    } finally { w.open = openReal; }


    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    /* La linterna enseña el número que le toca a cada tarjeta, y cobra su
       precio: esa secuencia deja de dar XP, y se dice en pantalla. */
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/METACOGNICI/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(!/SOCIEDAD ABIERTA|RACIONALISMO CRÍTICO|CISNE NEGRO/.test(banda), 'sin las palabras de la misión de Popper', 'la banda sigue siendo la de Popper');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-espejo-vigia-timon.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja del vigía, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja del vigía en blanco', 'falta la hoja del vigía en blanco');
    ok(/Una hoja del vigía ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/El registro del vigía/i.test(txtF), 'la ficha trae el registro de cuatro columnas', 'falta el registro');
    ok(/nivel objeto/i.test(txtF) && /metanivel/i.test(txtF), 'la ficha trae los dos pisos con su nombre', 'faltan los dos pisos');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok(/clásico sólido/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-espejo-vigia-timon"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de la Máquina que se Mira/.test(c.textContent));
    ok(!!ruta, 'la Ruta de la Máquina que se Mira está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 1, 'con su etapa 1 ya tocable', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 5, 'y 5 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/El vigía y el timón/.test(ruta.textContent), 'la etapa 1 sale con el título de la misión', 'la etapa 1 no sale con su título');
      ok(/Las trampas del/.test(ruta.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La materia «mayor» crece con cada misión del Estudio Mayor: átomos
         y acero la subieron a tres, igual que las sondas de la Ley. */
      ok(tarjetas.length === 13, 'la materia muestra sus trece misiones', 'muestra ' + tarjetas.length);
      const t = tarjetas.find(x => /vigía y el timón/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda espejo etapa 1';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda espejo etapa 1'; }
});
</script>
</body>
</html>
