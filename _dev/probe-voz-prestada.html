<script>
/* Sonda de la herramienta 📖 LA VOZ PRESTADA.

   Esta herramienta guarda textos que una máquina escribió imitando la
   voz de otro —cuentos, ensayos, poemas— y los deja leer como un libro.
   Lo que puede salir mal no es «se ve feo»:

   1. QUE UN TEXTO SE GUARDE SIN SU ETIQUETA. Es LA regla. Un cuento
      «al modo de» alguien, leído seis meses después en una tableta y
      sin la ventana del chat alrededor, no se distingue de uno que sí
      fuera suyo: así nace una atribución falsa, sin mala fe. La
      etiqueta tiene que estar en la ficha, en la portada, en el pie de
      cada página y dentro de lo que copia el botón 📋, y el guardado
      tiene que PARARSE si falta.

   2. QUE EL PEGADO DESCUARTICE EL TEXTO. Una línea corta y suelta que
      ascienda a capítulo mete un salto de página en mitad de una
      escena, y eso PARECE QUE FUNCIONÓ: sale el índice, salen las
      páginas, todo. Solo se descubre leyendo el texto entero. Y el
      revés con los poemas: juntar los versos en un párrafo los destruye
      sin avisar.

   3. QUE AL CAMBIAR LA LETRA SE PIERDA EL SITIO. El número de páginas
      depende del tamaño de letra y del ancho de la pantalla, así que la
      posición se guarda por PÁRRAFO y fracción. Se mide de verdad: se
      abre la sala, se pasa a la página 3, se sube la letra y se mira si
      el párrafo sigue a la vista.

   4. QUE LA ÚLTIMA PÁGINA SALGA CORRIDA. El desplazamiento se quedaba
      corto en lo que medía el margen y la última página de cada
      capítulo salía movida, con la cola de la anterior asomando. Se mide
      el margen del texto en la primera página Y en la última.

   5. QUE UN TEXTO PEGADO ESCRIBA HTML DENTRO DE F.A.R.O. Aquí entra el
      texto más largo de toda la aplicación, pegado desde otra ventana,
      y esta aplicación tiene dentro la Bóveda, las finanzas, el chat y
      los teléfonos del Buzón del lector. Vale también para el buscador,
      que pinta <mark> troceando texto.

   6. QUE UN CORTE DE RED SE VEA COMO UN ANAQUEL VACÍO, que es lo que
      invita a pegar encima los textos que ya estaban. Y que una base
      SIN LA COLUMNA NUEVA (`genero`) se vea como un corte de red o como
      «falta el SQL»: la tabla está, y hay que decir lo que hay.

   7. QUE UN SUBRAYADO CAIGA EN OTRO TROZO, SE PIERDA AL CAMBIAR LA
      LETRA O SUBA SIN FIRMAR. Son los cinco colores del marcador de las
      misiones y viajan por su misma tabla; la base de mentira exige la
      firma igual que la de verdad.

   8. QUE RETIRAR NO RETIRE. El botón pasaba por window.confirm —que en
      la aplicación instalada puede no salir— y la lápida se perdía al
      volver a guardar el anaquel, así que el texto resucitaba desde la
      nube. Se prueba con la nube devolviendo todavía el texto viejo.

   9. QUE EL MODO DESLIZANDO NO DESLICE DESDE LOS BORDES (las zonas de
      toque tapaban la caja) y que HOJEAR deje dos #voz-texto en el
      documento. Y que el anaquel pierda la etiqueta en alguna vista.

  10. QUE PONER UN BOTÓN A UNA CITA SE COMA TEXTO DEL ENSAYO. Si la
      llamada se sustituyera por un numerito, el texto plano del párrafo
      cambiaría —y con él se moverían TODOS los subrayados de ese
      párrafo, que se guardan por desplazamiento de caracteres— sin dar
      ningún error. Se compara el pintado con el guardado carácter por
      carácter. Y que consultar una fuente mueva la lectura, que en un
      lector paginado es perder la página.

  11. QUE UNA TABLA DESAPAREZCA. Con `break-inside: avoid` y una caja
      que se desliza —que es INDIVISIBLE para el navegador—, una tabla
      más alta que la página se recorta: queda el rótulo solo con media
      página en blanco debajo. No da error, el número de páginas sigue
      saliendo bien, y solo se descubre leyendo.

   Como en las demás sondas: aquí no se lee el código, se ejecuta el
   index.html de verdad con una base de datos de mentira a nivel de
   fetch. El cliente de Supabase es el auténtico.

   ⚠️ Y PARA MEDIR SE ABRE LA VISTA DE VERDAD (`switchView`) Y SE ENSEÑA
   `#app-container`: con el panel escondido, la caja del texto mide 0×0
   y la sonda aprobaría una paginación que en la tableta no existe. */

/* Quién entra, en la sonda. La herramienta lo saca de la sesión de
   Supabase; aquí se le pone una de mentira para poder comprobar que la
   fila sale FIRMADA, que es justo lo que faltaba. */
const VOZ_UID = '11111111-1111-1111-1111-111111111111';

/* Lo que hay que esperar a que salga la barra de subrayar: los tres
   segundos que la herramienta espera a que la selección se quede
   quieta, más un respiro. Va en una constante para que el día que ese
   número cambie no haya que cazar cinco esperas por el archivo. */
const VOZ_SUB_ESPERA_SONDA = 2400;   // VOZ_SUB_ESPERA (2 s) y un respiro

const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ⚠️ LAS COLUMNAS DE `voz_actividades` SE SACAN DEL PROPIO ARCHIVO SQL,
   NUNCA ESCRITAS A MANO AQUÍ. El 16 de septiembre de 2026 el taller pedía
   `borrado` y la tabla tenía `borrada` —una letra, y en femenino porque la
   tabla es «actividades»—: PostgREST rebota la consulta ENTERA por eso
   (42703), o sea que el taller no subía nunca, y encima ese código caía en
   la rama de «sin señal», así que la barra mandaba a mirar el wifi.

   Y no lo cazó nadie porque LOS DOS DOBLES ERAN COMPLACIENTES justo donde el
   otro no miraba, que es la regla 13 al pie de la letra: la prueba del SQL
   escribe las filas a mano, con el nombre bueno, así que la tabla aprobaba; y
   esta base de mentira devolvía `estado.act` mirase lo que mirase el `select`,
   así que la pantalla también. Una lista escrita a mano en este archivo sería
   un tercer doble complaciente: se quedaría vieja el día que la tabla cambie,
   y quien la lea se fiará. Sale del archivo, y si no se puede leer la sonda
   SUSPENDE en vez de aprobar con la lista vacía —que aceptaría cualquier
   columna, que es la avería de arriba otra vez—. */
let VOZ_ACT_COLS = null;

async function columnasDeVozActividades(){
  const r = await fetch('/supabase/sql/voz_actividades.sql');
  if (!r.ok) throw new Error('no se pudo leer voz_actividades.sql: ' + r.status);
  const sql = await r.text();
  const cuerpo = (sql.match(/create table if not exists public\.voz_actividades\s*\(([\s\S]*?)\n\);/i) || [])[1];
  if (!cuerpo) throw new Error('no encontré el create table de voz_actividades');
  const cols = [];
  cuerpo.split('\n').forEach(l => {
    const m = l.match(/^\s{2}([a-z_]+)\s+(text|jsonb|uuid|boolean|bigint|timestamptz)\b/);
    if (m) cols.push(m[1]);
  });
  /* Y las que llegaran después por su `alter table … add column`, que es
     como crece una tabla ya corrida sin romper la del autor. */
  let a; const re = /alter table public\.voz_actividades add column if not exists\s+([a-z_]+)/gi;
  while ((a = re.exec(sql))) if (cols.indexOf(a[1]) < 0) cols.push(a[1]);
  if (cols.length < 5) throw new Error('saqué solo ' + cols.length + ' columnas de voz_actividades.sql');
  return cols;
}

/* ── La base de datos de mentira ────────────────────────────────── */
function nuevaBase(w, opciones){
  const o = opciones || {};
  const estado = { filas: o.filas || [], llamadas: [], escritas: [], marcas: o.marcas || [], marcasEscritas: [],
                   act: o.act || [], actEscritas: [], recs: o.recs || [], recsEscritos: [], oembed: [] };
  /* Las columnas que esta base NO tiene. `sinGenero` se queda por lo
     que ya estaba escrito; `faltan` sirve para cualquiera de las
     nuevas, que ya son dos. */
  const faltan = o.faltan || (o.sinGenero ? ['genero'] : []);
  const json = (cuerpo, status) => new Response(JSON.stringify(cuerpo),
    { status: status || 200, headers: { 'Content-Type': 'application/json' } });
  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url);
    const m = (init && init.method) || 'GET';
    /* ⚠️ LA PUERTA PÚBLICA DE YOUTUBE (oEmbed), de donde sale el título de
       un video. Este doble exige lo MISMO que la de verdad: solo contesta
       si lo que le llegó es la dirección CANÓNICA de un video, o sea si
       la herramienta le mandó los once caracteres y nada más. Un doble
       que contestara a cualquier cosa escondería justo lo que esta
       comprobación existe para mirar —que lo pegado no viaja a YouTube—,
       que es la lección de la costura del 10 de septiembre. */
    if (/\/oembed$/.test(u.pathname)) {
      estado.llamadas.push({ m, url: u.href });
      estado.oembed.push(u.searchParams.get('url') || '');
      if (o.sinOembed) return json({ error: 'Not Found' }, 404);
      const mm = String(u.searchParams.get('url') || '')
        .match(/^https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})$/);
      if (!mm) return json({ error: 'Not Found' }, 404);
      const t = (o.titulos || {})[mm[1]];
      if (!t) return json({ error: 'Not Found' }, 404);
      return json({ title: t, author_name: 'Un canal', type: 'video' });
    }
    /* Los subrayados viajan por lecturas_marcas, la tabla del marcador de
       las misiones, y la base de mentira la exige igual que la de verdad:
       firmada con quien entró, con `mision` y con un color de los cinco. */
    if (/lecturas_marcas/.test(u.pathname)) {
      estado.llamadas.push({ m, url: u.pathname + u.search, cuerpo: init && init.body });
      if (m === 'GET') {
        const mision = decodeURIComponent((u.search.match(/mision=eq\.([^&]+)/) || [])[1] || '');
        const uid = decodeURIComponent((u.search.match(/user_id=eq\.([^&]+)/) || [])[1] || '');
        return json(estado.marcas.filter(x => x.mision === mision && x.user_id === uid));
      }
      let cuerpo = null;
      try { cuerpo = JSON.parse(init && init.body); } catch (e) {}
      const filas = Array.isArray(cuerpo) ? cuerpo : (cuerpo ? [cuerpo] : []);
      for (const fila of filas) {
        if (!fila.user_id || !fila.mision || !fila.id) return json({ code: '23502', message: 'null value violates not-null constraint' }, 400);
        if (fila.user_id !== VOZ_UID) return json({ code: '42501', message: 'new row violates row-level security policy' }, 403);
        if (['dato', 'voz', 'idea', 'contra', 'duda'].indexOf(fila.color) < 0) return json({ code: '23514', message: 'violates check constraint "lecturas_marcas_color_check"' }, 400);
        estado.marcas = estado.marcas.filter(x => x.id !== fila.id).concat([fila]);
        estado.marcasEscritas.push(fila);
      }
      return json([], 201);
    }
    /* ⚠️ LOS RECURSOS DE UN TEXTO VIAJAN POR recursos_enlaces, la tabla de
       la repisa de las misiones, con mision='voz:<cid>'. Y este doble
       exige lo MISMO que la de verdad, que es la única manera de que la
       costura se pruebe: firmado con quien entró (42501 si es de otro),
       con `mision` y con una dirección http/https (el check de la
       columna). Un doble complaciente no prueba la costura: la esconde.
       ⚠️ Y el GET NO filtra por usuario, a diferencia de las marcas: los
       recursos son DE LA CASA. Si este doble filtrara, la sonda aprobaría
       una repisa que en la casa de verdad solo se vería a sí misma. */
    if (/recursos_enlaces/.test(u.pathname)) {
      estado.llamadas.push({ m, url: u.pathname + u.search, cuerpo: init && init.body });
      if (o.sinTablaRec) return json({ code: '42P01', message: 'relation "public.recursos_enlaces" does not exist' }, 404);
      if (m === 'GET') {
        const mision = decodeURIComponent((u.search.match(/mision=eq\.([^&]+)/) || [])[1] || '');
        if (/user_id=eq|anadido_por=eq/.test(u.search)) {
          return json({ code: 'FILTRA_POR_USUARIO', message: 'la repisa es de la casa: no se filtra por quien entró' }, 400);
        }
        return json(estado.recs.filter(x => x.mision === mision));
      }
      let cuerpo = null;
      try { cuerpo = JSON.parse(init && init.body); } catch (e) {}
      const filas = Array.isArray(cuerpo) ? cuerpo : (cuerpo ? [cuerpo] : []);
      for (const fila of filas) {
        if (!fila.id || !fila.mision || !fila.anadido_por) return json({ code: '23502', message: 'null value violates not-null constraint' }, 400);
        if (fila.anadido_por !== VOZ_UID) return json({ code: '42501', message: 'new row violates row-level security policy' }, 403);
        if (!/^https?:\/\//.test(String(fila.url || '')) || /["'<>\\ ]/.test(String(fila.url || ''))) {
          return json({ code: '23514', message: 'violates check constraint "recursos_enlaces_url_check"' }, 400);
        }
        if (!String(fila.titulo || '').trim()) return json({ code: '23514', message: 'violates check constraint "recursos_enlaces_titulo_check"' }, 400);
        if (['maquina', 'casa'].indexOf(fila.origen) < 0) return json({ code: '23514', message: 'violates check constraint "recursos_enlaces_origen_check"' }, 400);
        estado.recs = estado.recs.filter(x => x.id !== fila.id).concat([fila]);
        estado.recsEscritos.push(fila);
      }
      return json([], 201);
    }
    /* El taller de comprensión viaja por su propia tabla, y la base de
       mentira la exige igual que la de verdad: firmada con quien entró
       y con `items` que sea una lista. Un doble complaciente no prueba
       la costura, la esconde. */
    if (/voz_actividades/.test(u.pathname)) {
      estado.llamadas.push({ m, url: u.pathname + u.search, cuerpo: init && init.body });
      if (o.sinTablaAct) return json({ code: '42P01', message: 'relation "public.voz_actividades" does not exist' }, 404);
      /* ⚠️ UNA COLUMNA QUE NO EXISTE TUMBA LA CONSULTA ENTERA, no la
         columna. Así rebota PostgREST y así tiene que rebotar este doble,
         o esconde justo la costura que existe para probar. Las columnas
         salen de voz_actividades.sql, no de una lista escrita aquí. */
      /* `faltanAct` finge una base a la que le falta una columna del
         taller, que es lo que se encuentra quien corrió una versión
         anterior del archivo: la tabla está, los datos están, y PostgREST
         rebota igual. Tiene que decirse distinto de «no hay señal». */
      const ausentes = (VOZ_ACT_COLS || []).filter(c => (o.faltanAct || []).indexOf(c) < 0);
      const noEsta = (nombres) => ausentes.length
        ? nombres.find(n => n && ausentes.indexOf(n) < 0) : null;
      if (m === 'GET') {
        const pedidas = (u.searchParams.get('select') || '').split(',').map(x => x.trim()).filter(Boolean);
        const mala = noEsta(pedidas);
        if (mala) return json({ code: '42703', message: 'column voz_actividades.' + mala + ' does not exist' }, 400);
        return json(estado.act);
      }
      let cuerpo = null;
      try { cuerpo = JSON.parse(init && init.body); } catch (e) {}
      const filas = Array.isArray(cuerpo) ? cuerpo : (cuerpo ? [cuerpo] : []);
      for (const fila of filas) {
        const malaE = noEsta(Object.keys(fila));
        if (malaE) return json({ code: '42703', message: 'column "' + malaE + '" of relation "voz_actividades" does not exist' }, 400);
        if (!fila.puesto_por) return json({ code: '23502', message: 'null value in column "puesto_por"' }, 400);
        if (fila.puesto_por !== VOZ_UID) return json({ code: '42501', message: 'new row violates row-level security policy' }, 403);
        if (!Array.isArray(fila.items)) return json({ code: '23514', message: 'violates check constraint "voz_actividades_items_lista"' }, 400);
        estado.act = estado.act.filter(x => x.cid !== fila.cid).concat([fila]);
        estado.actEscritas.push(fila);
      }
      return json([], 201);
    }
    if (!/voz_prestada/.test(u.pathname)) return json([]);
    estado.llamadas.push({ m, url: u.pathname + u.search, cuerpo: init && init.body });
    if (o.sinTabla) return json({ code: '42P01', message: 'relation "public.voz_prestada" does not exist' }, 404);
    /* Un corte de señal de verdad NO es un 503 con cuerpo: es la
       petición que no llega. El cliente de Supabase no lanza por eso
       —devuelve {data:null,error}—, y esa es justo la rama que hay que
       probar, porque es la que se olvida mirar. */
    if (o.sinSenal) throw new TypeError('Failed to fetch');
    if (m === 'GET') {
      /* La base del DÍA DEL ESTRENO no tiene la columna `genero`, y
         PostgREST rebota la consulta entera con el error de PostgreSQL. */
      /* ⚠️ Sin `\b` en el nombre: la lista de columnas viaja CODIFICADA
         («%2Cgenero%2C»), así que la C del %2C pegada delante mata el
         borde de palabra y la comparación no casaría nunca — la base de
         mentira diría que la columna sí está y la sonda aprobaría una
         base vieja que en Supabase rebota. */
      const falta = faltan.find(col => u.search.indexOf(col) >= 0);
      if (falta) {
        return json({ code: '42703', message: 'column voz_prestada.' + falta + ' does not exist' }, 400);
      }
      return json(estado.filas);
    }
    /* ⚠️ LA BASE DE MENTIRA EXIGE LO MISMO QUE LA DE VERDAD.
       Antes aceptaba cualquier escritura y devolvía 201, así que la
       sonda aprobaba una subida que en Supabase rebotaba: `puesto_por`
       es `not null` y la política pide que sea quien entró. Eso fue el
       fallo del 10 de septiembre de 2026 —el cuento se veía donde se
       pegó y no llegaba nunca al otro aparato— y no lo cazó nadie
       porque cada mitad se probaba por separado. Un doble complaciente
       no prueba la costura: la esconde. Misma lección que el
       `grant all` de la prueba del SQL y que postgrest-falso.js. */
    let cuerpo = null;
    try { cuerpo = JSON.parse(init && init.body); } catch (e) {}
    const filas = Array.isArray(cuerpo) ? cuerpo : (cuerpo ? [cuerpo] : []);
    for (const fila of filas) {
      if (!fila.puesto_por) {
        return json({ code: '23502', message: 'null value in column "puesto_por" violates not-null constraint' }, 400);
      }
      if (fila.puesto_por !== VOZ_UID) {
        return json({ code: '42501', message: 'new row violates row-level security policy' }, 403);
      }
      const sobra = faltan.find(col => col in fila);
      if (sobra) {
        return json({ code: 'PGRST204', message: "Could not find the '" + sobra + "' column of 'voz_prestada' in the schema cache" }, 400);
      }
      estado.filas = estado.filas.filter(x => x.cid !== fila.cid).concat([fila]);
      estado.escritas.push(fila);
    }
    return json([], 201);
  };
  return estado;
}

/* Un texto largo de verdad, para que haya varias páginas que pasar.
   El texto es de la sonda: hace falta prosa larga, no prosa buena. */
function vozActViasDe(w, cid){
  const v = JSON.parse(w.eval('JSON.stringify(vozActDe(' + JSON.stringify(cid) + ').items.map(i => vozActVia(i)))'));
  const c = { txt: 0, sub: 0, mano: 0 };
  v.forEach(x => { c[x || 'mano'] = (c[x || 'mano'] || 0) + 1; });
  return c;
}
function cuentoLargo(cid){
  const p = [];
  for (let i = 0; i < 40; i++) {
    p.push({ k: 'p', t: 'Párrafo número ' + (i + 1) + '. ' +
      'La casa contaba en voz baja y nadie del pueblo quiso nunca ' +
      'preguntarle en qué número iba, porque preguntar era entrar y ' +
      'entrar era sumar uno más a la cuenta de aquella tarde larga.' });
  }
  return {
    cid: cid, titulo: 'La casa que contaba', genero: 'cuento',
    voz: 'un narrador de pueblo', maquina: 'una máquina de prueba',
    encargo: 'un cuento sobre una casa que cuenta',
    capitulos: [{ t: 'Capítulo 1', p: p }, { t: 'Capítulo 2', p: p.slice(0, 12) }],
    palabras: 40 * 34, borrado: false, actualizado: 1000,
    creado_at: '2026-09-10T10:00:00Z',
  };
}

/* El margen izquierdo del primer bloque visible de la página actual,
   medido en la pantalla. Sirve para ver que el texto empieza donde
   tiene que empezar en todas las páginas, la última incluida. */
function margenVisible(w){
  return w.eval(`(function(){
    const h = document.getElementById('voz-hoja');
    const ps = h.querySelectorAll('[data-vp]');
    const x = h.getBoundingClientRect().left;
    for (const p of ps) {
      const rs = p.getClientRects();
      for (const r of rs) {
        if (r.left - x > -1 && r.left - x < h.clientWidth && r.width > 10) return Math.round(r.left - x);
      }
    }
    return -999;
  })()`);
}

/* ── La hoja del anaquel (rehecha el 12/9/2026) ──────────────────
   Desde que la barra es de una fila, los filtros y el orden viven
   dentro de una hoja que se abre. La sonda la abre y pulsa sus filas
   COMO SE PULSAN de verdad, no llamando a `vozHojaEstantes` por
   dentro: lo que puede fallar ahí —un botón que no se alcanza, una
   hoja que no abre— no se ve llamando funciones. */
function abreHoja(d, rotulo){
  const b = [...d.querySelectorAll('#voz-herr .voz-herr-btn')].find(x => x.textContent.indexOf(rotulo) > -1);
  if (b) b.click();
  return b;
}
function filaHoja(d, txt){
  return [...d.querySelectorAll('#voz-anaq-cuerpo .voz-hoja-fila')]
    .find(x => (x.querySelector('.voz-hoja-txt') || {}).textContent === txt);
}
function vozCerrarHojaSonda(w){ w.eval('vozCerrarHoja()'); }
function filasHoja(d){
  return [...d.querySelectorAll('#voz-anaq-cuerpo .voz-hoja-fila')]
    .map(x => (x.querySelector('.voz-hoja-txt') || {}).textContent +
              ((x.querySelector('.voz-hoja-n') || {}).textContent ? ' ' + x.querySelector('.voz-hoja-n').textContent : ''));
}

(async () => {
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await esperar(1200);
  /* Antes que nada, porque la base de mentira las necesita para rebotar
     como rebota la de verdad. Si esto falla no se sigue: una sonda que
     corriera con la lista vacía aceptaría cualquier columna y aprobaría
     el fallo que vino a vigilar. */
  try {
    VOZ_ACT_COLS = await columnasDeVozActividades();
  } catch (e) {
    fallos++;
    log('  ✘ no pude sacar las columnas de supabase/sql/voz_actividades.sql: ' + e.message);
    log('\nRESULTADO: SUSPENDE · 1 fallo(s)');
    document.title = 'SUSPENDE · La Voz Prestada';
    return;
  }
  const w = f.contentWindow, d = w.document;
  const base = nuevaBase(w, {});
  /* Con `access_token`: el cliente solo pone la cabecera Authorization si
     la sesión trae uno, y la función de borde de mentira —como la de
     verdad— rechaza sin ella. Sin el token, la sonda diría que la
     puerta de Claude «no manda la sesión» cuando lo que no la tiene es
     la sesión de mentira. */
  w.eval(`window.faroSb.auth.getSession = async () => (` +
         `{ data: { session: { access_token: 'tok.prueba', user: { id: ${JSON.stringify(VOZ_UID)} } } } })`);
  /* El permiso de no apagar la pantalla, de mentira: en Chromium sin
     cabeza puede no existir o negarse, y lo que se prueba es que la
     herramienta lo PIDE y lo SUELTA. */
  /* `navigator.wakeLock` es un getter del prototipo: asignarle encima
     no hace nada (sin error). Se define encima de la instancia. */
  w.eval(`window.__luz = 0; Object.defineProperty(navigator, 'wakeLock', { configurable: true, value: { request: async () => { window.__luz++; return { release: async () => { window.__luz--; }, addEventListener() {} }; } } })`);

  /* La aplicación arranca con `#app-container` escondido hasta que entra
     alguien. Sin esto todo mide 0×0 y las medidas de pantalla mienten. */
  d.getElementById('app-container').style.display = '';
  w.eval('switchView("view-voz")');
  await esperar(250);

  log('── 1. El lector de texto pegado ──');
  const r1 = w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    '# El faro que no era\n\n**Al modo de:** un narrador de pueblo\nEscrito por: Claude\n' +
    'Género: ensayo\nEncargo: una luz que nadie encendió\n\n> Toda luz es una deuda.\n\nCapítulo 1: La luz\n\n' +
    'Nadie recordaba haberla encendido.\n\n—¿Y si se apaga? —dijo el niño.\n' +
    '—No se apaga —dijo su madre.\n\n* * *\n\nSe apagó un martes.\n\n### Lo que dijo el farero\n\n' +
    '- Primero la mecha.\n- Después el aceite.\n\nII\n\nSubieron la cuesta.\n\nFIN')}))`);
  const c1 = JSON.parse(r1);
  ok(c1.titulo === 'El faro que no era', 'saca el título del texto', 'no sacó el título: ' + c1.titulo);
  ok(c1.voz === 'un narrador de pueblo', 'y la voz imitada, aun escrita con **asteriscos**',
     'la voz salió mal: ' + JSON.stringify(c1.voz));
  ok(c1.maquina === 'Claude', 'y la máquina', 'la máquina salió mal: ' + c1.maquina);
  ok(c1.genero === 'ensayo', 'y el género, de la etiqueta «Género:»', 'el género salió mal: ' + c1.genero);
  ok(c1.capitulos.length === 2, 'reparte los dos capítulos', 'capítulos: ' + c1.capitulos.length);
  ok(c1.capitulos[0].epi && c1.capitulos[0].epi[0].k === 'cita' && /deuda/.test(c1.capitulos[0].epi[0].t),
     'y la cita de antes del capítulo 1 es el epígrafe, no un capítulo sin nombre',
     'el epígrafe no se reconoció: ' + JSON.stringify(c1.capitulos[0].epi));
  ok(c1.capitulos[0].p.filter(x => x.k === 'sep').length === 1,
     'y el salto de escena se guarda como salto, no como texto', 'perdió el * * *');
  const dial = c1.capitulos[0].p.filter(x => (x.t || '').startsWith('—'));
  ok(dial.length === 2, 'cada raya de diálogo abre párrafo aunque no haya blanco delante',
     'pegó las rayas de diálogo en un párrafo: ' + dial.length);
  ok(c1.capitulos[0].p.some(x => x.k === 'h3' && /farero/.test(x.t)),
     'y «###» es un subtítulo DENTRO del capítulo, no un capítulo más',
     'el ### abrió un capítulo o se perdió');
  ok(c1.capitulos[0].p.filter(x => x.k === 'li').length === 2,
     'y «- » hace ítems de lista', 'las viñetas no se leyeron como lista');
  ok(c1.capitulos[1].p.some(x => x.k === 'fin') && !c1.capitulos.some(c => /^fin$/i.test(c.t || '')),
     'y «FIN» a solas es la marca del final, no un capítulo', 'FIN salió como capítulo o se perdió');

  /* Los versos: tres renglones cortos seguidos se quedan con sus saltos.
     Juntarlos destruye el poema sin avisar y sin vuelta atrás. */
  const c1b = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\n\nAgua que no vuelves,\ntierra que no olvida,\ndime en qué barranca\nse escondió la vida.\n\nY siguió la prosa de siempre, larga y sin misterio ninguno, hasta el final del renglón.')}))`));
  ok(c1b.capitulos[0].p[0].k === 'verso' && c1b.capitulos[0].p[0].t.split('\n').length === 4,
     'y cuatro renglones cortos seguidos son una estrofa con sus cuatro versos',
     'juntó los versos en un párrafo: ' + JSON.stringify(c1b.capitulos[0].p[0]));
  const c1c = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\nGénero: poema\n\nQuisiera esta tarde divina de octubre\npasear por la orilla lejana del mar;')}))`));
  ok(c1c.genero === 'poema' && c1c.capitulos[0].p[0].k === 'verso',
     'y con «Género: poema» hasta dos renglones largos se quedan como versos',
     'un poema declarado se leyó como prosa');
  const c1d = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'La noche en Santa María\n\nAl modo de Onetti\nEscrito por Claude\n\nLa noche llegó tarde.')}))`));
  ok(c1d.titulo === 'La noche en Santa María' && c1d.voz === 'Onetti',
     'y la primera línea pelada es el título si debajo vienen las etiquetas',
     'no leyó el título de la primera línea: ' + c1d.titulo);
  const c1e = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: Borges\nMáquina: Gemini\n\n**El jardín**\n\nHabía un jardín.\n\n**La casa**\n\nHabía una casa.')}))`));
  ok(c1e.capitulos.length === 2 && c1e.capitulos[0].t === 'El jardín' && !c1e.titulo,
     'y dos negritas sueltas en serie son dos capítulos, no un título y un capítulo',
     'las negritas se leyeron mal: título=' + c1e.titulo + ' caps=' + c1e.capitulos.map(c => c.t).join('|'));

  log('── 2. ⚠️ Y NO DESCUARTIZA UN PÁRRAFO DE PROSA ──');
  /* El fallo más caro y el que menos se ve. Siete renglones seguidos que
     empiezan por siete palabras que nombran una parte de un libro: si
     alguna asciende a capítulo, el texto sale partido y PARECE que
     funcionó. Es la comprobación 5-bis del lector de El Rodaje. Y son
     frases con punto: prosa a un renglón por frase, no versos. */
  const prosa = ['Parte de la culpa era suya y lo sabía.',
    'Acto seguido cerró la puerta sin ruido.',
    'Prólogo de nada, se dijo, esto no empieza.',
    'Sección por sección revisó la casa.',
    'Introducción no hacía falta: ya se conocían.',
    'Coda o no, la noche seguía.',
    'Interludio, pensó, y se rió sola.'].join('\n');
  const c2 = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(prosa)}))`));
  ok(c2.capitulos.length === 1, 'un párrafo de prosa se queda en UN capítulo',
     'lo partió en ' + c2.capitulos.length + ' capítulos');
  ok(c2.capitulos[0].p.length === 1 && c2.capitulos[0].p[0].k === 'p',
     'y en UN párrafo de prosa, con sus siete renglones dentro',
     'lo partió en ' + c2.capitulos[0].p.length + ' bloques (' + c2.capitulos[0].p.map(b => b.k).join(',') + ')');
  const c2b = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'El tren se fue.\n\nNadie volvió a hablar de eso.\n\nY así fue.')}))`));
  ok(c2b.capitulos.length === 1 && c2b.capitulos[0].p.length === 3,
     'y tres frases cortas y sueltas siguen siendo tres frases, no tres capítulos',
     'ascendió frases sueltas a capítulo');
  const c2c = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Antes.\n\nCapítulo 3\n\nDespués.')}))`));
  ok(c2c.capitulos.length === 2, 'pero «Capítulo 3» sí abre capítulo',
     'no reconoció una cabecera de verdad');
  const c2d = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\n\n- ¿Y ahora qué? - dijo ella.\n- Nada - dijo él.')}))`));
  ok(c2d.capitulos[0].p.length === 2 && c2d.capitulos[0].p.every(b => b.k === 'p' && /^- /.test(b.t)),
     'y un diálogo con guion corto no se convierte en una lista de la compra',
     'el diálogo con guion salió como lista: ' + JSON.stringify(c2d.capitulos[0].p));

  log('── 3. Lo que no se entiende se NOMBRA y se queda dentro ──');
  const c3 = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'TONO: melancólico\n\nEmpezó a llover.')}))`));
  ok(c3.avisos.length === 1 && c3.avisos[0].linea === 1,
     'nombra el renglón que parecía una etiqueta y no se entendió',
     'no avisó de la línea que no entendió');
  ok(JSON.stringify(c3.capitulos).indexOf('TONO: melancólico') > -1,
     'y NO la tira: se queda como texto del texto', 'perdió la línea que no entendió');

  log('── 4. ⚠️ LA ETIQUETA NO SE APAGA: el guardado se para ──');
  w.eval('vozAbrirPegar(null)');
  await esperar(120);
  d.getElementById('voz-pegar-txt').value = 'Había una casa.';
  d.getElementById('voz-f-titulo').value = 'La casa';
  w.eval('vozRepasar()');
  await esperar(120);
  // El repaso rellena solo lo que el texto traía; aquí no traía etiqueta.
  d.getElementById('voz-f-voz').value = '';
  d.getElementById('voz-f-maquina').value = '';
  w.eval('vozPintarBotonGuardar()');
  const falta = d.getElementById('voz-falta');
  ok(falta && !falta.hidden && /voz/i.test(falta.textContent) && /m[áa]quina/i.test(falta.textContent),
     'sin la voz y sin la máquina, dice EXACTAMENTE qué falta',
     'no nombra lo que falta: ' + (falta ? falta.textContent : 'no está'));
  ok(d.getElementById('voz-f-voz').classList.contains('voz-campo-ambar'),
     'y el campo se pone en ámbar antes de tocar nada', 'el campo no avisa');
  const antes = Number(w.eval('_vozCuentos.length'));
  await w.eval('vozGuardarPegado()');
  await esperar(150);
  ok(Number(w.eval('_vozCuentos.length')) === antes,
     'y el guardado NO entra: es la regla de la herramienta',
     '⚠️ SE GUARDÓ un texto sin decir a quién imita ni qué máquina lo escribió');

  d.getElementById('voz-f-voz').value = 'un narrador de pueblo';
  d.getElementById('voz-f-maquina').value = 'una máquina de prueba';
  await w.eval('vozGuardarPegado()');
  await esperar(200);
  ok(Number(w.eval('_vozCuentos.length')) === antes + 1,
     'y con la etiqueta puesta, sí entra', 'con la etiqueta puesta tampoco entró');

  /* ⚠️ El título del texto pegado tiene que llegar al campo aunque la
     hoja se haya abierto vacía antes. La primera versión rellenaba
     «Cuento sin título» al abrir, y el «# Título» pegado después ya no
     entraba nunca porque el campo no estaba vacío. */
  w.eval('vozAbrirPegar(null)');
  await esperar(120);
  d.getElementById('voz-pegar-txt').value = '# La luz de la cocina\n\nVoz: Rulfo\nMáquina: Claude\nGénero: carta\n\nQuerida madre.';
  w.eval('vozRepasar()');
  await esperar(120);
  ok(d.getElementById('voz-f-titulo').value === 'La luz de la cocina',
     'y un «# Título» pegado DESPUÉS de abrir la hoja rellena el campo del título',
     '⚠️ el título pegado no llegó al campo: ' + JSON.stringify(d.getElementById('voz-f-titulo').value));
  ok(d.getElementById('voz-f-genero').value === 'carta' &&
     [...d.querySelectorAll('#voz-genero-chips .voz-chip-on')].some(b => /Carta/.test(b.textContent)),
     'y el género de la etiqueta marca su chip', 'el chip del género no se marcó: ' + d.getElementById('voz-f-genero').value);
  w.eval('vozCerrarPegar()');
  await esperar(100);

  log('── 5. La etiqueta está en los cuatro sitios ──');
  w.eval(`_vozCuentos = [${JSON.stringify(cuentoLargo('c-largo'))}]; vozRender()`);
  await esperar(150);
  const ficha = d.querySelector('.voz-ficha');
  ok(ficha && /al modo de un narrador de pueblo/.test(ficha.textContent),
     '1) en la ficha del anaquel', 'la ficha no dice a quién imita');
  ok(ficha && /una máquina de prueba/.test(ficha.textContent),
     '   y también qué máquina lo escribió', 'la ficha no dice qué máquina');
  const plano = w.eval('vozTextoPlano(_vozCuentos[0])');
  ok(/narrador de pueblo/.test(plano) && /una máquina de prueba/.test(plano),
     '2) dentro de lo que copia el botón 📋', 'lo copiado sale sin etiqueta');
  ok(plano.indexOf('narrador de pueblo') < plano.indexOf('La casa contaba en voz baja'),
     '   y va DELANTE del texto, no escondida al final',
     'la etiqueta va detrás del texto: en un reenvío se pierde');
  ok(/CUENTO ESCRITO POR UNA MÁQUINA/.test(plano),
     '   y dice el género con la advertencia', 'lo copiado no lleva el género');

  log('── 6. ⚠️ LA PAGINACIÓN ES REAL, medida en la pantalla ──');
  w.eval('vozAbrirLector("c-largo")');
  await esperar(400);
  const hoja = d.getElementById('voz-hoja');
  ok(hoja && hoja.clientWidth > 100 && hoja.clientHeight > 100,
     'la caja del texto mide de verdad (' + (hoja ? hoja.clientWidth + '×' + hoja.clientHeight : '0×0') + ')',
     'la caja mide 0×0: lo que venga detrás no prueba nada');
  const pags1 = Number(w.eval('_vozPaginas'));
  ok(pags1 > 3, 'el texto se reparte en varias páginas (' + pags1 + ')',
     'no paginó: salió en ' + pags1 + ' página(s)');
  ok(/1 \/ /.test(d.getElementById('voz-pag').textContent),
     'y el pie dice por cuál va y cuántas hay', 'el pie no dice la página');
  ok(/quedan ≈ \d+ min/.test(d.getElementById('voz-pag').textContent),
     'y cuánto falta para terminar el texto entero', 'el pie no dice cuánto falta');
  ok(/una máquina de prueba/.test(d.getElementById('voz-pag').textContent),
     '3) en el pie de todas las páginas', 'el pie no lleva la máquina');
  const port = d.querySelector('.voz-portada');
  ok(port && /al modo de/.test(port.textContent) && /No es un texto de/.test(port.textContent),
     '4) en la portada, que es la primera página de todo texto',
     'la portada no lleva la etiqueta');
  ok(port && /Cuento escrito por/.test(port.textContent),
     '   y la portada dice el género', 'la portada no dice el género');
  /* ⚠️ Y ABRIR UN TEXTO NUEVO TIENE QUE CAER EN LA PORTADA. La portada
     es la posición −1; si la lectura se colocara en el párrafo 0, que
     está en la página siguiente, la portada se saltaría entera y en
     silencio — y es donde dice en grande que esto lo escribió una
     máquina imitando a alguien. */
  ok(Number(w.eval('_vozPagina')) === 0 && Number(w.eval('_vozAncla')) === -1,
     '   y un texto nuevo se abre POR la portada, no saltándosela',
     '⚠️ abrir el texto se salta la portada (página ' + w.eval('_vozPagina') + ')');
  ok(d.querySelectorAll('#voz-barra-marcas .voz-barra-tick').length === 1,
     'y la barra de avance lleva una muesca por cada cambio de capítulo',
     'la barra no marca los capítulos: ' + d.querySelectorAll('.voz-barra-tick').length);
  ok(Number(w.eval('window.__luz')) === 1,
     'y al abrir la sala se pide que la pantalla no se apague',
     'la sala no pidió el permiso de mantener la pantalla encendida');

  w.eval('vozPasar(1)');
  await esperar(400);
  ok(Number(w.eval('_vozPagina')) === 1 && hoja.scrollLeft > 10,
     'y pasar página mueve la hoja de verdad (' + Math.round(hoja.scrollLeft) + ' px)',
     'pasó de página sin mover nada: la paginación es de mentira');

  /* ⚠️ Y EL RENGLÓN EMPIEZA DONDE EMPEZABA, TAMBIÉN EN LA ÚLTIMA. Si el
     salto de página no mide exactamente lo que mide una columna, cada
     página se corre un poco: a la tercera, el texto sale cortado por la
     izquierda y asoma la columna siguiente por la derecha. Y la última
     página tenía su propio fallo: el desplazamiento se quedaba corto en
     lo que medía el margen. Se mira comparando el borde izquierdo del
     texto en la primera, en dos de en medio y en la ÚLTIMA. */
  const bordes = [];
  for (const p of [0, 1, 3, pags1 - 1]) {
    w.eval('vozIrPagina(' + p + ', true)');
    await esperar(220);
    bordes.push(margenVisible(w));
  }
  ok(bordes[0] > 0 && bordes.every(b => Math.abs(b - bordes[0]) <= 1),
     'y el texto empieza en el mismo margen en todas las páginas, la última incluida (' + bordes.join(', ') + ' px)',
     '⚠️ el texto se corre de página en página: ' + bordes.join(', ') + ' px (la última es la ' + pags1 + ')');
  const maxScroll = Number(w.eval('(function(){ const h = document.getElementById("voz-hoja"); return h.scrollWidth - h.clientWidth; })()'));
  ok(Math.abs(maxScroll - (pags1 - 1) * Number(w.eval('vozPaso()'))) <= 2,
     'y el desplazamiento llega justo hasta la última página (' + maxScroll + ' px)',
     '⚠️ el desplazamiento no cubre la última página: ' + maxScroll + ' vs ' + (pags1 - 1) * Number(w.eval('vozPaso()')));
  w.eval('vozIrPagina(1, true)');
  await esperar(200);

  log('── 7. ⚠️ AL CAMBIAR LA LETRA NO SE PIERDE EL SITIO ──');
  w.eval('vozIrPagina(3, true)');
  await esperar(250);
  const ancla1 = Number(w.eval('_vozAncla'));
  w.eval('_vozAj.tam = 30; _vozAj.alto = 2; vozAplicaAjustes(); vozPaginar(_vozAncla, _vozSub)');
  await esperar(400);
  const pags2 = Number(w.eval('_vozPaginas'));
  ok(pags2 > pags1, 'con la letra más grande hay más páginas (' + pags1 + ' → ' + pags2 + ')',
     'la letra no cambió la paginación: no se está paginando de verdad');
  /* El párrafo apuntado tiene que tener UN TROZO en la página actual:
     con la fracción, un párrafo largo que empezaba en la página de
     antes puede seguir siendo el apuntado aunque su primer renglón
     quede en la anterior. */
  const visible = w.eval(`(function(){
    const el = document.querySelector('#voz-texto [data-vp="' + ${ancla1} + '"]');
    if (!el) return 'no-esta';
    const r = vozRango(el);
    return (r.ini <= _vozPagina && _vozPagina <= r.fin) ? 'si' : ('no:' + r.ini + '-' + r.fin + ' vs ' + _vozPagina);
  })()`);
  ok(visible === 'si',
     'y la lectura sigue en el MISMO PÁRRAFO, no en el mismo número de página',
     '⚠️ se perdió el sitio al cambiar la letra (' + visible + ')');

  /* ⚠️ LA FRACCIÓN: con la letra grande, un párrafo ocupa más de una
     página. Se va a una página que está EN MEDIO de un párrafo, se
     apunta la posición y se vuelve a abrir el texto: tiene que caer en
     esa misma página, no en la del párrafo siguiente. */
  w.eval('_vozAj.tam = 34; _vozAj.alto = 2.4; _vozAj.margen = 60; vozAplicaAjustes(); vozPaginar(_vozAncla, _vozSub)');
  await esperar(400);
  const paginaMedio = w.eval(`(function(){
    const ps = document.querySelectorAll('#voz-texto [data-vp]');
    for (const p of ps) { const r = vozRango(p); if (r.fin > r.ini) return r.ini + 1; }
    return -1;
  })()`);
  ok(paginaMedio > 0, 'con letra grande hay un párrafo que ocupa más de una página (página ' + paginaMedio + ' está en medio de uno)',
     'no hay ningún párrafo partido entre páginas: la prueba de la fracción no se puede hacer');
  w.eval('vozIrPagina(' + paginaMedio + ', true)');
  await esperar(250);
  /* La fracción apunta al centro de la porción vista: en la segunda
     página de un párrafo de tres vale 0,5; en la primera, 0,167. Aquí
     estamos en la segunda página de alguno, así que tiene que ser mayor
     que la del principio. */
  const subGuardada = Number(w.eval('_vozSub'));
  const anclaMedio = Number(w.eval('_vozAncla'));

     sonda lo apruebe. Es la misma avería que ya tiene su arreglo escrito para
     las llamadas de cita (`vozBajoLaZona`, regla 27), y el enlace del pie es
     el camino por el que de verdad se entra al taller.
     Se toca DONDE ESTÁ, se pregunta al documento qué hay en ese punto —que es
     lo que hace el navegador con un dedo— y se le manda el toque a eso. */
  let quienRecibe = null;
  if (enlacePie) {
    const r = enlacePie.getBoundingClientRect();
    const cx = Math.round(r.left + r.width / 2), cy = Math.round(r.top + r.height / 2);
    quienRecibe = d.elementFromPoint(cx, cy);
    const blanco = quienRecibe || enlacePie;
    const dedoPie = (tipo) => blanco.dispatchEvent(new w.PointerEvent(tipo,
      { bubbles: true, cancelable: true, pointerId: 21, pointerType: 'touch', clientX: cx, clientY: cy, isPrimary: true }));
    dedoPie('pointerdown'); dedoPie('pointerup');
    blanco.dispatchEvent(new w.MouseEvent('click', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
  }
  await esperar(320);
  ok(!d.getElementById('voz-act-overlay').hidden,
     'y un DEDO en el sitio donde está lo abre, sin cerrar la lectura: al terminar se vuelve a la página en que se iba',
     'el dedo no abrió el taller. En ese punto de la pantalla lo que recibe el toque es: ' +
     (quienRecibe ? (quienRecibe.className || quienRecibe.tagName) : '(nada)') +
     ' — si es una zona de pasar página, se está comiendo el enlace (regla 27, vozBajoLaZona)');
  ok(d.getElementById('voz-lector').classList.contains('voz-desnudo') === desnudoAntes,
     'y tocar ese botón NO apaga además los mandos de la sala', '⚠️ tocar el enlace del pie apagó las barras de la lectura');
  w.eval('vozActCerrarTaller(); vozCerrarLector()');
  await esperar(200);

  /* 28.9-bis UNA COLUMNA QUE FALTA NO ES UN CORTE DE SEÑAL. Es la avería
     del 16 de septiembre de 2026 vista desde el otro lado: PostgREST rebota
     la consulta entera con 42703, que no es 42P01, así que caía en «sin
     señal» y la barra mandaba a mirar el wifi con la señal perfecta y el
     SQL recién corrido. Un aviso que se equivoca de causa manda a mirar
     donde no está el problema. */
  nuevaBase(w, { faltanAct: ['borrada'] });
  w.eval('_vozActNube = "local"; vozActSincronizar("c-act")');
  await esperar(400);
  const rotAct = String(w.eval('vozActRotuloNube()'));
  ok(/vieja/i.test(rotAct) && /voz_actividades\.sql/.test(rotAct) && !/señal/i.test(rotAct),
     '⚠️ y si a la tabla le falta una columna lo DICE («la base va vieja»), no lo achaca a la señal',
     '⚠️ una columna que falta se está leyendo como otra cosa: «' + rotAct + '»');

  /* 28.10 Sin la tabla corrida, el taller funciona entero y LO DICE. */
  nuevaBase(w, { sinTablaAct: true });
  w.eval('_vozActNube = "local"; vozActSincronizar("c-act")');
  await esperar(400);
  ok(/voz_actividades\.sql/.test(w.eval('vozActRotuloNube()')) && /aparato/i.test(w.eval('vozActRotuloNube()')),
     'sin correr el SQL el taller funciona igual y dice qué archivo falta, en vez de fingir que viaja',
     'no dice qué falta: ' + w.eval('vozActRotuloNube()'));
  ok(Number(w.eval('vozActCuenta("c-act")')) === 1,
     'y lo que había en el aparato no se pierde', 'se perdieron las actividades sin tabla');


  /* ── 36-bis. EL TALLER LO MONTA EL SISTEMA, DEL PROPIO TEXTO ──
     Pedido por el autor el 16 de septiembre de 2026: «que el sistema
     genere las actividades de cada lectura», y aclarado el mismo día:
     «no quiero APIs ni nada de eso; el sistema debe tener las actividades
     una vez que se pegue o suba un ensayo». O sea dos cosas que se
     comprueban aquí: que el generador del aparato recorta el texto —todas
     sus respuestas están en él letra por letra— y que corre SOLO, en el
     guardado, sin que nadie toque un botón. */
  log('── 36-bis. El taller lo monta el sistema, del propio texto ──');
  nuevaBase(w, { act: [] });
  const textoGen = [
    '# El pozo y la escuela', '', 'Voz: Rulfo', 'Máquina: Claude', 'Género: ensayo', '',
    '## La sequía', '',
    'El pozo se secó en el verano de 1927, y con él se fue medio pueblo. Nadie vuelve a un pueblo sin agua, decía Remigio Ochoa, el arriero, que había nacido en 1881 y conocía cada vereda. La **sequía** es el nombre que le dan aquí a los años en que el cielo se olvida de llover, y ese olvido duró siete años seguidos. El pueblo llegó a tener 1.200 habitantes antes de que se fueran todos.', '',
    '## La vuelta', '',
    'Volvieron tres familias en 1930: los Ochoa, los Paz y los Cárcamo. El maestro sostiene que la escuela fue lo que los trajo de vuelta, no el agua. La escuela abrió el 3 de marzo de 1931 con once alumnos y un solo pizarrón. Un pizarrón es una tabla pintada de negro donde se escribe con tiza y se borra con la mano. En conclusión, lo que devuelve a la gente a un lugar no es lo que hay en la tierra sino lo que hay en la plaza.', '',
    '## La memoria', '',
    'Cincuenta años después, Ochoa escribió sus memorias de aquellos días. Las publicó en 1955 una editorial pequeña de Tegucigalpa. Por lo tanto, lo que sabemos del pozo lo sabemos por él y por nadie más. El libro tiene 212 páginas y ninguna fotografía.', '',
    '## Referencias', '',
    '[1] Ochoa, R. (1955). Memorias del pozo. Tegucigalpa: Editorial del Sur.',
    '[2] Paz, L. (1962). La vuelta al pueblo. San Pedro Sula: Imprenta Central.',
    '[3] Cárcamo, M. (1978). Escuelas de aldea. Comayagua: Ediciones del Valle.',
    '[4] Villeda, A. (1990). Sequías del siglo. Tegucigalpa: Guaymuras.',
  ].join('\n');
  w.eval(`(function(){ const r = vozLeer(${JSON.stringify(textoGen)});
    const c = Object.assign({}, r, { cid: 'c-gen', borrado: false, actualizado: Date.now(), puesto_por: ${JSON.stringify(VOZ_UID)} });
    _vozCuentos = _vozCuentos.filter(x => x.cid !== 'c-gen').concat([c]); vozGuardaLocal(); })()`);
  const capsGen = Number(w.eval('_vozCuentos.find(x => x.cid === "c-gen").capitulos.length'));
  ok(capsGen === 4, 'el ensayo de prueba entra con sus tres capítulos y la bibliografía (' + capsGen + ')');

  /* La puerta del aparato, con el tope abierto para ver todo lo que sabe sacar. */
  const gen = JSON.parse(w.eval('JSON.stringify(vozActGenerarDelTexto("c-gen", 40))'));
  const deTipo = k => gen.filter(i => i.k === k);
  const TG = JSON.parse(w.eval('JSON.stringify(vozActPreparaTexto(vozTextoCuerpo(_vozCuentos.find(x => x.cid === "c-gen"), {})))'));
  const sinP = s => w.eval('vozActSinPuntuacion(' + JSON.stringify(s) + ')');
  const enTexto = s => TG.sinP.indexOf(sinP(s)) >= 0;
  ok(gen.length >= 12 && gen.every(i => i.via === 'txt' && i.auto === 1 && /^txt-/.test(i.id) && i.cita && i.donde),
     'el aparato saca ' + gen.length + ' actividades del ensayo, todas con via=txt, su cita y su capítulo',
     'salieron ' + gen.length + ' y no todas llevan via/cita/donde');
  const ab = deTipo('abierta');
  ok(ab.length >= 3 && /tesis/i.test(ab[0].q) && /sostiene que|En conclusi[oó]n|Por lo tanto/i.test(ab[0].guia),
     'la tesis va primero, y su pauta es una frase que sostiene o concluye (no una inventada)',
     'la tesis no salió primero o su pauta no es del texto: ' + JSON.stringify(ab[0] && ab[0].guia));
  ok(ab.some(i => /«La vuelta»/.test(i.q)) && ab.some(i => /«La memoria»/.test(i.q)),
     'y hay una abierta por capítulo con su idea principal, con la frase con que empieza como pauta');
  const compl = deTipo('completar');
  ok(compl.length >= 3 && compl.every(i => /___/.test(i.q) && enTexto(i.a) && sinP(i.cita).indexOf(sinP(i.a)) >= 0),
     '⚠️ cada completar tiene su hueco, y su respuesta está en el texto Y dentro de su propia cita (' + compl.length + ')',
     '⚠️ un completar tiene una respuesta que no sale del texto: ' + JSON.stringify(compl.map(i => i.a)));
  const respDatos = compl.map(i => i.a).concat(deTipo('opcion').map(i => i.o[i.ok]));
  ok(respDatos.some(a => /^\d{4}$/.test(a) || /de 1931/.test(a)) && respDatos.some(a => /^(Ochoa|Remigio Ochoa|Tegucigalpa)$/.test(a)),
     'hay fechas y nombres propios tapados en sus frases (' + respDatos.join(' · ') + ')',
     'faltan fechas o nombres entre los datos: ' + respDatos.join(' · '));
  const fl = deTipo('flash');
  ok(fl.some(i => /«sequía»/.test(i.f)) && fl.some(i => /«Un pizarrón»/.test(i.f)),
     'el término en negrita da una tarjeta, y la definición («Un pizarrón es…») otra',
     'faltan las tarjetas de término: ' + JSON.stringify(fl.map(i => i.f)));
  const op = deTipo('opcion');
  ok(op.length >= 1 && op.every(i => i.o.length === 4 && i.ok >= 0 && i.ok < 4 && enTexto(i.o[i.ok]) && i.o.every(x => TG.norm.indexOf(x) >= 0)),
     '⚠️ las de selección tienen cuatro opciones y TODAS salen del texto, la buena incluida: no se inventa ni un distractor (' + op.length + ')',
     '⚠️ una selección lleva una opción que no está en el texto: ' + JSON.stringify(op.map(i => i.o)));
  const pr = deTipo('pares');
  ok(pr.some(i => /bibliograf/i.test(i.q) && i.ps.length === 4 && i.ps.some(p => p[0] === 'Ochoa' && /Memorias del pozo/.test(p[1]))),
     'la bibliografía da un emparejar autor → obra con sus cuatro entradas');
  ok(pr.some(i => /capítulo/i.test(i.q) && i.ps.length >= 3), 'y los capítulos, un emparejar capítulo → idea');
  /* ⚠️ LA RED DE SEGURIDAD, SOBRE TODAS Y DE TODOS LOS TIPOS: ninguna
     respuesta puede estar fuera del texto. Las de arriba miran un tipo
     cada una; esta las mira todas, incluidas las tarjetas, que es por
     donde se escapaba. Quien la sostiene es el cedazo de
     `vozActGenerarDelTexto`: apagarlo con un generador que invente deja
     esta comprobación en rojo, que es justo lo que tiene que pasar. */
  const respTodas = gen.map(i => i.k === 'flash' ? i.r : i.k === 'completar' ? i.a
    : i.k === 'opcion' ? (i.o || [])[i.ok] : null).filter(x => x != null);
  const fugadas = respTodas.filter(x => !enTexto(x));
  ok(respTodas.length >= 8 && !fugadas.length,
     '⚠️ NINGUNA de las ' + respTodas.length + ' respuestas generadas está fuera del texto: el sistema recorta, no inventa',
     '⚠️ hay respuestas que NO están escritas en el texto: ' + JSON.stringify(fugadas.slice(0, 3)));
  const gen2 = JSON.parse(w.eval('JSON.stringify(vozActGenerarDelTexto("c-gen", 40))'));
  ok(JSON.stringify(gen2.map(i => i.id)) === JSON.stringify(gen.map(i => i.id)), 'y generar dos veces da los MISMOS ids: reemplaza, no duplica');
  const genDef = JSON.parse(w.eval('JSON.stringify(vozActGenerarDelTexto("c-gen"))'));
  ok(genDef.length === 10 && genDef[0].k === 'abierta' && /tesis/i.test(genDef[0].q) && genDef.some(i => i.k === 'pares'),
     'con el tope de un texto corto (10) se intercalan los grupos: la tesis entra siempre y los datos no se lo comen todo (' +
     genDef.map(i => i.k).join(',') + ')');

  /* Las procedencias no se pisan. */
  w.eval('vozActGuardarFicha("c-gen", [{ id: "mano-1", k: "flash", f: "A mano", r: "R" }], true)');
  w.eval('vozActGenerarTextoYGuardar("c-gen")');
  const vias1 = JSON.parse(w.eval('JSON.stringify(vozActDe("c-gen").items.map(i => vozActVia(i)))'));
  ok(vias1.filter(v => v === 'txt').length === 10 && vias1.filter(v => v === '').length === 1,
     'sacarlas del texto AÑADE las 📖 y no toca la pegada a mano', JSON.stringify(vias1));
  w.eval(`(function(){ const todo = vozSubLeeTodo(); todo['c-gen'] = [
    { id: 'sg1', cap: 0, vp: 0, i: 3, f: 7, t: 'pozo', c: 'dato', n: '', u: Date.now(), del: false, user: ${JSON.stringify(VOZ_UID)} }];
    vozSubGuardaTodo(); })()`);
  w.eval('vozActGenerarYGuardar("c-gen")');
  const vias2 = JSON.parse(w.eval('JSON.stringify(vozActDe("c-gen").items.map(i => vozActVia(i)))'));
  ok(vias2.filter(v => v === 'txt').length === 10 && vias2.filter(v => v === 'sub').length === 1 && vias2.filter(v => v === '').length === 1,
     '⚠️ refrescar desde los subrayados NO borra las sacadas del texto ni la pegada: cada vía reemplaza solo las suyas', JSON.stringify(vias2));
  w.eval('vozActGenerarTextoYGuardar("c-gen")');
  const vias3 = JSON.parse(w.eval('JSON.stringify(vozActDe("c-gen").items.map(i => vozActVia(i)))'));
  ok(vias3.filter(v => v === 'txt').length === 10 && vias3.filter(v => v === 'sub').length === 1, 'y volver a sacar del texto reemplaza las 📖 sin duplicarlas ni tocar la 🖍');

  /* ── Y NO EXISTE NINGUNA PUERTA DE PAGO ───────────────────────────
     «No quiero APIs ni nada de eso» (el autor, 16 de septiembre de
     2026). Hubo un rato una segunda puerta que le pedía las actividades
     a Claude por una Edge Function, con su clave de pago. Esto vigila
     que no vuelva por la puerta de atrás: ni la función, ni el botón. */
  ok(w.eval('typeof vozActPedirIA') === 'undefined' && w.eval('typeof VOZ_ACT_FUNCION') === 'undefined',
     '⚠️ la puerta de pago no existe: ni vozActPedirIA ni la dirección de la función',
     'quedó viva la puerta de la Edge Function');
  ok(!('ia' in JSON.parse(w.eval('JSON.stringify(VOZ_ACT_VIAS)'))),
     'y tampoco su vía en el rótulo de procedencia');
  w.eval('vozActAbrirTaller("c-gen")');
  await esperar(200);
  const botonesT = [...d.querySelectorAll('#voz-act-cuerpo button')].map(e => e.textContent);
  ok(!botonesT.some(t => /Claude|IA\b|API/i.test(t)),
     'y en el taller no hay ni un botón que pida nada por la red: ' + botonesT.map(t => t.slice(0, 22)).join(' | '));
  const filasVia = [...d.querySelectorAll('#voz-act-cuerpo .voz-act-fila-auto')].map(e => e.textContent);
  ok(filasVia.some(t => /sacada del texto/.test(t)) && filasVia.some(t => /subrayado/.test(t)),
     'cada actividad sigue diciendo de dónde salió: 📖 el texto o 🖍 un subrayado (la etiqueta de la regla 1, por pregunta)');
  w.eval('vozActCerrarTaller()');
  await esperar(120);

  /* ── EL TALLER SE MONTA SOLO AL GUARDAR EL ENSAYO ──────────────────
     Es lo que se pidió con todas las letras: «el sistema debe tener las
     actividades una vez que se pegue o suba un ensayo». Se prueba por el
     camino de verdad —se abre la hoja, se pega y se PULSA el botón—,
     porque llamar a vozGuardarPegado() por dentro se salta justo lo que
     puede estar mal: que el automático no esté enganchado al guardado. */
  nuevaBase(w, { act: [] });
  await w.eval('initVozPrestada()');
  await esperar(400);
  w.eval('vozAbrirPegar(null)');
  await esperar(200);
  d.getElementById('voz-pegar-txt').value = textoGen;
  d.getElementById('voz-f-titulo').value = 'El pozo y la escuela';
  d.getElementById('voz-f-voz').value = 'Rulfo';
  d.getElementById('voz-f-maquina').value = 'Claude';
  w.eval('vozRepasar()');
  await esperar(250);
  d.getElementById('voz-guardar-btn').click();
  await esperar(800);
  const cidAuto = w.eval('_vozCuentos[0].cid');
  const nAuto = Number(w.eval('vozActCuenta(' + JSON.stringify(cidAuto) + ')'));
  ok(nAuto >= 8,
     '⚠️ AL GUARDAR EL ENSAYO EL TALLER YA ESTÁ MONTADO: ' + nAuto + ' actividades sin tocar ningún botón',
     '⚠️ se guardó el ensayo y el taller quedó vacío (' + nAuto + '): el automático no está enganchado al guardado');
  const viasAuto = vozActViasDe(w, cidAuto);
  ok(viasAuto.txt === nAuto, 'y todas son de vía txt, o sea sacadas del propio texto', JSON.stringify(viasAuto));
  ok([...d.querySelectorAll('#view-voz .voz-ficha-taller')].length >= 1,
     'y la ficha del anaquel ya enseña su botón de taller, sin haber abierto nada');

  /* Corregir el texto refresca las 📖 y NO toca lo pegado a mano: esto
     corre en CADA guardado, así que si tocara lo de a mano, arreglar una
     coma le borraría a alguien el cuestionario que escribió. */
  w.eval('vozActGuardarFicha(' + JSON.stringify(cidAuto) + ', vozActDe(' + JSON.stringify(cidAuto) +
         ').items.concat([{ id: "mano-9", k: "flash", f: "Puesta a mano", r: "No se toca" }]), true)');
  w.eval('vozAbrirPegar(_vozCuentos.find(c => c.cid === ' + JSON.stringify(cidAuto) + '))');
  await esperar(300);
  d.getElementById('voz-pegar-txt').value = d.getElementById('voz-pegar-txt').value
    .replace('con once alumnos', 'con doce alumnos');
  w.eval('vozRepasar()');
  await esperar(250);
  d.getElementById('voz-guardar-btn').click();
  await esperar(800);
  const viasCorr = vozActViasDe(w, cidAuto);
  ok(viasCorr.mano === 1 && viasCorr.txt >= 8,
     '⚠️ corregir el texto vuelve a sacar las 📖 y deja intacta la pegada a mano (' + JSON.stringify(viasCorr) + ')',
     '⚠️ una corrección se llevó por delante lo pegado a mano: ' + JSON.stringify(viasCorr));
  const respCorr = JSON.parse(w.eval('JSON.stringify(vozActDe(' + JSON.stringify(cidAuto) +
    ').items.filter(i => i.k === "completar").map(i => i.a))'));
  ok(!respCorr.some(a => a === 'once'), 'y las respuestas siguen el texto corregido, no el viejo');

  /* Y un taller vacío se monta al abrirlo: es lo que da taller a los
     textos que ya estaban en el anaquel antes de que esto existiera. */
  w.eval('vozActGuardarFicha(' + JSON.stringify(cidAuto) + ', [], true)');
  ok(Number(w.eval('vozActCuenta(' + JSON.stringify(cidAuto) + ')')) === 0, 'con el taller vaciado a mano, parte de cero');
  w.eval('vozActAbrirTaller(' + JSON.stringify(cidAuto) + ')');
  await esperar(600);
  ok(Number(w.eval('vozActCuenta(' + JSON.stringify(cidAuto) + ')')) >= 8,
     '⚠️ y abrir un taller VACÍO lo monta solo: los textos de antes no hay que volver a guardarlos',
     'abrir el taller vacío no montó nada');
  w.eval('vozActCerrarTaller()');
  await esperar(120);

  /* ⚠️ PERO NO CON LA NUBE A MEDIO CONTESTAR. Montar con la señal caída
     escribiría una ficha con el reloj de AHORA, que le ganaría por más
     nueva a las actividades que otra persona de la casa pegó en otro
     aparato — y se las llevaría sin dar ningún error. */
  w.eval('vozActGuardarFicha(' + JSON.stringify(cidAuto) + ', [], true)');
  w.eval('_vozActNube = "sin-senal"');
  w.eval('vozActMontarSiVacio(' + JSON.stringify(cidAuto) + ')');
  ok(Number(w.eval('vozActCuenta(' + JSON.stringify(cidAuto) + ')')) === 0,
     '⚠️ con la nube sin contestar NO se monta nada: montar a ciegas borraría lo que otro aparato pegó a mano',
     '⚠️ se montó el taller sin saber qué hay en la nube');
  w.eval('_vozActNube = "al-dia"');
  w.eval('vozActMontarSiVacio(' + JSON.stringify(cidAuto) + ')');
  ok(Number(w.eval('vozActCuenta(' + JSON.stringify(cidAuto) + ')')) >= 8, 'y en cuanto la nube contesta, sí');

  /* ── EL CEDAZO: lo que se responde está ESCRITO en el texto ─────────
     Es el único guardia del generador y el que hace que «el sistema
     genera las actividades» no signifique «el sistema se inventa las
     respuestas». Se comprueba por los dos lados: que deja pasar lo que
     está y que para lo que no. */
  const TT = JSON.parse(w.eval('JSON.stringify(vozActPreparaTexto(vozActTodoPlano(_vozCuentos.find(x => x.cid === "c-gen"))))'));
  const literal = (x) => w.eval('vozActLiteral(' + JSON.stringify(x) + ', vozActPreparaTexto(vozActTodoPlano(_vozCuentos.find(v => v.cid === "c-gen"))))');
  ok(literal('1927') === true && literal('Remigio Ochoa') === true && literal('El pozo se secó en el verano de 1927') === true,
     'el cedazo deja pasar un año, un nombre y una frase que SÍ están en el texto');
  ok(literal('1928') === false && literal('Ochoa murió en Comayagua') === false,
     '⚠️ y para un año cambiado y una frase inventada: una pregunta cuya respuesta no está escrita no se guarda',
     '⚠️ el cedazo deja pasar una respuesta que no está en el texto');
  ok(TT.norm.length > 500 && /memorias del pozo/.test(TT.norm),
     'y el texto con el que compara lleva la bibliografía dentro: un año de una referencia es respuesta buena');

  /* ── 37. LA REPISA DE RECURSOS DE UN TEXTO ──
     Pedida por el autor el 18 de septiembre de 2026: «agregar en las
     lecturas algún vínculo url o dirección de una app, que podría ser un
     recurso para reforzar el aprendizaje». Viaja por `recursos_enlaces`
     con mision='voz:<cid>', así que aquí se prueban DOS cosas que no se
     ven solas: que la dirección no puede llegar envenenada a un `href`,
     y que la costura con esa tabla es la de verdad (firmada, con su
     prefijo, y SIN filtrar por usuario, porque es de la casa). */
  log('── 37. Los recursos de refuerzo de un texto ──');
  const baseRec = nuevaBase(w, { act: [], recs: [] });
  await w.eval('initVozPrestada()');
  await esperar(400);
  const cidRec = w.eval('_vozCuentos[0].cid');
  w.eval('vozAbrirLector(' + JSON.stringify(cidRec) + ')');
  await esperar(500);
  w.eval("vozPintarPanelInd('recs'); vozAbrirPanel('voz-panel-ind')");
  await esperar(250);

     Pedido el 19 de septiembre de 2026: «necesito que las materias o
     categorías de las lecturas puedan desplegarse y solo seleccionar las
     lecturas que yo elija». Lo que puede salir mal aquí está ordenado por
     gravedad, y lo primero NO se ve leyendo el HTML: que el mando responda
     y el montón se quede entero a la vista, porque el `[hidden]` del
     navegador lo pierde contra el `display: flex` de `.voz-grupo`. Eso ya
     pasó una vez en Mis Rutas, así que se mira el display CALCULADO, como
     se miran los colores. Después: que se abra solo (con ocho estantes es
     devolver el problema), que abrir uno abra otros, que el estante
     «Cuento» y el género «cuento» compartan llave, que esto viaje a la
     nube, y que buscando el resultado se quede escondido detrás de un
     rótulo plegado — que se lee igual que una búsqueda sin resultados. */
  log('── 42. Los estantes se pliegan: se abre el que se quiere mirar ──');
  const base42 = nuevaBase(w, {});
  const conEst42 = (cid, tit, est, gen) => Object.assign(cuentoLargo(cid), {
    titulo: tit, voz: 'Rulfo', maquina: 'Claude', genero: gen, estantes: est, puesto_por: VOZ_UID });
  w.eval(`_vozCuentos = ${JSON.stringify([
      conEst42('e1', 'Zanja',  ['Educaci\u00f3n'], 'cuento'),
      conEst42('e2', 'Bruma',  ['Educaci\u00f3n'], 'ensayo'),
      conEst42('e3', 'Marea',  ['Cultura_Cine'], 'cuento'),
      conEst42('e4', 'Ceniza', ['Cuento'], 'cuento'),
    ])}; vozGuardaLocal();
    _vozAnaquel = { vista: 'lista', orden: 'recientes', grupo: 'estante', manual: [], abiertos: {} }; vozGuardaAnaquel();
    _vozFiltroVoz = ''; _vozFiltroGen = ''; _vozFiltroEst = ''; _vozBusca = ''; vozRender()`);
  await esperar(300);

  const rots42 = () => [...d.querySelectorAll('#voz-lista .voz-grupo-tit')];
  const cajas42 = () => [...d.querySelectorAll('#voz-lista .voz-grupo')];
  ok(rots42().length === 3 && cajas42().length === 3,
     'por estante salen los tres montones (Educación, Cultura_Cine, Cuento)',
     'no salen tres grupos: ' + rots42().length + ' rótulos y ' + cajas42().length + ' cajas');
  ok(cajas42().every(c => c.hidden === true),
     '⚠️ y NINGUNO se abre solo: con ocho estantes, abrir «los que tengan algo» es abrir casi todos y devolver el problema',
     '⚠️ un estante sale abierto sin que nadie lo tocara');
  ok(cajas42().every(c => w.getComputedStyle(c).display === 'none'),
     '⚠️ y el plegado se ve en el display CALCULADO: el `[hidden]` del navegador pierde contra el `display: flex` de la clase, así que sin una regla NUESTRA el mando respondería y el montón se quedaría entero a la vista',
     '⚠️ plegado, el montón sigue pintado: display calculado = ' + cajas42().map(c => w.getComputedStyle(c).display).join(', '));
  ok(d.querySelectorAll('#voz-lista .voz-grupo [data-voz-cid]').length === 4,
     'y aun plegados los cuatro textos están EN EL DOM, escondidos y no sin crear: el arrastre del orden a mano guarda el orden leyendo todos los contenedores, y un grupo que no estuviera les borraría el sitio',
     'los textos de un grupo plegado no están en el documento: ' + d.querySelectorAll('#voz-lista .voz-grupo [data-voz-cid]').length);
  const edu42 = rots42().find(r => /Educaci/.test(r.textContent));
  ok(!!edu42 && edu42.tagName === 'BUTTON' && edu42.getAttribute('aria-expanded') === 'false'
     && edu42.getBoundingClientRect().height >= 44,
     'el rótulo es un botón de verdad, con su aria-expanded y 44 px de alto (' + (edu42 ? Math.round(edu42.getBoundingClientRect().height) : '?') + ' px)',
     'el rótulo no es un botón de 44 px con aria: ' + (edu42 && edu42.tagName) + ' ' + (edu42 && edu42.getAttribute('aria-expanded')) + ' ' + (edu42 && Math.round(edu42.getBoundingClientRect().height)));
  ok(!!edu42 && /2 textos/.test(edu42.textContent),
     'y plegado dice cuántos lleva dentro, que es la única cosa que se puede leer sin abrirlo',
     'el rótulo no dice su cuenta: ' + (edu42 && edu42.textContent));
  const nota42 = d.getElementById('voz-grupos-nota');
  ok(!!nota42 && !nota42.hidden && /Toca/.test(nota42.textContent),
     'y se explica con palabras encima de la lista: un galón no se explica solo',
     'no se explica que los rótulos se abren: ' + (nota42 && nota42.textContent));

  base42.llamadas.length = 0;
  edu42.click();
  await esperar(250);
  const abierta42 = d.getElementById(edu42.getAttribute('aria-controls'));
  ok(!!abierta42 && abierta42.hidden === false && w.getComputedStyle(abierta42).display !== 'none'
     && abierta42.getBoundingClientRect().height > 0
     && abierta42.querySelectorAll('[data-voz-cid]').length === 2,
     'un toque en el rótulo abre sus dos textos, de verdad y con alto (' + (abierta42 ? Math.round(abierta42.getBoundingClientRect().height) : '?') + ' px)',
     'el toque no abrió el estante: hidden=' + (abierta42 && abierta42.hidden) + ' display=' + (abierta42 && w.getComputedStyle(abierta42).display));
  ok(cajas42().filter(c => !c.hidden).length === 1,
     '⚠️ Y SOLO ESE: es lo que se pidió con «solo seleccionar las lecturas que yo elija»',
     'abrir uno abrió ' + cajas42().filter(c => !c.hidden).length + ' estantes');
  ok(edu42.getAttribute('aria-expanded') === 'true' && rots42().indexOf(edu42) === 0,
     'sin repintar el anaquel: es el mismo botón, con su aria cambiado (un repintado le quita el foco y, en una tableta, le arranca del dedo la tarjeta siguiente)',
     'el rótulo se repintó al pulsarlo');
  ok(/1 abierto de 3/.test(d.getElementById('voz-grupos-nota').textContent)
     && /Cerrar todos/.test(d.getElementById('voz-grupos-nota').textContent),
     'y la nota lleva la cuenta y el mando de cerrarlos todos: quien abre cinco para buscar una cosa se queda con cinco abiertos, porque esto se recuerda a propósito',
     'la nota no lleva la cuenta ni el cierre: ' + d.getElementById('voz-grupos-nota').textContent);
  ok(base42.llamadas.filter(l => l.m !== 'GET').length === 0,
     '⚠️ y abrir un estante NO viaja a la nube: es una postura de esta pantalla, como la vista y el orden a mano',
     '⚠️ abrir un estante escribió en la nube');
  const guard42 = JSON.parse(w.localStorage.getItem('faro_voz_anaquel_v1') || '{}');
  ok(guard42.abiertos && guard42.abiertos['estante:educacion'] === true
     && Object.keys(guard42.abiertos).length === 1,
     'se guarda en el aparato, con el eje delante de la clave y solo el que está abierto',
     'lo abierto no se guardó bien: ' + JSON.stringify(guard42.abiertos));

  await w.eval('initVozPrestada()');
  await esperar(500);
  ok(cajas42().filter(c => !c.hidden).length === 1
     && rots42().find(r => /Educaci/.test(r.textContent)).getAttribute('aria-expanded') === 'true',
     'y sigue abierto al volver a abrir la herramienta',
     'al volver a abrir se perdió lo que estaba abierto');

  /* ⚠️ LA LLAVE LLEVA EL EJE DELANTE: un estante llamado «Cuento» y el
     género «cuento» darían la misma clave, y abrir uno abriría el otro al
     cambiar de agrupación — sin dar ningún error. */
  w.eval(`_vozAnaquel.abiertos = { 'estante:cuento': true }; vozGuardaAnaquel();
          _vozAnaquel.grupo = 'genero'; vozGuardaAnaquel(); vozRender()`);
  await esperar(250);
  const gCuento = rots42().find(r => /Cuento/.test(r.textContent));
  ok(!!gCuento && gCuento.getAttribute('aria-expanded') === 'false',
     '⚠️ y abrir el ESTANTE «Cuento» no abre el GÉNERO «cuento»: la clave lleva el eje delante',
     'el estante y el género comparten llave: el género salió ' + (gCuento && gCuento.getAttribute('aria-expanded')));

  /* Buscando se abren, y eso NO se guarda: es el efecto de la búsqueda. */
  w.eval(`_vozAnaquel.grupo = 'estante'; _vozAnaquel.abiertos = {}; vozGuardaAnaquel();
          _vozBusca = 'Rulfo'; vozRender()`);
  await esperar(250);
  ok(cajas42().every(c => c.hidden === false),
     '⚠️ buscando, los montones se abren: un resultado escondido detrás de un rótulo plegado se lee igual que una búsqueda que no encontró nada',
     'buscando, el resultado se queda escondido');
  ok(d.getElementById('voz-grupos-nota').hidden === true,
     'y la nota de abrir y cerrar se quita, porque ahí no manda nadie',
     'buscando sigue saliendo el mando de abrir todos');
  w.eval("_vozBusca = ''; vozRender()");
  await esperar(250);
  ok(cajas42().every(c => c.hidden === true)
     && Object.keys(JSON.parse(w.localStorage.getItem('faro_voz_anaquel_v1') || '{}').abiertos || {}).length === 0,
     'y al borrar la búsqueda vuelven a estar plegados: abrirlos era el efecto de buscar, no la decisión de nadie, y no se guardó',
     '⚠️ la búsqueda dejó los estantes abiertos para siempre');

  /* Abrir y cerrar todos, que es la vuelta a la vista compacta. */
  d.querySelector('#voz-grupos-nota .voz-btn').click();
  await esperar(250);
  ok(cajas42().every(c => !c.hidden) && /3 abiertos de 3/.test(d.getElementById('voz-grupos-nota').textContent),
     '«Abrir todos» los abre y la nota lo dice',
     '«Abrir todos» no abrió los tres: ' + d.getElementById('voz-grupos-nota').textContent);
  d.querySelector('#voz-grupos-nota .voz-btn').click();
  await esperar(250);
  ok(cajas42().every(c => c.hidden) && /Toca/.test(d.getElementById('voz-grupos-nota').textContent),
     'y el mismo mando los cierra: un solo botón para las dos cosas, como el interruptor de los estantes de varios',
     '«Cerrar todos» no los cerró');

  /* ⚠️ CON UN SOLO MONTÓN NO HAY MANDO: cobrar un toque por un nivel
     que ahí no separa nada es peor que no agrupar. Pasa siempre que se
     filtra por un estante, que es cuando ya se eligió el montón. */
  w.eval("_vozFiltroEst = 'Educaci\u00f3n'; vozRender()");
  await esperar(250);
  ok(rots42().length === 1 && rots42()[0].tagName !== 'BUTTON'
     && cajas42().length === 1 && cajas42()[0].hidden === false,
     '⚠️ filtrando por un estante queda un solo montón, abierto y SIN mando: un toque cobrado por un nivel que ahí no separa nada',
     'con un solo montón sigue habiendo mando o sale plegado: ' + rots42().length + ' rótulos, ' + (rots42()[0] && rots42()[0].tagName) + ', hidden=' + (cajas42()[0] && cajas42()[0].hidden));
  ok(d.getElementById('voz-grupos-nota').hidden === true,
     'y la nota tampoco sale',
     'con un solo montón sale la nota de abrir y cerrar');
  w.eval("_vozFiltroEst = ''; _vozAnaquel.grupo = ''; _vozAnaquel.abiertos = {}; vozGuardaAnaquel(); vozRender()");
  await esperar(200);
  ok(d.querySelectorAll('#voz-lista .voz-grupo-tit').length === 0
     && d.querySelectorAll('#voz-lista .voz-grupo')[0].hidden === false,
     'y sin agrupar no hay rótulos ni nada plegado: el anaquel de siempre',
     'sin agrupar quedó algo plegado');

  log('── 13. Con la base vieja no revienta: dice qué falta ──');
  /* ⚠️ Estas últimas se hacen en EL MISMO marco, cambiándole la base de
     mentira y volviendo a arrancar la herramienta, y no abriendo un
     segundo index.html. Un segundo marco del mismo origen se queda
     colgado en este entorno y la sonda no llega nunca a poner su
     veredicto en el título — y una sonda sin veredicto no es media
     sonda: es ninguna, porque en tanda solo se lee el título. */
  nuevaBase(w, { sinTabla: true });
  await w.eval('initVozPrestada()');
  await esperar(400);
  const nube = d.getElementById('voz-nube').textContent;
  ok(/voz_prestada\.sql/.test(nube),
     'nombra el archivo que hay que correr (desde una tableta no se adivina)',
     'no dice qué archivo falta: ' + nube);
  ok(/aparato/i.test(nube),
     'y dice que por ahora solo vive en este aparato, en vez de fingir que viaja',
     'no avisa de que no viaja');

  log('── 17. ⚠️ LA BASE DEL ESTRENO, SIN LA COLUMNA genero, NO ES «SIN SEÑAL» ──');
  /* La tabla se creó el 10 de septiembre sin `genero`. Con el archivo
     nuevo sin volver a correr, PostgREST rebota la consulta entera:
     eso NO es un corte de red ni «falta el SQL». La herramienta tiene
     que volver a pedir sin la columna, seguir funcionando y decir qué
     hay que volver a correr — y NO mandar la columna al guardar, que
     también rebotaría. */
  const baseVieja = nuevaBase(w, { sinGenero: true, filas: [Object.assign(cuentoLargo('c-nube'), { puesto_por: VOZ_UID })] });
  w.eval('_vozCuentos = []; _vozHayTabla = true; _vozNubeVieja = false');
  await w.eval('initVozPrestada()');
  await esperar(500);
  ok(Number(w.eval('_vozCuentos.filter(c => c.cid === "c-nube").length')) === 1,
     'con la base vieja, los textos de la nube SÍ llegan (se vuelve a pedir sin la columna)',
     '⚠️ con la base vieja no llegó nada: ' + w.eval('_vozEstadoNube'));
  const nubeVieja = d.getElementById('voz-nube').textContent;
  ok(/vieja/i.test(nubeVieja) && /voz_prestada\.sql/.test(nubeVieja),
     'y la barra dice que la base va vieja y qué archivo volver a correr',
     'la barra no explica la base vieja: ' + nubeVieja);
  ok(!/se[ñn]al/i.test(nubeVieja), 'sin confundirlo con un corte de señal', 'lo dice como señal: ' + nubeVieja);
  baseVieja.escritas.length = 0;
  w.eval('vozAbrirPegar(null)');
  await esperar(120);
  d.getElementById('voz-pegar-txt').value = 'Una casa contaba.';
  d.getElementById('voz-f-titulo').value = 'La casa en la base vieja';
  d.getElementById('voz-f-voz').value = 'un narrador de pueblo';
  d.getElementById('voz-f-maquina').value = 'una máquina de prueba';
  w.eval('vozPintarBotonGuardar()');
  await w.eval('vozGuardarPegado()');
  await esperar(400);
  const subidaVieja = baseVieja.escritas.find(x => x.titulo === 'La casa en la base vieja');
  ok(!!subidaVieja && !('genero' in subidaVieja),
     'y lo que se guarda sube SIN la columna que la base no tiene, así que entra',
     '⚠️ con la base vieja el guardado ' + (subidaVieja ? 'mandó la columna genero y rebotaría' : 'no llegó a la nube'));

  log('── 14. ⚠️ UN CORTE DE RED NO VACÍA EL ANAQUEL ──');
  /* Lección 14 de El Rodaje: si un corte dejara el anaquel en cero, la
     pantalla diría «no hay textos» con un botón que invita a PEGAR, y
     el camino natural después de una mala señal sería pegar encima los
     que ya estaban. */
  w.eval(`_vozCuentos = [${JSON.stringify(cuentoLargo('c-red'))}]; _vozNubeVieja = false; vozRender()`);
  nuevaBase(w, { sinSenal: true });
  /* Con reloj: si algún día una petición caída dejara la herramienta
     esperando para siempre, la sonda tiene que DECIRLO, no colgarse.
     Una sonda colgada no pone veredicto en el título, y en tanda solo se
     lee el título: se leería igual que una sonda que nadie corrió. */
  const r14 = await Promise.race([
    w.eval('initVozPrestada().then(function(){return "ok"},function(e){return "revento: "+e.message})'),
    esperar(11000).then(() => 'SE QUEDÓ ESPERANDO'),
  ]);
  ok(r14 === 'ok', 'la herramienta vuelve de una petición caída (' + r14 + ')',
     'con la señal caída la herramienta se queda colgada: ' + r14);
  await esperar(400);
  ok(Number(w.eval('_vozCuentos.length')) === 1,
     'con la señal caída, lo que ya estaba se queda',
     '⚠️ un corte de red dejó el anaquel vacío');
  const nube2 = d.getElementById('voz-nube').textContent;
  ok(/se[ñn]al/i.test(nube2),
     'y lo dice como señal, no como «falta el SQL»',
     'confunde un corte de red con una tabla que falta: ' + nube2);
  ok(!/voz_prestada\.sql/.test(nube2),
     'y no manda a pegar trescientas líneas de SQL en una base que ya las tiene',
     'con la señal caída manda a correr el SQL otra vez');

  log('');
  log(fallos === 0 ? 'RESULTADO: APRUEBA' : `RESULTADO: SUSPENDE · ${fallos} fallo(s)`);
  document.title = (fallos === 0 ? 'APRUEBA' : 'SUSPENDE') + ' · La Voz Prestada';
})().catch(e => {
  log('✘ la sonda reventó: ' + (e && e.message) + '\n' + (e && e.stack));
  log('RESULTADO: SUSPENDE');
  document.title = 'SUSPENDE · La Voz Prestada';
});
</script>
</body>
</html>
