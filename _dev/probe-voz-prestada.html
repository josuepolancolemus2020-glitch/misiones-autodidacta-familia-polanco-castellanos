<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Sonda de la herramienta 📖 LA VOZ PRESTADA.

   Esta herramienta guarda textos que una máquina escribió imitando la
   voz de otro —cuentos, ensayos, poemas— y los deja leer como un libro.
   Lo que puede salir mal no es «se ve feo»:

   1. QUE UN TEXTO SE GUARDE SIN SU ETIQUETA. Es LA regla. Un cuento
      «al modo de» alguien, leído seis meses después en una tableta y
      sin la ventana del chat alrededor, no se distingue de uno que sí
      fuera suyo: así nace una atribución falsa, sin mala fe. La
      etiqueta tiene que estar en la ficha, en la portada, en el pie de
      cada página y dentro de lo que copia el botón 📋, y el guardado
      tiene que PARARSE si falta.

   2. QUE EL PEGADO DESCUARTICE EL TEXTO. Una línea corta y suelta que
      ascienda a capítulo mete un salto de página en mitad de una
      escena, y eso PARECE QUE FUNCIONÓ: sale el índice, salen las
      páginas, todo. Solo se descubre leyendo el texto entero. Y el
      revés con los poemas: juntar los versos en un párrafo los destruye
      sin avisar.

   3. QUE AL CAMBIAR LA LETRA SE PIERDA EL SITIO. El número de páginas
      depende del tamaño de letra y del ancho de la pantalla, así que la
      posición se guarda por PÁRRAFO y fracción. Se mide de verdad: se
      abre la sala, se pasa a la página 3, se sube la letra y se mira si
      el párrafo sigue a la vista.

   4. QUE LA ÚLTIMA PÁGINA SALGA CORRIDA. El desplazamiento se quedaba
      corto en lo que medía el margen y la última página de cada
      capítulo salía movida, con la cola de la anterior asomando. Se mide
      el margen del texto en la primera página Y en la última.

   5. QUE UN TEXTO PEGADO ESCRIBA HTML DENTRO DE F.A.R.O. Aquí entra el
      texto más largo de toda la aplicación, pegado desde otra ventana,
      y esta aplicación tiene dentro la Bóveda, las finanzas, el chat y
      los teléfonos del Buzón del lector. Vale también para el buscador,
      que pinta <mark> troceando texto.

   6. QUE UN CORTE DE RED SE VEA COMO UN ANAQUEL VACÍO, que es lo que
      invita a pegar encima los textos que ya estaban. Y que una base
      SIN LA COLUMNA NUEVA (`genero`) se vea como un corte de red o como
      «falta el SQL»: la tabla está, y hay que decir lo que hay.

   7. QUE UN SUBRAYADO CAIGA EN OTRO TROZO, SE PIERDA AL CAMBIAR LA
      LETRA O SUBA SIN FIRMAR. Son los cinco colores del marcador de las
      misiones y viajan por su misma tabla; la base de mentira exige la
      firma igual que la de verdad.

   8. QUE RETIRAR NO RETIRE. El botón pasaba por window.confirm —que en
      la aplicación instalada puede no salir— y la lápida se perdía al
      volver a guardar el anaquel, así que el texto resucitaba desde la
      nube. Se prueba con la nube devolviendo todavía el texto viejo.

   9. QUE EL MODO DESLIZANDO NO DESLICE DESDE LOS BORDES (las zonas de
      toque tapaban la caja) y que HOJEAR deje dos #voz-texto en el
      documento. Y que el anaquel pierda la etiqueta en alguna vista.

  10. QUE PONER UN BOTÓN A UNA CITA SE COMA TEXTO DEL ENSAYO. Si la
      llamada se sustituyera por un numerito, el texto plano del párrafo
      cambiaría —y con él se moverían TODOS los subrayados de ese
      párrafo, que se guardan por desplazamiento de caracteres— sin dar
      ningún error. Se compara el pintado con el guardado carácter por
      carácter. Y que consultar una fuente mueva la lectura, que en un
      lector paginado es perder la página.

  11. QUE UNA TABLA DESAPAREZCA. Con `break-inside: avoid` y una caja
      que se desliza —que es INDIVISIBLE para el navegador—, una tabla
      más alta que la página se recorta: queda el rótulo solo con media
      página en blanco debajo. No da error, el número de páginas sigue
      saliendo bien, y solo se descubre leyendo.

   Como en las demás sondas: aquí no se lee el código, se ejecuta el
   index.html de verdad con una base de datos de mentira a nivel de
   fetch. El cliente de Supabase es el auténtico.

   ⚠️ Y PARA MEDIR SE ABRE LA VISTA DE VERDAD (`switchView`) Y SE ENSEÑA
   `#app-container`: con el panel escondido, la caja del texto mide 0×0
   y la sonda aprobaría una paginación que en la tableta no existe. */

/* Quién entra, en la sonda. La herramienta lo saca de la sesión de
   Supabase; aquí se le pone una de mentira para poder comprobar que la
   fila sale FIRMADA, que es justo lo que faltaba. */
const VOZ_UID = '11111111-1111-1111-1111-111111111111';

/* Lo que hay que esperar a que salga la barra de subrayar: los tres
   segundos que la herramienta espera a que la selección se quede
   quieta, más un respiro. Va en una constante para que el día que ese
   número cambie no haya que cazar cinco esperas por el archivo. */
const VOZ_SUB_ESPERA_SONDA = 3400;

const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ── La base de datos de mentira ────────────────────────────────── */
function nuevaBase(w, opciones){
  const o = opciones || {};
  const estado = { filas: o.filas || [], llamadas: [], escritas: [], marcas: o.marcas || [], marcasEscritas: [] };
  /* Las columnas que esta base NO tiene. `sinGenero` se queda por lo
     que ya estaba escrito; `faltan` sirve para cualquiera de las
     nuevas, que ya son dos. */
  const faltan = o.faltan || (o.sinGenero ? ['genero'] : []);
  const json = (cuerpo, status) => new Response(JSON.stringify(cuerpo),
    { status: status || 200, headers: { 'Content-Type': 'application/json' } });
  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url);
    const m = (init && init.method) || 'GET';
    /* Los subrayados viajan por lecturas_marcas, la tabla del marcador de
       las misiones, y la base de mentira la exige igual que la de verdad:
       firmada con quien entró, con `mision` y con un color de los cinco. */
    if (/lecturas_marcas/.test(u.pathname)) {
      estado.llamadas.push({ m, url: u.pathname + u.search, cuerpo: init && init.body });
      if (m === 'GET') {
        const mision = decodeURIComponent((u.search.match(/mision=eq\.([^&]+)/) || [])[1] || '');
        const uid = decodeURIComponent((u.search.match(/user_id=eq\.([^&]+)/) || [])[1] || '');
        return json(estado.marcas.filter(x => x.mision === mision && x.user_id === uid));
      }
      let cuerpo = null;
      try { cuerpo = JSON.parse(init && init.body); } catch (e) {}
      const filas = Array.isArray(cuerpo) ? cuerpo : (cuerpo ? [cuerpo] : []);
      for (const fila of filas) {
        if (!fila.user_id || !fila.mision || !fila.id) return json({ code: '23502', message: 'null value violates not-null constraint' }, 400);
        if (fila.user_id !== VOZ_UID) return json({ code: '42501', message: 'new row violates row-level security policy' }, 403);
        if (['dato', 'voz', 'idea', 'contra', 'duda'].indexOf(fila.color) < 0) return json({ code: '23514', message: 'violates check constraint "lecturas_marcas_color_check"' }, 400);
        estado.marcas = estado.marcas.filter(x => x.id !== fila.id).concat([fila]);
        estado.marcasEscritas.push(fila);
      }
      return json([], 201);
    }
    if (!/voz_prestada/.test(u.pathname)) return json([]);
    estado.llamadas.push({ m, url: u.pathname + u.search, cuerpo: init && init.body });
    if (o.sinTabla) return json({ code: '42P01', message: 'relation "public.voz_prestada" does not exist' }, 404);
    /* Un corte de señal de verdad NO es un 503 con cuerpo: es la
       petición que no llega. El cliente de Supabase no lanza por eso
       —devuelve {data:null,error}—, y esa es justo la rama que hay que
       probar, porque es la que se olvida mirar. */
    if (o.sinSenal) throw new TypeError('Failed to fetch');
    if (m === 'GET') {
      /* La base del DÍA DEL ESTRENO no tiene la columna `genero`, y
         PostgREST rebota la consulta entera con el error de PostgreSQL. */
      /* ⚠️ Sin `\b` en el nombre: la lista de columnas viaja CODIFICADA
         («%2Cgenero%2C»), así que la C del %2C pegada delante mata el
         borde de palabra y la comparación no casaría nunca — la base de
         mentira diría que la columna sí está y la sonda aprobaría una
         base vieja que en Supabase rebota. */
      const falta = faltan.find(col => u.search.indexOf(col) >= 0);
      if (falta) {
        return json({ code: '42703', message: 'column voz_prestada.' + falta + ' does not exist' }, 400);
      }
      return json(estado.filas);
    }
    /* ⚠️ LA BASE DE MENTIRA EXIGE LO MISMO QUE LA DE VERDAD.
       Antes aceptaba cualquier escritura y devolvía 201, así que la
       sonda aprobaba una subida que en Supabase rebotaba: `puesto_por`
       es `not null` y la política pide que sea quien entró. Eso fue el
       fallo del 10 de septiembre de 2026 —el cuento se veía donde se
       pegó y no llegaba nunca al otro aparato— y no lo cazó nadie
       porque cada mitad se probaba por separado. Un doble complaciente
       no prueba la costura: la esconde. Misma lección que el
       `grant all` de la prueba del SQL y que postgrest-falso.js. */
    let cuerpo = null;
    try { cuerpo = JSON.parse(init && init.body); } catch (e) {}
    const filas = Array.isArray(cuerpo) ? cuerpo : (cuerpo ? [cuerpo] : []);
    for (const fila of filas) {
      if (!fila.puesto_por) {
        return json({ code: '23502', message: 'null value in column "puesto_por" violates not-null constraint' }, 400);
      }
      if (fila.puesto_por !== VOZ_UID) {
        return json({ code: '42501', message: 'new row violates row-level security policy' }, 403);
      }
      const sobra = faltan.find(col => col in fila);
      if (sobra) {
        return json({ code: 'PGRST204', message: "Could not find the '" + sobra + "' column of 'voz_prestada' in the schema cache" }, 400);
      }
      estado.filas = estado.filas.filter(x => x.cid !== fila.cid).concat([fila]);
      estado.escritas.push(fila);
    }
    return json([], 201);
  };
  return estado;
}

/* Un texto largo de verdad, para que haya varias páginas que pasar.
   El texto es de la sonda: hace falta prosa larga, no prosa buena. */
function cuentoLargo(cid){
  const p = [];
  for (let i = 0; i < 40; i++) {
    p.push({ k: 'p', t: 'Párrafo número ' + (i + 1) + '. ' +
      'La casa contaba en voz baja y nadie del pueblo quiso nunca ' +
      'preguntarle en qué número iba, porque preguntar era entrar y ' +
      'entrar era sumar uno más a la cuenta de aquella tarde larga.' });
  }
  return {
    cid: cid, titulo: 'La casa que contaba', genero: 'cuento',
    voz: 'un narrador de pueblo', maquina: 'una máquina de prueba',
    encargo: 'un cuento sobre una casa que cuenta',
    capitulos: [{ t: 'Capítulo 1', p: p }, { t: 'Capítulo 2', p: p.slice(0, 12) }],
    palabras: 40 * 34, borrado: false, actualizado: 1000,
    creado_at: '2026-09-10T10:00:00Z',
  };
}

/* El margen izquierdo del primer bloque visible de la página actual,
   medido en la pantalla. Sirve para ver que el texto empieza donde
   tiene que empezar en todas las páginas, la última incluida. */
function margenVisible(w){
  return w.eval(`(function(){
    const h = document.getElementById('voz-hoja');
    const ps = h.querySelectorAll('[data-vp]');
    const x = h.getBoundingClientRect().left;
    for (const p of ps) {
      const rs = p.getClientRects();
      for (const r of rs) {
        if (r.left - x > -1 && r.left - x < h.clientWidth && r.width > 10) return Math.round(r.left - x);
      }
    }
    return -999;
  })()`);
}

/* ── La hoja del anaquel (rehecha el 12/9/2026) ──────────────────
   Desde que la barra es de una fila, los filtros y el orden viven
   dentro de una hoja que se abre. La sonda la abre y pulsa sus filas
   COMO SE PULSAN de verdad, no llamando a `vozHojaEstantes` por
   dentro: lo que puede fallar ahí —un botón que no se alcanza, una
   hoja que no abre— no se ve llamando funciones. */
function abreHoja(d, rotulo){
  const b = [...d.querySelectorAll('#voz-herr .voz-herr-btn')].find(x => x.textContent.indexOf(rotulo) > -1);
  if (b) b.click();
  return b;
}
function filaHoja(d, txt){
  return [...d.querySelectorAll('#voz-anaq-cuerpo .voz-hoja-fila')]
    .find(x => (x.querySelector('.voz-hoja-txt') || {}).textContent === txt);
}
function vozCerrarHojaSonda(w){ w.eval('vozCerrarHoja()'); }
function filasHoja(d){
  return [...d.querySelectorAll('#voz-anaq-cuerpo .voz-hoja-fila')]
    .map(x => (x.querySelector('.voz-hoja-txt') || {}).textContent +
              ((x.querySelector('.voz-hoja-n') || {}).textContent ? ' ' + x.querySelector('.voz-hoja-n').textContent : ''));
}

(async () => {
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await esperar(1200);
  const w = f.contentWindow, d = w.document;
  const base = nuevaBase(w, {});
  w.eval(`window.faroSb.auth.getSession = async () => (` +
         `{ data: { session: { user: { id: ${JSON.stringify(VOZ_UID)} } } } })`);
  /* El permiso de no apagar la pantalla, de mentira: en Chromium sin
     cabeza puede no existir o negarse, y lo que se prueba es que la
     herramienta lo PIDE y lo SUELTA. */
  /* `navigator.wakeLock` es un getter del prototipo: asignarle encima
     no hace nada (sin error). Se define encima de la instancia. */
  w.eval(`window.__luz = 0; Object.defineProperty(navigator, 'wakeLock', { configurable: true, value: { request: async () => { window.__luz++; return { release: async () => { window.__luz--; }, addEventListener() {} }; } } })`);

  /* La aplicación arranca con `#app-container` escondido hasta que entra
     alguien. Sin esto todo mide 0×0 y las medidas de pantalla mienten. */
  d.getElementById('app-container').style.display = '';
  w.eval('switchView("view-voz")');
  await esperar(250);

  log('── 1. El lector de texto pegado ──');
  const r1 = w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    '# El faro que no era\n\n**Al modo de:** un narrador de pueblo\nEscrito por: Claude\n' +
    'Género: ensayo\nEncargo: una luz que nadie encendió\n\n> Toda luz es una deuda.\n\nCapítulo 1: La luz\n\n' +
    'Nadie recordaba haberla encendido.\n\n—¿Y si se apaga? —dijo el niño.\n' +
    '—No se apaga —dijo su madre.\n\n* * *\n\nSe apagó un martes.\n\n### Lo que dijo el farero\n\n' +
    '- Primero la mecha.\n- Después el aceite.\n\nII\n\nSubieron la cuesta.\n\nFIN')}))`);
  const c1 = JSON.parse(r1);
  ok(c1.titulo === 'El faro que no era', 'saca el título del texto', 'no sacó el título: ' + c1.titulo);
  ok(c1.voz === 'un narrador de pueblo', 'y la voz imitada, aun escrita con **asteriscos**',
     'la voz salió mal: ' + JSON.stringify(c1.voz));
  ok(c1.maquina === 'Claude', 'y la máquina', 'la máquina salió mal: ' + c1.maquina);
  ok(c1.genero === 'ensayo', 'y el género, de la etiqueta «Género:»', 'el género salió mal: ' + c1.genero);
  ok(c1.capitulos.length === 2, 'reparte los dos capítulos', 'capítulos: ' + c1.capitulos.length);
  ok(c1.capitulos[0].epi && c1.capitulos[0].epi[0].k === 'cita' && /deuda/.test(c1.capitulos[0].epi[0].t),
     'y la cita de antes del capítulo 1 es el epígrafe, no un capítulo sin nombre',
     'el epígrafe no se reconoció: ' + JSON.stringify(c1.capitulos[0].epi));
  ok(c1.capitulos[0].p.filter(x => x.k === 'sep').length === 1,
     'y el salto de escena se guarda como salto, no como texto', 'perdió el * * *');
  const dial = c1.capitulos[0].p.filter(x => (x.t || '').startsWith('—'));
  ok(dial.length === 2, 'cada raya de diálogo abre párrafo aunque no haya blanco delante',
     'pegó las rayas de diálogo en un párrafo: ' + dial.length);
  ok(c1.capitulos[0].p.some(x => x.k === 'h3' && /farero/.test(x.t)),
     'y «###» es un subtítulo DENTRO del capítulo, no un capítulo más',
     'el ### abrió un capítulo o se perdió');
  ok(c1.capitulos[0].p.filter(x => x.k === 'li').length === 2,
     'y «- » hace ítems de lista', 'las viñetas no se leyeron como lista');
  ok(c1.capitulos[1].p.some(x => x.k === 'fin') && !c1.capitulos.some(c => /^fin$/i.test(c.t || '')),
     'y «FIN» a solas es la marca del final, no un capítulo', 'FIN salió como capítulo o se perdió');

  /* Los versos: tres renglones cortos seguidos se quedan con sus saltos.
     Juntarlos destruye el poema sin avisar y sin vuelta atrás. */
  const c1b = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\n\nAgua que no vuelves,\ntierra que no olvida,\ndime en qué barranca\nse escondió la vida.\n\nY siguió la prosa de siempre, larga y sin misterio ninguno, hasta el final del renglón.')}))`));
  ok(c1b.capitulos[0].p[0].k === 'verso' && c1b.capitulos[0].p[0].t.split('\n').length === 4,
     'y cuatro renglones cortos seguidos son una estrofa con sus cuatro versos',
     'juntó los versos en un párrafo: ' + JSON.stringify(c1b.capitulos[0].p[0]));
  const c1c = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\nGénero: poema\n\nQuisiera esta tarde divina de octubre\npasear por la orilla lejana del mar;')}))`));
  ok(c1c.genero === 'poema' && c1c.capitulos[0].p[0].k === 'verso',
     'y con «Género: poema» hasta dos renglones largos se quedan como versos',
     'un poema declarado se leyó como prosa');
  const c1d = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'La noche en Santa María\n\nAl modo de Onetti\nEscrito por Claude\n\nLa noche llegó tarde.')}))`));
  ok(c1d.titulo === 'La noche en Santa María' && c1d.voz === 'Onetti',
     'y la primera línea pelada es el título si debajo vienen las etiquetas',
     'no leyó el título de la primera línea: ' + c1d.titulo);
  const c1e = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: Borges\nMáquina: Gemini\n\n**El jardín**\n\nHabía un jardín.\n\n**La casa**\n\nHabía una casa.')}))`));
  ok(c1e.capitulos.length === 2 && c1e.capitulos[0].t === 'El jardín' && !c1e.titulo,
     'y dos negritas sueltas en serie son dos capítulos, no un título y un capítulo',
     'las negritas se leyeron mal: título=' + c1e.titulo + ' caps=' + c1e.capitulos.map(c => c.t).join('|'));

  log('── 2. ⚠️ Y NO DESCUARTIZA UN PÁRRAFO DE PROSA ──');
  /* El fallo más caro y el que menos se ve. Siete renglones seguidos que
     empiezan por siete palabras que nombran una parte de un libro: si
     alguna asciende a capítulo, el texto sale partido y PARECE que
     funcionó. Es la comprobación 5-bis del lector de El Rodaje. Y son
     frases con punto: prosa a un renglón por frase, no versos. */
  const prosa = ['Parte de la culpa era suya y lo sabía.',
    'Acto seguido cerró la puerta sin ruido.',
    'Prólogo de nada, se dijo, esto no empieza.',
    'Sección por sección revisó la casa.',
    'Introducción no hacía falta: ya se conocían.',
    'Coda o no, la noche seguía.',
    'Interludio, pensó, y se rió sola.'].join('\n');
  const c2 = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(prosa)}))`));
  ok(c2.capitulos.length === 1, 'un párrafo de prosa se queda en UN capítulo',
     'lo partió en ' + c2.capitulos.length + ' capítulos');
  ok(c2.capitulos[0].p.length === 1 && c2.capitulos[0].p[0].k === 'p',
     'y en UN párrafo de prosa, con sus siete renglones dentro',
     'lo partió en ' + c2.capitulos[0].p.length + ' bloques (' + c2.capitulos[0].p.map(b => b.k).join(',') + ')');
  const c2b = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'El tren se fue.\n\nNadie volvió a hablar de eso.\n\nY así fue.')}))`));
  ok(c2b.capitulos.length === 1 && c2b.capitulos[0].p.length === 3,
     'y tres frases cortas y sueltas siguen siendo tres frases, no tres capítulos',
     'ascendió frases sueltas a capítulo');
  const c2c = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Antes.\n\nCapítulo 3\n\nDespués.')}))`));
  ok(c2c.capitulos.length === 2, 'pero «Capítulo 3» sí abre capítulo',
     'no reconoció una cabecera de verdad');
  const c2d = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\n\n- ¿Y ahora qué? - dijo ella.\n- Nada - dijo él.')}))`));
  ok(c2d.capitulos[0].p.length === 2 && c2d.capitulos[0].p.every(b => b.k === 'p' && /^- /.test(b.t)),

  w.eval('vozAbrirPegar(null)');

     'y el género de la etiqueta marca su chip', 'el chip del género no se marcó: ' + d.getElementById('voz-f-genero').value);

  log('── 5. La etiqueta está en los cuatro sitios ──');
  w.eval(`_vozCuentos = [${JSON.stringify(cuentoLargo('c-largo'))}]; vozRender()`);
  await esperar(150);
  const ficha = d.querySelector('.voz-ficha');

  ok(ficha && /una máquina de prueba/.test(ficha.textContent),

  ok(/CUENTO ESCRITO POR UNA MÁQUINA/.test(plano),

     'la caja mide 0×0: lo que venga detrás no prueba nada');
  const pags1 = Number(w.eval('_vozPaginas'));

  ok(/1 \/ /.test(d.getElementById('voz-pag').textContent),
     'y el pie dice por cuál va y cuántas hay', 'el pie no dice la página');
  ok(/quedan ≈ \d+ min/.test(d.getElementById('voz-pag').textContent),
     'y cuánto falta para terminar el texto entero', 'el pie no dice cuánto falta');
  ok(/una máquina de prueba/.test(d.getElementById('voz-pag').textContent),

     '   y la portada dice el género', 'la portada no dice el género');
  /* ⚠️ Y ABRIR UN TEXTO NUEVO TIENE QUE CAER EN LA PORTADA. La portada

  ok(Number(w.eval('_vozPagina')) === 0 && Number(w.eval('_vozAncla')) === -1,
     '   y un texto nuevo se abre POR la portada, no saltándosela',
     '⚠️ abrir el texto se salta la portada (página ' + w.eval('_vozPagina') + ')');
  ok(d.querySelectorAll('#voz-barra-marcas .voz-barra-tick').length === 1,

  ok(Number(w.eval('window.__luz')) === 1,
     'y al abrir la sala se pide que la pantalla no se apague',
     'la sala no pidió el permiso de mantener la pantalla encendida');

  w.eval('vozPasar(1)');
  await esperar(400);
  ok(Number(w.eval('_vozPagina')) === 1 && hoja.scrollLeft > 10,
     'y pasar página mueve la hoja de verdad (' + Math.round(hoja.scrollLeft) + ' px)',
     'pasó de página sin mover nada: la paginación es de mentira');

  /* ⚠️ Y EL RENGLÓN EMPIEZA DONDE EMPEZABA, TAMBIÉN EN LA ÚLTIMA. Si el
     salto de página no mide exactamente lo que mide una columna, cada
     página se corre un poco: a la tercera, el texto sale cortado por la
     izquierda y asoma la columna siguiente por la derecha. Y la última
     página tenía su propio fallo: el desplazamiento se quedaba corto en
     lo que medía el margen. Se mira comparando el borde izquierdo del
     texto en la primera, en dos de en medio y en la ÚLTIMA. */
  const bordes = [];
  for (const p of [0, 1, 3, pags1 - 1]) {
    w.eval('vozIrPagina(' + p + ', true)');
    await esperar(220);
    bordes.push(margenVisible(w));
  }
  ok(bordes[0] > 0 && bordes.every(b => Math.abs(b - bordes[0]) <= 1),
     'y el texto empieza en el mismo margen en todas las páginas, la última incluida (' + bordes.join(', ') + ' px)',
     '⚠️ el texto se corre de página en página: ' + bordes.join(', ') + ' px (la última es la ' + pags1 + ')');
  const maxScroll = Number(w.eval('(function(){ const h = document.getElementById("voz-hoja"); return h.scrollWidth - h.clientWidth; })()'));
  ok(Math.abs(maxScroll - (pags1 - 1) * Number(w.eval('vozPaso()'))) <= 2,
     'y el desplazamiento llega justo hasta la última página (' + maxScroll + ' px)',
     '⚠️ el desplazamiento no cubre la última página: ' + maxScroll + ' vs ' + (pags1 - 1) * Number(w.eval('vozPaso()')));
  w.eval('vozIrPagina(1, true)');
  await esperar(200);

  log('── 7. ⚠️ AL CAMBIAR LA LETRA NO SE PIERDE EL SITIO ──');
  w.eval('vozIrPagina(3, true)');
  await esperar(250);
  const ancla1 = Number(w.eval('_vozAncla'));
  w.eval('_vozAj.tam = 30; _vozAj.alto = 2; vozAplicaAjustes(); vozPaginar(_vozAncla, _vozSub)');
  await esperar(400);
  const pags2 = Number(w.eval('_vozPaginas'));
  ok(pags2 > pags1, 'con la letra más grande hay más páginas (' + pags1 + ' → ' + pags2 + ')',
     'la letra no cambió la paginación: no se está paginando de verdad');
  /* El párrafo apuntado tiene que tener UN TROZO en la página actual:
     con la fracción, un párrafo largo que empezaba en la página de
     antes puede seguir siendo el apuntado aunque su primer renglón
     quede en la anterior. */
  const visible = w.eval(`(function(){
    const el = document.querySelector('#voz-texto [data-vp="' + ${ancla1} + '"]');
    if (!el) return 'no-esta';
    const r = vozRango(el);
    return (r.ini <= _vozPagina && _vozPagina <= r.fin) ? 'si' : ('no:' + r.ini + '-' + r.fin + ' vs ' + _vozPagina);
  })()`);
  ok(visible === 'si',
     'y la lectura sigue en el MISMO PÁRRAFO, no en el mismo número de página',
     '⚠️ se perdió el sitio al cambiar la letra (' + visible + ')');

  /* ⚠️ LA FRACCIÓN: con la letra grande, un párrafo ocupa más de una
     página. Se va a una página que está EN MEDIO de un párrafo, se
     apunta la posición y se vuelve a abrir el texto: tiene que caer en
     esa misma página, no en la del párrafo siguiente. */
  w.eval('_vozAj.tam = 34; _vozAj.alto = 2.4; _vozAj.margen = 60; vozAplicaAjustes(); vozPaginar(_vozAncla, _vozSub)');
  await esperar(400);
  const paginaMedio = w.eval(`(function(){
    const ps = document.querySelectorAll('#voz-texto [data-vp]');
    for (const p of ps) { const r = vozRango(p); if (r.fin > r.ini) return r.ini + 1; }
    return -1;
  })()`);
  ok(paginaMedio > 0, 'con letra grande hay un párrafo que ocupa más de una página (página ' + paginaMedio + ' está en medio de uno)',
     'no hay ningún párrafo partido entre páginas: la prueba de la fracción no se puede hacer');
  w.eval('vozIrPagina(' + paginaMedio + ', true)');
  await esperar(250);
  /* La fracción apunta al centro de la porción vista: en la segunda
     página de un párrafo de tres vale 0,5; en la primera, 0,167. Aquí
     estamos en la segunda página de alguno, así que tiene que ser mayor
     que la del principio. */
  const subGuardada = Number(w.eval('_vozSub'));
  const anclaMedio = Number(w.eval('_vozAncla'));
  ok(subGuardada > 0.34, 'y la posición guardada dice en qué parte del párrafo ' + anclaMedio + ' va (fracción ' + subGuardada + ')',
     'la posición no lleva fracción de verdad (' + subGuardada + '): al volver caería en el párrafo siguiente');
  w.eval('vozCerrarLector(); vozAbrirLector("c-largo")');
  await esperar(500);
  ok(Number(w.eval('_vozPagina')) === paginaMedio,
     'y al volver a abrir cae en ESA página, en mitad del párrafo (' + w.eval('_vozPagina') + ')',
     '⚠️ al volver cayó en la página ' + w.eval('_vozPagina') + ' en vez de la ' + paginaMedio);
  ok(Number(w.eval('window.__luz')) === 1,
     'y cerrar la sala soltó el permiso de la pantalla (y abrirla lo volvió a pedir)',
     'el permiso de la pantalla no se soltó al cerrar: quedan ' + w.eval('window.__luz'));
  w.eval('_vozAj.tam = 19; _vozAj.alto = 1.6; _vozAj.margen = 24; vozAplicaAjustes(); vozPaginar(_vozAncla, _vozSub)');
  await esperar(300);

  log('── 8. Los gestos y los mandos ──');
  const zonas = d.querySelector('.voz-zonas');

  ok(/pan-y/.test(ta) && /pinch-zoom/.test(ta),

  ok(w.getComputedStyle(d.getElementById('voz-z-mid')).pointerEvents === 'none',

  w.eval('vozIrPagina(1, true)');
  await esperar(200);
  const pagAntes = Number(w.eval('_vozPagina'));
  d.getElementById('voz-sig').click();
  await esperar(350);
  ok(Number(w.eval('_vozPagina')) === pagAntes + 1,

  const pagRueda = Number(w.eval('_vozPagina'));
  d.getElementById('voz-mid').dispatchEvent(new w.WheelEvent('wheel', { deltaY: 120, bubbles: true, cancelable: true }));
  await esperar(350);
  ok(Number(w.eval('_vozPagina')) === pagRueda + 1,
     'y la rueda del ratón pasa página, como en un lector de escritorio',
     'la rueda no pasa página');
  /* Un arrastre con texto seleccionado es una selección, no un paso de

  const pagSel = Number(w.eval('_vozPagina'));
  w.eval(`(function(){ const p = document.querySelector('#voz-texto .voz-p'); const r = document.createRange(); r.selectNodeContents(p); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); })()`);
  const mid = d.getElementById('voz-mid');

  mid.dispatchEvent(new w.PointerEvent('pointerup', { clientX: 120, clientY: 300, bubbles: true }));

  ok(Number(w.eval('_vozPagina')) === pagSel,
     'y un arrastre con texto seleccionado NO pasa página',
     'seleccionar una frase pasó la página');
  w.eval('window.getSelection().removeAllRanges()');
  mid.dispatchEvent(new w.PointerEvent('pointerdown', { clientX: 300, clientY: 300, bubbles: true }));
  mid.dispatchEvent(new w.PointerEvent('pointerup', { clientX: 120, clientY: 300, bubbles: true }));
  await esperar(350);
  ok(Number(w.eval('_vozPagina')) === pagSel + 1,
     'y el mismo arrastre sin selección sí la pasa',
     'el deslizamiento con punteros no pasa página');

  log('── 9. ⚠️ UN TEXTO PEGADO NO ESCRIBE HTML ──');
  const veneno = '<img src=x onerror="window.__colado=1"> y una comilla " suelta';
  w.eval(`_vozCuentos[0].capitulos = [{t: 'x', p: [{k:'p', t: ${JSON.stringify(veneno)}}, {k:'cita', t: ${JSON.stringify(veneno)}}, {k:'li', t: ${JSON.stringify(veneno)}}]}];
          _vozLeyendo = _vozCuentos[0]; _vozCapActual = 0; vozPintarCap(0, 0)`);
  await esperar(250);
  ok(!w.__colado, 'el HTML pegado no se ejecuta', '⚠️ SE EJECUTÓ HTML venido del texto pegado');
  ok(d.getElementById('voz-texto').querySelectorAll('img').length === 0,
     'y ni siquiera se crea el elemento, tampoco en citas ni listas', 'creó un <img> desde el texto pegado');
  ok(/<img src=x/.test(d.getElementById('voz-texto').textContent),
     'se lee tal cual, con sus signos', 'el texto se perdió al escaparlo');
  w.eval('vozResaltar(0, 0, "onerror")');
  await esperar(100);
  ok(!w.__colado && d.getElementById('voz-texto').querySelectorAll('img').length === 0 &&
     d.getElementById('voz-texto').querySelectorAll('mark').length >= 1,
     'y el resaltado del buscador marca la palabra sin abrir ninguna puerta',
     'el resaltado del buscador creó elementos que no debía');
  w.eval('vozCerrarLector()');
  await esperar(150);

  log('── 10. El color de la franja está CALCULADO, no solo escrito ──');
  /* El fallo del `var(--card)` y el de las franjas de El Rodaje: el HTML
     está bien, no hay error, y el color se resuelve a nada. Solo se ve
     mirando el color calculado. */
  w.eval(`_vozCuentos = [${JSON.stringify(cuentoLargo('c-largo'))}]; vozRender()`);
  await esperar(200);
  const f2 = d.querySelector('.voz-ficha'), lomo = d.querySelector('.voz-lomo');
  const franja = f2 ? w.getComputedStyle(f2).borderLeftColor : '';
  const fondoLomo = lomo ? w.getComputedStyle(lomo).backgroundColor : '';
  ok(/^rgba?\(/.test(franja) && !/rgba\(0, 0, 0, 0\)/.test(franja),
     'la franja de color de la ficha se pinta (' + franja + ')',
     'la franja se resolvió a nada: ' + franja);
  ok(fondoLomo && !/rgba\(0, 0, 0, 0\)/.test(fondoLomo),
     'y el lomo del libro tiene fondo opaco (' + fondoLomo + ')',
     'el lomo salió transparente: ' + fondoLomo);
  const et = d.querySelector('.voz-et-voz');
  ok(et && !/rgba\(0, 0, 0, 0\)/.test(w.getComputedStyle(et).backgroundColor),
     'y la etiqueta tiene fondo propio: no se confunde con el resto de la ficha',
     'la etiqueta salió sin fondo');

  log('── 11. La ayuda sale de VOZ_ETIQUETAS, no escrita a mano ──');
  w.eval('vozAbrirPegar(null); vozAbrirAyuda()');
  await esperar(200);
  const ayuda = d.getElementById('voz-ayuda-cuerpo').textContent.toLowerCase();
  const claves = JSON.parse(w.eval('JSON.stringify(Object.keys(VOZ_ETIQUETAS))'));
  const perdidas = claves.filter(c => ayuda.indexOf(c) === -1);
  ok(perdidas.length === 0,
     'la ventana enseña las ' + claves.length + ' etiquetas que el lector entiende de verdad',
     'la ayuda no nombra: ' + perdidas.join(', ') + ' (una lista a mano se queda vieja)');
  const chipsGen = [...d.querySelectorAll('#voz-genero-chips .voz-chip')].length;
  ok(chipsGen === Number(w.eval('VOZ_GENEROS.length')),
     'y los chips de género salen de VOZ_GENEROS (' + chipsGen + ')', 'los chips de género no salen de la lista: ' + chipsGen);
  d.getElementById('voz-ayuda-cerrar').click();
  w.eval('vozCerrarPegar()');
  await esperar(120);

  log('── 12. Retirar deja lápida, no borra ──');
  w.confirm = () => true;
  w.eval('vozAbrirPegar(_vozCuentos[0])');
  await esperar(150);
  await w.eval('vozRetirar()');
  await esperar(250);
  const guardados = JSON.parse(w.localStorage.getItem('faro_voz_cuentos_v1') || '[]');
  const lap = guardados.filter(c => c.cid === 'c-largo' && c.borrado === true);
  ok(lap.length === 1, 'el texto retirado se queda marcado, para que el retiro viaje',
     'borró la fila: otro aparato lo resucitaría en la siguiente sincronización');
  ok(Number(w.eval('_vozCuentos.filter(c => c.cid === "c-largo").length')) === 0,
     'y desaparece del anaquel', 'sigue en el anaquel después de retirarlo');

  log('── 15. ⚠️ LO QUE SE GUARDA LLEGA A LA NUBE, Y FIRMADO ──');
  /* La comprobación que faltaba y que costó el fallo. No basta con que
     el texto aparezca en el anaquel: eso es la copia del aparato, y se
     ve igual de bien cuando la subida rebotó. Hay que mirar lo que
     RECIBIÓ la nube. */
  base.escritas.length = 0;
  w.eval('vozAbrirPegar(null)');
  await esperar(120);
  d.getElementById('voz-pegar-txt').value = 'Una casa contaba.';
  d.getElementById('voz-f-titulo').value = 'La casa firmada';
  d.getElementById('voz-f-voz').value = 'un narrador de pueblo';
  d.getElementById('voz-f-maquina').value = 'una máquina de prueba';
  w.eval('vozPonGenero("ensayo"); vozPintarBotonGuardar()');
  await w.eval('vozGuardarPegado()');

     3. QUE UNA ZONA DE PASAR PÁGINA SE COMA LA LLAMADA. Las zonas
        cubren los bordes y van ENCIMA del texto: sin apartarlas, una
        llamada cerca del margen es intocable.
     4. QUE UNA DIRECCIÓN DE LA BIBLIOGRAFÍA ESCRIBA HTML O EJECUTE
        `javascript:`. Aquí entra texto pegado desde otra ventana y esta
        aplicación tiene dentro la Bóveda. */
  const ensayo =
    '# La deuda que no se ve\n\n' +
    'Voz: un ensayista de los setenta\nEscrito por: una máquina de prueba\nGénero: ensayo\n\n' +

  const r28 = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(ensayo)}))`));
  ok(r28.cuenta.fuentes === 4 && r28.cuenta.tablas === 1,

     'no leyó bien la bibliografía o la tabla: ' + JSON.stringify(r28.cuenta));

  /* ⚠️ LA FORMA EN QUE DE VERDAD SE PEGA UNA BIBLIOGRAFÍA: un rótulo

     capítulos en «##», ese rótulo pelado entra como SUBTÍTULO (regla

  const r28b = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\n\n## Uno\n\nLa deuda creció (Harari, 2014) y el resto lo dijo Graeber (2011).\n\n' +
    'REFERENCIAS\n\nHarari, Y. N. (2014). Sapiens. Debate.\nGraeber, D. (2011). Debt. Melville House.\n' +

  const capRef = r28b.capitulos[r28b.capitulos.length - 1];
  ok(capRef.ref === true && capRef.p.length === 3 && capRef.p.every(b => b.k === 'fuente'),

     'las entradas se juntaron en un solo bloque: ' + JSON.stringify(capRef.p.map(b => b.k + ':' + (b.t || '').slice(0, 20))));
  ok(capRef.t === 'REFERENCIAS' && r28b.capitulos.length === 2,

    return JSON.stringify({ donde: [...m.donde.keys()], huer: m.huerfanas.length }); })()`));
  ok(m28b.donde.length === 2 && m28b.huer === 0,
     'y las dos llamadas del cuerpo casan con sus entradas, sin ninguna huérfana',
     'las llamadas no casaron: ' + JSON.stringify(m28b));
  /* Y la contraria, que es la que protege el texto: una «Nota del
     autor» al PRINCIPIO es prosa, y no se parte renglón a renglón. */
  const r28c = JSON.parse(w.eval(`JSON.stringify(vozLeer(${JSON.stringify(
    'Voz: X\nMáquina: Y\n\n## Nota del autor\n\nEste ensayo se escribió de un tirón.\nNo hubo tiempo de comprobar cada dato.\n\n## Uno\n\nEmpieza aquí.')}))`));
  ok(r28c.capitulos[0].p.length === 1 && r28c.capitulos[0].p[0].k === 'p' && !r28c.capitulos[0].ref,

  const ens28 = { cid: 'c-cit', titulo: r28.titulo, genero: 'ensayo', voz: r28.voz, maquina: r28.maquina,

  w.eval(`_vozCuentos = [${JSON.stringify(ens28)}]; vozGuardaLocal();

  /* ⚠️ LA COMPROBACIÓN QUE SOSTIENE TODAS LAS DEMÁS: el texto pintado

     ![...d.querySelectorAll('#voz-panel-ind .voz-tab')].some(b => /Fuentes/.test(b.textContent)),

  w.eval(`_vozCuentos = [${JSON.stringify(ens28)}]; vozGuardaLocal(); vozRender(); vozAbrirLector('c-cit')`);

  const fig = d.querySelector('#voz-texto .voz-tabla');
  ok(fig, 'la tabla se pinta como figura', 'no se pintó la tabla');
  ok(fig && /Tabla 1/.test((fig.querySelector('.voz-tabla-tit') || {}).textContent || ''),

     'como tabla de verdad: cuatro columnas de cabecera y tres filas' + (enFichas0 ? ' (aquí salió en fichas por lo estrecho de la caja)' : ''),

  [...fig2.querySelectorAll('.voz-tabla-b')].find(b => /entera/.test(b.textContent)).click();

  const tablon = d.getElementById('voz-tablon');

  log('── 34. EL ANAQUEL A LA MANERA DE PLAY LIBROS: una barra, una hoja y elegir varios ──');

  const base34 = nuevaBase(w, {});

       vozGuardaAnaquel(); _vozFiltroEst = ''; _vozFiltroGen = ''; _vozFiltroVoz = ''; _vozBusca = ''; vozRender()`);

  /* ⚠️ «Una fila» NO se mide por el `top` de cada hijo. Con

     empiezan a alturas distintas, y contar tops diría dos renglones
     donde hay uno: la sonda suspendería por su propia medida. Lo que de
     verdad dice que van en fila es que todos SE CRUZAN en vertical. */
  const r0 = hijos34[0].getBoundingClientRect();
  const enFila = hijos34.every(x => { const r = x.getBoundingClientRect(); return r.top < r0.bottom && r.bottom > r0.top; });
  ok(hijos34.length === 4 && enFila,
     '⚠️ la barra del anaquel es UNA sola fila: las vistas y tres botones (' + hijos34.length + ' cosas, todas en el mismo renglón)',

  ok(herr.getBoundingClientRect().height < 60,
     'y mide menos de 60 px de alto, que es lo que se ahorró de las cinco filas de chips de antes',
     'la barra mide ' + Math.round(herr.getBoundingClientRect().height) + ' px de alto');
  ok(d.getElementById('voz-filtro-puesto').hidden,
     'y sin ningún filtro puesto no se enseña ninguna fila de filtros: lo puesto se ve, lo demás se abre',
     'la fila de filtros sale aunque no haya ninguno puesto');
  /* ⚠️ Y LOS TRES BOTONES CABEN ENTEROS DENTRO DE LA BARRA. Esto se
     cazó mirando una foto y no leyendo el código: la barra se desliza,
     y con las vistas delante ☑ Elegir —que es la mitad de lo que se
     pidió— caía fuera del borde derecho en TODOS los teléfonos. No daba
     error, la barra era de una fila y el HTML estaba bien; solo que la
     función no se veía. Se mide en píxeles, como el color calculado. */
  const rHerr = herr.getBoundingClientRect();
  const fuera = [...herr.querySelectorAll('.voz-herr-btn')]
    .filter(x => { const r = x.getBoundingClientRect(); return r.right > rHerr.right + 1 || r.left < rHerr.left - 1; })
    .map(x => x.textContent.trim());
  ok(fuera.length === 0,
     '⚠️ y los tres botones —🗂 Estantes, ⇅ Orden y ☑ Elegir— caben ENTEROS en la barra de un teléfono: lo que asoma por la derecha es el cambio de vista, que se toca una vez al mes',
     '⚠️ un botón de la barra se sale del borde y no se ve: ' + JSON.stringify(fuera));
  const topBarra = herr.getBoundingClientRect().bottom;
  const topPrimero = d.querySelector('#voz-lista .voz-fila').getBoundingClientRect().top;
  ok(topPrimero - topBarra < 120,
     'y el primer texto empieza a menos de 120 px de la barra (' + Math.round(topPrimero - topBarra) + ' px): antes había media pantalla de mandos por delante',
     'todavía hay ' + Math.round(topPrimero - topBarra) + ' px de mandos antes del primer texto');

  /* ── La hoja: en vertical, un renglón por estante, y de 44 px ── */
  abreHoja(d, 'Estantes');
  await esperar(250);
  const filas34 = [...d.querySelectorAll('#voz-anaq-cuerpo .voz-hoja-fila')];

  ok(filasHoja(d).indexOf('Todos los textos 4') === 0,
     'y arriba del todo, «Todos los textos» con su cuenta', 'la hoja no empieza por «Todos los textos»: ' + JSON.stringify(filasHoja(d)));

  botElegir.click();

  /* Se PULSAN los textos, no se llama a vozSelAlterna. */

  filasSel[1].click();
  filasSel[3].click();   // este es de otra persona

  ok(filasSel[0].classList.contains('voz-elegido') && filasSel[1].classList.contains('voz-elegido'),

  ok(!d.getElementById('voz-menu-overlay') || d.getElementById('voz-menu-overlay').style.display === 'none',

  const tras34 = JSON.parse(w.eval(`JSON.stringify(_vozCuentos.map(c => c.cid + ':' + vozEstantesDe(c).join('+')))`));
  ok(tras34.indexOf('m1:Para la tesis') > -1 && tras34.indexOf('m2:Para la tesis') > -1,

  ok(filaTesis && filaTesis.getAttribute('aria-pressed') === 'true',

  filaTesis.click();
  await esperar(400);
  const tras34b = JSON.parse(w.eval(`JSON.stringify(_vozCuentos.map(c => c.cid + ':' + vozEstantesDe(c).join('+')))`));
  ok(tras34b.indexOf('m1:') > -1 && tras34b.indexOf('m2:') > -1,

  await esperar(100);
  [...d.querySelectorAll('#voz-sel-barra .voz-btn')].find(x => /Salir/.test(x.textContent)).click();
  await esperar(300);
  ok(d.getElementById('voz-sel-barra').hidden && !d.querySelector('#voz-lista .voz-elegible'),
     'y «Salir» devuelve el anaquel de siempre', 'no se sale de elegir');
  const trasSalir = d.querySelectorAll('#voz-lista [data-voz-cid]').length;
  filasSel[0] && d.querySelectorAll('#voz-lista [data-voz-cid]')[0].click();
  await esperar(250);
  ok(trasSalir === 4 && d.getElementById('voz-lector').style.display !== 'none',
     'y fuera de elegir, tocar un texto vuelve a abrirlo para leer', 'fuera de elegir, tocar un texto ya no lo abre');
  w.eval('vozCerrarLector()');
  await esperar(200);

  log('── 35. QUE F.A.R.O ABRA AQUÍ, Y SOLO EN ESTE APARATO ──');
  /* Pedido por el autor el 12 de septiembre de 2026: «que al abrir F.A.R.O
     sea lo primero que se presente, tal como está Finanzas, pero que solo
     se active en el dispositivo que uno desee».

     Lo que puede salir mal aquí no es que el interruptor no guarde: es que
     secuestre una notificación del chat, que la preferencia viaje a la nube
     y le cambie la pantalla de entrada a otro de la casa, o que con las dos
     herramientas encendidas una abra encima de la otra. Las tres se miden. */
  const base35 = nuevaBase(w, {});
  w.eval(`_vozCuentos = []; vozGuardaLocal(); localStorage.removeItem('faro.voz.abre_aqui');
          localStorage.removeItem('faro.fin.apunte.fijo'); vozRender()`);
  await esperar(250);

  const swAbre = d.getElementById('voz-abre-aqui');
  ok(!!swAbre && swAbre.getAttribute('role') === 'switch' && swAbre.getAttribute('aria-checked') === 'false',
     'el anaquel trae su interruptor, apagado de fábrica: es un interruptor, no el modo por defecto',
     'no está el interruptor de abrir aquí');
  const subApagado = d.getElementById('voz-abre-aqui-sub').textContent;
  ok(swAbre.getBoundingClientRect().height >= 50 && swAbre.getBoundingClientRect().width > 200,
     'y la fila ENTERA es el botón: una bolita de 26 px se falla con el dedo y esto se toca una vez en la vida',
     'el interruptor no es una fila entera: ' + Math.round(swAbre.getBoundingClientRect().width) + '×' + Math.round(swAbre.getBoundingClientRect().height));
  const yLista = d.getElementById('voz-lista').getBoundingClientRect().top;
  ok(swAbre.getBoundingClientRect().top > yLista,
     '⚠️ y va AL PIE, debajo de los textos: lo que se decide una vez no puede volver a ocupar la cabecera del anaquel (regla 33)',
     '⚠️ el interruptor se puso por encima de los textos');
  /* ⚠️ Y EL BOTÓN FLOTANTE DE DESTELLOS NO LO TAPA. Es la tercera vez en
     el mismo día que ese botón se come algo: vive fijo en la esquina de
     abajo a la derecha y esta fila es lo último del anaquel, o sea que
     cae justo ahí — se veía en la foto tapando el final de la frase que
     explica lo que hace el interruptor. Se mide con el anaquel al tope
     del desplazamiento, que es el caso peor. */
  const cajaSc = d.querySelector('#view-voz .view-scroll') || d.scrollingElement;
  if (cajaSc) cajaSc.scrollTop = cajaSc.scrollHeight;
  await esperar(250);
  const rSw = d.getElementById('voz-abre-aqui').getBoundingClientRect();
  const fabSw = d.querySelector('.destello-fab');
  const rFab = fabSw ? fabSw.getBoundingClientRect() : null;
  ok(!rFab || !(rSw.right > rFab.left && rSw.left < rFab.right && rSw.bottom > rFab.top && rSw.top < rFab.bottom),
     '⚠️ y el botón flotante de Destellos no lo tapa ni con el anaquel hasta abajo: cae justo en esa esquina',
     '⚠️ el botón flotante se come el interruptor y la frase que lo explica');

  /* Se PULSA, como se pulsa. */
  const antes35 = base35.escritas.length;
  swAbre.click();
  await esperar(250);
  ok(w.localStorage.getItem('faro.voz.abre_aqui') === '1' && swAbre.getAttribute('aria-checked') === 'true',
     'un toque lo enciende y queda guardado en el APARATO', 'el interruptor no guardó nada');
  ok(d.getElementById('voz-abre-aqui-sub').textContent !== subApagado,
     'y dice con palabras lo que va a pasar EN LAS DOS posiciones: con un solo rótulo hay que encenderlo para saber qué hace',
     'el interruptor dice lo mismo encendido que apagado');
  ok(base35.escritas.slice(antes35).length === 0 && base35.llamadas.filter(l => l.m !== 'GET').length === 0,
     '⚠️ y NO viaja a la nube: encenderlo en este aparato no puede cambiarle la pantalla de entrada a otro de la casa',
     '⚠️ la preferencia de arranque escribió en la nube: ' + JSON.stringify(base35.escritas.slice(antes35)));

  /* El arranque de verdad: el MISMO árbitro que llama js/auth.js. */
  w.eval('switchView("view-inicio")');
  await esperar(150);
  ok(w.eval('typeof faroArranqueInicio') === 'function',
     'y el reparto del arranque tiene nombre propio, para poder llamar a ESTE y no a una copia suya',
     'no existe faroArranqueInicio: la sonda estaría probando un doble');
  const abrio = w.eval('faroArranqueInicio()');
  await esperar(300);
  ok(abrio === 'voz' && d.getElementById('view-voz').classList.contains('active'),
     'al abrir la aplicación, F.A.R.O entra en La Voz Prestada', 'el arranque no abre el anaquel: ' + abrio);

  /* ⚠️ Una notificación del chat manda SIEMPRE. */
  w.eval('switchView("view-inicio")');
  await esperar(150);
  const busca35 = w.location.search;
  w.history.replaceState(null, '', w.location.pathname + '?view=chat');
  const abrio2 = w.eval('faroArranqueInicio()');
  await esperar(250);
  ok(abrio2 !== 'voz' && !d.getElementById('view-voz').classList.contains('active'),
     '⚠️ pero con ?view= en la dirección NO se lleva la pantalla: quien toca la notificación de un mensaje quiere el mensaje',
     '⚠️ el arranque secuestró una notificación del chat');
  w.history.replaceState(null, '', w.location.pathname + busca35);

  /* ⚠️ Con las DOS encendidas, una sola se queda la pantalla. */
  w.eval(`localStorage.setItem('faro.fin.apunte.fijo', '1'); switchView("view-inicio")`);
  await esperar(150);
  const abrio3 = w.eval('faroArranqueInicio()');
  await esperar(400);
  const hojaFin = d.getElementById('fin-q-overlay');
  ok(abrio3 === 'voz' && d.getElementById('view-voz').classList.contains('active'),
     'con el Apunte rápido TAMBIÉN fijado, la lectura se queda la pantalla —es la que cambia de vista—',
     'con las dos encendidas no abrió el anaquel: ' + abrio3);
  ok(!hojaFin || hojaFin.style.display === 'none',
     '⚠️ y la hoja de los gastos NO se planta encima: apilada, aparecería al cerrar la de arriba, que es el peor momento posible',
     '⚠️ las dos se abrieron a la vez, una encima de la otra');
  w.eval(`localStorage.removeItem('faro.fin.apunte.fijo')`);

  /* ⚠️ Y volver a la aplicación NO cambia de pantalla. */
  w.eval('switchView("view-chat")');
  await esperar(150);
  d.dispatchEvent(new w.Event('visibilitychange'));
  await esperar(300);
  ok(!d.getElementById('view-voz').classList.contains('active'),
     '⚠️ y volver a la aplicación no se lleva por delante lo que estabas haciendo: esto pasa SOLO al abrir',
     '⚠️ volver de otra aplicación cambió la pantalla al anaquel');

  /* Y se apaga. */
  w.eval('switchView("view-voz"); vozRender()');
  await esperar(300);
  d.getElementById('voz-abre-aqui').click();
  await esperar(200);
  ok(!w.localStorage.getItem('faro.voz.abre_aqui'),
     'apagarlo borra la preferencia', 'la preferencia sigue guardada');
  w.eval('switchView("view-inicio")');
  await esperar(150);
  const abrio4 = w.eval('faroArranqueInicio()');
  await esperar(250);
  ok(abrio4 !== 'voz' && !d.getElementById('view-voz').classList.contains('active'),
     'y apagado, F.A.R.O vuelve a abrir donde abría', 'apagado sigue abriendo el anaquel');
  w.eval('switchView("view-voz")');
  await esperar(250);

  log('── 13. Con la base vieja no revienta: dice qué falta ──');
  /* ⚠️ Estas últimas se hacen en EL MISMO marco, cambiándole la base de
     mentira y volviendo a arrancar la herramienta, y no abriendo un
     segundo index.html. Un segundo marco del mismo origen se queda
     colgado en este entorno y la sonda no llega nunca a poner su
     veredicto en el título — y una sonda sin veredicto no es media
     sonda: es ninguna, porque en tanda solo se lee el título. */
  nuevaBase(w, { sinTabla: true });
  await w.eval('initVozPrestada()');
  await esperar(400);
  const nube = d.getElementById('voz-nube').textContent;
  ok(/voz_prestada\.sql/.test(nube),
     'nombra el archivo que hay que correr (desde una tableta no se adivina)',
     'no dice qué archivo falta: ' + nube);
  ok(/aparato/i.test(nube),
     'y dice que por ahora solo vive en este aparato, en vez de fingir que viaja',
     'no avisa de que no viaja');

  log('── 17. ⚠️ LA BASE DEL ESTRENO, SIN LA COLUMNA genero, NO ES «SIN SEÑAL» ──');
  /* La tabla se creó el 10 de septiembre sin `genero`. Con el archivo
     nuevo sin volver a correr, PostgREST rebota la consulta entera:
     eso NO es un corte de red ni «falta el SQL». La herramienta tiene
     que volver a pedir sin la columna, seguir funcionando y decir qué
     hay que volver a correr — y NO mandar la columna al guardar, que
     también rebotaría. */
  const baseVieja = nuevaBase(w, { sinGenero: true, filas: [Object.assign(cuentoLargo('c-nube'), { puesto_por: VOZ_UID })] });
  w.eval('_vozCuentos = []; _vozHayTabla = true; _vozNubeVieja = false');
  await w.eval('initVozPrestada()');
  await esperar(500);
  ok(Number(w.eval('_vozCuentos.filter(c => c.cid === "c-nube").length')) === 1,
     'con la base vieja, los textos de la nube SÍ llegan (se vuelve a pedir sin la columna)',
     '⚠️ con la base vieja no llegó nada: ' + w.eval('_vozEstadoNube'));
  const nubeVieja = d.getElementById('voz-nube').textContent;
  ok(/vieja/i.test(nubeVieja) && /voz_prestada\.sql/.test(nubeVieja),
     'y la barra dice que la base va vieja y qué archivo volver a correr',
     'la barra no explica la base vieja: ' + nubeVieja);
  ok(!/se[ñn]al/i.test(nubeVieja), 'sin confundirlo con un corte de señal', 'lo dice como señal: ' + nubeVieja);
  baseVieja.escritas.length = 0;
  w.eval('vozAbrirPegar(null)');
  await esperar(120);
  d.getElementById('voz-pegar-txt').value = 'Una casa contaba.';
  d.getElementById('voz-f-titulo').value = 'La casa en la base vieja';
  d.getElementById('voz-f-voz').value = 'un narrador de pueblo';
  d.getElementById('voz-f-maquina').value = 'una máquina de prueba';
  w.eval('vozPintarBotonGuardar()');
  await w.eval('vozGuardarPegado()');
  await esperar(400);
  const subidaVieja = baseVieja.escritas.find(x => x.titulo === 'La casa en la base vieja');
  ok(!!subidaVieja && !('genero' in subidaVieja),
     'y lo que se guarda sube SIN la columna que la base no tiene, así que entra',
     '⚠️ con la base vieja el guardado ' + (subidaVieja ? 'mandó la columna genero y rebotaría' : 'no llegó a la nube'));

  log('── 14. ⚠️ UN CORTE DE RED NO VACÍA EL ANAQUEL ──');
  /* Lección 14 de El Rodaje: si un corte dejara el anaquel en cero, la
     pantalla diría «no hay textos» con un botón que invita a PEGAR, y
     el camino natural después de una mala señal sería pegar encima los
     que ya estaban. */
  w.eval(`_vozCuentos = [${JSON.stringify(cuentoLargo('c-red'))}]; _vozNubeVieja = false; vozRender()`);
  nuevaBase(w, { sinSenal: true });
  /* Con reloj: si algún día una petición caída dejara la herramienta
     esperando para siempre, la sonda tiene que DECIRLO, no colgarse.
     Una sonda colgada no pone veredicto en el título, y en tanda solo se
     lee el título: se leería igual que una sonda que nadie corrió. */
  const r14 = await Promise.race([
    w.eval('initVozPrestada().then(function(){return "ok"},function(e){return "revento: "+e.message})'),
    esperar(11000).then(() => 'SE QUEDÓ ESPERANDO'),
  ]);
  ok(r14 === 'ok', 'la herramienta vuelve de una petición caída (' + r14 + ')',
     'con la señal caída la herramienta se queda colgada: ' + r14);
  await esperar(400);
  ok(Number(w.eval('_vozCuentos.length')) === 1,
     'con la señal caída, lo que ya estaba se queda',
     '⚠️ un corte de red dejó el anaquel vacío');
  const nube2 = d.getElementById('voz-nube').textContent;
  ok(/se[ñn]al/i.test(nube2),
     'y lo dice como señal, no como «falta el SQL»',
     'confunde un corte de red con una tabla que falta: ' + nube2);
  ok(!/voz_prestada\.sql/.test(nube2),
     'y no manda a pegar trescientas líneas de SQL en una base que ya las tiene',
     'con la señal caída manda a correr el SQL otra vez');

  log('');
  log(fallos === 0 ? 'RESULTADO: APRUEBA' : `RESULTADO: SUSPENDE · ${fallos} fallo(s)`);
  document.title = (fallos === 0 ? 'APRUEBA' : 'SUSPENDE') + ' · La Voz Prestada';
})().catch(e => {
  log('✘ la sonda reventó: ' + (e && e.message) + '\n' + (e && e.stack));
  log('RESULTADO: SUSPENDE');
  document.title = 'SUSPENDE · La Voz Prestada';
});
</script>
