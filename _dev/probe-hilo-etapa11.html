<script>
/* Comprueba la etapa 11 de la Ruta del Hilo que Tira (Storytelling): contar
   de pie y contar en imagen, la tercera y última puerta, hacia la Ruta de la
   Cámara que Cuenta. Bancos, laboratorio, los ocho casos, el guion, las seis
   lecturas con sus preguntas dentro, el marcador, la impresión, la ficha, la
   materia y la ruta en el mapa.

   Las reglas propias de la materia que aquí se vigilan con más saña:
     1. NINGUNA HERRAMIENTA SIN AUTOR Y AÑO. Cada herramienta que la etapa
        menciona (Quintiliano hacia 95 d.C., Parry y Lord 1960, Ong 1982,
        Kuleshov hacia 1920, Eisenstein hacia 1929, Balázs 1924) va con su
        año, en las cinco secciones de prosa. Quintiliano es la ÚNICA fuente
        de la Ruta del Hilo que Tira anterior a Cristo, así que el regex de
        años se EXTIENDE aquí para aceptar también «d.C.» o «siglo I», sin
        dejar de exigir el año a las demás (19xx o comienzos de los 2000).
     2. LA GRIETA A LA VISTA: (a) contar de pie no es leer en voz alta, (b)
        contar en imagen no es filmar lo que dirías (la imagen sustituye, el
        montaje significa). Las dos son la misma trampa: copiar en vez de
        rehacer.
     3. CONTAR SIN LA PÁGINA (tres casillas: de pie, en imagen, qué no se
        copia) es la herramienta reutilizable de la etapa.
     4. LA PUERTA A LA RUTA DE LA CÁMARA QUE CUENTA tiene que estar
        declarada a la vista: esta es la TERCERA y ÚLTIMA puerta del Hilo.
     5. CUIDADO ESPECIAL: Béla BALÁZS (teórico húngaro del cine mudo) NO es
        André BAZIN (el crítico francés de la etapa 4, aquí solo citado en
        tercera persona dentro de la entrevista). Son personas distintas.

   La comprobación de herramientas mira las cinco secciones de PROSA
   (Aprende, Estructura, Casos, Guion y Lecturas), no la página entera: los
   bancos pintan rótulos que son fichas de juego (es la trampa 1 de la
   norma 5-nonies).

   El guion largo se busca con su escape de código (u2014), nunca con el
   caracter puesto directo en este archivo: una sonda que lo llevara dentro
   se suspendería sola, siendo ella misma la primera en incumplir la regla
   que revisa.

   El resto de la etapa 10 (Wolfe, Capote, Lejeune, Malcolm, Cooke, Frey,
   Jimmy, no ficción, Chaves Nogales, reordenar) y de etapas más viejas se
   busca con límites de palabra que no disparen con palabras legítimas de
   esta etapa. */
const RAYA = new RegExp('\\u2014');
const RAYAS_G = new RegExp('\\u2014', 'g');
const RE_ANY_YEAR = /\b(1[5-9]\d\d|19\d\d|20[0-2]\d)\b|\bhacia el a[ñn]o 95\b|\bd\.?\s*C\.?\b|\bsiglo I\b/i;
const RE_RESTOS_10 = /\bWolfe\b|\bCapote\b|\bLejeune\b|\bMalcolm\b|\bCooke\b|\bFrey\b|\bJimmy\b|no ficci[óo]n|\bChaves Nogales\b|\breordenar\b/i;
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda hilo etapa 11'; };
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Hilo que Tira · Etapa 11 de 12/.test(d.body.textContent), 'se presenta como etapa 11 de 12', 'no se presenta como etapa 11 de la ruta');
    const cuerpo = d.body.textContent.replace(/\s+/g, ' ');
    ok(!RE_RESTOS_10.test(cuerpo), 'sin restos de temario de la etapa 10 (Wolfe, Capote, Lejeune, Malcolm, Cooke, Frey, Jimmy, no ficción, Chaves Nogales, reordenar)', 'queda temario de la etapa 10 en la página');
    ok(!/focalizaci[óo]n|narrador no fiable|autor impl[íi]cito|\bBooth\b|\bStanzel\b|\bBally\b|Cide Hamete|Mart[íi]n Gaite|Lubbock|Le Guin|Gardner|Ch[ée]jov|Delibes|mostrar,? no cuentes|vidrio de botella|el dial de mostrar y contar|Mamet|Goldman|no-acontecimiento|escena francesa|plano secuencia|Freytag|Vonnegut|kish[oō]tenketsu|Ar[áa]uz|Bracamonte|Campbell|monomito|Todorov|Hitchcock|Truffaut|Baldwin|O'Connor|Sontag|catarsis|sentimentalismo|oxitocina|S[áa]nchez Ferlosio|la cuenta de la emoci[óo]n|Bernays|Unamuno|Sunstein|Brehm|Slater|Rouner|Fisher|reactancia|freno [ée]tico|ethos|pathos|(?<![a-záéíóúñA-ZÁÉÍÓÚÑ])logos\b|Anzuelo/i.test(cuerpo),
       'sin restos de temario de otras rutas o etapas más viejas', 'queda temario de otra misión en la página');
    ok(!RAYA.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(RAYAS_G) || []).length + ' guiones largos');
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content;
    ok(/CONTAR DE PIE Y EN IMAGEN/.test(banda) && /KULESHOV/i.test(banda) && /QUINTILIANO/i.test(banda) && !/WOLFE/i.test(banda) && !/LA HISTORIA DE VERDAD/.test(banda) && !/LA HISTORIA QUE PERSUADE/.test(banda) && !/EMOCI[ÓO]N SIN CHANTAJE/.test(banda) && !/TIEMPO DEL RELATO/.test(banda) && !/VOZ Y EL PUNTO DE VISTA/.test(banda) && !/MOSTRAR/.test(banda) && !/LA ESCENA/.test(banda) && !/FORMA DE LAS FORMAS/.test(banda) && !/EL DESEO/.test(banda) && !/LA CADENA/.test(banda),
       'la banda del encabezado es de esta etapa (CONTAR DE PIE Y EN IMAGEN, KULESHOV y QUINTILIANO, sin restos de otras etapas)', 'la banda dice: ' + banda.slice(0, 70));
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);
    ok(d.querySelectorAll('#timelineTrack .tl-node').length === dentro('timelineData.length'),
       'y la línea de tiempo arrancó con sus ' + dentro('timelineData.length') + ' fechas', 'hitos pintados: ' + d.querySelectorAll('#timelineTrack .tl-node').length);
    ok((d.getElementById('lab-display').textContent || '').trim().length > 40, 'el laboratorio arrancó con una ficha puesta', 'el laboratorio arrancó vacío');

    log('\n── LA REGLA DE ORO: NINGUNA HERRAMIENTA SIN AUTOR Y AÑO ──');
    const prosa11 = ['s-aprende', 's-estructura', 's-casos', 's-guion', 's-lecturas']
      .map(id => (d.getElementById(id) || {}).textContent || '').join(' ').replace(/\s+/g, ' ');
    const bloquesProsa = [...d.querySelectorAll('#s-aprende .card, #s-estructura .card, #s-casos .card, #s-guion .card, #s-lecturas .card')]
      .filter(c => !c.querySelector('#timelineTrack') && !c.querySelector('.type-grid') && !c.querySelector('.stat-bar'));
    let huerfanas = 0, herramientas = 0, ejemplo = '';
    const reHer = /la actio|la composici[óo]n oral|la oralidad|el efecto kuleshov|el montaje de choque|el primer plano/gi;
    bloquesProsa.forEach(card => {
      const txt = card.textContent.replace(/\s+/g, ' ');
      if (reHer.test(txt)) {
        reHer.lastIndex = 0;
        herramientas++;
        if (!RE_ANY_YEAR.test(txt)) { huerfanas++; if (!ejemplo) ejemplo = (card.querySelector('h2') || {}).textContent || txt.slice(0, 80); }
      }
    });
    ok(huerfanas === 0, 'toda herramienta que asoma (en ' + herramientas + ' bloque(s)) lleva su año en ese mismo bloque', 'hay ' + huerfanas + ' bloque(s) con herramienta huérfana: ' + ejemplo);
    ok(/Quintiliano/.test(prosa11) && /(95|d\.?\s*C\.?|siglo I)/i.test(prosa11), 'la actio a Quintiliano (hacia el 95 d.C.)', 'falta Quintiliano (hacia el 95 d.C.)');
    ok(/(Parry|Lord)/.test(prosa11) && /1960/.test(prosa11), 'la composición oral a Parry y Lord (1960)', 'falta Parry y Lord (1960)');
    ok(/Ong/.test(prosa11) && /1982/.test(prosa11), 'la oralidad a Ong (1982)', 'falta Ong (1982)');
    ok(/Kuleshov/.test(prosa11) && /(1918|1920|192)/.test(prosa11), 'el efecto Kuleshov (hacia 1920)', 'falta Kuleshov (hacia 1920)');
    ok(/Eisenstein/.test(prosa11) && /(1925|1928|1929|192)/.test(prosa11), 'el montaje de choque a Eisenstein (hacia 1929)', 'falta Eisenstein (hacia 1929)');
    ok(/Bal[áa]zs/.test(prosa11) && /1924/.test(prosa11), 'el primer plano a Balázs (1924)', 'falta Balázs (1924)');
    ok(/Rubin/.test(prosa11) && /1995/.test(prosa11), 'la memoria oral a Rubin (1995)', 'falta Rubin (1995) en el ensayo');
    ok(/Paivio/.test(prosa11) && /1973/.test(prosa11), 'y la superioridad de la imagen a Paivio y Csapo (1973)', 'falta Paivio y Csapo (1973) en el ensayo');
    ok(/ninguna herramienta se cita sin autor|autor, a[ñn]o y l[íi]mite|con su autor y su a[ñn]o|autor y (su )?año/i.test(cuerpo),
       'la regla de oro está escrita a la vista', 'la regla de oro de la ruta no aparece');

    log('\n── LA GRIETA A LA VISTA ──');
    ok(/contar de pie/i.test(cuerpo) && /contar en imagen/i.test(cuerpo), 'se declaran contar de pie y contar en imagen', 'no se declaran los dos modos de esta etapa');
    ok(/leer.{0,40}en voz alta/i.test(cuerpo) && /(no lo es|no es contar de pie)/i.test(cuerpo), 'que contar de pie no es leer en voz alta', 'no se desarma la confusión de leer en voz alta');
    ok(/(filmar lo que dir[íi]as|ilustrar la frase)/i.test(cuerpo) && /sustituye/i.test(cuerpo), 'que contar en imagen no es ilustrar la frase (la imagen sustituye)', 'no se desarma la confusión de ilustrar la frase');
    ok(/el montaje (que )?significa|el significado nace del corte/i.test(cuerpo), 'y que el montaje significa (el corte, no el plano solo)', 'no se declara que el montaje significa');
    ok(/se REHACE|rehacer/i.test(cuerpo) && /no se copia/i.test(cuerpo), 'y se declara que lo escrito se rehace, no se copia', 'no se distingue rehacer de copiar');

    log('\n── LA PUERTA A LA CÁMARA QUE CUENTA ──');
    ok(/C[áa]mara que Cuenta/i.test(cuerpo), 'la etapa se declara puerta a la Ruta de la Cámara que Cuenta', 'no se menciona la Ruta de la Cámara que Cuenta');
    ok(/puerta/i.test(cuerpo), 'con la palabra «puerta» a la vista', 'no se usa la palabra puerta');

    log('\n── EL CONCEPTO DE LA ETAPA ──');
    ok(/qu[ée] de pie/i.test(cuerpo) && /qu[ée] en imagen/i.test(cuerpo) && /(no se copia|NO inventé|no inventar)/i.test(cuerpo),
       'contar sin la página (¿qué de pie?, ¿qué en imagen?, ¿qué no se copia?)', 'falta contar sin la página');
    ok(/contar sin la p[áa]gina/i.test(cuerpo), 'y se nombra como herramienta reutilizable', 'no se nombra contar sin la página como herramienta');
    ok(/microfisonom[íi]a/i.test(cuerpo), 'la microfisonomía del primer plano', 'falta la microfisonomía');
    ok(/montaje de choque|montaje intelectual/i.test(cuerpo), 'el montaje de choque o intelectual', 'falta el montaje de choque');
    ok(/lempira/i.test(cuerpo) || /L \d/.test(cuerpo), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');
    ok(/(Prince y Hensley|estatus mixto)/i.test(cuerpo) && /1992/.test(cuerpo), 'el estatus mixto del efecto Kuleshov, con la réplica de Prince y Hensley (1992)', 'falta el cuidado con la réplica del efecto Kuleshov');
    ok(!/Bal[áa]zs.{0,25}(Bazin|cr[íi]tico franc[ée]s)/i.test(cuerpo) && !/Bazin.{0,25}h[úu]ngaro/i.test(cuerpo), 'y no se confunde a Balázs con Bazin', 'Balázs aparece confundido con Bazin');

    log('\n── LOS OCHO CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos').textContent.replace(/\s+/g, ' ');
    ok((casos.match(/Caso \d/g) || []).length === 8, 'los ocho casos están', 'casos: ' + (casos.match(/Caso \d/g) || []).length);
    ok(/M\.E\.T\.A\.S/.test(casos), 'y salen de este proyecto', 'los casos no hablan del proyecto');
    ok(/L \d|lempira/i.test(casos), 'con sus cifras en lempiras', 'los casos van sin lempiras');
    ok(/qu[ée] de pie|qu[ée] en imagen/i.test(casos), 'cada caso aplica contar sin la página', 'los casos no aplican la herramienta');
    ok(/la pregunta que decide/i.test(casos) && /la condici[óo]n/i.test(casos), 'cada caso termina en la pregunta que decide y su condición', 'los casos no cierran como manda la norma 3');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const g = d.getElementById('s-guion').textContent.replace(/\s+/g, ' ');
    ok((g.match(/Escena \d/g) || []).length === 7, 'las siete escenas', 'escenas: ' + (g.match(/Escena \d/g) || []).length);
    ok(/VOZ/.test(g) && /IMAGEN:/.test(g) && /TEXTO EN PANTALLA:/.test(g), 'cada escena lleva VOZ, IMAGEN y TEXTO', 'faltan las tres pistas');
    ok(/gancho en fr[íi]o/i.test(g), 'el gancho en frío', 'falta el gancho');
    ok(/Kuleshov/.test(g) && /1920/.test(g), 'con el gancho del efecto Kuleshov, fechado hacia 1920', 'falta el ejemplo fechado de Kuleshov, hacia 1920');
    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');
    ok(/Contar de pie y contar en imagen/i.test(g) && /Ruta del Hilo que Tira/.test(g), 'y el cierre nombra la misión', 'el cierre no nombra la misión');
    ok(/C[áa]mara que Cuenta/i.test(g), 'y el cierre nombra la puerta a la Cámara que Cuenta', 'el cierre no nombra la puerta');

    log('\n── LAS SEIS LECTURAS (normas 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    const tl = lect.textContent.replace(/\s+/g, ' ');
    const claves = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
    ok(claves.every(k => !!d.getElementById('lect-' + k)), 'las seis tarjetas están, con sus ids',
       'faltan: ' + claves.filter(k => !d.getElementById('lect-' + k)).join(', '));
    ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'y no hay ninguna de más',
       'tarjetas: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
    ok(claves.every(k => !!d.querySelector('#lect-' + k + ' .lect-nota')), 'cada una con su nota de estatus', 'alguna tarjeta va sin lect-nota');
    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
       'y avisa de las preguntas de cada lectura y del plegado', 'la entrada no explica las preguntas ni el plegado');
    ok(/ejercicios? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl),
       'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
    ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis en el mismo saco');
    ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
    ok(/papeles/i.test(tl) && /no personas/i.test(tl), 'y dice que el careo firma con papeles', 'la etiqueta no dice cómo firma sus turnos el careo');
    ok(/nunca ocurrieron/i.test(tl), 'y que los encuentros de las entrevistas nunca ocurrieron', 'falta la declaración de ficción');
    ok((/Kuleshov/.test(tl) && /1920/.test(tl)) || (/Bal[áa]zs/.test(tl) && /1924/.test(tl)), 'la sección repite el aviso de la materia con su ejemplo', 'la sección de lecturas no repite el aviso de la materia');
    ok(/El que solo sab[íi]a la historia al contarla/.test(tl), 'el cuento a la manera de Borges', 'falta el cuento');
    ok(/Onofre Salviati/.test(tl) && /(Escamilla|Pumariega)/.test(tl), 'el capítulo cervantino, con sus personajes de posada', 'falta el capítulo');
    ok(/La especie que cont[óo] de pie antes de escribir/.test(tl), 'el ensayo a la manera de Harari', 'falta el ensayo');
    ok(/Soler Serrano/.test(tl) && /A fondo/.test(tl), 'la entrevista, con las señas reales del entrevistador', 'la entrevista no declara quién es Soler Serrano');
    ok(/Quintero/.test(tl) && /Fern[áa]n G[óo]mez/.test(tl) && /Loco de la Colina/i.test(tl), 'la conversación del Loco de la Colina', 'falta la conversación');

    log('\n── LA ENTREVISTA IMAGINADA CON EISENSTEIN, Y SU CONCESIÓN ──');
    const entr = d.getElementById('lect-entrevista');
    const nEntr = (entr.querySelector('.lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nEntr), 'la entrevista se declara IMAGINADA, en mayúsculas y a la vista', 'la entrevista no se declara imaginada');
    ok(/nunca ocurri/i.test(nEntr) && /1898/.test(nEntr) && /1948/.test(nEntr),
       'y da las fechas reales de Eisenstein (1898 · 1948)', 'no da las fechas reales de Eisenstein');
    ok(/invenci[óo]n de la casa/i.test(nEntr), 'y declara que las palabras atribuidas son invención de la casa', 'no declara como invención lo que se le hace decir');
    ok(/reales y comprobables/i.test(nEntr) && /1925/.test(nEntr), 'mientras las obras y las fechas son reales y comprobables', 'la nota no separa lo inventado de lo comprobable');
    ok(/SOLER SERRANO\./.test(entr.textContent) && /EISENSTEIN\./.test(entr.textContent), 'los turnos se firman con el nombre en mayúsculas y punto (sin raya de diálogo)', 'los turnos de la entrevista no se firman al estilo de la casa');
    ok(/montaje intelectual/i.test(entr.textContent) && /casi nunca se logr[óo]/i.test(entr.textContent), 'y Eisenstein CONCEDE que el montaje intelectual puro casi nunca se logró', 'la entrevista no incluye la concesión de Eisenstein');
    ok(/Bazin/.test(entr.textContent) && /plano largo/i.test(entr.textContent), 'y nombra a André Bazin, en tercera persona, defendiendo el plano largo', 'la entrevista no nombra la objeción de Bazin');
    const nGala = (d.querySelector('#lect-gala .lect-nota') || {}).textContent || '';
    ok(/nunca ocurri/i.test(nGala), 'la conversación de Quintero y Fernán Gómez también se declara imaginada', 'la conversación no se declara imaginada');
    ok(/1921/.test(nGala) && /2007/.test(nGala), 'y la nota da las fechas reales de Fernán Gómez (1921 · 2007)', 'la nota no da las fechas reales de Fernán Gómez');
    ok(/\(silencio/.test(d.getElementById('lect-gala').textContent), 'y los silencios de Quintero van escritos como acotación', 'la conversación va sin los silencios');
    ok(d.getElementById('lect-gala').dataset.voz === 'Quintero y Fernán Gómez' || /data-voz="Quintero y Fern[áa]n G[óo]mez"/.test(d.getElementById('lect-gala').outerHTML),
       'y la tarjeta declara su voz propia (Quintero y Fernán Gómez) para los bancos', 'falta el data-voz de Quintero y Fernán Gómez en la tarjeta');
    ok(/El viaje a ninguna parte/i.test(d.getElementById('lect-gala').textContent), 'y la obra real de Fernán Gómez aparece en el propio texto', 'falta la obra real dentro de la conversación');
    ok(!/Cide Hamete/i.test(d.getElementById('lect-cervantes').textContent), 'y el capítulo cervantino no usa el recurso de Cide Hamete (ya salió en la etapa 6)', 'el capítulo cervantino reutiliza a Cide Hamete');

    await new Promise(r => { fr.onload = r; });
    await esperar(700);
    const fd = fr.contentDocument;
    const txtF = fd.body.textContent.replace(/\s+/g, ' ');
    ok(fd.querySelectorAll('.pagina').length === 10, 'la ficha tiene sus diez páginas', 'páginas: ' + fd.querySelectorAll('.pagina').length);
    ok(/Contar de pie y contar en imagen/.test(txtF) && /Hilo que Tira/.test(txtF), 'y es la de esta etapa', 'la ficha no es de esta misión');
    ok(!RE_RESTOS_10.test(txtF), 'sin restos de la etapa 10', 'la ficha arrastra temario de la etapa 10');
    ok(!/focalizaci[óo]n|narrador no fiable|autor impl[íi]cito|\bBooth\b|\bStanzel\b|\bBally\b|Cide Hamete|Mart[íi]n Gaite|Lubbock|Le Guin|Gardner|Ch[ée]jov|Delibes|mostrar,? no cuentes|vidrio de botella|Mamet|Goldman|no-acontecimiento|escena francesa|Freytag|Vonnegut|kish[oō]tenketsu|Ar[áa]uz|monomito/i.test(txtF), 'ni de otras rutas o etapas viejas', 'la ficha arrastra temario de otra misión');
    ok(!RAYA.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok(/Pauta del ejercicio/i.test(txtF), 'con la pauta de los ejercicios', 'la ficha no trae pauta');
    ok(/protocolo/i.test(txtF) && /autor/i.test(txtF) && /l[íi]mite/i.test(txtF), 'el protocolo trabaja también en el papel', 'la ficha no enseña el protocolo de la etapa');
    ok(/1924/.test(txtF), 'y Balázs viaja impreso con su año', 'la ficha calla el año de Balázs');
    ok(/1960/.test(txtF), 'con Parry y Lord, fechados', 'la ficha cita a Parry y Lord sin su año');
    ok(/1982/.test(txtF), 'y Ong, con su año', 'la ficha no trae a Ong con su año');
    ok(/C[áa]mara que Cuenta/.test(txtF), 'y la ficha declara la puerta a la Cámara que Cuenta', 'la ficha no menciona la Cámara que Cuenta');
    ok(/lecturas-marcador\.js/.test(fd.documentElement.innerHTML), 'la ficha trae el marcador (norma 5-octies)', 'la ficha no trae el marcador');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-hilo-de-pie-en-imagen"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');
    fr.remove();

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => (c.querySelector('.ruta-nombre') || {}).textContent === 'Ruta del Hilo que Tira');
    ok(!!ruta, 'la Ruta del Hilo que Tira está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(/Fundamentos del relato/.test(ruta.textContent), 'con su dominio a la vista (Fundamentos del relato)', 'la tarjeta no dice su dominio');
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "hilo").length');
      const totalCat = wa.eval('RUTAS.hilo.etapas');
      ok(construidasCat === 11, 'el catálogo cuenta once etapas construidas en el Hilo', 'construidas en el catálogo: ' + construidasCat);
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok([...ruta.querySelectorAll('.re-link')].some(a => /Contar de pie y contar en imagen/.test(a.textContent)),
         'la etapa 11 ya es tocable, con el título de la misión', 'la etapa 11 no sale tocable con su título');
      ok([...ruta.querySelectorAll('.re-link')].some(a => /La historia de verdad/.test(a.textContent)),
         'y la etapa 10 sigue tocable', 'la etapa 10 desapareció del mapa');
      ok(!ruta.querySelector('.ruta-etapa-futura')?.textContent.match(/contar de pie y contar en imagen/i),
         'y la etapa 11 ya no queda anunciada como «por construir»', 'la etapa 11 sigue anunciada como pendiente además de construida');
    }
    const grupo = [...da.querySelectorAll('.materia-grupo')].find(x => (x.querySelector('.materia-nombre') || {}).textContent === 'Storytelling');
    ok(!!grupo, 'la materia Storytelling tiene su grupo en el mapa de rutas', 'no hay grupo de Storytelling');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="story"]');
    ok(!!chip, 'la materia Storytelling tiene su chip en la portada', 'no hay chip de Storytelling');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      const delStory = wa.eval('MISSIONS.filter(m=>m.materia==="story").length');
      ok(cards.length === delStory, 'la materia muestra sus ' + delStory + ' misiones', 'muestra ' + cards.length + ' de ' + delStory);
      const mia = cards.find(c => /Contar de pie y contar en imagen/.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /🎥/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="hilo"&&m.etapa===11).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 11 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
