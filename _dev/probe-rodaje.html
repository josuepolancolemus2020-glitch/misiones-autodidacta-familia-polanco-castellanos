<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · El Rodaje</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:400px;height:700px;border:0;background:#fff;float:right}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>

<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Sonda de la herramienta 🎬 EL RODAJE.

   Esta herramienta escribe el cuaderno de dirección de un video que
   después se publica con nombre y apellidos. Lo que puede salir mal no
   es «se ve feo»:

   1. QUE LOS TIEMPOS SE SUMEN Y NO SE GUARDEN. Es la decisión número 1
      del archivo. Si el minuto de entrada de un bloque estuviera
      guardado, meter veinte segundos en el medio dejaría equivocados
      todos los de abajo, sin error y sin aviso, y eso no se descubre en
      la pantalla: se descubre grabando.

   2. QUE MOVER UN BLOQUE SE LLEVE SUS SEÑALES DE AUDIO. Los efectos
      cuelgan del bloque y su tiempo se cuenta desde el principio DE ESE
      BLOQUE. Si colgaran del reloj, reordenar dejaría los golpes
      sonando en el sitio de antes.

   3. QUE EL PRESUPUESTO DE CÁMARA MUERDA. «Mi aparición en la cámara
      que solo se limite a expresar lo más importante»: son dos topes,
      el porcentaje del video y lo que dura una toma seguida.

   4. QUE NINGUNA CITA SE PIERDA NI SE INVENTE. Lo generado con IA no se
      guarda sin decir con qué se hizo; una fuente borrada se quita de
      los bloques que la nombraban; y las citas que vienen escritas a
      mano en el guion pegado se crean sin verificar en vez de tirarse.

   5. QUE NADA DE LA BASE LLEGUE A UN ATRIBUTO. Esta aplicación tiene
      dentro la Bóveda, las finanzas y el chat de la casa.

   6. QUE EL ARRASTRE FUNCIONE CON EL DEDO. Se prueba con eventos de
      puntero DE VERDAD, no llamando por dentro a la función: lo que
      puede fallar ahí es de pantalla —un asa que el dedo no alcanza, un
      `touch-action` que le regala el gesto al desplazamiento— y nada de
      eso se ve llamando funciones.

   7. QUE LA BASE VIEJA SIGA FUNCIONANDO. Mientras no se corra
      rodaje.sql las tablas no existen: la herramienta tiene que decir
      qué archivo falta, porque desde una tableta no se adivina.

   Como en las demás sondas: aquí no se lee el código, se ejecuta el
   index.html de verdad con una base de mentira a nivel de fetch. El
   cliente de Supabase es el auténtico. */

const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ── La base de datos de mentira ────────────────────────────────── */
function nuevaBase(w, opciones){
  const estado = {
    tablas: { rodaje_proyectos: [], rodaje_bloques: [], rodaje_fuentes: [], rodaje_reels: [] },
    llamadas: [],
    sinTabla: !!(opciones && opciones.sinTabla),
    proxId: 100,
  };
  const filtra = (filas, params) => filas.filter(fila =>
    [...params.entries()].every(([col, val]) => {
      if (['select','order','limit','offset'].includes(col)) return true;
      if (val.startsWith('eq.')) return String(fila[col]) === val.slice(3);
      return true;
    }));

  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url, location.origin);
    if (!u.pathname.startsWith('/rest/v1/')) return new Response('{}', { status: 200 });

    const tabla  = u.pathname.replace('/rest/v1/', '');
    const params = u.searchParams;
    const metodo = (init && init.method) || 'GET';
    const cuerpo = (init && init.body) ? JSON.parse(init.body) : null;
    estado.llamadas.push({ tabla, metodo, params: u.search, cuerpo });

    const json = (d, s) => new Response(metodo === 'HEAD' ? null : JSON.stringify(d),
      { status: s || 200, headers: { 'Content-Type': 'application/json' } });

    if (estado.sinTabla) {
      return json({ code: '42P01', message: 'relation "public.' + tabla + '" does not exist' }, 404);
    }
    if (!estado.tablas[tabla]) return json({ code: '42P01', message: 'no existe' }, 404);
    const filas = estado.tablas[tabla];

    if (metodo === 'GET') {
      let r = filtra(filas, params);
      /* PostgREST admite varios `order`; el cliente los manda repetidos.
         Se aplican del último al primero, que es como ordena de verdad. */
      const ordenes = params.getAll('order');
      [...ordenes].reverse().forEach(o => {
        const [col, dir] = o.split('.');
        r = [...r].sort((a,b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (dir === 'desc' ? -1 : 1));
      });
      return json(r);
    }
    if (metodo === 'POST') {
      /* ⚠️ QUE LA BASE DE MENTIRA MUERDA ES LA MITAD DE LA COMPROBACIÓN.
         Aquí se copian los dos `check` que de verdad importan de
         rodaje.sql: el de la IA y el de la dirección. Una base falsa que
         aceptara cualquier cosa haría pasar la sonda con un código que
         en la base de verdad reventaría con un error de PostgreSQL. */
      const nuevas = (Array.isArray(cuerpo) ? cuerpo : [cuerpo]);
      for (const n of nuevas) {
        if (tabla === 'rodaje_fuentes') {
          const ia = String(n.clase || '').slice(0,3) === 'ia_';
          if (ia && (!String(n.herramienta || '').trim() || n.licencia !== 'generado_ia')) {
            return json({ code: '23514',
              message: 'new row violates check constraint "rodaje_fuentes_ia_declarada"' }, 400);
          }
          if (!ia && n.licencia === 'generado_ia') {
            return json({ code: '23514',
              message: 'new row violates check constraint "rodaje_fuentes_licencia_ia"' }, 400);
          }
        }
        if ('url' in n && n.url && !/^https?:\/\//i.test(String(n.url))) {
          return json({ code: '23514', message: 'violates check constraint on url' }, 400);
        }
        estado.tablas[tabla].push(Object.assign({ id: estado.proxId++ }, n));
      }
      return json([]);
    }
    if (metodo === 'PATCH') {
      filtra(filas, params).forEach(fila => Object.assign(fila, cuerpo));
      return json([]);
    }
    if (metodo === 'DELETE') {
      filtra(filas, params).forEach(fila => {
        const i = estado.tablas[tabla].indexOf(fila);
        if (i >= 0) estado.tablas[tabla].splice(i, 1);
      });
      return json([]);
    }
    return json([]);
  };
  return estado;
}

(async function corre(){
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await esperar(1200);                 // que arranque el index de verdad
  const w = f.contentWindow;

  if (w.eval('typeof initRodaje') !== 'function') {
    log('✘ index.html no cargó js/tools/rodaje.js');
    document.title = 'SUSPENDE · El Rodaje'; return;
  }
  w.eval('window.verificarSesion = () => ({ user: "josue", nombre: "Josué Edmundo" })');

  const base = nuevaBase(w, {});
  const R = w.FaroRodaje;
  const g = id => w.document.getElementById(id);
  /* `confirm` de mentira: los borrados preguntan, y una sonda que se
     quedara esperando un diálogo no termina nunca. */
  w.confirm = () => true;
  w.alert = () => {};

  /* ═══ 1. LOS TIEMPOS SE SUMAN, NO SE GUARDAN ═══ */
  log('── 1. Los tiempos se suman; el minuto de entrada no se guarda ──');
  const bl = [{bid:'a',dur:15},{bid:'b',dur:30},{bid:'c',dur:45}];
  const t = R.tiempos(bl);
  ok(t.map(x=>x.ini).join(',') === '0,15,45',
     'los minutos de entrada salen de sumar las duraciones (0, 0:15, 0:45)',
     'los tiempos no se suman bien: ' + t.map(x=>x.ini).join(','));
  ok(bl.every(x => x.ini === undefined),
     'y NO se escriben en la fila: un tiempo guardado se queda viejo al reordenar',
     'rodTiempos() escribió el tiempo en la fila original: se puede quedar viejo');
  const movido = R.tiempos([bl[2], bl[0], bl[1]]);
  ok(movido.map(x=>x.ini).join(',') === '0,45,60',
     'y al cambiar el orden se recalculan solos',
     'al reordenar los tiempos no se recalcularon: ' + movido.map(x=>x.ini).join(','));

  /* ═══ 2. EL PRESUPUESTO DE CÁMARA ═══ */
  log('');
  log('── 2. El presupuesto de cámara, que es la petición central ──');
  const pro = { cam_pct: 30, cam_bloque: 45, dur_obj: 200 };
  const p1 = R.presupuesto([{clase:'camara',dur:60},{clase:'pelicula',dur:140}], pro);
  ok(p1.total === 200 && Math.round(p1.pct) === 30,
     'cuenta el total y el porcentaje de cámara (200 s, 30 %)',
     'las cuentas no salen: ' + p1.total + ' / ' + Math.round(p1.pct));
  ok(p1.largas.length === 1,
     'y caza la toma de 1:00 seguida con el tope en 0:45, que es el número que de verdad avisa',
     'no cazó la toma demasiado larga');
  const p2 = R.presupuesto([{clase:'camara',dur:100},{clase:'pelicula',dur:100}], pro);
  ok(p2.excede === true && p1.excede === false,
     'el 50 % excede el tope del 30 % y el 30 % justo no',
     'el tope no muerde donde debe');

  /* ═══ 3. NADA DE LA BASE LLEGA A UN ATRIBUTO ═══ */
  log('');
  log('── 3. Ni una dirección envenenada llega a un href ──');
  const venenos = [
    'javascript:alert(1)',
    'java\tscript:alert(1)',
    'JavaScript:alert(1)',
    'data:text/html,<script>alert(1)</scr' + 'ipt>',
    'vbscript:msgbox(1)',
    'https://ok.com/a" onload="alert(1)',
    '  javascript:alert(1)  ',
    'file:///etc/passwd',
  ];
  ok(venenos.every(v => R.enlace(v) === '' || R.enlace(v).startsWith('http')),
     'los ocho enlaces envenenados no salen como http(s)',
     'ALGUNO pasó: ' + venenos.filter(v => R.enlace(v) && !R.enlace(v).startsWith('http')).join(' | '));
  ok(R.enlace('javascript:alert(1)') === '' && R.enlace('data:text/html,x') === '',
     'y javascript: y data: se caen del todo',
     'javascript: o data: sobrevivieron a rodEnlace()');
  ok(R.esc('<img src=x onerror=1>').indexOf('<') < 0 && R.esc('a"b').indexOf('&quot;') >= 0,
     'y rodEsc escapa el < y también la comilla, como redEsc en Redacción',
     'rodEsc no escapa lo que tiene que escapar');

  /* ═══ 4. EL RÓTULO SE ARMA ═══ */
  log('');
  log('── 4. El rótulo de pantalla se arma con los campos ──');
  const rotMus = R.rotulo({clase:'ia_musica', titulo:'The Calendar of Rain',
                           herramienta:'Google MusicFX', licencia:'generado_ia'});
  ok(/Google MusicFX/.test(rotMus) && /Calendar of Rain/.test(rotMus),
     'la música de Google nombra su herramienta: «' + rotMus + '»',
     'el rótulo de la música generada no nombra la herramienta: ' + rotMus);
  const rotPel = R.rotulo({clase:'pelicula', titulo:'Arrival', autoria:'Denis Villeneuve',
                           anio:'2016', editor:'Paramount Pictures', licencia:'uso_justo'});
  ok(/Villeneuve/.test(rotPel) && /2016/.test(rotPel) && /Paramount/.test(rotPel) && /uso justo/.test(rotPel),
     'y el clip nombra director, año, estudio y con qué derecho se usa',
     'al rótulo del clip le falta algo: ' + rotPel);
  const rotPobre = R.rotulo({clase:'web', titulo:'Solo título'});
  ok(!/undefined|null|\(\)|«»|,\s*\)/.test(rotPobre),
     'y con los campos vacíos no cuelgan paréntesis ni comas huérfanas: «' + rotPobre + '»',
     'el rótulo deja restos con campos vacíos: ' + rotPobre);
  /* Las trece clases tienen que dar algo legible: una clase sin forma
     propia acabaría citando un artículo como si fuera una película. */
  const todas = Object.keys(R.fuentes).map(k =>
    R.rotulo({clase:k, titulo:'X', autoria:'Y', anio:'2020', editor:'Z',
              herramienta:'Google Veo', licencia: k.slice(0,3)==='ia_' ? 'generado_ia' : 'uso_justo'}));
  ok(todas.every(x => x && x.length > 3 && !/undefined/.test(x)),
     'y las trece clases de fuente dan un rótulo propio',
     'alguna clase no arma rótulo: ' + todas.filter(x => !x || /undefined/.test(x)).join(' | '));

  /* ═══ 5. EL LECTOR DE GUION ═══ */
  log('');
  log('── 5. Pegar el guion de golpe ──');
  const r5 = R.leerGuion(
    '[CÁMARA 0:30] La flecha rota\n' +
    '¿Alguna vez has tenido un déjà vu tan visceral?\n' +
    '> visual: Plano medio cálido\n' +
    '> sfx 0:04 golpe grave de sub-bajo\n' +
    '> música: entra de fondo 0:25→1:04\n' +
    '> fuente: Arrival (Denis Villeneuve, 2016)\n' +
    '\n---\n\n' +
    'PELÍCULA 1:15 — La Llegada\n' +
    '> fuente: Arrival (Denis Villeneuve, 2016)\n' +
    '\n## GRÁFICO (0:45) El universo bloque\n' +
    '> nota: hacerlo en Canva\n' +
    '\nTOMA 4 (0:20) El cierre\n' +
    'Tu intuición no es magia.\n');
  ok(r5.bloques.length === 4,
     'lee los cuatro bloques, con corchetes, sin corchetes, con ## y con paréntesis',
     'no leyó los cuatro bloques: ' + r5.bloques.length);
  ok(r5.bloques.map(b=>b.clase).join(',') === 'camara,pelicula,grafico,camara',
     'y reconoce cámara, película, gráfico y «TOMA» como cámara',
     'las clases salieron mal: ' + r5.bloques.map(b=>b.clase).join(','));
  ok(r5.bloques.map(b=>b.dur).join(',') === '30,75,45,20',
     '⚠️ y las duraciones enteras: 0:30, 1:15, 0:45 y 0:20',
     'PERDIÓ duración en alguna cabecera (el número de orden se come el reloj): ' +
       r5.bloques.map(b=>b.dur).join(','));
  ok(r5.bloques[3].titulo === 'El cierre',
     'y «TOMA 4 (0:20) El cierre» deja de título «El cierre», sin el 4',
     'el número de orden se quedó en el título: «' + r5.bloques[3].titulo + '»');
  ok(r5.bloques[0].sfx.length === 1 && r5.bloques[0].sfx[0].t === 4,
     'el efecto de sonido queda a los 4 s DEL BLOQUE, no del video',
     'el efecto no se leyó bien: ' + JSON.stringify(r5.bloques[0].sfx));
  const m5 = r5.bloques[0].musica;
  ok(m5.acc === 'entra' && m5.niv === 'fondo' && m5.ini === 25 && m5.fin === 64,
     'y la música lee acción, altura y trozo en la misma línea',
     'la música no se leyó: ' + JSON.stringify(m5));
  ok(r5.citas.length === 1,
     'la misma cita repetida en dos bloques se junta en una sola fuente',
     'las citas repetidas se duplicaron: ' + JSON.stringify(r5.citas));
  /* ⚠️ Lo que NO se entiende no se coloca a la fuerza en un campo: ahí no
     se ve que está mal. Se queda como guion, que se lee. */
  const r5b = R.leerGuion('[CÁMARA 0:20] Hola\nPregunta: ¿y esto qué?');
  ok(/Pregunta/.test(r5b.bloques[0].guion) && !r5b.bloques[0].visual,
     'y una palabra con dos puntos que no se reconoce se queda en el guion, no en otro campo',
     'una directiva desconocida acabó en un campo que no le toca');

  /* ═══ 5-bis. LA PROSA NO SE DESCUARTIZA ═══
     El fallo más caro que tuvo el lector, y el que no se ve: cualquier
     línea del guion que empezara por una palabra que nombra una clase
     —«veo», «yo», «texto», «escena», «clip», «toma», «música»…, o sea
     media lengua— abría un bloque NUEVO. Un párrafo de seis líneas entraba
     como seis bloques vacíos con el texto convertido en títulos. El guion
     no se perdía: se descuartizaba, que es peor, porque parece que
     funcionó. */
  log('');
  log('── 5-bis. La prosa no se descuartiza y las directivas sin «>» valen ──');
  const prosa = R.leerGuion(
    '[CÁMARA 0:40] El cierre\n' +
    'Veo la ciudad desde arriba y pienso en lo que viene.\n' +
    'Texto tras texto, la misma promesa.\n' +
    'Escena a escena, el futuro ya nos dolió.\n' +
    'Yo no sé si esto es intuición o miedo.\n' +
    'Música para el alma, decía mi abuela.\n' +
    'Clip a clip se fue montando.\n' +
    'Toma nota de esto.');
  ok(prosa.bloques.length === 1,
     '⚠️ siete líneas que empiezan por «Veo», «Texto», «Escena», «Yo», «Música», «Clip» y «Toma» siguen siendo UN bloque',
     'el guion se descuartizó en ' + prosa.bloques.length + ' bloques: cada palabra de clase abre uno');
  ok(prosa.bloques[0].guion.split('\n').length === 7,
     'y las siete se quedan en el guion, ninguna acaba de título',
     'se perdieron líneas del guion: ' + prosa.bloques[0].guion.split('\n').length + ' de 7');

  const dirs = R.leerGuion('[CÁMARA 0:30] Hola\nMúsica: entra de fondo\nRótulo: Fuente X\nNota: grabar dos veces\nVisual: plano cerrado');
  ok(dirs.bloques.length === 1,
     'y «Música:», «Rótulo:», «Nota:» y «Visual:» sin el «>» delante no abren bloque',
     '«Música: entra de fondo» abrió un bloque nuevo en vez de poner la música');
  ok(dirs.bloques[0].musica.acc === 'entra' && dirs.bloques[0].rotulo === 'Fuente X' &&
     dirs.bloques[0].notas === 'grabar dos veces' && dirs.bloques[0].visual === 'plano cerrado',
     'sino que rellenan su campo, que es lo que quería quien las escribió',
     'las directivas sin «>» no rellenaron su campo');

  /* Y las tres formas de corroborar una cabecera pelada: el tiempo, el
     «##» y la palabra EN MAYÚSCULAS. La tercera deja pasar las cabeceras a
     las que todavía no se les puso duración —«PELÍCULA La Llegada»— sin
     volver a abrirle la puerta a «Yo no sabía entonces…», que no va en
     mayúsculas. */
  const mays = R.leerGuion('[CÁMARA 0:20] A\ntexto\nPELÍCULA La Llegada');
  ok(mays.bloques.length === 2 && mays.bloques[1].clase === 'pelicula',
     'y una cabecera en MAYÚSCULAS sin tiempo sigue abriendo su bloque',
     'una cabecera en mayúsculas sin duración se tragó como guion');

  const cabMus = R.leerGuion('[CÁMARA 0:20] A\ntexto\nMÚSICA 0:30 Respiro\n> musica: sigue');
  ok(cabMus.bloques.length === 2 && cabMus.bloques[1].clase === 'musica',
     'y una cabecera de clase música DE VERDAD («MÚSICA 0:30 Respiro») sigue abriendo su bloque',
     'se rompió la cabecera de clase música al arreglar lo anterior');

  /* ⚠️ Y EL NOMBRE DE LA PISTA NO SE TIRA. «musica: The Calendar of Rain
     sigue de fondo» traía el título de la canción, y la primera versión
     leía «sigue» y «fondo» y dejaba caer el resto en silencio: el dato que
     más cuesta volver a escribir era justo el que se perdía. */
  const conPista = R.leerGuion('[CÁMARA 0:20] A\n> musica: The Calendar of Rain entra de fondo 0:25→1:04');
  ok(conPista.bloques[0].musica.acc === 'entra' && conPista.bloques[0].musica.ini === 25,
     'la directiva de música lee la acción y el trozo',
     'no leyó la música: ' + JSON.stringify(conPista.bloques[0].musica));
  ok(conPista.citas.some(c => /Calendar of Rain/.test(c)),
     '⚠️ y el nombre de la pista se guarda como cita en vez de tirarse',
     'el título de la canción se perdió en silencio: ' + JSON.stringify(conPista.citas));

  /* ═══ 5-ter. EL GUION SE PEGA COMO ESTÁ ESCRITO, NO COMO DEBERÍA ═══
     Un guion de verdad no dice «rotulo:»: dice «TEXTO EN PANTALLA:»,
     «AUDIO (Tú - Voz en off):», «BGM:» y «SONIDOS:». Antes, «TEXTO EN
     PANTALLA:» entraba por la rama de la cabecera —«TEXTO» nombra una
     clase y venía en mayúsculas— y abría un bloque NUEVO titulado «EN
     PANTALLA: …»: o sea que la forma en que la gente escribe de verdad
     era justo la que se descuartizaba. */
  log('');
  log('── 5-ter. Las etiquetas como se escriben de verdad ──');
  const crudo = R.leerGuion(
    '[CÁMARA 0:15] El gancho\n' +
    'VISUAL: Louise abrazando a su hija\n' +
    'SFX: viento suave\n' +
    'BGM: entra de fondo 0:00→0:25 The Calendar of Rain\n' +
    'TEXTO EN PANTALLA: ¿Y si el futuro ya nos dolió?\n' +
    'AUDIO (Tú - Voz en off): Toda la vida nos han dicho que el tiempo es una línea recta.\n' +
    'Objetivo: romper la percepción del espectador\n' +
    'REFERENCIAS: Einstein, Relatividad General\n' +
    'REBANADAS: esto no es ninguna etiqueta\n' +
    'Su mandamiento fue claro: no harás una máquina.');

  ok(crudo.bloques.length === 1,
     '⚠️ un guion escrito con «TEXTO EN PANTALLA:» y «AUDIO (Tú):» sigue siendo UN bloque',
     'se descuartizó en ' + crudo.bloques.length + ' bloques: ' +
       crudo.bloques.map(b => b.titulo).join(' | '));
  const c0 = crudo.bloques[0] || {};
  ok(c0.visual === 'Louise abrazando a su hija',
     'y «VISUAL:» en mayúsculas llena lo que se ve',
     'VISUAL no llegó a su campo: ' + JSON.stringify(c0.visual));
  ok(c0.rotulo === '¿Y si el futuro ya nos dolió?',
     '⚠️ y «TEXTO EN PANTALLA:» va al rótulo, en vez de abrir un bloque de título',
     'TEXTO EN PANTALLA no llegó al rótulo: ' + JSON.stringify(c0.rotulo));

  const altoMarco = f.style.height;

  log('');

  log('');
  log('── 8. Arrastrar con el dedo, y que el sonido se vaya con el bloque ──');
  w.eval('_rodPestana = "secuencia"; rodPintarPestanas(); rodRender();');

  const lista = g('rod-lista');

     como una fila —que es el fallo que en los videos de M.E.T.A.S hubo

  const nota = g('rod-cuerpo').querySelector('.rod-orden-nota');

  /* ── El arrastre, con eventos de puntero DE VERDAD ── */
  const arrastra = (desdeAsa, hastaTarjeta) => {
    const a = desdeAsa.getBoundingClientRect();
    const b = hastaTarjeta.getBoundingClientRect();
    const ev = (t, x, y) => new w.PointerEvent(t, {
      bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch',
      clientX: x, clientY: y });
    desdeAsa.dispatchEvent(ev('pointerdown', a.left + a.width/2, a.top + a.height/2));
    desdeAsa.dispatchEvent(ev('pointermove', b.left + b.width/2, b.top + b.height - 2));
    desdeAsa.dispatchEvent(ev('pointermove', b.left + b.width/2, b.top + 2));
    desdeAsa.dispatchEvent(ev('pointerup',   b.left + b.width/2, b.top + 2));
  };

  log('');

  ok(Math.abs(R.durGuion('una dos tres cuatro cinco seis siete ocho nueve diez'.repeat(15)) - 60) < 8,

  /* ⚠️ Y solo en un sentido: cuando el texto NO CABE. Que sobre tiempo es

     encima—, y avisar de las dos cosas llenaba el panel de avisos que no
     lo eran. Un panel lleno de avisos que no importan no se lee. */
  bOff.dur = 20;

  ok(revLargo.some(a => /La Llegada/.test(a.txt) && /no cabe/.test(a.txt)),
     'y la revisión avisa cuando lo escrito NO CABE en el tiempo que se le puso',
     'no avisa del guion que no cabe: el video sale de veintiún minutos y se descubre montando');

  bOff.dur = 600;
  bOff.guion = 'Cuatro palabras nada más.';
  await w.eval('rodCargarProyecto()');
  await esperar(400);
  const revCorto = w.eval('rodRevisar()');
  ok(!revCorto.some(a => /La Llegada/.test(a.txt) && /cabe/.test(a.txt)),
     'y NO avisa cuando sobra tiempo: dejar un plano respirando es una decisión, no un error',
     'avisa de que sobra tiempo y llena el panel de avisos que no lo son');
  bOff.dur = 120; bOff.guion = '';
  await w.eval('rodCargarProyecto()');
  await esperar(300);

  /* ═══ 11. LAS EXPORTACIONES ═══ */
  log('');
  log('── 11. Lo que sale por el chat ──');
  /* Se deja una fuente sin verificar a propósito: es el estado en el que
     de verdad se exporta —siempre queda algo por comprobar— y es el que
     hace que la comprobación de abajo signifique algo. */
  base.tablas.rodaje_fuentes.find(f => f.fid === 'f-mus').verificada = false;
  await w.eval('rodCargarProyecto()');
  await esperar(400);
  const bib = R.exportar.bibliografia();
  ok(/INTELIGENCIA ARTIFICIAL/.test(bib) && /Google MusicFX/.test(bib) && /melancholic piano/.test(bib),
     'la descripción de YouTube separa lo generado por una máquina, con su herramienta y su prompt',
     'la bibliografía no separa lo generado con IA o no lleva el prompt');
  ok(/Aparece en/.test(bib),
     'y dice en qué minutos aparece cada fuente, sacado de los bloques',
     'la bibliografía no dice en qué minutos aparece cada fuente');
  /* ⚠️ Y LOS AVISOS INTERNOS NO SE VAN CON ELLA. Este texto tiene un solo
     destino: la descripción PÚBLICA de un video. Un «SIN VERIFICAR EN EL
     ORIGINAL» al lado de una fuente es una nota para el autor, y pegada
     ahí la lee cualquiera. Van encima de una raya, y lo que se copia es lo
     de debajo. */
  const corte = bib.indexOf('copia de aquí para abajo');
  ok(corte >= 0, 'y trae una raya que separa las notas del autor de lo publicable',
     'no hay raya: los avisos internos se pegan con la descripción');
  const publicable = bib.slice(corte);
  ok(!/SIN VERIFICAR|SIN DETERMINAR|antes de publicar/i.test(publicable),
     '⚠️ y de la raya para abajo no queda ni un aviso interno que pegar en público',
     'la parte publicable lleva avisos internos dentro: se pegarían en la descripción del video');
  ok(/sin verificar/i.test(bib.slice(0, corte)),
     'aunque arriba sí se ven, que para eso están',
     'los avisos no se ven en ninguna parte: se perderían');
  const rot = R.exportar.rotulos();
  ok(/Google MusicFX/.test(rot) || /rótulo/.test(rot),
     'los rótulos de pantalla salen con su minuto delante',
     'los rótulos de pantalla no salen');
  const plan = R.exportar.plan();
  ok(/SECUENCIA/.test(plan) && /SONIDO/.test(plan) && /0:00/.test(plan),
     'y el plan de rodaje lleva la secuencia con sus tiempos y sus señales de sonido',
     'el plan de rodaje no lleva lo que tiene que llevar');

  /* ═══ 12. EL TELEPROMPTER ═══ */
  log('');
  log('── 12. El teleprompter ──');
  w.eval('rodPrompterAbrir("")');
  await esperar(300);
  const prom = g('rod-prompter');
  ok(prom && prom.style.display === 'flex', 'se abre a pantalla entera',
     'el teleprompter no se abrió');
  const txt = g('rod-prompter-txt');
  ok(txt && /déjà vu/.test(txt.textContent),
     'y lleva el guion de las tomas a cámara',
     'el teleprompter no trae el guion');
  /* Un bloque SIN guion no aparece. Lo que sí aparece —pequeño y en gris—
     es la nota de lo que se ve, que es una indicación de plano y para eso
     está un teleprompter. Lo que no puede pasar es que se cuele como texto
     grande algo que nadie va a decir: entre el texto que hay que leer y lo
     que hay que hacer con la cara, lo segundo va en letra chica. */
  ok(txt && !/Microtúbulos/.test(txt.textContent),
     'y un bloque sin guion escrito no aparece: no hay nada que leer en él',
     'el teleprompter trae bloques que no tienen ni una palabra que decir');
  const grandes = txt ? [...txt.querySelectorAll('.rod-prom-p')].map(n => n.textContent).join(' ') : '';
  ok(!/Plano medio|Clips de tinta/.test(grandes),
     'y las indicaciones de plano no se cuelan como texto que leer, van en letra chica',
     'una indicación de plano salió como texto grande: se leería en voz alta');
  /* La letra tiene que ser grande de verdad: se lee a un brazo de
     distancia, que es donde se pone una tableta para grabarse. */
  const parr = txt && txt.querySelector('.rod-prom-p');
  const tam = parr ? parseFloat(w.getComputedStyle(parr).fontSize) : 0;
  ok(tam >= 24, 'y la letra es de ' + Math.round(tam) + ' px, legible a un brazo de distancia',
     'la letra del teleprompter es de ' + Math.round(tam) + ' px: no se lee desde donde se graba');

  /* ⚠️ Y LOS OCHO MANDOS DE LA CABECERA CABEN Y SE PUEDEN TOCAR.
     Aquí se toca MIENTRAS SE LEE EL GUION —o sea, sin mirar el botón— y
     con la cámara grabando: un mando de 34 px se falla, y uno que se sale
     por la derecha de la pantalla no existe. Que la fila baje de línea es
     barato; las otras dos cosas no tienen arreglo en el montaje. */
  const cabP = w.document.querySelector('.rod-prom-cab');
  ok(cabP && cabP.scrollWidth <= cabP.clientWidth + 1,
     'y la cabecera no se sale por la derecha: la ✕ está siempre en pantalla',
     'la cabecera del teleprompter se sale ' + (cabP ? cabP.scrollWidth - cabP.clientWidth : '?') +
     ' px: a pantalla completa, quedarse sin la ✕ no tiene salida');
  const mandos = ['rod-prom-menos', 'rod-prom-mas', 'rod-prom-pasar',
                  'rod-prom-espejo', 'rod-prom-camara', 'rod-prom-cerrar']
    .map(i => g(i)).filter(Boolean).map(n => n.getBoundingClientRect());
  const chico = Math.min(...mandos.map(r => Math.min(r.width, r.height)));
  ok(mandos.length === 6 && chico >= 44,
     'y los seis mandos miden ' + Math.round(chico) + ' px o más, que es lo que un dedo acierta sin mirar',
     'hay un mando del teleprompter de ' + Math.round(chico) + ' px: se falla tocándolo a ciegas');
  w.eval('rodPrompterCerrar()');
  await esperar(200);
  ok(g('rod-prompter').style.display === 'none' && w.eval('_rodPromInt') === null,
     'y al cerrarlo se para el paso del texto, que si no seguiría corriendo por detrás',
     'al cerrar el teleprompter el texto sigue pasando por detrás');
  f.style.height = altoMarco;

  /* ═══ 12-bis. UN CORTE DE RED NO ES UNA SECUENCIA VACÍA ═══
     El cliente de Supabase no lanza cuando la petición se cae: devuelve
     `{data: null, error}`. Sin mirar ese error, un corte dejaba la lista en
     cero y la pantalla decía «La secuencia está vacía» con un botón que
     invita a PEGAR EL GUION: el camino natural después de una mala señal
     era pegar los treinta bloques encima de los treinta que ya estaban. */
  log('');
  log('── 12-bis. Un corte de red no se enseña como una secuencia vacía ──');
  const fetchBueno = w.fetch;
  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url, location.origin);
    if (/rodaje_bloques/.test(u.pathname + u.search) || /rodaje_bloques/.test(u.pathname)) {
      return new Response(JSON.stringify({ message: 'TypeError: Failed to fetch' }), { status: 503 });
    }
    return fetchBueno(url, init);
  };
  await w.eval('rodCargarProyecto()');
  await esperar(500);
  const tras = g('rod-cuerpo');
  ok(tras && !/secuencia está vacía/i.test(tras.textContent),
     '⚠️ no dice «la secuencia está vacía» cuando lo que pasó fue un corte',
     'un corte de red se enseña como una secuencia vacía, e invita a pegar el guion otra vez');
  ok(tras && /señal|no se pudo/i.test(tras.textContent),
     'sino que dice que fue la señal y que los datos siguen donde estaban',
     'no explica que fue la señal: ' + (tras ? tras.textContent.slice(0, 120) : ''));
  ok(w.eval('_rodBlo.length') === 3,
     'y NO borra lo que ya tenía en memoria: escribir encima sería lo siguiente',
     'se perdieron los bloques de memoria tras el corte: ' + w.eval('_rodBlo.length'));
  w.fetch = fetchBueno;
  await w.eval('rodCargarProyecto()');
  await esperar(400);

  /* ═══ 13. LA BASE VIEJA SIGUE FUNCIONANDO ═══ */
  log('');
  log('── 13. Sin correr el SQL, se dice qué falta ──');
  nuevaBase(w, { sinTabla: true });
  await w.eval('initRodaje()');
  await esperar(500);
  const cuerpo = g('rod-cuerpo');
  ok(cuerpo && /rodaje\.sql/.test(cuerpo.textContent),
     'dice el archivo exacto que hay que correr: desde una tableta no se adivina',
     'no dice qué archivo falta: ' + (cuerpo ? cuerpo.textContent.slice(0,140) : ''));
  ok(cuerpo && /rodaje_comprueba\.sql/.test(cuerpo.textContent),
     'y también el de comprobar, que es el que se pega mañana sin repetir las quinientas líneas',
     'no menciona el archivo de comprobación');

  /* ═══ 14. EL SERVICE WORKER NO PUEDE SERVIR EL JS VIEJO ═══
     Esto no se ve desde el navegador —la sonda corre sin service
     worker—, así que se lee el archivo. Y hace falta: el 28 de agosto de
     2026 F.A.R.O sirvió el HTML nuevo con el JS viejo, y el rótulo de
     una pestaña salía con nada debajo. */
  log('');
  log('── 14. El service worker revalida contra el servidor ──');
  const sw = await (await fetch('/sw.js', { cache: 'no-store' })).text();
  const ramaPropia = sw.split('} else {')[0];
  ok(/cache:\s*'no-cache'/.test(ramaPropia),
     'los archivos propios se piden con `cache: no-cache`',
     'sin eso la caché HTTP del navegador sirve el JS viejo con el HTML nuevo, y no parece un fallo de caché');
  ok(/faro-app-v(\d+)/.test(sw) && parseInt(sw.match(/faro-app-v(\d+)/)[1], 10) >= 85,
     'y la versión está sellada por encima de la v84, que es la de antes de esta herramienta',
     'falta sellar CACHE_NAME en sw.js: el despliegue existiría y nadie lo vería');

  /* ═══ 15. LA SALA ES OSCURA, Y SE MIRA EL COLOR CALCULADO ═══
     No basta con leer el CSS: el fallo que esto caza no se ve en el
     archivo. `.rod-card` declara `border-left: 4px solid var(--border)`
     —el atajo, que incluye el COLOR— y pesa lo mismo que `.rod-borde-cam`;
     a igualdad de peso gana la que vaya después. Con las franjas
     declaradas arriba, la secuencia entera se pintaba gris y no había
     forma de distinguir un clip de una toma de un vistazo. Ni el HTML ni
     el JS estaban mal, así que ninguna sonda que mirase el documento lo
     habría visto: es el mismo fallo del `var(--card)` de Videos M.E.T.A.S
     y se caza igual, midiendo el color que el navegador CALCULA. */
  log('');
  log('── 15. La sala es oscura y la franja de clase se ve ──');

  /* La comprobación 13 dejó la base sin tablas a propósito. Se vuelve a
     poner una buena con las mismas filas: lo que viene mira la pantalla
     pintada, y sin datos no hay pantalla que mirar. */
  const base3 = nuevaBase(w);
  /* Filas PROPIAS, no las de antes. Las comprobaciones anteriores borran
     una fuente a propósito, reordenan la secuencia y dejan bloques sin
     cita —todo correcto—, así que reutilizarlas haría que lo que viene
     dependiera del orden en que corren las demás: el día que se añada una
     comprobación en medio, esto suspendería sin que hubiera nada roto. Y
     hacen falta las dos cosas a la vez: un bloque CON su cita y otro que
     la necesita y no la tiene. */
  base3.tablas.rodaje_proyectos.push({
    id: 90, pid: 'p-sala', titulo: 'La sala', tesis: 'Probar la pantalla',
    estado: 'guion', dur_obj: 600, cam_pct: 30, cam_bloque: 45, url: '', notas: '' });
  base3.tablas.rodaje_fuentes.push({
    id: 91, pid: 'p-sala', fid: 'f-sal', clase: 'pelicula', titulo: 'Arrival',
    autoria: 'Denis Villeneuve', anio: '2016', editor: 'Paramount Pictures',
    licencia: 'uso_justo', rotulo: 'Clip: «Arrival» (Denis Villeneuve, 2016)',
    pantalla: true, verificada: true, herramienta: '', prompt: '', obra: '', url: '', notas: '' });
  base3.tablas.rodaje_bloques.push(
    { id: 92, pid:'p-sala', bid:'s-1', orden:1, clase:'camara', titulo:'La flecha rota', dur:60,
      guion:'¿Alguna vez has tenido un déjà vu?', visual:'Plano medio', notas:'', rotulo:'',
      listo:false, fids:[], sfx:[{t:4,que:'golpe grave',fid:''}],
      musica:{acc:'entra',fid:'f-sal',ini:0,fin:64,niv:'fondo'} },
    { id: 93, pid:'p-sala', bid:'s-2', orden:2, clase:'pelicula', titulo:'La Llegada', dur:120,
      guion:'', visual:'Clips de tinta', notas:'', rotulo:'', listo:true,
      fids:['f-sal'], sfx:[], musica:{} },          // CON su cita
    { id: 94, pid:'p-sala', bid:'s-3', orden:3, clase:'ia', titulo:'Microtúbulos', dur:70,
      guion:'', visual:'Zoom a una neurona', notas:'', rotulo:'', listo:false,
      fids:[], sfx:[{t:10,que:'zumbido'}], musica:{} });   // SIN cita: tiene que verse
  w.eval('_rodPid = "p-sala"');
  f.style.height = '1400px';
  w.document.getElementById('app-container').style.display = '';
  w.eval('_rodPestana = "secuencia"');
  await w.eval('initRodaje()');
  await esperar(800);

  /* Un color se lee «oscuro» por su luminancia, no por su nombre: así la
     comprobación sigue valiendo si mañana se cambia el tono exacto. Y un
     color transparente devuelve −1, porque «transparente» no es oscuro:
     es el fallo del `var(--card)`, que no se ve y no da error. */
  const luz = c => {
    const m = String(c || '').match(/[\d.]+/g);
    if (!m || m.length < 3) return -1;
    if (m.length > 3 && parseFloat(m[3]) < 0.5) return -1;
    return (0.2126 * +m[0] + 0.7152 * +m[1] + 0.0722 * +m[2]) / 255;
  };

  const vista = w.document.getElementById('view-rodaje');
  const fondoVista = w.getComputedStyle(vista).backgroundColor;
  ok(luz(fondoVista) >= 0 && luz(fondoVista) < 0.25,
     'la vista tiene fondo propio y es oscuro: aquí se juzgan imágenes y rótulos',
     'el fondo de la vista no es oscuro ni opaco: ' + fondoVista);

  const carta = w.document.querySelector('#rod-lista .rod-card');
  ok(carta && luz(w.getComputedStyle(carta).backgroundColor) < 0.3,
     'y las tarjetas de la secuencia también, sin quedarse transparentes',
     'la tarjeta de la secuencia no tiene fondo oscuro: ' +
       (carta ? w.getComputedStyle(carta).backgroundColor : 'sin tarjeta'));

  const colorTit = carta && carta.querySelector('.rod-tit')
    ? w.getComputedStyle(carta.querySelector('.rod-tit')).color : '';
  ok(luz(colorTit) > 0.6,
     'y su texto es claro: un token del mundo claro aquí se leería negro sobre negro',
     'el texto de la tarjeta no es claro: ' + colorTit);

  /* La franja de clase. No se da por supuesto CUÁL es —la comprobación 8
     reordena la secuencia—: se mira que la tarjeta pida una y que el
     borde izquierdo se pinte distinto del resto del marco. */
  const pideFranja = carta ? /rod-borde-(\w+)/.exec(carta.className) : null;
  ok(!!pideFranja, 'la tarjeta pide su franja de clase',
     'la tarjeta no lleva clase de franja: ' + (carta ? carta.className : 'sin tarjeta'));
  const franja = carta ? w.getComputedStyle(carta).borderLeftColor : '';
  const marcoCol = carta ? w.getComputedStyle(carta).borderTopColor : '';
  ok(franja && marcoCol && franja !== marcoCol,
     '⚠️ y la franja se pinta de SU color (' + franja + '), no del gris del marco',
     'la franja de clase sale igual que el marco (' + franja + '): la secuencia es un muro de ' +
     'tarjetas idénticas. Las reglas .rod-borde-* tienen que ir DESPUÉS de .rod-card en el CSS');

  const nav = w.document.getElementById('bottom-nav');
  ok(w.document.body.classList.contains('rod-sala'),
     'y el `body` lleva `rod-sala` mientras se está dentro',
     'falta la clase `rod-sala` en el body: la barra de abajo se queda blanca');
  ok(nav && luz(w.getComputedStyle(nav).backgroundColor) < 0.3,
     'así que la barra de abajo se oscurece en vez de cortar la sala con una franja blanca',
     'la barra de abajo sigue clara dentro de El Rodaje: ' +
       (nav ? w.getComputedStyle(nav).backgroundColor : 'sin barra'));

  /* ⚠️ Y NADA DE ESTO SALE DE LA VISTA. El resto de F.A.R.O es claro y
     tiene que seguir siéndolo: un token redefinido en `:root` habría
     teñido la casa entera sin que nadie lo pidiera. */
  w.eval('switchView("view-inicio")');
  await esperar(300);
  ok(!w.document.body.classList.contains('rod-sala'),
     '⚠️ y al salir se apaga: el resto de la casa es claro y sigue siéndolo',
     'la clase `rod-sala` se queda puesta al salir: la casa entera se oscurece');
  ok(nav && luz(w.getComputedStyle(nav).backgroundColor) > 0.7,
     'la barra de abajo vuelve a ser blanca fuera de El Rodaje',
     'la barra de abajo se quedó oscura fuera de El Rodaje');
  w.eval('switchView("view-rodaje")');
  await esperar(500);

  /* ═══ 16. EL MONITOR CORRE EL GUION ═══ */
  log('');
  log('── 16. El monitor: el video antes de existir ──');
  w.eval('_rodPestana = "monitor"; rodPintarPestanas(); rodRender();');
  await esperar(500);

  const cuadro = g('rod-mon-marco');
  ok(!!cuadro, 'la pestaña pinta el marco del monitor', 'no se pintó el monitor');
  const caja16 = cuadro ? cuadro.getBoundingClientRect() : { width: 0, height: 0 };
  const razon = caja16.height ? caja16.width / caja16.height : 0;
  ok(Math.abs(razon - 16 / 9) < 0.06,
     '⚠️ y es 16:9 de verdad (' + razon.toFixed(2) + '): un rótulo que aquí cabe y allá no, no decide nada',
     'el marco del monitor no es 16:9, es ' + razon.toFixed(2) + ': lo que se juzgue aquí no vale para el video');

  /* ⚠️ Y LO DE DENTRO CABE. El marco no se estira —dejaría de ser 16:9 y
     lo que se juzgue aquí dejaría de valer para el video—, así que lo que
     se recorta es el contenido; lo que no puede pasar es que se recorte a
     media línea, que se lee como un fallo de pintado. */
  const centro = cuadro && cuadro.querySelector('.rod-mon-centro');
  ok(centro && centro.scrollHeight <= centro.clientHeight + 2,
     'y lo que va dentro del marco cabe dentro del marco, sin cortarse a media línea',
     'el contenido del monitor se sale del 16:9: ' +
       (centro ? centro.scrollHeight + ' px en ' + centro.clientHeight : 'sin centro'));

  /* Los bloques se buscan por lo que SON, no por la posición: la
     comprobación 8 reordena la secuencia y una sonda que contara puestos
     suspendería sin que hubiera nada roto. */
  const bls = R.tiempos(w.eval('JSON.parse(JSON.stringify(_rodBlo))'));
  const conCita = bls.find(b => (b.fids || []).length);
  const sinCita = bls.find(b => !(b.fids || []).length && R.clases[b.clase] && R.clases[b.clase].cita);
  const iCita = bls.indexOf(conCita);
  ok(R.monitor.en(bls, conCita.ini + 1) === iCita,
     'el cabezal cae en el bloque que le toca según los tiempos sumados',
     'el monitor no coloca bien el cabezal en el tiempo');

  w.eval('_rodMonT = ' + (conCita.ini + 1) + '; _rodMonUlt = -1; rodMonPintar(true);');
  await esperar(200);
  const ter = cuadro.querySelector('.rod-mon-tercio');
  ok(ter && ter.textContent.length > 10,
     'y el rótulo de la fuente sale encima del video, con la pinta que va a tener',
     'no sale el rótulo de la fuente: ' + (ter ? ter.textContent : 'sin rótulo'));
  ok(ter && !ter.className.includes('rod-mon-tercio-falta'),
     'y no se marca como falta cuando la cita está puesta',
     'un bloque con su cita sale marcado como si le faltara');
  ok(g('rod-mon-sub') && g('rod-mon-sub').textContent.indexOf(ter.textContent) < 0,
     'y el rótulo no se mete dentro del texto que se dice: son dos cosas y se leen aparte',
     'el rótulo se coló en el texto hablado');

  /* ⚠️ Y LA FALTA DE CITA SE VE EN EL SITIO DE LA CITA. El bloque de IA
     no tiene ninguna fuente: eso es lo que el disparador de la base no
     deja publicar, y aquí se ve como un hueco rojo donde debería estar
     el crédito, que es donde de verdad se nota. */
  ok(!!sinCita, '(hay un bloque que necesita cita y no la tiene, para probarlo)',
     'el fixture ya no trae un bloque sin cita: la comprobación no prueba nada');
  w.eval('_rodMonT = ' + (sinCita.ini + 1) + '; _rodMonUlt = -1; rodMonPintar(true);');
  await esperar(200);
  const terFalta = cuadro.querySelector('.rod-mon-tercio');
  ok(terFalta && terFalta.className.indexOf('rod-mon-tercio-falta') >= 0,
     '⚠️ y un bloque que necesita cita y no la tiene lo enseña EN EL HUECO DEL RÓTULO, en rojo',
     'el bloque sin fuente no avisa en el monitor');

  /* Las muescas de la pista salen de la MISMA lista que la pestaña de
     sonido: si fueran dos listas, una de las dos estaría mal algún día y
     sería siempre la que menos se mira. */
  ok(R.monitor.senales().length === R.senales().length,
     'las muescas de sonido de la pista son las mismas señales de la pestaña 🔊 Sonido',
     'la pista y la pestaña de sonido cuentan señales distintas: ' +
       R.monitor.senales().length + ' vs ' + R.senales().length);
  const muescas = g('rod-mon-pista').querySelectorAll('.rod-mon-tick');
  ok(muescas.length === R.senales().length,
     'y se pintan todas sobre la pista (' + muescas.length + ')',
     'faltan muescas en la pista: ' + muescas.length + ' de ' + R.senales().length);

  /* ⚠️ CORRER EL MONITOR NO ESCRIBE NADA EN LOS BLOQUES. Es la decisión
     número 1 de la herramienta vista desde otro sitio: si el monitor
     dejara el minuto de entrada pegado a la fila, mover un bloque
     después dejaría mintiendo todos los tiempos de abajo. */
  w.eval('_rodMonT = 0; rodMonCorrer(true);');
  await esperar(800);
  const corrio = w.eval('_rodMonT');
  ok(corrio > 0.2,
     'al darle a ▶️ el cabezal avanza en tiempo real (' + corrio.toFixed(1) + ' s)',
     'el monitor no avanza al ponerlo a correr');
  ok(w.eval('_rodBlo.every(b => b.ini === undefined)'),
     '⚠️ y correrlo NO escribe el minuto de entrada en ninguna fila',
     'el monitor dejó `ini` escrito en los bloques: al reordenar, todos los tiempos mentirían');
  w.eval('rodMonCorrer(false)');

  /* Arrastrar el cabezal, con eventos de puntero DE VERDAD: lo que puede
     fallar ahí es de pantalla —una pista que no recibe el gesto, un
     `touch-action` que se lo regala al desplazamiento— y nada de eso se
     ve llamando a la función por dentro. */
  const pista = g('rod-mon-pista');
  const rp = pista.getBoundingClientRect();
  ok(w.getComputedStyle(pista).touchAction === 'none',
     'la pista lleva `touch-action: none`, sin el cual el gesto se lo queda el desplazamiento',
     'la pista del monitor no tiene `touch-action: none`: en una tableta no se puede arrastrar');
  const total16 = R.tiempos(w.eval('JSON.parse(JSON.stringify(_rodBlo))'))
    .reduce((a, b) => a + b.dur, 0);
  const pev = (tipo, x) => new w.PointerEvent(tipo, {
    bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch',
    clientX: x, clientY: rp.top + rp.height / 2 });
  pista.dispatchEvent(pev('pointerdown', rp.left + rp.width * 0.5));
  pista.dispatchEvent(pev('pointerup',   rp.left + rp.width * 0.5));
  await esperar(200);
  const medio = w.eval('_rodMonT');
  ok(Math.abs(medio - total16 / 2) < total16 * 0.1,
     'y tocando la mitad de la pista el cabezal salta a la mitad del video (' +
       Math.round(medio) + ' s de ' + total16 + ')',
     'tocar la pista no mueve el cabezal: quedó en ' + Math.round(medio));

  /* ⚠️ Y AL SALIR DE LA PESTAÑA EL BUCLE SE PARA SOLO. Cambiar de
     pestaña vacía el cuerpo sin avisar a nadie: un bucle que siguiera
     corriendo escribiría en nodos sueltos para siempre. */
  w.eval('rodMonCorrer(true); _rodPestana = "citas"; rodPintarPestanas(); rodRender();');
  await esperar(500);
  ok(w.eval('_rodMonCorre') === false,
     'y al cambiar de pestaña el bucle se para solo, en vez de seguir por detrás',
     'el bucle del monitor sigue corriendo con la pestaña cerrada');

  /* ═══ 17. LA CÁMARA ES UN ESPEJO Y NADA MÁS ═══
     Aquí no hay cámara: se le pone un doble a `getUserMedia` y se mira
     QUÉ PIDE y qué hace con lo que recibe. Es la única manera de
     comprobar las dos cosas que de verdad importan —que no pide el
     micrófono y que apaga las pistas al soltarla—, porque las dos son
     invisibles en la pantalla y las dos se notan en la vida real: una en
     lo que dice el navegador al pedir permiso, y la otra en la luz del
     aparato, que se queda encendida detrás del chat o de las finanzas. */
  log('');
  log('── 17. La cámara: un espejo, sin micrófono y que se apaga ──');
  /* ⚠️ El doble devuelve un MediaStream DE VERDAD, sacado de un lienzo con
     `captureStream()`, y no un objeto cualquiera: `video.srcObject` está
     tipado y con un objeto suelto LANZA. Con un doble de mentira, la
     herramienta se iba por el `catch` y la sonda aprobaba el camino del
     error creyendo que probaba el bueno — que es la peor manera de que
     una sonda mienta. */
  w.eval(`
    window.__rodPedidos = [];
    window.__rodParadas = 0;
    if (!navigator.mediaDevices) navigator.mediaDevices = {};
    navigator.mediaDevices.getUserMedia = async (c) => {
      window.__rodPedidos.push(c);
      const lienzo = document.createElement('canvas');
      lienzo.width = 64; lienzo.height = 36;
      lienzo.getContext('2d').fillRect(0, 0, 64, 36);
      const flujo = lienzo.captureStream(1);
      flujo.getTracks().forEach(p => {
        const parar = p.stop.bind(p);
        p.stop = () => { window.__rodParadas++; parar(); };
      });
      return flujo;
    };
  `);
  w.eval('_rodPestana = "monitor"; rodPintarPestanas(); rodRender();');
  await esperar(500);

  const notaCam = g('rod-mon-cam-nota');
  ok(notaCam && /no graba/i.test(notaCam.textContent) && /no se sube/i.test(notaCam.textContent),
     '⚠️ la pantalla dice, sin que nadie lo pregunte, que no graba y que no sube nada',
     'la pestaña no dice qué hace con la imagen de la cámara');

  await w.eval('rodMonCamara()');
  await esperar(400);
  const pedido = w.eval('window.__rodPedidos[0]');
  ok(w.eval('window.__rodPedidos.length') === 1,
     'al tocar 🎥 se pide la cámara una sola vez',
     'la cámara se pidió ' + w.eval('window.__rodPedidos.length') + ' veces');
  ok(pedido && pedido.audio === false,
     '⚠️ y se pide SIN micrófono: pedirlo cambia lo que el navegador enseña al dar permiso',
     'la cámara se pide con micrófono: ' + JSON.stringify(pedido));
  ok(w.eval('FaroRodaje.camara.encendida()') === true,
     'y queda encendida',
     'la cámara no quedó encendida');

  /* Una sola para toda la herramienta: el monitor y el teleprompter
     cuelgan sus dos `<video>` del MISMO flujo. Con dos peticiones, el
     segundo aparato se encontraría la cámara ocupada por el primero en
     la mitad de los navegadores. */
  w.eval('rodPrompterAbrir("")');
  await w.eval('rodPrompterCamara()');
  await esperar(400);
  ok(w.eval('window.__rodPedidos.length') === 1,
     '⚠️ y el teleprompter usa LA MISMA, no pide otra: dos peticiones se estorban entre sí',
     'el teleprompter pidió una segunda cámara: ' + w.eval('window.__rodPedidos.length'));
  const espejo = g('rod-cam-espejo');
  ok(espejo && espejo.style.display !== 'none',
     'el espejo del teleprompter se enseña',
     'el espejo del teleprompter no salió');
  ok(g('rod-cam-video') && g('rod-cam-video').srcObject,
     'y su video está colgado del flujo',
     'el espejo no tiene la imagen colgada');
  const vEspejo = g('rod-cam-video');
  ok(/scaleX\(-1\)|matrix\(-1/.test(w.getComputedStyle(vEspejo).transform),
     '⚠️ y va ESPEJADA: sin espejar, mover el hombro derecho se ve moverse al izquierdo y se encuadra al revés',
     'el espejo no está espejado: ' + w.getComputedStyle(vEspejo).transform);

  w.eval('rodPrompterCerrar()');
  await esperar(300);
  ok(w.eval('window.__rodParadas') === 0,
     'cerrar el teleprompter con el monitor detrás NO apaga la cámara: la sigue mirando alguien',
     'se apagó la cámara que el monitor estaba usando');

  /* ⚠️ Y AL SALIR DE LA VISTA SE APAGA LA LUZ DE VERDAD. Soltar el
     `<video>` no para nada: hay que parar las PISTAS, o el aparato se
     queda con la cámara encendida detrás del chat o de las finanzas. */
  w.eval('document.getElementById("rod-back-btn").click()');
  await esperar(400);
  ok(w.eval('window.__rodParadas') >= 1,
     '⚠️ pero salir de la vista PARA LAS PISTAS: soltar el <video> deja la luz encendida',
     'al salir de El Rodaje la cámara se quedó encendida');
  ok(w.eval('FaroRodaje.camara.encendida()') === false,
     'y la herramienta lo sabe: no se queda creyendo que la tiene',
     'la herramienta cree que sigue teniendo la cámara');
  f.style.height = altoMarco;

  log('');
  log(fallos === 0 ? 'RESULTADO: APRUEBA' : `RESULTADO: SUSPENDE · ${fallos} fallo(s)`);
  document.title = fallos === 0 ? 'APRUEBA · El Rodaje' : 'SUSPENDE · El Rodaje';
})().catch(e => {
  log('✘ la sonda reventó: ' + (e && e.message) + '\n' + (e && e.stack));
  log('RESULTADO: SUSPENDE');
  document.title = 'SUSPENDE · El Rodaje';
});
</script>
</body>
</html>
