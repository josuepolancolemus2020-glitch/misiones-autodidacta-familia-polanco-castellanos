<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Poder, etapa 4</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-poder-activo/activo.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 4 de la Ruta del Poder: bancos, laboratorio, pruebas
   impresas con su nombre, las siete piezas del activo, los ocho ingresos del
   proyecto, la ficha y la ruta con CUATRO etapas.

   Se escribió mirando primero que fallara con la misión sin terminar: una
   comprobación que nunca se ha visto en rojo no se sabe si funciona. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Poder · Etapa 4 de 6/.test(d.body.textContent), 'se presenta como etapa 4 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se busca el VOCABULARIO propio de la etapa 3, no la
       palabra «deuda», que puede aparecer al citarla. Lo que no puede quedar
       es su temario: la tasa sobre saldos, la amortización y la cuota. */
    ok(!/sobre saldos|amortiza|costo total del crédito|tasa nominal/i.test(d.body.textContent),
       'sin restos de la etapa de la que se copió', 'queda el temario de La deuda por dentro');
    ok(!/La oferta sobre la mesa|Simulacro de Presión/.test(d.body.textContent), 'sin los rótulos heredados', 'quedan rótulos de otra misión');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'molde,copia,cobro,relevo', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas de un activo', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_eco_activo/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    ok(dentro('labParte') === 'molde', 'el laboratorio arranca en su primera pieza', 'arranca en: ' + dentro('labParte'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LA POSTURA ANTE EL INGRESO ──');
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/se para cuando tú te paras/i.test(texto), 'trae la frase maestra', 'falta «se para cuando tú te paras»');
    ok(/descansar cuesta dinero|descansar cueste dinero/i.test(texto), 'trae la señal de alarma de la etapa', 'falta la señal de alarma');
    ok(/semanas que puedes faltar/i.test(texto), 'dice cómo se mide la libertad', 'no dice cómo se mide la libertad');
    ok(/mantenimiento/i.test(texto), 'trae el mantenimiento', 'no aparece el mantenimiento');
    ok(/a nombre de quién/i.test(texto), 'trae la pregunta de la propiedad', 'no aparece la pregunta de la propiedad');
    ok(/con el sueldo/i.test(texto), 'dice que el activo se construye con el sueldo', 'no dice cómo se financia el activo');
    ok(/molde/i.test(texto), 'trae el molde', 'no aparece el molde');
    ok(/relevo/i.test(texto), 'trae el relevo', 'no aparece el relevo');
    ok(/afición cara/i.test(texto), 'nombra la afición cara', 'no avisa de la afición cara');
    /* Esta etapa se apoya en las tres anteriores a propósito */
    ok(/pasivo/i.test(texto), 'conecta con la etapa 1 (activos y pasivos)', 'no conecta con la etapa 1');
    ok(/presupuesto/i.test(texto), 'conecta con la etapa 2 (el presupuesto)', 'no conecta con la etapa 2');
    ok(/deuda/i.test(texto), 'conecta con la etapa 3 (la deuda)', 'no conecta con la etapa 3');

    log('\n── LA ESCALERA Y LOS DISFRACES ──');
    ['la hora', 'el paquete', 'el producto', 'el sistema']
      .forEach(k => { if (!new RegExp(k, 'i').test(texto)) { fallos++; log('  ✘ falta el escalón: ' + k); } });
    ok(/asesoría/i.test(texto) && /ilimitada/i.test(texto), 'trae el disfraz de la asesoría ilimitada', 'falta el disfraz de la asesoría');
    ok(/autoría/i.test(texto), 'trae el disfraz del activo de otro', 'falta el disfraz de la autoría');
    ok(/1\.500|1500/.test(texto), 'el caso del taller trae su cifra', 'no dice cuánto paga el taller');
    ok(/ochenta por ciento|80 por ciento/i.test(texto), 'el caso del cuaderno trae su cifra', 'no dice a cuánto está el cuaderno');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/El molde/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en «El molde»', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn.active-pri'), 'y con su botón resaltado', 'ningún botón del laboratorio queda resaltado');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la prueba «El escalón siguiente» se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|Los datos de los demás|Quién decide de verdad|Para quién y qué le cambia|El presupuesto real|La deuda por dentro|Pedir bien|Verificar|La IA que programa|La cuenta sobre la mesa|El contrato antes de firmar|la interpelación|Autocapacitación Técnica|Etapa 3/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');
    ok(!/cuánto se devuelve en total|condición por escrito/i.test(crit), 'las preguntas III y IV son las de esta etapa', 'quedan preguntas de la etapa 3');
    ok(/El ingreso sobre la mesa/.test(crit), 'la sección I lleva el nombre de esta etapa', 'la sección I no se llama «El ingreso sobre la mesa»');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['taller presencial', 'paquete', 'cuaderno', 'licencia anual', 'asesoría', 'curso grabado', 'autoría', 'ficha suelta']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      /* No puede repetir los casos de las etapas 1, 2 y 3 de esta misma ruta */
      ok(!/prestamista|tarjeta de crédito|punto de equilibrio|cuota que cabía/i.test(txt), 'no repite casos de las etapas anteriores', 'repite un caso de otra etapa de la ruta');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas del activo/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/hoja del activo/i.test(txt), 'trae la hoja del activo', 'falta la hoja del activo');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/sábado|cuaderno|asesoría|autoría|aplicación|taller|ficha/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-poder-activo.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/La hoja del activo/i.test(txt), 'la ficha trae la hoja del activo', 'falta la hoja del activo');
    ok(/La escalera: de la hora al sistema/i.test(txt), 'la ficha trae la escalera', 'falta la escalera');
    ok(/Cómo se guarda el material, en concreto/i.test(txt), 'la ficha dice cómo se guarda el material', 'falta el cómo se guarda el material');
    ok(/La cuenta del mes flojo/i.test(txt), 'la ficha trae la cuenta del mes flojo', 'falta la cuenta del mes flojo');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txt), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txt.match(/<table/g) || []).length === (txt.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar: un corte partió una tabla');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-poder-activo"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    /* Igualdad exacta: «Ruta del Poder Político» también contiene «Ruta del Poder». */
    const rp = [...da.querySelectorAll('.ruta-card')].find(c => ((c.querySelector('.ruta-nombre') || {}).textContent || '').trim() === 'Ruta del Poder');
    ok(!!rp, 'la Ruta del Poder está en el mapa', 'no aparece la ruta');
    if (rp) {
      /* La cuenta exacta de etapas tocables la lleva _dev/probe-rutas.html, que
         se actualiza cada vez que se añade una misión. Aquí solo se comprueba
         que esta etapa llegó al mapa y que las seis siguen listadas. */
      ok(rp.querySelectorAll('.re-link').length >= 4, 'con sus etapas 1 a 4 ya tocables', 'la etapa 4 no es tocable');
      ok(rp.querySelectorAll('.re-link').length + rp.querySelectorAll('.ruta-etapa-futura').length === 6, 'las 6 etapas de la ruta están en el mapa', 'etapas en el mapa: ' + (rp.querySelectorAll('.re-link').length + rp.querySelectorAll('.ruta-etapa-futura').length));
      ok(/Del salario al activo/.test(rp.textContent), 'la etapa 4 sale con el título de la misión', 'la etapa 4 sigue saliendo como prevista');
      ok(/Poder local/i.test(rp.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="eco"]');
    ok(!!chip, 'la materia Poder Económico tiene su chip', 'no hay chip de Poder Económico');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length >= 4, 'la materia muestra sus misiones', 'muestra ' + tarjetas.length);
      const ac = tarjetas.find(t => /Del salario al activo/i.test(t.textContent));
      ok(!!ac && /🔒/.test(ac.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
