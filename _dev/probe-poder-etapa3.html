<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Poder, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-poder-deuda/deuda.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta del Poder: bancos, laboratorio, pruebas
   impresas con su nombre, las ocho ofertas con su condición, que las cuentas
   de la misión no se contradigan entre sí, la ficha y la ruta con TRES etapas.
   Cada ok() se escribió mirando primero que fallara con la misión sin
   terminar, que es lo que enseña la etapa 3 de la Casa Cerrada. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Poder · Etapa 3 de 6/.test(d.body.textContent), 'se presenta como etapa 3 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se busca el VOCABULARIO propio de la etapa 2, no sus
       palabras compartidas. Costo fijo, margen y punto de equilibrio SÍ tienen
       que aparecer, porque esta etapa se apoya en ellos a propósito; lo que no
       puede quedar es su temario (los sobres, el costo por unidad, la hora). */
    ok(!/sobre del mes|costo de oportunidad|hoja que salió mal|muerte por goteo|costo por unidad|anuncios en el APK/i.test(d.body.textContent),
       'sin restos de la etapa de la que se copió', 'queda el temario de El presupuesto real');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'capital,tasa,plazo,total', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas de la deuda', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_eco_deuda/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LA POSTURA ANTE LA DEUDA ──');
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/cuánto puede(s)? pagar al mes/i.test(texto), 'nombra la pregunta que vende la deuda', 'no aparece la señal de alarma');
    ok(/sobre saldos/i.test(texto) && /sobre el monto/i.test(texto), 'distingue sobre saldos de sobre el monto', 'no distingue las dos formas de cobrar');
    ok(/regla del doble/i.test(texto), 'trae la regla del doble', 'falta la regla del doble');
    ok(/reparte, no abarata/i.test(texto), 'el plazo reparte y no abarata', 'no explica qué hace el plazo');
    ok(/costo total/i.test(texto), 'pone el costo total por encima de la cuota', 'no aparece el costo total');
    ok(/cuadro de amortización/i.test(texto), 'manda pedir el cuadro de amortización', 'no menciona el cuadro de amortización');
    /* Esta etapa se apoya en la 2 a propósito: si no rehace el equilibrio con
       la cuota dentro, se pierde el puente y la lección más útil */
    ok(/punto de equilibrio/i.test(texto), 'conecta con el presupuesto de la etapa 2', 'no conecta con la etapa anterior');
    ok(/veinte aulas|a veinte/i.test(texto), 'recalcula el equilibrio con la cuota dentro', 'no recalcula el equilibrio');

    log('\n── LAS CUENTAS NO SE CONTRADICEN ──');
    /* Un solo juego de números para toda la misión: si una cifra se cambia en
       un sitio y no en otro, la etapa enseña algo falso. */
    ok(/1\.560/.test(texto) && /2\.880/.test(texto), 'el préstamo de 12.000 trae sus dos intereses', 'faltan 1.560 o 2.880');
    ok((texto.match(/1\.240/g) || []).length >= 4, 'la primera cuota idéntica aparece en los dos lados', 'la cuota de 1.240 casi no aparece');
    ok(/18\.750/.test(texto), 'el desembolso real está en la misión', 'falta el desembolso de 18.750');
    ok(/13\.560/.test(texto) && /15\.000/.test(texto) && /16\.440/.test(texto), 'la tabla de plazos trae sus tres totales', 'la tabla de plazos no cuadra');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/El capital/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en el capital', 'abre en otra pieza');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el contrato antes de firmar se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|Los datos de los demás|La máquina que predice|Quién decide de verdad|Para quién y qué le cambia|El presupuesto real|Activos y Pasivos|La cuenta sobre la mesa|La sala de espejos|la interpelación|Autocapacitación Técnica/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');
    ok(!/cambio de funcionario/.test(crit), 'la comparación pregunta por lo que toca en esta etapa', 'la sección IV sigue preguntando por un funcionario');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 ofertas más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['sin intereses', '2% mensual', 'costo fijo nuevo', '18.750', 'tapar el mes', 'atrasó', 'refinanciación', 'adelanto del patrocinador']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      /* Norma 3: cada oferta cierra con la condición, no solo con el diagnóstico */
      ok((txt.match(/La condición con la que sí/g) || []).length === 8, 'las ocho ofertas traen su condición', 'ofertas con condición: ' + (txt.match(/La condición con la que sí/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      /* No puede repetir los casos de las etapas 1 y 2 de esta misma ruta */
      ok(!/4\.500|impresora|anuncios en el APK|refrigerio|300 tablets/i.test(txt), 'no repite casos de las etapas 1 y 2', 'repite un caso de otra etapa de la ruta');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas de la deuda/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/siete preguntas antes de firmar/i.test(txt), 'trae las siete preguntas', 'faltan las siete preguntas');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/sin intereses|2% mensual|18\.750|patrocinador|refinanciación/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-poder-deuda.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/La hoja de las siete preguntas antes de firmar/i.test(txt), 'la ficha trae la hoja de las siete preguntas', 'falta la hoja de las siete preguntas');
    ok(/cuadro de amortización de verdad/i.test(txt), 'la ficha trae el cuadro resuelto mes por mes', 'falta el cuadro de amortización trabajado');
    ok(/El cuadro en blanco/i.test(txt), 'la ficha trae el cuadro en blanco para llenar', 'falta el cuadro en blanco');
    ok(/El guion: qué decir en el mostrador/i.test(txt), 'la ficha trae el guion del mostrador', 'falta el guion');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txt), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txt.match(/<table/g) || []).length === (txt.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar: un corte partió una tabla');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-poder-deuda"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const eco = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Poder$/m.test((c.querySelector('.ruta-nombre') || {}).textContent || ''));
    ok(!!eco, 'la Ruta del Poder está en el mapa', 'no aparece la ruta');
    if (eco) {
      /* La cuenta exacta de etapas tocables la lleva _dev/probe-rutas.html, que
         se actualiza cada vez que se añade una misión. Aquí solo se comprueba
         que esta etapa llegó al mapa y que las seis siguen listadas: si esta
         sonda contara el total, se pondría en rojo cada vez que crece la ruta
         sin que nada de esta etapa se hubiera roto. */
      ok(eco.querySelectorAll('.re-link').length >= 3, 'con sus etapas 1, 2 y 3 ya tocables', 'la etapa 3 no es tocable');
      ok(eco.querySelectorAll('.re-link').length + eco.querySelectorAll('.ruta-etapa-futura').length === 6, 'las 6 etapas de la ruta están en el mapa', 'etapas en el mapa: ' + (eco.querySelectorAll('.re-link').length + eco.querySelectorAll('.ruta-etapa-futura').length));
      ok(/La deuda por dentro/.test(eco.textContent), 'la etapa 3 sale con el título de la misión', 'la etapa 3 sigue saliendo como prevista');
      ok(/Del salario al activo/i.test(eco.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="eco"]');
    ok(!!chip, 'la materia Poder Económico tiene su chip', 'no hay chip de Poder Económico');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length >= 3, 'la materia muestra sus misiones', 'muestra ' + tarjetas.length);
      const deu = tarjetas.find(t => /deuda/i.test(t.textContent));
      ok(!!deu && /🔒/.test(deu.textContent), 'la misión de la deuda lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
