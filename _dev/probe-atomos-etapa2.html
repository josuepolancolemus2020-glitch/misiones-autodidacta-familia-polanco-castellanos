<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de los Átomos y los Ídolos, etapa 2</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-atomos-hombre-maquina/hombre-maquina.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta de los Átomos y los Ídolos (Materialismo
   Filosófico, materia 23 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y las SEIS lecturas de las
   normas 5-quinquies y 5-nonies, con las dos entrevistas imaginadas
   declaradas y el careo como sexta) y las TRES BATERÍAS repartidas por
   lectura (30 de comprensión lectora, 12 de completar y 12 de análisis
   complejo, es decir 5, 2 y 2 en cada uno de los seis textos), con el
   plegado, la marca de lectura y la impresión comprobados de verdad.

   Las preguntas ya NO viven juntas al final de la sección: por eso aquí no
   se busca ningún #lcQ, #lfQ ni #laQ. Esa batería suelta desapareció con la
   norma 5-nonies, y buscarla sería comprobar que sigue puesto lo que se
   quitó a propósito.

   La REGLA DEL ESTATUS del compendio rige también aquí, y en esta etapa es
   media lección, así que se comprueba fuente por fuente: La Mettrie (1747)
   como clásico sólido COMO DOCUMENTO DE SU TIEMPO, y con la etiqueta dicha
   entera, porque su fisiología está superada y su gesto no; el prólogo de
   1859 y «La ideología alemana» como CLÁSICOS CUESTIONADOS; la carta de
   Engels a Bloch (1890) como el documento que niega el determinismo DESDE
   DENTRO; Popper (1957) como LA CRÍTICA CLÁSICA; Cohen (1978) como DEFENSA
   ANALÍTICA SERIA; y, dentro de las lecturas, Thompson (1967) como historia
   documentada frente a Lynn White Jr. (1962) como TESIS DISCUTIDA, que es
   la pareja con la que la etapa enseña a no ilustrarse solo con aciertos.

   Tres cuidados del arco se comprueban a máquina porque gobiernan la
   misión: que CONDICIONAR NO SEA DETERMINAR (el agua mueve los mazos y no
   elige el paño); que las críticas vayan AL LADO de la tesis y no en nota
   al pie; y que el reduccionismo de BROCHA GORDA quede marcado como el modo
   de fallar, con su regla de trato (se audita la institución y no se
   desprecia a la gente que vive dentro, empezando por la propia casa).
   Además, el CERO PARTIDISMO HONDUREÑO ACTUAL: aquí no hay ni un político
   vivo ni un partido nombrado, y la sonda lo verifica. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));
/* El guion largo se busca por su número y no se escribe nunca aquí. Si la
   sonda lo llevara dentro, el «grep -c» que la casa corre sobre sus propios
   archivos para cazar la norma 1-bis contaría los de la sonda como si fueran
   texto publicable, y el único modo de pasar la revisión sería borrar la
   comprobación, que es exactamente lo contrario de lo que hace falta. */
const RAYA = String.fromCharCode(0x2014);
const sinRaya = t => String(t).indexOf(RAYA) < 0;
const cuentaRayas = t => String(t).split(RAYA).length - 1;

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de los Átomos y los Ídolos · Etapa 2 de 6/.test(d.body.textContent), 'se presenta como etapa 2 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 3 de la Ruta de las Gafas. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-gafas-mapa-familias"], a[href*="ruta-gafas-bisturi-freeden"], a[href*="ruta-gafas-palabra-expediente"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"], a[href*="ruta-atomos-contra-miedo"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/Heywood|Freeden|Gallie|Mudde|Paxton|Griffin|Ur-Fascism|Sternhell|Colin Ward|Gellner|comunidades imaginadas/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la misión molde (el mapa de las familias)', 'queda vocabulario del mapa de las siete familias');
    ok(!/ideolog[íi]a delgada|anfitriona|siete familias|media página de acero|hoja del mapa/i.test(cuerpoSinEnlaces),
       'sin las piezas de la etapa molde', 'quedan piezas de la misión molde');
    ok(!/🧬/.test(cuerpoSinEnlaces), 'sin el emoji de la misión molde', 'queda el 🧬 del mapa de las familias fuera de los enlaces');
    /* La etapa 1 de ESTA ruta no se vuelve a explicar: aquí se sube dos
       escalones. Su vocabulario solo puede aparecer como distractor de un
       banco, nunca como temario, así que se mira el texto de la página. */
    ok(!/clinamen|De rerum natura|El Jardín/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la etapa 1 de la ruta', 'queda vocabulario de la etapa 1 (átomos contra el miedo)');
    /* Y lo que SÍ tiene que quedar: la pregunta de la materia, que es la que
       sube de escala, y los enlaces declarados a las etapas hermanas. */
    ok(/de qué está hecho/i.test(d.body.textContent) && /qué lo sostiene/i.test(d.body.textContent),
       'la pregunta de la materia sigue nombrada (de qué está hecho y qué lo sostiene)', 'se perdió la pregunta de la materia');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-atomos-contra-miedo"]'),
       'Recursos declara la etapa 1 de la ruta', 'falta el enlace declarado a la etapa 1');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-rojo-acero-juicio"]'),
       'y remite el tribunal completo a Marx al Expediente Rojo', 'no remite el tribunal a Marx a su materia');
    ok(sinRaya(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + cuentaRayas(d.body.textContent) + ' guiones largos');
    /* Cero partidismo hondureño actual: en esta etapa se cumple por
       ausencia, y la ausencia se comprueba. Se descuentan dos usos que no
       nombran a nadie y que el careo necesita decir para separar el método
       de la militancia («política de partido», «método y no partido»): sin
       ese descuento, la única manera de aprobar sería borrar del careo la
       frase que declara que ahí no se discute de bandos, que es justo lo
       que esta comprobación quiere garantizar. Un partido de verdad llega
       siempre con su nombre detrás, y ese sigue cazado. */
    const cuerpoSinPartido = d.body.textContent
      .replace(/presenta|presente|presentar[a-z]*|presencia/gi, '')
      .replace(/política de partido|método y no partido/gi, '');
    ok(!/\b(partido|diputad|alcalde|presidenta?|candidat)[a-zóí]*\b/i.test(cuerpoSinPartido),
       'ni un político vivo ni un partido nombrado (cero partidismo actual)', 'aparece un cargo o un partido de la política de hoy');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/La Mettrie/.test(texto0) && /El hombre máquina/.test(texto0) && /1747/.test(texto0),
       'La Mettrie (1747) con el título de su obra', 'falta La Mettrie con su obra y su año');
    ok(/clásico sólido como documento de su tiempo/i.test(texto0), 'y su etiqueta de clásico sólido como documento de su tiempo', 'falta la etiqueta de La Mettrie');
    ok(/fisiología está superada/i.test(texto0) && /su gesto no/i.test(texto0),
       'y dicha ENTERA, porque es media lección: la fisiología superada y el gesto no', 'la etiqueta de La Mettrie no se dice entera');
    ok(/Prólogo a la Contribución/.test(texto0) && /1859/.test(texto0),
       'el prólogo de 1859 con su título completo', 'falta el prólogo de 1859 con su título');
    ok(/La ideología alemana/.test(texto0) && /1845/.test(texto0) && /1932/.test(texto0),
       '«La ideología alemana», escrita en 1845 y 1846 y publicada entera en 1932', 'falta «La ideología alemana» con sus dos fechas');
    ok((texto0.match(/clásico cuestionado/gi) || []).length >= 2,
       'y los dos textos de Marx declarados clásicos cuestionados', 'falta la etiqueta de clásico cuestionado');
    ok(/Engels/.test(texto0) && /Bloch/.test(texto0) && /21 de septiembre de 1890/.test(texto0),
       'la carta de Engels a Joseph Bloch, con su fecha exacta', 'falta la carta de Engels a Bloch con su fecha');
    ok(/desde dentro/i.test(texto0), 'y declarada el documento que niega el determinismo desde dentro', 'no se dice que la carta de Engels zanja la caricatura desde dentro');
    ok(/Popper/.test(texto0) && /La miseria del historicismo/.test(texto0) && /1957/.test(texto0) && /crítica clásica/i.test(texto0),
       'Popper (1957) como la crítica clásica', 'falta Popper etiquetado');
    ok(/Cohen/.test(texto0) && /1978/.test(texto0) && /defensa analítica seria/i.test(texto0),
       'G. A. Cohen (1978) como defensa analítica seria', 'falta Cohen etiquetado');
    ok(/Thompson/.test(texto0) && /1967/.test(texto0), 'E. P. Thompson (1967) está en la misión', 'falta Thompson');
    ok(/Lynn White/.test(texto0) && /1962/.test(texto0) && /tesis discutida/i.test(texto0),
       'y Lynn White Jr. (1962) marcado como TESIS DISCUTIDA', 'falta Lynn White etiquetado como tesis discutida');
    ok(/pastiche/i.test(texto0) && /no obra de esos autores/i.test(texto0),
       'y el pastiche de las lecturas declarado', 'el pastiche no se declara en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15,
       'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'maquina,base,condiciona,criticas', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos del camino de la tesis', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    /* El rótulo del logro se quedó diciendo 15 cuando el banco creció a 25:
       texto falso en la vitrina. Se fija al tamaño real del banco para que
       no vuelva a pasar si el banco cambia. */
    ok(new RegExp('Las ' + dentro('lectComprensionBank.length') + ' preguntas').test(dentro('ACHIEVEMENTS.lect_master.label')),
       'y su rótulo cuenta las mismas preguntas que el banco (' + dentro('lectComprensionBank.length') + ')', 'lect_master miente: ' + dentro('ACHIEVEMENTS.lect_master.label'));
    /* Lo mismo pasó con el texto que se comparte por WhatsApp: siguió
       diciendo tres lecturas y 35 preguntas cuando ya eran cinco y 45, y
       volvió a quedarse corto al llegar el careo. */
    ok(/seis lecturas y sus 54 preguntas/.test(dentro('compartirMision.toString()')) && !/tres lecturas|cinco lecturas|35 preguntas|45 preguntas/.test(dentro('compartirMision.toString()')),
       'el texto de compartir cuenta seis lecturas y sus 54 preguntas', 'compartirMision sigue contando las lecturas viejas');
    /* Las tres baterías, ya repartidas por lectura (norma 5-nonies): seis
       textos por 5, 2 y 2 dan 30, 12 y 12. */
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos POR LECTURA.
       Sin esto, una lectura se publica con su tarjeta de preguntas vacía y
       nadie se entera hasta que un alumno la abre. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis sin pauta');
    /* La etiqueta de voz también en análisis, que antes no la tenía: es lo
       que decide dentro de qué texto se pinta cada pregunta. */
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada análisis dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* El número de cabeza («1.», «7.») era el del banco global: con dos
       preguntas por lectura ese número mentiría. */
    ok(dentro('lectAnalisisBank.every(q => !/^\\s*\\d+\\./.test(q.q))'),
       'y ninguno arrastra el número del banco viejo', 'algún análisis sigue numerado con el número global');
    ok(/faro_atomos_maquina/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/condiciona/i.test(texto) && /no determina|no es determinar/i.test(texto),
       'condicionar no es determinar, que es el eje de la etapa', 'falta el eje de la etapa');
    ok(/el agua mueve los mazos/i.test(texto) && /no elige el paño|no decide qué paño|no escoge el paño/i.test(texto),
       'la imagen del batán: el agua mueve los mazos y no elige el paño', 'falta la imagen que resume la etapa');
    ok(/verbo/i.test(texto) && /«condiciona»|condiciona<|condiciona,/i.test(texto),
       'el verbo del texto de 1859 señalado como el detalle que casi nadie mira', 'no se subraya el verbo del prólogo');
    ok(/base/i.test(texto) && /(se levanta encima|superestructura)/i.test(texto),
       'la base y lo que se levanta encima, nombradas', 'faltan las dos piezas de 1859');
    ok(/ideas dominantes/i.test(texto) && /clase dominante/i.test(texto),
       'la fórmula de las ideas dominantes de cada época', 'falta la fórmula de «La ideología alemana»');
    ok(/inmuniz/i.test(texto), 'la inmunización, con el nombre que le puso Popper', 'falta el mecanismo de la inmunización');
    ok(/1917/.test(texto) && /(poco industrializado|menos industrializados)/i.test(texto),
       'la profecía que falló: 1917 en un país poco industrializado', 'falta el fallo con fecha de la versión dura');
    ok(/brocha gorda/i.test(texto), 'el reduccionismo de brocha gorda como el modo de fallar', 'falta el modo de fallar de la etapa');
    ok(/lo dice porque le pagan|dice eso porque le pagan/i.test(texto),
       'con su frase típica, la que hay que aprender a no escribir', 'falta la frase típica de la brocha gorda');
    ok(/no se desprecia a la gente que vive dentro/i.test(texto),
       'la regla de trato: se audita la institución y no se desprecia a la gente', 'falta la regla de trato');
    ok(/qué tendría que pasar para que (esto|eso) fuera falso/i.test(texto),
       'la prueba de una línea, escrita entera', 'falta la prueba de una línea');
    ok(/sobrevive/i.test(texto) && /(ácido universal|no es un ácido)/i.test(texto),
       'lo que sobrevive a la auditoría: no es un ácido universal', 'falta lo que sobrevive entero');
    ok(/al lado de la tesis/i.test(texto) && /nota al pie/i.test(texto),
       'las críticas van al lado de la tesis y no en nota al pie', 'no se dice dónde van las críticas');
    ok(/frontera/i.test(texto) && /(etapa 3|conciencia)/i.test(texto),
       'la frontera con la conciencia, declarada y no cruzada', 'la etapa no declara su frontera');
    ok(/de qué vive/i.test(texto), 'la pregunta de andar por casa: de qué vive', 'falta la pregunta de andar por casa');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/doña Rosa/i.test(tg), 'el guion tiene personaje, y no es una clase hablada', 'el guion no tiene personaje');
      ok(/7:00|6:10 a 7:00/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(1747|1751|1848|1859|1890|1917|1957|1962|1967|1978)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/1747/.test(tg) && /1859/.test(tg) && /1890/.test(tg) && /1957/.test(tg), 'el guion trae las fechas de la etapa', 'al guion le faltan fechas');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl) && /Rosa Montero/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl), 'las cinco primeras voces están nombradas', 'faltan las voces');
      ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
      /* La prosa de entrada tiene que contar seis y nombrar el careo: es lo
         primero que se lee y es donde antes se quedaba escrito «cinco». */
      ok(/[Ss]eis lecturas/.test(tl) && /careo/i.test(tl), 'la entrada de la sección cuenta seis y nombra el careo', 'la entrada sigue anunciando cinco lecturas');
      ok(/cinco de comprensión, dos de completar y dos de análisis/i.test(tl),
         'y avisa de que cada lectura trae sus propias preguntas debajo', 'no se avisa de que las preguntas van dentro de cada lectura');
      ok(/plegadas/i.test(tl), 'y de que las seis empiezan plegadas', 'no se avisa del plegado');
      /* La etiqueta del estatus tiene que separar los cinco primeros del
         sexto: son dos géneros distintos y una sola etiqueta para los seis
         estaría mintiendo sobre uno de los dos lados. */
      ok(/cinco primeros/i.test(tl), 'la etiqueta habla de los cinco primeros como pastiche', 'la etiqueta mete los seis textos en el mismo saco');
      ok(/no imita a nadie/i.test(tl) && /papeles/i.test(tl),
         'y del sexto dice que no imita a nadie y que sus turnos los firman papeles', 'la etiqueta no distingue al careo de los pastiches');
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(/El silbato de las seis/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/De lo que sonaba en la oscuridad/.test(tl) && /Sancho/.test(tl) && /don Quijote/.test(tl), 'el capítulo cervantino está, con Sancho adentro', 'falta el capítulo cervantino');
      ok(/La especie que piensa con lo que tiene en las manos/.test(tl) && /(especie|humanos)/i.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las dos entrevistas de la norma 5-quinquies: el genero exige que la
         ficcion del encuentro se declare a la vista, porque una entrevista
         fotocopiada sin esa linea circula como si hubiera pasado. */
      const notaEntrevista = d.querySelector('#lect-entrevista .lect-nota');
      ok(!!notaEntrevista && /nunca ocurrió/.test(notaEntrevista.textContent),
         'la entrevista de la casa existe y su nota declara que el encuentro nunca ocurrió', 'falta #lect-entrevista o su nota no declara la ficción');
      const notaGala = d.querySelector('#lect-gala .lect-nota');
      ok(!!notaGala && /nunca ocurrió/.test(notaGala.textContent),
         'la conversación del Loco de la Colina existe y declara que nunca ocurrió', 'falta #lect-gala o su nota no declara la ficción');
      /* Los topes del pliego, medidos a máquina (acotaciones incluidas):
         la entrevista va de 900 a 1400 palabras y la conversación de 700 a
         1200, con sus intercambios contados. Sin este tope, cada retoque
         engorda los textos y la lectura de noche se vuelve tarea.
         El techo de la conversación era 1100 y el texto quedó escrito en
         1099: un tope que se aprueba por una palabra no frena nada, solo
         hace que la siguiente coma suspenda la sonda entera por un motivo
         que no tiene que ver con el cambio que se esté haciendo. Sube a
         1200, que le deja el mismo margen de holgura que ya tiene la
         entrevista (1230 escritas contra 1400). El tope es un freno al
         engorde, no una meta a la que acercarse. */
      const midePalabras = id => [...d.querySelectorAll('#' + id + ' .lect-p')]
        .map(p => p.textContent.trim()).join(' ').split(/\s+/).filter(Boolean).length;
      const palEnt = midePalabras('lect-entrevista'), palGala = midePalabras('lect-gala');
      ok(palEnt >= 900 && palEnt <= 1400, 'la entrevista mide ' + palEnt + ' palabras, dentro de su rango (900 a 1400)', 'la entrevista mide ' + palEnt + ' palabras, fuera del rango 900 a 1400');
      ok(palGala >= 700 && palGala <= 1200, 'la conversación mide ' + palGala + ' palabras, dentro de su rango (700 a 1200)', 'la conversación mide ' + palGala + ' palabras, fuera del rango 700 a 1200');
      const turnosGala = [...d.querySelectorAll('#lect-gala .lect-p strong')].filter(s => /QUINTERO\./.test(s.textContent)).length;
      ok(turnosGala >= 10 && turnosGala <= 14, 'y sus ' + turnosGala + ' intercambios caben en el rango (10 a 14)', 'intercambios de la conversación: ' + turnosGala);
      ok(/La fiebre y la máquina/.test(tl) && /Rosa Montero/.test(tl) && /El País/.test(tl),
         'la entrevista está firmada a la manera de Rosa Montero, con su medio real', 'la entrevista no presenta a su entrevistadora real');
      ok(/entrevistas imposibles/i.test(tl) && /(Italo Calvino|RAI)/.test(tl),
         'y se acoge al género real de las entrevistas imposibles', 'no se declara el género de las entrevistas imposibles');
      ok(/MONTERO\./.test(tl) && /LA METTRIE\./.test(tl) && /Boerhaave/.test(tl) && /1745/.test(tl),
         'La Mettrie contesta con su biografía real delante (Boerhaave, la quema de 1745)', 'a la entrevista le faltan las anclas biográficas de La Mettrie');
      ok(/El agua no elige el paño/.test(tl) && /QUINTERO\./.test(tl) && /GALA\./.test(tl),
         'la conversación Quintero y Gala está, con sus voces marcadas a la manera de teatro', 'falta la conversación o el diálogo no va marcado con nombres');
      ok(/\(Silencio/.test(tl), 'los silencios de Quintero van escritos como acotación', 'la conversación no trae los silencios de Quintero');
      ok(/Troylo/.test(tl) && /Anillos para una dama/.test(tl) && /El manuscrito carmesí/.test(tl),
         'Gala habla con sus anclas reales (Troylo, el teatro de 1973, el Planeta de 1990)', 'a Gala le faltan sus anclas reales');
      /* Las rayas de diálogo del capítulo cervantino son guiones largos y
         violan la norma 1-bis: van en paréntesis. Se comprueba aquí porque
         es el error que se cazó en una misión anterior. */
      ok(/\(dijo don Quijote\)|\(dijo Sancho\)|\(respondió Sancho\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL. La sonda exige las
         anclas comprobables y la declaración de datos reales. */
      ok(/reales y comprobables/i.test(tl) && /citas inventadas/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/La Mettrie/.test(tl) && /1747/.test(tl), 'ancla real: La Mettrie y «El hombre máquina» (1747)', 'falta La Mettrie dentro de los textos');
      ok(/1751/.test(tl) && /Federico II/.test(tl), 'ancla real: la muerte en Berlín en 1751 bajo Federico II', 'falta el ancla de Berlín y Federico II');
      ok(/Phineas Gage/.test(tl) && /1848/.test(tl) && /historiadores/i.test(tl), 'ancla real: Phineas Gage (1848), con la corrección de los historiadores', 'falta Gage con su corrección');
      ok(/1859/.test(tl) && /condiciona/i.test(tl), 'ancla real: el prólogo de 1859 y su verbo', 'falta el prólogo de 1859 dentro de los textos');
      ok(/Engels/.test(tl) && /Bloch/.test(tl) && /1890/.test(tl), 'ancla real: la carta de Engels a Bloch (1890)', 'falta la carta de Engels dentro de los textos');
      ok(/Popper/.test(tl) && /1957/.test(tl) && /Cohen/.test(tl) && /1978/.test(tl), 'anclas reales: Popper (1957) y Cohen (1978)', 'faltan Popper y Cohen dentro de los textos');
      ok(/marxismo analítico/i.test(tl), 'y el marxismo analítico nombrado', 'falta el marxismo analítico');
      ok(/Thompson/.test(tl) && /1967/.test(tl), 'ancla real: E. P. Thompson (1967)', 'falta Thompson dentro de los textos');
      ok(/Lynn White/.test(tl) && /1962/.test(tl), 'ancla real: Lynn White Jr. (1962)', 'falta Lynn White dentro de los textos');
      ok(/1917/.test(tl), 'ancla real: la revolución de 1917 donde no se esperaba', 'falta el fallo de 1917 dentro de los textos');
      ok(/remesas/i.test(tl) && /Banco Mundial/.test(tl), 'ancla real: el peso de las remesas según el Banco Mundial', 'falta la cifra de las remesas con su fuente');
      ok(/batanes/i.test(tl) && /1605/.test(tl) && /capítulo veinte/i.test(tl),
         'ancla real declarada: la aventura de los batanes (Quijote I, 20, de 1605)', 'falta el ancla real del capítulo cervantino');
      /* Y las anclas de las otras misiones NO se repiten. */
      ok(!/rebuzno|Samuel Johnson|yelmo de Mambrino|galeotes|Declaración Universal|Montesinos/i.test(tl.replace(/La cueva de Montesinos|El pleito de la bacía/g, '')),
         'no repite las anclas cervantinas ya usadas en otras misiones', 'repite un ancla ya usada en la serie');
      /* Las lecturas deben ENSEÑAR el tema, no solo sonar bonito */
      ok(/brocha gorda|todo lo que la gente dice lo dice por lo que cobra/i.test(tl) && /desmentir/i.test(tl),
         'las lecturas enseñan el tema de la etapa', 'las lecturas no tocan el tema');
      ok(/solo se ilustra con sus aciertos/i.test(tl), 'y traen la lección del contraejemplo obligatorio', 'los textos no cargan la lección del contraejemplo');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie:
       enfrenta dos posturas reales. Por eso su etiqueta es distinta y por
       eso aquí se exige lo contrario que a los otros cinco: que NO diga «no
       es obra de ese autor» (no hay autor imitado) y que sí diga que los
       turnos los firman papeles y no personas. Publicar palabras inventadas
       en boca de investigadores vivos (Brenner, Acemoglu, Robinson) sería
       exactamente el inflado que esta etapa caza. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent;
      const notaC = (careo.querySelector('.lect-nota') || {}).textContent || '';
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no se le pone a nadie una palabra en la boca|y no personas/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(/tercera persona/i.test(notaC), 'y que a las personas reales se las cita en tercera persona', 'la nota no dice cómo entran las personas reales');
      ok(/mejor versión/i.test(notaC), 'y que cada postura va en su mejor versión (el acero antes del juicio)', 'el careo no declara la regla del acero');
      /* Las seis partes obligatorias, y en su orden. */
      ok(/pregunta en disputa/i.test(tc), '1. plantea la pregunta en disputa', 'al careo le falta la pregunta en disputa');
      ok(tc.indexOf('LA DEFENSA.') < tc.indexOf('LA OBJECIÓN.'), '2 y 3. las dos posturas, cada una en su turno', 'las dos posturas no se presentan en orden');
      ok(tc.indexOf('Réplicas') > 0 && tc.indexOf('Réplicas') > tc.indexOf('LA OBJECIÓN.'), '4. las réplicas van después de las dos posturas', 'al careo le faltan las réplicas');
      ok(/terreno común/i.test(tc) && /aceptan/i.test(tc), '5. dice qué aceptan las dos posturas', 'al careo le falta el terreno común');
      ok(/sigue en disputa/i.test(tc), '6. dice qué sigue en disputa', 'el careo no dice qué queda sin resolver');
      ok(/dato lo resolvería|Qué dato/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');
      /* Las anclas de ESTA disputa, que son reales y comprobables: autores,
         años y revistas que de verdad están dentro del texto. */
      ok(/bedingt/.test(tc) && /bestimmt/.test(tc) && /1859/.test(tc), 'ancla real: los dos verbos del prólogo de 1859', 'faltan bedingt y bestimmt, que son la pregunta del careo');
      ok(/Cohen/.test(tc) && /1978/.test(tc) && /tesis del desarrollo/i.test(tc) && /tesis de la primacía/i.test(tc),
         'ancla real: Cohen (1978) con sus dos tesis separadas', 'falta la defensa analítica con sus dos tesis');
      ok(/Cohen/.test(tc) && /Theory and Society/.test(tc) && /1982/.test(tc), 'ancla real: la respuesta de Cohen a Elster en Theory and Society (1982)', 'falta la respuesta publicada de Cohen');
      ok(/Thompson/.test(tc) && /1967/.test(tc) && /Past/.test(tc), 'ancla real: Thompson (1967) en Past & Present', 'falta el trabajo de archivo de la defensa');
      ok(/Brenner/.test(tc) && /1976/.test(tc) && /Roemer/.test(tc) && /1986/.test(tc),
         'ancla real: Brenner (1976) y su disputa con Cohen en el volumen de Roemer (1986)', 'falta Brenner con su pelea interna');
      ok(/Engels/.test(tc) && /Bloch/.test(tc) && /21 de septiembre de 1890/.test(tc), 'ancla real: la carta de Engels a Bloch (1890)', 'falta la carta que niega el determinismo desde dentro');
      ok(/Popper/.test(tc) && /Conjeturas y refutaciones/.test(tc) && /1963/.test(tc) && /giro convencionalista/i.test(tc),
         'ancla real: Popper (1963) y el giro convencionalista', 'falta el cargo de Popper con su obra y su año');
      ok(/Economica/.test(tc) && /1944/.test(tc) && /1957/.test(tc), 'y «La miseria del historicismo» con sus dos fechas, sin confundir obras', 'el careo confunde las obras de Popper');
      ok(/Elster/.test(tc) && /1985/.test(tc) && /microfundamentos/i.test(tc), 'ancla real: Elster (1982 y 1985) y los microfundamentos', 'falta la objeción de los microfundamentos');
      ok(/Lakatos/.test(tc) && /1970/.test(tc) && /1973/.test(tc) && /degenerativo/i.test(tc),
         'ancla real: Lakatos (1970 y 1973), incluido su veredicto en contra', 'falta Lakatos o falta su veredicto');
      ok(/Weber/.test(tc) && /1904/.test(tc) && /1905/.test(tc) && /Archiv/.test(tc), 'ancla real: Weber (1904 y 1905) con su revista', 'falta Weber al fondo de la objeción');
      ok(/Sawyer/.test(tc) && /Hilton/.test(tc) && /1963/.test(tc) && /Bachrach/.test(tc) && /1970/.test(tc),
         'ancla real: las réplicas al estribo de Lynn White (1963 y 1970)', 'falta la explicación material elegante que se perdió');
      ok(/1917/.test(tc), 'ancla real: el caso con fecha de la objeción, 1917', 'falta el fallo de 1917 dentro del careo');
      ok(/Zasulich/.test(tc) && /1881/.test(tc), 'ancla real: los borradores de la carta a Vera Zasulich (1881)', 'falta la respuesta de la defensa a 1917');
      ok(/Diamond/.test(tc) && /1997/.test(tc) && /Acemoglu/.test(tc) && /Robinson/.test(tc) && /2012/.test(tc) && /Coreas/.test(tc),
         'ancla real: el experimento natural de las dos Coreas, con sus dos libros', 'falta el ejemplo de la forma de la prueba');
      ok(/no arbitra/i.test(tc), 'y el careo declara que ese caso NO arbitra la disputa', 'el careo usa las dos Coreas como si fuera el juez');
      /* Que las dos posturas estén de verdad, y no una y su caricatura. */
      ok(/Concedido/i.test(tc), 'cada lado le concede algo al otro', 'ningún lado concede nada: es un careo de paja');
      ok(/falacia genética/i.test(tc), 'y el terreno común llega hasta la falacia genética', 'el careo no cierra con la regla que la etapa necesita');
      ok(sinRaya(tc), 'y el careo va sin guiones largos (norma 1-bis)', 'el careo trae guiones largos');
    }

    log('\n── EL APARATO DE LECTURAS Y EL MARCADOR (normas 5-septies y 5-nonies) ──');
    /* Los cuatro enganches, uno por uno. Que falten se caza de rebote más
       abajo, porque sin ellos no existirían FaroLecturas ni FaroMarcador,
       pero entonces el informe diría «no arrancó» y no cuál de las cuatro
       líneas se cayó al copiar el molde. */
    ok(!!d.querySelector('link[href*="lecturas.css"]'), 'la misión carga la hoja del aparato de lecturas', 'falta css/lecturas.css');
    ok(!!d.querySelector('script[src*="lecturas.js"]'), 'y el aparato de lecturas', 'falta js/lecturas.js');
    ok(!!d.querySelector('link[href*="lecturas-marcador.css"]'), 'la misión carga la hoja del marcador', 'falta css/lecturas-marcador.css');
    ok(!!d.querySelector('script[src*="lecturas-marcador.js"]'), 'y el aparato del marcador', 'falta js/lecturas-marcador.js');
    /* Y el ORDEN, que no lo verificaba nadie: el marcador necesita el
       documento ya montado para saber cuáles son sus zonas subrayables, así
       que lecturas.js va ANTES (norma 5-nonies). Invertidas las dos líneas,
       las dos existen, las dos arrancan y las zonas salen mal: un fallo que
       no deja rastro en ninguna otra comprobación. */
    const guiones = [...d.querySelectorAll('script[src]')].map(g => g.getAttribute('src') || '');
    const iAparato = guiones.findIndex(g => /(^|\/)lecturas\.js/.test(g));
    const iMarcador = guiones.findIndex(g => /lecturas-marcador\.js/.test(g));
    ok(iAparato >= 0 && iMarcador > iAparato,
       'y el aparato se carga antes que el marcador, que es lo que pide la norma',
       'orden de carga equivocado: lecturas.js va en ' + iAparato + ' y lecturas-marcador.js en ' + iMarcador);

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');
    w.go('s-lecturas'); await esperar(400);
    ok(typeof w.FaroLecturas === 'object', 'el aparato de lecturas arrancó', 'FaroLecturas no existe');
    const voces = w.FaroLecturas.voces();
    ok(voces.length === 6, 'el aparato monta las seis lecturas', 'monta ' + voces.length);
    ok(voces.every(v => v.comprension === 5 && v.completar === 2 && v.analisis === 2),
       'y cada una con sus 5, 2 y 2 preguntas', 'alguna lectura se queda sin preguntas: '
       + voces.map(v => v.clave + ' ' + v.comprension + '/' + v.completar + '/' + v.analisis).join(' · '));
    /* Todas cerradas al entrar: es la mitad del encargo. Y se comprueba con
       el alto calculado, no con el atributo, porque ya pasó una vez que un
       display de la tarjeta le ganaba a [hidden] y el pliegue se veía
       abierto igual (las etapas de «Mis Rutas»). */
    ok(voces.every(v => !v.abierta), 'las seis empiezan plegadas', 'alguna empieza abierta');
    const cuerpos = [...d.querySelectorAll('#s-lecturas .lect-cuerpo')];
    ok(cuerpos.length === 6, 'cada lectura tiene su pliegue', 'pliegues: ' + cuerpos.length);
    ok(cuerpos.every(c => w.getComputedStyle(c).display === 'none'),
       'y de verdad no ocupan sitio (display calculado, no solo [hidden])', 'algún pliegue se ve abierto');
    const indice = d.getElementById('lectIndice');
    ok(!!indice, 'existe el índice para elegir lectura', 'falta el índice');
    ok(!!indice && indice.querySelectorAll('.lect-ind-btn').length === 6, 'con sus seis botones', 'botones del índice: ' + (indice ? indice.querySelectorAll('.lect-ind-btn').length : 0));
    /* La leyenda del código de colores va arriba del todo, antes de subrayar
       nada (norma 5-septies). En las misiones con lecturas nunca aparecía,
       porque el marcador la buscaba dentro de la primera zona y la primera
       zona ES una tarjeta. Ahora vive en el índice. */
    ok(!!indice && !!indice.querySelector('.fm-leyenda'), 'y con la leyenda del código de colores', 'la leyenda no está arriba');

    log('\n── ABRIR UNA LECTURA, Y SUS PROPIAS PREGUNTAS ──');
    d.querySelector('#lectIndice .lect-ind-btn[data-va="debate"]').click();
    await esperar(500);
    const careoCard = d.getElementById('lect-debate');
    ok(careoCard.classList.contains('lect-abierta'), 'tocar el índice abre esa lectura', 'no se abrió');
    ok(w.getComputedStyle(careoCard.querySelector('.lect-cuerpo')).display !== 'none', 'y su pliegue se ve', 'el pliegue sigue oculto');
    /* Acordeón: abrir una cierra la anterior, o volvemos a las veinte
       pantallas de alto que el encargo viene a quitar. */
    d.querySelector('#lectIndice .lect-ind-btn[data-va="borges"]').click();
    await esperar(400);
    ok(!careoCard.classList.contains('lect-abierta'), 'y abrir otra cierra la anterior', 'quedan dos abiertas a la vez');

    const bloques = careoCard.querySelectorAll('.lect-bloque');
    ok(bloques.length === 3, 'cada lectura trae sus tres baterías dentro', 'baterías del careo: ' + bloques.length);
    ok(!d.querySelector('#lcQ, #lfQ, #laQ'), 'y ya no hay una batería suelta al final de la sección', 'sigue la batería vieja al final');

    /* Contestar de verdad, en el cuento de Borges, y que pague XP. */
    const borgesCard = d.getElementById('lect-borges');
    const bloqueC = borgesCard.querySelector('.lect-bloque[data-b="c"]');
    ok(/Pregunta 1 de 5/.test(bloqueC.querySelector('.lect-prog').textContent), 'la comprensión de la lectura cuenta 5', 'contador: ' + bloqueC.querySelector('.lect-prog').textContent);
    ok(bloqueC.querySelectorAll('.lect-opt').length === 4, 'con sus cuatro opciones', 'opciones: ' + bloqueC.querySelectorAll('.lect-opt').length);
    const xp0 = dentro('xp');
    const claveB = dentro('lectComprensionBank.filter(q => q.t === "Borges")[0].c');

    log('\n── LA BARRA SE ABRE JUNTO A LO SELECCIONADO (norma 5-sexies, revisada) ──');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    log('\n── LA MARCA DE LECTURA, QUE LA PONE EL LECTOR (norma 5-nonies) ──');
    ok(typeof w.FaroMarcador.lugar === 'function', 'el marcador sabe dónde se quedó uno', 'falta FaroMarcador.lugar');
    /* PRIMERO: que NO se ponga sola. La versión anterior la ponía un
       observador según qué párrafo cruzara la franja central de la
       pantalla, y el autor la mandó quitar porque una raya que se mueve
       al lado del texto desconcentra justo mientras se lee. Si alguien la

    w.localStorage.removeItem(dentro('SAVE_KEY') + '_lugar');

    psL[Math.min(4, psL.length - 1)].scrollIntoView({ block: 'center' });

    ok(!d.querySelector('.fm-aqui'), 'y no aparece nada pintado en el texto', 'apareció una marca sin que nadie la pusiera');
    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');

    /* LA PONE EL LECTOR, desde la misma barra con la que subraya, y va

    const parrL = psL[0];
    const altoAntes = parrL.getBoundingClientRect().height;
    seleccionar(parrL, 10, 26);
    await esperar(420);
    const btnAqui = d.getElementById('fmBtnAqui');
    ok(!!btnAqui && btnAqui.style.display !== 'none', 'la barra de marcar trae «Aquí me quedé»', 'no está el botón de la marca de lectura');
    btnAqui.click();
    await esperar(400);
    const aqui = d.querySelectorAll('#lect-borges .fm-aqui');
    ok(aqui.length >= 1, 'y marca justo lo seleccionado', 'no se pintó la marca de lectura');
    ok(aqui.length && aqui[0].textContent.length > 0 && parrL.textContent.indexOf(aqui[0].textContent) >= 0,
       'sobre las palabras del texto, no sobre el párrafo entero', 'la marca no cayó dentro del párrafo');
    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖, aunque cruce una negrita', 'salió más de un marcador');
    const lug = w.FaroMarcador.lugar();
    ok(!!lug && lug.l === 'borges', 'el marcador la apunta', 'no apuntó nada: ' + JSON.stringify(lug));
    ok(!!w.localStorage.getItem(dentro('SAVE_KEY') + '_lugar'), 'y la guarda en este aparato', 'no quedó guardada');
    /* No puede añadir alto: en una ficha, un renglón de más parte una
       hoja y deja once (norma 5-octies). */
    ok(Math.abs(parrL.getBoundingClientRect().height - altoAntes) < 1.5,
       'y no le añade alto al párrafo', 'la marca empujó el texto: ' + altoAntes + ' → ' + parrL.getBoundingClientRect().height);
    /* Y lo que costó media hora encontrar la primera vez: el párrafo
       marcado TIENE QUE SEGUIR SIENDO MARCABLE. En las fichas y en la
       prosa de las rutas del adulto lo marcable se reconoce por NO tener

    ok(w.FaroMarcador.esMarcable(parrL), 'y el párrafo se sigue pudiendo subrayar', 'la marca deja el párrafo fuera del marcador');

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón

       impresora. Lo que no puede faltar en ninguna hoja es la etiqueta del
       estatus: un pastiche impreso sin declarar es la fuente inflada que
       esta materia enseña a cazar. */
    const abiertos = [];
    const openReal = w.open;
    w.open = function () {
      const doc = { write(s) { abiertos.push(s); }, close() {} };
      return { document: doc, print() {}, focus() {}, close() {} };

    try {
      w.imprimirLectura('borges');
      const hb = abiertos[abiertos.length - 1] || '';
      ok(/El silbato de las seis/.test(hb) && /volumen conmemorativo/.test(hb),

      ok(/Rehíce el volumen/.test(hb), 'y hasta su última página', 'la hoja del cuento sale cortada');

      ok(sinRaya(hc), 'y sin guiones largos (norma 1-bis)', 'la hoja del capítulo trae guiones largos');

      w.imprimirLectura('harari');
      const hh = abiertos[abiertos.length - 1] || '';
      ok(/La especie que piensa con lo que tiene en las manos/.test(hh) && /giro mensual/.test(hh),

      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      w.imprimirLectura('entrevista');
      const h4 = abiertos[abiertos.length - 1] || '';
      ok(/La fiebre y la máquina/.test(h4) && /Boerhaave/.test(h4) && /caricatura todavía no le ha pedido perdón/.test(h4),

      ok(/nunca ocurrió/i.test(h4), 'y su hoja declara que el encuentro nunca ocurrió', 'la hoja de la entrevista sale sin declarar la ficción');
      ok(/real y comprobable/i.test(h4), 'y con la regla de la erudición real', 'la hoja de la entrevista no trae la regla de los datos reales');
      ok(sinRaya(h4), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la entrevista trae guiones largos');

      w.imprimirLectura('gala');
      const h5 = abiertos[abiertos.length - 1] || '';
      ok(/El agua no elige el paño/.test(h5) && /QUINTERO\./.test(h5) && /GALA\./.test(h5) && /Condicionado vine/.test(h5),
         'la conversación se imprime completa y hasta su aforismo final', 'la conversación no se imprime entera');
      ok(/nunca ocurrió/i.test(h5), 'y su hoja declara que la charla nunca ocurrió', 'la hoja de la conversación sale sin declarar la ficción');
      ok(sinRaya(h5), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la conversación trae guiones largos');

      /* El careo se imprime con SU etiqueta y SIN la del pastiche: no imita
         a nadie, y una hoja suelta que lo llamara pastiche estaría diciendo
         que Cohen, Elster o Brenner hablan ahí dentro. */
      w.imprimirLectura('debate');
      const hd = abiertos[abiertos.length - 1] || '';
      ok(/¿Se puede desmentir la base\?/.test(hd) && /LA OBJECIÓN\./.test(hd) && /Zasulich/.test(hd) && /dos Coreas/.test(hd),
         'el careo se imprime completo, hasta el experimento natural del cierre', 'el careo no se imprime entero');
      ok(/Careo escrito por la casa/i.test(hd), 'con su etiqueta propia, la del careo', 'el careo sale sin su etiqueta');
      ok(!/NO es obra de ese autor/i.test(hd), 'y NO con la del pastiche, porque no imita a nadie', 'el careo sale etiquetado como pastiche');
      ok(/no personas/i.test(hd) && /tercera persona/i.test(hd),

      ok(sinRaya(hd), 'y sin guiones largos', 'el careo impreso trae guiones largos');
      /* Cada lectura se imprime con SUS preguntas y su pauta en hoja aparte
         (normas 5-quater y 5-nonies): así una hoja suelta sirve sola. */
      ok(/Preguntas de esta lectura/.test(hd), 'y con sus propias preguntas detrás', 'la hoja del careo sale sin sus preguntas');
      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');
      ok((hd.match(/class="op"/g) || []).length === 20, 'sus 5 preguntas con sus 20 opciones', 'opciones del careo: ' + (hd.match(/class="op"/g) || []).length);
      ok(/Preguntas de esta lectura/.test(hb), 'y el cuento también sale con las suyas', 'la hoja del cuento sale sin preguntas');

      w.imprimirTodasLasLecturas();
      const h3 = abiertos[abiertos.length - 1] || '';
      ok(/El silbato de las seis/.test(h3) && /De lo que sonaba en la oscuridad/.test(h3) && /La especie que piensa/.test(h3),
         'las tres lecturas de siempre se imprimen en el pliego junto', 'el pliego junto pierde alguna de las tres primeras');
      ok(/La fiebre y la máquina/.test(h3) && /El agua no elige el paño/.test(h3),
         'y las dos entrevistas también', 'el pliego junto no trae las dos entrevistas');
      ok(/¿Se puede desmentir la base\?/.test(h3) && /LA DEFENSA\./.test(h3),
         'y el careo, que son ya las seis', 'el pliego junto no trae el careo');
      ok((h3.match(/page-break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h3), 'y el pliego declara el pastiche de los cinco primeros', 'el pliego de las seis no declara el pastiche');
      ok(/nunca ocurrieron/i.test(h3), 'y la etiqueta de la ficción de las entrevistas', 'el pliego junto no declara que los encuentros nunca ocurrieron');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con 30 de comprensión', 'al pliego de preguntas le falta una sección');
      ok(/Preguntas de las seis lecturas/.test(hp) && /30 de comprensión lectora/.test(hp),
         'y declara los seis textos y las 30 de comprensión', 'el pliego de preguntas no declara los seis textos');
      ok(/nunca ocurrieron/i.test(hp), 'y que las entrevistas son encuentros que nunca ocurrieron', 'el pliego de preguntas no declara la ficción de las entrevistas');
      /* Y la ETIQUETA, que es donde estaba la mentira y donde no miraba nadie:
         el h1 y el subtítulo ya decían seis, pero la etiqueta seguía en la era
         de cinco lecturas y dejaba al careo sin estatus o metido en el saco del
         pastiche. La etiqueta viaja impresa (norma 5-quater) y el careo lleva
         la suya y no la del pastiche (norma 5-nonies), así que aquí se exige lo
         mismo que ya se exige en la hoja suelta del careo. */
      const etqP = (hp.match(/<div class="etiqueta">[\s\S]*?<\/div>/) || [''])[0];
      ok(/cinco primeros/i.test(etqP) && /careo/i.test(etqP),
         'y su etiqueta separa los cinco pastiches del careo', 'la etiqueta del pliego no dice qué es el sexto texto');
      ok(/no personas|los papeles/i.test(etqP) && /tercera persona/i.test(etqP),
         'diciendo que sus turnos los firman papeles', 'la etiqueta del pliego no dice cómo trata el careo a las personas reales');
      ok(!/los (seis|6) textos son/i.test(etqP) && !/seis[^.]{0,40}ejercicios de estilo/i.test(etqP),
         'y sin meter a los seis en el saco del pastiche', 'la etiqueta del pliego llama pastiche a los seis textos');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(sinRaya(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

      /* Los rótulos de las DOS PRUEBAS IMPRESAS: es ahí donde vive el número
         de etapa, y es el sitio exacto donde el molde arrastró el nombre de
         la misión anterior en misiones pasadas. Se imprimen de verdad y se
         lee el documento. Hay que GENERARLAS primero: printEval se planta si
         no existe _evalPrintData, y entonces se leería el pliego anterior. */
      w.go('s-evaluacion'); await esperar(150);
      w.genEval(); await esperar(250);
      w.genEvalCrit(); await esperar(250);
      w.printEval();
      const he = abiertos[abiertos.length - 1] || '';
      ok(/El hombre máquina y la base material/i.test(he) && /Etapa 2 · Estudio Mayor/.test(he),
         'la evaluación impresa lleva el nombre y la etapa correctos', 'la evaluación impresa trae el rótulo de otra misión');
      ok(!/Etapa 1|Etapa 3|de 7|mapa de las familias|átomos contra el miedo/i.test(he),
         'y no arrastra el rótulo de otra etapa ni de la misión molde', 'la evaluación impresa dice otra etapa');
      ok(!/undefined/.test(he), 'y no imprime undefined', 'la evaluación impresa trae un undefined');
      w.printEvalCrit();

      ok(/La base sobre la mesa/.test(hec) && /El hombre máquina y la base material/i.test(hec),

      ok(/Etapa 2 · Estudio Mayor/.test(hec), 'y su número de etapa correcto', 'la competencial impresa no dice etapa 2');
      ok(!/Etapa 1|Etapa 3|de 7|familia en la mesa|miedo sobre la mesa|mapa de las familias/i.test(hec),

      ok(!/undefined/.test(hec), 'y no imprime undefined en ninguna pauta', 'la competencial impresa trae un undefined');

    ok(/El hombre máquina \(1747\)/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en el hombre máquina', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="maquina"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');

    ok(/Popper/.test(d.getElementById('lab-display').textContent) || /Cohen/.test(d.getElementById('lab-display').textContent),
       'y las demás piezas pintan su contenido', 'el laboratorio no pinta la pieza de las críticas');

    const tareas = d.getElementById('tgOut').textContent;
    ok(tareas.length > 200, 'el generador de tareas produce su hoja', 'generador vacío');
    ok(!/Heywood|siete familias|ideolog[íi]a delgada|Mudde/i.test(tareas), 'el ejemplo del generador es de esta misión', 'el generador arrastra el ejemplo de la misión molde');
    w.go('s-aprende'); await esperar(150);
    w.startMethod(); await esperar(1400);
    w.resolveMethod(true); await esperar(200);
    ok(/se vería el día que alguien diga lo contrario/i.test(d.getElementById('methodResult').textContent),
       'la simulación es la de esta etapa (el condicionamiento escrito de modo que se pueda desmentir)', 'la simulación arrastra la del molde');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la base sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/hombre máquina y la base material/i.test(rotulos) && /La base sobre la mesa/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'los rótulos no traen el nombre de esta misión');
    ok(!/Etapa 1|Etapa 3|de 7/.test(rotulos), 'y no dicen otra etapa', 'los rótulos de pantalla dicen otra etapa');
    ok(!/mapa de las familias|familia en la mesa|miedo sobre la mesa|bisturí|Expediente Rojo|vigía/i.test(rotulos),
       'y no traen el nombre de otra misión', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      ok(casos.querySelectorAll('.ex-box').length === 9, 'y cada caso trae su caja de auditoría', 'cajas de auditoría: ' + casos.querySelectorAll('.ex-box').length);
      const txt = casos.textContent;
      ['40,000', '18,000', '6,000', 'radio del barrio', 'iglesia', 'Jael', 'Angelly', 'M.E.T.A.S']
        .forEach(k => { if (!new RegExp(k.replace(/\./g, '\\.'), 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/L \d/.test(txt), 'los casos traen números en lempiras', 'los casos no traen lempiras');
      ok(/hoja de la base/i.test(txt), 'trae la hoja de la base', 'falta la hoja de la base');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/brocha gorda/i.test(txt), 'trae el caso del reduccionismo de brocha gorda', 'falta el caso de la brocha gorda');
      /* El giro hacia adentro es el cuidado central del compendio: uno de los
         ocho casos tiene que auditar la base de la propia casa. */
      ok(/De qué vive M\.E\.T\.A\.S/i.test(txt), 'al menos un caso audita la base de la propia casa', 'ningún caso audita la casa propia');
      ok(/no se desprecia|sin despreciar|auditar sin despreciar/i.test(txt),
         'y los casos llevan la regla de trato', 'los casos no traen la regla de trato');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/40,000|18,000|6,000|Angelly|Jael|M\.E\.T\.A\.S/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/LA METTRIE 1747/.test(banda) && /MARX 1859/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/CONDICIONA/.test(banda) && /NO DETERMINA/.test(banda), 'y trae el eje de la etapa', 'la banda no nombra el eje de la etapa');
    ok(/EL AGUA MUEVE LOS MAZOS/.test(banda), 'y la imagen del batán', 'la banda no nombra la imagen de la etapa');
    ok(/ENGELS 1890/.test(banda) && /POPPER 1957/.test(banda) && /COHEN 1978/.test(banda), 'y las críticas que van al lado', 'la banda no nombra a los críticos');
    ok(!/DEM[ÓO]CRITO|EPICURO|LUCRECIO|TETRAF[ÁA]RMACO|CLINAMEN|EL JARD[ÍI]N/.test(banda), 'sin las palabras de la etapa 1 de la ruta', 'la banda sigue siendo la de la etapa 1');
    ok(!/LIBERALISMO|POPULISMO|GALLIE|FREEDEN|DESTUTT|SOCIEDAD ABIERTA|EL ACERO/.test(banda),
       'sin las palabras de las misiones viejas', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-atomos-hombre-maquina.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja de la base, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja de la base en blanco', 'falta la hoja de la base');
    ok(/Una hoja de la base ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/Tres avisos al llenarla/i.test(txtF), 'con sus avisos', 'faltan los avisos de la hoja');
    ok(/Cómo se usa, en tres reglas/i.test(txtF), 'y sus tres reglas de uso', 'faltan las reglas de uso de la hoja');
    ok(/1747/.test(txtF) && /1859/.test(txtF) && /condiciona/i.test(txtF), 'la ficha trae las dos escalas y el verbo', 'faltan piezas del temario');
    ok(/Condicionar no es determinar/i.test(txtF), 'la ficha trae la tabla del eje', 'falta la tabla de condicionar contra determinar');
    ok(/Popper/.test(txtF) && /Cohen/.test(txtF) && /Engels/.test(txtF), 'la ficha trae las críticas al lado', 'faltan las críticas en la ficha');
    ok(/brocha gorda/i.test(txtF), 'la ficha explica el modo de fallar', 'la ficha no explica la brocha gorda');
    ok(/Thompson/.test(txtF) && /Lynn White/.test(txtF) && /tesis discutida/i.test(txtF),
       'la ficha trae el contraejemplo con su etiqueta', 'la ficha no trae el contraejemplo etiquetado');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(sinRaya(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok(/clásico sólido/i.test(txtF) && /clásico cuestionado/i.test(txtF) && /defensa analítica seria/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/Heywood|siete familias|ideolog[íi]a delgada|Mudde|Paxton/i.test(txtF),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos del mapa de las familias');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-atomos-hombre-maquina"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de los Átomos y los Ídolos/.test(c.textContent));
    ok(!!ruta, 'la Ruta de los Átomos y los Ídolos está en el mapa', 'no aparece la ruta');
    if (ruta) {
      /* Cuentas sacadas del CATÁLOGO, no escritas a mano: las de a mano se
         quedaron viejas al crecer la ruta y la sonda suspendía sin que
         hubiera nada roto (la lección de la Casa Cerrada, en CLAUDE.md). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "atomos").length');
      const totalCat = wa.eval('RUTAS.atomos.etapas');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok(/Átomos contra el miedo/i.test(ruta.textContent) && /El hombre máquina y la base material/i.test(ruta.textContent),
         'las etapas 1 y 2 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La frontera de la conciencia/.test(ruta.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /hombre máquina/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /⚙️/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda hombre máquina etapa 2';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda hombre máquina etapa 2'; }
});
</script>
</body>
</html>
