<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de la Casa Cerrada, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-casa-cerrada-codigo/codigo.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta de la Casa Cerrada: bancos, laboratorio,
   pruebas impresas con su nombre, los ocho fallos reales del 28 de julio,
   la ficha y la ruta con TRES etapas.

   Y una nota sobre esta sonda, que viene al pelo por el tema de la misión:
   una comprobación que no puede decir que no no comprueba nada. Cada ok() de
   aquí se escribió mirando primero que fallara con la misión sin terminar. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Casa Cerrada · Etapa 3 de 6/.test(d.body.textContent), 'se presenta como etapa 3 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se busca el VOCABULARIO de la etapa 2, no su título.
       El título sí aparece a propósito, dos veces, porque esta etapa remite a
       la anterior. Comprobado: este mismo grep sobre datos.html da nueve. */
    ok(!/dato agregado|seudonimiz|copia oculta|plazo de borrado|inventario de datos|minimiz/i.test(d.body.textContent), 'sin restos de la etapa de la que se copió', 'queda vocabulario de Los datos de los demás');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'entrada,limite,inyeccion,silencio', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas del código que no confía', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_cib_codigo/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LA POSTURA CON EL CÓDIGO ──');
    /* Una misión sobre desconfiar del dato que no diga estas cosas no sirve. */
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/petición, no una verdad/i.test(texto), 'dice que lo que llega es una petición, no una verdad', 'no deja clara la frontera de confianza');
    ok(/lo que sí se acepta/i.test(texto) && /prohib/i.test(texto), 'prefiere la lista de lo permitido a la de lo prohibido', 'falta la regla de la lista permitida');
    ok(/solo vive en el navegador/i.test(texto) || /solo existe en el navegador/i.test(texto), 'deja claro que la comprobación del navegador no basta', 'no dice que la validación del cliente no cuenta');
    ok(/fallar en silencio|falla en silencio|falló en silencio|pase callando/i.test(texto), 'nombra el fallo en silencio, que es el corazón de la etapa', 'no habla de fallar en silencio');
    ok(/fallar cerrado|falla cerrado/i.test(texto), 'distingue fallar cerrado', 'no aparece fallar cerrado');
    ok(/textContent/.test(texto) && /innerHTML/.test(texto), 'da la cura concreta de la inyección en pantalla', 'no dice cómo se pinta sin ejecutar');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/La entrada que llega/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en la entrada que llega', 'abre en otra pieza');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el fallo que no se oyó se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|Los datos de los demás|La máquina que predice|Quién decide de verdad|Para quién y qué le cambia|Sesgos|El presupuesto real|Autocapacitación Técnica/.test(rotulos), 'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      /* Los ocho son fallos reales de F.A.R.O del 28 de julio de 2026 */
      ['using \\(true\\)', 'service worker', 'huérfanos', 'aprobaban siempre', 'cero filas', 'lista sacada del repositorio', 'no podía salir mal', 'encargo a la IA']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/28 de julio de 2026/.test(txt), 'los casos van fechados', 'los casos no traen la fecha del fallo');
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas del código que no confía/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/lista de comprobación de una página/i.test(txt), 'trae la lista de comprobación de una página', 'falta la lista de comprobación');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/service worker|notificaciones|Success|incógnito/.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');
    const errores = dentro('critErrorBank.map(e=>e.txt).join(" ")');
    ok(/200|autenticado|no dio error|avisa/i.test(errores), 'el banco de errores parte de frases reales', 'los errores son de manual');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-casa-cerrada-codigo.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/Registro de entradas/i.test(txt), 'la ficha trae el registro de entradas', 'falta el registro de entradas');
    ok(/Lista de comprobación de una página/i.test(txt), 'la ficha trae la lista de comprobación', 'falta la lista de comprobación');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txt), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-casa-cerrada-codigo"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const casa = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de la Casa Cerrada/.test(c.textContent));
    ok(!!casa, 'la Ruta de la Casa Cerrada está en el mapa', 'no aparece la ruta');
    if (casa) {
      ok(casa.querySelectorAll('.re-link').length === 3, 'con sus etapas 1, 2 y 3 ya tocables', 'etapas tocables: ' + casa.querySelectorAll('.re-link').length);
      ok(casa.querySelectorAll('.ruta-etapa-futura').length === 3, 'y 3 etapas por construir con nombre', 'futuras: ' + casa.querySelectorAll('.ruta-etapa-futura').length);
      ok(/El código que no confía/.test(casa.textContent), 'la etapa 3 sale con el título de la misión', 'la etapa 3 sigue saliendo como prevista');
      ok(/Llaves y secretos/i.test(casa.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="cib"]');
    ok(!!chip, 'la materia Ciberseguridad tiene su chip', 'no hay chip de Ciberseguridad');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length === 3, 'la materia muestra sus tres misiones', 'muestra ' + tarjetas.length);
      const cod = tarjetas.find(t => /código que no confía/i.test(t.textContent));
      ok(!!cod && /🔒/.test(cod.textContent), 'la misión del código lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
