<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Poder Político, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-politica-mesa/mesa.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta del Poder Político: bancos, laboratorio,
   pruebas impresas con su nombre, las ocho mesas, la ficha y la ruta con TRES
   etapas.

   Cada ok() se escribió mirando primero que fallara con la misión sin terminar,
   que es lo que enseña la etapa 3 de la Casa Cerrada. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Poder Político · Etapa 3 de 6/.test(d.body.textContent), 'se presenta como etapa 3 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se busca el VOCABULARIO de la etapa 2, no su título.
       El título aparece a propósito, porque esta etapa remite a la anterior. */
    ok(!/quién lo emite|fecha de vigencia|el papel que falta|sello y firma del emisor/i.test(d.body.textContent), 'sin restos de la etapa de la que se copió', 'queda vocabulario de Normas y trámites');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'enfrente,moneda,limite,cierre', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas de la mesa', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_pol_mesa/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LA POSTURA ANTE LA INSTITUCIÓN ──');
    /* Una misión sobre negociar que no diga estas cosas no sirve. */
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/casi nunca puede decir sí|casi nunca puede firmar/i.test(texto), 'dice que quien te recibe casi nunca decide', 'no aclara quién decide');
    ok(/riesgo/i.test(texto) && /firma/i.test(texto), 'nombra el riesgo de quien firma', 'no explica qué protege la institución');
    ok(/posición/i.test(texto) && /interés/i.test(texto), 'separa posición de interés', 'no distingue posición e interés');
    ok(/moneda/i.test(texto) && /constancia/i.test(texto), 'ofrece la moneda que no es dinero', 'no plantea cobrar sin dinero');
    ok(/piloto/i.test(texto), 'propone el piloto como salida', 'no aparece el piloto');
    ok(/minuta/i.test(texto), 'cierra con minuta', 'no aparece la minuta');
    ok(/no es un sí|déjelo conmigo/i.test(texto), 'nombra el sí que no es un sí', 'no habla del silencio institucional');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Quién está enfrente/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en quién está enfrente', 'abre en otra pieza');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la mesa que se cierra se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|Los datos de los demás|La máquina que predice|Quién decide de verdad|Para quién y qué le cambia|Sesgos|El presupuesto real|El papel que falta|Normas y trámites|Autocapacitación Técnica/.test(rotulos), 'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['dirección departamental', 'déjelo conmigo', 'seis personas', 'nombre del autor', 'alcaldía', 'sin cerrarse', 'trasladaron', 'aval']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/lempiras/.test(txt), 'los casos traen números en lempiras (norma 3)', 'ningún caso trae cifras en lempiras');
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      /* Los casos de esta etapa no pueden repetir los de la 1 ni los de la 2 */
      ok(!/cinco mil fichas con su cara|el papel que nadie pidió|constancia que pide un patrocinador/i.test(txt), 'no repite casos de las etapas 1 y 2', 'repite un caso de otra etapa de la ruta');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas de la mesa/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/minuta de una página/i.test(txt), 'trae la minuta de una página', 'falta la minuta de una página');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/departamental|alcaldía|trasladaron|aval|déjelo conmigo/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-politica-mesa.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/Hoja de preparación/i.test(txt), 'la ficha trae la hoja de preparación', 'falta la hoja de preparación');
    ok(/Una minuta de verdad, escrita/i.test(txt), 'la ficha trae la minuta de ejemplo', 'falta el ejemplo trabajado de minuta');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txt), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    /* La repaginación parte una tabla si el corte cae dentro: retrocede() solo
       retrocede sobre <div>. Pasó de verdad al construir la ficha de Marca. */
    ok((txt.match(/<table/g) || []).length === (txt.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar: un corte partió una tabla');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-politica-mesa"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const pol = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Poder Político/.test(c.textContent));
    ok(!!pol, 'la Ruta del Poder Político está en el mapa', 'no aparece la ruta');
    if (pol) {
      ok(pol.querySelectorAll('.re-link').length === 3, 'con sus etapas 1, 2 y 3 ya tocables', 'etapas tocables: ' + pol.querySelectorAll('.re-link').length);
      ok(pol.querySelectorAll('.ruta-etapa-futura').length === 3, 'y 3 etapas por construir con nombre', 'futuras: ' + pol.querySelectorAll('.ruta-etapa-futura').length);
      ok(/La mesa/.test(pol.textContent), 'la etapa 3 sale con el título de la misión', 'la etapa 3 sigue saliendo como prevista');
      ok(/Alianzas, patronato/i.test(pol.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="pol"]');
    ok(!!chip, 'la materia Poder Político tiene su chip', 'no hay chip de Poder Político');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length === 3, 'la materia muestra sus tres misiones', 'muestra ' + tarjetas.length);
      const mesa = tarjetas.find(t => /la mesa/i.test(t.textContent));
      ok(!!mesa && /🔒/.test(mesa.textContent), 'la misión de la mesa lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
