<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Quiz de todas las misiones</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:300px;height:160px;border:0;background:#fff;margin:0 4px 4px 0}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<div id="marcos"></div>
<pre id="out">midiendo…</pre>
<script>
/* Carga TODAS las misiones del catálogo y comprueba, en cada una, que el quiz
   funcione y que la respuesta correcta NO esté siempre en la misma letra. Es la
   sonda que evita que el sesgo vuelva a colarse al copiar el molde.

   La lista sale del propio catálogo (js/data/misiones.js) y no de una copia a
   mano: antes iba escrita aquí y se quedó en seis misiones mientras el catálogo
   crecía a dieciséis, así que las diez nuevas no se revisaban. */
const out = document.getElementById('out');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));
const LETRAS = ['a','b','c','d'];

/* Las misiones cargan de golpe si son muchas, así que van en tandas */
const TANDA = 4;

async function catalogo() {
  const src = await (await fetch('/js/data/misiones.js')).text();
  const fn = new Function(src + '; return MISSIONS;');
  return fn();
}

function marco(url) {
  const f = document.createElement('iframe');
  f.src = '/' + url.split('/').map(encodeURIComponent).join('/');
  document.getElementById('marcos').appendChild(f);
  return f;
}

async function revisa(mision, f) {
  const w = f.contentWindow, d = f.contentDocument;
  log('\n── ' + mision.title.slice(0, 52) + ' ──');
  try {
    const dentro = e => w.eval(e);
    /* Reparto por banco (norma 4: ninguna letra pasa del 40%) */
    [['qzData','c'], ['evalMCBank','a'], ['cmpData','c']].forEach(([banco, clave]) => {
      const cuenta = dentro(`(function(){const c=[0,0,0,0];${banco}.forEach(q=>{if(typeof q.${clave}==='number')c[q.${clave}]++});return c})()`);
      const total = cuenta.reduce((a, b) => a + b, 0);
      if (!total) { log('  · ' + banco + ': sin opciones que repartir'); return; }
      const peor = Math.max(...cuenta);
      const pct = Math.round(peor / total * 100);
      ok(pct <= 40, banco + ': ' + cuenta.map((n, j) => LETRAS[j] + '=' + n).join(' ') + ' (máx ' + pct + '%)',
        banco + ' concentra el ' + pct + '% en la letra ' + LETRAS[cuenta.indexOf(peor)]);
    });
    /* El quiz sigue funcionando y la opción marcada correcta es la del banco */
    w.go('s-quiz'); await esperar(200);
    ok(d.getElementById('qzQ').textContent.length > 8, 'el quiz pinta su pregunta', 'el quiz salió vacío');
    const nOpts = d.querySelectorAll('#qzOpts .qz-opt').length;
    ok(nOpts >= 3, 'pinta ' + nOpts + ' opciones', 'opciones: ' + nOpts);
    const idx = dentro('qzData[0].c');
    const textoBanco = dentro('qzData[0].o[qzData[0].c]').replace(/^[a-d]\)\s*/, '').trim();
    const textoPantalla = d.querySelectorAll('#qzOpts .qz-opt')[idx].textContent.replace(/^[a-d]\)\s*/, '').trim();
    ok(textoPantalla.includes(textoBanco.slice(0, 25)) || textoBanco.includes(textoPantalla.slice(0, 25)),
      'la opción correcta del banco coincide con la de la pantalla', 'la pantalla y el banco no coinciden');
    /* Evaluación final: que se siga generando */
    w.go('s-evaluacion'); await esperar(150);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    /* Clave de progreso propia: dos misiones que la compartan se pisan el avance */
    return dentro('SAVE_KEY');
  } catch (e) { fallos++; log('  ✘ error: ' + e.message); return null; }
}

/* Se puede recorrer el catálogo POR TANDAS: ?desde=0&hasta=10.
   Por qué hace falta: el corredor sin pantalla avanza con un reloj
   virtual que se detiene mientras haya alguna petición de red sin
   resolver, y cada misión pide fuentes de fuera que en el banco de
   pruebas no responden. Con las treinta y ocho seguidas el proceso se
   queda sin terminar aunque cada misión cargue en milisegundos. Sin
   parámetros las recorre todas, como siempre. */
const _p = new URLSearchParams(location.search);
const DESDE = Number(_p.get('desde') || 0);
const HASTA = Number(_p.get('hasta') || 0) || Infinity;

window.addEventListener('load', async () => {
  const TODAS = await catalogo();
  const MISIONES = TODAS.slice(DESDE, HASTA === Infinity ? undefined : HASTA);
  log('catálogo: ' + TODAS.length + ' misiones · esta tanda: ' + MISIONES.length);
  const claves = new Map();
  for (let i = 0; i < MISIONES.length; i += TANDA) {
    const tanda = MISIONES.slice(i, i + TANDA);
    const marcos = tanda.map(m => marco(m.url));
    await esperar(2400);
    for (let j = 0; j < tanda.length; j++) {
      const clave = await revisa(tanda[j], marcos[j]);
      if (clave) claves.set(tanda[j].title, clave);
    }
    marcos.forEach(f => f.remove());
  }
  log('\n── CLAVES DE PROGRESO ──');
  const repes = [...claves.values()].filter((c, i, a) => a.indexOf(c) !== i);
  ok(!repes.length, 'las ' + claves.size + ' misiones de la tanda tienen clave propia', 'clave compartida: ' + [...new Set(repes)].join(', '));
  log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda del quiz de todas';
});
</script>
</body>
</html>
