<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de la Marca, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-marca-relato/relato.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta de la Marca: bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha y la ruta con TRES etapas.

   Cada ok() de aquí se escribió mirando primero que fallara con la misión sin
   terminar, que es justo lo que enseña la etapa 3 de la Casa Cerrada. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Marca · Etapa 3 de 6/.test(d.body.textContent), 'se presenta como etapa 3 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se busca el VOCABULARIO de la etapa 2, no su título.
       El título aparece a propósito, porque esta etapa remite a la anterior.
       Comprobado: este mismo grep sobre oferta.html da de sobra. */
    ok(!/qué NO incluye|forma de pago|punto de equilibrio|precio por aula/i.test(d.body.textContent), 'sin restos de la etapa de la que se copió', 'queda vocabulario de La oferta');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'hecho,cifra,falta,fecha', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas del relato', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_mkt_relato/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LA POSTURA CON EL RELATO ──');
    /* Una misión sobre contar el proyecto que no diga estas cosas no sirve. */
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/lo que otra? persona repite|lo que otro repite/i.test(texto), 'define el relato como lo que otro repite', 'no deja claro qué es el relato');
    ok(/denominador/i.test(texto), 'exige denominador a las cifras', 'no habla del denominador');
    ok(/cuatro formas de inflar/i.test(texto), 'nombra las cuatro formas de inflar', 'no enumera las formas de inflar');
    ok(/todavía no es/i.test(texto), 'pide decir lo que el proyecto todavía no es', 'no plantea nombrar los límites');
    ok(/préstamo contra la confianza/i.test(texto), 'nombra el coste de inflar', 'no dice qué se paga al inflar');
    ok(/pequeña y exacta convence más|abre una conversación/i.test(texto), 'defiende la cifra pequeña y comprobable', 'no defiende la cifra pequeña');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/El hecho comprobable/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en el hecho comprobable', 'abre en otra pieza');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el relato que se sostiene se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|Los datos de los demás|La máquina que predice|Quién decide de verdad|Para quién y qué le cambia|Sesgos|El presupuesto real|Cuánto cobro por esto|Autocapacitación Técnica/.test(rotulos), 'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['texto de presentación', 'candado', 'diez páginas', 'cuántas escuelas', 'alianza estratégica', 'Antena', 'revista', 'probado en el aula']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/pasó de verdad/g) || []).length === 3, 'los tres casos reales van marcados como tales', 'casos marcados: ' + (txt.match(/pasó de verdad/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/lempiras/.test(txt), 'el caso del patrocinador trae números en lempiras (norma 3)', 'ningún caso trae cifras en lempiras');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas del relato honesto/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/relato de una página/i.test(txt), 'trae el relato de una página', 'falta el relato de una página');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/candado|patrocinador|Antena|revista|escuelas/.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-marca-relato.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/El relato de una página/i.test(txt), 'la ficha trae el relato de una página', 'falta el relato de una página');
    ok(/El desinflador/i.test(txt), 'la ficha trae el desinflador', 'falta el desinflador');
    ok(/en sus tres largos/i.test(txt), 'la ficha trae el ejemplo de los tres largos', 'falta el ejemplo trabajado');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txt), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    /* La repaginación puede partir una tabla si el corte cae dentro: se comprueba
       que abran y cierren las mismas, que fue justo el fallo de esta ficha. */
    ok((txt.match(/<table/g) || []).length === (txt.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar: un corte partió una tabla');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-marca-relato"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const marca = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de la Marca/.test(c.textContent));
    ok(!!marca, 'la Ruta de la Marca está en el mapa', 'no aparece la ruta');
    if (marca) {
      /* La cuenta exacta de etapas tocables la lleva _dev/probe-rutas.html, que
         se actualiza cada vez que se añade una misión. Aquí solo se comprueba
         que esta etapa llegó al mapa y que las seis siguen listadas: si esta
         sonda contara el total, se pondría en rojo cada vez que crece la ruta
         sin que nada de esta etapa se hubiera roto. */
      ok(marca.querySelectorAll('.re-link').length >= 3, 'con sus etapas 1, 2 y 3 ya tocables', 'la etapa 3 no es tocable');
      ok(marca.querySelectorAll('.re-link').length + marca.querySelectorAll('.ruta-etapa-futura').length === 6, 'las 6 etapas de la ruta están en el mapa', 'etapas en el mapa: ' + (marca.querySelectorAll('.re-link').length + marca.querySelectorAll('.ruta-etapa-futura').length));
      ok(/El relato/.test(marca.textContent), 'la etapa 3 sale con el título de la misión', 'la etapa 3 sigue saliendo como prevista');
      ok(/Canales/i.test(marca.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mkt"]');
    ok(!!chip, 'la materia Marketing y Marca tiene su chip', 'no hay chip de Marketing y Marca');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length >= 3, 'la materia muestra sus misiones', 'muestra ' + tarjetas.length);
      const rel = tarjetas.find(t => /relato/i.test(t.textContent));
      ok(!!rel && /🔒/.test(rel.textContent), 'la misión del relato lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
