<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Expediente Dorado, etapa 4</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-dorado-dos-facturas/dos-facturas.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 4 de la Ruta del Expediente Dorado (Crítica al
   Capitalismo, materia 27 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y las SEIS lecturas de la
   norma 5-nonies: las cinco de la 5-quinquies, con las dos entrevistas
   imaginadas declaradas, más el CAREO, que no imita a nadie) y las TRES
   BATERÍAS, que ya no viven juntas al final sino DENTRO de cada lectura
   (30 de comprensión, 12 de completar y 12 de análisis, es decir 5, 2 y 2
   por voz), con el plegado, la marca de lectura y la impresión comprobados
   de verdad.

   La REGLA DEL ESTUDIO MAYOR rige también aquí, y en esta etapa se cruza con
   su propio contenido, porque la etapa entera trata de cómo se cita una
   cifra. Se comprueba fuente por fuente: Piketty (2014) como CLÁSICO
   CONTEMPORÁNEO Y MUY AUDITADO, que NUNCA aparece solo, con Rognlie (2015)
   como LA AUDITORÍA OBLIGADA y con el episodio de Giles en el «Financial
   Times» (2014), que Piketty respondió publicando sus datos; Lakner y
   Milanović con «Global Inequality» (2016) como LA REFERENCIA DE LA
   DESIGUALDAD GLOBAL, y siempre con la objeción de Corlett (2016) encima;
   el sexto informe del IPCC (2021) como FUENTE OFICIAL QUE PUBLICA SU
   RANGO, con la horquilla de 2,5 a 4 °C y su mejor estimación de 3 °C; la
   serie de Keeling desde 1958 como LA MEDICIÓN MÁS LIMPIA del tema; el
   Acuerdo de París (2015) declarado DECISIÓN POLÍTICA y no resultado
   científico; Stern (2006) contra Nordhaus (Nobel 2018) como DISPUTA DE
   VALORES Y NO DE DATOS; Weitzman (2009) como EL GIRO TEÓRICO; Pindyck
   (2013) como EL ACERO, que viene de dentro de la profesión; y Chetty y su
   equipo (2017) como MEDICIÓN DE MOVILIDAD.

   Cuatro cuidados del compendio se comprueban a máquina porque gobiernan la
   misión. Uno: NINGUNA CIFRA SIN HORQUILLA Y SIN FUENTE, que es la regla de
   la etapa. Dos: las dos facturas SE LEEN DISTINTO, porque la de la
   desigualdad tiene un problema de definición y la del clima de
   incertidumbre y plazo. Tres: el modo de fallar es ESCOGER LA PUNTA DEL
   RANGO y contarla como el centro, que es lo que hacen los dos bandos con
   el mismo informe. Cuatro: QUE UNA CIFRA ESTÉ MAL USADA NO BORRA EL
   PROBLEMA, que es el error simétrico y el más cómodo.

   Y el CERO PARTIDISMO HONDUREÑO ACTUAL, con la regla propia de la materia:
   los conflictos vivos del patio entran COMO CATEGORÍA y no como caso con
   nombre propio, que aquí importa porque uno de los ocho casos trata de la
   asimetría entre quienes emiten poco y quienes sufren mucho. Por eso la
   comprobación descuenta antes la frase donde se enuncia esa misma regla,
   que nombra al partido justamente para decir que no se etiqueta a ninguno. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Expediente Dorado · Etapa 4 de 7/.test(d.body.textContent), 'se presenta como etapa 4 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 3 de esta misma ruta. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-dorado-gran-fuga"], a[href*="ruta-dorado-fallas-maquina"], a[href*="ruta-dorado-dinero-no-compra"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/hoja del bien|objeción de justicia|objeción de corrupción|cuatro salidas|desplazamiento de motivos/i.test(cuerpoSinEnlaces),
       'sin las piezas de la etapa 3 (lo que el dinero no debe comprar)', 'queda la estructura de la etapa 3 de esta ruta');
    const fuente = await (await fetch('/misiones/ruta-dorado-dos-facturas/dos-facturas.html')).text();
    ok(!/Sandel|Satz|Titmuss|Gneezy|Rustichini|Brennan|Jaworski|Zelizer|repugnancia/i.test(fuente),
       'y en la prosa de la misión no queda ni un nombre de aquel temario', 'queda vocabulario de la etapa 3 en la prosa');
    ok(!/hoja de la falla|letra pequeña del teorema|monopsonio|hoja de la cifra|Deaton/i.test(fuente),
       'ni de las etapas 1 y 2 de la ruta', 'queda vocabulario de las etapas 1 o 2 en la prosa');
    ok(!/🩸|🔧|📒/.test(cuerpoSinEnlaces), 'sin los emojis de las misiones molde', 'queda un emoji de otra etapa fuera de los enlaces');
    ok(!/La Mettrie|brocha gorda|batán|hombre de paja|Holodomor/i.test(cuerpoSinEnlaces),
       'sin restos de otras misiones del arco', 'queda vocabulario de otra misión del Estudio Mayor');
    /* Y lo que SÍ tiene que quedar: las tres etapas anteriores remitidas. */
    ok(/etapa 1/i.test(d.body.textContent) && /etapa 2/i.test(d.body.textContent) && /etapa 3/i.test(d.body.textContent),
       'las tres etapas anteriores se remiten como lo que sostiene esta', 'no se remite a las etapas anteriores');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-dorado-gran-fuga"]') && !!d.querySelector('#s-recursos a[href*="ruta-dorado-fallas-maquina"]') && !!d.querySelector('#s-recursos a[href*="ruta-dorado-dinero-no-compra"]'),
       'Recursos enlaza las tres etapas anteriores de la ruta', 'falta el enlace a alguna etapa anterior');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-rojo-acero-juicio"]'),
       'y sigue enlazando el expediente gemelo', 'falta el enlace al expediente gemelo');
    ok(/regla del acero/i.test(d.body.textContent), 'y nombra la regla del acero, que aquí se aplica a Pindyck', 'no se nombra la regla del acero');
    /* El guion largo se busca escrito como \u2014 y no como el carácter: si
       la sonda lo llevara dentro, el grep de la norma 1-bis (que se corre
       sobre la misión Y sobre su sonda antes de publicar) daría siempre un
       positivo, y el aviso que más se repite en esta casa acabaría siendo
       ruido que se aprende a ignorar. La expresión regular hace exactamente
       lo mismo con el escape. */
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');
    /* Cero partidismo hondureño actual. Se descuenta antes la frase donde se
       ENUNCIA la regla de selección, que nombra al partido justamente para
       decir que no se le pone etiqueta a ninguno. */
    const sinRegla = d.body.textContent.replace(/no se etiqueta a ning[úu]n funcionario, a ning[úu]n partido ni a nadie en campaña/gi, '')
                                       .replace(/a un funcionario con pleito abierto/gi, '');
    ok(!/\b(partido|diputad|alcalde|candidat)[a-zóí]*\b/i.test(sinRegla),
       'ni un político vivo ni un partido nombrado (cero partidismo actual)', 'aparece un cargo o un partido de la política de hoy');
    ok(/como categoría/i.test(d.body.textContent) && /nombre propio/i.test(d.body.textContent),
       'y la regla de selección: los casos del patio entran como categoría', 'falta la regla de selección de esta materia');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Piketty/.test(texto0) && /capital en el siglo XXI/i.test(texto0) && /2014/.test(texto0),
       'Piketty (2014) con el título de su obra', 'falta Piketty con su obra y su año');
    /* La pieza que más fácil se pierde, y la que esta casa exige siempre: la
       auditoría al lado, aunque la mitad ocultada sea la que conviene. */
    ok(/Rognlie/.test(texto0) && /2015/.test(texto0) && /vivienda/i.test(texto0),
       'Rognlie (2015) con su hallazgo: casi todo viene de la vivienda', 'falta la auditoría de Rognlie');
    ok(/auditoría obligada|muy auditado/i.test(texto0), 'y declarada LA AUDITORÍA OBLIGADA', 'no se declara la auditoría de Piketty');
    ok(/Giles/.test(texto0) && /Financial Times/.test(texto0) && /2014/.test(texto0),
       'el episodio del «Financial Times» (2014), con el nombre del periodista', 'falta la objeción del Financial Times');
    ok(/publicó sus datos|publicando sus datos|respondió/i.test(texto0),
       'y la respuesta de Piketty publicando sus datos', 'no se cuenta cómo respondió Piketty');
    ok(/Lakner/.test(texto0) && /Milanović/.test(texto0) && /Global Inequality/.test(texto0) && /2016/.test(texto0),
       'Lakner y Milanović, con «Global Inequality» (2016)', 'falta la referencia de la desigualdad global');
    ok(/Corlett/.test(texto0) && /Resolution Foundation/.test(texto0) && /2016/.test(texto0),
       'y Corlett (2016) con su casa de estudios', 'falta la objeción a la curva del elefante');
    ok(/IPCC/.test(texto0) && /2021/.test(texto0) && /2,5/.test(texto0) && /4 °C|4 grados/.test(texto0),
       'el IPCC (2021) con su horquilla de 2,5 a 4 °C', 'falta el IPCC con su rango');
    ok(/3 °C|tres como mejor|3 como mejor/.test(texto0) && /mejor estimación/i.test(texto0),
       'y con su mejor estimación señalada', 'la horquilla se cita sin su mejor estimación');
    ok(/1,1 °C|1,1 grados/.test(texto0) && /1850/.test(texto0),
       'y el calentamiento ya ocurrido, con su periodo de referencia', 'falta el dato del calentamiento ya ocurrido');
    ok(/Keeling/.test(texto0) && /1958/.test(texto0) && /Mauna Loa/.test(texto0),
       'Keeling (1958) con el nombre del observatorio', 'falta la serie de Keeling');
    ok(/Acuerdo de París/.test(texto0) && /2015/.test(texto0) && /decisión política/i.test(texto0),
       'el Acuerdo de París (2015), declarado DECISIÓN POLÍTICA', 'no se declara París como decisión y no como dato');
    ok(/Stern/.test(texto0) && /2006/.test(texto0) && /Nordhaus/.test(texto0) && /2018/.test(texto0),
       'Stern (2006) contra Nordhaus, con su Nobel de 2018', 'falta la pareja Stern y Nordhaus');
    ok(/tasa de descuento/i.test(texto0) && /(mismos datos|misma física|decisión moral)/i.test(texto0),
       'y la tasa de descuento explicada como decisión y no como dato', 'no se explica qué discuten de verdad');
    ok(/Weitzman/.test(texto0) && /2009/.test(texto0) && /colas/i.test(texto0),
       'Weitzman (2009) con las colas gordas', 'falta Weitzman');
    ok(/Pindyck/.test(texto0) && /2013/.test(texto0) && /Journal of Economic Literature/.test(texto0),
       'Pindyck (2013) con la revista donde publicó', 'falta el acero de Pindyck');
    ok(/acero/i.test(texto0) && /precisión/i.test(texto0), 'y declarado EL ACERO, que se contesta y no se esquiva', 'no se declara el acero');
    ok(/Chetty/.test(texto0) && /2017/.test(texto0) && /Science/.test(texto0) && /90/.test(texto0),
       'Chetty y su equipo (2017), en «Science», con su cifra', 'falta la medición de movilidad');
    ok(/pastiche/i.test(texto0) && /no obra de esos autores/i.test(texto0),
       'y el pastiche de las lecturas declarado', 'el pastiche no se declara en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 16,
       'los cuatro bancos de la evaluación (15, 15, 15 y 16 pares)', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'desigualdad,elefante,clima,descuento', 'laboratorio con las 4 piezas de la etapa', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 10, 'los 10 momentos del camino del límite', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    /* Las tres baterías de las lecturas (normas 5-quater y 5-nonies). Ya no
       viven juntas al final de la sección: js/lecturas.js las reparte DENTRO
       de cada texto filtrando por la etiqueta `t`, de modo que el tamaño
       total y el reparto por voz son la misma comprobación. */
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos POR LECTURA.
       Sin esta cuenta, una lectura se publica con su tarjeta de preguntas
       vacía (o con tres) y nadie se entera hasta que un alumno la abre. Y
       las etiquetas sueltas de la versión de cinco («las cinco», «todas»,
       «Borges y Harari») no pueden volver: una pregunta cuya etiqueta no sea
       una de estas seis voces se cae de la pantalla sin hacer ruido. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay análisis sin pauta o con pauta de menos de 250 caracteres');
    ok(dentro('lectAnalisisBank.every(q => !!q.t)'), 'y cada una dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* El «1. » o el «7. » de cabeza era el número del banco global de diez.
       Repartidas de dos en dos dentro de su lectura, ese número mentiría. */
    ok(dentro('lectAnalisisBank.every(q => !(/^\\s*\\d+\\./.test(q.q)))'),
       'y ningún enunciado de análisis arrastra el número del banco viejo', 'queda un análisis numerado con el número global');
    ok(/faro_dorado_facturas/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/horquilla/i.test(texto) && /fuente/i.test(texto) && /qué mide/i.test(texto),
       'la regla de la etapa: ninguna cifra sin qué mide, fuente y horquilla', 'falta la regla que ordena la etapa');
    ok(/dos facturas/i.test(texto) && /(se leen distinto|de naturaleza distinta|no se parecen)/i.test(texto),
       'y que las dos facturas se leen distinto', 'no se dice que las dos facturas se leen distinto');
    ok(/definición/i.test(texto) && /incertidumbre/i.test(texto),
       'con su diferencia nombrada: definición contra incertidumbre', 'no se nombra en qué se diferencian');
    ok(/ingreso/i.test(texto) && /riqueza/i.test(texto) && /impuestos/i.test(texto) && /entre países/i.test(texto),
       'las cuatro decisiones antes de medir la desigualdad', 'faltan decisiones de la primera factura');
    ok(/riqueza neta/i.test(texto) && /(menos lo que se debe|menos lo que debe)/i.test(texto),
       'la riqueza neta explicada, que es la trampa del titular famoso', 'no se explica qué es la riqueza neta');
    ok(/elefante/i.test(texto) && /1988/.test(texto) && /2008/.test(texto),
       'la curva del elefante con su periodo', 'falta la curva del elefante o su periodo');
    ok(/entre países/i.test(texto) && /dentro/i.test(texto) && /(bajó|subía|subió)/i.test(texto),
       'y lo que dice: entre países bajó, dentro de los ricos subió', 'no se dice lo que muestra la curva');
    ok(/movilidad/i.test(texto) && /(90|noventa)/.test(texto) && /1940/.test(texto),
       'la movilidad como segunda cuenta dentro de la primera', 'falta la movilidad medida');
    ok(/2,5/.test(texto) && /mejor estimación/i.test(texto),
       'la horquilla del clima, con su mejor estimación', 'falta la horquilla con su centro');
    ok(/Kaya/i.test(texto) && /(cuatro|multiplican)/i.test(texto),
       'la identidad de Kaya, que ordena qué hacer', 'falta la identidad de Kaya');
    ok(/tasa de descuento/i.test(texto) && /(no ha nacido|todavía no ha nacido)/i.test(texto),
       'la tasa de descuento, definida en palabras de la casa', 'falta la definición de la tasa de descuento');
    ok(/techo/i.test(texto) && /(este año|el año que viene|el próximo)/i.test(texto),
       'y traída a la cocina con el ejemplo del techo', 'la tasa de descuento se queda en la academia');
    ok(/punta del rango/i.test(texto), 'el modo de fallar: escoger la punta del rango', 'falta el modo de fallar de la etapa');
    ok(/no borra el problema|no significa que el problema no exista/i.test(texto),
       'y el aviso contra el error simétrico', 'falta el aviso del error simétrico');
    ok(/hoja de la factura/i.test(texto), 'la hoja de la factura, con ese nombre', 'falta la hoja de la factura');
    ok(/atribución/i.test(texto), 'y la ciencia de atribución, para no saltar de un evento a la causa', 'falta la ciencia de atribución');
    ok(/territoriales/i.test(texto) && /consumo/i.test(texto),
       'las dos contabilidades de emisiones, las dos legítimas', 'faltan las dos contabilidades de emisiones');
    /* Las fronteras declaradas de esta etapa. */
    ok(/Economía política/i.test(texto) && /(macroeconomía|crecimiento)/i.test(texto),
       'la macroeconomía del crecimiento remitida a Economía política', 'no se remite la macroeconomía');
    ok(/Ciencias Naturales/i.test(texto), 'y la física del clima remitida a Ciencias Naturales', 'no se remite la física del clima');
    ok(/etapa 5/i.test(texto) && /(Smith|escocés)/i.test(texto), 'y la etapa siguiente declarada', 'la etapa no dice qué viene después');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/doña Marina/i.test(tg), 'el guion tiene personaje, y no es una clase hablada', 'el guion no tiene personaje');
      ok(/7:10|6:20 a 7:10/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(18\d\d|19\d\d|20\d\d)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/1958/.test(tg) && /2006/.test(tg) && /2014/.test(tg) && /2015/.test(tg) && /2016/.test(tg) && /2018/.test(tg) && /2021/.test(tg),
         'el guion trae las fechas de la etapa', 'al guion le faltan fechas');
      /* El guion tiene que separar las dos facturas y decir la horquilla
         entera, que es la destreza de la etapa. */
      ok(/factura del clima/i.test(tg) && /factura de la desigualdad/i.test(tg),
         'y nombra las dos facturas, que es la destreza de la etapa', 'el guion no nombra las dos facturas');
      ok(/dos y medio|2,5/.test(tg) && /mejor estimación|tres como/i.test(tg),
         'y dice la horquilla entera, con su centro', 'el guion da una sola cifra del clima');
      ok(/Rognlie/.test(tg) && /Corlett/.test(tg),
         'y trae las auditorías al lado, no solo las tesis', 'el guion cita las tesis sin sus auditorías');
      ok(/no se sabe nada|rango no es/i.test(tg),
         'y contesta la objeción de que entonces no se sabe nada', 'el guion no contesta la objeción del público');
      ok(/tasa|descuento|no ha nacido/i.test(tg),
         'y deja escrito que la pelea de fondo es de valores', 'el guion no llega a la tasa de descuento');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      /* Seis tarjetas, ni cinco ni siete. El aparato compartido monta el
         índice y reparte las preguntas leyendo estas tarjetas: si falta una,
         no se rompe nada a la vista, simplemente deja de existir, y sus dos
         preguntas de completar y sus dos de análisis se van con ella. */
      const tarjetas = lect.querySelectorAll('.card[id^="lect-"]');
      ok(tarjetas.length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + tarjetas.length);
      ok(['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'].every(k => !!d.getElementById('lect-' + k)),
         'y las seis con su identificador fijo, para que las sondas no adivinen', 'falta alguna tarjeta de lectura con su id');
      ok(/Seis lecturas/.test(tl) && /careo/i.test(tl), 'la tarjeta de entrada anuncia seis y nombra el careo', 'la entrada de Lecturas sigue hablando de cinco');
      ok(/Cada lectura trae sus propias preguntas/.test(tl) && /plegadas/.test(tl),
         'y avisa de que cada lectura trae sus preguntas y de que las seis empiezan plegadas', 'la entrada no avisa del plegado ni de las preguntas propias');
      ok(/cinco primeros/.test(tl) && /entrevistas imaginadas/i.test(tl) && /sexto es un careo/i.test(tl),
         'la etiqueta del estatus separa los cinco pastiches del sexto, que es el careo', 'la etiqueta del estatus no distingue el careo de los pastiches');
      ok(/Por qué seis voces/.test(tl) && /disputa que sigue abierta/i.test(tl) && /postura ya decidida/i.test(tl),
         'y la tarjeta final explica qué hace el careo que las otras cinco no pueden', 'la tarjeta final sigue diciendo cinco voces');
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl), 'las tres primeras voces están nombradas', 'faltan las voces');
      ok(/Aristegui/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl), 'y las voces de las dos entrevistas también', 'faltan las voces de las entrevistas');
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(/El hombre que midió la lluvia/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/báculo/.test(tl) && /Sancho/.test(tl) && /ínsula/.test(tl), 'el capítulo cervantino está, con Sancho gobernador adentro', 'falta el capítulo cervantino');
      ok(/La especie que aprendió a medirse/.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las dos entrevistas de la norma 5-quinquies: ids fijos para que las
         sondas las encuentren sin adivinar, y la etiqueta que dice con todas
         las letras que el encuentro nunca ocurrió. */
      const cardEntr = d.getElementById('lect-entrevista');
      const cardGala = d.getElementById('lect-gala');
      ok(!!cardEntr, 'existe la tarjeta #lect-entrevista', 'falta la tarjeta lect-entrevista');
      ok(!!cardGala, 'existe la tarjeta #lect-gala', 'falta la tarjeta lect-gala');
      ok(!!cardEntr && /nunca ocurrió/i.test((cardEntr.querySelector('.lect-nota') || {}).textContent || ''),
         'la nota de la entrevista declara que el encuentro nunca ocurrió', 'la entrevista no declara su ficción');
      ok(!!cardGala && /nunca ocurrió/i.test((cardGala.querySelector('.lect-nota') || {}).textContent || ''),
         'la nota de la conversación declara que el encuentro nunca ocurrió', 'la conversación no declara su ficción');
      ok(/El economista que enseñó sus cuadernos/.test(tl) && /Piketty/.test(tl) && /1971/.test(tl),
         'la entrevista de la casa está, con Piketty y su año de nacimiento', 'falta la entrevista de la casa');
      ok(/CNN en Español/.test(tl) && /Aristegui Noticias/.test(tl),
         'y presenta a la entrevistadora real, con sus medios', 'la entrevista no presenta a Aristegui de verdad');
      ok(/Los números de la noche/.test(tl) && /San Juan del Puerto/.test(tl) && /Brazatortas/.test(tl),
         'la conversación del Loco de la Colina está, con los datos vitales reales', 'falta la conversación Quintero y Gala');
      ok(/loco de la colina/i.test(tl) && /perro verde/i.test(tl),
         'y presenta a Quintero con sus programas reales', 'la conversación no presenta a Quintero de verdad');
      ok(!!cardEntr && cardEntr.querySelectorAll('.lect-p strong').length >= 20,
         'la entrevista marca cada turno con el nombre en mayúsculas (sin raya de diálogo)', 'la entrevista no marca los turnos');
      ok(!!cardGala && /\(Pausa\.\)|\(Silencio/.test(cardGala.textContent),
         'los silencios de Quintero van escritos como acotación', 'faltan los silencios en acotación');
      ok(!!cardGala && /tres apellidos/.test(cardGala.textContent) && /a oscuras/.test(cardGala.textContent),
         'y la conversación cierra con la regla vuelta aforismo', 'la conversación no cierra con su aforismo');
      /* Las rayas de diálogo del capítulo cervantino son guiones largos y
         violan la norma 1-bis: van en paréntesis. */
      ok(/\(dijo Sancho\)|\(respondió Sancho\)|\(dijo el mayordomo\)|\(prosiguió Sancho\)|\(dijo el gobernador\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL, y en esta etapa
         eso significa que cada atribución tiene que ser exacta. */
      ok(/reales y comprobables/i.test(tl) && /citas inventadas/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/Keeling/.test(tl) && /1958/.test(tl) && /Mauna Loa/.test(tl), 'ancla real: Keeling (1958) en Mauna Loa', 'falta Keeling dentro de los textos');
      ok(/IPCC/.test(tl) && /2021/.test(tl) && /2,5/.test(tl), 'ancla real: el IPCC (2021) con su horquilla', 'falta el IPCC dentro de los textos');
      ok(/Piketty/.test(tl) && /2014/.test(tl), 'ancla real: Piketty (2014)', 'falta Piketty dentro de los textos');
      ok(/Rognlie/.test(tl) && /2015/.test(tl) && /Giles/.test(tl) && /Financial Times/.test(tl),
         'anclas reales: Rognlie (2015) y el episodio del «Financial Times»', 'falta la auditoría de Piketty dentro de los textos');
      ok(/Lakner/.test(tl) && /Milanović/.test(tl) && /2016/.test(tl) && /Global Inequality/.test(tl),
         'anclas reales: Lakner, Milanović y «Global Inequality» (2016)', 'falta la curva del elefante dentro de los textos');
      ok(/Corlett/.test(tl) && /Resolution Foundation/.test(tl), 'ancla real: Corlett y su casa de estudios', 'falta la objeción de Corlett dentro de los textos');
      ok(/Stern/.test(tl) && /2006/.test(tl) && /Nordhaus/.test(tl) && /2018/.test(tl),
         'anclas reales: Stern (2006) y el Nobel de Nordhaus (2018)', 'falta la pareja Stern y Nordhaus dentro de los textos');
      ok(/Weitzman/.test(tl) && /2009/.test(tl), 'ancla real: Weitzman (2009)', 'falta Weitzman dentro de los textos');
      ok(/Pindyck/.test(tl) && /2013/.test(tl) && /Journal of Economic Literature/.test(tl),
         'ancla real: Pindyck (2013) con su revista', 'falta Pindyck dentro de los textos');
      ok(/Chetty/.test(tl) && /2017/.test(tl) && /Science/.test(tl), 'ancla real: Chetty (2017) en «Science»', 'falta Chetty dentro de los textos');
      ok(/báculo/i.test(tl) && /1615/.test(tl) && /cuarenta y cinco/i.test(tl),
         'ancla real declarada: el pleito del báculo (Quijote II, 45, de 1615)', 'falta el ancla real del capítulo cervantino');
      /* Y las anclas cervantinas de las otras misiones NO se repiten. */
      ok(!/batanes|rebuzno|bodas de Camacho|yelmo de Mambrino|galeotes|Edad de Oro|Montesinos|Juan Haldudo|encina|Dulcinea/i.test(tl),
         'no repite las anclas cervantinas ya usadas en la serie', 'repite un ancla ya usada en otra misión');
      /* Las tres lecturas deben ENSEÑAR el tema, no solo sonar bonito */
      ok(/(horquilla|rango)/i.test(tl) && /(qué mide|lo que cuenta|qué cosa es la que)/i.test(tl),
         'las lecturas enseñan el tema de la etapa', 'las lecturas no tocan el tema');
      ok(/(memoria|serie|anotar)/i.test(tl), 'y traen la lección de anotar en vez de discutir', 'los textos no cargan la lección del método');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie: enfrenta
       dos posturas que alguien sostiene de verdad. Por eso su etiqueta es
       otra, y por eso aquí se exige lo contrario que a los cinco pastiches:
       que NO diga «no es obra de ese autor» (no hay autor imitado) y que sí
       diga que los turnos los firman papeles y no personas. Publicar palabras
       inventadas en boca de economistas vivos sería, en esta etapa
       precisamente, la cita inflada que la misión entera enseña a cazar. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent;
      const notaC = (careo.querySelector('.lect-nota') || {}).textContent || '';
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no ponen ni una palabra en boca de ninguna persona real/i.test(notaC) && /tercera persona/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(!/NO es obra de ese autor/i.test(tc) && !/pastiche/i.test(notaC),
         'y no se etiqueta como pastiche, porque no imita a nadie', 'el careo se declara pastiche');
      /* La regla del acero antes del juicio (Expediente Rojo, etapa 1): la
         declara la propia mesa, en voz alta y dentro del texto. */
      ok(/en su mejor versión/i.test(tc), 'y cada postura va en su mejor versión (el acero antes del juicio)', 'el careo no declara la regla del acero');
      /* Las seis partes obligatorias, y en este orden. */
      ok(/una sola pregunta/i.test(tc) && /con qué tasa se descuentan/i.test(tc), '1. plantea la pregunta en disputa, y es una sola', 'al careo le falta la pregunta en disputa');
      ok(/La primera postura sostiene/.test(tc), '2. la postura A, la del descuento bajo', 'falta la postura A');
      ok(/La segunda postura sostiene/.test(tc), '3. la postura B, la del descuento leído del mercado', 'falta la postura B');
      ok(/se abren las réplicas/i.test(tc), '4. las réplicas, con cada lado contestando a la objeción concreta', 'faltan las réplicas');
      ok(/El terreno común/i.test(tc) && /aceptan la misma fórmula de Ramsey/i.test(tc), '5. el terreno común, y es ancho', 'falta el terreno común');
      ok(/Lo que sigue en disputa/i.test(tc), '6. lo que sigue en disputa, separado por clases', 'el careo no dice qué queda sin resolver');
      ok(/qué dato movería la aguja/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');
      ok(/no es una medición: es una decisión sobre a quién se cuenta/i.test(tc),
         'y qué parte no la va a resolver ningún dato', 'el careo no separa lo moral de lo medible');
      /* Las anclas de la disputa: reales, con autor, año y publicación. */
      ok(/Ramsey/.test(tc) && /1928/.test(tc) && /Economic Journal/.test(tc) && /A Mathematical Theory of Saving/.test(tc),
         'ancla real: Ramsey (1928, «Economic Journal»), de donde sale la fórmula', 'falta la fórmula de Ramsey con su año y su revista');
      ok(/Stern/.test(tc) && /2006/.test(tc) && /Tesoro británico/i.test(tc) && /0,1/.test(tc),
         'ancla real: el informe dirigido por Stern (2006) y su 0,1 %', 'falta el informe británico con su parámetro');
      ok(/Nordhaus/.test(tc) && /DICE/.test(tc) && /2018/.test(tc) && /Journal of Economic Literature/.test(tc) && /1,5/.test(tc),
         'ancla real: Nordhaus, los modelos DICE, el Nobel de 2018 y su reseña de 2007', 'falta el lado del descuento leído del mercado');
      ok(/Dasgupta/.test(tc) && /2007/.test(tc) && /National Institute Economic Review/.test(tc) && /97,5/.test(tc),
         'ancla real: Dasgupta (2007) y su tasa de ahorro del 97,5 %', 'falta la objeción de Dasgupta');
      ok(/Arrow/.test(tc) && /Economists/.test(tc), 'ancla real: Arrow (2007, «The Economists\' Voice»)', 'falta Arrow dentro del careo');
      ok(/Weitzman/.test(tc) && /2009/.test(tc) && /Review of Economics and Statistics/.test(tc),
         'ancla real: Weitzman (2009) y la lógica del seguro', 'falta la réplica de las colas');
      ok(/Sterner/.test(tc) && /Persson/.test(tc) && /2008/.test(tc) && /Dietz/.test(tc) && /2015/.test(tc),
         'anclas reales: Sterner y Persson (2008) y Dietz y Stern (2015)', 'falta el golpe en la dirección contraria');
      ok(/Millner/.test(tc) && /2013/.test(tc) && /Journal of Environmental Economics and Management/.test(tc),
         'ancla real: Millner (2013) contra el desbordamiento de la cola', 'falta la contestación publicada a las colas');
      ok(/Pindyck/.test(tc) && /2013/.test(tc) && /Journal of Economic Literature/.test(tc),
         'ancla real: Pindyck (2013), el acero que viene de dentro', 'falta la crítica a las funciones de daño');
      ok(/Determining Benefits and Costs for Future Generations/.test(tc) && /Science/.test(tc) && /2013/.test(tc),
         'ancla real: el artículo colectivo de 2013 en «Science», firmado por los dos bandos', 'falta la prueba del terreno común');
      ok(/Burke/.test(tc) && /Hsiang/.test(tc) && /Miguel/.test(tc) && /2015/.test(tc) && /Nature/.test(tc),
         'ancla real: Burke, Hsiang y Miguel (2015, «Nature»)', 'falta la función de daño anclada en observación');
      ok(/Rennert/.test(tc) && /2022/.test(tc), 'ancla real: Rennert y otros (2022), el trabajo que ya empezó', 'falta el dato que movería la aguja');
      ok(/2023/.test(tc) && /190/.test(tc) && /340/.test(tc) && /120/.test(tc),
         'ancla real: las tres tasas del costo social del carbono de 2023', 'falta la factura del parámetro en dólares');
      ok(/Acuerdo de París/.test(tc) && /2015/.test(tc), 'ancla real: el Acuerdo de París (2015)', 'falta el Acuerdo de París dentro del careo');
      /* Que estén las DOS posturas, y no una y su caricatura: cada lado le
         concede algo al otro, y el golpe más duro a la postura A no lo da su
         rival sino alguien que comparte su posición moral. */
      ok(/se contesta aceptándolo/i.test(tc) && /la aceptó el propio bando/i.test(tc)
         && /la del medio es la que de verdad se debe/i.test(tc) && /empate que se rompe midiendo/i.test(tc),
         'cada lado le concede algo al otro', 'ningún lado concede nada: es un careo de paja');
      ok(/El segundo golpe no viene de un rival/i.test(tc),
         'y la objeción más dura a la postura A no la firma su rival', 'el careo no trae la objeción que viene de casa');
      ok(/no sale «no hacer nada»/i.test(tc), 'y ninguna de las dos posturas es la caricatura del otro bando', 'el careo cuenta mal la postura B');
    }

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');
    w.go('s-lecturas'); await esperar(400);
    ok(typeof w.FaroLecturas === 'object', 'el aparato de lecturas arrancó', 'FaroLecturas no existe');
    const voces = w.FaroLecturas.voces();
    ok(voces.length === 6, 'el aparato monta las seis lecturas', 'monta ' + voces.length);
    ok(voces.every(v => v.comprension === 5 && v.completar === 2 && v.analisis === 2),
       'y cada una con sus 5, 2 y 2 preguntas', 'alguna lectura se queda sin preguntas: '
       + voces.map(v => v.clave + ' ' + v.comprension + '/' + v.completar + '/' + v.analisis).join(' · '));
    /* Todas cerradas al entrar: es la mitad del encargo, porque seis textos
       largos abiertos de golpe son veinte pantallas de alto. Y se comprueba
       con el alto CALCULADO y no con el atributo, porque ya pasó una vez que
       un display de la tarjeta le ganaba a [hidden] y el pliegue se veía
       abierto igual (las etapas de «Mis Rutas»). */
    ok(voces.every(v => !v.abierta), 'las seis empiezan plegadas', 'alguna empieza abierta');
    const cuerpos = [...d.querySelectorAll('#s-lecturas .lect-cuerpo')];
    ok(cuerpos.length === 6, 'cada lectura tiene su pliegue', 'pliegues: ' + cuerpos.length);
    ok(cuerpos.every(c => w.getComputedStyle(c).display === 'none'),
       'y de verdad no ocupan sitio (display calculado, no solo [hidden])', 'algún pliegue se ve abierto');
    const indice = d.getElementById('lectIndice');
    ok(!!indice, 'existe el índice para elegir lectura', 'falta el índice');
    ok(!!indice && indice.querySelectorAll('.lect-ind-btn').length === 6, 'con sus seis botones', 'botones del índice: ' + (indice ? indice.querySelectorAll('.lect-ind-btn').length : 0));
    /* La leyenda del código de colores va arriba del todo, antes de subrayar
       nada (norma 5-septies). En las misiones con lecturas nunca aparecía,
       porque el marcador la buscaba dentro de la primera zona y la primera
       zona ES una tarjeta. Ahora vive en el índice. */
    ok(!!indice && !!indice.querySelector('.fm-leyenda'), 'y con la leyenda del código de colores', 'la leyenda no está arriba');

    log('\n── ABRIR UNA LECTURA, Y SUS PROPIAS PREGUNTAS ──');
    d.querySelector('#lectIndice .lect-ind-btn[data-va="debate"]').click();
    await esperar(500);
    const careoCard = d.getElementById('lect-debate');
    ok(careoCard.classList.contains('lect-abierta'), 'tocar el índice abre esa lectura', 'no se abrió');
    ok(w.getComputedStyle(careoCard.querySelector('.lect-cuerpo')).display !== 'none', 'y su pliegue se ve', 'el pliegue sigue oculto');
    /* Acordeón: abrir una cierra la anterior, o volvemos a las veinte

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    log('\n── LA MARCA DE LECTURA, QUE LA PONE EL LECTOR (norma 5-nonies) ──');
    ok(typeof w.FaroMarcador.lugar === 'function', 'el marcador sabe dónde se quedó uno', 'falta FaroMarcador.lugar');

       al lado del texto desconcentra justo mientras se lee. Si alguien la

    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');

    const btnAqui = d.getElementById('fmBtnAqui');

    btnAqui.click();
    await esperar(400);
    const aqui = d.querySelectorAll('#lect-borges .fm-aqui');
    ok(aqui.length >= 1, 'y marca justo lo seleccionado', 'no se pintó la marca de lectura');
    ok(aqui.length && aqui[0].textContent.length > 0 && parrL.textContent.indexOf(aqui[0].textContent) >= 0,
       'sobre las palabras del texto, no sobre el párrafo entero', 'la marca no cayó dentro del párrafo');
    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖, aunque cruce una negrita', 'salió más de un marcador');
    const lug = w.FaroMarcador.lugar();
    ok(!!lug && lug.l === 'borges', 'el marcador la apunta', 'no apuntó nada: ' + JSON.stringify(lug));
    ok(!!w.localStorage.getItem(dentro('SAVE_KEY') + '_lugar'), 'y la guarda en este aparato', 'no quedó guardada');
    /* No puede añadir alto: en una ficha, un renglón de más parte una
       hoja y deja once (norma 5-octies). */

       'y no le añade alto al párrafo', 'la marca empujó el texto: ' + altoAntes + ' → ' + parrL.getBoundingClientRect().height);
    /* Y lo que costó media hora encontrar la primera vez: el párrafo
       marcado TIENE QUE SEGUIR SIENDO MARCABLE. En las fichas y en la

    ok(w.FaroMarcador.esMarcable(parrL), 'y el párrafo se sigue pudiendo subrayar', 'la marca deja el párrafo fuera del marcador');

       '«Seguir donde iba» abre la lectura aunque estuviera plegada', 'no abrió la lectura');

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón
       de imprimir y se lee el documento que se habría mandado a la
       impresora. Lo que no puede faltar en ninguna hoja es la etiqueta del
       estatus: un pastiche impreso sin declarar es la fuente inflada que
       esta materia enseña a cazar. */
    const abiertos = [];
    const openReal = w.open;

      const doc = { write(s) { abiertos.push(s); }, close() {} };
      return { document: doc, print() {}, focus() {}, close() {} };

    try {
      w.imprimirLectura('borges');

      ok(/NO es obra de ese autor/i.test(hb) && /Ejercicio de estilo de la casa/i.test(hb),

      ok(/báculo/i.test(hc) && /1615/.test(hc), 'y con su ancla real declarada', 'la hoja del capítulo sale sin su ancla');
      ok(!/\u2014/.test(hc), 'y sin guiones largos (norma 1-bis)', 'la hoja del capítulo trae guiones largos');

      w.imprimirLectura('harari');
      const hh = abiertos[abiertos.length - 1] || '';
      ok(/La especie que aprendió a medirse/.test(hh) && /aprendimos a medirnos/.test(hh),
         'el ensayo se imprime completo', 'el ensayo no se imprime');
      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      /* Las dos entrevistas se imprimen sueltas, y su hoja tiene que decir
         con todas las letras que el encuentro nunca ocurrió: una entrevista
         impresa sin esa línea parecería una entrevista real. */
      w.imprimirLectura('entrevista');
      const hi = abiertos[abiertos.length - 1] || '';
      ok(/El economista que enseñó sus cuadernos/.test(hi) && /ARISTEGUI\./.test(hi) && /PIKETTY\./.test(hi),
         'la entrevista se imprime con sus turnos completos', 'la entrevista no se imprime');
      ok(/tres renglones/.test(hi), 'y hasta su última respuesta', 'la hoja de la entrevista sale cortada');
      ok(/nunca ocurrió/i.test(hi), 'y con la etiqueta de que el encuentro nunca ocurrió', 'la hoja de la entrevista no declara su ficción');
      ok(!/\u2014/.test(hi), 'y sin guiones largos ni raya de diálogo', 'la hoja de la entrevista trae guiones largos');

      w.imprimirLectura('gala');
      const hg = abiertos[abiertos.length - 1] || '';
      ok(/Los números de la noche/.test(hg) && /QUINTERO\./.test(hg) && /GALA\./.test(hg),
         'la conversación se imprime con sus voces', 'la conversación no se imprime');
      ok(/a oscuras/.test(hg), 'y hasta su aforismo final', 'la hoja de la conversación sale cortada');
      ok(/nunca ocurrió/i.test(hg), 'y con la etiqueta de que el encuentro nunca ocurrió', 'la hoja de la conversación no declara su ficción');
      ok(!/\u2014/.test(hg), 'y sin guiones largos ni raya de diálogo', 'la hoja de la conversación trae guiones largos');

      /* El careo se imprime como los otros cinco, pero con la etiqueta al
         revés: la suya, la del careo, y NUNCA la del pastiche. Una hoja
         suelta que dijera «no es obra de ese autor» estaría declarando un
         autor imitado que no existe. */
      w.imprimirLectura('debate');
      const hd = abiertos[abiertos.length - 1] || '';
      ok(/LA DEFENSA\./.test(hd) && /LA OBJECIÓN\./.test(hd) && /Ramsey/.test(hd),

      ok(/Careo escrito por la casa/i.test(hd) && /una palabra en la boca/i.test(hd),

      ok(/Preguntas de esta lectura/.test(hd), 'y con sus propias preguntas detrás', 'la hoja del careo sale sin sus preguntas');
      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');
      ok((hd.match(/class="op"/g) || []).length === 20, 'sus 5 preguntas de comprensión con sus 20 opciones', 'opciones del careo: ' + (hd.match(/class="op"/g) || []).length);
      ok((hd.match(/_______________/g) || []).length === 2 && (hd.match(/class="ln-alta"/g) || []).length === 6,

      ok(/Preguntas de esta lectura/.test(hb), 'y el cuento también sale con las suyas', 'la hoja del cuento sale sin preguntas');

      w.imprimirTodasLasLecturas();
      const h3 = abiertos[abiertos.length - 1] || '';
      ok(/El hombre que midió la lluvia/.test(h3) && /báculo/.test(h3) && /La especie que aprendió a medirse/.test(h3),
         'las tres primeras lecturas van en el pliego junto', 'el pliego de las seis no trae las tres primeras');
      ok(/El economista que enseñó sus cuadernos/.test(h3) && /Los números de la noche/.test(h3),
         'y las dos entrevistas también', 'el pliego no trae las dos entrevistas');
      ok(/LA OBJECIÓN\./.test(h3) && /Cuánto vale hoy un daño de 2150/.test(h3),
         'y el careo cierra el pliego: son las seis', 'el pliego se quedó en cinco, sin el careo');
      ok((h3.match(/page-break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h3), 'y el pliego declara el pastiche de los cinco primeros', 'el pliego de las seis no declara el pastiche');
      ok(/nunca ocurrió/i.test(h3), 'y la ficción de las entrevistas', 'el pliego no declara que los encuentros nunca ocurrieron');
      ok(/careo/i.test(h3) && /papeles y no personas/i.test(h3),
         'y dice aparte qué es el sexto, que no imita a nadie', 'el pliego mete el careo en el saco del pastiche');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con 30 de comprensión', 'al pliego de preguntas le falta una sección');
      ok(/con los seis textos delante/i.test(hp) && /nunca ocurrió/i.test(hp),
         'y declara los seis textos y la ficción de las entrevistas', 'el pliego de preguntas sigue hablando de cinco textos');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(!/\u2014/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

      /* Los rótulos de las DOS PRUEBAS IMPRESAS: es ahí donde vive el número
         de etapa, y es el sitio exacto donde el molde arrastró el nombre de
         la misión anterior en misiones pasadas. Se imprimen de verdad y se
         lee el documento. Hay que GENERARLAS primero: printEval se planta si
         no existe _evalPrintData, y entonces se leería el pliego anterior. */
      w.go('s-evaluacion'); await esperar(150);
      w.genEval(); await esperar(250);
      w.genEvalCrit(); await esperar(250);
      w.printEval();
      const he = abiertos[abiertos.length - 1] || '';
      ok(/Las dos facturas/i.test(he) && /Etapa 4 · Estudio Mayor/.test(he),
         'la evaluación impresa lleva el nombre y la etapa correctos', 'la evaluación impresa trae el rótulo de otra misión');
      ok(!/Etapa [1235-9] · Estudio Mayor|Etapa [1235-9] de \d|La gran fuga|dinero no debe comprar/i.test(he),
         'y no arrastra el rótulo de otra etapa ni de la misión molde', 'la evaluación impresa dice otra etapa');
      ok(!/undefined/.test(he), 'y no imprime undefined', 'la evaluación impresa trae un undefined');
      w.printEvalCrit();
      const hec = abiertos[abiertos.length - 1] || '';
      ok(/La cifra sobre la mesa/.test(hec) && /Las dos facturas/i.test(hec),
         'la competencial impresa lleva su nombre propio', 'la competencial impresa trae el rótulo de otra misión');
      ok(/Etapa 4 · Estudio Mayor/.test(hec), 'y su número de etapa correcto', 'la competencial impresa no dice etapa 4');
      ok(!/Etapa [1235-9] · Estudio Mayor|Etapa [1235-9] de \d|bien sobre la mesa|falla sobre la mesa/i.test(hec),
         'y tampoco arrastra el de otra misión', 'la competencial impresa arrastra el rótulo de otra etapa');
      ok(!/undefined/.test(hec), 'y no imprime undefined en ninguna pauta', 'la competencial impresa trae un undefined');
    } finally { w.open = openReal; }

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/desigualdad/i.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en la factura de la desigualdad', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="desigualdad"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.labShowParte('descuento'); await esperar(150);
    ok(/descuento/i.test(d.getElementById('lab-display').textContent) || /no ha nacido/i.test(d.getElementById('lab-display').textContent),
       'y las demás piezas pintan su contenido', 'el laboratorio no pinta la pieza de la tasa de descuento');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-tareas'); await esperar(150);
    w.genTask(); await esperar(200);
    const tareas = d.getElementById('tgOut').textContent;
    ok(tareas.length > 200, 'el generador de tareas produce su hoja', 'generador vacío');
    ok(!/Deaton|gran fuga|dos objeciones|justicia y de corrupción/i.test(tareas), 'el ejemplo del generador es de esta misión', 'el generador arrastra el ejemplo de la misión molde');
    w.go('s-aprende'); await esperar(150);
    w.startMethod(); await esperar(1400);
    w.resolveMethod(true); await esperar(200);
    ok(/riqueza neta/i.test(d.getElementById('methodResult').textContent) && /concentración/i.test(d.getElementById('methodResult').textContent),
       'la simulación es la de esta etapa (el titular del uno por ciento, puesto de pie)', 'la simulación arrastra la del molde');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la cifra sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/dos facturas/i.test(rotulos) && /La cifra sobre la mesa/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'los rótulos no traen el nombre de esta misión');
    ok(!/Etapa [1235-9] · Estudio Mayor|Etapa [1235-9] de \d/.test(rotulos), 'y no dicen otra etapa', 'los rótulos de pantalla dicen otra etapa');
    ok(!/gran fuga|bien sobre la mesa|falla sobre la mesa|hombre máquina|mapa de las familias|bisturí|vigía/i.test(rotulos),
       'y no traen el nombre de otra misión', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      ok(casos.querySelectorAll('.ex-box').length === 9, 'y cada caso trae su caja de diagnóstico', 'cajas de diagnóstico: ' + casos.querySelectorAll('.ex-box').length);
      const txt = casos.textContent;
      ['titular', 'pozo', 'frijol', 'emite', 'Angelly', 'Jael', 'sufren mucho', 'M.E.T.A.S']
        .forEach(k => { if (!new RegExp(k.replace(/\./g, '\\.'), 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      /* Cada caso tiene que trabajar la cifra, que es la destreza de la etapa. */
      ok(/riqueza neta/i.test(txt) && /horquilla|rango/i.test(txt) && /fuente/i.test(txt),
         'los casos trabajan la definición, la horquilla y la fuente', 'los casos no trabajan las tres piezas de la cifra');
      ok(/atribución/i.test(txt), 'y uno enseña a no saltar de un evento a la causa', 'ningún caso trae la ciencia de atribución');
      ok(/territoriales/i.test(txt) && /consumo/i.test(txt), 'y otro las dos contabilidades de emisiones', 'ningún caso separa las dos contabilidades');
      ok(/hoja de la factura/i.test(txt), 'trae la hoja de la factura', 'falta la hoja de la factura');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/no borra la concentración|no borra el problema/i.test(txt),
         'y el aviso de que desarmar el titular no borra el problema', 'los casos no traen el aviso del error simétrico');
      /* El giro hacia adentro: uno de los ocho casos audita el proyecto propio. */
      ok(/factura que M\.E\.T\.A\.S tiene por dentro|desigualdad de acceso/i.test(txt),
         'al menos un caso audita las cifras del proyecto propio', 'ningún caso audita el proyecto propio');
      /* Y la regla de selección de esta materia. */
      ok(/como categoría/i.test(txt) && /nombre propio/i.test(txt),
         'los casos declaran la regla de selección del patio', 'los casos no declaran la regla de selección');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/titular|pozo|frijol|emitimos|Angelly|Jael|M\.E\.T\.A\.S|casa/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/NINGUNA CIFRA SIN HORQUILLA Y SIN FUENTE/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/QUÉ MIDE/.test(banda) && /ENTRE QUÉ NÚMEROS ANDA/.test(banda), 'y trae las tres preguntas de la etapa', 'la banda no trae las tres preguntas');
    ok(/KEELING 1958/.test(banda) && /IPCC 2021/.test(banda), 'y las dos fuentes del clima con su año', 'la banda no nombra a Keeling ni al IPCC');
    ok(/DE 2,5 A 4 GRADOS/.test(banda) && /MEJOR ESTIMACIÓN 3/.test(banda), 'con la horquilla entera y su centro', 'la banda da el rango sin su mejor estimación');
    ok(/PIKETTY 2014/.test(banda) && /ROGNLIE 2015/.test(banda), 'y la pareja obligada: Piketty con Rognlie al lado', 'la banda trae a Piketty sin su auditoría');
    ok(/LA CURVA DEL ELEFANTE/.test(banda) && /CORLETT 2016/.test(banda), 'y el elefante con su objeción', 'la banda trae el elefante sin objeción');
    ok(/STERN 2006 CONTRA NORDHAUS/.test(banda) && /LA TASA DE DESCUENTO/.test(banda), 'y la disputa de fondo con su nombre', 'la banda no trae la tasa de descuento');
    ok(/NO ESCOJAS LA PUNTA DEL RANGO/.test(banda), 'y el modo de fallar de la etapa', 'la banda no nombra el modo de fallar');
    ok(!/SANDEL|SATZ|TITMUSS|ROTH|CORRUPCIÓN|LAS SALIDAS SON CUATRO/.test(banda), 'sin las palabras de la etapa 3 de la ruta', 'la banda sigue siendo la de la etapa anterior');
    ok(!/PIGOU|COASE|MONOPSONIO|AKERLOF|MINSKY|DEATON|LA GRAN FUGA/.test(banda),
       'sin las palabras de las etapas 1 y 2', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-dorado-dos-facturas.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja de la factura, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja de la factura en blanco', 'falta la hoja de la factura');
    ok(/Una hoja de la factura ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/avisos al llenarla/i.test(txtF), 'con sus avisos', 'faltan los avisos de la hoja');
    ok(/Cómo se usa, en tres reglas/i.test(txtF), 'y sus reglas de uso', 'faltan las reglas de uso de la hoja');
    ok(/Piketty/.test(txtF) && /2014/.test(txtF) && /Rognlie/.test(txtF) && /2015/.test(txtF), 'la ficha trae a Piketty con su auditoría', 'la ficha cita a Piketty sin Rognlie');
    ok(/Giles/.test(txtF) && /Financial Times/.test(txtF), 'y el episodio del «Financial Times»', 'falta la objeción de datos en la ficha');
    ok(/elefante/i.test(txtF) && /Corlett/.test(txtF) && /2016/.test(txtF), 'la ficha trae la curva del elefante con su objeción', 'la ficha trae el elefante sin objeción');
    ok(/1988/.test(txtF) && /2008/.test(txtF), 'y con el periodo que mide', 'la curva de la ficha no dice su periodo');
    ok(/IPCC/.test(txtF) && /2021/.test(txtF) && /2,5/.test(txtF) && /mejor estimación/i.test(txtF), 'la ficha trae la horquilla del clima con su centro', 'falta la horquilla completa en la ficha');
    ok(/Keeling/.test(txtF) && /1958/.test(txtF) && /Mauna Loa/.test(txtF), 'y la serie de Keeling con su observatorio', 'falta Keeling en la ficha');
    ok(/París/.test(txtF) && /2015/.test(txtF) && /decisión política/i.test(txtF), 'París declarado decisión y no dato', 'la ficha no separa decisión de dato en París');
    ok(/Stern/.test(txtF) && /2006/.test(txtF) && /Nordhaus/.test(txtF) && /2018/.test(txtF), 'la ficha trae la disputa de la tasa de descuento', 'falta Stern contra Nordhaus en la ficha');
    ok(/Weitzman/.test(txtF) && /Pindyck/.test(txtF) && /2013/.test(txtF), 'con Weitzman y el acero de Pindyck', 'faltan Weitzman o Pindyck en la ficha');
    ok(/Chetty/.test(txtF) && /2017/.test(txtF) && /Science/.test(txtF), 'y la movilidad medida', 'falta la movilidad en la ficha');
    ok(/Kaya/.test(txtF), 'la ficha trae la identidad de Kaya', 'falta la identidad de Kaya en la ficha');
    ok(/punta del rango/i.test(txtF), 'y el modo de fallar de la etapa', 'falta el modo de fallar en la ficha');
    ok(/no significa que el problema no exista|no borra el problema/i.test(txtF), 'con su aviso contra el error simétrico', 'falta el aviso del error simétrico');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok((txtF.match(/<ol\b/g) || []).length === (txtF.match(/<\/ol>/g) || []).length, 'ninguna lista quedó partida entre dos hojas', 'hay listas abiertas sin cerrar');
    ok(/muy auditado/i.test(txtF) && /disputa de valores/i.test(txtF) && /publica su rango/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/Sandel|Satz|Titmuss|Roth|Pigou|Akerlof|Minsky/i.test(txtF),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos de las etapas anteriores');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-dorado-dos-facturas"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Dorado/.test(c.textContent));
    ok(!!ruta, 'la Ruta del Expediente Dorado está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 5, 'con sus cinco primeras etapas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 2, 'y 2 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/La gran fuga/i.test(ruta.textContent) && /Las fallas de la máquina/i.test(ruta.textContent) && /Lo que el dinero no debe comprar/i.test(ruta.textContent) && /Las dos facturas/i.test(ruta.textContent) && /El escocés dorado/i.test(ruta.textContent),
         'las cinco etapas construidas salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La palabra gastada/.test(ruta.textContent) && /Visto desde el patio/.test(ruta.textContent), 'las dos siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    /* El expediente gemelo tiene que seguir en pie al lado, porque la Bóveda
       no acepta uno sin el otro y eso vive en el mapa, no solo en el texto. */
    const rutaRoja = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Rojo/.test(c.textContent));
    ok(!!rutaRoja, 'y la Ruta del Expediente Rojo sigue en el mapa, al lado', 'no aparece el expediente gemelo');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /dos facturas/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /🌡️/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda las dos facturas etapa 4';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda las dos facturas etapa 4'; }
});
</script>
</body>
</html>
