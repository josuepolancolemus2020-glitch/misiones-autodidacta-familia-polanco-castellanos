<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Expediente Dorado, etapa 2</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-dorado-fallas-maquina/fallas-maquina.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta del Expediente Dorado (Crítica al
   Capitalismo, materia 27 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y SEIS lecturas: las cinco de
   la norma 5-quinquies, con sus dos entrevistas imaginadas, y el CAREO de la
   norma 5-nonies) y las TRES BATERÍAS repartidas POR LECTURA (30 de
   comprensión, 12 de completar y 12 de análisis, o sea 5, 2 y 2 en cada uno
   de los seis textos), con la impresión comprobada de verdad.

   De la norma 5-nonies se comprueba además lo que no es contenido sino
   aparato: que las seis empiecen PLEGADAS con el alto calculado y no solo
   con el atributo, que abrir una cierre la anterior, que cada lectura traiga
   sus tres baterías DENTRO y sume XP donde debe, que la batería vieja del
   final ya no exista, que la barra de marcar se abra junto al trozo y sin
   salirse en 380 px, y que la MARCA DE LECTURA se ponga sola, se guarde y
   devuelva a su sitio.

   La REGLA DEL ESTATUS del compendio rige también aquí, y esta etapa trae
   la lista más peleada de la ruta, así que se comprueba fuente por fuente:
   Pigou (1920) y Coase (1960) como CLÁSICOS SÓLIDOS, con Coase declarado LA
   CONTRACRÍTICA OBLIGADA y, sobre todo, con SU PROPIA ADVERTENCIA DE 1988,
   que es la que casi nadie cita y la que esta casa exige; Akerlof (1970)
   como clásico sólido con su Nobel de 2001; Greenwald y Stiglitz (1986)
   como EL RESULTADO GENERAL; Manning (2003) como la referencia académica
   del MONOPSONIO, que es la falla que casi nadie enseña; Card y Krueger
   (1994) contra Neumark y Wascher como DISPUTA EMPÍRICA VIVA; Minsky (1986)
   con la etiqueta doble de heterodoxo en su día y REHABILITADO TRAS 2008; y
   el informe de la Financial Crisis Inquiry Commission (2011) como fuente
   oficial CITADA CON SUS DISIDENCIAS.

   Cuatro cuidados del compendio se comprueban a máquina porque gobiernan la
   misión. Uno: LA CRÍTICA LA FIRMAN LOS PROPIOS ECONOMISTAS, y eso se dice
   en voz alta porque es lo que impide despacharla como cosa del otro
   estante. Dos: LA LETRA PEQUEÑA DEL TEOREMA, con sus cuatro supuestos, de
   los que salen las cuatro familias de fallas. Tres: el modo de fallar es
   SALTAR DE LA FALLA A LA CONSIGNA, y contra eso van la hoja de la falla y
   la regla de que NINGUNA REGLA ES GRATIS. Cuatro: la falla de mercado se
   compara con LA FALLA DE GOBIERNO CONCRETA y no con un gobierno imaginario,
   y esa regla corta en las dos direcciones.

   Y el CERO PARTIDISMO HONDUREÑO ACTUAL, con la regla propia de la materia:
   los conflictos vivos del patio entran COMO CATEGORÍA y no como caso con
   nombre propio, que aquí importa doble porque los casos hablan de un solo
   empleador, de un solo proveedor y de un taller que contamina. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Expediente Dorado · Etapa 2 de 7/.test(d.body.textContent), 'se presenta como etapa 2 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 1 de esta misma ruta. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-dorado-gran-fuga"], a[href*="ruta-atomos-hombre-maquina"], a[href*="ruta-gafas-mapa-familias"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/Deaton|McCloskey|Kocka|Hickel|Roser|gran enriquecimiento|hoja de la cifra/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la etapa 1 (la gran fuga)', 'queda vocabulario de la etapa 1 de esta ruta');
    ok(!/cifra suelta|acero primero|pelea de la línea|pelea de la atribución/i.test(cuerpoSinEnlaces),
       'sin las piezas de la etapa molde', 'quedan piezas de la misión molde');
    ok(!/📒/.test(cuerpoSinEnlaces), 'sin el emoji de la misión molde', 'queda el 📒 de la gran fuga fuera de los enlaces');
    ok(!/La Mettrie|brocha gorda|batán|hombre de paja|Holodomor/i.test(cuerpoSinEnlaces),
       'sin restos de otras misiones del arco', 'queda vocabulario de otra misión del Estudio Mayor');
    /* Y lo que SÍ tiene que quedar: la etapa 1 remitida como el acero que
       vuelve auditoría lo que aquí se hace, y los enlaces declarados. */
    ok(/etapa 1/i.test(d.body.textContent) && /(columna del haber|acero)/i.test(d.body.textContent),
       'la etapa 1 se remite como el acero que sostiene esta auditoría', 'no se remite a la etapa 1');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-dorado-gran-fuga"]'),
       'Recursos enlaza la etapa 1 de la ruta', 'falta el enlace a la etapa 1');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-rojo-acero-juicio"]'),
       'y sigue enlazando el expediente gemelo', 'falta el enlace al expediente gemelo');
    ok(/se archivan juntos/i.test(d.body.textContent) && /uno sin el otro/i.test(d.body.textContent),
       'y mantiene la regla de archivo de los dos expedientes', 'falta la regla de archivo');
    /* El guion largo se busca por su código (\u2014) y no escrito: si la
       sonda lo escribiera, el propio archivo que persigue la norma 1-bis
       sería el único del lote que la incumple, y quien pase el grep de
       control encontraría un falso positivo justo en la herramienta de
       control. */
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');
    /* Cero partidismo hondureño actual, y con la regla de selección de esta
       materia, que aquí importa doble porque los casos hablan de un solo
       empleador, de un solo proveedor y de un taller que contamina. */
    /* El careo declara en su nota que no respalda a «ningún gobierno, partido
       o campaña». Eso es la regla cumpliéndose y no incumpliéndose, así que
       la negación se quita antes de buscar: lo que la materia prohíbe es un
       partido NOMBRADO, no la palabra suelta. Sin esta salvedad, la única
       lectura que declara su neutralidad por escrito sería la que suspende. */
    const sinPolitica = d.body.textContent.replace(/ning(ún|una)\s+(gobierno,\s*)?partido[^.]*/gi, '');
    ok(!/\b(partido|diputad|alcalde|candidat)[a-zóí]*\b/i.test(sinPolitica),
       'ni un político vivo ni un partido nombrado (cero partidismo actual)', 'aparece un cargo o un partido de la política de hoy');
    ok(/como categoría/i.test(d.body.textContent) && /nombre propio/i.test(d.body.textContent),
       'y la regla de selección: los casos del patio entran como categoría', 'falta la regla de selección de esta materia');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Pigou/.test(texto0) && /The Economics of Welfare/.test(texto0) && /1920/.test(texto0),
       'Pigou (1920) con el título de su obra', 'falta Pigou con su obra y su año');
    ok(/Coase/.test(texto0) && /The Problem of Social Cost/.test(texto0) && /1960/.test(texto0),
       'Coase (1960) con el título de su obra', 'falta Coase con su obra y su año');
    ok(/contracrítica obligada/i.test(texto0), 'y declarado LA CONTRACRÍTICA OBLIGADA', 'no se declara a Coase como contracrítica obligada');
    /* La pieza que más fácil se pierde, y la que esta casa exige siempre. */
    ok(/The Firm, the Market and the Law/.test(texto0) && /1988/.test(texto0),
       'la rectificación de Coase de 1988, con el título del libro', 'falta la rectificación de Coase de 1988');
    ok(/negociar cuesta poco/i.test(texto0), 'y su contenido: vale donde negociar cuesta poco', 'no se dice qué advirtió Coase');
    ok(/Akerlof/.test(texto0) && /The Market for Lemons/.test(texto0) && /1970/.test(texto0) && /2001/.test(texto0),
       'Akerlof (1970) con su obra y su Nobel de 2001', 'falta Akerlof completo');
    ok(/Greenwald/.test(texto0) && /Stiglitz/.test(texto0) && /1986/.test(texto0),
       'Greenwald y Stiglitz (1986)', 'faltan Greenwald y Stiglitz');
    ok(/(regla|no son eficientes)/i.test(texto0) && /información imperfecta/i.test(texto0),
       'y su resultado general: con información imperfecta la ineficiencia es la regla', 'falta el resultado general');
    ok(/Manning/.test(texto0) && /Monopsony in Motion/.test(texto0) && /2003/.test(texto0),
       'Manning (2003) con el título de su obra', 'falta Manning con su obra');
    ok(/Card/.test(texto0) && /Krueger/.test(texto0) && /1994/.test(texto0) && /Neumark/.test(texto0) && /Wascher/.test(texto0),
       'Card y Krueger (1994) contra Neumark y Wascher, con los cuatro nombres', 'falta alguno de los cuatro nombres de la disputa');
    ok(/disputa empírica viva/i.test(texto0), 'y declarada DISPUTA EMPÍRICA VIVA', 'no se declara viva la disputa del salario mínimo');
    ok(/Minsky/.test(texto0) && /Stabilizing an Unstable Economy/.test(texto0) && /1986/.test(texto0),
       'Minsky (1986) con el título de su obra', 'falta Minsky con su obra');
    ok(/heterodoxo/i.test(texto0) && /rehabilitado/i.test(texto0),
       'y con su etiqueta doble: heterodoxo en su día, rehabilitado tras 2008', 'a Minsky le falta la etiqueta doble');
    ok(/Financial Crisis Inquiry Commission/.test(texto0) && /2011/.test(texto0),
       'el informe oficial de 2011, con su nombre completo', 'falta el informe oficial de la crisis');
    ok(/disidencias/i.test(texto0), 'y con la regla de citarlo con sus disidencias', 'no se declara que el informe se cita con sus disidencias');
    ok(/pastiche/i.test(texto0) && /no obra de esos autores/i.test(texto0),
       'y el pastiche de las lecturas declarado', 'el pastiche no se declara en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15,
       'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'externalidad,poder,informacion,dinamica', 'laboratorio con las 4 fallas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos del camino de las fallas', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    /* Las tres baterías de las lecturas se comprueban más abajo, en su
       propia sección: con la norma 5-nonies lo que importa no es el total
       sino el reparto por lectura. */
    ok(/faro_dorado_fallas/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/los propios economistas/i.test(texto), 'la crítica la firman los propios economistas', 'no se dice quién firma la crítica');
    ok(/letra pequeña/i.test(texto), 'la letra pequeña del teorema, con ese nombre', 'falta la letra pequeña del teorema');
    ok(/mercados completos/i.test(texto) && /información perfecta/i.test(texto) && /poder de mercado/i.test(texto) && /terceros/i.test(texto),
       'los cuatro supuestos, enumerados', 'faltan supuestos del teorema');
    ok(/cada supuesto que falla/i.test(texto) && /familia/i.test(texto),
       'y la idea que ordena la etapa: cada supuesto que falla es una familia de fallas', 'falta la idea que ordena la etapa');
    ok(/externalidad/i.test(texto) && /no firmó/i.test(texto), 'la externalidad, con su definición de andar por casa', 'falta la externalidad');
    ok(/monopolio/i.test(texto) && /monopsonio/i.test(texto), 'el monopolio y el monopsonio, los dos', 'falta una de las dos formas del poder de mercado');
    ok(/único que compra/i.test(texto) && /sin violar ninguna ley/i.test(texto),
       'y el monopsonio explicado sin culpables: paga de menos sin violar ley alguna', 'no se explica el monopsonio por la estructura');
    ok(/casi nadie enseña/i.test(texto), 'y señalado como la falla que casi nadie enseña', 'no se dice que el monopsonio se enseña poco');
    ok(/precio de promedio|precio promedio/i.test(texto) && /se retira/i.test(texto),
       'el mecanismo de los limones, paso a paso', 'falta el mecanismo de Akerlof');
    ok(/estabilidad/i.test(texto) && /inestabilidad/i.test(texto), 'la falla dinámica: la estabilidad incuba inestabilidad', 'falta la tesis de Minsky');
    ok(/prudente/i.test(texto) && /especulativ/i.test(texto) && /pirámide/i.test(texto),
       'con sus tres escalones', 'faltan los escalones de Minsky');
    ok(/2008/.test(texto) && /(burbuja|derivados)/i.test(texto), 'y la ficha de 2008, que esta materia se queda entera', 'falta la ficha de 2008');
    ok(/el mercado falla/i.test(texto), 'el modo de fallar: la consigna «el mercado falla»', 'falta el modo de fallar de la etapa');
    ok(/ninguna regla es gratis/i.test(texto), 'la regla de que ninguna regla es gratis', 'falta la regla de la factura');
    ok(/falla de gobierno/i.test(texto), 'y la comparación con la falla de gobierno concreta', 'falta la comparación con la falla de gobierno');
    ok(/hoja de la falla/i.test(texto), 'la hoja de la falla, con ese nombre', 'falta la hoja de la falla');
    /* Las fronteras declaradas de esta etapa. */
    ok(/Economía política/i.test(texto) && /Gran Depresión/i.test(texto),
       'la Gran Depresión remitida a Economía política', 'no se remite la Gran Depresión');
    ok(/etapa 3/i.test(texto) && /etapa 4|son la 4/i.test(texto), 'y las etapas siguientes declaradas', 'la etapa no dice qué viene después');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/don Marcial/i.test(tg), 'el guion tiene personaje, y no es una clase hablada', 'el guion no tiene personaje');
      ok(/7:00|6:10 a 7:00/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(18\d\d|19\d\d|20\d\d)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/1920/.test(tg) && /1960/.test(tg) && /1970/.test(tg) && /2001/.test(tg) && /1986/.test(tg), 'el guion trae las fechas de la etapa', 'al guion le faltan fechas');
      /* El guion tiene que nombrar la falla del personaje, que es la que casi
         nadie enseña, y no quedarse en la denuncia. */
      ok(/monopsonio/i.test(tg), 'y nombra el monopsonio, que es la falla del personaje', 'el guion no nombra la falla de don Marcial');
      ok(/las cuatro/i.test(tg) || (/externalidad/i.test(tg) && /asimétrica|Akerlof/i.test(tg) && /Minsky/i.test(tg)),
         'y recorre las cuatro fallas en la escena de la herramienta', 'el guion no recorre las cuatro fallas');
      ok(/falla de gobierno|nadie invierte|ministerio imaginario|no prueba que el gobierno/i.test(tg),
         'y contesta la objeción con la factura de la regla', 'el guion no contesta la objeción de regularlo todo');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl), 'las tres voces están nombradas', 'faltan las voces');
      ok(/Poniatowska/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl), 'y las dos voces nuevas de la norma 5-quinquies también', 'faltan las voces de las entrevistas');
      ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(/El catálogo de los cuatro supuestos/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/atado a una encina/.test(tl) && /Sancho/.test(tl) && /don Quijote/.test(tl), 'el capítulo cervantino está, con Sancho adentro', 'falta el capítulo cervantino');
      ok(/El manual que nadie lee/.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las rayas de diálogo del capítulo cervantino son guiones largos y
         violan la norma 1-bis: van en paréntesis. */
      ok(/\(dijo don Quijote\)|\(dijo Sancho\)|\(respondió Sancho\)|\(replicó don Quijote\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL, y en esta etapa
         eso significa que cada atribución tiene que ser exacta. */
      ok(/reales y comprobables/i.test(tl) && /citas inventadas/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/Pigou/.test(tl) && /1920/.test(tl), 'ancla real: Pigou (1920)', 'falta Pigou dentro de los textos');
      ok(/Coase/.test(tl) && /1960/.test(tl) && /1988/.test(tl), 'anclas reales: Coase (1960) y su rectificación de 1988', 'falta Coase con sus dos fechas');
      ok(/The Firm, the Market and the Law/.test(tl), 'y con el título del libro donde rectifica', 'falta el título de la rectificación de Coase');
      ok(/Akerlof/.test(tl) && /1970/.test(tl) && /2001/.test(tl), 'anclas reales: Akerlof (1970) y su Nobel de 2001', 'falta Akerlof dentro de los textos');
      ok(/Greenwald/.test(tl) && /Stiglitz/.test(tl) && /1986/.test(tl), 'ancla real: Greenwald y Stiglitz (1986)', 'faltan Greenwald y Stiglitz dentro de los textos');
      ok(/Manning/.test(tl) && /2003/.test(tl) && /Monopsony in Motion/.test(tl), 'ancla real: Manning (2003) y su título', 'falta Manning dentro de los textos');
      ok(/Card/.test(tl) && /Krueger/.test(tl) && /1994/.test(tl) && /Neumark/.test(tl) && /Wascher/.test(tl),
         'anclas reales: los cuatro nombres de la disputa del salario mínimo', 'faltan nombres de la disputa dentro de los textos');
      ok(/Minsky/.test(tl) && /1986/.test(tl) && /2008/.test(tl), 'anclas reales: Minsky (1986) y su rehabilitación en 2008', 'falta Minsky dentro de los textos');
      ok(/2011/.test(tl) && /disidencias/i.test(tl), 'ancla real: el informe de 2011, con sus disidencias', 'falta el informe de 2011 dentro de los textos');
      ok(/encina/i.test(tl) && /1605/.test(tl) && /(cuarto|capítulo cuarto)/i.test(tl),
         'ancla real declarada: Andrés atado a la encina (Quijote I, 4, de 1605)', 'falta el ancla real del capítulo cervantino');
      /* Y las anclas cervantinas de las otras misiones NO se repiten. */
      ok(!/batanes|rebuzno|bodas de Camacho|Samuel Johnson|yelmo de Mambrino|galeotes|Edad de Oro|Montesinos/i.test(tl),
         'no repite las anclas cervantinas ya usadas en la serie', 'repite un ancla ya usada en otra misión');
      /* Las tres lecturas deben ENSEÑAR el tema, no solo sonar bonito */
      ok(/(supuesto|condiciones de operación)/i.test(tl) && /(monopsonio|un solo amo|un amo)/i.test(tl),
         'las lecturas enseñan el tema de la etapa', 'las lecturas no tocan el tema');
      ok(/(no hay remedio de balde|cuesta|factura)/i.test(tl), 'y traen la lección de que ninguna regla es gratis', 'los textos no cargan la lección de la factura');
      /* Las dos entrevistas de la norma 5-quinquies: existen con sus ids
         fijos, y su etiqueta dice con todas las letras que el encuentro
         NUNCA OCURRIÓ, porque una entrevista sin esa línea circula como si
         fuera de verdad, que es la cita apócrifa más grande posible. */
      const cardEnt = d.getElementById('lect-entrevista');
      const cardGala = d.getElementById('lect-gala');
      ok(!!cardEnt, 'la entrevista de la casa está (id lect-entrevista)', 'falta la tarjeta lect-entrevista');
      ok(!!cardGala, 'la conversación del Loco de la Colina está (id lect-gala)', 'falta la tarjeta lect-gala');
      if (cardEnt) {
        const notaEnt = cardEnt.querySelector('.lect-nota');
        ok(!!notaEnt && /nunca ocurrió/i.test(notaEnt.textContent), 'la entrevista declara que el encuentro nunca ocurrió', 'la entrevista no declara la ficción');
        ok(/Akerlof/.test(cardEnt.textContent) && /Poniatowska/.test(cardEnt.textContent), 'con Akerlof preguntado a la manera de Poniatowska', 'faltan el entrevistado o la entrevistadora');
        ok(/Cervantes 2013/.test(cardEnt.textContent) && /Tlatelolco/.test(cardEnt.textContent), 'y la seña real de la entrevistadora (Cervantes 2013 y «La noche de Tlatelolco»)', 'la presentación no dice quién es Poniatowska de verdad');
        ok(!!notaEnt && /(vivo|persona viva)/i.test(notaEnt.textContent), 'y declara que el entrevistado está vivo y no dijo estas palabras', 'no se declara que Akerlof está vivo');
        ok(cardEnt.querySelectorAll('.lect-p').length >= 12, 'la entrevista trae sus intercambios', 'la entrevista quedó corta: ' + cardEnt.querySelectorAll('.lect-p').length);
        ok(/trivial/i.test(cardEnt.textContent) && /Spence/.test(cardEnt.textContent), 'con los tres rechazos del artículo y el Nobel compartido', 'faltan los rechazos o el Nobel compartido');
        ok(/New Haven/.test(cardEnt.textContent) && /Yellen/.test(cardEnt.textContent) && /India/.test(cardEnt.textContent), 'con las anclas biográficas reales de Akerlof', 'faltan las anclas biográficas de Akerlof');
      }
      if (cardGala) {
        const notaGala = cardGala.querySelector('.lect-nota');
        ok(!!notaGala && /nunca ocurrió/i.test(notaGala.textContent), 'la conversación declara que la charla nunca ocurrió', 'la conversación no declara la ficción');
        ok(/QUINTERO/.test(cardGala.textContent) && /GALA/.test(cardGala.textContent), 'con los hablantes marcados en mayúsculas (sin raya de diálogo)', 'faltan los hablantes marcados');
        ok(/\(Silencio/.test(cardGala.textContent), 'los silencios de Quintero van como acotación', 'no hay silencios en acotación');
        ok(/Séneca/.test(cardGala.textContent) && /al-Ándalus/.test(cardGala.textContent) && /Troylo/.test(cardGala.textContent), 'con las anclas reales de Gala (Séneca, al-Ándalus, Troylo)', 'faltan las anclas reales de Gala');
        ok(/El manuscrito carmesí/.test(cardGala.textContent) && /1990/.test(cardGala.textContent), 'y «El manuscrito carmesí» con su Planeta de 1990', 'falta el Manuscrito carmesí fechado');
        ok(cardGala.querySelectorAll('.lect-p').length >= 10, 'la conversación trae sus intercambios', 'la conversación quedó corta: ' + cardGala.querySelectorAll('.lect-p').length);
      }
      /* Los datos duros de la etapa entran también por las dos entrevistas. */
      const tEnt = (cardEnt ? cardEnt.textContent : '') + ' ' + (cardGala ? cardGala.textContent : '');
      ok(/1920/.test(tEnt) && /1960/.test(tEnt) && /1988/.test(tEnt), 'las entrevistas traen a Pigou y a Coase con sus tres fechas', 'a las entrevistas les faltan las fechas de Pigou y Coase');
      ok(/1970/.test(tEnt) && /2001/.test(tEnt) && /promedio/.test(tEnt), 'y el mecanismo de los limones fechado con su Nobel', 'falta el mecanismo de Akerlof en las entrevistas');
      ok(/monopsonio/i.test(tEnt) && /2003/.test(tEnt) && /Manning/.test(tEnt), 'y el monopsonio con Manning (2003)', 'falta el monopsonio en las entrevistas');
      ok(/1994/.test(tEnt) && /Neumark/.test(tEnt) && /Wascher/.test(tEnt), 'y la disputa del salario mínimo con sus nombres', 'falta la disputa del salario mínimo en las entrevistas');
      ok(/Minsky/.test(tEnt) && /1986/.test(tEnt) && /2008/.test(tEnt), 'y Minsky fechado con su rehabilitación de 2008', 'falta Minsky en las entrevistas');
      ok(/2011/.test(tEnt) && /disidencias/i.test(tEnt), 'y el informe de 2011 con sus disidencias', 'falta el informe de 2011 en las entrevistas');
      ok(/mercados completos/i.test(tEnt) && /información perfecta/i.test(tEnt), 'y los cuatro supuestos del teorema dentro de las entrevistas', 'faltan los supuestos del teorema en las entrevistas');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie: enfrenta
       dos posturas reales. Por eso su etiqueta es distinta y por eso aquí se
       exige lo contrario que a los otros cinco: que NO diga «no es obra de
       ese autor» (no hay autor imitado) y que sí diga que los turnos los
       firman papeles y no personas. En esta etapa la regla pesa doble,
       porque la disputa del salario mínimo está viva y publicar palabras
       inventadas en boca de investigadores que están vivos sería exactamente
       la fuente inflada que la materia enseña a cazar. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent;
      const notaC = (careo.querySelector('.lect-nota') || {}).textContent || '';
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no poner palabras inventadas en boca de nadie|no se le pone a nadie una palabra en la boca|no personas/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(/mejor versión/i.test(notaC), 'y que cada postura va en su mejor versión (el acero antes del juicio)', 'el careo no declara la regla del acero');
      ok(/tercera persona/i.test(notaC), 'y que los investigadores se citan como fuentes, en tercera persona', 'el careo no declara cómo cita a las personas reales');
      /* Las seis partes obligatorias, y en su orden. */
      ok(/pregunta en disputa/i.test(tc), '1. plantea la pregunta en disputa', 'al careo le falta la pregunta en disputa');
      ok(/postura A, en su mejor versión/i.test(tc), '2. da la postura A en su mejor versión', 'al careo le falta la postura A');
      ok(/postura B, también en su mejor versión/i.test(tc), '3. da la postura B en su mejor versión', 'al careo le falta la postura B');
      ok(/las réplicas/i.test(tc), '4. trae las réplicas de cada lado', 'al careo le faltan las réplicas');
      ok(/terreno común/i.test(tc) && /aceptan/i.test(tc), '5. dice qué aceptan las dos posturas', 'al careo le falta el terreno común');
      ok(/sigue en disputa/i.test(tc), '6. dice qué sigue en disputa', 'el careo no dice qué queda sin resolver');
      ok(/dato lo resolvería/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');
      /* Las anclas de la disputa, que son reales y comprobables: la norma
         5-nonies exige que los dos lados los sostenga alguien de verdad,
         citado por autor, año y revista. */
      ok(/Joan Robinson/.test(tc) && /1933/.test(tc) && /The Economics of Imperfect Competition/.test(tc),
         'ancla real: Joan Robinson (1933) y la palabra monopsonio', 'falta el origen del monopsonio');
      ok(/Card/.test(tc) && /Krueger/.test(tc) && /1994/.test(tc) && /American Economic Review/.test(tc) && /Nueva Jersey/.test(tc) && /Pensilvania/.test(tc),
         'ancla real: Card y Krueger (1994) con Nueva Jersey contra Pensilvania', 'falta el estudio de 1994 con su revista');
      ok(/4,25/.test(tc) && /5,05/.test(tc), 'y con la subida medida, en dólares por hora', 'el careo no dice de cuánto fue la subida de 1992');
      ok(/Myth and Measurement/.test(tc) && /1995/.test(tc), 'ancla real: «Myth and Measurement» (1995)', 'falta el libro de Card y Krueger');
      ok(/Dube/.test(tc) && /Lester/.test(tc) && /Reich/.test(tc) && /2010/.test(tc), 'ancla real: Dube, Lester y Reich (2010) y los condados vecinos', 'falta el diseño de condados vecinos');
      ok(/Cengiz/.test(tc) && /Lindner/.test(tc) && /Zipperer/.test(tc) && /2019/.test(tc), 'ancla real: Cengiz, Dube, Lindner y Zipperer (2019)', 'falta el recuento por tramo de salario');
      ok(/Manning/.test(tc) && /Monopsony in Motion/.test(tc) && /2003/.test(tc), 'ancla real: Manning (2003)', 'falta la referencia moderna del monopsonio');
      ok(/Journal of Economic Perspectives/.test(tc) && /2021/.test(tc), 'y su artículo de 2021 sobre lo esquivo del efecto', 'falta la concesión de Manning en 2021');
      ok(/Neumark/.test(tc) && /Wascher/.test(tc) && /2000/.test(tc) && /nómina/i.test(tc),
         'ancla real: Neumark y Wascher (2000) con los registros de nómina', 'falta la réplica de las nóminas');
      ok(/Minimum Wages/.test(tc) && /MIT Press/.test(tc) && /2008/.test(tc), 'ancla real: «Minimum Wages» (MIT Press, 2008)', 'falta el libro de Neumark y Wascher');
      ok(/Shirley/.test(tc) && /2022/.test(tc) && /Industrial Relations/.test(tc), 'ancla real: Neumark y Shirley (2022) y su recuento', 'falta el recuento de estimaciones de 2022');
      ok(/Meer/.test(tc) && /West/.test(tc) && /2016/.test(tc) && /Journal of Human Resources/.test(tc),
         'ancla real: Meer y West (2016) y el daño en el crecimiento', 'falta el argumento del crecimiento del empleo');
      ok(/Lordan/.test(tc) && /Labour Economics/.test(tc) && /2018/.test(tc), 'ancla real: Lordan y Neumark (2018) y la automatización', 'falta el estudio de los empleos automatizables');
      ok(/Jardim/.test(tc) && /2017/.test(tc) && /Universidad de Washington/.test(tc) && /Reich/.test(tc) && /Allegretto/.test(tc) && /Godoey/.test(tc),
         'ancla real: los dos estudios de Seattle de 2017, con sus dos equipos', 'faltan los dos equipos de Seattle');
      ok(/NBER 25182/.test(tc) && /2018/.test(tc), 'y el seguimiento por trabajador de 2018', 'falta el seguimiento por trabajador de Seattle');
      ok(/Stigler/.test(tc) && /1946/.test(tc) && /The Economics of Minimum Wage Legislation/.test(tc),
         'ancla real: Stigler (1946), que anotó la excepción desde el otro estante', 'falta la cita de Stigler en el terreno común');
      ok(/Rothstein/.test(tc) && /2010/.test(tc) && /Lee y Saez/.test(tc) && /2012/.test(tc),
         'anclas reales: Rothstein (2010) y Lee y Saez (2012), sobre el crédito fiscal', 'falta la alternativa del crédito fiscal con sus fuentes');
      ok(/Harasztosi/.test(tc) && /Lindner/.test(tc) && /Hungría/.test(tc) && /2001/.test(tc),
         'ancla real: Harasztosi y Lindner y la subida grande de Hungría', 'falta la medición por encima del rango probado');
      ok(/59 por ciento/.test(tc) && /mediano/.test(tc), 'y el techo de lo medido: el 59 por ciento del salario mediano', 'falta hasta dónde llega la evidencia reunida');
      ok(/Oficina de Presupuesto del Congreso/.test(tc) && /1,3 millones/.test(tc),
         'y la estimación de 2019, con sus dos cifras juntas', 'falta la estimación oficial con las dos cifras');
      /* Que las dos posturas estén de verdad, y no una y su caricatura. */
      ok(/conced/i.test(tc) && /Acepto que/.test(tc), 'cada lado le concede algo al otro', 'ningún lado concede nada: es un careo de paja');
      ok(/no ha declarado una postura general|no como bandos/i.test(notaC),
         'y los estudios de Seattle entran como resultados, no como bandos', 'el careo convierte a dos equipos en dos bandos');
      ok(/no decide el salario mínimo de ningún país|no fija el salario mínimo de ningún país/i.test(tc + notaC),
         'y el careo declara que no fija el salario mínimo de ningún país (cero partidismo)', 'el careo no se declara fuera de la política del patio');
    }

    log('\n── LAS BATERÍAS DE LAS LECTURAS (normas 5-quater, 5-quinquies y 5-nonies) ──');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'existe el logro de las lecturas (lect_master)', 'falta el logro lect_master');
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos baterías POR
       LECTURA. Sin esto, una lectura se publica con su tarjeta de preguntas
       vacía y nadie se entera hasta que un alumno la abre. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis sin pauta');
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada una dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* Una pregunta de completar que se contestaba con tres lecturas a la vez
       ya no sirve: ahora vive DENTRO de una sola. Las etiquetas sueltas que
       traía este banco («las cinco», «todas», «Borges y Harari») delatan que
       el reparto quedó a medias. */
    ok(dentro('lectCompletarBank.every(q => ["Borges","Cervantes","Harari","Entrevista","Quintero y Gala","Debate"].indexOf(q.t) >= 0)'),
       'y ninguna pregunta de completar quedó con etiqueta de varias lecturas', 'hay completar con etiqueta suelta');

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');
    w.go('s-lecturas'); await esperar(400);
    ok(typeof w.FaroLecturas === 'object', 'el aparato de lecturas arrancó', 'FaroLecturas no existe');
    const voces = w.FaroLecturas.voces();
    ok(voces.length === 6, 'el aparato monta las seis lecturas', 'monta ' + voces.length);
    ok(voces.every(v => v.comprension === 5 && v.completar === 2 && v.analisis === 2),
       'y cada una con sus 5, 2 y 2 preguntas', 'alguna lectura se queda sin preguntas: '
       + voces.map(v => v.clave + ' ' + v.comprension + '/' + v.completar + '/' + v.analisis).join(' · '));
    /* Todas cerradas al entrar: es la mitad del encargo. Y se comprueba con
       el alto calculado, no con el atributo, porque ya pasó una vez que un
       display de la tarjeta le ganaba a [hidden] y el pliegue se veía
       abierto igual (las etapas de «Mis Rutas»). */
    ok(voces.every(v => !v.abierta), 'las seis empiezan plegadas', 'alguna empieza abierta');
    const cuerpos = [...d.querySelectorAll('#s-lecturas .lect-cuerpo')];
    ok(cuerpos.length === 6, 'cada lectura tiene su pliegue', 'pliegues: ' + cuerpos.length);
    ok(cuerpos.every(c => w.getComputedStyle(c).display === 'none'),
       'y de verdad no ocupan sitio (display calculado, no solo [hidden])', 'algún pliegue se ve abierto');
    const indice = d.getElementById('lectIndice');
    ok(!!indice, 'existe el índice para elegir lectura', 'falta el índice');
    ok(!!indice && indice.querySelectorAll('.lect-ind-btn').length === 6, 'con sus seis botones', 'botones del índice: ' + (indice ? indice.querySelectorAll('.lect-ind-btn').length : 0));
    /* La leyenda del código de colores va arriba del todo, antes de subrayar
       nada (norma 5-septies). En las misiones con lecturas nunca aparecía,
       porque el marcador la buscaba dentro de la primera zona y la primera
       zona ES una tarjeta. Ahora vive en el índice. */
    ok(!!indice && !!indice.querySelector('.fm-leyenda'), 'y con la leyenda del código de colores', 'la leyenda no está arriba');

    log('\n── ABRIR UNA LECTURA, Y SUS PROPIAS PREGUNTAS ──');
    d.querySelector('#lectIndice .lect-ind-btn[data-va="debate"]').click();
    await esperar(500);
    const careoCard = d.getElementById('lect-debate');
    ok(careoCard.classList.contains('lect-abierta'), 'tocar el índice abre esa lectura', 'no se abrió');
    ok(w.getComputedStyle(careoCard.querySelector('.lect-cuerpo')).display !== 'none', 'y su pliegue se ve', 'el pliegue sigue oculto');
    /* Acordeón: abrir una cierra la anterior, o volvemos a las veinte
       pantallas de alto que el encargo viene a quitar. */
    d.querySelector('#lectIndice .lect-ind-btn[data-va="borges"]').click();
    await esperar(400);
    ok(!careoCard.classList.contains('lect-abierta'), 'y abrir otra cierra la anterior', 'quedan dos abiertas a la vez');

    const bloques = careoCard.querySelectorAll('.lect-bloque');
    ok(bloques.length === 3, 'cada lectura trae sus tres baterías dentro', 'baterías del careo: ' + bloques.length);
    ok(!d.querySelector('#lcQ, #lfQ, #laQ'), 'y ya no hay una batería suelta al final de la sección', 'sigue la batería vieja al final');

    /* Contestar de verdad, en la lectura de Borges, y que pague XP. */
    const borgesCard = d.getElementById('lect-borges');
    const bloqueC = borgesCard.querySelector('.lect-bloque[data-b="c"]');
    ok(/Pregunta 1 de 5/.test(bloqueC.querySelector('.lect-prog').textContent), 'la comprensión de la lectura cuenta 5', 'contador: ' + bloqueC.querySelector('.lect-prog').textContent);
    ok(bloqueC.querySelectorAll('.lect-opt').length === 4, 'con sus cuatro opciones', 'opciones: ' + bloqueC.querySelectorAll('.lect-opt').length);
    const xp0 = dentro('xp');

    log('\n── LA BARRA SE ABRE JUNTO A LO SELECCIONADO (norma 5-sexies, revisada) ──');

    /* Marcar de verdad desde ahí, que es para lo que está. */

    ok(!!d.querySelector('link[href*="lecturas.css"]'), 'la misión carga la hoja del aparato de lecturas', 'falta css/lecturas.css');

    ok(!!d.querySelector('script[src*="lecturas-marcador.js"]'), 'y el aparato del marcador', 'falta js/lecturas-marcador.js');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    log('\n── LA MARCA DE LECTURA, QUE LA PONE EL LECTOR (norma 5-nonies) ──');
    ok(typeof w.FaroMarcador.lugar === 'function', 'el marcador sabe dónde se quedó uno', 'falta FaroMarcador.lugar');
    /* PRIMERO: que NO se ponga sola. La versión anterior la ponía un
       observador según qué párrafo cruzara la franja central de la
       pantalla, y el autor la mandó quitar porque una raya que se mueve
       al lado del texto desconcentra justo mientras se lee. Si alguien la
       devuelve, esto lo caza: aquí se recorre la lectura entera y no
       puede quedar marca ninguna. */
    w.localStorage.removeItem(dentro('SAVE_KEY') + '_lugar');
    const psL = [...d.querySelectorAll('#lect-borges .lect-cuerpo p.lect-p')];
    psL[Math.min(4, psL.length - 1)].scrollIntoView({ block: 'center' });

    ok(!d.querySelector('.fm-aqui'), 'y no aparece nada pintado en el texto', 'apareció una marca sin que nadie la pusiera');
    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');

    /* LA PONE EL LECTOR, desde la misma barra con la que subraya, y va
       pegada a LAS PALABRAS elegidas, no al párrafo entero. */
    const parrL = psL[0];
    const altoAntes = parrL.getBoundingClientRect().height;
    seleccionar(parrL, 10, 26);
    await esperar(420);
    const btnAqui = d.getElementById('fmBtnAqui');
    ok(!!btnAqui && btnAqui.style.display !== 'none', 'la barra de marcar trae «Aquí me quedé»', 'no está el botón de la marca de lectura');
    btnAqui.click();
    await esperar(400);
    const aqui = d.querySelectorAll('#lect-borges .fm-aqui');
    ok(aqui.length >= 1, 'y marca justo lo seleccionado', 'no se pintó la marca de lectura');
    ok(aqui.length && aqui[0].textContent.length > 0 && parrL.textContent.indexOf(aqui[0].textContent) >= 0,
       'sobre las palabras del texto, no sobre el párrafo entero', 'la marca no cayó dentro del párrafo');
    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖, aunque cruce una negrita', 'salió más de un marcador');
    const lug = w.FaroMarcador.lugar();
    ok(!!lug && lug.l === 'borges', 'el marcador la apunta', 'no apuntó nada: ' + JSON.stringify(lug));
    ok(!!w.localStorage.getItem(dentro('SAVE_KEY') + '_lugar'), 'y la guarda en este aparato', 'no quedó guardada');
    /* No puede añadir alto: en una ficha, un renglón de más parte una
       hoja y deja once (norma 5-octies). */
    ok(Math.abs(parrL.getBoundingClientRect().height - altoAntes) < 1.5,
       'y no le añade alto al párrafo', 'la marca empujó el texto: ' + altoAntes + ' → ' + parrL.getBoundingClientRect().height);
    /* Y lo que costó media hora encontrar la primera vez: el párrafo
       marcado TIENE QUE SEGUIR SIENDO MARCABLE. En las fichas y en la
       prosa de las rutas del adulto lo marcable se reconoce por NO tener
       clase, así que la marca no puede ponerle una. */
    ok(w.FaroMarcador.esMarcable(parrL), 'y el párrafo se sigue pudiendo subrayar', 'la marca deja el párrafo fuera del marcador');

    /* SE QUITA TOCÁNDOLA, que es lo que pidió el autor: al volver a

    await esperar(400);

    await esperar(900);
    ok(d.getElementById('lect-borges').classList.contains('lect-abierta'),
       '«Seguir donde iba» abre la lectura aunque estuviera plegada', 'no abrió la lectura');
    ok(!!d.querySelector('#lect-borges .fm-aqui[data-fm-late]'), 'y late en la marca misma, no en el párrafo', 'el salto no señaló la marca');
    ok(!!d.getElementById('lectBtnLugar'), 'y el botón está en el índice, a la vista', 'falta el botón de seguir donde iba');

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón
       de imprimir y se lee el documento que se habría mandado a la
       impresora. Lo que no puede faltar en ninguna hoja es la etiqueta del
       estatus: un pastiche impreso sin declarar es la fuente inflada que
       esta materia enseña a cazar. */
    const abiertos = [];
    const openReal = w.open;
    w.open = function () {
      const doc = { write(s) { abiertos.push(s); }, close() {} };
      return { document: doc, print() {}, focus() {}, close() {} };
    };
    try {
      w.imprimirLectura('borges');
      const hb = abiertos[abiertos.length - 1] || '';
      ok(/El catálogo de los cuatro supuestos/.test(hb) && /maquinaria agrícola/.test(hb),

      ok(/Vendí el depósito y me quedé con los manuales/.test(hb), 'y hasta su última página', 'la hoja del cuento sale cortada');
      ok(/NO es obra de ese autor/i.test(hb) && /Ejercicio de estilo de la casa/i.test(hb),
         'y con la etiqueta del estatus en la hoja', 'la hoja del cuento sale sin declarar el pastiche');
      ok(/real y comprobable/i.test(hb), 'y con la regla de la erudición real', 'la hoja no trae la regla de los datos reales');

      w.imprimirLectura('cervantes');
      const hc = abiertos[abiertos.length - 1] || '';
      ok(/muchacho atado a una encina/.test(hc) && /soldada/.test(hc) && /Sancho/.test(hc),
         'el capítulo cervantino se imprime completo', 'el capítulo no se imprime');
      ok(/NO es obra de ese autor/i.test(hc), 'y con su etiqueta', 'la hoja del capítulo sale sin etiqueta');
      ok(/encina/i.test(hc) && /1605/.test(hc), 'y con su ancla real declarada', 'la hoja del capítulo sale sin su ancla');
      ok(!/\u2014/.test(hc), 'y sin guiones largos (norma 1-bis)', 'la hoja del capítulo trae guiones largos');

      w.imprimirLectura('harari');
      const hh = abiertos[abiertos.length - 1] || '';
      ok(/El manual que nadie lee/.test(hh) && /condiciones de operación/.test(hh),
         'el ensayo se imprime completo', 'el ensayo no se imprime');
      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      /* Las dos entrevistas se imprimen sueltas, y su hoja lleva la etiqueta
         de la ficción con el «nunca ocurrió»: sin esa línea, la fotocopia
         circula como una entrevista de verdad. */
      w.imprimirLectura('entrevista');
      const hent = abiertos[abiertos.length - 1] || '';
      ok(/El profesor de los limones/.test(hent) && /New Haven/.test(hent),
         'la entrevista se imprime con su texto completo', 'la entrevista no se imprime');
      ok(/nunca ocurrió/i.test(hent), 'y con la etiqueta del encuentro que nunca ocurrió', 'la hoja de la entrevista sale sin declarar la ficción');
      ok(/real y comprobable/i.test(hent), 'y con la regla de la erudición real', 'la hoja de la entrevista no trae la regla de los datos reales');
      ok(/la mitad del trabajo/.test(hent), 'y hasta su última respuesta', 'la hoja de la entrevista sale cortada');
      ok(!/\u2014/.test(hent), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la entrevista trae guiones largos');

      w.imprimirLectura('gala');
      const hga = abiertos[abiertos.length - 1] || '';
      ok(/La noche de la letra pequeña/.test(hga) && /QUINTERO/.test(hga) && /GALA/.test(hga),
         'la conversación se imprime con sus dos voces', 'la conversación no se imprime');
      ok(/nunca ocurrió/i.test(hga), 'y con la etiqueta del encuentro que nunca ocurrió', 'la hoja de la conversación sale sin declarar la ficción');
      ok(/Lea usted la letra pequeña/.test(hga), 'y hasta su última línea', 'la hoja de la conversación sale cortada');
      ok(!/\u2014/.test(hga), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la conversación trae guiones largos');

      /* El careo lleva etiqueta propia y NO la del pastiche: no imita a
         ningún autor, así que decir «no es obra de ese autor» sería un aviso
         falso, y en esta etapa un aviso falso es el delito que se estudia. */
      w.imprimirLectura('debate');
      const hd = abiertos[abiertos.length - 1] || '';
      ok(/¿Destruye empleo el salario mínimo\?/.test(hd) && /LA DEFENSA\./.test(hd) && /LA OBJECIÓN\./.test(hd),
         'el careo se imprime completo, con sus papeles', 'el careo no se imprime');
      ok(/Joan Robinson/.test(hd) && /Harasztosi/.test(hd), 'y con sus anclas reales, de la primera a la última', 'la hoja del careo sale cortada');
      ok(/Careo escrito por la casa/i.test(hd), 'con su etiqueta propia, la del careo', 'el careo sale sin su etiqueta');
      ok(!/NO es obra de ese autor/i.test(hd), 'y NO con la del pastiche, porque no imita a nadie', 'el careo sale etiquetado como pastiche');
      ok(!/\u2014/.test(hd), 'y sin guiones largos', 'el careo impreso trae guiones largos');
      /* Cada lectura se imprime con SUS preguntas y su pauta en hoja aparte
         (normas 5-quater y 5-nonies): así una hoja suelta sirve sola. */
      ok(/Preguntas de esta lectura/.test(hd), 'y con sus propias preguntas detrás', 'la hoja del careo sale sin sus preguntas');
      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');
      ok((hd.match(/class="op"/g) || []).length === 20, 'sus 5 preguntas de comprensión con sus 20 opciones', 'opciones del careo: ' + (hd.match(/class="op"/g) || []).length);
      ok((hd.match(/_______________/g) || []).length === 2, 'y sus 2 de completar con su hueco', 'huecos del careo: ' + (hd.match(/_______________/g) || []).length);
      ok((hd.match(/class="ln-alta"/g) || []).length === 6, 'y sus 2 de análisis con tres renglones cada una', 'renglones del careo: ' + (hd.match(/class="ln-alta"/g) || []).length);
      ok(/Preguntas de esta lectura/.test(hb), 'y el cuento también sale con las suyas', 'la hoja del cuento sale sin preguntas');

      w.imprimirTodasLasLecturas();
      const h3 = abiertos[abiertos.length - 1] || '';
      ok(/El catálogo de los cuatro supuestos/.test(h3) && /atado a una encina/.test(h3) && /El manual que nadie lee/.test(h3),
         'las tres primeras lecturas van en el pliego junto', 'el pliego junto pierde alguna de las tres primeras');
      ok(/El profesor de los limones/.test(h3) && /La noche de la letra pequeña/.test(h3),
         'y las dos entrevistas también', 'el pliego junto no trae las dos entrevistas');
      ok(/¿Destruye empleo el salario mínimo\?/.test(h3) && /LA OBJECIÓN\./.test(h3),
         'y el careo detrás: las seis juntas', 'el pliego junto no trae el careo');
      ok(/Las seis lecturas/.test(h3), 'y el pliego se titula de las seis', 'el pliego no declara que son seis');
      ok((h3.match(/page-break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h3), 'y el pliego declara el pastiche de los cinco primeros', 'el pliego de las seis no declara el pastiche');
      ok(/nunca ocurrieron/i.test(h3), 'y la etiqueta de la ficción de las entrevistas', 'el pliego no declara que los encuentros nunca ocurrieron');
      ok(/careo/i.test(h3) && /papeles/i.test(h3), 'y que el sexto es un careo con los turnos firmados por papeles', 'el pliego no declara la etiqueta del careo');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con las 30', 'al pliego de preguntas le falta una sección');
      ok(/con los seis textos delante/i.test(hp) && /nunca ocurrieron/i.test(hp),
         'y declara los seis textos y la ficción de las entrevistas', 'el pliego de preguntas no declara los seis textos');
      ok(/careo/i.test(hp), 'y el careo con su etiqueta propia', 'el pliego de preguntas no declara el careo');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(!/\u2014/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

      /* Los rótulos de las DOS PRUEBAS IMPRESAS: es ahí donde vive el número
         de etapa, y es el sitio exacto donde el molde arrastró el nombre de
         la misión anterior en misiones pasadas. Se imprimen de verdad y se
         lee el documento. Hay que GENERARLAS primero: printEval se planta si
         no existe _evalPrintData, y entonces se leería el pliego anterior. */
      w.go('s-evaluacion'); await esperar(150);
      w.genEval(); await esperar(250);
      w.genEvalCrit(); await esperar(250);
      w.printEval();
      const he = abiertos[abiertos.length - 1] || '';
      ok(/Las fallas de la máquina/i.test(he) && /Etapa 2 · Estudio Mayor/.test(he),
         'la evaluación impresa lleva el nombre y la etapa correctos', 'la evaluación impresa trae el rótulo de otra misión');
      ok(!/Etapa [13-9] · Estudio Mayor|Etapa [13-9] de \d|La gran fuga|hombre máquina/i.test(he),
         'y no arrastra el rótulo de otra etapa ni de la misión molde', 'la evaluación impresa dice otra etapa');
      ok(!/undefined/.test(he), 'y no imprime undefined', 'la evaluación impresa trae un undefined');
      w.printEvalCrit();
      const hec = abiertos[abiertos.length - 1] || '';
      ok(/La falla sobre la mesa/.test(hec) && /Las fallas de la máquina/i.test(hec),
         'la competencial impresa lleva su nombre propio', 'la competencial impresa trae el rótulo de otra misión');
      ok(/Etapa 2 · Estudio Mayor/.test(hec), 'y su número de etapa correcto', 'la competencial impresa no dice etapa 2');
      ok(!/Etapa [13-9] · Estudio Mayor|Etapa [13-9] de \d|cifra sobre la mesa|base sobre la mesa/i.test(hec),
         'y tampoco arrastra el de otra misión', 'la competencial impresa arrastra el rótulo de otra etapa');
      ok(!/undefined/.test(hec), 'y no imprime undefined en ninguna pauta', 'la competencial impresa trae un undefined');
    } finally { w.open = openReal; }

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Externalidades/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en las externalidades', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="externalidad"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.labShowParte('dinamica'); await esperar(150);
    ok(/Minsky/.test(d.getElementById('lab-display').textContent) || /estabilidad/i.test(d.getElementById('lab-display').textContent),
       'y las demás piezas pintan su contenido', 'el laboratorio no pinta la pieza de la falla dinámica');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-tareas'); await esperar(150);
    w.genTask(); await esperar(200);
    const tareas = d.getElementById('tgOut').textContent;
    ok(tareas.length > 200, 'el generador de tareas produce su hoja', 'generador vacío');
    ok(!/Deaton|gran fuga|Kocka|McCloskey/i.test(tareas), 'el ejemplo del generador es de esta misión', 'el generador arrastra el ejemplo de la misión molde');
    w.go('s-aprende'); await esperar(150);
    w.startMethod(); await esperar(1400);
    w.resolveMethod(true); await esperar(200);
    ok(/información asimétrica/i.test(d.getElementById('methodResult').textContent) && /poder de mercado/i.test(d.getElementById('methodResult').textContent),
       'la simulación es la de esta etapa (las dos fallas del préstamo, con su regla)', 'la simulación arrastra la del molde');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la falla sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/fallas de la máquina/i.test(rotulos) && /La falla sobre la mesa/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'los rótulos no traen el nombre de esta misión');
    ok(!/Etapa [13-9] · Estudio Mayor|Etapa [13-9] de \d/.test(rotulos), 'y no dicen otra etapa', 'los rótulos de pantalla dicen otra etapa');
    ok(!/gran fuga|cifra sobre la mesa|hombre máquina|mapa de las familias|bisturí|vigía/i.test(rotulos),
       'y no traen el nombre de otra misión', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      ok(casos.querySelectorAll('.ex-box').length === 9, 'y cada caso trae su caja de diagnóstico', 'cajas de diagnóstico: ' + casos.querySelectorAll('.ex-box').length);
      const txt = casos.textContent;
      ['préstamo', 'L 600', 'empleador', 'internet', 'quebrada', 'Jael', 'Angelly', 'M.E.T.A.S']
        .forEach(k => { if (!new RegExp(k.replace(/\./g, '\\.'), 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/L \d/.test(txt), 'los casos traen números en lempiras', 'los casos no traen lempiras');
      /* Cada caso tiene que nombrar su falla, que es la destreza de la etapa. */
      ok(/externalidad/i.test(txt) && /monopsonio/i.test(txt) && /información asimétrica/i.test(txt),
         'los casos nombran las fallas con su nombre', 'los casos no nombran las fallas');
      ok(/hoja de la falla/i.test(txt), 'trae la hoja de la falla', 'falta la hoja de la falla');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/no vuelve ladrón|estructura y no en las personas|no vuelve deshonesto/i.test(txt),
         'y el aviso de que la falla es estructural y no de las personas', 'los casos no separan la estructura de las personas');
      /* El giro hacia adentro: uno de los ocho casos audita el proyecto propio. */
      ok(/M\.E\.T\.A\.S por dentro|falla que tiene M\.E\.T\.A\.S/i.test(txt),
         'al menos un caso diagnostica la falla del proyecto propio', 'ningún caso audita el proyecto propio');
      /* Y la regla de selección de esta materia. */
      ok(/como categoría/i.test(txt) && /nombre propio/i.test(txt),
         'los casos declaran la regla de selección del patio', 'los casos no declaran la regla de selección');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/préstamo|L 600|empleador|internet|quebrada|Jael|Angelly|M\.E\.T\.A\.S/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/LA LETRA PEQUEÑA DEL TEOREMA/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/EXTERNALIDADES/.test(banda) && /PIGOU 1920/.test(banda) && /COASE 1960/.test(banda), 'y trae la primera falla con sus dos autores', 'la banda no nombra a Pigou y Coase');
    ok(/Y SU AVISO DE 1988/.test(banda), 'y la rectificación de Coase, que es la pieza que casi nadie cita', 'la banda no trae el aviso de 1988');
    ok(/MONOPSONIO/.test(banda) && /MANNING 2003/.test(banda), 'y el monopsonio con su referencia', 'la banda no nombra el monopsonio');
    ok(/AKERLOF 1970/.test(banda) && /MINSKY 1986/.test(banda), 'y las otras dos fallas con su año', 'la banda no nombra a Akerlof y a Minsky');
    ok(/NINGUNA REGLA ES GRATIS/.test(banda), 'y la regla de la factura', 'la banda no nombra la factura de la regla');
    ok(!/DEATON|LA GRAN FUGA|KOCKA|HICKEL|EL ACERO PRIMERO/.test(banda), 'sin las palabras de la etapa 1 de la ruta', 'la banda sigue siendo la de la gran fuga');
    ok(!/LA METTRIE|DEM[ÓO]CRITO|LIBERALISMO|SOCIEDAD ABIERTA|EL ACERO ANTES/.test(banda),
       'sin las palabras de las misiones viejas', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-dorado-fallas-maquina.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja de la falla, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja de la falla en blanco', 'falta la hoja de la falla');
    ok(/Una hoja de la falla ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/avisos al llenarla/i.test(txtF), 'con sus avisos', 'faltan los avisos de la hoja');
    ok(/Cómo se usa, en tres reglas/i.test(txtF), 'y sus tres reglas de uso', 'faltan las reglas de uso de la hoja');
    ok(/Pigou/.test(txtF) && /1920/.test(txtF) && /Coase/.test(txtF) && /1960/.test(txtF), 'la ficha trae a Pigou y a Coase con sus años', 'faltan Pigou o Coase en la ficha');
    ok(/1988/.test(txtF) && /negociar cuesta poco/i.test(txtF), 'y la advertencia de Coase de 1988', 'falta la rectificación de Coase en la ficha');
    ok(/monopsonio/i.test(txtF) && /Manning/.test(txtF) && /2003/.test(txtF), 'la ficha trae el monopsonio con su referencia', 'falta el monopsonio en la ficha');
    ok(/Card/.test(txtF) && /Krueger/.test(txtF) && /Neumark/.test(txtF), 'y la disputa del salario mínimo con sus nombres', 'falta la disputa del salario mínimo');
    ok(/Akerlof/.test(txtF) && /1970/.test(txtF) && /2001/.test(txtF), 'la ficha trae a Akerlof con su Nobel', 'falta Akerlof en la ficha');
    ok(/Greenwald/.test(txtF) && /Stiglitz/.test(txtF) && /1986/.test(txtF), 'y el resultado general de 1986', 'falta el resultado general en la ficha');
    ok(/Minsky/.test(txtF) && /2008/.test(txtF) && /2011/.test(txtF), 'la ficha trae a Minsky y la ficha de 2008 con su informe', 'falta Minsky o el informe de 2011');
    ok(/disidencias/i.test(txtF), 'y el informe citado con sus disidencias', 'la ficha cita el informe sin sus disidencias');
    ok(/ninguna regla es gratis|Ninguna regla es gratis/i.test(txtF), 'la ficha trae la regla de la factura', 'falta la regla de la factura');
    ok(/falla de gobierno/i.test(txtF), 'y la comparación con la falla de gobierno concreta', 'falta la comparación con la falla de gobierno');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok((txtF.match(/<ol\b/g) || []).length === (txtF.match(/<\/ol>/g) || []).length, 'ninguna lista quedó partida entre dos hojas', 'hay listas abiertas sin cerrar');
    ok(/clásico sólido/i.test(txtF) && /disputa empírica viva/i.test(txtF) && /con sus disidencias/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/Deaton|McCloskey|Kocka|Hickel/i.test(txtF),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos de la etapa 1');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-dorado-fallas-maquina"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Dorado/.test(c.textContent));
    ok(!!ruta, 'la Ruta del Expediente Dorado está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 5, 'con sus cinco primeras etapas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 2, 'y 2 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/La gran fuga/i.test(ruta.textContent) && /Las fallas de la máquina/i.test(ruta.textContent),
         'las etapas 1 y 2 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La palabra gastada/.test(ruta.textContent) && /Visto desde el patio/.test(ruta.textContent), 'las dos siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    /* El expediente gemelo tiene que seguir en pie al lado, porque la Bóveda
       no acepta uno sin el otro y eso vive en el mapa, no solo en el texto. */
    const rutaRoja = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Rojo/.test(c.textContent));
    ok(!!rutaRoja, 'y la Ruta del Expediente Rojo sigue en el mapa, al lado', 'no aparece el expediente gemelo');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /fallas de la máquina/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /🔧/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda fallas de la máquina etapa 2';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda fallas de la máquina etapa 2'; }
});
</script>
</body>
</html>
