<html lang="es">

<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}

<body>
<iframe id="m" src="/misiones/ruta-apuesta-arbol-salto/arbol-salto.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta de la Apuesta Medida (Toma de decisiones):
   bancos, laboratorio, pruebas impresas con su nombre, los ocho casos, el
   guion, las seis lecturas con sus preguntas dentro, el marcador, la ficha y
   la ruta en el mapa.

   La regla que esta sonda vigila con más saña es la de la propia etapa. La
   misión enseña que el árbol se dibuja ANTES del salto y con honradez: nodos
   cuadrados donde decide la familia, redondos donde decide el azar, resuelto
   de las hojas al tronco y en una sola página; y que la herramienta fina es
   la probabilidad de cruce, de la que sale el valor de la información. Una
   misión que enseñara eso y luego citara una cifra inventada, o vendiera el
   árbol como máquina de acertar, estaría haciendo con sus fuentes lo que la
   etapa enseña a no hacer con las probabilidades de los círculos. Por eso
   aquí se exige que las obras y las personas de la historia vayan con su
   año, y que el careo cite la disputa real (Green y Mehr, Gigerenzer y
   Brighton, Kahneman y Klein) con revista y fecha, no de oídas.

   El guion largo se busca con su escape (\u2014) y no con el carácter
   puesto: una sonda que llevara el carácter dentro se suspendería sola.   */
const RAYA = /\u2014/;
const RAYAS_G = new RegExp('\\u2014', 'g');
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

/* Selecciona por posición GLOBAL del párrafo: al pintar marcas el texto queda
   repartido en varios nodos y firstChild ya no vale. */
function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda apuesta etapa 2'; };
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Apuesta Medida · Etapa 2 de 6/.test(d.body.textContent), 'se presenta como etapa 2 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 1 (San Petersburgo), y su temario
       (los Bernoulli, Montmort, Allais, la utilidad marginal) no pinta nada
       aquí. Ojo: «San Petersburgo» y «Morgenstern» NO se prohíben, porque la
       misión enlaza la etapa 1 a propósito y el ensayo cita 1944 de verdad. */
    ok(!/Bernoulli|Montmort|Allais|Ars Conjectandi|utilidad marginal|Hebb|neurona|metr[óo]nomo/i.test(d.body.textContent),
       'sin restos de la misión de la que se copió', 'queda temario de la etapa 1 (o del barro) en la página');
    ok(!RAYA.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(RAYAS_G) || []).length + ' guiones largos');
    /* La banda del encabezado vive en un ::before y ninguna sonda la miraba:
       por eso se arrastró una vez de misión en misión (norma 5-ter). */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content;
    ok(/RAIFFA/.test(banda) && !/BERNOULLI/.test(banda) && !/FALSACI/.test(banda),
       'la banda del encabezado es de esta etapa (RAIFFA, sin BERNOULLI ni FALSACIÓN)', 'la banda dice: ' + banda.slice(0, 70));
    /* El arranque completo: el panel de logros se pinta al iniciar, y la
       cuenta sale del propio catálogo de logros, no escrita a mano. */
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);

    log('\n── LA REGLA DEL ESTATUS (la regla del Estudio Mayor) ──');
    const t0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Howard Raiffa/.test(t0) && /Decision Analysis/.test(t0) && /1968/.test(t0), 'Howard Raiffa aparece con su libro y su año', 'falta Raiffa con «Decision Analysis» (1968)');
    ok(/Hammond/.test(t0) && /Keeney/.test(t0) && /Smart Choices/.test(t0) && /1999/.test(t0),
       'Hammond, Keeney y Raiffa con «Smart Choices» (1999)', 'falta «Smart Choices» con sus autores y su año');
    ok(/Ronald Howard/.test(t0) && /1966/.test(t0), 'Ronald Howard y el bautizo de la disciplina en 1966', 'falta Ronald Howard con 1966');
    ok(/Schlaifer/.test(t0) && /1961/.test(t0), 'Schlaifer y la cuenta del valor de la información (1961)', 'falta Schlaifer con 1961');
    ok(/Zermelo/.test(t0) && /1913/.test(t0), 'Zermelo y el ajedrez leído al revés (1913)', 'falta Zermelo con 1913');
    ok(/cl[áa]sico fundacional/i.test(t0), 'las fuentes llevan su etiqueta de estatus', 'ninguna fuente lleva etiqueta');
    ok(/media verdad de manual/i.test(t0), 'y la media verdad lleva la suya', '«saber más siempre ayuda» no queda etiquetado');

    log('\n── EL CONCEPTO, BIEN CONTADO ──');
    ok(/nodo/i.test(t0) && /cuadrad/i.test(t0) && /redond/i.test(t0), 'los nodos cuadrados y redondos se nombran', 'faltan los nodos del árbol');
    ok(/hacia atr[áa]s/i.test(t0) && /hojas al tronco|hojas hacia el tronco|de las hojas/i.test(t0),
       'el árbol se resuelve hacia atrás, de las hojas al tronco', 'no se enseña a resolver hacia atrás');
    ok(/una sola p[áa]gina/i.test(t0), 'la regla de la única página', 'falta la regla de la página');
    /* La herramienta fina de la etapa, y lo que deja puesto para las cuatro
       siguientes: si faltara el cruce, el valor de la información quedaría
       colgado del aire. */
    ok(/probabilidad de cruce/i.test(t0), 'la probabilidad de cruce, la herramienta fina', 'falta la probabilidad de cruce');
    ok(/valor de la informaci[óo]n/i.test(t0), 'y el valor de la información que sale de ella', 'falta el valor de la información');
    ok(/piloto/i.test(t0), 'con el piloto barato como compra de información', 'falta el piloto barato');
    ok(/lempira/i.test(t0), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');

    log('\n── LOS OCHO CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos').textContent.replace(/\s+/g, ' ');
    ok((casos.match(/Caso \d/g) || []).length === 8, 'los ocho casos están', 'casos: ' + (casos.match(/Caso \d/g) || []).length);
    ok(/M\.E\.T\.A\.S/.test(casos), 'y salen de este proyecto', 'los casos no hablan del proyecto');
    ok(/L \d/.test(casos), 'con sus cifras en lempiras', 'los casos van sin lempiras');
    /* El corazón de la etapa en los casos: el cruce dice dónde afinar, y la
       información se compra solo si mueve la decisión y llega a tiempo. */
    ok(/cruce/i.test(casos), 'el cruce trabaja dentro de los casos', 'ningún caso busca el cruce');
    ok(/informaci[óo]n|piloto/i.test(casos), 'y la compra de información también', 'ningún caso compra información');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const g = d.getElementById('s-guion').textContent.replace(/\s+/g, ' ');
    ok((g.match(/Escena \d/g) || []).length === 7, 'las siete escenas', 'escenas: ' + (g.match(/Escena \d/g) || []).length);
    ok(/VOZ/.test(g) && /IMAGEN:/.test(g) && /TEXTO EN PANTALLA:/.test(g), 'cada escena lleva VOZ, IMAGEN y TEXTO', 'faltan las tres pistas');
    ok(/gancho en fr[íi]o/i.test(g), 'el gancho en frío', 'falta el gancho');
    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');
    ok(/El [áa]rbol antes del salto/.test(g), 'y el cierre nombra la misión', 'el cierre no nombra la misión');

    log('\n── LAS SEIS LECTURAS (normas 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    const tl = lect.textContent.replace(/\s+/g, ' ');
    const claves = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
    ok(claves.every(k => !!d.getElementById('lect-' + k)), 'las seis tarjetas están, con sus ids',
       'faltan: ' + claves.filter(k => !d.getElementById('lect-' + k)).join(', '));
    ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'y no hay ninguna de más',
       'tarjetas: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
       'y avisa de las preguntas de cada lectura y del plegado', 'la entrada no explica las preguntas ni el plegado');
    ok(/ejercicios? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl),
       'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
    /* La etiqueta tiene que separar los dos estatus: los cinco primeros son
       pastiche y el sexto es un careo que no imita a nadie. */
    ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis en el mismo saco');
    ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
    ok(/papeles/i.test(tl) && /no personas/i.test(tl), 'y dice que el careo firma con papeles', 'la etiqueta no dice cómo firma sus turnos el careo');
    ok(/nunca ocurrieron/i.test(tl), 'y que los encuentros de las entrevistas nunca ocurrieron', 'falta la declaración de ficción');
    ok(/El [áa]rbol de una sola p[áa]gina/.test(tl), 'el cuento a la manera de Borges', 'falta el cuento');
    ok(/ventera/.test(tl) && /arriero/.test(tl), 'el capítulo cervantino, con su venta', 'falta el capítulo');
    ok(/La especie que dibuj[óo] el porvenir/.test(tl), 'el ensayo a la manera de Harari', 'falta el ensayo');
    ok(/Soler Serrano/.test(tl) && /A fondo/.test(tl), 'la entrevista, con las señas reales del entrevistador', 'la entrevista no declara quién es Soler Serrano');
    ok(/Quintero/.test(tl) && /Gala/.test(tl) && /Loco de la Colina/i.test(tl), 'la conversación del Loco de la Colina', 'falta la conversación');

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    const careo = d.getElementById('lect-debate');
    const tc = careo.textContent.replace(/\s+/g, ' ');
    const nota = (careo.querySelector('.lect-nota') || {}).textContent || '';
    /* Los turnos los firman los PAPELES en mayúscula: es lo que permite que el
       careo enfrente a gente viva sin ponerle una palabra en la boca a nadie. */
    ok(/MODERACI[ÓO]N\./.test(tc), 'los turnos de moderación firman en mayúscula', 'no hay turnos de MODERACIÓN');
    ok(/LA DEFENSA\./.test(tc) && /LA OBJECI[ÓO]N\./.test(tc), 'y los de la defensa y la objeción', 'faltan los papeles de defensa y objeción');
    ok(!/Ejercicio de estilo de la casa/i.test(nota), 'el careo NO lleva la etiqueta del pastiche', 'al careo le pusieron etiqueta de pastiche');
    ok(/palabras inventadas en boca de nadie|no se le pone/i.test(nota), 'y su nota declara que no se le pone palabra a nadie', 'la nota del careo no lo declara');
    ok(/mejor versi[óo]n/i.test(nota), 'y que cada postura va en su mejor versión (regla del acero)', 'la nota no declara la regla del acero');
    /* Las seis partes obligatorias, en orden. */
    ok(/pregunta en disputa/i.test(tc), '1. la pregunta en disputa', 'falta la pregunta en disputa');
    ok(/r[ée]plicas/i.test(tc), '4. las réplicas cruzadas', 'faltan las réplicas');
    ok(/terreno com[úu]n/i.test(tc), '5. el terreno común', 'falta el terreno común');
    ok(/dato que lo resolver[íi]a/i.test(tc), '6. y qué dato lo resolvería', 'el careo no dice qué dato lo resolvería');
    /* El orden se mide con las frases de los turnos y no con la palabra
       suelta: «réplicas» y «terreno común» aparecen antes en el título y en
       la nota de la tarjeta, y con la palabra suelta el orden saldría falso. */
    ok(tc.indexOf('La pregunta en disputa, una sola') < tc.indexOf('Las réplicas, cruzadas')
       && tc.indexOf('Las réplicas, cruzadas') < tc.indexOf('El terreno común, que es más ancho')
       && tc.indexOf('El terreno común, que es más ancho') < tc.indexOf('el dato que lo resolvería')
       && tc.indexOf('La pregunta en disputa, una sola') >= 0,
       'y las partes van en orden', 'las partes del careo están desordenadas');
    /* Las anclas reales de ESTE careo: la disputa existe y tiene nombres. */
    ok(/Ronald Howard/.test(tc) && /Raiffa/.test(tc), 'la defensa se apoya en Howard y Raiffa', 'la defensa no lleva sus fuentes');
    ok(/Green y Mehr/.test(tc) && /M[íi]chigan/.test(tc), 'la objeción trae el hospital de Míchigan con sus autores', 'falta Green y Mehr con Míchigan');
    ok(/Journal of Family Practice/.test(tc) && /1997/.test(tc), 'citado con su revista y su año', 'el estudio de 1997 no lleva revista');
    ok(/W[üu]bben/.test(tc) && /Wangenheim/.test(tc) && /Journal of Marketing/.test(tc), 'la heurística del hiato con su fuente de 2008', 'falta Wübben y Wangenheim');
    ok(/Gigerenzer/.test(tc) && /Brighton/.test(tc) && /Homo heuristicus/.test(tc), 'y la teoría de por qué, con «Homo heuristicus» (2009)', 'falta Gigerenzer y Brighton');
    ok(/heur[íi]stica/i.test(tc), 'la postura se nombra por su nombre', 'no se nombra el programa de las heurísticas');
    ok(/Kahneman/.test(tc) && /Klein/.test(tc) && /Failure to Disagree|failure to disagree/.test(tc),
       'el terreno común tiene su documento propio: Kahneman y Klein (2009)', 'falta el acuerdo de Kahneman y Klein');
    ok(/lo que se repite/i.test(tc) && /se firma una vez/i.test(tc), 'y el terreno común llega hasta el reparto práctico del trabajo', 'el careo no dice en qué coinciden al aconsejar');

    log('\n── LOS TRES BANCOS DE LAS LECTURAS ──');
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 de completar', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 de análisis complejo', 'análisis: ' + dentro('lectAnalisisBank.length'));
    const voces = ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'];
    voces.forEach(v => {
      const c = dentro('lectComprensionBank.filter(q=>q.t===' + JSON.stringify(v) + ').length');
      const f = dentro('lectCompletarBank.filter(q=>q.t===' + JSON.stringify(v) + ').length');
      const a = dentro('lectAnalisisBank.filter(q=>q.t===' + JSON.stringify(v) + ').length');
      ok(c === 5 && f === 2 && a === 2, '  ' + v + ': 5 de comprensión, 2 de completar y 2 de análisis',
         '  ' + v + ': ' + c + '/' + f + '/' + a);
    });
    ok(dentro('lectAnalisisBank.every(q=>q.guia&&q.guia.length>250)'), 'cada análisis trae su pauta escrita', 'algún análisis va sin pauta');
    ok(dentro('lectAnalisisBank.every(q=>!/^\\s*\\d+[.)]\\s/.test(q.q))'), 'y ningún enunciado arrastra el número del banco viejo', 'algún análisis sale numerado');

    log('\n── EL PLEGADO Y EL ÍNDICE ──');
    ok(!!d.getElementById('lectIndice'), 'hay índice de las seis arriba', 'falta el índice de lecturas');
    ok(d.querySelectorAll('#lectIndice .lect-ind-btn').length === 6, 'con un botón por lectura', 'botones: ' + d.querySelectorAll('#lectIndice .lect-ind-btn').length);
    const cuerpos = [...d.querySelectorAll('#s-lecturas .lect-cuerpo')];
    ok(cuerpos.length === 6 && cuerpos.every(c => c.hidden), 'las seis empiezan plegadas', 'alguna empieza abierta');
    /* No basta el atributo: una regla de display puede ganarle a [hidden] y
       dejar la lectura a la vista con el aria diciendo que está cerrada. */
    ok(cuerpos.every(c => w.getComputedStyle(c).display === 'none'), 'y plegadas de verdad, no solo con el atributo', 'alguna se sigue pintando');

    log('\n── ABRIR UNA LECTURA, Y SUS PROPIAS PREGUNTAS ──');
    w.FaroLecturas.abrir('borges');
    await esperar(300);
    const cardB = d.getElementById('lect-borges');
    ok(cardB.classList.contains('lect-abierta'), 'abrir una lectura la despliega', 'no se desplegó');
    ok(!cardB.querySelector('.lect-cuerpo').hidden, 'y su cuerpo se ve', 'el cuerpo sigue escondido');
    w.FaroLecturas.abrir('debate');
    await esperar(300);
    ok(!cardB.classList.contains('lect-abierta'), 'y abrir otra cierra la anterior', 'quedan dos abiertas a la vez');
    const bloques = d.getElementById('lect-debate').querySelectorAll('.lect-bloque');
    ok(bloques.length === 3, 'cada lectura trae sus tres baterías dentro', 'baterías del careo: ' + bloques.length);
    ok(!d.querySelector('#lcQ, #lfQ, #laQ'), 'y ya no hay una batería suelta al final de la sección', 'sigue la batería vieja al final');

    /* Contestar de verdad, en la lectura de Borges, y que pague XP. */
    w.FaroLecturas.abrir('borges'); await esperar(250);
    const bC = cardB.querySelector('.lect-bloque[data-b="c"]');
    ok(/Pregunta 1 de 5/.test(bC.querySelector('.lect-prog').textContent), 'la comprensión de la lectura cuenta 5', 'contador: ' + bC.querySelector('.lect-prog').textContent);
    ok(bC.querySelectorAll('.lect-opt').length === 4, 'con sus cuatro opciones', 'opciones: ' + bC.querySelectorAll('.lect-opt').length);
    const xp0 = dentro('xp');
    bC.querySelectorAll('.lect-opt')[dentro('lectComprensionBank.filter(q=>q.t==="Borges")[0].c')].click();
    bC.querySelector('.lect-verifica').click();
    await esperar(300);
    ok(dentro('xp') > xp0, 'la respuesta correcta suma XP', 'la comprensión no dio XP');
    const bF = cardB.querySelector('.lect-bloque[data-b="f"]');
    ok(bF.querySelector('.lect-enun').textContent.indexOf('___') >= 0, 'completar pinta su hueco', 'completar sin hueco');
    const xp1 = dentro('xp');
    bF.querySelector('.lect-input').value = dentro('lectCompletarBank.filter(q=>q.t==="Borges")[0].a');
    bF.querySelector('.lect-verifica').click();
    await esperar(300);
    ok(dentro('xp') > xp1, 'completar suma XP con la respuesta buena', 'completar no dio XP');
    const bA = cardB.querySelector('.lect-bloque[data-b="a"]');
    ok(/sin XP/.test(bA.querySelector('.lect-prog').textContent), 'el análisis avisa de que no da XP', 'el análisis no avisa');
    ok(bA.querySelector('.lect-pauta').hidden, 'y su pauta empieza tapada', 'la pauta se ve sin pedirla');
    const xp2 = dentro('xp');
    bA.querySelector('.lect-vp').click(); await esperar(200);
    ok(!bA.querySelector('.lect-pauta').hidden, 'se destapa cuando se pide', 'la pauta no se destapa');
    ok(dentro('xp') === xp2, 'y el análisis complejo no regala XP', 'el análisis regaló XP');

    log('\n── LA BARRA SE ABRE JUNTO A LO SELECCIONADO (norma 5-sexies) ──');
    const parr = d.querySelector('#lect-borges .lect-cuerpo p.lect-p');
    parr.scrollIntoView({ block: 'center' });
    await esperar(200);
    seleccionar(d, w, parr, 5, 70);
    await esperar(420);
    const barra = d.getElementById('fmBarra');
    ok(!!barra && barra.classList.contains('fm-abierta'), 'seleccionar abre la barra de marcar', 'la barra no se abrió');
    ok(w.getComputedStyle(barra).position === 'absolute' || barra.classList.contains('fm-barra-abajo'),
       'y se coloca pegada al trozo, no siempre al pie', 'la barra sigue anclada abajo a la fuerza');
    const caja = barra.getBoundingClientRect();
    ok(caja.left >= -1 && caja.right <= 381, 'sin salirse en 380 px', 'la barra se sale: ' + Math.round(caja.left) + ' a ' + Math.round(caja.right));

    log('\n── LA MARCA DE LECTURA, QUE LA PONE EL LECTOR (norma 5-nonies) ──');
    ok(typeof w.FaroMarcador.lugar === 'function', 'el marcador sabe dónde se quedó uno', 'falta FaroMarcador.lugar');
    /* PRIMERO: que NO se ponga sola. La versión anterior la ponía un observador
       y el autor la mandó quitar porque distrae mientras se lee. */
    w.localStorage.removeItem(dentro('SAVE_KEY') + '_lugar');
    const ps = [...d.querySelectorAll('#lect-borges .lect-cuerpo p.lect-p')];
    ps[Math.min(4, ps.length - 1)].scrollIntoView({ block: 'center' });
    await esperar(1500);
    ok(!w.FaroMarcador.lugar(), 'leer no pone ninguna marca por su cuenta', 'la marca volvió a ponerse sola');
    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');
    const altoAntes = ps[0].getBoundingClientRect().height;
    seleccionar(d, w, ps[0], 10, 26);
    await esperar(420);
    const btnAqui = d.getElementById('fmBtnAqui');
    ok(!!btnAqui && btnAqui.style.display !== 'none', 'la barra de marcar trae «Aquí me quedé»', 'no está el botón de la marca de lectura');
    btnAqui.click(); await esperar(400);
    const aqui = d.querySelectorAll('#lect-borges .fm-aqui');
    ok(aqui.length >= 1, 'y marca justo lo seleccionado', 'no se pintó la marca de lectura');
    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖', 'salió más de un marcador');
    ok(!!w.FaroMarcador.lugar(), 'el marcador la apunta', 'no quedó apuntada');
    ok(Math.abs(ps[0].getBoundingClientRect().height - altoAntes) < 1.5, 'y no le añade alto al párrafo', 'la marca empujó el texto');
    aqui[0].click(); await esperar(400);
    ok(!d.querySelector('#lect-borges .fm-aqui'), 'tocarla la quita, sin preguntar nada', 'la marca sigue puesta después de tocarla');

    log('\n── EL RESTO DE LOS BANCOS ──');
    ok(dentro('qzData.length') === 10, 'el quiz trae 10 preguntas', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('fcData.length') === 16, '16 flashcards de vocabulario', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('evalMCBank.length') === 15 && dentro('evalTFBank.length') === 15
       && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15,
       'la evaluación final trae sus cuatro bancos de 15', 'algún banco de la evaluación no llega a 15');
    ok(dentro('critCaseBank.length') === 8, 'la evaluación competencial trae ocho casos', 'casos competenciales: ' + dentro('critCaseBank.length'));
    ok(dentro('timelineData.length') === 7, 'los siete pasos del árbol', 'pasos: ' + dentro('timelineData.length'));
    ok(dentro('Object.keys(parteData).length') === 4, 'el laboratorio tiene sus cuatro piezas', 'piezas del laboratorio: ' + dentro('Object.keys(parteData).length'));
    /* La pieza inicial del laboratorio se arrastra al copiar el molde y deja la
       pantalla rota en silencio (norma 1). */
    ok(dentro('typeof parteData[labParte] !== "undefined"'), 'y la pieza inicial existe de verdad', 'el laboratorio arranca apuntando a una pieza que no existe');
    ok(dentro('sopaSets[0].words.length') === 10, 'la sopa trae diez palabras', 'palabras de la sopa: ' + dentro('sopaSets[0].words.length'));
    ok(dentro('sopaSets[0].words.every(p=>p.cells.map(c=>sopaSets[0].grid[c[0]][c[1]]).join("")===p.w)'),
       'y todas se leen de verdad en la rejilla', 'alguna palabra no está en la rejilla');
    ok(dentro('routeSets.length') === 3, 'el widget de ordenar trae tres secuencias', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('routeSets.every(s=>s.steps.length===7)'), 'de siete pasos cada una', 'alguna secuencia no tiene siete pasos');

    log('\n── EL WIDGET DE ORDENAR (norma 5-bis) ──');
    w.go('s-widgets'); await esperar(300);
    const tarjetas = d.querySelectorAll('#routeList .sort-item');
    ok(tarjetas.length > 0, 'la lista de pasos se pinta', 'no se pintó la lista de ordenar');
    ok(!!d.querySelector('#routeList .sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'no hay asa de arrastre');
    ok(/touch-action/.test(d.querySelector('#routeList').innerHTML + [...d.styleSheets].map(h => { try { return [...h.cssRules].map(r => r.cssText).join(' '); } catch (e) { return ''; } }).join(' ')),
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'falta touch-action en las tarjetas');
    ok(/linterna/i.test(d.getElementById('s-widgets').textContent), 'y la linterna está, con su aviso de que cuesta XP', 'falta la linterna');

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón de
       imprimir y se lee el documento que se habría mandado a la impresora.
       Antes de esto la sonda ha subrayado, y lo subrayado SALE IMPRESO, así que
       las comprobaciones de PROSA miran la hoja sin etiquetas. */
    const prosa = h => h.replace(/<[^>]+>/g, '');
    const abiertos = [];
    w.open = function () { return { document: { write(s) { abiertos.push(s); }, close() {} }, print() {}, focus() {}, close() {} }; };
    w.imprimirLectura('borges');
    const hb = abiertos[abiertos.length - 1] || '';
    ok(/El [áa]rbol de una sola p[áa]gina/.test(hb) && /hoja de papel cuadriculado/.test(prosa(hb)), 'el cuento se imprime con su texto completo', 'el cuento no se imprime');
    ok(/discutir con los c[íi]rculos/.test(prosa(hb)), 'y hasta su última línea', 'la hoja del cuento sale cortada');
    ok(/NO es obra de ese autor/i.test(hb) && /ejercicio de estilo de la casa/i.test(hb), 'con la etiqueta del estatus en la hoja', 'la hoja sale sin declarar el pastiche');
    ok(/Pregunta/i.test(hb) || /preguntas/i.test(hb), 'y con sus propias preguntas detrás', 'la hoja sale sin sus preguntas');

    w.imprimirLectura('entrevista');
    const he = abiertos[abiertos.length - 1] || '';
    ok(/Soler Serrano/.test(he) && /Raiffa/.test(he), 'la entrevista se imprime entera', 'la entrevista no se imprime');
    ok(/nunca ocurri/i.test(he), 'y su hoja declara que el encuentro nunca ocurrió', 'la entrevista impresa no declara la ficción');

    w.imprimirLectura('debate');
    const hd = abiertos[abiertos.length - 1] || '';
    ok(/MODERACI[ÓO]N/.test(hd) && /LA OBJECI[ÓO]N/.test(hd), 'el careo se imprime completo', 'el careo no se imprime');
    ok(/Careo escrito por la casa/i.test(hd), 'con su etiqueta propia, la del careo', 'el careo sale sin su etiqueta');
    ok(!/NO es obra de ese autor/i.test(hd), 'y NO con la del pastiche, porque no imita a nadie', 'al careo impreso le pusieron la etiqueta del pastiche');
    ok(!RAYA.test(hd), 'y sin guiones largos', 'el careo impreso trae guiones largos');

    w.imprimirTodasLasLecturas();
    const ht = abiertos[abiertos.length - 1] || '';
    ok(/El [áa]rbol de una sola p[áa]gina/.test(ht) && /ventera/.test(ht) && /La especie que dibuj[óo] el porvenir/.test(ht)
       && /Soler Serrano/.test(ht) && /Quintero/.test(ht) && /MODERACI[ÓO]N/.test(ht),
       'las seis lecturas se imprimen juntas en un solo pliego', 'el pliego de las seis no las trae todas');
    ok((ht.match(/page-break-before|break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');

    w.imprimirPreguntasLecturas();
    const hp = abiertos[abiertos.length - 1] || '';
    ok(/54 preguntas/.test(tl), 'la misión anuncia el pliego de 54', 'la misión no anuncia las 54 preguntas');
    ok(/30 de comprensi[óo]n/.test(hp), 'el pliego declara 30 de comprensión', 'el pliego no dice 30');
    ok((hp.match(/class="op"/g) || []).length === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones: ' + (hp.match(/class="op"/g) || []).length);
    ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos: ' + (hp.match(/_______________/g) || []).length);
    /* Los renglones de escribir: tres por cada análisis, 36 en total. Sin
       ellos el pliego pregunta y no deja dónde contestar. */
    ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'y las 12 de análisis con sus 36 renglones', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
    ok(/PAUTA|Pauta completa/i.test(hp), 'con su pauta al final', 'el pliego sale sin pauta');
    ok(/class="pauta"/.test(hp) && /\.pauta\{page-break-before:always/.test(hp),
       'y la pauta arranca en hoja aparte, para no regalar respuestas', 'la pauta sale pegada a las preguntas');
    ok(!RAYA.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

    log('\n── EL MARCADOR (normas 5-sexies y 5-septies) ──');
    ok(!!d.querySelector('link[href*="lecturas.css"]'), 'la misión carga la hoja del aparato de lecturas', 'falta css/lecturas.css');
    ok(!!d.querySelector('script[src*="lecturas.js"]'), 'y el aparato de lecturas', 'falta js/lecturas.js');
    ok(!!d.querySelector('link[href*="lecturas-marcador.css"]'), 'la misión carga la hoja del marcador', 'falta css/lecturas-marcador.css');
    ok(!!d.querySelector('script[src*="lecturas-marcador.js"]'), 'y el aparato del marcador', 'falta js/lecturas-marcador.js');
    ok(!!w.FaroMarcador, 'el marcador arrancó en la misión', 'FaroMarcador no existe');
    ok(!!d.getElementById('fmPanel'), 'y pintó su panel de marcas', 'el marcador no pintó su panel');
    ok(!!d.querySelector('#lectIndice .fm-leyenda'), 'con la leyenda del código de colores en el índice', 'no hay leyenda de colores');

    /* Que TODO lo que la página pide exista de verdad. Esto se pone porque
       faltó una vez: al levantar una misión desde el molde se copió el js
       propio y no la librería html2canvas, que cada misión lleva en su
       carpeta, y el diploma se habría quedado sin imagen sin que nadie se
       enterara. Ninguna sonda miraba los enlaces internos. */
    const pedidos = [...d.querySelectorAll('script[src], link[href]')]
      .map(el => el.getAttribute('src') || el.getAttribute('href'))
      .filter(u => u && !/^(https?:|data:|mailto:)/.test(u));
    const faltan = [];
    for (const u of pedidos) {
      try {
        const r = await fetch(new URL(u, d.baseURI).href, { method: 'GET' });
        if (!r.ok) faltan.push(u + ' (' + r.status + ')');
      } catch (e) { faltan.push(u + ' (no se pudo pedir)'); }
    }
    ok(faltan.length === 0, 'los ' + pedidos.length + ' archivos que pide la página existen', 'faltan: ' + faltan.join(', '));

    log('\n── LA FICHA (norma 6) ──');
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:900px;height:600px;border:0;position:absolute;left:-9999px;';
    fr.src = '/fichas/ficha-apuesta-arbol-salto.html';
    document.body.appendChild(fr);
    await new Promise(r => { fr.onload = r; });
    await esperar(700);
    const fd = fr.contentDocument;
    const txtF = fd.body.textContent.replace(/\s+/g, ' ');
    ok(fd.querySelectorAll('.pagina').length === 10, 'la ficha tiene sus diez páginas', 'páginas: ' + fd.querySelectorAll('.pagina').length);
    ok(/El [áa]rbol antes del salto/.test(txtF) && /Apuesta Medida/.test(txtF), 'y es la de esta etapa', 'la ficha no es de esta misión');
    ok(!/Bernoulli|Montmort|Allais|San Petersburgo|Hebb|neurona/i.test(txtF), 'sin restos de la ficha de la que se copió', 'la ficha arrastra el temario del molde');
    ok(!RAYA.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok(/Pauta de los ejercicios/i.test(txtF), 'con la pauta de los ejercicios', 'la ficha no trae pauta');
    ok(/hoja del [áa]rbol/i.test(txtF), 'la hoja del árbol para dibujar y fechar', 'falta la hoja del árbol');
    ok(/probabilidad de cruce/i.test(txtF), 'y el cruce trabaja también en el papel', 'la ficha no enseña el cruce');
    ok(/cl[áa]sico fundacional/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'las fuentes de la ficha van sin etiqueta');
    ok(/lecturas-marcador\.js/.test(fd.documentElement.innerHTML), 'la ficha trae el marcador (norma 5-octies)', 'la ficha no trae el marcador');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-apuesta-arbol-salto"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');
    fr.remove();

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => (c.querySelector('.ruta-nombre') || {}).textContent === 'Ruta de la Apuesta Medida');
    ok(!!ruta, 'la Ruta de la Apuesta Medida está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(/Toma de decisiones/.test(ruta.textContent), 'con su materia a la vista', 'la tarjeta no dice la materia');
      /* Cuentas del CATÁLOGO, no a mano (la lección de la Casa Cerrada). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "apuesta").length');
      const totalCat = wa.eval('RUTAS.apuesta.etapas');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok([...ruta.querySelectorAll('.re-link')].some(a => /El [áa]rbol antes del salto/.test(a.textContent)),
         'la etapa 2 ya es tocable, con el título de la misión', 'la etapa 2 no sale tocable con su título');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(cards.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + cards.length + ' de ' + delMayor);
      const mia = cards.find(c => /El [áa]rbol antes del salto/.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /🌳/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      /* El sello familiar: esta etapa no se publica fuera de la casa, y el
         candado del sello es lo único que lo dice en la portada. Se mira en
         el catálogo Y pintado, porque una cosa sin la otra no protege nada. */
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="apuesta"&&m.etapa===2).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 2 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
