<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · La puerta de verdad</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:640px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la autenticación real de F.A.R.O SIN necesitar credenciales:
   que el contrato síncrono siga en pie, que la puerta esté cerrada por
   defecto, que no queden PIN en el código y que el mensaje de error no
   diga de más. Lo que NO puede comprobar es entrar de verdad: eso pide
   los cuatro usuarios creados en Supabase y se prueba a mano. */
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

window.addEventListener('load', async () => {
  await esperar(2000);
  const w = f.contentWindow, d = f.contentDocument;
  try {
    log('── EL CÓDIGO ──');
    const src = await (await fetch('/js/auth.js')).text();
    ok(!/pin:\s*'\d/.test(src), 'no quedan PIN escritos en el código', 'todavía hay PIN en js/auth.js');
    ok(!/FARO_USERS/.test(src), 'la tabla de usuarios con PIN ya no existe', 'FARO_USERS sigue ahí');
    ok(/signInWithPassword/.test(src), 'entra con Supabase Auth', 'no usa Supabase Auth');
    ok(/persistSession:\s*true/.test(src) && /autoRefreshToken:\s*true/.test(src),
       'la sesión se guarda y se renueva sola', 'la sesión no persiste: pediría la clave a diario');
    /* El guion largo se escribe por su punto de código, no literal: si no, este
       archivo incumpliría la misma norma que comprueba, y el grep de la casa lo
       cazaría a él. */
    ok(!/\u2014/.test(src), 'sin guiones largos (norma 1-bis)', 'quedan guiones largos');

    log('\n── EL CONTRATO SÍNCRONO ──');
    /* Ocho archivos llaman a verificarSesion() sin await. Si algún día
       devuelve una promesa, todos leerían un objeto siempre verdadero y
       la aplicación se creería con sesión sin tenerla. */
    ok(typeof w.verificarSesion === 'function', 'verificarSesion existe', 'falta verificarSesion');
    const r = w.verificarSesion();
    ok(!(r && typeof r.then === 'function'), 'verificarSesion NO devuelve una promesa', 'devuelve una promesa: los ocho llamadores se romperían');
    ok(r === null || (r && typeof r.user === 'string'), 'devuelve null o { user, nombre }', 'devuelve algo con otra forma');

    log('\n── LA PUERTA, CERRADA POR DEFECTO ──');
    ok(w.verificarSesion() === null, 'sin credenciales no hay sesión', 'hay sesión sin haber entrado');
    const app = d.getElementById('app-container');
    ok(app && getComputedStyle(app).display === 'none', 'la aplicación está oculta', 'la aplicación se ve sin haber entrado');
    const login = d.getElementById('login-screen');
    ok(login && getComputedStyle(login).display !== 'none', 'se muestra la pantalla de entrada', 'no se muestra la entrada');

    log('\n── EL LOGIN VIEJO YA NO ABRE ──');
    /* La prueba que importa: sembrar la sesión falsa que usaban las sondas
       antiguas y comprobar que YA NO sirve para entrar. */
    w.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    ok(w.verificarSesion() === null, 'la sesión inventada en el teléfono no vale', 'todavía se entra escribiendo en localStorage');
    w.localStorage.removeItem('faro_session');

    log('\n── LA PANTALLA ──');
    const pass = d.getElementById('login-pass');
    ok(!!pass, 'pide contraseña, no un PIN de cuatro dígitos', 'sigue el campo de PIN');
    ok(pass && pass.type === 'password', 'el campo va oculto', 'la contraseña se ve al escribirla');
    ok(pass && !pass.maxLength || pass.maxLength < 0 || pass.maxLength > 20, 'no limita la contraseña a cuatro caracteres', 'sigue limitada a ' + (pass && pass.maxLength));
    const correo = d.getElementById('login-correo');
    ok(!!correo && correo.type === 'email', 'se entra con el correo', 'falta el campo de correo');
    ok(!d.getElementById('login-user'), 'ya no hay lista de nombres que obligue a llevar los correos en el código', 'sigue el desplegable de miembros');

    log('\n── UN SOLO CLIENTE (el fallo que la sonda no vio la primera vez) ──');
    /* La primera versión de esta sonda daba «todo en orden» justo en el estado
       en que la aplicación estaba muerta: auth.js tenía su cliente y chat.js
       otro, así que la sesión iba por un lado y TODOS los datos por otro. Con
       la seguridad por fila encendida eso deja la casa muda sin cerrarle la
       puerta a nadie. Se comprueba desde entonces. */
    /* Dos formas de comprobarlo, y hacen falta las dos. El cableado se lee en
       la fuente y se puede comprobar siempre. Los objetos vivos solo existen si
       la librería del CDN cargó, cosa que no pasa sin red: en ese caso se dice
       que se saltó, en vez de dar un verde o un rojo que no significan nada. */
    const fuente = await (await fetch('/js/chat.js')).text();
    ok(!/createClient\s*\(/.test(fuente), 'chat.js ya no crea cliente propio', 'chat.js sigue creando su propio cliente');
    ok(/const _sb = window\.faroSb/.test(fuente), 'chat.js toma el cliente de auth.js', 'chat.js no toma el cliente compartido');
    /* Sin comentarios: si no, la regla caza el texto que EXPLICA el fallo. */
    const codigo = src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');
    ok(!/storageKey\s*:/.test(codigo), 'el cliente de la casa no usa un almacén aparte', 'storageKey propio: dos clientes se pelearían por renovar el token');
    ok(/window\.faroSb\s*=/.test(codigo), 'auth.js publica el cliente para los demás', 'auth.js no publica su cliente');

    const hayLib = !!(w.supabase && w.supabase.createClient);
    if (!hayLib) {
      log('  · objetos vivos: SALTADO, la librería del CDN no cargó en este entorno');
      log('    (y eso mismo es el riesgo: sin ese archivo NADIE entra. Ver PLAN-FARO-PRIVADO.md)');
    } else {
      ok(!!w.faroSb, 'window.faroSb tiene cliente', 'no hay cliente compartido');
      ok(w.eval('typeof _sb !== "undefined" && _sb === window.faroSb'),
         'chat.js y los siete módulos usan ESE mismo cliente',
         'chat.js usa un cliente distinto: la sesión no viajaría con los datos');
    }

    log('\n── LA ANTENA, CON IDENTIDAD APARTE ──');
    /* La Antena entra con enlace mágico y sus tablas tienen políticas atadas a
       ESE usuario. Compartir cliente haría que su botón de Salir cerrara la
       sesión de toda la casa. */
    const ant = await (await fetch('/js/tools/antena.js')).text();
    ok(/storageKey:\s*'faro_antena'/.test(ant), 'la Antena tiene su propio almacén de sesión', 'la Antena comparte sesión con la familia');
    ok(!/(?<![A-Za-z0-9_])_sb(?![A-Za-z0-9_])/.test(ant), 'la Antena no toca el cliente de la casa', 'la Antena sigue usando el cliente de la familia: su Salir cerraría la sesión de todos');

    log('\n── NINGÚN CORREO DE LA FAMILIA EN EL CÓDIGO ──');
    /* El repositorio es publico hoy. Los correos reales de los cuatro no pueden
       vivir en el, ni siquiera «temporalmente»: lo temporal queda indexado. */
    const CORREO = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
    /* Un placeholder de formulario es texto de ejemplo que se ve en la casilla
       vacía, no un correo de nadie: se quita antes de mirar. Si no, la sonda
       cantaría fuga por el «tu@correo.com» de la Antena y acabaríamos
       ignorándola, que es como mueren las comprobaciones. */
    for (const f of ['/js/auth.js', '/index.html']) {
      const c = (await (await fetch(f)).text()).replace(/placeholder\s*=\s*"[^"]*"/g, '');
      const hallados = (c.match(CORREO) || []).filter(x => !/ejemplo\.com|@ejemplo|example\.|@correo\.com/i.test(x));
      ok(hallados.length === 0, 'sin correos en ' + f, f + ' trae correos: ' + hallados.slice(0, 3).join(', '));
    }

    log('\n── LO QUE EL SQL TIENE QUE EXIGIR ──');
    /* Dos archivos y en este orden a proposito: el 1 crea la puerta y no cambia
       nada de lo que ya funciona; el 2 cierra los datos y si se corre antes de
       tiempo deja a la familia sin leer ni escribir. La sonda los mira juntos. */
    const sql1 = await (await fetch('/supabase/sql/seguridad_familia_1_puerta.sql')).text();
    const sql2 = await (await fetch('/supabase/sql/seguridad_familia_2_datos.sql')).text();
    const sql = sql1 + '\n' + sql2;
    ok(/PASO 1 de 2/.test(sql1) && /PASO 2 de 2/.test(sql2), 'el SQL va en dos pasos numerados', 'los dos pasos no se distinguen');
    ok(!/create table if not exists public\.familia_miembros/.test(sql2), 'el paso 2 no rehace la puerta', 'el paso 2 duplica la tabla');
    ok(/NO SE EJECUTA hasta que/.test(sql2), 'el paso 2 avisa de sus condiciones', 'el paso 2 no avisa de cuando se puede correr');
    /* Igual que arriba: fuera los comentarios, que aquí explican justamente el
       «using (true)» que no debe quedar en el código. */
    const sqlCodigo = sql.split('\n').filter(l => !/^\s*--/.test(l)).join('\n');
    ok(/create or replace function public\.es_familia/.test(sqlCodigo), 'define quién es de la casa', 'no hay función de pertenencia');
    ok(/create table if not exists public\.familia_miembros/.test(sqlCodigo), 'la pertenencia vive en una tabla', 'la pertenencia no está en una tabla');
    ok(/familia_miembros where user_id = auth\.uid\(\)/.test(sqlCodigo), 'es_familia pregunta a esa tabla', 'es_familia no consulta la tabla');
    ok(!/user_metadata/.test(sqlCodigo), 'no decide permisos con metadatos que el usuario puede cambiar', 'usa user_metadata para autorizar: el usuario puede reescribirlo');
    const authSrc = await (await fetch('/js/auth.js')).text();
    ok(/familia_miembros/.test(authSrc) && !/user_metadata/.test(authSrc.replace(/\/\*[\s\S]*?\*\//g, '')),
       'la aplicación también saca la identidad de la tabla', 'la aplicación sigue confiando en los metadatos');
    ok(!/using \(true\)/.test(sqlCodigo), 'ninguna política dice «using (true)»', 'sigue habiendo using (true): cualquiera que se registre entraría');
    ok(/es_familia\(\)/.test(sqlCodigo) && (sqlCodigo.match(/es_familia\(\)/g) || []).length >= 6,
       'todas las políticas preguntan por la familia (' + (sqlCodigo.match(/es_familia\(\)/g) || []).length + ' veces)',
       'alguna política no comprueba la pertenencia');
    ['destellos','inventario','redaccion_ediciones','redaccion_notas','redaccion_config','mensajes','cuentas','transacciones','deudas']
      .forEach(t => { if (!new RegExp("'" + t + "'").test(sql)) { fallos++; log('  ✘ el SQL no cubre la tabla ' + t); } });
    ok(/'mensajes'/.test(sql) && /'cuentas'/.test(sql), 'cubre el chat y las finanzas', 'deja fuera el chat o las finanzas');
    ok(/Allow new users to sign up/.test(sql), 'avisa de apagar el alta pública', 'no avisa del alta pública: el agujero seguiría abierto');
    ok(/SERVICE_ROLE/.test(sql), 'avisa de la clave de la función de notificaciones', 'no avisa de que las notificaciones se romperían');

    log('\n── LO QUE EL SQL EXIGE, ¿LO CUMPLE EL CÓDIGO? ──');
    const pushSrc = await (await fetch('/js/push.js')).text();
    ok(/user_id:\s*userId/.test(pushSrc), 'push.js escribe el user_id que la política exige', 'push.js no escribe user_id: ninguna suscripción se guardaría');
    const fn = await (await fetch('/supabase/functions/send-chat-push/index.ts')).text();
    ok(/SUPABASE_SERVICE_ROLE_KEY/.test(fn), 'la función de notificaciones usa la clave de servicio', 'la función usa la clave anon: no vería ninguna suscripción');

    log('\n── EL MENSAJE DE ERROR NO DICE DE MÁS ──');
    /* Etapa 1 de la Ruta de la Casa Cerrada, aplicada a la propia casa:
       el error no debe confirmar qué cuentas existen. */
    const err = d.getElementById('login-error');
    const txt = (err ? err.textContent : '') + src;
    ok(!/ese (correo|usuario) no existe|usuario no encontrado|no existe la cuenta/i.test(txt),
       'no revela si la cuenta existe', 'el mensaje confirma qué cuentas existen');
    ok(!/PIN incorrecto/i.test(err ? err.textContent : ''), 'ya no habla de PIN', 'el mensaje sigue hablando del PIN');

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    /* El veredicto va en el título: al correr las sondas en tanda solo se lee
       la pestaña, y una que no lo declara sale como no aprobada sin fallar. */
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · auth privado';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · auth privado'; }
});
</script>
</body>
</html>
