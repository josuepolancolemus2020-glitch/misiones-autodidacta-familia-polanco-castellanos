<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · quien llega antes, la sesion o el push</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">midiendo…</pre>
<script src="/_dev/vendor/supabase.js"></script>
<script>
const out = document.getElementById('out'); const L=[];
function log(s){ L.push(s); out.textContent = L.join('\n'); }

(async () => {
  log('supabase-js real cargado: ' + !!(window.supabase && window.supabase.createClient));

  /* Sembrar una sesion valida (no caducada) en la MISMA llave que usa auth.js. */
  const dentro = { sub:'00000000-0000-0000-0000-000000000001', email:'jael@faro.local',
                   exp: Math.floor(Date.now()/1000) + 3600, iat: Math.floor(Date.now()/1000),
                   role:'authenticated', aud:'authenticated' };
  const b64 = o => btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const jwt = b64({alg:'HS256',typ:'JWT'}) + '.' + b64(dentro) + '.firma';
  localStorage.setItem('faro_auth', JSON.stringify({
    access_token: jwt, refresh_token: 'r1', token_type: 'bearer',
    expires_in: 3600, expires_at: dentro.exp,
    user: { id: dentro.sub, email: dentro.email, aud:'authenticated', role:'authenticated',
            app_metadata:{}, user_metadata:{ miembro:'jael' }, created_at: new Date().toISOString() }
  }));

  const t0 = performance.now();

  /* 1 · La rama de auth.js: crear el cliente igual que auth.js y pedir getSession(). */
  const sb = window.supabase.createClient(
    'https://bzrnjvalpwlcnpszvwim.supabase.co',
    'sb_publishable_74mJW5LoxPZOWtIi7YrBEw_0y9JjSfM',
    { auth: { persistSession:true, autoRefreshToken:true, storageKey:'faro_auth' } });

  let tSesion = null, quienSesion = null;
  const pSesion = sb.auth.getSession().then(({data}) => {
    tSesion = performance.now() - t0;
    quienSesion = data && data.session ? (data.session.user.user_metadata||{}).miembro : null;
  }).catch(e => { tSesion = performance.now() - t0; quienSesion = 'ERROR ' + e.message; });

  /* 2 · La rama de push.js: los mismos tres await, en el mismo orden. */
  let tPush = null, detalle = '';
  const pPush = (async () => {
    await Notification.requestPermission().catch(()=>{});
    const tA = performance.now() - t0;
    await navigator.serviceWorker.register('/sw.js').catch(()=>{});
    const reg = await navigator.serviceWorker.ready;
    const tB = performance.now() - t0;
    await reg.pushManager.getSubscription().catch(()=>null);
    tPush = performance.now() - t0;
    detalle = 'permiso@' + tA.toFixed(1) + 'ms  sw.ready@' + tB.toFixed(1) + 'ms';
  })().catch(e => { tPush = performance.now() - t0; detalle = 'ERROR ' + e.message; });

  const limite = ms => new Promise(r => setTimeout(() => r('TIEMPO AGOTADO'), ms));
  await Promise.race([Promise.all([pSesion, pPush]), limite(6000)]);
  log('sesion resuelta: ' + (tSesion!==null) + '   push resuelto: ' + (tPush!==null));

  log('');
  log('RAMA auth.js  getSession() resuelve a  : ' + (tSesion===null?'n/d':tSesion.toFixed(1)) + ' ms   -> miembro=' + quienSesion);
  log('RAMA push.js  llega a _pushCurrentMember(): ' + (tPush===null?'n/d':tPush.toFixed(1)) + ' ms   (' + detalle + ')');
  log('');
  log(tPush < tSesion
      ? '>>> push llega ANTES que la sesion: _pushCurrentMember() ve verificarSesion()=null'
      : '>>> la sesion llega ANTES que push: _pushCurrentMember() ve la sesion buena');
  log('margen = ' + Math.abs(tPush - tSesion).toFixed(1) + ' ms');

  /* El veredicto va al título: es lo que se lee al correr las sondas en tanda.
     Quién llega antes es la MEDIDA, no un fallo: suspende solo lo que impide
     medir (librería sin cargar, ramas sin resolver o sesión sembrada perdida). */
  let fallos = 0;
  if (!(window.supabase && window.supabase.createClient)) fallos++;
  if (tSesion === null || tPush === null) fallos++;
  if (quienSesion !== 'jael') fallos++;
  document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · tiempos push y sesion';
  log('');
  log(fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden');
})();
</script>
</body></html>
