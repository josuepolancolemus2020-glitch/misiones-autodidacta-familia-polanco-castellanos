<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · canal realtime tras cerrar sesion</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:320px;height:120px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out">midiendo…</pre>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const REF = 'bzrnjvalpwlcnpszvwim';

/* Doble de supabase-js. Lo que importa medir aqui:
   · quien crea canales y con que nombre;
   · si alguien llama removeChannel()/unsubscribe() alguna vez;
   · poder DISPARAR a mano un INSERT de realtime en el momento que yo quiera,
     igual que haria el servidor cuando otro de la casa escribe. */
const DOBLE = `
window.__reg = { clientes:[], canales:[], quitados:[], desuscritos:[], signOuts:[], beeps:0 };
(function(){
  const REF='` + REF + `';
  let n = 0;
  function cliente(url, key, opts){
    const id = 'cli' + (++n);
    const sk = (opts && opts.auth && opts.auth.storageKey) || ('sb-'+REF+'-auth-token');
    let sesion = null;
    try { sesion = JSON.parse(localStorage.getItem(sk) || 'null'); } catch(_) {}
    const guardar = () => { try { sesion ? localStorage.setItem(sk, JSON.stringify(sesion))
                                         : localStorage.removeItem(sk); } catch(_){} };
    const cli = { __id:id, __storageKey:sk };
    window.__reg.clientes.push({ id:id, storageKey:sk });
    const qb = () => { const p = { then:(res)=>Promise.resolve({data:[],error:null}).then(res) };
      ['select','insert','update','delete','upsert','order','limit','eq','neq','gte','lt','single','not','in','is','filter','range','maybeSingle','match','or','lte','gt'].forEach(m=>{p[m]=()=>p;});
      return p; };
    cli.from = () => qb();
    cli.channel = (nombre) => {
      const reg = { cliente:id, nombre:nombre, handlers:{}, suscrito:false, vivo:true };
      window.__reg.canales.push(reg);
      const ch = {
        __reg: reg,
        on: (tipo, filtro, cb) => { reg.handlers[(filtro && filtro.event) || tipo] = cb; return ch; },
        subscribe: () => { reg.suscrito = true; return ch; },
        unsubscribe: () => { window.__reg.desuscritos.push(nombre); reg.vivo = false; return Promise.resolve('ok'); }
      };
      reg.ch = ch;
      return ch;
    };
    cli.removeChannel = (ch) => { window.__reg.quitados.push(ch && ch.__reg ? ch.__reg.nombre : '?');
                                  if (ch && ch.__reg) ch.__reg.vivo = false; return Promise.resolve('ok'); };
    cli.functions = { invoke: () => Promise.resolve({data:null,error:null}) };
    cli.auth = {
      getSession: () => Promise.resolve({ data:{ session: sesion }, error:null }),
      getUser: () => Promise.resolve({ data:{ user: sesion && sesion.user }, error:null }),
      onAuthStateChange: (cb) => { (window.__reg.cbs = window.__reg.cbs || []).push({cliente:id, cb:cb});
                                   return { data:{ subscription:{ unsubscribe(){} } } }; },
      signInWithPassword: (c) => { sesion = { access_token:'TOK', user:{ email:c.email, user_metadata:{} } };
                                   guardar();
                                   (window.__reg.cbs||[]).filter(x=>x.cliente===id).forEach(x=>x.cb('SIGNED_IN', sesion));
                                   return Promise.resolve({ data:{ session:sesion, user:sesion.user }, error:null }); },
      signInWithOtp: () => Promise.resolve({ data:{}, error:null }),
      setSession: (s) => { sesion = s; guardar(); return Promise.resolve({ data:{session:s}, error:null }); },
      signOut: () => { window.__reg.signOuts.push(id); sesion = null; guardar();
                       (window.__reg.cbs||[]).filter(x=>x.cliente===id).forEach(x=>x.cb('SIGNED_OUT', null));
                       return Promise.resolve({ error:null }); }
    };
    return cli;
  }
  window.supabase = { createClient: cliente };
  /* Contar pitidos sin depender de Web Audio en headless. */
  function FakeCtx(){ this.state='running'; this.currentTime=0; this.destination={};
    this.resume=function(){}; this.createGain=function(){ return {gain:{setValueAtTime(){},linearRampToValueAtTime(){}},connect(){}}; };
    this.createOscillator=function(){ return {frequency:{},connect(){},start(){},stop(){ }}; }; }
  window.AudioContext = function(){ const c = new FakeCtx();
    const co = c.createOscillator.bind(c);
    c.createOscillator = function(){ window.__reg.beeps++; return co(); };
    return c; };
  window.webkitAudioContext = window.AudioContext;
})();
`;

window.addEventListener('load', async () => {
  try { localStorage.clear(); } catch(_) {}

  let html = await (await fetch('/index.html')).text();
  html = html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2"><\/script>/,
                      '<scr'+'ipt>' + DOBLE + '</scr'+'ipt>');
  html = html.replace(/<head>/i, '<head><base href="/">');
  const doc = f.contentDocument; doc.open(); doc.write(html); doc.close();
  await esperar(2500);

  const w = f.contentWindow, d = f.contentDocument, R = w.__reg || {};
  if (!R.clientes) { log('el doble no se instalo: la medicion no vale'); return; }

  log('CLIENTES creados: ' + R.clientes.map(c=>c.id+' key='+c.storageKey).join(' | '));
  try { log('_sb (datos/chat) = ' + w.eval('_sb.__id') + '   window.faroSb (auth) = ' + w.faroSb.__id +
            '   ¿el mismo? ' + w.eval('_sb === window.faroSb')); } catch(e){ log('eval: '+e.message); }
  log('CANALES abiertos al arrancar: ' + JSON.stringify(R.canales.map(c=>({cliente:c.cliente,nombre:c.nombre,suscrito:c.suscrito}))));
  log('');

  /* 1 · entrar como Josue */
  const ok = await w.iniciarSesion('josue','x');
  await esperar(400);
  log('PASO 1 · entra Josue: iniciarSesion=' + ok + '  verificarSesion()=' + JSON.stringify(w.verificarSesion()));

  const canal = (R.canales||[]).find(c => c.nombre === 'mensajes-realtime');
  if (!canal) { log('no hay canal "mensajes-realtime": la sonda no aplica'); return; }
  const insert = canal.handlers['INSERT'];
  log('  canal "mensajes-realtime" del cliente ' + canal.cliente + ', suscrito=' + canal.suscrito +
      ', handler INSERT=' + (typeof insert));
  log('');

  /* 2 · cerrar sesion pulsando el boton real */
  const btn = d.getElementById('logout-btn');
  log('PASO 2 · se pulsa #logout-btn (existe? ' + !!btn + ')');
  if (btn) btn.click(); else await w.cerrarSesion();
  await esperar(1000);
  const lg = d.getElementById('login-screen'), app = d.getElementById('app-container');
  log('  verificarSesion() = ' + JSON.stringify(w.verificarSesion()));
  log('  pantalla: login display=' + (lg?getComputedStyle(lg).display:'n/d') +
      '  app display=' + (app?getComputedStyle(app).display:'n/d'));
  log('  signOut() se llamo sobre: ' + JSON.stringify(R.signOuts));
  log('  removeChannel() llamado con: ' + JSON.stringify(R.quitados));
  log('  unsubscribe() llamado con: ' + JSON.stringify(R.desuscritos));
  log('  >>> canal "mensajes-realtime" sigue vivo? ' + (canal.vivo ? 'SI' : 'no'));
  log('');

  /* 3 · llega un mensaje de OTRO miembro mientras esta puesta la pantalla de entrada */
  const cont = d.getElementById('chat-messages');
  const antesN = cont ? cont.querySelectorAll('.chat-msg').length : -1;
  const beepsAntes = R.beeps;
  log('PASO 3 · con el login puesto, Evelyn escribe. Se dispara el INSERT de realtime.');
  log('  mensajes en el DOM antes: ' + antesN + '   osciladores de alerta antes: ' + beepsAntes);
  try {
    insert({ new: { id:'m-secreto-1', usuario:'Evelyn Sarahí', tema:'General',
                    mensaje:'SECRETO: la clave de la caja fuerte es 4417',
                    creado_at: new Date().toISOString() } });
  } catch(e) { log('  el handler lanzo: ' + e.message); }
  await esperar(400);
  const despuesN = cont ? cont.querySelectorAll('.chat-msg').length : -1;
  log('  mensajes en el DOM despues: ' + despuesN + '   osciladores de alerta despues: ' + R.beeps);
  const pintado = d.querySelector('.chat-msg[data-msg-id="m-secreto-1"]');
  log('  >>> ¿el mensaje quedo pintado en el chat oculto? ' + (pintado ? 'SI' : 'no'));
  if (pintado) log('      texto: "' + pintado.querySelector('.chat-msg-text').textContent + '"');
  log('  >>> ¿sono la alerta estando fuera de sesion? ' + (R.beeps > beepsAntes ? 'SI ('+(R.beeps-beepsAntes)+' osciladores)' : 'no'));
  log('');

  /* 3b · ¿es visible de verdad para quien esta en la pantalla de entrada? */
  if (pintado) {
    const r = pintado.getBoundingClientRect();
    const vista = d.getElementById('view-chat');
    log('  ¿el nodo tiene caja (visible en pantalla)? ' + (r.width>0 && r.height>0 ? 'SI '+Math.round(r.width)+'x'+Math.round(r.height) : 'no (0x0, oculto)'));
    log('  #app-container display=' + (app?getComputedStyle(app).display:'n/d') +
        '   #view-chat clases="' + (vista?vista.className:'n/d') + '"');
  }
  log('');

  /* 4 · entra OTRO miembro en el mismo telefono, sin recargar */
  const ok2 = await w.iniciarSesion('jael','x');
  await esperar(300);
  const btnEntrar = null;
  /* la aplicacion se vuelve a mostrar por el camino real del formulario */
  const form = d.getElementById('login-form');
  const uEl = d.getElementById('login-user'), pEl = d.getElementById('login-pass') || d.getElementById('login-pin');
  if (form && uEl && pEl) { uEl.value = 'jael'; pEl.value = 'x'; form.dispatchEvent(new w.Event('submit', {cancelable:true, bubbles:true})); }
  await esperar(1200);
  log('PASO 4 · entra Jael en el mismo telefono, SIN recargar (iniciarSesion=' + ok2 + ')');
  log('  verificarSesion() = ' + JSON.stringify(w.verificarSesion()));
  const sigue = d.querySelector('.chat-msg[data-msg-id="m-secreto-1"]');
  log('  >>> ¿Jael se encuentra el mensaje de la sesion anterior ya pintado? ' + (sigue ? 'SI' : 'no'));
  log('  (nota: ¿alguien recarga el historial al entrar? chatLoadHistory se llamo de nuevo? ' +
      'se comprueba por el numero de nodos: ' + (cont ? cont.querySelectorAll('.chat-msg').length : -1) + ')');
  log('');

  /* 5 · contraste: ¿existe algun gancho que avise a los modulos? */
  log('PASO 5 · contraste');
  log('  removeChannel/unsubscribe en toda la corrida: ' + JSON.stringify(R.quitados) + ' / ' + JSON.stringify(R.desuscritos));
  log('  onAuthStateChange registrado por: ' + JSON.stringify((R.cbs||[]).map(x=>x.cliente)) +
      '  (¿lo escucha el cliente de datos ' + (w.eval('_sb.__id')) + '?)');
  log('');
  log('FIN');
});
</script>
</body>
</html>
