<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Poder Político, etapa 4</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-politica-alianzas/alianzas.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 4 de la Ruta del Poder Político: bancos, laboratorio,
   pruebas impresas con su nombre, las siete piezas de una alianza, las ocho
   alianzas que le llegan al proyecto, la ficha y la ruta con CUATRO etapas.

   Se escribió mirando primero que fallara con la misión sin terminar: una
   comprobación que nunca se ha visto en rojo no se sabe si funciona. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Poder Político · Etapa 4 de 6/.test(d.body.textContent), 'se presenta como etapa 4 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se busca el VOCABULARIO propio de la etapa 3, no la
       palabra «mesa», que aparece a propósito al citarla. Lo que no puede
       quedar es su temario: la moneda de cambio, el piloto y la minuta. */
    ok(!/moneda que pides|la moneda de cambio|piloto con fecha|la minuta/i.test(d.body.textContent),
       'sin restos de la etapa de la que se copió', 'queda el temario de La mesa');
    ok(!/Simulacro de Presión: la interpelación/.test(d.body.textContent), 'sin el rótulo heredado de la etapa 1', 'queda «Simulacro de Presión: la interpelación»');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'aporte,firma,papel,salida', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas de una alianza', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_pol_alianzas/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    ok(dentro('labParte') === 'aporte', 'el laboratorio arranca en su primera pieza', 'arranca en: ' + dentro('labParte'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LA POSTURA ANTE LA ALIANZA ──');
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/cuando cambia el director/i.test(texto), 'trae la frase maestra', 'falta «cuando cambia el director»');
    ok(/cabeza de dos personas/i.test(texto), 'trae la señal de alarma de la etapa', 'falta la señal de alarma');
    ok(/no está en el acta no pasó/i.test(texto), 'trae la regla del acta', 'falta la regla del acta');
    ok(/patronato/i.test(texto), 'trae el patronato', 'no aparece el patronato');
    ok(/entusiasta/i.test(texto), 'distingue al entusiasta', 'no aparece el entusiasta');
    ok(/relevo/i.test(texto), 'trae el relevo', 'no aparece el relevo');
    ok(/en pequeño/i.test(texto), 'manda probar en pequeño', 'no manda probar en pequeño');
    ok(/asamblea/i.test(texto), 'trae la regla de la asamblea', 'no aparece la asamblea');
    ok(/de la foto se sale/i.test(texto), 'trae la regla del año electoral', 'falta «de la foto se sale»');
    /* Esta etapa se apoya en las tres anteriores a propósito */
    ok(/organigrama|quién decide/i.test(texto), 'conecta con la etapa 1 (el mapa del poder)', 'no conecta con la etapa 1');
    ok(/trámite|papel hace falta/i.test(texto), 'conecta con la etapa 2 (normas y trámites)', 'no conecta con la etapa 2');
    ok(/mesa/i.test(texto), 'conecta con la etapa 3 (la mesa)', 'no conecta con la etapa 3');

    log('\n── LOS TIPOS DE ALIADO Y EL PATRONATO ──');
    /* Los cuatro aparecen en el texto de la misión como «el que da acceso»,
       «el que pone manos», etc., y en los rótulos del panel de tipos, así que
       se busca la palabra suelta y no una construcción concreta. */
    ['acceso', 'manos', 'dinero', 'nombre']
      .forEach(k => { if (!new RegExp(k, 'i').test(texto)) { fallos++; log('  ✘ falta el tipo de aliado: ' + k); } });
    ok(/junta directiva de la comunidad/i.test(texto), 'define el patronato', 'no dice qué es el patronato');
    ok(/salón comunal/i.test(texto), 'dice lo que el patronato sí puede', 'no dice lo que el patronato puede');
    ok(/dinero público/i.test(texto), 'dice lo que el patronato no puede', 'no dice lo que el patronato no puede');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/El aporte/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en «El aporte»', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn.active-pri'), 'y con su botón resaltado', 'ningún botón del laboratorio queda resaltado');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la prueba «La alianza que aguanta» se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|Los datos de los demás|Quién decide de verdad|Para quién y qué le cambia|El presupuesto real|La deuda por dentro|Pedir bien|Verificar|La IA que programa|La mesa|La mesa que se cierra|la interpelación|Autocapacitación Técnica|Etapa 3/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');
    ok(!/moneda que pides|piloto/i.test(crit), 'las preguntas III y IV son las de esta etapa', 'quedan preguntas de la etapa 3');
    ok(/La alianza sobre la mesa/.test(crit), 'la sección I lleva el nombre de esta etapa', 'la sección I no se llama «La alianza sobre la mesa»');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['salón comunal', 'ONG', 'traslada', 'iglesia', 'regidor', 'referente', 'dos escuelas', 'comité de padres']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      /* No puede repetir los casos de las etapas 1, 2 y 3 de esta misma ruta */
      ok(!/permiso de funcionamiento|constancia de la supervisión|acta de la reunión con el alcalde/i.test(txt), 'no repite casos de las etapas anteriores', 'repite un caso de otra etapa de la ruta');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas de las alianzas/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/hoja de la alianza/i.test(txt), 'trae la hoja de la alianza', 'falta la hoja de la alianza');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/salón|ONG|directora|iglesia|regidor|maestra|escuelas|padres/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-politica-alianzas.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/La hoja de la alianza/i.test(txt), 'la ficha trae la hoja de la alianza', 'falta la hoja de la alianza');
    ok(/La regla del acta/i.test(txt), 'la ficha trae la regla del acta paso a paso', 'falta la regla del acta');
    ok(/Cuándo se dice que no a un aliado/i.test(txt), 'la ficha dice cuándo se dice que no', 'falta el cuándo decir que no');
    ok(/Qué se lleva a una primera reunión/i.test(txt), 'la ficha trae la primera reunión', 'falta la primera reunión');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txt), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txt.match(/<table/g) || []).length === (txt.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar: un corte partió una tabla');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-politica-alianzas"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const rp = [...da.querySelectorAll('.ruta-card')].find(c => ((c.querySelector('.ruta-nombre') || {}).textContent || '').trim() === 'Ruta del Poder Político');
    ok(!!rp, 'la Ruta del Poder Político está en el mapa', 'no aparece la ruta');
    if (rp) {
      /* La cuenta exacta de etapas tocables la lleva _dev/probe-rutas.html, que
         se actualiza cada vez que se añade una misión. Aquí solo se comprueba
         que esta etapa llegó al mapa y que las seis siguen listadas. */
      ok(rp.querySelectorAll('.re-link').length >= 4, 'con sus etapas 1 a 4 ya tocables', 'la etapa 4 no es tocable');
      ok(rp.querySelectorAll('.re-link').length + rp.querySelectorAll('.ruta-etapa-futura').length === 6, 'las 6 etapas de la ruta están en el mapa', 'etapas en el mapa: ' + (rp.querySelectorAll('.re-link').length + rp.querySelectorAll('.ruta-etapa-futura').length));
      ok(/Alianzas, patronato y comunidad/.test(rp.textContent), 'la etapa 4 sale con el título de la misión', 'la etapa 4 sigue saliendo como prevista');
      ok(/El dinero público/i.test(rp.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="pol"]');
    ok(!!chip, 'la materia Poder Político tiene su chip', 'no hay chip de Poder Político');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length >= 4, 'la materia muestra sus misiones', 'muestra ' + tarjetas.length);
      const al = tarjetas.find(t => /Alianzas, patronato/i.test(t.textContent));
      ok(!!al && /🔒/.test(al.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
