<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de los Átomos y los Ídolos, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-atomos-contra-miedo/atomos-miedo.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta de los Átomos y los Ídolos (Materialismo
   Filosófico, materia 23 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha y la ruta en el mapa.

   La REGLA DEL ESTATUS del compendio rige también aquí: ningún estudio ni
   obra entra sin su etiqueta. La sonda exige que las fuentes de la etapa
   aparezcan con su transporte declarado: Epicuro con la Carta a Meneceo,
   Lucrecio con De rerum natura y su siglo, Demócrito POR FRAGMENTOS Y
   DOXOGRAFÍA (así se dice), y Greenblatt con su etiqueta de divulgación
   con inflado, porque una misión que enseñara a auditar miedos citando
   fuentes sin estatus sería el error que quiere evitar. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de los Átomos y los Ídolos · Etapa 1 de 6/.test(d.body.textContent), 'se presenta como etapa 1 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 1 del espejo, y su vocabulario
       no va aquí. Se excluye el punto de Recursos que enlaza a la misión del
       espejo a propósito (la conexión entre materias es deliberada); todo lo
       demás se mira entero. */
    const cuerpoSinEnlace = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-espejo-vigia-timon"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/vigía|timón|metacognición|metanivel|nivel objeto|Máquina que se Mira|coletilla|La Gaceta/i.test(cuerpoSinEnlace),
       'sin restos de la misión de la que se copió', 'queda vocabulario del espejo o de la Ley');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── LA REGLA DEL ESTATUS (la regla del Estudio Mayor) ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Epicuro/.test(texto0) && /Carta a Meneceo/.test(texto0), 'Epicuro aparece con su Carta a Meneceo', 'falta Epicuro con la Carta a Meneceo');
    ok(/Lucrecio/.test(texto0) && /De rerum natura/.test(texto0) && /siglo I a\. C\./.test(texto0), 'Lucrecio aparece con De rerum natura y su siglo', 'falta Lucrecio con obra y siglo');
    ok(/fragmentos y (por )?doxografía/i.test(texto0), 'Demócrito llega por fragmentos y doxografía, y así se dice', 'no se declara el transporte de Demócrito');
    ok(/clásico sólido/i.test(texto0), 'las fuentes llevan su etiqueta de estatus', 'ninguna fuente lleva etiqueta');
    ok(/Greenblatt/.test(texto0) && /divulgación con inflado/i.test(texto0), 'Greenblatt entra con su etiqueta de inflado', 'falta la etiqueta de El giro');
    ok(/Diógenes Laercio/.test(texto0) && /libro X/.test(texto0), 'Diógenes Laercio con su libro X', 'falta el archivero de las cartas');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    /* El molde llama «a» al índice correcto de evalMCBank y «c» al de qzData.
       Confundirlos deja la evaluación final calificando al azar. */
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr: la pauta imprime undefined');
    ok(dentro('Object.keys(parteData).join(",")') === 'atomos,botiquin,poema,limite', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos de la historia del programa', 'momentos: ' + dentro('timelineData.length'));
    ok(/faro_atomos_miedo/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/átomos y (el )?vacío/i.test(texto), 'los átomos y el vacío', 'no aparece la frase fundadora');
    ok(/Leucipo/.test(texto) && /Demócrito/.test(texto), 'Leucipo y Demócrito con nombre', 'faltan los fundadores');
    ok(/tetrafármaco/i.test(texto), 'el tetrafármaco', 'no aparece el remedio de cuatro frascos');
    ok(/los dos miedos|dioses.*muerte|muerte.*dioses/i.test(texto), 'los dos miedos de Epicuro', 'faltan los dos miedos');
    ok(/clinamen/i.test(texto), 'el clinamen', 'no aparece el clinamen');
    ok(/miel/i.test(texto) && /verso|poema/i.test(texto), 'la miel del borde y el poema', 'falta la imagen de Lucrecio');
    ok(/deseo sin límite/i.test(texto) && /anzuelo/i.test(texto), 'el deseo sin límite como anzuelo', 'falta la tabla de los deseos');
    ok(/superad/i.test(texto) && /programa/i.test(texto), 'física superada contra programa vivo', 'falta la distinción clave');
    ok(/consumismo|materialismo de tienda/i.test(texto), 'el deslinde con el consumismo', 'no se mata el error de primer día');
    ok(/mecanismo/i.test(texto), 'el mecanismo como cura del miedo', 'no aparece el gesto de Lucrecio');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Los átomos y el vacío/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en los átomos y el vacío', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="atomos"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el miedo sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/Átomos contra el miedo/.test(rotulos) && !/vigía|timón|Máquina que se Mira|sesión sobre la mesa/i.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['1\\.200', 'eclipse', '18\\.000', '8\\.000', 'Angelly', '500 mensuales', 'cuántica', 'huracán']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length === 8, 'los ocho casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/lempira|L \d/i.test(txt), 'los casos traen números en lempiras', 'los casos no traen lempiras');
      ok(/botiquín/i.test(txt), 'trae el botiquín de la etapa', 'falta el botiquín de la etapa');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/sin burlarse|sin despreciar/i.test(txt), 'los casos desmontan sin burlarse (regla 5)', 'falta la regla del respeto');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/1\.200|eclipse|18\.000|cuántico|huracán/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');


    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    /* La linterna enseña el número que le toca a cada tarjeta, y cobra su
       precio: esa secuencia deja de dar XP, y se dice en pantalla. */
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/ÁTOMOS/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(!/SOCIEDAD ABIERTA|RACIONALISMO CRÍTICO|CISNE NEGRO/.test(banda), 'sin las palabras de la misión de Popper', 'la banda sigue siendo la de Popper');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-atomos-contra-miedo.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja del desmontador, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja del desmontador en blanco', 'falta la hoja del desmontador');
    ok(/Una hoja del desmontador ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/El botiquín de la casa/i.test(txtF), 'la ficha trae el botiquín para recortar', 'falta el botiquín');
    ok(/tetrafármaco/i.test(txtF) && /clinamen/i.test(txtF), 'la ficha trae el tetrafármaco y el clinamen', 'faltan piezas del temario');
    ok(/fragmentos y doxografía/i.test(txtF), 'la ficha declara el transporte de Demócrito', 'la ficha cita a Demócrito sin transporte');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok(/clásico sólido/i.test(txtF) && /divulgación con inflado/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-atomos-contra-miedo"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de los Átomos y los Ídolos/.test(c.textContent));
    ok(!!ruta, 'la Ruta de los Átomos y los Ídolos está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 2, 'con sus etapas 1 y 2 ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 4, 'y 4 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/Átomos contra el miedo/.test(ruta.textContent) && /El hombre máquina/.test(ruta.textContent), 'las etapas 1 y 2 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La frontera de la conciencia/.test(ruta.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La materia «mayor» creció con el Expediente Rojo: ahora son tres. */
      ok(tarjetas.length === 9, 'la materia muestra sus nueve misiones', 'muestra ' + tarjetas.length);
      const t = tarjetas.find(x => /Átomos contra el miedo/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda átomos etapa 1';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda átomos etapa 1'; }
});
</script>
</body>
</html>
