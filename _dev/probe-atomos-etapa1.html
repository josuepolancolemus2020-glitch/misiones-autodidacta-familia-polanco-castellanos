<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de los Átomos y los Ídolos, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-atomos-contra-miedo/atomos-miedo.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta de los Átomos y los Ídolos (Materialismo
   Filosófico, materia 23 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha y la ruta en el mapa.

   Y, desde la norma 5-nonies, las SEIS lecturas: el careo con sus seis
   partes y sus anclas reales, las seis plegadas al entrar con su índice,
   las preguntas de cada texto dentro de su propia tarjeta (5, 2 y 2), la
   barra de marcar junto al trozo seleccionado y la marca de lectura. La
   batería suelta del final de la sección ya no existe, y la sonda exige
   que no vuelva: era donde había que ir a buscar cuáles de las preguntas
   eran las de uno.

   La REGLA DEL ESTATUS del compendio rige también aquí: ningún estudio ni
   obra entra sin su etiqueta. La sonda exige que las fuentes de la etapa
   aparezcan con su transporte declarado: Epicuro con la Carta a Meneceo,
   Lucrecio con De rerum natura y su siglo, Demócrito POR FRAGMENTOS Y
   DOXOGRAFÍA (así se dice), y Greenblatt con su etiqueta de divulgación
   con inflado, porque una misión que enseñara a auditar miedos citando
   fuentes sin estatus sería el error que quiere evitar. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de los Átomos y los Ídolos · Etapa 1 de 6/.test(d.body.textContent), 'se presenta como etapa 1 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 1 del espejo, y su vocabulario
       no va aquí. Se excluye el punto de Recursos que enlaza a la misión del
       espejo a propósito (la conexión entre materias es deliberada); todo lo
       demás se mira entero. */
    const cuerpoSinEnlace = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-espejo-vigia-timon"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/vigía|timón|metacognición|metanivel|nivel objeto|Máquina que se Mira|coletilla|La Gaceta/i.test(cuerpoSinEnlace),
       'sin restos de la misión de la que se copió', 'queda vocabulario del espejo o de la Ley');
    /* El guion largo se busca por su código (\u2014) y no escrito tal cual:
       una sonda que lo lleve dentro la caza el grep de la norma 1-bis a
       ella misma, y hay que ir a comprobar a mano si el fallo es de verdad. */
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');

    log('\n── LA REGLA DEL ESTATUS (la regla del Estudio Mayor) ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Epicuro/.test(texto0) && /Carta a Meneceo/.test(texto0), 'Epicuro aparece con su Carta a Meneceo', 'falta Epicuro con la Carta a Meneceo');
    ok(/Lucrecio/.test(texto0) && /De rerum natura/.test(texto0) && /siglo I a\. C\./.test(texto0), 'Lucrecio aparece con De rerum natura y su siglo', 'falta Lucrecio con obra y siglo');
    ok(/fragmentos y (por )?doxografía/i.test(texto0), 'Demócrito llega por fragmentos y doxografía, y así se dice', 'no se declara el transporte de Demócrito');
    ok(/clásico sólido/i.test(texto0), 'las fuentes llevan su etiqueta de estatus', 'ninguna fuente lleva etiqueta');
    ok(/Greenblatt/.test(texto0) && /divulgación con inflado/i.test(texto0), 'Greenblatt entra con su etiqueta de inflado', 'falta la etiqueta de El giro');
    ok(/Diógenes Laercio/.test(texto0) && /libro X/.test(texto0), 'Diógenes Laercio con su libro X', 'falta el archivero de las cartas');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    /* El molde llama «a» al índice correcto de evalMCBank y «c» al de qzData.
       Confundirlos deja la evaluación final calificando al azar. */
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr: la pauta imprime undefined');
    ok(dentro('Object.keys(parteData).join(",")') === 'atomos,botiquin,poema,limite', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos de la historia del programa', 'momentos: ' + dentro('timelineData.length'));
    ok(/faro_atomos_miedo/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    /* Los tres bancos de las lecturas se miran más abajo, en su propia
       sección: con seis lecturas ya no basta el total, hay que ver el
       reparto por voz. */
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/átomos y (el )?vacío/i.test(texto), 'los átomos y el vacío', 'no aparece la frase fundadora');
    ok(/Leucipo/.test(texto) && /Demócrito/.test(texto), 'Leucipo y Demócrito con nombre', 'faltan los fundadores');
    ok(/tetrafármaco/i.test(texto), 'el tetrafármaco', 'no aparece el remedio de cuatro frascos');
    ok(/los dos miedos|dioses.*muerte|muerte.*dioses/i.test(texto), 'los dos miedos de Epicuro', 'faltan los dos miedos');
    ok(/clinamen/i.test(texto), 'el clinamen', 'no aparece el clinamen');
    ok(/miel/i.test(texto) && /verso|poema/i.test(texto), 'la miel del borde y el poema', 'falta la imagen de Lucrecio');
    ok(/deseo sin límite/i.test(texto) && /anzuelo/i.test(texto), 'el deseo sin límite como anzuelo', 'falta la tabla de los deseos');
    ok(/superad/i.test(texto) && /programa/i.test(texto), 'física superada contra programa vivo', 'falta la distinción clave');
    ok(/consumismo|materialismo de tienda/i.test(texto), 'el deslinde con el consumismo', 'no se mata el error de primer día');
    ok(/mecanismo/i.test(texto), 'el mecanismo como cura del miedo', 'no aparece el gesto de Lucrecio');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/doña Meches/i.test(tg) && !/don Tulio/i.test(tg), 'el guion tiene personaje propio, y no es el de otra misión', 'el guion no tiene personaje propio');
      ok(/7:10|6:20 a 7:10/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entran los nombres y las fechas, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con los primeros datos llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(1417|14\d\d|18\d\d|19\d\d|20\d\d|341|270)\b/.test(antesDelGiro) && !/Demócrito|Epicuro|Lucrecio|tetrafármaco/i.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha o un nombre antes del minuto dos');
      ok(/siglo quinto antes de Cristo/i.test(tg) && /341 al 270/.test(tg) && /1417/.test(tg),
         'el guion trae las fechas de la etapa', 'al guion le faltan fechas');
      ok(/átomos y vacío/i.test(tg) && /dos miedos/i.test(tg) && /tetrafármaco/i.test(tg),
         'y enseña las piezas de la etapa por la historia', 'el guion no enseña las piezas');
      ok(/De rerum natura/.test(tg) && /seis libros/i.test(tg) && /miel/i.test(tg),
         'y trae a Lucrecio con su poema y su miel', 'el guion no trae a Lucrecio');
      ok(/la fe de la casa se respeta|La fe se respeta/i.test(tg) && /se desmonta/i.test(tg),
         'y contesta la objeción sin pedir burlas (regla de la casa)', 'el guion no contesta la objeción del público');
      ok(/superada/i.test(tg) && /programa/i.test(tg), 'y declara qué está superado y qué sigue vivo', 'el guion no hace el deslinde de honradez');
      ok(/quien conoce el mecanismo deja de pagarle al miedo/i.test(tg), 'el cierre aterriza en la frase de la misión', 'el cierre no aterriza');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl) && /Soler Serrano/.test(tl) && /Quintero/.test(tl) && /Gala/.test(tl),
         'las cinco primeras voces están nombradas', 'faltan voces');
      ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
      ok(/seis lecturas|Seis lecturas/.test(tl) && /careo/i.test(tl), 'la sección se presenta como seis lecturas y nombra el careo', 'la sección sigue anunciando cinco');
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'].every(k => !!d.querySelector('#lect-' + k + ' .lect-nota')),
         'las seis tarjetas existen con su nota de etiqueta', 'falta alguna tarjeta lect-* o su lect-nota');
      ok(/nunca ocurrió/.test(d.querySelector('#lect-entrevista .lect-nota').textContent),
         'la entrevista declara que el encuentro nunca ocurrió', 'la entrevista no declara la ficción');
      ok(/nunca ocurrió/.test(d.querySelector('#lect-gala .lect-nota').textContent),
         'la conversación declara que la charla nunca ocurrió', 'la conversación no declara la ficción');
      ok(/Las píldoras del cometa/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/buhonero/.test(tl) && /Sabina/.test(tl) && /estudiante/.test(tl), 'el capítulo cervantino está, con su venta y su buhonero', 'falta el capítulo cervantino');
      ok(/El impuesto más antiguo del mundo/.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      ok(/El poeta que no quiso asustar a nadie/.test(tl), 'la entrevista de la casa está', 'falta la entrevista');
      ok(/Los dos miedos, de madrugada/.test(tl), 'la conversación del Loco de la Colina está', 'falta la conversación');
      /* Norma 1-bis: el diálogo va con nombre en mayúsculas y punto, sin raya. */
      ok(/SOLER SERRANO\./.test(tl) && /LUCRECIO\./.test(tl) && /QUINTERO\./.test(tl) && /GALA\./.test(tl),
         'los diálogos van con el nombre en mayúsculas, sin raya', 'falta el marcado teatral del diálogo');
      ok(/\(Silencio\.\)|\(Silencio largo\.\)/.test(tl), 'los silencios de Quintero van en acotación', 'faltan los silencios en acotación');
      ok(/\(dijo el cura\)|\(respondió ella\)|\(dijo el buhonero\)|\(replicó el estudiante\)|\(respondió el estudiante\)|\(dijo la sobrina\)/.test(tl),
         'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL y comprobable. */
      ok(/reales y comprobables/i.test(tl) && /citas (apócrifas|inventadas)/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/1910/.test(tl) && /Halley/.test(tl), 'ancla real: el pánico del cometa Halley de 1910', 'falta el ancla del cometa dentro del cuento');
      ok(/siglo V antes de Cristo|siglo quinto antes de Cristo/i.test(tl) && /átomos y vacío/i.test(tl), 'ancla real: Demócrito y los átomos y el vacío', 'falta la frase fundadora dentro de los textos');
      ok(/fragmentos y (por )?doxografía/i.test(tl), 'ancla real: el transporte de Demócrito, declarado también aquí', 'las lecturas citan a Demócrito sin transporte');
      ok(/341/.test(tl) && /270/.test(tl), 'ancla real: los años de Epicuro', 'faltan los años de Epicuro dentro de los textos');
      ok(/Carta a Meneceo/.test(tl) && /tetrafármaco/i.test(tl), 'ancla real: la Carta a Meneceo y el tetrafármaco', 'falta el remedio dentro de los textos');
      ok(/Diógenes Laercio/.test(tl) && /libro X/.test(tl), 'ancla real: Diógenes Laercio y su libro X', 'falta el archivero dentro de los textos');
      ok(/De rerum natura/.test(tl) && /seis libros/i.test(tl), 'ancla real: el poema y sus seis libros', 'falta el poema dentro de los textos');
      ok(/miel/i.test(tl) && /vaso/i.test(tl), 'ancla real: la miel en el borde del vaso', 'falta la imagen de la miel');
      ok(/clinamen/i.test(tl), 'ancla real: el clinamen', 'falta el clinamen dentro de los textos');
      ok(/1417/.test(tl) && /monasterio/i.test(tl), 'ancla real: el hallazgo de 1417', 'falta el hallazgo dentro de los textos');
      ok(/mono adivino/i.test(tl) && /1615/.test(tl) && /25 y 27/.test(tl), 'ancla real declarada: el mono adivino (Quijote II, 25 y 27, de 1615)', 'falta el ancla real del capítulo cervantino o cita mal sus capítulos (el secreto del mono está en el 27, no en el 26)');
      /* Y las anclas cervantinas de las otras misiones NO se repiten. */
      ok(!/batanes|rebuzno|bodas de Camacho|yelmo de Mambrino|galeotes|Edad de Oro|Montesinos|Juan Haldudo|encina|báculo|azotes|Barataria|escrutinio/i.test(tl),
         'no repite las anclas cervantinas ya usadas en la serie', 'repite un ancla ya usada en otra misión');
      ok(/A Fondo/.test(tl) && /1976 a 1981/.test(tl) && /(Cortázar|Rulfo|Dalí)/.test(tl),
         'el entrevistador va presentado con su programa y sus entrevistas reales', 'falta la seña real de Soler Serrano');
      ok(/entrevistas imposibles/i.test(tl) && /(Calvino|Eco)/.test(tl),
         'y el género de las entrevistas imposibles, con su ancla real', 'falta el ancla del género');
      ok(/San Jerónimo/.test(tl) && /desconfían/i.test(tl),
         'la leyenda de San Jerónimo entra declarada como rumor sin pruebas', 'la entrevista usa la leyenda como dato');
      ok(/1940/.test(tl) && /2022/.test(tl) && /1930/.test(tl) && /2023/.test(tl),
         'ancla real: las fechas vitales de Quintero y de Gala', 'faltan las fechas de los dos andaluces');
      ok(/Troylo/.test(tl) && /El manuscrito carmesí/.test(tl) && /1990/.test(tl),
         'ancla real: Troylo y el Planeta de 1990', 'faltan las anclas de Gala');
      /* Las seis lecturas deben ENSEÑAR el tema, no solo sonar bonito. */
      ok(/mecanismo/i.test(tl) && /cobrador/i.test(tl) && /(de qué está hecho|de qué está hecha)/i.test(tl),
         'las lecturas enseñan el tema de la etapa', 'las lecturas no tocan el tema');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie: enfrenta
       dos posturas reales. Por eso su etiqueta es distinta y por eso aquí se
       exige lo contrario que a los otros cinco: que NO diga «no es obra de
       ese autor» (no hay autor imitado) y que sí diga que los turnos los
       firman papeles y no personas. Ponerle palabras inventadas en la boca a
       un investigador vivo sería exactamente el inflado que esta etapa caza. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent;
      const notaC = (careo.querySelector('.lect-nota') || {}).textContent || '';
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no se le pone .{0,30}palabra en la boca|no personas/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(/tercera persona/i.test(notaC), 'y que las personas reales se citan como fuentes, no como hablantes', 'el careo no declara el trato de las fuentes');
      ok(/mejor versión/i.test(notaC), 'y que cada postura va en su mejor versión (el acero antes del juicio)', 'el careo no declara la regla del acero');
      ok(!/NO es obra de ese autor/i.test(notaC), 'y NO se etiqueta como pastiche, porque no imita a nadie', 'el careo se declara pastiche');
      /* Las seis partes obligatorias, en su orden. */
      ok(/pregunta de este careo es una sola|pregunta en disputa/i.test(tc), '1. plantea la pregunta en disputa', 'al careo le falta la pregunta en disputa');
      ok(/La postura A dice esto/i.test(tc), '2. la postura A, dicha por su mejor defensor', 'falta la postura A');
      ok(/La postura B empieza/i.test(tc), '3. la postura B, dicha por su mejor defensor', 'falta la postura B');
      ok(/Vienen las réplicas|réplicas/i.test(tc), '4. las réplicas de cada lado a lo que dijo el otro', 'al careo le faltan las réplicas');
      ok(/terreno común/i.test(tc) && /aceptan/i.test(tc), '5. dice qué aceptan las dos posturas', 'al careo le falta el terreno común');
      ok(/sigue en disputa/i.test(tc), '6. dice qué sigue en disputa', 'el careo no dice qué queda sin resolver');
      ok(/qué dato movería la balanza|dato lo resolvería|qué dato/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

      ok(/Las píldoras del cometa/.test(hb) && /Molinari/.test(hb) && /boticario/.test(hb),
         'el cuento se imprime con su texto completo', 'el cuento no se imprime');
      ok(/estaba hecho de vacío/.test(hb), 'y hasta su última página', 'la hoja del cuento sale cortada');
      ok(/NO es obra de ese autor/i.test(hb) && /Ejercicio de estilo de la casa/i.test(hb),
         'y con la etiqueta del estatus en la hoja', 'la hoja del cuento sale sin declarar el pastiche');
      ok(/real y comprobable/i.test(hb), 'y con la regla de la erudición real', 'la hoja no trae la regla de los datos reales');

      w.imprimirLectura('cervantes');
      const hc = abiertos[abiertos.length - 1] || '';
      ok(/buhonero/.test(hc) && /Sabina/.test(hc) && /estudiante/.test(hc),
         'el capítulo cervantino se imprime completo', 'el capítulo no se imprime');
      ok(/NO es obra de ese autor/i.test(hc), 'y con su etiqueta', 'la hoja del capítulo sale sin etiqueta');
      ok(/mono adivino/i.test(hc) && /1615/.test(hc) && /25 y 27/.test(hc), 'y con su ancla real declarada (Quijote II, 25 y 27)', 'la hoja del capítulo sale sin su ancla o con los capítulos mal citados');
      ok(!/\u2014/.test(hc), 'y sin guiones largos (norma 1-bis)', 'la hoja del capítulo trae guiones largos');

      w.imprimirLectura('harari');
      const hh = abiertos[abiertos.length - 1] || '';
      ok(/El impuesto más antiguo del mundo/.test(hh) && /tarifa renovable/.test(hh),
         'el ensayo se imprime completo', 'el ensayo no se imprime');
      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      w.imprimirLectura('entrevista');
      const he = abiertos[abiertos.length - 1] || '';
      ok(/El poeta que no quiso asustar a nadie/.test(he) && /SOLER SERRANO/.test(he) && /LUCRECIO/.test(he),
         'la entrevista se imprime completa', 'la entrevista no se imprime');
      ok(/nunca ocurrió/i.test(he), 'y con el aviso de que el encuentro nunca ocurrió', 'la hoja de la entrevista sale sin el aviso de la ficción');
      ok(/Ejercicio de estilo de la casa/i.test(he), 'y con la etiqueta del estatus', 'la hoja de la entrevista sale sin etiqueta');
      ok(/NO es obra de esas personas/i.test(he) && !/NO es obra de ese autor/i.test(he),
         'y la etiqueta concuerda en plural (dos voces en la hoja)', 'la etiqueta de la entrevista dice «ese autor» donde hay dos personas');

      w.imprimirLectura('gala');
      const hg = abiertos[abiertos.length - 1] || '';
      ok(/Los dos miedos, de madrugada/.test(hg) && /QUINTERO/.test(hg) && /GALA/.test(hg),
         'la conversación se imprime completa', 'la conversación no se imprime');
      ok(/acreedor que cobra sin haber prestado nada/.test(hg), 'y hasta su aforismo final', 'la conversación sale cortada');
      ok(/nunca ocurrió/i.test(hg), 'y con el aviso de que la charla nunca ocurrió', 'la hoja de la conversación sale sin el aviso de la ficción');
      ok(/NO es obra de esas personas/i.test(hg) && !/NO es obra de ese autor/i.test(hg),
         'y la etiqueta concuerda en plural (Quintero y Gala)', 'la etiqueta de la conversación dice «ese autor» donde hay dos personas');

      /* El careo se imprime como los otros cinco, pero con la etiqueta que
         le toca: la suya, y NO la del pastiche, porque no imita a nadie. */
      w.imprimirLectura('debate');
      const hd = abiertos[abiertos.length - 1] || '';
      ok(/¿Un libro hizo el mundo moderno\?/.test(hd) && /LA OBJECIÓN\./.test(hd) && /Ada Palmer/.test(hd),
         'el careo se imprime completo', 'el careo no se imprime');
      ok(/Careo escrito por la casa/i.test(hd), 'con su etiqueta propia, la del careo', 'el careo sale sin su etiqueta');
      ok(!/NO es obra de ese autor/i.test(hd) && !/NO es obra de esas personas/i.test(hd),
         'y NO con la del pastiche, porque no imita a nadie', 'el careo sale etiquetado como pastiche');
      ok(/papeles/i.test(hd), 'y la hoja declara que los turnos los firman papeles', 'la hoja del careo no declara cómo firma sus turnos');
      ok(!/\u2014/.test(hd), 'y sin guiones largos', 'el careo impreso trae guiones largos');
      /* Cada lectura se imprime con SUS preguntas y su pauta en hoja aparte
         (normas 5-quater y 5-nonies): así una hoja suelta sirve sola. */
      ok(/Preguntas de esta lectura/.test(hd), 'y con sus propias preguntas detrás', 'la hoja del careo sale sin sus preguntas');
      ok(/Pauta de esta lectura/.test(hd) && /class="pauta"/.test(hd), 'con la pauta en su propia hoja', 'la pauta del careo no queda separada');
      ok((hd.match(/class="op"/g) || []).length === 20, 'sus 5 preguntas con sus 20 opciones', 'opciones del careo: ' + (hd.match(/class="op"/g) || []).length);
      ok(/Preguntas de esta lectura/.test(hb), 'y el cuento también sale con las suyas', 'la hoja del cuento sale sin preguntas');

      w.imprimirTodasLasLecturas();
      const h5 = abiertos[abiertos.length - 1] || '';
      ok(/Las píldoras del cometa/.test(h5) && /buhonero/.test(h5) && /El impuesto más antiguo del mundo/.test(h5) && /El poeta que no quiso asustar a nadie/.test(h5) && /Los dos miedos, de madrugada/.test(h5) && /LA OBJECIÓN\./.test(h5),
         'las seis lecturas se imprimen juntas en un solo pliego', 'el pliego de las seis no sale completo');
      ok((h5.match(/page-break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h5) && /nunca ocurrieron/i.test(h5),
         'y el pliego declara el pastiche de los cinco primeros y la ficción de las entrevistas', 'el pliego de las seis no declara el pastiche');
      ok(/careo/i.test(h5), 'y dice que el sexto es un careo, que no imita a nadie', 'el pliego no distingue el careo de los pastiches');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con 30 de comprensión', 'al pliego de preguntas le falta una sección');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(/seis textos/i.test(hp) && /nunca ocurrieron/i.test(hp), 'y la etiqueta del pliego declara los seis textos y la ficción', 'el pliego no declara los seis textos');
      ok(/careo/i.test(hp), 'y avisa de que el sexto es un careo, con los turnos firmados por papeles', 'el pliego de preguntas no distingue el careo');
      ok(!/\u2014/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');
      /* El pliego pone él mismo el número de cada pregunta, así que un
         enunciado que llegue numerado sale «11. 11. La objeción...». Es el
         único sitio donde el defecto se ve: en pantalla y en la hoja de cada
         lectura lo tapa el saneado de js/lecturas.js, y en el papel no lo
         mira nadie hasta que ya se fotocopió. */
      ok(!/<span class="n">\d+\.<\/span>\s*\d+\./.test(hp),
         'y ninguna pregunta sale numerada dos veces en el papel', 'el pliego numera dos veces alguna pregunta («11. 11. ...»)');
    } finally { w.open = openReal; }

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Los átomos y el vacío/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en los átomos y el vacío', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="atomos"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el miedo sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/Átomos contra el miedo/.test(rotulos) && !/vigía|timón|Máquina que se Mira|sesión sobre la mesa/i.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      const txt = casos.textContent;
      ['1\\.200', 'eclipse', '18\\.000', '8\\.000', 'Angelly', '500 mensuales', 'cuántica', 'huracán']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length === 8, 'los ocho casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/lempira|L \d/i.test(txt), 'los casos traen números en lempiras', 'los casos no traen lempiras');
      ok(/botiquín/i.test(txt), 'trae el botiquín de la etapa', 'falta el botiquín de la etapa');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/sin burlarse|sin despreciar/i.test(txt), 'los casos desmontan sin burlarse (regla 5)', 'falta la regla del respeto');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/1\.200|eclipse|18\.000|cuántico|huracán/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');


    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    /* La linterna enseña el número que le toca a cada tarjeta, y cobra su
       precio: esa secuencia deja de dar XP, y se dice en pantalla. */
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/ÁTOMOS/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(!/SOCIEDAD ABIERTA|RACIONALISMO CRÍTICO|CISNE NEGRO/.test(banda), 'sin las palabras de la misión de Popper', 'la banda sigue siendo la de Popper');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-atomos-contra-miedo.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja del desmontador, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja del desmontador en blanco', 'falta la hoja del desmontador');
    ok(/Una hoja del desmontador ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/El botiquín de la casa/i.test(txtF), 'la ficha trae el botiquín para recortar', 'falta el botiquín');
    ok(/tetrafármaco/i.test(txtF) && /clinamen/i.test(txtF), 'la ficha trae el tetrafármaco y el clinamen', 'faltan piezas del temario');
    ok(/fragmentos y doxografía/i.test(txtF), 'la ficha declara el transporte de Demócrito', 'la ficha cita a Demócrito sin transporte');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok(/clásico sólido/i.test(txtF) && /divulgación con inflado/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-atomos-contra-miedo"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de los Átomos y los Ídolos/.test(c.textContent));
    ok(!!ruta, 'la Ruta de los Átomos y los Ídolos está en el mapa', 'no aparece la ruta');
    if (ruta) {
      /* Cuentas sacadas del CATÁLOGO, no escritas a mano: las de a mano se
         quedaron viejas al crecer la ruta y la sonda suspendía sin que
         hubiera nada roto (la lección de la Casa Cerrada, en CLAUDE.md). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "atomos").length');
      const totalCat = wa.eval('RUTAS.atomos.etapas');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok(/Átomos contra el miedo/.test(ruta.textContent) && /El hombre máquina/.test(ruta.textContent), 'las etapas 1 y 2 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La frontera de la conciencia/.test(ruta.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La materia «mayor» creció con el Expediente Rojo: ahora son tres. */
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /Átomos contra el miedo/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda átomos etapa 1';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda átomos etapa 1'; }
});
</script>
</body>
</html>
