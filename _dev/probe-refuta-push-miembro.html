<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · refutar push con miembro equivocado</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:340px;height:120px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out">midiendo…</pre>
<script>
const out = document.getElementById('out');
let marco = null;
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* Doble de supabase-js. getSession() tarda RETARDO ms (se inyecta) y
   devuelve SESION_GUARDADA (se inyecta). Cada upsert a push_subscriptions
   se anota con marca de tiempo. */
function doble(retardoMs, sesionGuardada) { return `
window.__push = []; window.__t0 = performance.now();
(function(){
  function cliente(url, key, opts){
    let sesion = ${sesionGuardada};
    const qb = (tabla) => {
      const p = {};
      ['select','insert','update','delete','order','limit','eq','neq','gte','lt','single','not','in','is','filter','range','maybeSingle','match','or','lte','gt','contains','overlaps','ilike','like'].forEach(m => { p[m] = () => p; });
      p.then = (res) => Promise.resolve({ data: [], error: null }).then(res);
      p.upsert = (fila, o) => {
        if (tabla === 'push_subscriptions') {
          window.__push.push({ ms: Math.round(performance.now() - window.__t0),
                               member_id: fila.member_id, nombre: fila.nombre,
                               user_id: ('user_id' in fila) ? fila.user_id : '(AUSENTE)',
                               onConflict: o && o.onConflict,
                               token: sesion ? 'SESION' : 'anon' });
        }
        return p;
      };
      return p;
    };
    return {
      from: (t) => qb(t),
      channel: () => { const ch = { on: () => ch, subscribe: () => ch }; return ch; },
      functions: { invoke: () => Promise.resolve({ data: null, error: null }) },
      removeChannel: () => {},
      auth: {
        getSession: () => new Promise(r => setTimeout(() => r({ data: { session: sesion }, error: null }), ${retardoMs})),
        onAuthStateChange: () => ({ data: { subscription: { unsubscribe(){} } } }),
        signInWithPassword: (cred) => {
          sesion = { access_token: 'TOK', user: { email: cred.email, user_metadata: {} } };
          return Promise.resolve({ data: { session: sesion, user: sesion.user }, error: null });
        },
        signOut: () => { sesion = null; return Promise.resolve({ error: null }); },
        getUser: () => Promise.resolve({ data: { user: sesion && sesion.user }, error: null })
      }
    };
  }
  window.supabase = { createClient: cliente };
})();

/* Notification y PushManager de mentira: permiso YA concedido, que es la
   condicion exacta con la que push.js llama solo a pushSubscribe(). */
window.Notification = { permission: 'granted', requestPermission: () => Promise.resolve('granted') };
Object.defineProperty(navigator, 'serviceWorker', { configurable: true, value: {
  ready: new Promise(r => setTimeout(() => r({ pushManager: {
      getSubscription: () => new Promise(rr => setTimeout(() => rr({
        toJSON: () => ({ endpoint: 'https://fcm/ENDPOINT-TABLETA', keys: { p256dh: 'P', auth: 'A' } })
      }), SW_GET)),
      subscribe: () => Promise.reject(new Error('no procede'))
  } }), SW_READY)),
  register: () => Promise.resolve({}), addEventListener: () => {}, controller: null
} });
window.PushManager = function(){};
`; }

async function correr(titulo, opts) {
  log('══ ' + titulo + ' ══');
  let html = await (await fetch('/index.html')).text();
  const D = doble(opts.retardoSesion, opts.sesionGuardada)
    .replace('SW_GET', opts.swGet).replace('SW_READY', opts.swReady);
  html = html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2"><\/script>/,
                      '<scr' + 'ipt>' + D + '</scr' + 'ipt>');
  html = html.replace(/<head>/i, '<head><base href="/">');

  /* Marco NUEVO en cada prueba: document.open() reutiliza el mismo objeto
     global, y entonces los "const" de la segunda pasada revientan. */
  const viejo = document.getElementById('f');
  const f = document.createElement('iframe');
  f.id = 'f'; f.width = 340; f.height = 120; marco = f;
  viejo.replaceWith(f);
  await new Promise(r => { f.onload = r; f.src = 'about:blank'; });

  /* El estado del aparato: el perfil que quedo guardado la vez pasada. */
  f.contentWindow.localStorage.clear();
  f.contentWindow.localStorage.setItem('faro_v1', JSON.stringify({ currentMember: opts.perfilGuardado, members: {} }));

  const doc = f.contentDocument;
  doc.open(); doc.write(html); doc.close();
  await esperar(2500);
  const w = f.contentWindow;

  log('perfil guardado en el aparato : ' + opts.perfilGuardado);
  log('sesion restaurada al arrancar : ' + JSON.stringify(w.verificarSesion()));
  log('filas escritas en push_subscriptions al arrancar:');
  (w.__push || []).forEach(p => log('   [' + p.ms + ' ms] member_id=' + p.member_id + '  nombre="' + p.nombre +
      '"  user_id=' + p.user_id + '  onConflict=' + p.onConflict + '  [' + p.token + ']'));
  if (!(w.__push || []).length) log('   (ninguna)');

  if (opts.entraComo) {
    const n0 = (w.__push || []).length;
    const ok = await w.iniciarSesion(opts.entraComo, 'clave');
    /* Lo mismo que hace el submit del formulario: aplicarSesion(). */
    const s = w.load(); s.currentMember = w.verificarSesion().user; w.save(s);
    await esperar(1200);
    log('entra a mano como "' + opts.entraComo + '" -> ' + ok + '   verificarSesion()=' + JSON.stringify(w.verificarSesion()));
    log('filas NUEVAS en push_subscriptions despues de entrar: ' + ((w.__push || []).length - n0));
    (w.__push || []).slice(n0).forEach(p => log('   [' + p.ms + ' ms] member_id=' + p.member_id + '  nombre="' + p.nombre + '"'));
  }
  log('');
}

window.addEventListener('load', async () => {
  L.length = 0;

  /* A · La tableta compartida, camino REAL del escenario: no queda sesion
     viva (la anterior cerro sesion o caduco), Angelly abre y entra.        */
  await correr('A · sin sesion viva; el perfil guardado es "jael"; entra Angelly',
    { retardoSesion: 40, sesionGuardada: 'null', swReady: 5, swGet: 5,
      perfilGuardado: 'jael', entraComo: 'angelly' });

  /* B · Recarga con sesion viva de Jael y perfil guardado de Angelly:
     aqui es donde la carrera decide. Latencias tipicas de un movil.        */
  await correr('B · sesion viva de "jael" restaurada; perfil guardado "angelly" (carrera)',
    { retardoSesion: 40, sesionGuardada: "{ user: { email: 'jael@faro.local', user_metadata: {} } }",
      swReady: 5, swGet: 5, perfilGuardado: 'angelly', entraComo: null });

  /* C · Misma recarga, pero el service worker responde antes que la sesion
     (arranque en frio del SW = lento; sesion en localStorage = rapida).     */
  await correr('C · igual que B pero la sesion tarda 5 ms y el SW 40 ms',
    { retardoSesion: 5, sesionGuardada: "{ user: { email: 'jael@faro.local', user_metadata: {} } }",
      swReady: 20, swGet: 20, perfilGuardado: 'angelly', entraComo: null });

  /* D · El nombre: lo que escribe el camino de reserva vs lo que escribe la
     sesion, para Evelyn.                                                    */
  await correr('D · Evelyn: nombre por el camino de reserva',
    { retardoSesion: 40, sesionGuardada: 'null', swReady: 5, swGet: 5,
      perfilGuardado: 'evelyn', entraComo: 'evelyn' });

  log('══ nombres declarados ══');
  log('app.js MEMBERS.short  evelyn = ' + JSON.stringify(marco.contentWindow.MEMBERS.find(m=>m.id==='evelyn').short));
  log('auth.js MIEMBROS      evelyn = ' + JSON.stringify(marco.contentWindow.MIEMBROS.evelyn.nombre));
  log('¿iguales? ' + (marco.contentWindow.MEMBERS.find(m=>m.id==='evelyn').short === marco.contentWindow.MIEMBROS.evelyn.nombre));
  log('josue: ' + JSON.stringify(marco.contentWindow.MEMBERS.find(m=>m.id==='josue').short) + ' vs ' + JSON.stringify(marco.contentWindow.MIEMBROS.josue.nombre));
});
</script>
</body></html>
