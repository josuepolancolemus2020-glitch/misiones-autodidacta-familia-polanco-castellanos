<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Cuánto cabe de verdad en una carta</title>
<style>
  /* Los mismos márgenes que declara fichas/css/ficha.css */
  @page { size: letter; margin: 11mm 11mm; }
  body { margin: 0; font-family: system-ui; }
  .bloque { border: 2px solid #333; box-sizing: border-box; padding: 4mm; font-size: 14pt; }
</style>
</head>
<body>
<script>
/* Imprime UN bloque del alto que se le pida y nada más. Si al llevarlo a PDF
   sale en una hoja, ese alto cabe; si sale en dos, se pasó. Así se averigua el
   alto útil real sin depender de suposiciones, que es justo lo que estaba mal:
   el medidor daba por bueno 226 mm (carta menos una pulgada por lado) cuando
   la hoja declara márgenes de 11 mm y por lo tanto caben unos 257.

   Uso:  /_dev/probe-alto-util.html?h=257   y contar las páginas del PDF. */
const h = new URLSearchParams(location.search).get('h') || '257';
document.write(`<div class="bloque" style="height:${h}mm">bloque de ${h} mm</div>`);
/* No aprueba ni suspende: es un instrumento de medida, el veredicto lo da quien cuenta las páginas del PDF. */
document.title = 'INSTRUMENTO · alto útil de una carta';
</script>
</body>
</html>
