<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta de la Brújula Torcida (Sesgo cognitivo):
   bancos, laboratorio, los ocho casos, el guion, las seis lecturas con sus
   preguntas dentro, el marcador, la impresión, la ficha y la ruta en el mapa.

   Esta materia tiene DOS reglas propias que ninguna otra sonda vigila, y son
   las que aquí se miran con más saña, porque son justo lo que la etapa enseña
   a cazar y lo que una misión sobre sesgos podría estar haciendo ella misma:

     1. En ninguna parte de la página se vende que CONOCER el sesgo inmunice.
        No lo sostiene la evidencia (Pronin, Lin y Ross, 2002; West, Meserve y
        Stanovich, 2012) y una misión que lo prometiera estaría inflando su
        propia fuente delante del alumno. Se comprueba sobre el texto: cada
        aparición de «inmuniza», «vacuna» o «protege» tiene que llevar su
        negación al lado.
     2. El problema de Linda va SIEMPRE con la objeción de Hertwig y Gigerenzer
        (1999). El resultado de 1983 se reproduce; su interpretación está
        cuestionada, y citarlo pelado sería exactamente la media verdad de
        manual que esta etapa enseña a etiquetar.

   La comprobación de Linda mira las cinco secciones de PROSA (Aprende,
   Estructura, Casos, Guion y Lecturas) y no la página entera a propósito: los
   widgets pintan rótulos de una línea («Problema de Linda», «Lo particular
   parece más probable que lo general») que son fichas de un juego de
   clasificar, no el relato del estudio, y exigirles la objeción al lado
   convertiría el guardián en ruido. Donde el problema se CUENTA (y eso se
   detecta porque cerca aparecen «cajera», «feminista», «conjunción» o «más
   probable»), la objeción tiene que estar.

   La tercera trampa propia de esta misión es el laboratorio: las cuatro llaves
   heredadas del molde (esperado, paradoja, utilidad, ruina) NO se parecen a
   los rótulos visibles, y eso está puesto a propósito, con su comentario en el
   HTML. Aquí se comprueba que llave y rótulo casen por pares.

   El guion largo se busca con su escape (\u2014) y no con el carácter
   puesto: una sonda que llevara el carácter dentro se suspendería sola.   */
const RAYA = /\u2014/;
const RAYAS_G = new RegExp('\\u2014', 'g');
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

/* Selecciona por posición GLOBAL del párrafo: al pintar marcas el texto queda
   repartido en varios nodos y firstChild ya no vale. */
function seleccionar(d, w, parr, a, b) {
  const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
  let off = 0, ini = null, fin = null;
  while (paseo.nextNode()) {
    const n = paseo.currentNode, len = n.nodeValue.length;
    if (!ini && a >= off && a <= off + len) ini = [n, a - off];
    if (!fin && b >= off && b <= off + len) fin = [n, b - off];
    off += len;
  }
  if (!ini || !fin) return false;
  const r = d.createRange();
  r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
  const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
  d.dispatchEvent(new w.Event('selectionchange'));
  return true;
}

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  const cerrar = () => { log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda brújula etapa 1'; };
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de la Br[úu]jula Torcida · Etapa 1 de 6/.test(d.body.textContent), 'se presenta como etapa 1 de 6', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se levantó desde una misión de la Apuesta Medida, y su
       temario (los árboles, Raiffa, San Petersburgo) no pinta nada aquí. Popper
       NO se prohíbe: Recursos lo enlaza a propósito, porque la crisis de
       replicación es falsacionismo en vivo. */
    ok(!/Bernoulli|Montmort|Allais|San Petersburgo|Raiffa|Schlaifer|Zermelo|Apuesta Medida|[áa]rbol antes del salto|Hebb|metr[óo]nomo/i.test(d.body.textContent),
       'sin restos de la misión de la que se copió', 'queda temario del molde en la página');
    ok(!RAYA.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(RAYAS_G) || []).length + ' guiones largos');
    /* La banda del encabezado vive en un ::before y ninguna sonda la miraba:
       por eso se arrastró una vez de misión en misión (norma 5-ter). */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content;
    ok(/REPRESENTATIVIDAD/.test(banda) && !/BERNOULLI/.test(banda) && !/RAIFFA/.test(banda) && !/FALSACI/.test(banda),
       'la banda del encabezado es de esta etapa (REPRESENTATIVIDAD, sin BERNOULLI, RAIFFA ni FALSACIÓN)', 'la banda dice: ' + banda.slice(0, 70));
    /* El arranque completo: el panel de logros se pinta al iniciar, y la
       cuenta sale del propio catálogo de logros, no escrita a mano. */
    const logrosCat = dentro('Object.keys(ACHIEVEMENTS).length');
    ok(logrosCat > 0 && d.querySelectorAll('#achList .ach-item').length === logrosCat,
       'el panel de logros arrancó pintado, con sus ' + logrosCat + ' logros', 'logros pintados: ' + d.querySelectorAll('#achList .ach-item').length + ' de ' + logrosCat);
    ok(d.querySelectorAll('#timelineTrack .tl-node').length === dentro('timelineData.length'),
       'y la línea de tiempo arrancó con sus ' + dentro('timelineData.length') + ' fechas', 'hitos pintados: ' + d.querySelectorAll('#timelineTrack .tl-node').length);
    ok((d.getElementById('lab-display').textContent || '').trim().length > 40, 'el laboratorio arrancó con una ficha puesta', 'el laboratorio arrancó vacío');

    log('\n── LA ADVERTENCIA DE ESTA MATERIA (lo que no se puede vender) ──');
    const cuerpo = d.body.textContent.replace(/\s+/g, ' ');
    ok(/conocer el sesgo\s*<?\/?strong>?\s*no inmuniza|no inmuniza/i.test(cuerpo), 'la página dice a la cara que conocer el sesgo no inmuniza', 'no aparece la mala noticia de la materia');
    /* El guardián: ninguna aparición de la promesa puede quedar suelta. Se
       exige una negación (o la etiqueta de inflado) en su vecindad, que es lo
       que separa «no inmuniza» de «inmuniza». */
    let promesas = 0, sueltas = 0, ejemplo = '';
    const reP = /inmuniz\w*|vacun\w*|protege\w*/gi; let mP;
    while ((mP = reP.exec(cuerpo)) !== null) {
      promesas++;
      const cerca = cuerpo.slice(Math.max(0, mP.index - 200), mP.index + 200);
      if (!/\bno\b|poqu[íi]sim|muy poco|inflado|vendiera|prometa|nunca|apenas|tachada/i.test(cerca)) { sueltas++; if (!ejemplo) ejemplo = cerca.slice(0, 120); }
    }
    ok(promesas >= 5 && sueltas === 0, 'las ' + promesas + ' menciones a inmunizar, vacunar o proteger van todas negadas o etiquetadas', 'hay ' + sueltas + ' promesa(s) suelta(s): ' + ejemplo);
    ok(/Pronin/.test(cuerpo) && /2002/.test(cuerpo), 'el punto ciego del sesgo va con Pronin, Lin y Ross (2002)', 'falta Pronin (2002)');
    ok(/West/.test(cuerpo) && /Stanovich/.test(cuerpo) && /2012/.test(cuerpo), 'y el remate incómodo con West, Meserve y Stanovich (2012)', 'falta West y Stanovich (2012)');
    ok(/procedimiento/i.test(cuerpo) && /ambiente/i.test(cuerpo), 'lo que sí se propone es cambiar el procedimiento y el ambiente', 'no se propone la única palanca con respaldo');
    /* El problema de Linda, SIEMPRE con su objeción de 1999. Solo se mide donde
       el problema se cuenta, no donde su nombre es el rótulo de una ficha. */
    const prosa5 = ['s-aprende', 's-estructura', 's-casos', 's-guion', 's-lecturas']
      .map(id => (d.getElementById(id) || {}).textContent || '').join(' ').replace(/\s+/g, ' ');
    let contadas = 0, peladas = 0, muestra = '';
    const reL = /Linda/g; let mL;
    while ((mL = reL.exec(prosa5)) !== null) {
      const cerca = prosa5.slice(Math.max(0, mL.index - 350), mL.index + 350);
      if (!/cajera|feminista|conjunci[óo]n|m[áa]s probable/i.test(cerca)) continue;
      contadas++;
      const ancho = prosa5.slice(Math.max(0, mL.index - 1100), mL.index + 1100);
      if (!/Hertwig|Gigerenzer|1999/.test(ancho)) { peladas++; if (!muestra) muestra = cerca.slice(0, 120); }
    }
    ok(contadas >= 4 && peladas === 0, 'las ' + contadas + ' veces que se cuenta el problema de Linda llevan al lado la objeción de Hertwig y Gigerenzer (1999)', 'hay ' + peladas + ' vez(ces) sin la objeción: ' + muestra);
    ok(/cl[áa]sico cuestionado en su interpretaci[óo]n/i.test(cuerpo), 'y 1983 se cita con su etiqueta de estatus, «clásico cuestionado en su interpretación»', 'el estudio de 1983 va sin etiqueta de estatus');

    log('\n── LA REGLA DEL ESTATUS Y EL CONCEPTO ──');
    const t0 = cuerpo;
    ok(/Tversky/.test(t0) && /Kahneman/.test(t0) && /Judgment under Uncertainty/.test(t0) && /1974/.test(t0),
       'el artículo de 1974 aparece con su título y sus autores', 'falta «Judgment under Uncertainty» (1974)');
    ok(/Science/.test(t0) && /27 de septiembre de 1974/.test(t0), 'con su revista y su fecha exacta', 'el artículo de 1974 va sin revista ni fecha');
    ok(/cl[áa]sico s[óo]lido y fundacional/i.test(t0), 'y con su etiqueta de estatus', 'el artículo fundacional va sin etiqueta');
    ok(/representatividad/i.test(t0) && /disponibilidad/i.test(t0) && /anclaje/i.test(t0), 'las tres máquinas se nombran', 'faltan las tres heurísticas');
    ok(/gatillo/i.test(t0) && /modo de fallo/i.test(t0), 'cada una con su gatillo y su modo de fallo', 'faltan el gatillo y el modo de fallo');
    ok(/tasa base/i.test(t0), 'la tasa base, que es lo que el parecido pisa', 'falta la tasa base');
    ok(/rueda de la fortuna/i.test(t0) && /65/.test(t0), 'la rueda trucada del artículo de 1974', 'falta el experimento de la rueda');
    ok(/frecuencias naturales/i.test(t0), 'las frecuencias naturales, la herramienta que sí funciona', 'faltan las frecuencias naturales');
    ok(/regresi[óo]n a la media/i.test(t0) && /instructores de vuelo/i.test(t0), 'y la regresión a la media con los instructores de vuelo', 'falta la regresión a la media bien contada');
    ok(/Wald/.test(t0) && /1943/.test(t0), 'el sesgo del superviviente con Wald y su año', 'falta Abraham Wald (1943)');
    ok(/Northcraft/.test(t0) && /1987/.test(t0), 'y el anclaje de campo con Northcraft y Neale (1987)', 'falta Northcraft y Neale (1987)');
    ok(/lempira/i.test(t0) || /L \d/.test(t0), 'los números van en lempiras (norma 3)', 'no hay cifras en lempiras');

    log('\n── LOS OCHO CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos').textContent.replace(/\s+/g, ' ');
    ok((casos.match(/Caso \d/g) || []).length === 8, 'los ocho casos están', 'casos: ' + (casos.match(/Caso \d/g) || []).length);
    ok(/M\.E\.T\.A\.S/.test(casos), 'y salen de este proyecto', 'los casos no hablan del proyecto');
    ok(/L \d/.test(casos), 'con sus cifras en lempiras', 'los casos van sin lempiras');
    /* El corazón de la etapa dentro de los casos: derivar el juicio hasta su
       máquina, y salir con un procedimiento escrito, no con un aviso. */
    ok(/parecido|se parece|retrato/i.test(casos) && /recuerd|memoria|vívid|vivid/i.test(casos) && /cifra/i.test(casos), 'las tres máquinas trabajan dentro de los casos', 'los casos no usan las tres máquinas');
    ok(/procedimiento/i.test(casos), 'y cada caso termina en un procedimiento, no en un aviso', 'ningún caso cambia el procedimiento');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const g = d.getElementById('s-guion').textContent.replace(/\s+/g, ' ');
    ok((g.match(/Escena \d/g) || []).length === 7, 'las siete escenas', 'escenas: ' + (g.match(/Escena \d/g) || []).length);
    ok(/VOZ/.test(g) && /IMAGEN:/.test(g) && /TEXTO EN PANTALLA:/.test(g), 'cada escena lleva VOZ, IMAGEN y TEXTO', 'faltan las tres pistas');
    ok(/gancho en fr[íi]o/i.test(g), 'el gancho en frío', 'falta el gancho');
    ok(/objeci[óo]n del p[úu]blico/i.test(g), 'la objeción del público, concedida y contestada', 'falta la objeción');
    ok(/Tres atajos generan el zool[óo]gico/.test(g), 'y el cierre nombra la misión', 'el cierre no nombra la misión');

    log('\n── LAS SEIS LECTURAS (normas 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    const tl = lect.textContent.replace(/\s+/g, ' ');
    const claves = ['borges', 'cervantes', 'harari', 'entrevista', 'gala', 'debate'];
    ok(claves.every(k => !!d.getElementById('lect-' + k)), 'las seis tarjetas están, con sus ids',
       'faltan: ' + claves.filter(k => !d.getElementById('lect-' + k)).join(', '));
    ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'y no hay ninguna de más',
       'tarjetas: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
    ok(claves.every(k => !!d.querySelector('#lect-' + k + ' .lect-nota')), 'cada una con su nota de estatus', 'alguna tarjeta va sin lect-nota');
    ok(/Seis lecturas/i.test(tl) && /seis voces/i.test(tl), 'la tarjeta de entrada anuncia seis', 'la entrada no anuncia las seis voces');
    ok(/Cada lectura trae sus propias preguntas/i.test(tl) && /plegadas/i.test(tl),
       'y avisa de las preguntas de cada lectura y del plegado', 'la entrada no explica las preguntas ni el plegado');
    ok(/ejercicios? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl),
       'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
    /* La etiqueta tiene que separar los dos estatus: los cinco primeros son
       pastiche y el sexto es un careo que no imita a nadie. */
    ok(/cinco primeros/i.test(tl), 'la etiqueta distingue a los cinco primeros', 'la etiqueta mete las seis en el mismo saco');
    ok(/sexto/i.test(tl) && /careo/i.test(tl), 'y nombra el sexto como careo', 'la etiqueta no nombra el careo');
    ok(/papeles/i.test(tl) && /no personas/i.test(tl), 'y dice que el careo firma con papeles', 'la etiqueta no dice cómo firma sus turnos el careo');
    ok(/nunca ocurrieron/i.test(tl), 'y que los encuentros de las entrevistas nunca ocurrieron', 'falta la declaración de ficción');
    /* La advertencia de la materia también dentro de la sección de lecturas:
       ninguna de las seis puede vender la inmunidad. */
    ok(/inmunice|inmuniza/i.test(tl) && /con su cr[íi]tica/i.test(tl), 'la sección declara que ninguna de las seis vende la inmunidad y que Linda va con su crítica', 'la sección de lecturas no repite el aviso de la materia');
    ok(/El adivinador de oficios/.test(tl), 'el cuento a la manera de Borges', 'falta el cuento');
    ok(/ventera/.test(tl) && /bueyes/.test(tl), 'el capítulo cervantino, con su venta', 'falta el capítulo');
    ok(/Tres atajos y un zool[óo]gico/.test(tl), 'el ensayo a la manera de Harari', 'falta el ensayo');
    ok(/Punset/.test(tl) && /Redes/.test(tl), 'la entrevista, con las señas reales del entrevistador', 'la entrevista no declara quién es Punset');
    ok(/Quintero/.test(tl) && /Gala/.test(tl) && /Loco de la Colina/i.test(tl), 'la conversación del Loco de la Colina', 'falta la conversación');

    log('\n── LA ENTREVISTA IMAGINADA, Y SU CUIDADO PROPIO ──');
    const entr = d.getElementById('lect-entrevista');
    const nEntr = (entr.querySelector('.lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nEntr), 'la entrevista se declara IMAGINADA, en mayúsculas y a la vista', 'la entrevista no se declara imaginada');
    ok(/nunca ocurri/i.test(nEntr) && /1996/.test(nEntr), 'y dice por qué no pudo ocurrir: Tversky murió en 1996', 'no explica que el encuentro era imposible');
    ok(/entrevistas imposibles/i.test(nEntr), 'con el género al que se acoge, el de las entrevistas imposibles', 'no declara el género de la pieza');
    /* El cuidado epistémico propio de ESTA misión: la objeción de 1999 es
       posterior a la muerte del entrevistado, así que la respuesta que se le
       pone en la boca se declara invención de la casa. Sin esto, la lectura
       estaría fabricando una postura documentada de un muerto, que es justo la
       fuente inflada que la etapa enseña a cazar. */
    ok(/1999/.test(nEntr) && /Hertwig/.test(nEntr), 'la nota avisa de que la objeción de Hertwig y Gigerenzer es de 1999', 'la nota no sitúa la objeción de 1999');
    ok(/invenci[óo]n de la casa/i.test(nEntr) && /no una posici[óo]n documentada/i.test(nEntr),
       'y declara que la respuesta atribuida a Tversky sobre esa objeción es invención de la casa', 'no declara como invención la respuesta atribuida a Tversky');
    ok(/PUNSET\./.test(entr.textContent) && /TVERSKY\./.test(entr.textContent), 'los turnos se firman con el nombre en mayúsculas y punto (sin raya de diálogo)', 'los turnos de la entrevista no se firman al estilo de la casa');
    const nGala = (d.querySelector('#lect-gala .lect-nota') || {}).textContent || '';
    ok(/IMAGINADA/.test(nGala) && /nunca|no ocurri/i.test(nGala), 'la conversación de Quintero y Gala también se declara imaginada', 'la conversación no se declara imaginada');
    ok(/\(silencio\)/.test(d.getElementById('lect-gala').textContent), 'y los silencios de Quintero van escritos como acotación', 'la conversación va sin los silencios');

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    const careo = d.getElementById('lect-debate');
    const tc = careo.textContent.replace(/\s+/g, ' ');
    const nota = (careo.querySelector('.lect-nota') || {}).textContent || '';
    /* Los turnos los firman los PAPELES en mayúscula: es lo que permite que el
       careo enfrente a gente viva sin ponerle una palabra en la boca a nadie. */
    ok(/MODERACI[ÓO]N\./.test(tc), 'los turnos de moderación firman en mayúscula', 'no hay turnos de MODERACIÓN');
    ok(/LA DEFENSA\./.test(tc) && /LA OBJECI[ÓO]N\./.test(tc), 'y los de la defensa y la objeción', 'faltan los papeles de defensa y objeción');
    ok(!/Ejercicio de estilo de la casa/i.test(nota), 'el careo NO lleva la etiqueta del pastiche', 'al careo le pusieron etiqueta de pastiche');
    ok(/palabras inventadas en boca de nadie/i.test(nota), 'y su nota declara que no se le pone palabra a nadie', 'la nota del careo no lo declara');
    ok(/mejor versi[óo]n/i.test(nota), 'y que cada postura va en su mejor versión (regla del acero)', 'la nota no declara la regla del acero');
    /* Las seis partes obligatorias, en orden. Se miden con las frases de los
       turnos y no con la palabra suelta: «réplicas» y «terreno común» aparecen
       antes en la nota de la tarjeta, y con la palabra suelta el orden saldría
       falso. */
    ok(/La pregunta en disputa, una sola/.test(tc), '1. la pregunta en disputa', 'falta la pregunta en disputa');
    ok(/Las r[ée]plicas, cruzadas/.test(tc), '4. las réplicas cruzadas', 'faltan las réplicas');
    ok(/El terreno com[úu]n, que es m[áa]s ancho/.test(tc), '5. el terreno común', 'falta el terreno común');
    ok(/el dato que lo resolver[íi]a/.test(tc), '6. y qué dato lo resolvería', 'el careo no dice qué dato lo resolvería');
    const i1 = tc.indexOf('La pregunta en disputa, una sola');
    const i2 = tc.indexOf('LA DEFENSA.');
    const i3 = tc.indexOf('LA OBJECIÓN.');
    const i4 = tc.indexOf('Las réplicas, cruzadas');
    const i5 = tc.indexOf('El terreno común, que es más ancho');
    const i6 = tc.indexOf('Lo que sigue en disputa');
    ok(i1 >= 0 && i1 < i2 && i2 < i3 && i3 < i4 && i4 < i5 && i5 < i6,
       'y las seis partes van en orden: pregunta, postura A, postura B, réplicas, terreno común y lo que sigue', 'las partes del careo están desordenadas');
    /* Las anclas reales de ESTE careo, leídas de la propia tarjeta: la disputa
       existe, tiene dos lados publicados y cada uno va con revista y año. */
    ok(/Tversky y Kahneman/.test(tc) && /Science/.test(tc) && /1974/.test(tc), 'la defensa se apoya en Tversky y Kahneman («Science», 1974)', 'la defensa no lleva su fuente fundacional');
    ok(/Extensional versus Intuitive Reasoning/.test(tc) && /Psychological Review/.test(tc) && /1983/.test(tc),
       'y en el problema de Linda con su revista y su año (1983)', 'falta el trabajo de 1983 con revista');
    ok(/Gigerenzer y Hoffrage/.test(tc) && /1995/.test(tc) && /frecuencias naturales/.test(tc),

    log('\n── LA FICHA (normas 6 y 5-octies) ──');
    let fichaOk = false;
    try { const rf = await fetch('/fichas/ficha-brujula-tres-atajos.html'); fichaOk = rf.ok; } catch (e) {}
    ok(fichaOk, 'la ficha responde', 'la ficha no responde por HTTP');
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:900px;height:600px;border:0;position:absolute;left:-9999px;';
    fr.src = '/fichas/ficha-brujula-tres-atajos.html';
    document.body.appendChild(fr);
    await new Promise(r => { fr.onload = r; });
    await esperar(700);
    const fd = fr.contentDocument;
    const txtF = fd.body.textContent.replace(/\s+/g, ' ');
    ok(fd.querySelectorAll('.pagina').length === 10, 'la ficha tiene sus diez páginas', 'páginas: ' + fd.querySelectorAll('.pagina').length);
    ok(/Tres atajos generan el zool[óo]gico/.test(txtF) && /Br[úu]jula Torcida/.test(txtF), 'y es la de esta etapa', 'la ficha no es de esta misión');
    ok(!/Bernoulli|San Petersburgo|Raiffa|Hebb|neurona/i.test(txtF), 'sin restos de la ficha de la que se copió', 'la ficha arrastra el temario del molde');
    ok(!RAYA.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok(/Pauta de los ejercicios/i.test(txtF), 'con la pauta de los ejercicios', 'la ficha no trae pauta');
    ok(/tasa base/i.test(txtF) && /frecuencias naturales/i.test(txtF), 'la tasa base y las frecuencias naturales trabajan también en el papel', 'la ficha no enseña la cuenta que compensa');
    ok(/no inmuniza/i.test(txtF), 'y la mala noticia de la materia viaja impresa', 'la ficha calla que conocer el sesgo no inmuniza');
    ok(/Hertwig/.test(txtF) && /Linda/.test(txtF), 'con el problema de Linda y su objeción juntos', 'la ficha cita Linda sin su objeción');
    ok(/cl[áa]sico cuestionado/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'las fuentes de la ficha van sin etiqueta');
    ok(/lecturas-marcador\.js/.test(fd.documentElement.innerHTML), 'la ficha trae el marcador (norma 5-octies)', 'la ficha no trae el marcador');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-brujula-tres-atajos"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');
    fr.remove();

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => (c.querySelector('.ruta-nombre') || {}).textContent === 'Ruta de la Brújula Torcida');
    ok(!!ruta, 'la Ruta de la Brújula Torcida está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(/Sesgo cognitivo/.test(ruta.textContent), 'con su materia a la vista', 'la tarjeta no dice la materia');
      /* Cuentas del CATÁLOGO, no a mano (la lección de la Casa Cerrada: tres
         sondas suspendieron porque su ruta creció y ellas seguían esperando el
         número viejo). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "brujula").length');
      const totalCat = wa.eval('RUTAS.brujula.etapas');
      ok(ruta.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapa(s) construida(s) ya tocable(s)', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok([...ruta.querySelectorAll('.re-link')].some(a => /Tres atajos generan el zool[óo]gico/.test(a.textContent)),
         'la etapa 1 ya es tocable, con el título de la misión', 'la etapa 1 no sale tocable con su título');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const cards = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(cards.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + cards.length + ' de ' + delMayor);
      const mia = cards.find(c => /Tres atajos generan el zool[óo]gico/.test(c.textContent));
      ok(!!mia, 'y la nueva está entre ellas', 'la misión nueva no sale en la portada');
      ok(mia && /🧭/.test(mia.textContent), 'con su emoji propio', 'la misión sale sin su emoji');
      /* El sello familiar: esta etapa no se publica fuera de la casa, y el
         candado del sello es lo único que lo dice en la portada. Se mira en
         el catálogo Y pintado, porque una cosa sin la otra no protege nada. */
      ok(wa.eval('MISSIONS.find(m=>m.ruta==="brujula"&&m.etapa===1).sello') === 'familiar',
         'el catálogo la marca con el sello familiar', 'la etapa 1 no lleva sello familiar en el catálogo');
      ok(mia && !!mia.querySelector('.mc-sello'), 'y el candado del sello sale pintado en su tarjeta', 'la tarjeta no pinta el candado del sello');
    }
    cerrar();
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); cerrar(); }
});
</script>
</body>
</html>
