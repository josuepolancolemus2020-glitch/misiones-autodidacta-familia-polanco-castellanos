<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Expediente Dorado, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-dorado-dinero-no-compra/dinero-no-compra.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta del Expediente Dorado (Crítica al
   Capitalismo, materia 27 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y SEIS lecturas: las cinco de
   la norma 5-quinquies, con las dos entrevistas y su etiqueta de encuentro
   que NUNCA OCURRIÓ, más el CAREO de la norma 5-nonies) y las TRES BATERÍAS
   repartidas por lectura (30 de comprensión lectora, 12 de completar y 12 de
   análisis complejo: cinco, dos y dos en cada uno de los seis textos), con
   el plegado, la marca de lectura y la impresión comprobados de verdad.

   La REGLA DEL ESTATUS del compendio rige también aquí, y esta etapa mezcla
   filosofía con experimentos, así que se comprueba fuente por fuente:
   Sandel (2012) y Satz (2010) como FILOSOFÍA POLÍTICA CONTEMPORÁNEA, con
   Satz declarada LA MÁS OPERATIVA por sus cuatro parámetros; Anderson
   (1993) como LA BASE FILOSÓFICA; Titmuss (1970) como CLÁSICO FUNDADOR Y
   DISCUTIDO, que NUNCA se cita solo; Arrow (1972) como LA CONTRACRÍTICA
   OBLIGADA y de un premio Nobel; Gneezy y Rustichini (2000) y Frey y
   Oberholzer-Gee (1997) como EXPERIMENTOS DE CAMPO, con Frey y Jegen (2001)
   como la teoría que los ordena; Lacetera, Macis y Slonim (2013), en
   «Science», como DISPUTA EMPÍRICA VIVA, que es el dato que descoloca la
   conclusión bonita de la casa y por eso se exige; Fryer (2011) como
   EXPERIMENTO ALEATORIZADO GRANDE; Roth (2007) como DISEÑO DE MERCADOS con
   su Nobel de 2012; Zelizer (1979) como HISTORIA SOCIAL; y Brennan y
   Jaworski (2015) como EL ACERO DEL BANDO CONTRARIO, que se contesta y no
   se esquiva.

   Cuatro cuidados del compendio se comprueban a máquina porque gobiernan la
   misión. Uno: SON DOS OBJECIONES Y NO UNA, y la asimetría entre ellas (la
   de justicia se puede arreglar; la de corrupción, si vale, vale siempre).
   Dos: la corrupción SE MUESTRA Y NO SE AFIRMA, con qué se pierde, quién lo
   pierde y cómo se notaría. Tres: el modo de fallar es SALTAR DEL ASCO A LA
   PROHIBICIÓN, y contra eso van la hoja del bien y la regla heredada de la
   etapa 2 de que NINGUNA REGLA ES GRATIS, con la factura de prohibir
   escrita también. Cuatro: LAS SALIDAS SON CUATRO Y NO DOS, y la tercera,
   sacar el dinero y diseñar otro mecanismo, es la que casi nadie propone.

   Y el CERO PARTIDISMO HONDUREÑO ACTUAL, con la regla propia de la materia:
   los conflictos vivos del patio entran COMO CATEGORÍA y no como caso con
   nombre propio, que aquí importa doble porque uno de los ocho casos habla
   de comprar votos y comprar sentencias. Por eso la comprobación descuenta
   antes la frase donde se enuncia esa misma regla, que nombra al partido
   justamente para decir que no se le pone etiqueta a ninguno. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Expediente Dorado · Etapa 3 de 7/.test(d.body.textContent), 'se presenta como etapa 3 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 2 de esta misma ruta. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-dorado-gran-fuga"], a[href*="ruta-dorado-fallas-maquina"], a[href*="ruta-atomos-hombre-maquina"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    /* El temario de la etapa 2 no puede quedar como estructura de esta: sus
       piezas propias (la hoja de la falla, la letra pequeña, las cuatro
       fallas) no aparecen ni una vez. Los nombres sueltos de aquella etapa
       sí pueden aparecer, pero SOLO como distractores de los widgets o como
       comparación de método, nunca en la prosa de la misión, y eso se mira
       aparte sobre el archivo, sin lo que el motor pinta. */
    ok(!/hoja de la falla|letra pequeña del teorema|las cuatro fallas|falla dinámica/i.test(cuerpoSinEnlaces),
       'sin las piezas de la etapa 2 (las fallas de la máquina)', 'queda la estructura de la etapa 2 de esta ruta');
    const fuente = await (await fetch('/misiones/ruta-dorado-dinero-no-compra/dinero-no-compra.html')).text();
    ok(!/Pigou|Akerlof|Minsky|Manning|Greenwald|monopsonio|externalidad/i.test(fuente),
       'y en la prosa de la misión no queda ni un nombre de aquel temario', 'queda vocabulario de la etapa 2 en la prosa');
    ok(!/Deaton|McCloskey|Kocka|Hickel|gran enriquecimiento|hoja de la cifra/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la etapa 1 (la gran fuga)', 'queda vocabulario de la etapa 1 de esta ruta');
    ok(!/🔧|📒/.test(cuerpoSinEnlaces), 'sin los emojis de las misiones molde', 'queda el 🔧 o el 📒 de las etapas anteriores fuera de los enlaces');
    ok(!/La Mettrie|brocha gorda|batán|hombre de paja|Holodomor/i.test(cuerpoSinEnlaces),
       'sin restos de otras misiones del arco', 'queda vocabulario de otra misión del Estudio Mayor');
    /* Y lo que SÍ tiene que quedar: las dos etapas anteriores remitidas, que
       son las que vuelven criterio lo que aquí se hace. */
    ok(/etapa 1/i.test(d.body.textContent) && /etapa 2/i.test(d.body.textContent),
       'las etapas 1 y 2 se remiten como lo que sostiene esta pregunta', 'no se remite a las etapas anteriores');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-dorado-gran-fuga"]'),
       'Recursos enlaza la etapa 1 de la ruta', 'falta el enlace a la etapa 1');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-dorado-fallas-maquina"]'),
       'y la etapa 2, que es la que pregunta lo contrario', 'falta el enlace a la etapa 2');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-rojo-acero-juicio"]'),
       'y sigue enlazando el expediente gemelo', 'falta el enlace al expediente gemelo');
    ok(/regla del acero/i.test(d.body.textContent), 'y nombra la regla del acero, que aquí se aplica al bando contrario', 'no se nombra la regla del acero');
    /* La norma 1-bis se comprueba buscando el guion largo, y aquí se escribe
       con su código \u2014 y no tal cual: el grep de antes de publicar cuenta
       apariciones del carácter en el archivo, y una sonda que lo lleve dentro
       se delata a sí misma cada vez que se corre. La expresión es la misma. */
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');
    /* Cero partidismo hondureño actual. Se descuenta antes la frase donde se
       ENUNCIA la regla de selección, que nombra al partido justamente para
       decir que no se le pone etiqueta a ninguno. */
    const sinRegla = d.body.textContent.replace(/no se pone la etiqueta a ning[úu]n funcionario, a ning[úu]n partido ni a nadie en campaña/gi, '')
                                       .replace(/a un funcionario con pleito abierto/gi, '');
    ok(!/\b(partido|diputad|alcalde|candidat)[a-zóí]*\b/i.test(sinRegla),
       'ni un político vivo ni un partido nombrado (cero partidismo actual)', 'aparece un cargo o un partido de la política de hoy');
    ok(/como categoría/i.test(d.body.textContent) && /nunca como caso con nombre/i.test(d.body.textContent),
       'y la regla de selección: los casos del patio entran como categoría', 'falta la regla de selección de esta materia');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Sandel/.test(texto0) && /What Money Can't Buy/.test(texto0) && /2012/.test(texto0),
       'Sandel (2012) con el título de su obra', 'falta Sandel con su obra y su año');
    ok(/Satz/.test(texto0) && /Why Some Things Should Not Be for Sale/.test(texto0) && /2010/.test(texto0),
       'Satz (2010) con el título de su obra', 'falta Satz con su obra y su año');
    ok(/vulnerabilidad/i.test(texto0) && /agencia débil/i.test(texto0) && /daño extremo/i.test(texto0),
       'y sus cuatro parámetros, nombrados uno por uno', 'faltan los cuatro parámetros de Satz');
    ok(/Anderson/.test(texto0) && /Value in Ethics and Economics/.test(texto0) && /1993/.test(texto0),
       'Anderson (1993) con el título de su obra', 'falta Anderson con su obra');
    ok(/Titmuss/.test(texto0) && /The Gift Relationship/.test(texto0) && /1970/.test(texto0),
       'Titmuss (1970) con el título de su obra', 'falta Titmuss con su obra y su año');
    /* La pieza que más fácil se pierde, y la que esta casa exige siempre: la
       contracrítica al lado, aunque la mitad ocultada sea la que conviene. */
    ok(/Arrow/.test(texto0) && /Gifts and Exchanges/.test(texto0) && /1972/.test(texto0),
       'Arrow (1972) con el título de su respuesta', 'falta la contracrítica de Arrow');
    ok(/contracrítica obligada/i.test(texto0), 'y declarada LA CONTRACRÍTICA OBLIGADA', 'no se declara a Arrow como contracrítica obligada');
    ok(/nunca se cita solo|no se cita solo|nunca va sin/i.test(texto0),
       'y la regla de que Titmuss nunca se cita solo', 'no se declara que Titmuss va acompañado');
    ok(/Gneezy/.test(texto0) && /Rustichini/.test(texto0) && /A Fine is a Price/.test(texto0) && /2000/.test(texto0),
       'Gneezy y Rustichini (2000) con el título de su artículo', 'falta el experimento de la guardería con su fuente');
    ok(/Oberholzer-Gee/.test(texto0) && /1997/.test(texto0), 'Frey y Oberholzer-Gee (1997)', 'falta el experimento del pueblo suizo');
    ok(/Jegen/.test(texto0) && /2001/.test(texto0) && /desplazamiento de motivos/i.test(texto0),
       'Frey y Jegen (2001) con el nombre del fenómeno', 'falta la teoría que ordena el desplazamiento');
    ok(/Lacetera/.test(texto0) && /Macis/.test(texto0) && /Slonim/.test(texto0) && /2013/.test(texto0) && /Science/.test(texto0),
       'Lacetera, Macis y Slonim (2013), en «Science», con los tres nombres', 'falta el dato de 2013 que descoloca la conclusión');
    ok(/disputa empírica viva/i.test(texto0), 'y declarada DISPUTA EMPÍRICA VIVA', 'no se declara viva la disputa del desplazamiento');
    ok(/Fryer/.test(texto0) && /2011/.test(texto0) && /insumos/i.test(texto0) && /resultados/i.test(texto0),
       'Fryer (2011) con su hallazgo: insumos contra resultados', 'falta Fryer con lo que midió');
    ok(/Roth/.test(texto0) && /Repugnance as a Constraint on Markets/.test(texto0) && /2007/.test(texto0),
       'Roth (2007) con el título de su artículo', 'falta Roth con su obra');
    ok(/Nobel/.test(texto0) && /2012/.test(texto0) && /Shapley/.test(texto0),
       'y su Nobel de 2012, compartido con Shapley', 'falta el Nobel de Roth con su compañero');
    ok(/Zelizer/.test(texto0) && /Morals and Markets/.test(texto0) && /1979/.test(texto0),
       'Zelizer (1979) con el título de su obra', 'falta Zelizer y la historia del seguro de vida');
    ok(/Brennan/.test(texto0) && /Jaworski/.test(texto0) && /Markets Without Limits/.test(texto0) && /2015/.test(texto0),
       'Brennan y Jaworski (2015) con el título de su libro', 'falta el acero del bando contrario');
    ok(/acero del bando contrario|el acero de esta etapa/i.test(texto0), 'y declarado EL ACERO, que se contesta y no se esquiva', 'no se declara el acero');
    ok(/National Organ Transplant Act/.test(texto0) && /1984/.test(texto0) && /Irán/.test(texto0) && /1988/.test(texto0),
       'el marco legal citado: la ley de 1984 y el sistema iraní desde 1988', 'falta el marco legal de los dos lados');
    ok(/pastiche/i.test(texto0) && /no obra de esos autores/i.test(texto0),
       'y el pastiche de las lecturas declarado', 'el pastiche no se declara en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 16,
       'los cuatro bancos de la evaluación (15, 15, 15 y 16 pares)', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'justicia,corrupcion,motivos,diseno', 'laboratorio con las 4 piezas de la etapa', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 10, 'los 10 momentos del camino del límite', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    /* Las tres baterías de las lecturas (normas 5-quater, 5-quinquies y
       5-nonies). Con seis textos y cinco, dos y dos por texto, quedan en
       30, 12 y 12. */
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos baterías POR
       LECTURA. Sin esto, una lectura se publica con su tarjeta de preguntas
       vacía y nadie se entera hasta que un alumno la abre. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    /* La etiqueta de completar ya no puede agrupar voces («Borges, Harari y
       las dos entrevistas» era veraz cuando las doce vivían juntas al final;
       ahora la oración se pinta DENTRO de una lectura, y una etiqueta
       compuesta manda al alumno a buscar el dato a otro texto). */
    ok(dentro('lectCompletarBank.every(q => ["Borges","Cervantes","Harari","Entrevista","Quintero y Gala","Debate"].indexOf(q.t) >= 0)'),
       'y su etiqueta es una sola voz, no un grupo de lecturas', 'quedó una etiqueta de completar que agrupa varias lecturas');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 200)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis sin pauta');
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada una dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* El número que traían los enunciados era el del banco global («7.»):
       con dos por lectura ese número mentiría. */
    ok(dentro('lectAnalisisBank.every(q => !/^\\s*\\d+\\./.test(q.q))'),
       'y ninguna arrastra el número del banco viejo', 'algún análisis sigue numerado con el número global');
    ok(/faro_dorado_dinero/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/dos objeciones/i.test(texto) && /no son la misma|no es una|y no una/i.test(texto),
       'la idea que ordena la etapa: son dos objeciones y no una', 'falta la idea que ordena la etapa');
    ok(/objeción de justicia/i.test(texto) && /no fue libre/i.test(texto),
       'la objeción de justicia, con su definición de andar por casa', 'falta la objeción de justicia');
    ok(/objeción de corrupción/i.test(texto) && /degrada el bien/i.test(texto),
       'la objeción de corrupción, con la suya', 'falta la objeción de corrupción');
    ok(/se puede arreglar|quitando la urgencia/i.test(texto) && /vale siempre/i.test(texto),
       'y la asimetría que decide todo: una se arregla, la otra vale siempre', 'falta la asimetría entre las dos objeciones');
    ok(/vulnerabilidad/i.test(texto) && /agencia débil/i.test(texto) && /daño extremo a la sociedad/i.test(texto),
       'los cuatro parámetros de Satz, enumerados', 'faltan parámetros de Satz');
    ok(/se encienden por separado|uno por uno/i.test(texto),
       'y la regla de encenderlos por separado, que es lo que permite graduar', 'no se dice que los parámetros se encienden por separado');
    ok(/mostrar|se muestra/i.test(texto) && /qué se pierde/i.test(texto) && /cómo se notaría/i.test(texto),
       'la prueba que exige la corrupción: qué se pierde, quién lo pierde y cómo se notaría', 'falta la prueba de la corrupción');
    ok(/desplazamiento de motivos/i.test(texto), 'el desplazamiento de motivos, con ese nombre', 'falta el desplazamiento de motivos');
    ok(/reemplaza/i.test(texto) && /(no se suma|en vez de sumarse)/i.test(texto),
       'y su mecanismo: el precio no se suma al motivo, lo reemplaza', 'falta el mecanismo del desplazamiento');
    ok(/guardería/i.test(texto) && /retrasos/i.test(texto) && /(subieron|aumentaron)/i.test(texto),
       'el experimento de la guardería, con su resultado al revés', 'falta el experimento de la multa');
    ok(/no volvieron a bajar|no los devolvió|no se vuelve a colgar/i.test(texto),
       'y el detalle que más enseña: quitar la multa no devolvió lo de antes', 'falta el detalle de que la operación no es reversible');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

      /* Las dos entrevistas se imprimen sueltas, y su hoja lleva la etiqueta
         de la ficción con el «nunca ocurrió»: sin esa línea, la fotocopia

      const hent = abiertos[abiertos.length - 1] || '';
      ok(/Cuantas más cosas están en venta, más cuesta ser pobre/.test(hent) && /SANCHÍS/.test(hent) && /SANDEL/.test(hent),
         'la entrevista se imprime con sus dos voces', 'la entrevista no se imprime');
      ok(/Es mi ejemplo favorito de todo lo que le he dicho/.test(hent), 'y hasta su última línea', 'la hoja de la entrevista sale cortada');
      ok(/nunca ocurrió/i.test(hent), 'y con la etiqueta del encuentro que nunca ocurrió', 'la hoja de la entrevista sale sin declarar la ficción');
      ok(/real y comprobable/i.test(hent), 'y con la regla de la erudición real', 'la hoja de la entrevista no trae la regla de los datos reales');
      ok(!/\u2014/.test(hent), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la entrevista trae guiones largos');

      w.imprimirLectura('gala');
      const hga = abiertos[abiertos.length - 1] || '';
      ok(/Las cosas que no estaban en venta/.test(hga) && /QUINTERO/.test(hga) && /GALA/.test(hga),

      ok(/el cuidado no se paga; se tiene/i.test(hga), 'y hasta su aforismo final', 'la hoja de la conversación sale cortada');
      ok(/nunca ocurrió/i.test(hga), 'y con la etiqueta del encuentro que nunca ocurrió', 'la hoja de la conversación sale sin declarar la ficción');
      ok(!/\u2014/.test(hga), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la conversación trae guiones largos');

      /* El careo se imprime con SU etiqueta y sin la del pastiche: no imita

      w.imprimirTodasLasLecturas();
      const h6 = abiertos[abiertos.length - 1] || '';
      ok(/El catálogo de las cosas invendibles/.test(h6) && /hayas/.test(h6) && /La especie que le puso precio a casi todo/.test(h6),
         'las tres primeras lecturas van en el pliego junto', 'el pliego junto pierde alguna de las tres primeras');
      ok(/Cuantas más cosas están en venta, más cuesta ser pobre/.test(h6) && /Las cosas que no estaban en venta/.test(h6),
         'y las dos entrevistas también', 'el pliego junto no trae las dos entrevistas');
      ok(/LA OBJECIÓN\./.test(h6) && /¿Si se puede regalar, se puede vender\?/.test(h6),
         'y el careo cierra el pliego: las seis juntas', 'el pliego junto no trae el careo');
      ok(/Las seis lecturas/.test(h6), 'y el pliego se titula de las seis', 'el pliego no declara que son seis');
      ok((h6.match(/page-break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h6), 'y el pliego declara el pastiche de los cinco primeros', 'el pliego de las seis no declara el pastiche');
      ok(/nunca ocurrieron/i.test(h6), 'y la etiqueta de la ficción de las entrevistas', 'el pliego no declara que los encuentros nunca ocurrieron');
      ok(/careo escrito por la casa sobre una disputa real/i.test(h6), 'y que el sexto es un careo, no un pastiche', 'el pliego mete el careo en el saco del pastiche');

      w.imprimirPreguntasLecturas();
      const hp = abiertos[abiertos.length - 1] || '';
      ok(/I\. Comprensión lectora \(30 preguntas\)/.test(hp) && /II\. Completa la oración \(12 preguntas\)/.test(hp) && /III\. Análisis complejo \(12 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con las 30', 'al pliego de preguntas le falta una sección');
      ok(/con los seis textos delante/i.test(hp) && /nunca ocurrieron/i.test(hp),
         'y declara los seis textos y la ficción de las entrevistas', 'el pliego de preguntas no declara los seis textos');
      ok(/careo/i.test(hp), 'y que el sexto es un careo, con los turnos firmados por papeles', 'el pliego de preguntas no declara el careo');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),
         'con su pauta, y en su propia hoja al final', 'la pauta no queda separada del ejercicio');
      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 120, 'las 30 preguntas salen con sus 120 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 12, 'las 12 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 36, 'las 12 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(!/\u2014/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

      /* Los rótulos de las DOS PRUEBAS IMPRESAS: es ahí donde vive el número
         de etapa, y es el sitio exacto donde el molde arrastró el nombre de
         la misión anterior en misiones pasadas. Se imprimen de verdad y se
         lee el documento. Hay que GENERARLAS primero: printEval se planta si
         no existe _evalPrintData, y entonces se leería el pliego anterior. */
      w.go('s-evaluacion'); await esperar(150);
      w.genEval(); await esperar(250);
      w.genEvalCrit(); await esperar(250);
      w.printEval();
      const he = abiertos[abiertos.length - 1] || '';
      ok(/Lo que el dinero no debe comprar/i.test(he) && /Etapa 3 · Estudio Mayor/.test(he),
         'la evaluación impresa lleva el nombre y la etapa correctos', 'la evaluación impresa trae el rótulo de otra misión');
      ok(!/Etapa [124-9] · Estudio Mayor|Etapa [124-9] de \d|La gran fuga|fallas de la máquina/i.test(he),
         'y no arrastra el rótulo de otra etapa ni de la misión molde', 'la evaluación impresa dice otra etapa');
      ok(!/undefined/.test(he), 'y no imprime undefined', 'la evaluación impresa trae un undefined');
      w.printEvalCrit();
      const hec = abiertos[abiertos.length - 1] || '';
      ok(/El bien sobre la mesa/.test(hec) && /Lo que el dinero no debe comprar/i.test(hec),
         'la competencial impresa lleva su nombre propio', 'la competencial impresa trae el rótulo de otra misión');
      ok(/Etapa 3 · Estudio Mayor/.test(hec), 'y su número de etapa correcto', 'la competencial impresa no dice etapa 3');
      ok(!/Etapa [124-9] · Estudio Mayor|Etapa [124-9] de \d|cifra sobre la mesa|falla sobre la mesa/i.test(hec),
         'y tampoco arrastra el de otra misión', 'la competencial impresa arrastra el rótulo de otra etapa');
      ok(!/undefined/.test(hec), 'y no imprime undefined en ninguna pauta', 'la competencial impresa trae un undefined');
    } finally { w.open = openReal; }

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/objeción de justicia/i.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en la objeción de justicia', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="justicia"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.labShowParte('diseno'); await esperar(150);
    ok(/repugnancia/i.test(d.getElementById('lab-display').textContent) || /restricción/i.test(d.getElementById('lab-display').textContent),
       'y las demás piezas pintan su contenido', 'el laboratorio no pinta la pieza del diseño');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-tareas'); await esperar(150);
    w.genTask(); await esperar(200);
    const tareas = d.getElementById('tgOut').textContent;
    ok(tareas.length > 200, 'el generador de tareas produce su hoja', 'generador vacío');
    ok(!/Deaton|gran fuga|cuatro supuestos del teorema|externalidad/i.test(tareas), 'el ejemplo del generador es de esta misión', 'el generador arrastra el ejemplo de la misión molde');
    w.go('s-aprende'); await esperar(150);
    w.startMethod(); await esperar(1400);
    w.resolveMethod(true); await esperar(200);
    ok(/reemplaz/i.test(d.getElementById('methodResult').textContent) && /vergüenza/i.test(d.getElementById('methodResult').textContent),
       'la simulación es la de esta etapa (la multa de la guardería y el motivo reemplazado)', 'la simulación arrastra la del molde');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'el bien sobre la mesa se genera', 'prueba competencial vacía');
    ok(!/undefined/.test(crit), 'la competencial no pinta undefined', 'hay un undefined en la prueba competencial');
    const rotulos = [d.getElementById('eval-screen-title'), d.getElementById('evalcrit-screen-title'),
                     d.getElementById('evalOut'), d.getElementById('evalCritOut'),
                     d.querySelectorAll('.eval-print-header')[0]].map(x => x.textContent).join(' · ');
    ok(/dinero no debe comprar/i.test(rotulos) && /El bien sobre la mesa/.test(rotulos),
       'los rótulos de prueba llevan el nombre correcto', 'los rótulos no traen el nombre de esta misión');
    ok(!/Etapa [124-9] · Estudio Mayor|Etapa [124-9] de \d/.test(rotulos), 'y no dicen otra etapa', 'los rótulos de pantalla dicen otra etapa');
    ok(!/gran fuga|cifra sobre la mesa|falla sobre la mesa|hombre máquina|mapa de las familias|bisturí|vigía/i.test(rotulos),
       'y no traen el nombre de otra misión', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      ok(casos.querySelectorAll('.ex-box').length === 9, 'y cada caso trae su caja de diagnóstico', 'cajas de diagnóstico: ' + casos.querySelectorAll('.ex-box').length);
      const txt = casos.textContent;
      ['fila', 'sangre', 'riñón', 'techo', 'vecino', 'Jael', 'votos', 'XP']
        .forEach(k => { if (!new RegExp(k.replace(/\./g, '\\.'), 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/L \d|doscientos lempiras|lempiras/i.test(txt), 'los casos traen dinero de aquí', 'los casos no traen lempiras');
      /* Cada caso tiene que nombrar su objeción, que es la destreza de la etapa. */
      ok(/objeción de justicia/i.test(txt) && /corrupción/i.test(txt) && /desplazamiento de motivos/i.test(txt),
         'los casos nombran las objeciones con su nombre', 'los casos no nombran las objeciones');
      ok(/hoja del bien/i.test(txt), 'trae la hoja del bien', 'falta la hoja del bien');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/no aplica|no cabe ninguna|ninguna objeción/i.test(txt),
         'y al menos un caso admite que una objeción no aplica', 'ningún caso admite que la objeción no cabe');
      ok(/lista de espera|el techo sigue goteando|prohibir no crea médicos/i.test(txt),
         'y la factura de prohibir aparece con víctimas concretas', 'los casos no escriben la factura de prohibir');
      /* El giro hacia adentro: uno de los ocho casos audita el proyecto propio. */
      ok(/XP que esta casa|XP que .{0,20}paga/i.test(txt),
         'al menos un caso audita el mecanismo del proyecto propio', 'ningún caso audita el proyecto propio');
      /* Y la regla de selección de esta materia. */
      ok(/como categoría/i.test(txt) && /nunca como caso con nombre/i.test(txt),
         'los casos declaran la regla de selección del patio', 'los casos no declaran la regla de selección');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/fila|riñón|sangre|techo|vecino|Jael|XP|M\.E\.T\.A\.S/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/SON DOS OBJECIONES Y NO UNA/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/JUSTICIA/.test(banda) && /CORRUPCIÓN/.test(banda), 'y trae las dos objeciones', 'la banda no nombra las dos objeciones');
    ok(/SANDEL 2012/.test(banda) && /SATZ 2010/.test(banda), 'y sus dos fuentes con año', 'la banda no nombra a Sandel y a Satz');
    ok(/TITMUSS 1970/.test(banda) && /ARROW 1972/.test(banda), 'y la pareja obligada: Titmuss con Arrow al lado', 'la banda trae a Titmuss sin Arrow');
    ok(/SCIENCE 2013/.test(banda), 'y el dato de 2013 que descoloca la conclusión bonita', 'la banda no trae la disputa viva');
    ok(/ROTH 2007/.test(banda) && /LAS SALIDAS SON CUATRO/.test(banda), 'y la salida de diseño con su autor', 'la banda no trae a Roth ni las cuatro salidas');
    ok(/BRENNAN Y JAWORSKI 2015/.test(banda), 'y el acero del bando contrario', 'la banda no trae el acero');
    ok(/NINGUNA REGLA ES GRATIS/.test(banda), 'y la regla de la factura', 'la banda no nombra la factura de la regla');
    ok(!/PIGOU|COASE|MONOPSONIO|AKERLOF|MINSKY|LETRA PEQUEÑA/.test(banda), 'sin las palabras de la etapa 2 de la ruta', 'la banda sigue siendo la de las fallas de la máquina');
    ok(!/DEATON|LA GRAN FUGA|LA METTRIE|SOCIEDAD ABIERTA|EL ACERO ANTES/.test(banda),
       'sin las palabras de las misiones viejas', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-dorado-dinero-no-compra.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja del bien, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja del bien en blanco', 'falta la hoja del bien');
    ok(/Una hoja del bien ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/avisos al llenarla/i.test(txtF), 'con sus avisos', 'faltan los avisos de la hoja');
    ok(/Cómo se usa, en tres reglas/i.test(txtF), 'y sus tres reglas de uso', 'faltan las reglas de uso de la hoja');
    ok(/Sandel/.test(txtF) && /2012/.test(txtF) && /Satz/.test(txtF) && /2010/.test(txtF), 'la ficha trae a Sandel y a Satz con sus años', 'faltan Sandel o Satz en la ficha');
    ok(/vulnerabilidad/i.test(txtF) && /agencia débil/i.test(txtF) && /daño extremo a la sociedad/i.test(txtF), 'y los cuatro parámetros enumerados', 'faltan los parámetros en la ficha');
    ok(/Titmuss/.test(txtF) && /1970/.test(txtF) && /Arrow/.test(txtF) && /1972/.test(txtF), 'la ficha trae a Titmuss con Arrow al lado', 'la ficha cita a Titmuss sin su contracrítica');
    ok(/Lacetera/.test(txtF) && /2013/.test(txtF) && /Science/.test(txtF), 'y el dato de 2013 que descoloca', 'falta la disputa viva en la ficha');
    ok(/Gneezy/.test(txtF) && /2000/.test(txtF) && /guardería/i.test(txtF), 'la ficha trae el experimento de la multa', 'falta el experimento de la guardería');
    ok(/Roth/.test(txtF) && /2007/.test(txtF) && /2012/.test(txtF) && /Shapley/.test(txtF), 'la ficha trae a Roth con su Nobel y su compañero', 'falta Roth completo en la ficha');
    ok(/Brennan/.test(txtF) && /Jaworski/.test(txtF) && /2015/.test(txtF), 'y el acero del bando contrario', 'falta el acero en la ficha');
    ok(/1984/.test(txtF) && /1988/.test(txtF) && /Irán/.test(txtF), 'y el marco legal de los dos lados', 'falta el marco legal en la ficha');
    ok(/cuatro salidas/i.test(txtF), 'la ficha trae las cuatro salidas', 'faltan las cuatro salidas en la ficha');
    ok(/ninguna regla es gratis|Ninguna regla es gratis/i.test(txtF), 'la ficha trae la regla de la factura', 'falta la regla de la factura');
    ok(/clandestin/i.test(txtF), 'y la factura de prohibir', 'falta la factura de prohibir en la ficha');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok((txtF.match(/<ol\b/g) || []).length === (txtF.match(/<\/ol>/g) || []).length, 'ninguna lista quedó partida entre dos hojas', 'hay listas abiertas sin cerrar');
    ok(/clásico fundador/i.test(txtF) && /contracrítica obligada/i.test(txtF) && /disputa empírica viva/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/Pigou|Akerlof|Minsky|monopsonio|Deaton|McCloskey/i.test(txtF),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos de las etapas anteriores');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-dorado-dinero-no-compra"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Dorado/.test(c.textContent));
    ok(!!ruta, 'la Ruta del Expediente Dorado está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 5, 'con sus cinco primeras etapas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 2, 'y 2 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/La gran fuga/i.test(ruta.textContent) && /Las fallas de la máquina/i.test(ruta.textContent) && /Lo que el dinero no debe comprar/i.test(ruta.textContent),
         'las etapas 1, 2 y 3 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/La palabra gastada/.test(ruta.textContent) && /Visto desde el patio/.test(ruta.textContent), 'las dos siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    /* El expediente gemelo tiene que seguir en pie al lado, porque la Bóveda
       no acepta uno sin el otro y eso vive en el mapa, no solo en el texto. */
    const rutaRoja = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Rojo/.test(c.textContent));
    ok(!!rutaRoja, 'y la Ruta del Expediente Rojo sigue en el mapa, al lado', 'no aparece el expediente gemelo');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /dinero no debe comprar/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /🩸/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda lo que el dinero no debe comprar etapa 3';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda lo que el dinero no debe comprar etapa 3'; }
});
</script>
