<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Videos de M.E.T.A.S</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:640px;border:0;background:#fff;float:right}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>

<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Sonda de la herramienta 🎬 VIDEOS DE M.E.T.A.S.

   Esta herramienta es el extremo de F.A.R.O de un cable cuyo otro
   extremo es la pantalla de un niño de sexto. Lo que se guarda aquí se
   pinta allá DENTRO DEL `src` DE UN IFRAME, así que lo que puede salir
   mal no es «se ve feo»:

   1. QUE POR LA BASE NO PASE NUNCA UNA DIRECCIÓN. Se guarda el
      identificador de once caracteres y nada más. En [A-Za-z0-9_-] no
      hay comillas ni dos puntos: `javascript:` no se puede ni escribir.
      Se le tiran nueve enlaces envenenados y ninguno puede guardarse.

   2. QUE PEGAR UN ENLACE FUNCIONE DE VERDAD, en las cinco formas en
      que YouTube reparte enlaces (watch, youtu.be, shorts, embed,
      live) y con los segundos del `&t=` en sus tres notaciones. Si
      esto falla, el administrador tiene que escribir el identificador a
      mano mirando otra pestaña, que es exactamente el paso donde el
      trabajo se abandona.

   3. QUE UN VIDEO NUEVO NAZCA SIN PUBLICAR. Se guarda, se mira con
      👁 Comprobar y se publica después. Si naciera publicado, un alumno
      se lo encontraría a medio revisar.

   4. QUE RETIRAR NO BORRE LA FILA. Si el video está también escrito en
      el catálogo del repositorio de M.E.T.A.S, borrar aquí lo dejaría
      vivo allá y seguiría en la pantalla del alumno. Se marca 'oculto',
      que es la lápida que la misión sabe leer.

   5. QUE EL REPRODUCTOR DE COMPROBAR SEA EL MISMO QUE EL DE LA MISIÓN.
      Un ensayo con otro reproductor no prueba nada, y lo que se está
      probando es justo lo que no se puede saber de otra forma: si el
      dueño del video permite incrustarlo.

   6. QUE CERRAR COMPROBAR APAGUE EL VIDEO. Si solo se esconde el panel,
      el video sigue sonando detrás.

   7. QUE LA BASE VIEJA SIGA FUNCIONANDO. Mientras no se corra
      metas_videos.sql la tabla no existe: la herramienta tiene que
      decir qué archivo falta —desde una tableta no se adivina— y dejar
      claro que las misiones siguen funcionando con su catálogo.

   Como en las demás sondas: aquí no se lee el código, se ejecuta el
   index.html de verdad con una base de mentira a nivel de fetch. El
   cliente de Supabase es el auténtico. */

const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; let fallos = 0;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ── La base de datos de mentira ────────────────────────────────── */
function nuevaBase(w, opciones){
  const estado = {
    tablas: { metas_videos: [] },
    llamadas: [],
    sinTabla: !!(opciones && opciones.sinTabla),
    proxId: 100,
  };
  const filtra = (filas, params) => filas.filter(fila =>
    [...params.entries()].every(([col, val]) => {
      if (['select','order','limit','offset'].includes(col)) return true;
      if (val.startsWith('eq.')) return String(fila[col]) === val.slice(3);
      return true;
    }));

  w.fetch = async (url, init) => {
    const u = new URL(typeof url === 'string' ? url : url.url, location.origin);

    /* El catálogo público de M.E.T.A.S, que la herramienta trae para
       llenar el desplegable de misiones. Aquí se contesta uno mínimo:
       la sonda corre sin internet. */
    if (/misiones\.js$/.test(u.pathname)) {
      return new Response(
        'const MISSIONS=[' +
        '{id:23,title:"Las Fracciones",subject:"matemáticas",icon:"🍕",grade:"II y III Ciclo",url:"misiones/2y3ciclo-fracciones/fracciones.html"},' +
        '{id:62,title:"Multiplicación y División",subject:"matemáticas",icon:"🍕",grade:"6º grado",url:"misiones/2ciclo-fracciones-multiplicar-dividir/f.html"},' +
        '{id:1,title:"Los Adjetivos",subject:"español",icon:"📝",grade:"II y III Ciclo",url:"misiones/2y3ciclo-adjetivos/a.html"},' +
        '{id:9,title:"La Célula",subject:"naturales",icon:"🔬",grade:"III Ciclo",url:"misiones/2y3ciclo-la-celula/c.html"}];',
        { status: 200, headers: { 'Content-Type': 'application/javascript' } });
    }
    if (!u.pathname.startsWith('/rest/v1/')) return new Response('{}', { status: 200 });

    const tabla  = u.pathname.replace('/rest/v1/', '');
    const params = u.searchParams;
    const metodo = (init && init.method) || 'GET';
    const cuerpo = (init && init.body) ? JSON.parse(init.body) : null;
    estado.llamadas.push({ tabla, metodo, params: u.search, cuerpo });

    const json = (d, s) => new Response(metodo === 'HEAD' ? null : JSON.stringify(d),
      { status: s || 200, headers: { 'Content-Type': 'application/json' } });

    if (estado.sinTabla && tabla === 'metas_videos') {
      return json({ code: '42P01', message: 'relation "public.metas_videos" does not exist' }, 404);
    }

    const filas = estado.tablas[tabla] || [];

    if (metodo === 'GET') {
      let r = filtra(filas, params);
      const orden = params.get('order');
      if (orden) {
        const [col, dir] = orden.split('.');
        r = [...r].sort((a,b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (dir === 'desc' ? -1 : 1));
      }
      return json(r);
    }
    if (metodo === 'POST') {
      /* Como la columna de verdad: el identificador de once o nada.
         Que la base de mentira MUERDA es la mitad de la comprobación 1;
         una que aceptara cualquier cosa haría pasar la sonda con un
         código que en la base de verdad reventaría. */
      const nuevas = (Array.isArray(cuerpo) ? cuerpo : [cuerpo]);
      for (const n of nuevas) {
        if (!/^[A-Za-z0-9_-]{11}$/.test(String(n.yt_id || ''))) {
          return json({ code: '23514', message: 'new row violates check constraint "metas_videos_yt_id_check"' }, 400);
        }
        estado.tablas[tabla].push(Object.assign(
          { id: estado.proxId++, estado: 'borrador', orden: 0, ini: 0, fin: 0,
            titulo: '', nota: '', dura: '', canal: '' }, n));
      }
      return json([]);
    }
    if (metodo === 'PATCH') {
      filtra(filas, params).forEach(fila => Object.assign(fila, cuerpo));
      return json([]);
    }
    return json([]);
  };
  return estado;
}

(async function corre(){
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await esperar(1200);                 // que arranque el index de verdad
  const w = f.contentWindow;

  if (w.eval('typeof initMetasVideos') !== 'function') {
    log('✘ index.html no cargó js/tools/metas-videos.js');
    document.title = 'SUSPENDE · videos de M.E.T.A.S'; return;
  }
  w.eval('window.verificarSesion = () => ({ user: "josue", nombre: "Josué Edmundo" })');

  const base = nuevaBase(w, {});
  const V = w.FaroMetasVideos;
  const g = id => w.document.getElementById(id);

  /* ═══ 1. El identificador de once caracteres ═══ */
  log('── 1. Por la base no pasa nunca una dirección ──');
  const venenos = [
    'javascript:alert(1)',
    'https://evil.com/a" onload="alert(1)',
    'https://www.youtube.com/watch?v=aaaa"aaaaaa',
    'https://www.youtube.com/watch?v=corto',
    'https://www.youtube.com/watch?v=aaaaaaaaaaaaaaaa',
    'java\tscript:alert(1)',
    'JavaScript:alert(1)',
    'data:text/html,<script>alert(1)</scr' + 'ipt>',
    'https://vimeo.com/12345678'
  ];
  ok(venenos.every(v => V.deEnlace(v).yt === ''),
     'los nueve enlaces envenenados no dan identificador',
     'ALGUNO de los enlaces envenenados pasó: ' +
       venenos.filter(v => V.deEnlace(v).yt !== '').join(' | '));
  ok(V.id('aaaaa"aaaaa') === '' && V.id('aaaaa aaaaa') === '' && V.id('javascript:') === '',
     'y mvidId() rebota comillas, espacios y esquemas',
     'mvidId() dejó pasar algo que no son once caracteres del alfabeto bueno');

  /* Y lo que de verdad importa: que la base tampoco lo acepte */
  const antes = base.tablas.metas_videos.length;
  await w.eval('_mvidMision = "2y3ciclo-fracciones"');
  const r = await w.eval(`(async () => {
    const { error } = await _sb.from('metas_videos').insert({
      mision: '2y3ciclo-fracciones', vid: 'v-malo',
      yt_id: 'https://x.com/a" onload="alert(1)'
    });
    return !!error;
  })()`);
  ok(r === true && base.tablas.metas_videos.length === antes,
     'y si alguien lo intentara por debajo, la columna lo rebota',
     'la base ACEPTÓ una dirección en la columna del identificador');

  /* ═══ 2. Pegar un enlace ═══ */
  log('');
  log('── 2. Pegar un enlace, en las cinco formas de YouTube ──');
  const ID = 'dQw4w9WgXcQ';
  const formas = {
    'watch':      'https://www.youtube.com/watch?v=' + ID,
    'youtu.be':   'https://youtu.be/' + ID,
    'shorts':     'https://www.youtube.com/shorts/' + ID,
    'embed':      'https://www.youtube-nocookie.com/embed/' + ID,
    'móvil':      'https://m.youtube.com/watch?v=' + ID + '&feature=share',
    'el id solo': ID,
  };
  Object.entries(formas).forEach(([nombre, u]) =>
    ok(V.deEnlace(u).yt === ID, 'reconoce la forma «' + nombre + '»',
       'NO reconoce la forma «' + nombre + '»: ' + u));

  ok(V.deEnlace('https://www.youtube.com/watch?v=' + ID + '&t=90').ini === 90 &&
     V.deEnlace('https://www.youtube.com/watch?v=' + ID + '&t=90s').ini === 90 &&
     V.deEnlace('https://www.youtube.com/watch?v=' + ID + '&t=1m30s').ini === 90,
     'y saca los segundos del &t= en sus tres notaciones (90, 90s, 1m30s)',
     'los segundos del &t= no se leen bien');
  ok(V.segundos('999999') === 0 && V.segundos('-5') === 0,
     'los segundos absurdos se descartan (el mismo tope que el check)',
     'un segundo absurdo pasaría a la columna');

  /* ═══ 3. Un video nuevo nace SIN publicar ═══ */
  log('');
  log('── 3. Un video nuevo nace sin publicar ──');
  await w.eval('initMetasVideos()');
  await esperar(400);
  w.eval('_mvidMision = "2y3ciclo-fracciones"; mvidAbrirForm(null)');
  g('mvid-f-enlace').value = 'https://www.youtube.com/watch?v=' + ID + '&t=45';
  g('mvid-f-titulo').value = '¿Qué es una fracción?';
  g('mvid-f-nota').value = 'Míralo antes del Quiz.';
  await w.eval('mvidGuardar()');
  await esperar(400);

  const guardado = base.tablas.metas_videos[base.tablas.metas_videos.length - 1];
  ok(!!guardado, 'el video se guardó', 'el video NO se guardó');
  if (guardado) {
    ok(guardado.yt_id === ID, 'con el identificador de once sacado del enlace',
       'guardó otra cosa en yt_id: ' + guardado.yt_id);
    ok(!/^https?:/.test(guardado.yt_id), 'y NO la dirección',
       'guardó una dirección entera');
    ok(guardado.estado === 'borrador',
       'y nace SIN publicar: ningún alumno se lo encuentra a medio revisar',
       'nació publicado: estado = ' + guardado.estado);
    ok(guardado.ini === 45, 'los segundos del enlace llegaron al recorte',
       'los segundos del enlace se perdieron');
    ok(!!guardado.vid, 'y lleva su propio identificador, que es la llave con el catálogo',
       'no lleva vid: no se podría corregir desde la nube un video del repositorio');
  }

  /* ═══ 4. Retirar NO borra ═══ */
  log('');
  log('── 4. Retirar no borra la fila ──');
  const n0 = base.tablas.metas_videos.length;
  await w.eval('initMetasVideos()'); await esperar(300);
  await w.eval(`mvidPublicar(_mvidCache.find(v => v.mision === '2y3ciclo-fracciones'), 'publicado')`);
  await esperar(300);
  ok(base.tablas.metas_videos.some(v => v.estado === 'publicado'),
     'publicar lo pone visible', 'publicar no cambió el estado');
  await w.eval('initMetasVideos()'); await esperar(300);
  await w.eval(`mvidPublicar(_mvidCache.find(v => v.mision === '2y3ciclo-fracciones'), 'oculto')`);
  await esperar(300);
  ok(base.tablas.metas_videos.length === n0,
     'retirar NO borra la fila: se queda como lápida',
     'retirar borró la fila; un video escrito en el catálogo resucitaría en la pantalla del alumno');
  ok(base.tablas.metas_videos.some(v => v.estado === 'oculto'),
     'y queda marcada como retirada, que es lo que la misión sabe leer',
     'la fila no quedó marcada como oculta');
  const borrados = base.llamadas.filter(l => l.metodo === 'DELETE');
  ok(borrados.length === 0, 'y en toda la sesión no se mandó ni un DELETE',
     'se mandó un DELETE: ' + borrados.length);

  /* ═══ 5 y 6. Comprobar ═══ */
  log('');
  log('── 5. Comprobar usa el mismo reproductor que la misión ──');
  await w.eval('initMetasVideos()'); await esperar(300);
  await w.eval(`mvidComprobar(_mvidCache.find(v => v.mision === '2y3ciclo-fracciones'))`);
  await esperar(300);
  const marco = g('mvid-ver-caja');
  const iframe = marco && marco.querySelector('iframe');
  ok(!!iframe, 'se abre un reproductor', 'no se abrió ningún reproductor');
  if (iframe) {
    const src = iframe.getAttribute('src');
    ok(src.startsWith('https://www.youtube-nocookie.com/embed/' + ID),
       'con el dominio sin cookies y el identificador comprobado detrás',
       'el src no es el esperado: ' + src);
    ok(/[?&]rel=0(&|$)/.test(src) && /[?&]playsinline=1(&|$)/.test(src),
       'y con los mismos parámetros que usa la misión',
       'los parámetros no coinciden con los de la misión');
    ok(!/["'<>\s\\]/.test(src),
       'y en el src no hay ni una comilla, espacio ni ángulo',
       'el src trae caracteres que pueden cerrar el atributo');
  }
  const pie = w.document.querySelector('.mvid-ver-pie');
  ok(pie && /no deja incrustarlo|Ver en YouTube/i.test(pie.textContent),
     'y explica qué mirar: si sale «Ver en YouTube», ese video no sirve',
     'no explica para qué sirve comprobar');

  log('');
  log('── 6. Cerrar comprobar apaga el video ──');
  await w.eval('mvidCerrarVer()');
  await esperar(200);
  ok(g('mvid-ver-caja').querySelectorAll('iframe').length === 0,
     'el reproductor se vacía: no se queda sonando detrás',
     'el video sigue puesto detrás del panel cerrado');
  ok(g('mvid-ver-overlay').style.display === 'none', 'y el panel se cierra', 'el panel no se cerró');

  /* ═══ 7. El desplegable de misiones ═══ */
  log('');
  log('── 7. Las misiones salen del catálogo, no escritas a mano ──');
  const sel = g('mvid-mision');
  const claves = [...sel.options].map(o => o.value).filter(Boolean);
  ok(claves.includes('2y3ciclo-fracciones'),
     'el desplegable trae la carpeta de la misión, sacada del catálogo público',
     'el desplegable no trae las misiones');
  ok(claves.length >= 2, 'y las demás también', 'solo trajo una');

  /* ═══ 8. La base vieja ═══ */
  log('');
  log('── 8. Sin haber corrido el SQL, se dice qué falta ──');
  const f2 = w.document.createElement('iframe');
  f2.style.display = 'none';
  f2.src = '/index.html';
  w.document.body.appendChild(f2);
  await new Promise(r => f2.addEventListener('load', r, { once: true }));
  await esperar(1200);
  const w2 = f2.contentWindow;
  nuevaBase(w2, { sinTabla: true });
  w2.eval('window.verificarSesion = () => ({ user: "josue" })');
  await w2.eval('initMetasVideos()');
  await esperar(400);
  const t2 = w2.document.getElementById('mvid-list').textContent;
  ok(/todav[íi]a no est[áa]n instalados/i.test(t2),
     'la herramienta dice que falta instalarla',
     'no explica nada: solo una pantalla en blanco');
  ok(t2.includes('metas_videos.sql'),
     'y nombra el archivo que hay que correr (desde una tableta no se adivina)',
     'no dice qué archivo hay que correr');
  ok(/cat[áa]logo/i.test(t2),
     'y deja claro que mientras tanto las misiones siguen funcionando con su catálogo',
     'no dice que las misiones siguen funcionando: parece que todo está roto');

  /* ═══ 9. Las misiones, organizadas por materia ═══ */
  log('');
  log('── 9. Con 66 misiones, se busca por materia ──');
  await w.eval('initMetasVideos()');
  await esperar(500);
  const chips = [...w.document.querySelectorAll('#mvid-chips .mvid-chip-f')].map(b => b.textContent);
  ok(chips.length >= 4, 'hay un chip por materia, sacado del catálogo',
     'no se pintaron los chips de materia: ' + chips.length);
  ok(chips.some(c => /Matemáticas/.test(c)) && chips.some(c => /Español/.test(c)),
     'y las materias salen con su nombre e icono',
     'las materias no salen bien: ' + chips.join(' | '));
  ok(chips[0] && /Todas/.test(chips[0]), 'con «Todas» primero para volver atrás',
     'falta el chip de «Todas»');
  ok(chips[1] && /Sin video/.test(chips[1]),
     'y «Sin video» EL SEGUNDO: es el filtro que de verdad se usa, saber cuáles faltan',
     '«Sin video» no está donde se busca: ' + chips.slice(0,3).join(' | '));

  /* Que el filtro «sin video» haga lo que dice */
  w.eval('_mvidMision = ""; _mvidBusca = ""; _mvidMateria = "__sinvideo"; mvidPintarSelector()');
  await esperar(200);
  const faltan = [...g('mvid-mision').querySelectorAll('option')].map(o => o.value).filter(Boolean);
  ok(faltan.length && faltan.indexOf('2y3ciclo-fracciones') < 0,
     '«Sin video» deja SOLO las misiones que todavía no tienen ninguno',
     'el filtro de las que faltan no quita la que ya tiene video: ' + faltan.join(','));

  /* La fila de chips NO baja de línea: se desliza. Con ocho materias
     envuelta ocupaba tres renglones y empujaba el desplegable de la
     misión fuera de la pantalla. */
  const filaChips = w.getComputedStyle(w.document.getElementById('mvid-chips'));
  ok(filaChips.flexWrap === 'nowrap' && /auto|scroll/.test(filaChips.overflowX),
     'la fila de materias se desliza en vez de ocupar tres renglones',
     'la fila de materias se envuelve: empuja el desplegable fuera de la pantalla');
  w.eval('_mvidMateria = ""; mvidPintarSelector()');
  ok(chips.some(c => /·\s*2/.test(c)), 'y cada chip lleva su cuenta de misiones',
     'los chips no llevan la cuenta');

  const grupos = [...g('mvid-mision').querySelectorAll('optgroup')].map(o => o.label);
  ok(grupos.length >= 3, 'el desplegable va agrupado por materia (optgroup)',
     'el desplegable sigue siendo una lista plana: ' + grupos.length + ' grupos');

  /* Filtrar por materia deja solo las suyas.

     ⚠️ Se suelta la misión elegida ANTES de medir, y no es un apaño:
     cuando hay una elegida, el desplegable la conserva a propósito con
     su etiqueta «(fuera del filtro)» —si no, diría una cosa y la lista
     de abajo enseñaría otra—. Medir el filtro con una elegida cuenta
     esa opción de escape como si fuera un fallo del filtro. Lo que se
     está probando aquí es el filtro; que la elegida no se pierda tiene
     su propia comprobación, más abajo. */
  w.eval('_mvidMision = ""; _mvidMateria = "español"; mvidPintarSelector()');
  await esperar(200);
  const soloEsp = [...g('mvid-mision').querySelectorAll('option')].map(o => o.value).filter(Boolean);
  ok(soloEsp.length === 1 && soloEsp[0].indexOf('adjetivos') >= 0,
     'tocar una materia deja solo sus misiones',
     'el filtro de materia no estrecha la lista: ' + soloEsp.join(','));

  /* El buscador mira título, carpeta, materia Y grado */
  w.eval('_mvidMision = ""; _mvidMateria = ""; _mvidBusca = "sexto"; mvidPintarSelector()');
  await esperar(200);
  let hallado = [...g('mvid-mision').querySelectorAll('option')].map(o => o.value).filter(Boolean);
  ok(hallado.length === 1, 'el buscador encuentra por GRADO («sexto» → 6º grado)',
     'buscar por grado no encontró lo suyo: ' + hallado.join(','));
  w.eval('_mvidMision = ""; _mvidBusca = "célula"; mvidPintarSelector()');
  await esperar(200);
  hallado = [...g('mvid-mision').querySelectorAll('option')].map(o => o.value).filter(Boolean);
  ok(hallado.length === 1 && hallado[0].indexOf('celula') >= 0,
     'y por título, aunque no se sepa en qué materia cayó',
     'buscar por título falló: ' + hallado.join(','));
  w.eval('_mvidBusca = ""; mvidPintarSelector()');

  /* La misión elegida no se pierde al filtrar */
  w.eval('_mvidMision = "2y3ciclo-fracciones"; _mvidMateria = "naturales"; mvidPintarSelector()');
  await esperar(200);
  ok(g('mvid-mision').value === '2y3ciclo-fracciones',
     'y la misión elegida NO se pierde al cambiar de materia',
     'el filtro dejó el desplegable diciendo una cosa y la lista otra');
  w.eval('_mvidMateria = ""; _mvidMision = "2y3ciclo-fracciones"; mvidPintarSelector(); mvidRender()');

  /* ═══ 10. El quiz del propio video ═══ */
  log('');
  log('── 10. El quiz del propio video ──');
  await w.eval('mvidAbrirForm(null)');
  await esperar(200);
  ok(!!g('mvid-f-preguntas'), 'el formulario tiene su sitio para preguntas',
     'no hay dónde escribir preguntas');

       'y `ok` es el ÍNDICE de la correcta, apuntando a la que se marcó',

    ok(typeof q.ok === 'number',
       'un número, nunca el texto: corregirle una tilde a la opción no puede dejar la pregunta sin respuesta',
       '`ok` no es un número');
  }

  /* ═══ 11. Pegar las preguntas de golpe ═══
     Escribirlas campo por campo en una tableta es el paso donde el
     trabajo se abandona. Lo que se vigila aquí es lo que cuesta caro:
     que se lea el bloque TAL COMO VIENE (que es como lo da cualquier
     prueba de selección múltiple: «1.» y «A) B) C) D)»), que no se
     pierda la D, y sobre todo que la respuesta correcta NO SE INVENTE.
     Un quiz publicado con la buena en la A no lo descubre nadie hasta
     que un niño acierta y la pantalla le dice que falló. */
  log('');
  log('── 11. Pegar las preguntas de golpe ──');
  const BLOQUE =
    '1. ¿Qué es el volumen?\n' +
    'A) La cantidad de cubos que tiene una figura\n' +
    'B) La capacidad de un objeto para contener líquidos\n' +
    'C) La cantidad de espacio que ocupa un cuerpo\n' +
    'D) El área de todas las caras de un objeto\n\n' +
    '---\n\n' +
    '2. ¿En qué unidades se mide el volumen?\n' +
    'A) Unidades cuadradas\n' +
    'B) Unidades lineales\n' +
    'C) Unidades cúbicas\n' +

  await w.eval('mvidAbrirForm(null)');
  await esperar(200);
  g('mvid-f-preg-pegar').click();
  await esperar(100);
  ok(g('mvid-f-pegar-caja').style.display !== 'none',

  await esperar(200);

  const bloques = [...w.document.querySelectorAll('.mvid-preg')];

     'salieron ' + bloques.length + ' preguntas del bloque');
  const txts = bloques.map(b => b.querySelector('.mvid-preg-txt').value);
  ok(txts[0] === '¿Qué es el volumen?', 'con el enunciado sin el «1.» delante',

  const ops1 = [...bloques[0].querySelectorAll('.mvid-preg-opt')].map(i => i.value).filter(Boolean);
  ok(ops1.length === 4 && ops1[3] === 'El área de todas las caras de un objeto',

     'las opciones quedaron: ' + JSON.stringify(ops1));

  /* Lo que de verdad no puede fallar: el bloque no decía cuál era la
     correcta, así que NINGUNA queda marcada. */
  ok(!w.document.querySelector('.mvid-preg input[type=radio]:checked'),
     'el bloque no decía la correcta: no se marca ninguna sola',
     'se dio por buena una respuesta que nadie eligió');
  ok(w.document.querySelectorAll('.mvid-preg-falta').length === 3,

  ok(/sin la correcta|sin marcar/i.test(g('mvid-f-preg-aviso').textContent),
     'y se dice con palabras, al lado de las preguntas',
     'no se avisa de que falta la correcta: ' + JSON.stringify(g('mvid-f-preg-aviso').textContent));

  /* Y el guardado SE PARA: no se guarda un quiz de tres preguntas
     dejándolo en cero ni marcando la A por su cuenta. */
  g('mvid-f-enlace').value = 'https://youtu.be/' + ID;
  g('mvid-f-titulo').value = 'Pegado';
  const antesDePegar = base.tablas.metas_videos.length;
  await w.eval('mvidGuardar()');
  await esperar(300);
  ok(base.tablas.metas_videos.length === antesDePegar,
     'sin marcar la correcta NO se guarda',
     'se guardó un quiz con la respuesta sin revisar');
  ok(/correcta/i.test(g('mvid-f-aviso').textContent) && /pregunta 1/i.test(g('mvid-f-aviso').textContent),
     'y se dice CUÁL pregunta es la que falta',
     'el aviso no dice qué hay que tocar: ' + JSON.stringify(g('mvid-f-aviso').textContent));

  /* Se marca la C de las tres, como haría el administrador. */
  bloques.forEach(b => b.querySelectorAll('input[type=radio]')[2].click());
  await esperar(100);
  ok(w.document.querySelectorAll('.mvid-preg-falta').length === 0,
     'al tocarla se apaga el ámbar en el sitio',
     'el ámbar sigue puesto después de marcar');
  await w.eval('mvidGuardar()');
  await esperar(400);
  const pegado = base.tablas.metas_videos.find(v => v.titulo === 'Pegado');
  ok(pegado && pegado.preguntas.length === 3, 'ya marcadas, se guardan las tres',
     'no se guardaron las preguntas pegadas');
  if (pegado && pegado.preguntas[0]) {
    const q = pegado.preguntas[0];
    ok(q.ops.length === 4 && q.ok === 2 && q.ops[q.ok] === 'La cantidad de espacio que ocupa un cuerpo',
       'con sus cuatro opciones y `ok` apuntando a la que se marcó',
       'quedó mal: ' + JSON.stringify(q));
  }

  /* Si el texto SÍ dice cuál es la correcta, se marca sola: es el caso
     normal cuando las preguntas vienen con su clave debajo. */
  await w.eval('mvidAbrirForm(null)');
  await esperar(200);
  g('mvid-f-preg-pegar').click();
  g('mvid-f-pegar-txt').value = BLOQUE + '\n\nRespuestas: 1-C, 2-C, 3-C';
  g('mvid-f-pegar-leer').click();
  await esperar(200);
  const marcadas = [...w.document.querySelectorAll('.mvid-preg')]
    .map(b => [...b.querySelectorAll('input[type=radio]')].findIndex(r => r.checked));
  ok(marcadas.join() === '2,2,2', 'la lista «Respuestas: 1-C, 2-C, 3-C» marca sola las tres',
     'la clave del final no se aplicó: ' + JSON.stringify(marcadas));
  ok(w.document.querySelectorAll('.mvid-preg-falta').length === 0,
     'y entonces no queda nada en ámbar', 'sigue pidiendo marcar lo que ya venía dicho');
  await w.eval('mvidCerrarForm()');

  /* Y el lector, en seco: las formas en que un texto dice cuál es la
     buena, y los topes, que no pueden recortar en silencio. */
  const P = w.FaroMetasVideos.parsear;
  const conVisto = P('¿Qué es?\nA) Uno\nB) Dos ✅\nC) Tres').preguntas[0];
  ok(conVisto.ok === 1 && conVisto.ops[1] === 'Dos',
     'el ✅ marca la correcta y no se queda dentro del texto', JSON.stringify(conVisto));
  const negrita = P('¿Qué es?\nA) Uno\n**B) Dos**\nC) Tres').preguntas[0];
  ok(negrita.ok === 1, 'la negrita también', JSON.stringify(negrita));
  const asteriscos = P('¿Qué es?\n* Uno\n* Dos\n* Tres').preguntas[0];
  ok(asteriscos.ops.length === 3 && asteriscos.ok === -1,
     'pero una lista de asteriscos son VIÑETAS, no tres correctas', JSON.stringify(asteriscos));
  const doce = P([...Array(12)].map((_, n) => (n + 1) + '. ¿P' + n + '?\nA) Uno\nB) Dos ✅').join('\n\n'));
  ok(doce.preguntas.length === 10 && /Ven[íi]an 12/.test(doce.avisos.join(' ')),
     'de doce preguntas se quedan diez —el tope—, y se dice', JSON.stringify(doce.avisos));
  const cincoOps = P('¿Qué es?\nA) Uno\nB) Dos\nC) Tres\nD) Cuatro\nE) Cinco ✅').preguntas[0];
  ok(cincoOps.ops.length === 4 && cincoOps.ops[cincoOps.ok] === 'Cinco',
     'y de cinco opciones se quedan cuatro, con la correcta DENTRO',
     'la correcta se cayó por el borde: ' + JSON.stringify(cincoOps));
  ok(P('hola qué tal\notra línea suelta').preguntas.length === 0,
     'un texto cualquiera no se inventa preguntas', 'salieron preguntas de un texto que no las tenía');

  /* Y el tope de verdad: diez preguntas tienen que llegar hasta la
     base. El número vive en tres sitios —aquí, el `check` de
     metas_videos.sql y el `vmPreguntas` de M.E.T.A.S— y si uno se queda
     corto las de más no dan error: se pierden por el camino. */
  await w.eval('mvidAbrirForm(null)');
  await esperar(200);
  g('mvid-f-preg-pegar').click();
  g('mvid-f-pegar-txt').value = [...Array(10)].map((_, n) =>
    (n + 1) + '. ¿Pregunta ' + (n + 1) + '?\nA) Uno\nB) Dos ✅\nC) Tres').join('\n\n');
  g('mvid-f-pegar-leer').click();
  await esperar(300);
  ok(w.document.querySelectorAll('.mvid-preg').length === 10,
     'diez preguntas pegadas salen las diez',
     'el formulario no admite diez: salieron ' + w.document.querySelectorAll('.mvid-preg').length);
  ok(g('mvid-f-preg-mas').style.display === 'none',
     'y en el tope se retira el botón de añadir otra',
     'se puede seguir añadiendo por encima del tope');
  g('mvid-f-enlace').value = 'https://youtu.be/' + ID;
  g('mvid-f-titulo').value = 'Diez preguntas';
  await w.eval('mvidGuardar()');
  await esperar(400);
  const diez = base.tablas.metas_videos.find(v => v.titulo === 'Diez preguntas');
  ok(diez && diez.preguntas.length === 10,
     'y las diez llegan enteras a la base',
     'no se guardaron las diez: ' + (diez ? diez.preguntas.length : 'no se guardó'));

  /* ═══ 12. Sin catálogo, la herramienta lo DICE ═══ */
  log('');
  log('── 12. Si el catálogo de M.E.T.A.S no llega, se dice ──');
  await w.eval('_mvidMisiones = []; mvidPintarChips(); mvidPintarSelector()');
  await esperar(200);
  const sc = g('mvid-chips').textContent;
  ok(/No lleg[oó] la lista/i.test(sc),
     'se explica que no llegó la lista de misiones',
     'no sale NADA: parece la herramienta rota. ' + JSON.stringify(sc.slice(0,60)));
  ok(/Reintentar/.test(sc), 'y se ofrece reintentar', 'no hay forma de reintentar');
  ok(/mano/i.test(sc + g('mvid-mision').textContent),
     'y que mientras tanto la carpeta se puede escribir a mano',
     'no dice qué hacer mientras tanto');

  /* ═══ 14. El orden se cambia arrastrando la tarjeta ═══
     Aquí había dos flechas ↑ ↓ y el autor las pidió quitar el 28 de
     agosto de 2026: con diez videos, poner el sexto en primer lugar eran
     cinco toques, cinco repintados, y volver a buscar la fila con la
     vista entre uno y otro.

     Se prueba con EVENTOS DE PUNTERO DE VERDAD, no llamando por dentro a
     la función: lo que puede fallar aquí es de pantalla —un asa que el
     dedo no alcanza, un `touch-action` que le regala el gesto al
     desplazamiento de la página, una fila que tapa a la de debajo y no
     deja ver dónde soltar—, y nada de eso se ve llamando funciones. Es
     la misma lección que la sonda de la barra de grupos de M.E.T.A.S. */
  log('');
  log('── 14. El orden se cambia arrastrando, no con flechas ──');
  const MIS = '2y3ciclo-la-celula';
  base.tablas.metas_videos.push(
    { id: 9001, mision: MIS, vid: 'a', yt_id: 'aaaaaaaaaaa', titulo: 'Primero',
      estado: 'publicado', orden: 1, ini: 0, fin: 0, nota: '', dura: '', canal: '' },
    { id: 9002, mision: MIS, vid: 'b', yt_id: 'bbbbbbbbbbb', titulo: 'Segundo',
      estado: 'publicado', orden: 2, ini: 0, fin: 0, nota: '', dura: '', canal: '' },
    { id: 9003, mision: MIS, vid: 'c', yt_id: 'ccccccccccc', titulo: 'Tercero',
      estado: 'publicado', orden: 3, ini: 0, fin: 0, nota: '', dura: '', canal: '' });
  /* La vista se ABRE de verdad, no se llama a `initMetasVideos()` a
     secas: hasta que no está activa, sus tarjetas miden 0×0 y un
     arrastre es un gesto entre dos puntos de la PANTALLA. Con el panel
     escondido, `elementFromPoint` no encuentra nada y la sonda aprobaría
     un arrastre que en la tableta no funciona.

     Y la ventana se agranda para esta prueba: los 640 px del marco no
     dan para las tres tarjetas a la vez, y hay que poder tocar la de
     abajo y soltarla sobre la de arriba. Se devuelve al acabar. */
  const altoMarco = f.style.height;
  f.style.height = '1100px';
  /* La aplicación arranca con `#app-container` escondido hasta que entra
     la sesión; aquí la sesión es de mentira, así que se enseña a mano,
     como hacen las demás sondas que necesitan medir la pantalla. */
  w.document.getElementById('app-container').style.display = '';
  w.eval('_mvidMateria = ""; _mvidBusca = ""; _mvidMision = "' + MIS + '"');
  w.eval('switchView("view-mvid")');
  await esperar(600);

  const lista = g('mvid-list');
  const titulos = () => [...lista.querySelectorAll('.mvid-card .mvid-tit')].map(n => n.textContent);
  ok(titulos().join(',') === 'Primero,Segundo,Tercero',
     'los tres videos salen en su orden', 'no salieron los tres: ' + titulos().join(','));

  /* Las flechas se fueron */
  const flechas = [...lista.querySelectorAll('button')].filter(b => /^[↑↓]$/.test(b.textContent.trim()));
  ok(flechas.length === 0, 'ya no hay flechas ↑ ↓ que tocar cinco veces',
     'siguen las flechas: ' + flechas.length);

  const asas = lista.querySelectorAll('[data-mvid-asa]');
  ok(asas.length === 3, 'cada tarjeta lleva su asa para arrastrarla',
     'faltan asas: ' + asas.length);

  /* Y se dice con palabras. Las flechas ↑ ↓ se explicaban solas; un asa
     con puntos, no —y lo que se ordena tampoco es evidente: es la fila
     en que el alumno los ve dentro de la misión—. */
  const nota = lista.querySelector('.mvid-orden-nota');
  ok(nota && /alumno/i.test(nota.textContent) && /rrastra/.test(nota.textContent),
     'y encima se explica qué es el orden y cómo se cambia',
     'no se explica el orden: un asa con puntos no se descubre sola');

  /* ⚠️ `touch-action: none` es obligatorio: sin él el navegador se queda
     el gesto para desplazar la página y el arrastre no llega a empezar
     —justo en la tableta, que es donde se usa esto—. */
  ok(asas[0] && w.getComputedStyle(asas[0]).touchAction === 'none',
     'y el asa tiene touch-action:none, sin el cual el dedo desplaza la página en vez de arrastrar',
     'al asa le falta touch-action:none: en una tableta el arrastre no arrancaría');

  /* Y que se pueda AGARRAR: 44 px es lo que un dedo acierta sin mirar. */
  const cajaAsa = asas[0] && asas[0].getBoundingClientRect();
  ok(cajaAsa && cajaAsa.width >= 30 && cajaAsa.height >= 44,
     'y es una franja alta, no un botón de un milímetro (' +
       Math.round(cajaAsa.width) + '×' + Math.round(cajaAsa.height) + ' px)',
     'el asa es demasiado pequeña para el dedo: ' +
       (cajaAsa ? Math.round(cajaAsa.width) + '×' + Math.round(cajaAsa.height) : 'no está'));

  /* ── Arrastrar el TERCERO hasta arriba, con el dedo ── */
  const arrastra = (desdeAsa, hastaTarjeta) => {
    const a = desdeAsa.getBoundingClientRect();
    const b = hastaTarjeta.getBoundingClientRect();
    const ev = (t, x, y) => new w.PointerEvent(t, {
      bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch',
      clientX: x, clientY: y
    });
    desdeAsa.dispatchEvent(ev('pointerdown', a.left + a.width / 2, a.top + a.height / 2));
    /* Dos pasos: el primero fuera de la tarjeta de destino y el segundo
       cruzando su mitad de arriba, que es la línea que decide dónde
       cae. */
    desdeAsa.dispatchEvent(ev('pointermove', b.left + b.width / 2, b.top + b.height - 2));
    desdeAsa.dispatchEvent(ev('pointermove', b.left + b.width / 2, b.top + 2));
    desdeAsa.dispatchEvent(ev('pointerup', b.left + b.width / 2, b.top + 2));
  };

  const tarjetas = () => [...lista.querySelectorAll('.mvid-card')];
  const antesDeArrastrar = tarjetas();
  antesDeArrastrar[0].scrollIntoView();
  await esperar(120);
  arrastra(antesDeArrastrar[2].querySelector('[data-mvid-asa]'), tarjetas()[0]);
  await esperar(400);

  ok(titulos().join(',') === 'Tercero,Primero,Segundo',
     'arrastrando el tercero hasta arriba, la lista queda en su orden nuevo',
     'el arrastre no movió nada: ' + titulos().join(','));

  /* Y que se GUARDE. Enseñar un orden que no está guardado es peor que
     perder el movimiento: el que lo hizo se va convencido. */
  const orden = () => base.tablas.metas_videos
    .filter(v => v.mision === MIS)
    .sort((a, b) => a.orden - b.orden).map(v => v.titulo).join(',');
  ok(orden() === 'Tercero,Primero,Segundo',
     'y el orden nuevo queda guardado en la nube',
     'la nube se quedó con el orden viejo: ' + orden());

  /* Solo se escriben las filas que cambiaron: cada escritura es un viaje
     a la nube y esto se usa con la señal de una tableta. */
  const escrituras = base.llamadas.filter(l =>
    l.metodo === 'PATCH' && l.cuerpo && 'orden' in l.cuerpo).length;
  ok(escrituras === 3, 'con una escritura por fila movida y ninguna de más (' + escrituras + ')',
     'se escribieron ' + escrituras + ' filas: se están reescribiendo las que no cambiaron');

  /* ⚠️ Y AL SOLTAR NO SE REPINTA. Es la lección de la barra de grupos de
     M.E.T.A.S: repintar justo al soltar le arranca de debajo del dedo el
     elemento que iba a recibir el toque siguiente. Se comprueba mirando
     que las tarjetas sigan siendo LOS MISMOS NODOS de antes. */
  ok(tarjetas().every(n => antesDeArrastrar.indexOf(n) >= 0),
     'y al soltar no se repinta: la lista no salta de debajo del dedo',
     'la lista se repintó al soltar; el toque siguiente cae en otra fila');

  /* ── Y con el teclado, que es la otra manera ──
     El arrastre de precisión en una tableta falla lo bastante como para
     que una función que solo se pueda usar arrastrando sea una función
     que a veces no existe. Misma regla que el asa de la repisa. */
  const asaPrimera = tarjetas()[0].querySelector('[data-mvid-asa]');
  asaPrimera.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
  await esperar(350);
  ok(titulos().join(',') === 'Primero,Tercero,Segundo',
     'y las flechas del teclado mueven un puesto, para el que no acierte arrastrando',
     'el teclado no mueve: ' + titulos().join(','));
  ok(orden() === 'Primero,Tercero,Segundo',
     'y eso también se guarda',
     'lo del teclado no se guardó: ' + orden());

  /* Y la nota que hay dentro de la lista no cuenta como una tarjeta: la
     primera fila con «arriba» no puede colarse por encima de ella. */
  const escrituras0 = base.llamadas.length;
  tarjetas()[0].querySelector('[data-mvid-asa]')
    .dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
  await esperar(250);
  ok(titulos().join(',') === 'Primero,Tercero,Segundo' &&
     base.llamadas.length === escrituras0,
     'y la primera con «arriba» no se mueve ni escribe de balde',
     'la nota del orden se cuenta como una tarjeta: ' + titulos().join(','));
  f.style.height = altoMarco;

  /* ═══ 13. El service worker no puede servir el JS viejo ═══
     Esto no se ve desde el navegador —la sonda corre sin service
     worker—, así que se lee el archivo. Y hace falta: el 28 de agosto
     de 2026 F.A.R.O sirvió el HTML nuevo con el JS viejo, así que el
     rótulo MATERIA salía y debajo no había ni un chip. */
  log('');
  log('── 13. El service worker revalida contra el servidor ──');
  const sw = await (await fetch('/sw.js', { cache: 'no-store' })).text();
  const ramaPropia = sw.split('} else {')[0];
  ok(/cache:\s*'no-cache'/.test(ramaPropia),
     'los archivos propios se piden con `cache: no-cache`',
     'sin eso la caché HTTP del navegador sirve el JS viejo con el HTML nuevo, y no parece un fallo de caché');

  log('');
  log(fallos === 0 ? 'RESULTADO: APRUEBA' : `RESULTADO: SUSPENDE · ${fallos} fallo(s)`);
  document.title = fallos === 0 ? 'APRUEBA · videos de M.E.T.A.S' : 'SUSPENDE · videos de M.E.T.A.S';
})().catch(e => {
  log('✘ la sonda reventó: ' + (e && e.message));
  log('RESULTADO: SUSPENDE');
  document.title = 'SUSPENDE · videos de M.E.T.A.S';
});
</script>
</body>
