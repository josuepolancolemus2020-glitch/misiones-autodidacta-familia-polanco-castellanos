<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de las Gafas a la Vista, etapa 3</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-gafas-mapa-familias/mapa-familias.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 3 de la Ruta de las Gafas a la Vista (Estudio de las
   Ideologías, materia 25 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y SEIS lecturas: las tres voces
   clásicas, las dos entrevistas de la norma 5-quinquies y el CAREO de la norma
   5-nonies) y las TRES BATERÍAS, que con la sexta lectura pasan a 30 de
   comprensión lectora, 12 de completar y 12 de análisis complejo, repartidas
   5, 2 y 2 DENTRO de cada lectura y ya no en una batería suelta al final. Se
   comprueba además el plegado con su índice, la barra de marcar junto a lo
   seleccionado, la marca de lectura, y la impresión de verdad.

   Detalle de escritura: el guion largo que esta sonda persigue se escribe
   aquí como \u2014 dentro de las expresiones regulares. Es el mismo carácter
   para el motor, y evita que el grep de la norma 1-bis (que se pasa sobre
   TODOS los archivos, sondas incluidas) cuente como infracción justo a la
   línea que la caza.

   La REGLA DEL ESTATUS del compendio rige también aquí, y esta etapa trae
   la lista más larga de la ruta, así que se comprueba fuente por fuente:
   Heywood como manual académico sólido como manual; Mill (1859) y Burke
   (1790) como clásicos sólidos y fuentes primarias; Anderson y Gellner (los
   dos de 1983) como clásicos sólidos QUE SE DISCUTEN ENTRE SÍ; Ward (2004)
   como entrada seria; Paxton (2004) como académico sólido; Griffin (1991)
   como académico sólido con DEFINICIÓN EN DISPUTA; Eco (1995) con ESTATUS
   DE ENSAYO Y NO DE CIENCIA (se comprueba explícitamente, porque es la
   etiqueta que más fácil se pierde); Sternhell (1983) como TESIS DISCUTIDA;
   y Mudde (2004 y 2017) como académico sólido. Y el pastiche de las
   lecturas declarado como pastiche.

   Tres cuidados del arco se comprueban a máquina porque gobiernan la
   misión: que la REGLA DEL ACERO sea la regla madre (ninguna familia entra
   por su caricatura, y el núcleo que es un defecto es un muñeco); que el
   detector se gire hacia adentro con la regla de pago, y con el ideario MÁS
   PARECIDO; y el CERO PARTIDISMO HONDUREÑO ACTUAL, que aquí es doble porque
   «fascista» y «populista» son las dos palabras más gastadas del debate
   diario. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de las Gafas a la Vista · Etapa 3 de 7/.test(d.body.textContent), 'se presenta como etapa 3 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 2 de esta misma ruta. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-gafas-bisturi-freeden"], a[href*="ruta-gafas-palabra-expediente"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"], a[href*="ruta-atomos-contra-miedo"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    /* El temario de la etapa 2 (el bisturí) no se vuelve a explicar aquí:
       esta etapa lo CORRE. Lo que se caza es que se haya arrastrado la
       explicación, no el uso. */
    ok(!/Gallie|Berlin|bisturí|descontestaci|libertad negativa|libertad positiva|concepto (esencialmente )?disputado|tres capas/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la etapa 2 (el bisturí de Freeden)', 'queda vocabulario de la etapa 2, que aquí no se vuelve a explicar');
    ok(!/🔬/.test(cuerpoSinEnlaces), 'sin el emoji de la etapa 2', 'queda el 🔬 de la etapa 2 fuera de los enlaces');
    ok(!/Destutt|cámara oscura|falsa conciencia|Mehring|relacionismo|Mannheim/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la etapa 1 de la ruta', 'queda vocabulario de la etapa 1 (la palabra con expediente)');
    ok(!/hombre de acero|hombre de paja|Caplan|Farm to Factory|tetrafármaco|Epicuro|vigía|timón/i.test(cuerpoSinEnlaces),
       'sin restos de las otras misiones del Estudio Mayor', 'queda vocabulario de otra misión del arco');
    /* Y lo que SÍ tiene que quedar: el USO del instrumento, que es de lo que
       va esta etapa, y los enlaces declarados a las etapas hermanas. */
    ok(/morfolog/i.test(d.body.textContent), 'el uso del instrumento sigue nombrado (la morfología de cada familia)', 'se perdió el uso del instrumento');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-gafas-bisturi-freeden"]') && !!d.querySelector('#s-recursos a[href*="ruta-gafas-palabra-expediente"]'),
       'Recursos declara las dos etapas hermanas de la ruta', 'faltan los enlaces declarados a las etapas 1 y 2');
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Heywood/.test(texto0) && /Political Ideologies/.test(texto0) && /sólido como manual/i.test(texto0),
       'Heywood con su etiqueta de manual académico sólido como manual', 'falta Heywood etiquetado');
    ok(/Mill/.test(texto0) && /1859/.test(texto0) && /Sobre la libertad/.test(texto0),
       'Mill (1859) con el título de su obra', 'falta Mill con su obra y su año');
    ok(/Burke/.test(texto0) && /1790/.test(texto0) && /Reflexiones sobre la Revolución en Francia/.test(texto0),
       'Burke (1790) con el título de su obra', 'falta Burke con su obra y su año');
    ok(/clásico sólido/i.test(texto0) && /fuente primaria/i.test(texto0),
       'y los dos declarados clásicos sólidos y fuentes primarias', 'falta la etiqueta de Mill y Burke');
    ok(/Anderson/.test(texto0) && /Comunidades imaginadas/.test(texto0) && /Gellner/.test(texto0) && /Naciones y nacionalismo/.test(texto0) && /1983/.test(texto0),
       'Anderson y Gellner, los dos de 1983, con sus obras', 'faltan Anderson y Gellner con sus obras');
    ok(/se discuten entre sí/i.test(texto0), 'y declarados clásicos sólidos QUE SE DISCUTEN ENTRE SÍ', 'no se declara que Anderson y Gellner discuten');
    ok(/Ward/.test(texto0) && /Anarchism: A Very Short Introduction/.test(texto0) && /2004/.test(texto0) && /entrada seria/i.test(texto0),
       'Colin Ward (2004) con su etiqueta de entrada seria', 'falta Ward etiquetado');
    ok(/Paxton/.test(texto0) && /Anatomía del fascismo/.test(texto0) && /académico sólido/i.test(texto0),
       'Paxton (2004) como académico sólido', 'falta Paxton etiquetado');
    ok(/Griffin/.test(texto0) && /The Nature of Fascism/.test(texto0) && /1991/.test(texto0),
       'Griffin (1991) con el título de su obra', 'falta Griffin con su obra');
    ok(/definición en disputa/i.test(texto0), 'y declarada DEFINICIÓN EN DISPUTA', 'no se declara que la definición de Griffin está en disputa');
    /* La etiqueta que más fácil se pierde, y la que el compendio subraya. */
    ok(/Eco/.test(texto0) && /Ur-Fascism/.test(texto0) && /1995/.test(texto0),
       'Eco (1995) con el título de su ensayo', 'falta Eco con su obra y su año');
    ok(/estatus de ensayo/i.test(texto0) && /no de ciencia/i.test(texto0),
       'y con ESTATUS DE ENSAYO, NO DE CIENCIA, dicho con esas palabras', 'a Eco le falta la etiqueta de ensayo y no de ciencia');
    ok(/catorce rasgos/i.test(texto0) && /no mide nada/i.test(texto0),
       'y con la razón: catorce rasgos, y una lista que da positivo con casi todo no mide nada', 'falta la razón por la que la lista de Eco no mide');
    ok(/Sternhell/.test(texto0) && /Ni derecha ni izquierda/.test(texto0) && /1983/.test(texto0) && /tesis discutida/i.test(texto0),
       'Sternhell (1983) como tesis discutida', 'falta Sternhell etiquetado');
    ok(/Mudde/.test(texto0) && /The Populist Zeitgeist/.test(texto0) && /2004/.test(texto0),
       'Mudde (2004) con el título de su artículo', 'falta Mudde con su obra');
    ok(/Rovira Kaltwasser/.test(texto0) && /2017/.test(texto0) && /América Latina/.test(texto0),
       'y Mudde con Rovira Kaltwasser (2017), escrito a medias desde América Latina', 'falta la segunda fuente del populismo');
    /* La regla de la casa, que en esta etapa es doble. */
    ok(/históricos o de fuera/i.test(texto0) && /(pol[íi]ticos? vivos?|pol[íi]tico vivo)/i.test(texto0),
       'el entrenamiento va con textos históricos o de fuera, sin políticos vivos', 'falta la regla del cero partidismo actual');
    ok(/más gastadas del debate diario/i.test(texto0),
       'y el cuidado doble: fascista y populista son las palabras más gastadas', 'no se declara el cuidado doble de esta etapa');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15,
       'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'familias,nacion,debate,delgada', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos del mapa', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    /* Las tres baterías de las lecturas (normas 5-quater y 5-nonies): con la
       sexta lectura los bancos pasan a 30, 12 y 12, o sea 54 preguntas. */
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos POR LECTURA.
       Sin esta cuenta, una lectura se publica con su tarjeta de preguntas
       vacía y no se entera nadie hasta que un alumno la abre. Y una pregunta
       mal etiquetada no desaparece: se le cuelga a la voz equivocada, que es
       peor, porque se contesta con el texto que no la responde. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const nc = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const nf = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const na = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(nc === 5 && nf === 2 && na === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + nc + '/' + nf + '/' + na + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis sin pauta o con pauta corta');
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada análisis dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* El número de cabeza («1.», «7.») era el del banco global de diez. Con
       dos preguntas por lectura ese número mentiría, así que no va. */
    ok(dentro('lectAnalisisBank.every(q => !/^\\s*\\d+\\./.test(q.q))'),
       'y ninguna arrastra el número del banco viejo', 'algún análisis sigue numerado con el número global');
    ok(/faro_gafas_familias/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/regla del acero/i.test(texto) && /regla madre/i.test(texto),
       'la regla del acero declarada como regla madre del arco', 'falta la regla madre del arco');
    ok(/mejor versión/i.test(texto) && /caricatura/i.test(texto), 'cada familia por su mejor versión, y nunca por su caricatura', 'falta el gesto que ordena la etapa');
    ok(/muñeco/i.test(texto) && /nadie pone un defecto/i.test(texto),
       'la señal del muñeco: un defecto en el núcleo', 'falta la señal que delata un muñeco');
    ok(/liberalismo/i.test(texto) && /conservadurismo/i.test(texto) && /socialismo/i.test(texto) && /nacionalismo/i.test(texto) && /anarquismo/i.test(texto) && /fascismo/i.test(texto) && /populismo/i.test(texto),
       'las siete familias están nombradas', 'falta alguna de las siete familias');
    ok(/desconfianza de los planes perfectos/i.test(texto) && /(reparación|reparar)/i.test(texto) && /demolición/i.test(texto),
       'el conservadurismo con el cambio como reparación y no demolición', 'falta el núcleo del conservadurismo');
    ok(/variantes internas/i.test(texto) && /pelean entre sí/i.test(texto),
       'el socialismo con su siglo de variantes internas', 'falta el rasgo propio del socialismo');
    ok(/comunidades imaginadas/i.test(texto) && /nunca se van a conocer/i.test(texto),
       'el nacionalismo con la comunidad imaginada de Anderson', 'falta la comunidad imaginada');
    ok(/industrializaci/i.test(texto), 'y con la industrialización de Gellner', 'falta la tesis de Gellner');
    ok(/se cuela en (todas|las demás)/i.test(texto), 'el nacionalismo como la familia que se cuela en las demás', 'no se dice que el nacionalismo se cuela');
    ok(/autoridad que no puede justificarse/i.test(texto), 'el anarquismo con su núcleo verdadero', 'falta el núcleo del anarquismo');
    ok(/más cooperativas que atentados/i.test(texto), 'y sin la caricatura de la bomba', 'falta la corrección de la caricatura del anarquismo');
    ok(/por lo que hace/i.test(texto) && /alianzas con las élites/i.test(texto), 'el fascismo de Paxton: por lo que hace, y las alianzas', 'falta la definición de Paxton');
    ok(/mito del renacer nacional/i.test(texto), 'el fascismo de Griffin: el mito del renacer nacional', 'falta la definición de Griffin');
    ok(/ideología delgada/i.test(texto) && /pueblo puro/i.test(texto) && /élite corrupta/i.test(texto),
       'el populismo como ideología delgada', 'falta el núcleo del populismo');
    ok(/anfitriona/i.test(texto), 'y su necesidad de una familia anfitriona', 'no se dice que el populismo necesita anfitriona');
    ok(/(cuándo|cuando) .{0,30}describe/i.test(texto) && /escupe/i.test(texto),
       'cuándo la palabra describe y cuándo solo escupe', 'falta la distinción entre describir y escupir');
    ok(/media página/i.test(texto) && /militante la firmaría/i.test(texto),
       'la prueba dura: media página que un militante firmaría', 'falta la prueba dura de la etapa');
    ok(/regla de pago/i.test(texto) && /más parecid/i.test(texto),
       'la regla de pago, y con el ideario más parecido', 'falta la regla de pago con el más parecido');
    ok(/no es un instrumento, es un arma/i.test(texto),
       'el detector que no se prueba en casa es arma', 'falta el cuidado central del compendio');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(1790|1859|1983|1991|1995|2004|2017)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/1790/.test(tg) && /1859/.test(tg) && /1983/.test(tg) && /2004/.test(tg), 'el guion trae las fechas del mapa', 'al guion le faltan fechas');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');

      /* La etiqueta del estatus de esa tarjeta reparte a los seis en dos

      ok(/reales/i.test(tl) && /citas (apócrifas|inventadas)/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');

      ok(/1892/.test(tl), 'ancla real: el People\'s Party de 1892', 'falta el origen histórico del populismo');
      ok(/rebuzno/i.test(tl) && /1615/.test(tl) && /(veinticinco|II, 25)/i.test(tl) && /(veintisiete|II, 27)/i.test(tl),

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');
    /* El careo es el único texto de la sección que NO imita a nadie: enfrenta
       dos posturas que sostiene de verdad alguien en la literatura. Por eso su
       etiqueta es distinta y por eso aquí se exige lo contrario que a los otros
       cinco: que NO se declare obra de ningún autor imitado (no hay ninguno) y
       que sí declare que a los historiadores se les cita en tercera persona.
       Poner palabras inventadas en la boca de un investigador vivo sería
       exactamente la fuente inflada que esta etapa enseña a cazar. */
    const careo = d.getElementById('lect-debate');
    ok(!!careo, 'existe la tarjeta lect-debate', 'falta #lect-debate');
    if (careo) {
      const tc = careo.textContent.replace(/\s+/g, ' ');
      const notaC = ((careo.querySelector('.lect-nota') || {}).textContent || '').replace(/\s+/g, ' ');
      ok(/MODERACIÓN\./.test(tc) && /LA DEFENSA\./.test(tc) && /LA OBJECIÓN\./.test(tc),
         'los turnos van firmados por papeles, en mayúsculas y con punto', 'el careo no usa el formato de papeles');
      ok(/no son cita de nadie/i.test(notaC) && /tercera persona/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(/Ninguno de los dos habla aquí/i.test(notaC), 'y que los dos historiadores no hablan en el texto', 'la nota no dice que los citados no hablan');
      ok(/mejor versión/i.test(notaC) && /acero antes del juicio/i.test(notaC),
         'y que cada postura va en su mejor versión (la regla del acero)', 'el careo no declara la regla del acero');
      /* Las seis partes obligatorias, y en su orden. */
      ok(/La pregunta que se discute aquí es una sola/i.test(tc), '1. plantea la pregunta en disputa, y una sola', 'al careo le falta la pregunta en disputa');
      ok(/por lo que dice o por lo que hace/i.test(tc), 'y esa pregunta es la de esta etapa: lo que dice contra lo que hace', 'la pregunta en disputa no es la de la etapa');
      ok(/Cada postura va primero sola y en su mejor versión/i.test(tc), '2 y 3. cada postura va sola y en su mejor versión', 'las dos posturas no se presentan por separado');
      ok(/Van las réplicas/i.test(tc) && /Contesto las dos cosas/i.test(tc), '4. las réplicas: cada lado contesta al otro', 'al careo le faltan las réplicas');
      ok(/El terreno común/i.test(tc), '5. dice qué aceptan las dos posturas', 'al careo le falta el terreno común');
      ok(/Lo que sigue en disputa/i.test(tc), '6. dice qué sigue en disputa', 'el careo no dice qué queda sin resolver');
      ok(/Qué dato lo resolvería/i.test(tc), 'y qué dato lo resolvería', 'el careo no dice qué dato resolvería la disputa');
      ok(/treinta movimientos/i.test(tc) && /coinciden/i.test(tc), 'con la comprobación que valdría por las dos', 'falta la prueba que decidiría entre las dos definiciones');
      /* Las anclas del careo de ESTA misión: reales y comprobables. */
      ok(/Griffin/.test(tc) && /The Nature of Fascism/.test(tc) && /Pinter/.test(tc) && /1991/.test(tc),
         'ancla real: Griffin, «The Nature of Fascism» (Pinter, 1991)', 'falta la fuente de la postura del núcleo');
      ok(/palingenésica|palingenésico/i.test(tc) && /ultranacionalismo/i.test(tc),
         'y su fórmula literal, el ultranacionalismo palingenésico', 'falta la fórmula de Griffin');
      ok(/Paxton/.test(tc) && /The Five Stages of Fascism/.test(tc) && /Journal of Modern History/.test(tc) && /1998/.test(tc),
         'ancla real: Paxton en The Journal of Modern History (1998)', 'falta la fuente de la postura de la conducta, con su revista');
      ok(/Anatomía del fascismo/.test(tc) && /2004/.test(tc), 'y «Anatomía del fascismo» (2004)', 'falta el libro de Paxton dentro del careo');
      ok(/Emilio Gentile/.test(tc) && /Il culto del littorio/.test(tc) && /1993/.test(tc),

      ok(/no es el historiador Emilio Gentile/i.test(tc), 'y el careo avisa de que los dos Gentile son personas distintas', 'el careo confunde a los dos Gentile sin avisar');
      ok(/23 de marzo de 1919/.test(tc), 'ancla real: la fundación de los Fasci el 23 de marzo de 1919', 'falta la fecha de fundación de los Fasci');
      ok(/29 de octubre de 1922/.test(tc) && /Víctor Manuel III/.test(tc) && /Marcha sobre Roma/.test(tc),

      ok(/37,3/.test(tc) && /33,1/.test(tc) && /30 de enero de 1933/.test(tc) && /Hindenburg/.test(tc),
         'anclas reales: los dos porcentajes de 1932 y el nombramiento de Hitler', 'faltan las cifras electorales y el nombramiento de 1933');
      ok(/Mosley/.test(tc) && /1932/.test(tc) && /Degrelle/.test(tc) && /1935/.test(tc),
         'anclas reales: Mosley (1932) y Degrelle (1935), que no gobernaron', 'faltan los movimientos que nunca gobernaron');
      ok(/Legión del Arcángel Miguel/.test(tc) && /1927/.test(tc) && /Antonescu/.test(tc) && /1941/.test(tc),
         'ancla real: la Legión rumana, con Antonescu y sus cinco meses', 'falta el caso rumano con sus fechas');
      ok(/19 de abril de 1937/.test(tc), 'ancla real: el Decreto de Unificación del 19 de abril de 1937', 'falta el Decreto de Unificación');
      ok(/parafascistas/i.test(tc), 'ancla real: Franco y Salazar como parafascistas', 'falta el caso ibérico');

      ok(/ningún político vivo del país se le reparte etiqueta/i.test(tc),
         'y el cierre declara el cero partidismo hondureño actual', 'el careo no declara el cuidado con los vivos del país');

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');

       lectura, y el mensaje mandaría a buscar el fallo donde no está. */
    ok(!!d.querySelector('link[href*="lecturas-marcador.css"]'), 'y la hoja del marcador', 'falta css/lecturas-marcador.css');
    ok(!!d.querySelector('script[src*="lecturas-marcador.js"]'), 'y el aparato del marcador', 'falta js/lecturas-marcador.js');

       zonas y no protesta. El orden solo se ve en las etiquetas. */
    const guionesJs = [...d.querySelectorAll('script[src]')].map(el => el.getAttribute('src') || '');
    const iAparato = guionesJs.findIndex(x => /lecturas\.js/.test(x));
    const iMarcador = guionesJs.findIndex(x => /lecturas-marcador\.js/.test(x));

    /* Todas cerradas al entrar: es la mitad del encargo, porque seis textos
       largos abiertos de golpe son veinte pantallas de alto en un teléfono. Y

    ok(!d.querySelector('#lcQ, #lfQ, #laQ'), 'y ya no hay una batería suelta al final de la sección', 'sigue la batería vieja al final');

    /* Contestar de verdad, en el cuento de Borges, y que pague XP. */

    const bloqueC = borgesCard.querySelector('.lect-bloque[data-b="c"]');
    ok(/Pregunta 1 de 5/.test(bloqueC.querySelector('.lect-prog').textContent), 'la comprensión de la lectura cuenta 5', 'contador: ' + bloqueC.querySelector('.lect-prog').textContent);
    ok(bloqueC.querySelectorAll('.lect-opt').length === 4, 'con sus cuatro opciones', 'opciones: ' + bloqueC.querySelectorAll('.lect-opt').length);
    const xp0 = dentro('xp');
    const claveB = dentro('lectComprensionBank.filter(q => q.t === "Borges")[0].c');
    bloqueC.querySelectorAll('.lect-opt')[claveB].click();
    bloqueC.querySelector('.lect-verifica').click();
    await esperar(300);
    ok(dentro('xp') > xp0, 'la respuesta correcta suma XP', 'la comprensión no dio XP');
    ok(!!bloqueC.querySelector('.lect-opt-ok'), 'y marca la acertada', 'no marca la correcta');

    const bloqueF = borgesCard.querySelector('.lect-bloque[data-b="f"]');
    ok(bloqueF.querySelector('.lect-enun').textContent.indexOf('___') >= 0, 'completar pinta su hueco', 'completar sin hueco');
    const xp1 = dentro('xp');
    bloqueF.querySelector('.lect-input').value = dentro('lectCompletarBank.filter(q => q.t === "Borges")[0].a');
    bloqueF.querySelector('.lect-verifica').click();
    await esperar(300);
    ok(dentro('xp') > xp1, 'completar suma XP con la respuesta buena', 'completar no dio XP');

    const bloqueA = borgesCard.querySelector('.lect-bloque[data-b="a"]');
    ok(/sin XP/.test(bloqueA.querySelector('.lect-prog').textContent), 'el análisis avisa de que no da XP', 'el análisis no avisa');
    ok(bloqueA.querySelector('.lect-pauta').hidden, 'y su pauta empieza tapada', 'la pauta se ve sin pedirla');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');

    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖, aunque cruce una negrita', 'salió más de un marcador');

      const hent = abiertos[abiertos.length - 1] || '';
      ok(/Las razones del adversario/.test(hent) && /Bobbio/.test(hent) && /GABILONDO\./.test(hent),
         'la entrevista se imprime con su texto completo', 'la entrevista no se imprime');

      w.imprimirLectura('gala');

      /* Cada lectura se imprime con SUS preguntas y su pauta en hoja aparte

         && /Las razones del adversario/.test(h3) && /Los nombres que muerden/.test(h3)
         && /Se define el fascismo por lo que dice o por lo que hace/.test(h3),
         'las seis lecturas se imprimen juntas en un solo pliego', 'el pliego de las seis no sale completo');
      ok((h3.match(/page-break-before/g) || []).length >= 5, 'y cada una arranca en su propia hoja', 'las seis salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h3), 'y el pliego declara el pastiche de las tres voces clásicas', 'el pliego no declara el pastiche');
      ok(/nunca ocurrieron/i.test(h3), 'y declara que los encuentros de las entrevistas nunca ocurrieron', 'el pliego no declara la ficción de las entrevistas');
      ok(/careo/i.test(h3) && /papeles y no personas/i.test(h3),

      ok(/Bobbio/.test(h3) && /Gala/.test(h3), 'y nombra a los invitados de esta etapa, no a los de otra misión', 'el pliego trae los invitados de otra misión');

      w.imprimirPreguntasLecturas();

      /* El pliego numera él mismo cada pregunta. Si el enunciado del banco

      const txt = casos.textContent;
      ['90,000', '25,000', '15,000', 'borrador', 'comunista', 'fascista', 'media página', 'Angelly', 'himno', 'muñeco']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/L \d/.test(txt), 'los casos traen números en lempiras', 'los casos no traen lempiras');
      ok(/hoja del mapa/i.test(txt), 'trae la hoja del mapa', 'falta la hoja del mapa');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/regla de pago/i.test(txt), 'trae la regla de pago', 'falta la regla de pago');
      /* El giro hacia adentro es el cuidado central del compendio: uno de los
         ocho casos tiene que dibujar la familia de la propia casa, y con el
         ideario MÁS PARECIDO, que es donde de verdad cuesta. */
      ok(/más parecid/i.test(txt) && /(propia|esta casa)/i.test(txt),
         'al menos un caso gira el detector hacia la propia casa, con el más parecido', 'ningún caso dibuja la familia propia');
      /* La regla de la casa, doble en esta etapa. */
      ok(/históricos o de fuera/i.test(txt) && /pol[íi]tico vivo/i.test(txt),
         'los casos declaran la regla del cero partidismo actual', 'los casos no declaran de dónde salen los textos');
      ok(/estatus de ensayo|ensayo, no una prueba/i.test(txt),
         'y uno de los casos rechaza usar la lista de Eco como termómetro', 'ningún caso defiende el estatus de ensayo');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/90,000|25,000|15,000|Angelly|borrador/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    /* La linterna enseña el número que le toca a cada tarjeta, y cobra su
       precio: esa secuencia deja de dar XP, y se dice en pantalla. */
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/LIBERALISMO/.test(banda) && /POPULISMO/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/MILL|BURKE|ANDERSON|PAXTON|MUDDE/.test(banda), 'y trae los autores del mapa', 'la banda no nombra a los autores');
    ok(/IDEOLOG[ÍI]A DELGADA/.test(banda), 'y la ideología delgada', 'la banda no nombra la ideología delgada');
    ok(!/GALLIE|FREEDEN|DESCONTESTACI|N[ÚU]CLEO · ADYACENTES/.test(banda), 'sin las palabras de la etapa 2 de la ruta', 'la banda sigue siendo la de la etapa 2');
    ok(!/DESTUTT|MEHRING|C[ÁA]MARA OSCURA|SOCIEDAD ABIERTA|RACIONALISMO CRÍTICO|EL ACERO/.test(banda),
       'sin las palabras de las misiones viejas', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-gafas-mapa-familias.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja del mapa, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja del mapa en blanco', 'falta la hoja del mapa');
    ok(/Una hoja del mapa ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/plantilla de la media página de acero/i.test(txtF), 'la ficha trae la plantilla de la media página de acero', 'falta la plantilla de acero');
    ok(/Una plantilla de ejemplo, ya llena/i.test(txtF), 'y una plantilla ya llena', 'falta la plantilla llena');
    ok(/las siete familias/i.test(txtF) && /mejor versión/i.test(txtF), 'la ficha trae las siete familias por su mejor versión', 'faltan piezas del temario');
    ok(/comunidades imaginadas/i.test(txtF) && /industrializaci/i.test(txtF), 'la ficha trae el pleito de 1983', 'falta el pleito de Anderson y Gellner');
    ok(/ideología delgada/i.test(txtF) && /anfitriona/i.test(txtF), 'la ficha trae el populismo delgado', 'falta el populismo delgado');
    ok(/estatus de ensayo/i.test(txtF) && /no de ciencia/i.test(txtF), 'la ficha respeta el estatus de ensayo de Eco', 'la ficha no etiqueta a Eco como ensayo');
    ok(/muñeco/i.test(txtF), 'la ficha explica la señal del muñeco', 'la ficha no explica el muñeco');
    ok(/históricos o de fuera/i.test(txtF), 'la ficha declara de dónde salen los textos de entrenamiento', 'la ficha no declara la regla del cero partidismo');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/\u2014/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok(/clásico sólido/i.test(txtF) && /académico sólido/i.test(txtF) && /tesis discutida/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/Gallie|Berlin|bisturí de Freeden|descontestaci/i.test(txtF.replace(/2 · El bisturí de Freeden/g, '')),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos de la etapa 2');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-gafas-mapa-familias"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta de las Gafas a la Vista/.test(c.textContent));
    ok(!!ruta, 'la Ruta de las Gafas a la Vista está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 3, 'con sus etapas 1, 2 y 3 ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 4, 'y 4 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/La palabra con expediente/.test(ruta.textContent) && /El bisturí de Freeden/.test(ruta.textContent) && /El mapa de las familias/.test(ruta.textContent),
         'las etapas 1, 2 y 3 salen con el título de su misión', 'alguna etapa construida no toma el título de MISSIONS');
      ok(/El eje y la gente sin mapa/.test(ruta.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      /* La cuenta sale del CATÁLOGO y no escrita a mano: con trece escritas,
         la sonda suspendía en cuanto se construía una misión más, sin que
         hubiera nada roto (norma 7). */
      const delMayor = wa.eval('MISSIONS.filter(m=>m.materia==="mayor").length');
      ok(tarjetas.length === delMayor, 'la materia muestra sus ' + delMayor + ' misiones', 'muestra ' + tarjetas.length + ' de ' + delMayor);
      const t = tarjetas.find(x => /mapa de las familias/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /🧬/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda mapa de las familias etapa 3';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda mapa de las familias etapa 3'; }
});
</script>
</body>
</html>
