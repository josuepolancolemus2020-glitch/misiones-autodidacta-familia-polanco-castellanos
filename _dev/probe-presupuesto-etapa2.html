<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Poder, etapa 2</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-poder-presupuesto/presupuesto.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta del Poder: bancos, laboratorio, pruebas
   impresas con su propio nombre, casos del proyecto, ficha, la aplicación con
   DOS etapas construidas, y que las cuentas de la misión cuadren entre sí. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try { appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' })); } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 15, '15 secciones (las 14 del molde y Casos del proyecto)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Poder · Etapa 2 de 6/.test(d.body.textContent), 'se presenta como etapa 2 de 6', 'no se presenta como etapa de la ruta');
    ok(!/anclaje|costo hundido|sala de espejos|superviviente/i.test(d.body.textContent), 'sin restos de la etapa de la que se copió', 'quedan textos de Sesgos');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('Object.keys(parteData).join(",")') === 'fijos,variables,hora,equilibrio', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'las 7 piezas del presupuesto', 'piezas: ' + dentro('timelineData.length'));
    ok(/faro_eco_presupuesto/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LAS CUENTAS CUADRAN ──');
    /* Una misión de presupuesto que se contradiga a sí misma no sirve: el juego
       de números es fijos 750, hora 100, cuota 150, soporte 50, margen 100,
       equilibrio 8 aulas. Se comprueba en el texto y en los bancos. */
    const texto = d.body.textContent.replace(/\s+/g, ' ');
    ok(/750/.test(texto) && /100 lempiras la hora|hora a 100|100 la hora/i.test(texto), 'usa los fijos de 750 y la hora de 100', 'no aparecen los números base');
    ok(/ocho aulas/i.test(texto), 'el punto de equilibrio son ocho aulas', 'no dice ocho aulas');
    ok(!/hacen falta .{0,12}(cinco|nueve) aulas/i.test(texto), 'no queda la cuenta vieja de cinco ni de nueve aulas', 'quedó una cuenta que no cuadra');
    const bancos = dentro('JSON.stringify(qzData) + JSON.stringify(evalMCBank) + JSON.stringify(evalCPBank)');
    ok(/8 aulas|ocho aulas/.test(bancos), 'los bancos preguntan por el equilibrio real', 'los bancos no usan el equilibrio de la casa');
    ok(/2\.?250 fichas|2250/.test(bancos), 'los bancos usan el plazo de retorno de la impresora', 'falta la cuenta de la impresora en los bancos');

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/Los costos fijos/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en los costos fijos', 'abre en otra pieza');
    w.go('s-quiz'); await esperar(150);
    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');
    w.go('s-evaluacion'); await esperar(200);
    w.genEval(); await esperar(300);
    ok(d.getElementById('evalOut').textContent.length > 200, 'la evaluación final se genera', 'evaluación vacía');
    w.genEvalCrit(); await esperar(300);
    const crit = d.getElementById('evalCritOut').textContent;
    ok(crit.length > 200, 'la cuenta sobre la mesa se genera', 'prueba competencial vacía');
    const rotulos = d.getElementById('eval-screen-title').textContent + d.getElementById('evalcrit-screen-title').textContent +
                    d.getElementById('evalOut').textContent + crit + d.querySelectorAll('.eval-print-header')[0].textContent;
    ok(!/Las seis palancas|Panorama|La puerta de la casa digital|La máquina que predice|Quién decide de verdad|Para quién y qué le cambia|Sesgos/.test(rotulos), 'los rótulos de prueba llevan el nombre correcto', 'las pruebas traen el nombre de otra misión');

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      const cajas = casos.querySelectorAll('.card');
      ok(cajas.length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + cajas.length);
      const txt = casos.textContent;
      ['150 lempiras al mes por aula', '4.500', 'una ficha impresa', '800 lempiras por maestro', 'anuncios', 'hospedaje', '8.000', 'la hora que no se cobra']
        .forEach(k => { if (!new RegExp(k, 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok((txt.match(/Lo que enseña la cuenta/g) || []).length >= 6, 'cada caso cierra con lo que enseña', 'cierres: ' + (txt.match(/Lo que enseña la cuenta/g) || []).length);
      ok(/realistas pero inventadas/i.test(txt), 'avisa de que las cifras son realistas pero inventadas', 'falta el aviso sobre los números');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
      ok(/cinco reglas del presupuesto/i.test(txt), 'trae las cinco reglas', 'faltan las cinco reglas');
      ok(/planilla del costo real/i.test(txt), 'trae la planilla del costo real', 'falta la planilla');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/750|4\.500|8\.000/.test(decisiones), 'el banco de decisiones usa las cuentas del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-poder-presupuesto.html');
    const txt = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txt.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txt.match(/class="pagina"/g) || []).length);
    ok(/Planilla del costo real/i.test(txt), 'la ficha trae la planilla del costo real', 'la ficha no trae la planilla');
    ok(/Presupuesto de doce meses/i.test(txt), 'la ficha trae el presupuesto de doce meses', 'falta el presupuesto de doce meses');
    ok(/Pauta completa de respuestas/.test(txt), 'trae su pauta', 'sin pauta');
    const rec = d.querySelector('#s-recursos a[href*="ficha-poder-presupuesto"]');
    ok(!!rec, 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const cards = [...da.querySelectorAll('.ruta-card')];
    const casa = cards.find(c => /Ruta del Poder$|Ruta del Poder\b/.test(c.querySelector('.ruta-nombre').textContent));
    ok(!!casa, 'la Ruta del Poder está en el mapa', 'no aparece la ruta');
    if (casa) {
      /* Cuentas del CATÁLOGO, no a mano (la lección de la Casa Cerrada). */
      const construidasCat = wa.eval('MISSIONS.filter(m => m.ruta === "poder").length');
      const totalCat = wa.eval('RUTAS.poder.etapas');
      ok(casa.querySelectorAll('.re-link').length === construidasCat, 'con sus ' + construidasCat + ' etapas construidas ya tocables', 'etapas tocables: ' + casa.querySelectorAll('.re-link').length + ' de ' + construidasCat);
      ok(casa.querySelectorAll('.ruta-etapa-futura').length === totalCat - construidasCat, 'y el resto por construir, con nombre', 'futuras: ' + casa.querySelectorAll('.ruta-etapa-futura').length + ', se esperaban ' + (totalCat - construidasCat));
      ok(/El presupuesto real/.test(casa.textContent), 'la etapa 2 sale con el título de la misión', 'la etapa 2 sigue saliendo como prevista');
      ok(/La deuda por dentro/i.test(casa.textContent), 'las siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
    }
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="eco"]');
    ok(!!chip, 'la materia Poder Económico tiene su chip', 'no hay chip de Poder Económico');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      const enMateriaCat = wa.eval('MISSIONS.filter(m => m.materia === "eco").length');
      ok(tarjetas.length === enMateriaCat, 'la materia muestra sus ' + enMateriaCat + ' misiones', 'muestra ' + tarjetas.length);
      const pres = tarjetas.find(t => /presupuesto real/i.test(t.textContent));
      ok(!!pres && /🔒/.test(pres.textContent), 'la misión del presupuesto lleva el sello familiar (candado)', 'la misión no muestra el candado');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
  } catch (e) { fallos++; log('✘ ' + e.message + '\n' + e.stack); }
  /* El veredicto va en el título porque es lo que se lee al correr las sondas
     en tanda: un cuerpo verde con la pestaña de siempre sale como no aprobada. */
  document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Poder etapa 2';
});
</script>
</body>
</html>
