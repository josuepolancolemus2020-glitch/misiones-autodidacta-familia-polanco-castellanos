   comprobaciones del apartado 11 de PLAN-LA-CONSIGNA.md, la 23, ☑ Elegir

   cuento para Gemini Storybook, del 26 de septiembre.

   Como las vecinas (Cuadernos, La Voz Prestada): abre el index.html DE
   VERDAD en UN marco, con una base de mentira a nivel de fetch, una sesión
   de mentira, el portapapeles, window.open y navigator.share apuntados y
   confirm() contado; PULSA los botones y mide con getBoundingClientRect y
   elementFromPoint con la vista abierta de verdad; y de cada prueba mira lo
   que QUEDÓ —en el DOM, en el almacén o en lo que viajó a la base— y no lo
   que la pantalla dice que pasó.

   ⚠️ LA BASE DE MENTIRA EXIGE LO QUE EXIGE LA DE VERDAD, y lo que exige lo
   saca del propio supabase/sql/consigna.sql (las columnas, sus tipos, los
   `not null`, los `default` y los `check`): 42P01 sin la tabla; 42703 al
   leer una columna que no está (y PGRST204 al escribirla, que es lo que
   contesta PostgREST); 23502 sin `autor`; 23514 si un `check` muerde,
   midiendo los jsonb como jsonb::text; 22007 si `eliminado_at` no es una
   fecha. Un doble complaciente esconde la costura (La Voz Prestada, regla
   13): una base que aceptara cualquier cosa aprobaría la subida que la de
   verdad rebota. Si el SQL no se puede leer, la sonda SUSPENDE. Y puede
   hacer ESPERAR las bajadas (puertaBajada): la nube que llega tarde, que
   es la de una tableta con mala señal.

   ⚠️ UN SOLO MARCO. Al cambiar la base (sin tabla → puesta → vieja →
   colgada) se reutiliza y se vuelve a llamar a initConsigna(), como manda
   el §11: un segundo index.html del mismo origen se queda colgado y la
   sonda no llega a poner su veredicto. Donde hay que «volver a arrancar»
   (la lápida que tiene que ganar, el borrador que sobrevive a recargar) se
   hace lo que hace un arranque con el estado del módulo: la memoria se
   vacía y el aparato (localStorage) se queda.

   Las secciones se CORREN en el orden que pide el estado (sin tabla antes
   que puesta, los usos antes de la bitácora), y cada una dice su número
   del §11; al final se resumen en orden. Termina con APRUEBA o SUSPENDE
   DELANTE en el título. */

/* La diferencia exacta: un fallo de una línea en blanco no se busca a ojo. */
function diff(a, b) {
  a = String(a); b = String(b);
  if (a === b) return '';
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return 'primera diferencia en el carácter ' + i + ' (renglón ' + a.slice(0, i).split('\n').length + ')\n' +
    'salió:    ' + JSON.stringify(a.slice(Math.max(0, i - 40), i + 60)) + '\nesperado: ' + JSON.stringify(b.slice(Math.max(0, i - 40), i + 60));
}
const igual = (a, b, msg) => ok(a === b, msg, diff(a, b));
const esperar = ms => new Promise(r => setTimeout(r, ms));
async function hasta(cond, ms, paso) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 3000)) { try { if (cond()) return true; } catch (e) {} await esperar(paso || 40); }
  try { return !!cond(); } catch (e) { return false; }
}

/* Cada tramo se encierra: una sección que revienta a medias dice SUSPENDE
   y la sonda sigue con la siguiente, en vez de quedarse sin veredicto. */
async function tramo(n, titulo, fn) {
  secc = n;
  log('\n── ' + n + '. ' + titulo + ' ──');
  try { await fn(); }
  catch (e) {
    ok(false, 'la sección ' + n + ' terminó sin reventar', String(e && e.stack || e).split('\n').slice(0, 4).join('\n'));
    try { await limpiaPantalla(); } catch (e2) {}
  }
}
function termina() {
  const v = fallos ? 'SUSPENDE' : 'APRUEBA';
  const filas = Object.keys(NOMBRES).map(Number).filter(n => porSeccion[n]).sort((a, b) => a - b)

  const faltan = Object.keys(NOMBRES).map(Number).filter(n => n && !porSeccion[n]);
  if (faltan.length) { fallos += faltan.length; filas.push('✘ sin correr: ' + faltan.join(', ')); }
  log('\n══ Resumen por comprobación del §11 ══\n' + filas.join('\n'));
  log(`\nRESULTADO: ${fallos ? 'SUSPENDE' : 'APRUEBA'}${fallos ? ` (${fallos} fallo${fallos === 1 ? '' : 's'} de ${total})` : ` (${total} comprobaciones)`}`);

}

/* ── Lo del SQL, leído del propio archivo ─────────────────────────── */
function leeSQL(SQL) {
  const s = String(SQL || '').split('\n').map(l => l.replace(/--.*$/, '')).join('\n');
  const topes = {}, entre = {};
  let m;
  const re = /length\((\w+)(?:::text)?\)\s*<=\s*(\d+)/g;
  while ((m = re.exec(s))) topes[m[1]] = Number(m[2]);
  const t = /length\(btrim\(titulo\)\)\s*between\s*(\d+)\s*and\s*(\d+)/.exec(s);
  if (t) { entre.titulo = [Number(t[1]), Number(t[2])]; topes.titulo = Number(t[2]); }
  const re2 = /check \((?:length\()?(\w+)\)?\s+between\s+(\d+)\s+and\s+(\d+)\)/g;
  while ((m = re2.exec(s))) { entre[m[1]] = [Number(m[2]), Number(m[3])]; if (m[1] !== 'id') topes[m[1]] = Number(m[3]); }
  const minimos = {};
  const re3 = /check \((\w+)\s*>=\s*(\d+)\)/g;
  while ((m = re3.exec(s))) minimos[m[1]] = Number(m[2]);
  const cols = [], tipos = {}, noNulas = new Set(), defectos = {};
  const cuerpo = /create table if not exists public\.consigna_piezas \(([\s\S]*?)\n\);/.exec(s);
  if (cuerpo) {
    /* Una columna puede llevar su check en el renglón de abajo: se junta
       cada columna con sus renglones de continuación antes de leerla. */
    const trozos = [];
    cuerpo[1].split('\n').forEach(l => {
      if (/^\s*[a-z_]+\s+(text|jsonb|integer|bigint|boolean|timestamptz)\b/.test(l)) trozos.push(l);
      else if (trozos.length && l.trim()) trozos[trozos.length - 1] += ' ' + l.trim();
    });
    trozos.forEach(l => {
      const x = /^\s*([a-z_]+)\s+(text|jsonb|integer|bigint|boolean|timestamptz)\b(.*)$/.exec(l);
      cols.push(x[1]); tipos[x[1]] = x[2];
      if (/not null|primary key/.test(x[3])) noNulas.add(x[1]);
      let dm;
      if ((dm = /default\s+'([^']*)'::jsonb/.exec(x[3]))) defectos[x[1]] = JSON.parse(dm[1]);
      else if ((dm = /default\s+'([^']*)'/.exec(x[3]))) defectos[x[1]] = dm[1];
      else if ((dm = /default\s+(\d+)/.exec(x[3]))) defectos[x[1]] = Number(dm[1]);
      else if ((dm = /default\s+(true|false)/.exec(x[3]))) defectos[x[1]] = dm[1] === 'true';
      else if (/default\s+now\(\)/.test(x[3])) defectos[x[1]] = '__ahora__';
    });
  }
  return { topes, entre, minimos, cols, tipos, noNulas, defectos };
}
/* La medida de PostgreSQL, escrita aquí aparte: el TEXTO que escribe
   jsonb («": "» y «", "» con su espacio), contado en puntos de código.
   Independiente de csgLargoBase: si la del aparato se torciera, la base
   de mentira rebotaría lo que la de verdad rebota. */
function pgTexto(v) {
  if (v === null || v === undefined) return 'null';
  if (Array.isArray(v)) return '[' + v.map(x => pgTexto(x === undefined ? null : x)).join(', ') + ']';
  if (typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ': ' + pgTexto(v[k])).join(', ') + '}';
  return JSON.stringify(v);
}
const pgLargo = v => Array.from(pgTexto(v)).length;
const cpL = s => Array.from(String(s == null ? '' : s)).length;

/* El contador de palabras de la prueba de Node, escrito aparte de
   csgPalabras: si ésta se estropeara, la cuenta no aprobaría por usar la
   misma función rota en los dos lados. */
const ETQ = /<\/?[A-Za-z_][\w.:-]*(?:\s[^<>]*)?\/?>/g;
const sinTildes = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const cuentaP = t => String(t || '').replace(ETQ, ' ').split(/\s+/).filter(x => /[\p{L}\p{N}]/u.test(x)).length;
const bolsa = t => (String(t || '').replace(ETQ, ' ').match(/[\p{L}\p{N}]+/gu) || []).map(x => sinTildes(x).toLowerCase());

     (GET) esperan, y al cumplirse contestan con lo que haya ENTONCES en la

    const cols = colsVivas();

    }

    for (const c of Object.keys(f)) {

      if (v === null) continue;
      if (tipo === 'text' && typeof v !== 'string') return [400, '22P02', 'invalid input syntax for type text: ' + c];
      if ((tipo === 'integer' || tipo === 'bigint') && !(typeof v === 'number' && Number.isInteger(v))) return [400, '22P02', 'invalid input syntax for type ' + tipo + ': "' + v + '" (' + c + ')'];
      if (tipo === 'boolean' && typeof v !== 'boolean') return [400, '22P02', 'invalid input syntax for type boolean (' + c + ')'];
      if (tipo === 'timestamptz' && (typeof v !== 'string' || isNaN(Date.parse(v)))) return [400, '22007', 'invalid input syntax for type timestamp with time zone: "' + v + '"'];
      if (tipo === 'jsonb' && !Array.isArray(v)) return chk(c);
      if (SQLD.entre[c]) {
        const n = c === 'titulo' ? cpL(String(v).trim()) : (typeof v === 'number' ? v : cpL(v));
        if (n < SQLD.entre[c][0] || n > SQLD.entre[c][1]) return chk(c);
      } else if (SQLD.topes[c] !== undefined) {
        const n = tipo === 'jsonb' ? pgLargo(v) : cpL(v);

      }
      if (SQLD.minimos[c] !== undefined && v < SQLD.minimos[c]) return chk(c);
    }
    return null;
  }
  async function base(u, metodo, cabs, cuerpo) {
    const l = { tabla: true, metodo, ruta: u.pathname + u.search, cuerpo, prefer: cabs.get('Prefer') || '', onConflict: u.searchParams.get('on_conflict'), estado: 0, codigo: '' };
    llamadas.push(l);
    if (modo === 'cuelga') return new Promise(() => {});       // la petición que NO VUELVE
    if (modo === 'sin-tabla') return rebota(404, '42P01', 'relation "public.consigna_piezas" does not exist', l);
    if (metodo === 'GET' && puertaBajada) await puertaBajada;
    const cols = colsVivas();
    if (metodo === 'GET') {
      const pedidas = String(u.searchParams.get('select') || '*').split(',').map(x => x.trim()).filter(Boolean);
      const falta = pedidas.find(c => c !== '*' && cols.indexOf(c) < 0);
      if (falta) return rebota(400, '42703', 'column consigna_piezas.' + falta + ' does not exist', l);

      if (l.onConflict && l.onConflict !== 'id') return rebota(400, '42P10', 'there is no unique or exclusion constraint matching the ON CONFLICT specification', l);
      const columnas = (u.searchParams.get('columns') || '').split(',').map(x => x.replace(/"/g, '').trim()).filter(Boolean);
      const noCol = columnas.find(c => cols.indexOf(c) < 0);
      if (noCol) return rebota(400, 'PGRST204', "Could not find the '" + noCol + "' column of 'consigna_piezas' in the schema cache", l);

        const ya = tabla.get(fila.id);

        Object.keys(fila).forEach(c => { nueva[c] = JSON.parse(JSON.stringify(fila[c])); });
        nueva.actualizado_at = new Date().toISOString();

    function toca(x, y) {

      /* ⚠️ RETIRAR NO TIRA LO QUE ESTABA A MEDIO ESCRIBIR. Se corrige TC en el

    [T2, T3, TA].forEach(t => { if (marcada(t)) nodo(t).click(); });
    await esperar(80);

    /* ── 8. LOS PÍXELES ── */
    for (const px of [390, 320]) {

    ok(!eligiendo() && !g('csgElegActivo()') && fabDisp() !== 'none' && barraE().hidden && !!anq().querySelector('.csg-ficha .csg-ficha-pie') && !anq().querySelector('[role="checkbox"]'),

    ok(activa('view-inicio') && !eligiendo() && !g('csgElegActivo()') && fabDisp() !== 'none',
      '⚠️ irse a Inicio con el modo puesto (switchView) lo apaga: FUERA de La Consigna el botón de Destellos se ve (' + fabDisp() + ')',

  /* ══════════════════════════════════════════════════════════════
     24 · EL CUENTO PARA GEMINI STORYBOOK (pedido el 26 de septiembre de
     2026: «prompts específicamente para Gemini Storybook… el tema de la
     historia, la extensión, las sensaciones, la edad del público, el
     aprendizaje o lección»)
     ──────────────────────────────────────────────────────────────
     Ordenado por gravedad:
     1. que se abra ANTES de copiar, o que lo copiado no sea lo que se ve:
        Storybook no recibe el texto en la dirección, así que lo que no
        está en el portapapeles no llega a ninguna parte;
     2. que Storybook se quede como «la última máquina» del aparato: el
        Rápido siguiente nacería para una máquina que solo hace libros;
     3. que el renglón del cuento no se vea o no se pueda tocar a 320 px;
     4. que el cuento no abra con sus cinco obligatorios abiertos y el foco
        dentro del toque;
     5. que lo armado para Storybook, pegado otra vez, no vuelva a ser un
        cuento;
     6. que «¿Cuál elijo?» no lleve a él, o que cambiar de molde cambie la
        máquina sin decirlo.
     Corre después de la 23: crea piezas, y la 23 cuenta las suyas.
     ══════════════════════════════════════════════════════════════ */
  await tramo(24, '🧸 El cuento para Gemini Storybook: el renglón, el molde, la máquina, copiar antes de abrir y la última que no cambia', async () => {
    await ancho(320);
    if (!activa('view-consigna')) await entrar();
    const ultimaAntes = g('csgMaquinaUltima()');
    ok(ultimaAntes === 'claude', 'la última máquina de este aparato, antes de empezar, es Claude (la dejó así la 12)', ultimaAntes);

    /* 3 · El renglón, a 320 px. */
    pulsa($('csg-nueva-btn'), '＋ de la cabecera');
    await esperar(150);
    const fila = d.querySelector('#csg-ver-cuerpo .csg-ver-fila-cuento');
    const hoja = $('csg-ver-overlay').querySelector('.fin-modal').getBoundingClientRect();
    const rf = fila ? fila.getBoundingClientRect() : null;
    const bal = [...d.querySelectorAll('#csg-ver-cuerpo .csg-clase-baldosa')].map(b => b.getBoundingClientRect());
    ok(!!fila && /Un cuento para Gemini Storybook/.test(fila.textContent) && /diez páginas ilustradas que emocionan y enseñan/.test(fila.textContent),
      'en ＋ Nueva está el renglón «🧸 Un cuento para Gemini Storybook», con lo que hace', fila && fila.textContent);
    ok(!!rf && rf.height >= 44 && rf.left >= hoja.left - 0.5 && rf.right <= hoja.right + 0.5 && rf.right <= 320.5 && bal.length === 4 && bal.every(b => b.bottom <= rf.top + 0.5),
      'a 320 px mide ' + (rf ? Math.round(rf.height) : '?') + ' de alto, cabe en la hoja y va DEBAJO de las cuatro baldosas', JSON.stringify(rf && [rf.left, rf.right, rf.top, rf.height].map(Math.round)));
    const enF = fila ? enPunto(fila) : null;
    ok(!!enF && fila.contains(enF), 'y en su centro está el propio renglón (elementFromPoint): no lo tapa nada', enF && (enF.className || enF.tagName));

    /* 4 · El compositor, con el foco dentro del toque. */
    fila.click();
    const focoEnSeguida = d.activeElement === ta('tema');
    ok(activa('view-consigna-editor') && g('_csgEdPieza.molde') === 'cuento' && g('_csgEdPieza.maquina') === 'storybook', 'un toque abre el compositor con el Cuento que enseña y la máquina Storybook');
    ok(focoEnSeguida, 'con «Tema de la historia» enfocado DENTRO del toque', 'el foco está en: ' + (d.activeElement && (d.activeElement.className || d.activeElement.tagName)));
    const chM = d.querySelector('#csg-ed .csg-ed-molde');
    ok(!!chM && /Molde: Cuento que enseña/.test(chM.textContent), 'el chip dice «' + (chM && chM.textContent) + '»');
    const chS = [...d.querySelectorAll('#csg-ed .csg-chip')].find(c => c.textContent === 'Storybook');
    ok(!!chS && chS.getAttribute('aria-pressed') === 'true', 'y el chip de máquina «Storybook» va puesto');
    const abiertos = ['tema', 'audiencia', 'leccion', 'emociones', 'extension'];
    const plegados = ['personaje', 'escenario', 'concepto', 'tono', 'desenlace', 'ilustracion', 'reglas'];
    ok(abiertos.every(id => !!ta(id)) && plegados.every(id => !ta(id) && !!carta(id)), 'los cinco obligatorios —los que pidió el autor— abiertos; los siete del oficio, plegados',
      'abiertos: ' + abiertos.filter(id => ta(id)).join(',') + ' · plegados: ' + plegados.filter(id => !ta(id)).join(','));
    igual(ta('extension') ? ta('extension').value : '', 'Diez páginas, una escena por página, con el texto justo para leerlo en voz alta sin cansar.', 'la Extensión nace rellena');
    escribe(ta('tema'), 'Un cuento que explique por qué llueve, contado por una gota de agua que tiene miedo de caer.');
    escribe(ta('audiencia'), 'Niños de 6 a 8 años que empiezan a leer solos.');
    escribe(ta('leccion'), 'Que el agua que cae es la misma que subió.');
    escribe(ta('emociones'), 'Curiosidad al principio y asombro al final.');
    const repC = () => w.csgRevisar(g('_csgEdPieza'), 'storybook');
    const r0 = repC();
    ok(!r0.para.length && r0.avisa.some(x => x.bloque === 'personaje') && r0.avisa.some(x => x.bloque === 'concepto'),
      'con los cinco obligatorios no para nada, y avisa de lo que falta para que sea un cuento: el protagonista y lo que explica', JSON.stringify(r0.para.concat(r0.avisa).map(x => x.msg)));
    escribe(await abreBloque('personaje'), 'Gotita, una gota de agua redonda y transparente.');
    escribe(await abreBloque('concepto'), 'El ciclo del agua: el sol calienta el agua y la vuelve vapor.');
    await abreBloque('ilustracion');
    const chipAc = [...carta('ilustracion').querySelectorAll('.csg-frase')].find(c => /En acuarela, con colores suaves\./.test(c.title || c.textContent));
    pulsa(chipAc, 'el chip «En acuarela, con colores suaves.»');
    await esperar(60);
    ok(/En acuarela, con colores suaves\./.test(ta('ilustracion').value), 'un toque en el chip de estilo lo mete en «Ilustraciones»', ta('ilustracion').value);
    const r1 = repC();
    ok(!r1.para.length && !r1.avisa.length, 'lleno así, el repaso con Storybook ni para ni avisa', JSON.stringify(r1.avisa.map(x => x.msg)));

    /* La vista previa ES lo que se va a copiar: la cabecera delante. */
    pulsa($('csg-ed-ver'), '👁 Vista previa');
    await esperar(200);
    const pre = (d.querySelector('#csg-ed .csg-pre') || {}).textContent || '';
    ok(pre.startsWith('Crea un cuento ilustrado con estas indicaciones.\n\nTema de la historia: Un cuento que explique por qué llueve') && /\n\nIlustraciones: En acuarela, con colores suaves\.$/.test(pre),
      'la vista previa con Storybook: la cabecera, un párrafo por bloque y las Ilustraciones al final', pre.slice(0, 160));
    igual(pre, w.csgArmar(g('_csgEdPieza'), 'storybook', {}, {}).principal, 'y es carácter por carácter lo que arma csgArmar');
    /* Storybook es la cuarta máquina: a 320 px caía cortada por el borde, y
       el cuento no enseñaba a quién iba. La fila se desliza sola hasta ella. */
    const entero = (fl, nombre) => {
      const ch = fl && [...fl.querySelectorAll('.csg-chip')].find(c => c.textContent === nombre);
      if (!ch) return 'no está el chip';
      const a = fl.getBoundingClientRect(), r = ch.getBoundingClientRect();
      return r.left >= a.left - 0.5 && r.right <= a.right - 22 + 0.5 ? '' : 'chip ' + Math.round(r.left) + '..' + Math.round(r.right) + ' en una fila ' + Math.round(a.left) + '..' + Math.round(a.right) + ' (los últimos 22 son el degradado)';
    };
    const fPrev = entero(d.querySelector('#csg-ed .csg-prev-maquinas'), 'Storybook');
    ok(!fPrev, 'a 320 px, en la vista previa el chip «Storybook» se ve ENTERO: la fila se deslizó sola hasta él', fPrev);
    pulsa($('csg-ed-ver'), '✎ Bloques');
    await esperar(120);
    titulo('La gota que tenía miedo de caer');

    /* 1 · Usar: copiar ANTES de abrir, el Gem, noopener, y lo que dice el botón. */
    pulsa($('csg-ed-usar'), '▶ Usar');
    await esperar(300);
    ok(verAbierta('csg-usar-overlay'), 'se abre la hoja de Usar');
    const chU = [...d.querySelectorAll('#csg-usar-cuerpo .csg-usar-maquinas .csg-chip')].find(c => c.textContent === 'Storybook');
    ok(!!chU && chU.getAttribute('aria-pressed') === 'true', 'con Storybook marcada: es la máquina de la pieza');
    const fUsar = entero(d.querySelector('#csg-usar-cuerpo .csg-usar-maquinas'), 'Storybook');
    ok(!fUsar, '… y a 320 px se ve ENTERA en la fila de máquinas de Usar', fUsar);
    const notaU = (d.querySelector('#csg-usar-cuerpo .csg-nota') || {}).textContent || '';
    ok(/con el clip/.test(notaU) && /diez páginas/.test(notaU), 'la nota de la máquina dice qué hace Storybook y que el dibujo de referencia se sube allí', notaU);
    const bA = pieBtn(/Abrir/);
    ok(!!bA && /Abrir Storybook \(copiado: pega ahí\)/.test(bA.textContent), 'el botón dice «' + (bA && bA.textContent.trim()) + '»: el texto no va en la dirección');
    for (const px of [390, 320]) {
      await ancho(px);
      const bs = [...$('csg-usar-pie').querySelectorAll('.csg-btn')];
      const malos = bs.filter(b => { const e = enPunto(b); return !e || !b.contains(e); }).map(b => b.textContent.trim());
      ok(bs.length === 3 && !malos.length && bs.every(b => b.getBoundingClientRect().right <= px + 0.5), 'a ' + px + ' px los tres botones del pie, con «Abrir Storybook…», se ven y caben', 'tapados: ' + malos.join(', ') + ' · right: ' + bs.map(b => Math.round(b.getBoundingClientRect().right)).join('/'));
    }
    seq.length = 0;
    const na = abiertas.length, a0 = avisos.length;
    pulsa(bA, '↗ Abrir Storybook');
    await esperar(200);
    const texto = $('csg-usar-pre').textContent;
    const ab = abiertas[na] || {};
    ok(seq.join(',') === 'clip,open', 'el portapapeles se escribe ANTES de abrir la ventana', seq.join(','));
    igual(ab.u, 'https://gemini.google.com/gem/storybook', 'se abre el Gem de Storybook, pelado (el literal, sin el texto)');
    ok(ab.t === '_blank' && ab.feat === 'noopener,noreferrer', 'en otra pestaña y con noopener,noreferrer', JSON.stringify([ab.t, ab.feat]));
    ok(copiado === texto && texto.startsWith('Crea un cuento ilustrado con estas indicaciones.'), 'lo copiado es lo que se ve, con la cabecera delante');
    ok(avisos.slice(a0).some(t => /Copiado\. Si no se abrió, ve a gemini\.google\.com\/gem\/storybook y pega\./.test(t)), 'y el aviso dice adónde ir si la ventana no se abrió', avisos.slice(a0).join(' | '));
    const p = pieza('La gota que tenía miedo de caer');
    ok(!!p && p.maquina === 'storybook' && p.molde === 'cuento' && p.bitacora.length === 1 && p.bitacora[0].maquina === 'storybook',
      'la pieza se guardó para Storybook y el uso se apuntó con su máquina', JSON.stringify(p && { maquina: p.maquina, molde: p.molde, uso: p.bitacora[0] }));

    /* 2 · Storybook NO es la última máquina. */
    ok(g('csgMaquinaUltima()') === ultimaAntes && w.localStorage.getItem('faro_consigna_maquina_v1') !== 'storybook',
      'usar Storybook NO la apunta como la última: el Rápido siguiente sigue naciendo para ' + ultimaAntes, g('csgMaquinaUltima()') + ' · guardado: ' + w.localStorage.getItem('faro_consigna_maquina_v1'));
    await cierraUsar();
    await ancho(390);
    await volver();
    await nueva('prompt');
    ok(g('_csgEdPieza.maquina') === ultimaAntes && g('_csgEdPieza.molde') === 'rapido', 'y en efecto: un Rápido nuevo nace para ' + ultimaAntes + ', no para Storybook', g('_csgEdPieza.maquina'));

    /* 6 · «¿Cuál elijo?» lleva al cuento, y cambiar de molde cambia la
       máquina DICIÉNDOLO, de ida y de vuelta. */
    pulsa(d.querySelector('#csg-ed .csg-ed-molde'), 'el chip «Molde ▾»');
    await esperar(120);
    const filaC = filaMolde('Cuento que enseña');
    ok(!!filaC && /diez páginas para Gemini Storybook/.test(filaC.textContent), 'la hoja de moldes de Prompt tiene el Cuento que enseña, con su «cuándo»', filaC && filaC.textContent);
    const cual = filaVer(/¿Cuál elijo\?/);
    ok(!!cual && /cuatro preguntas de sí o no/.test(cual.textContent), '«¿Cuál elijo?» dice que son cuatro preguntas (sale de la lista, no escrito a mano)', cual && cual.textContent);
    pulsa(cual, '❓ ¿Cuál elijo?');
    await esperar(120);
    const preg = d.querySelector('#csg-ver-cuerpo .csg-cual-preg');
    ok(!!preg && /¿Es un cuento, para emocionar o para enseñar algo\?/.test(preg.textContent), 'la primera pregunta es la del cuento, la más concreta', preg && preg.textContent);
    pulsa(botonCon(preg, /^Sí$/), 'Sí');
    await esperar(120);
    ok(/Te sirve «Cuento que enseña»/.test($('csg-ver-cuerpo').textContent), 'un «Sí» dice «Te sirve «Cuento que enseña»»');
    const a1 = avisos.length;
    pulsa(filaMolde('Cuento que enseña'), 'el Cuento que enseña');
    await esperar(250);
    ok(g('_csgEdPieza.molde') === 'cuento' && g('_csgEdPieza.maquina') === 'storybook' && avisos.slice(a1).some(t => /Molde: Cuento que enseña · máquina: Storybook/.test(t)),
      'cambiar al Cuento que enseña pone Storybook, y el aviso lo dice', avisos.slice(a1).join(' | '));
    const a2 = avisos.length;
    await molde('Rápido');
    ok(g('_csgEdPieza.molde') === 'rapido' && g('_csgEdPieza.maquina') === ultimaAntes && avisos.slice(a2).some(t => new RegExp('máquina: ' + (ultimaAntes === 'claude' ? 'Claude' : '')).test(t)),
      'y volver a Rápido devuelve la última de este aparato (' + ultimaAntes + '), diciéndolo', g('_csgEdPieza.maquina') + ' · ' + avisos.slice(a2).join(' | '));
    await volver();

    /* 5 · Lo armado para Storybook, pegado otra vez, vuelve a ser un cuento. */
    pulsa(barraBtn(/Pegar/), '📋 Pegar de la barra');
    await esperar(150);
    d.querySelector('#csg-pegar-cuerpo .csg-pegar-ta').value = EJ.cuento || '';
    pulsa(botonCon($('csg-pegar-cuerpo'), /Leer$/), 'Leer');
    await esperar(150);
    const prop = (d.querySelector('#csg-pegar-cuerpo .csg-pegar-propuesta') || {}).textContent || '';
    ok(!!EJ.cuento && /Cuento que enseña · 12 de 12 bloques/.test(prop), 'el cuento del §7 pegado se lee como «' + prop + '»');
    pulsa(botonCon($('csg-pegar-cuerpo'), /Abrir en el compositor/), 'Abrir en el compositor');
    await esperar(300);
    ok(activa('view-consigna-editor') && g('_csgEdPieza.molde') === 'cuento' && g('_csgEdPieza.maquina') === 'storybook', 'y abre el compositor en el Cuento que enseña, para Storybook');
    igual(w.csgArmar(g('_csgEdPieza'), 'storybook', {}, {}).principal, EJ.cuento || '(sin ejemplo)', 'armado otra vez para Storybook, sale EXACTAMENTE lo que se pegó');
    await volver();
    await ancho(390);
  });

  /* ══════════════════════════════════════════════════════════════
     LO QUE VALE PARA TODA LA SONDA
     ══════════════════════════════════════════════════════════════ */
  secc = 0;
  log('\n── Lo que vale para toda la sonda ──');
  const malas = rechazos.filter(r => r.code !== '42P01' && r.code !== '42703');
  ok(!malas.length, 'la base de mentira no rebotó NINGUNA escritura (ni 23502 sin autor, ni 23514, ni 22007, ni una columna de más)', malas.map(r => r.code + ' ' + r.message).slice(0, 5).join('\n'));
  const noUpsert = posts().filter(l => l.onConflict !== 'id' || !/resolution=merge-duplicates/.test(l.prefer));
  ok(posts().length > 10 && !noUpsert.length, 'las ' + posts().length + ' escrituras fueron upserts con onConflict por id', noUpsert.map(l => l.ruta + ' · ' + l.prefer).slice(0, 3).join('\n'));
  const todas = posts().filter(l => l.estado === 201).map(filasDe).flat();
  ok(todas.length > 10 && todas.every(x => x.autor), 'ninguna de las ' + todas.length + ' filas que viajaron iba sin firma', todas.filter(x => !x.autor).map(x => x.id).join(','));
  ok(errores.length === 0, 'nada reventó dentro del marco', errores.slice(0, 6).join('\n'));
  log('\n(base: ' + llamadas.filter(l => l.tabla).length + ' llamadas a consigna_piezas, ' + posts().length + ' escrituras; avisos de la pantalla: ' + avisos.length + ')');
  termina();
})().catch(e => { fallos++; log('✘ la sonda reventó: ' + (e && e.stack || e)); termina(); });
</script>
