<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · un solo mensaje para todos los fallos</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/_dev/harness-login-real.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
const L = []; function log(s){ L.push(s); out.textContent = L.join('\n'); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* Los seis fallos distintos que Supabase Auth sabe distinguir. Se inyectan
   uno a uno en el cliente real (window.faroSb) y se lee qué acaba viendo
   la familia en #login-error. */
const CASOS = [
  ['correo sin confirmar (paso 3 del encabezado olvidado)',
   { message: 'Email not confirmed', status: 400, code: 'email_not_confirmed' }],
  ['contrasena incorrecta',
   { message: 'Invalid login credentials', status: 400, code: 'invalid_credentials' }],
  ['usuario todavia no creado',
   { message: 'Invalid login credentials', status: 400, code: 'invalid_credentials' }],
  ['demasiados intentos desde la misma IP',
   { message: 'Request rate limit reached', status: 429, code: 'over_request_rate_limit' }],
  ['sin red / proyecto pausado',
   { name: 'AuthRetryableFetchError', message: 'Failed to fetch', status: 0 }],
  ['servicio caido (503)',
   { name: 'AuthRetryableFetchError', message: 'Service Unavailable', status: 503 }],
];

window.addEventListener('load', async () => {
  await esperar(2500);
  const w = f.contentWindow, d = f.contentDocument;
  try {
    const sb = w.faroSb;
    log('cliente de Supabase creado: ' + !!sb);
    if (!sb) { log('sin cliente no se puede medir'); return; }

    const form = d.getElementById('login-form');
    const errEl = d.getElementById('login-error');
    const userEl = d.getElementById('login-user');
    const passEl = d.getElementById('login-pass');
    userEl.value = 'josue';

    const vistos = new Set();
    log('\n── QUE VE LA FAMILIA EN CADA FALLO ──');
    for (const [nombre, error] of CASOS) {
      let recibido = null;
      sb.auth.signInWithPassword = async (args) => {
        recibido = args;
        return { data: { user: null, session: null }, error };
      };
      errEl.hidden = true; errEl.textContent = '';
      passEl.value = 'LaContrasenaBuena123';
      form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
      await esperar(250);
      const msg = errEl.hidden ? '(sin mensaje)' : errEl.textContent.trim();
      vistos.add(msg);
      log('  · ' + nombre);
      log('      Supabase dice : ' + error.message + ' (status ' + error.status + ')');
      log('      la familia lee: "' + msg + '"');
      log('      campo borrado : ' + (passEl.value === '' ? 'si' : 'no'));
    }

    log('\n── RESULTADO ──');
    log('  fallos distintos probados : ' + CASOS.length);
    log('  mensajes distintos vistos : ' + vistos.size);
    vistos.forEach(v => log('      "' + v + '"'));

    log('\n── HAY OTRA PISTA EN ALGUN SITIO? ──');
    const src = await (await fetch('/js/auth.js')).text();
    log('  console.error/warn/log del error en auth.js : ' +
        (/console\.(error|warn|log)/.test(src) ? 'si' : 'NO'));
    log('  la variable error se usa despues de la linea 107 : ' +
        (/error\s*\.\s*(message|status|code)/.test(src) ? 'si' : 'NO'));
    log('  texto por defecto ya escrito en index.html    : ' +
        ((await (await fetch("/_dev/harness-login-real.html")).text()).includes('Revisa la contrase') ? 'si' : 'no'));
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); }
});
</script>
</body>
</html>
