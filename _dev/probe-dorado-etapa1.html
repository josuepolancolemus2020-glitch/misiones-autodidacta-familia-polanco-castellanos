<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta del Expediente Dorado, etapa 1</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-dorado-gran-fuga/gran-fuga.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 1 de la Ruta del Expediente Dorado (Crítica al
   Capitalismo, materia 27 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y cinco lecturas, con las dos
   entrevistas de la norma 5-quinquies) y las TRES BATERÍAS de la norma
   5-quater (25 de comprensión lectora, 10 de completar y 10 de análisis
   complejo), con la impresión comprobada de verdad.

   La REGLA DEL ESTATUS del compendio rige también aquí, y en esta materia
   aprieta más que en ninguna otra, porque la trampa fácil sería inventar
   una cifra redonda. Se comprueba fuente por fuente: Deaton (2013) como
   clásico sólido reciente, con su Nobel de 2015; McCloskey (2010) con la
   ETIQUETA DOBLE, sólida en los datos y con su explicación causal entrando
   COMO TESIS y no como consenso; Kocka (2016) como síntesis académica
   breve; las series del Banco Mundial y de Our World in Data SIEMPRE CON
   FECHA; el cruce Hickel contra Roser y Pinker (2019) como DISPUTA VIVA DE
   MEDICIÓN; y el tramo chino desde 1980 como dato establecido con la
   ATRIBUCIÓN en disputa. Y el pastiche de las lecturas declarado.

   Cuatro cuidados del compendio se comprueban a máquina porque gobiernan la
   misión. Uno: EL ACERO PRIMERO, que es la regla madre del arco, se enseña
   en el expediente gemelo (el rojo) y aquí se APLICA, con las facturas
   aplazadas pero declaradas con su número de etapa. Dos: DEFINIR VIENE
   ANTES QUE JUZGAR, con las cuatro piezas de Kocka y la advertencia de las
   variedades. Tres: LAS DISPUTAS SON DOS y hay que separarlas, la de la
   línea y la de la atribución. Cuatro: el modo de fallar es LA CIFRA
   SUELTA, y con él la REGLA DEL PLACER.

   Y el CERO PARTIDISMO HONDUREÑO ACTUAL, que en esta materia es doble,
   porque el compendio le añade una regla propia: los conflictos vivos del
   patio entran COMO CATEGORÍA y no como caso con nombre propio. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta del Expediente Dorado · Etapa 1 de 7/.test(d.body.textContent), 'se presenta como etapa 1 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 2 de la Ruta de los Átomos. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-atomos-hombre-maquina"], a[href*="ruta-atomos-contra-miedo"], a[href*="ruta-gafas-mapa-familias"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    ok(!/La Mettrie|Phineas Gage|brocha gorda|el agua mueve los mazos|batán|carta de Engels|Bloch|inmuniza/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la misión molde (el hombre máquina)', 'queda vocabulario de la etapa 2 de los Átomos');
    ok(!/condicionar no es determinar|la base material|lo que se levanta encima/i.test(cuerpoSinEnlaces),
       'sin las piezas de la etapa molde', 'quedan piezas de la misión molde');
    ok(!/⚙️/.test(cuerpoSinEnlaces), 'sin el emoji de la misión molde', 'queda el ⚙️ del hombre máquina fuera de los enlaces');
    /* El expediente gemelo enseña la regla del acero; aquí se APLICA y no se
       vuelve a explicar, así que su temario propio no puede haberse colado. */
    ok(!/hombre de paja|espantajo|Caplan|Farm to Factory|Holodomor|Gran Salto/i.test(cuerpoSinEnlaces),
       'sin restos del temario del Expediente Rojo', 'queda vocabulario del expediente gemelo');
    /* Y lo que SÍ tiene que quedar: la regla del acero remitida, y los
       enlaces declarados. */
    ok(/regla del acero|mejor versión primero/i.test(d.body.textContent) && /gemelo/i.test(d.body.textContent),
       'la regla del acero se remite al expediente gemelo', 'no se declara de dónde viene la regla del acero');
    ok(!!d.querySelector('#s-recursos a[href*="ruta-rojo-acero-juicio"]'),
       'Recursos enlaza el Expediente Rojo, que es el gemelo', 'falta el enlace al expediente gemelo');
    ok(/se archivan juntos/i.test(d.body.textContent) && /uno sin el otro/i.test(d.body.textContent),
       'y declara la regla de archivo: la Bóveda no acepta uno sin el otro', 'falta la regla de archivo de los dos expedientes');
    ok(!/—/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/—/g) || []).length + ' guiones largos');
    /* Cero partidismo hondureño actual, que aquí es doble: además de no
       nombrar a nadie, la materia se impone que los conflictos vivos del
       patio entren como categoría y no como caso con nombre propio. */
    const sinHibrido = d.body.textContent.replace(/h[íi]brido de partido y Estado|partido y Estado con mercado|partido-Estado/gi, '');
    ok(!/\b(partido|diputad|alcalde|candidat)[a-zóí]*\b/i.test(sinHibrido),
       'ni un político vivo ni un partido nombrado (cero partidismo actual)', 'aparece un cargo o un partido de la política de hoy');
    ok(/como categoría/i.test(d.body.textContent) && /nombre propio/i.test(d.body.textContent),
       'y la regla de selección: los conflictos del patio entran como categoría', 'falta la regla de selección de esta materia');

    log('\n── LA REGLA DEL ESTATUS, FUENTE POR FUENTE ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Deaton/.test(texto0) && /El gran escape/.test(texto0) && /2013/.test(texto0),
       'Deaton (2013) con el título de su obra', 'falta Deaton con su obra y su año');
    ok(/clásico sólido reciente/i.test(texto0) && /Nobel de Economía en 2015/.test(texto0),
       'y su etiqueta de clásico sólido reciente, con el Nobel de 2015', 'falta la etiqueta de Deaton');
    ok(/orígenes de la desigualdad/i.test(texto0),
       'y la segunda mitad del título, que es parte del argumento', 'falta la segunda mitad del título de Deaton');
    ok(/McCloskey/.test(texto0) && /Bourgeois Dignity/.test(texto0) && /2010/.test(texto0),
       'McCloskey (2010) con el título de su obra', 'falta McCloskey con su obra y su año');
    ok(/sólida en los datos/i.test(texto0) && /(tesis causal|como tesis)/i.test(texto0),
       'y con su ETIQUETA DOBLE: sólida en los datos, y su causa entra como tesis', 'a McCloskey le falta la etiqueta doble');
    ok(/Kocka/.test(texto0) && /Historia del capitalismo/.test(texto0) && /síntesis académica breve/i.test(texto0),
       'Kocka (2016) como síntesis académica breve', 'falta Kocka etiquetado');
    ok(/Banco Mundial/.test(texto0) && /Our World in Data/.test(texto0),
       'las series del Banco Mundial y de Our World in Data', 'faltan las series con su nombre');
    ok(/siempre con fecha/i.test(texto0), 'y la regla de citarlas siempre con fecha', 'no se declara que las series se citan con fecha');
    ok(/Hickel/.test(texto0) && /Roser/.test(texto0) && /Pinker/.test(texto0) && /2019/.test(texto0),
       'el cruce Hickel contra Roser y Pinker, con su año', 'falta el cruce de 2019 con sus tres nombres');
    ok(/disputa viva de medición/i.test(texto0), 'y declarado DISPUTA VIVA DE MEDICIÓN', 'no se declara que la pelea de la línea sigue viva');
    ok(/1980/.test(texto0) && /China/.test(texto0) && /híbrido/i.test(texto0),
       'el tramo chino desde 1980, con el híbrido nombrado', 'falta el dato de China con su híbrido');
    ok(/atribución/i.test(texto0), 'y la disputa de atribución nombrada como tal', 'no se nombra la disputa de atribución');
    ok(/pastiche/i.test(texto0) && /no obra de esos autores/i.test(texto0),
       'y el pastiche de las lecturas declarado', 'el pastiche no se declara en Recursos');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15,
       'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'definicion,fuga,disputas,variedades', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos del camino de la fuga', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    ok(dentro('!!ACHIEVEMENTS.lect_master'), 'y entre ellos el de las lecturas (lect_master)', 'falta el logro lect_master');
    /* Las tres baterías de preguntas de las lecturas (norma 5-quater). */
    ok(dentro('lectComprensionBank.length') === 25, '25 preguntas de comprensión lectora', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 10, '10 preguntas de completar', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 10, '10 preguntas de análisis complejo', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala'].forEach(voz => {
      const n = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      ok(n === 5, 'cinco preguntas del texto de ' + voz, voz + ': ' + n + ' preguntas');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    /* Con cinco textos, la etiqueta «las tres» y el «citan los tres textos» del
       completar quedaron falsos una vez: esto impide que vuelvan. */
    ok(dentro('lectCompletarBank.every(q => q.t !== "las tres" && q.q.indexOf("los tres textos") < 0)'),
       'el completar ya no dice «tres» donde los textos son cinco', 'el completar sigue contando tres textos');
    ok(dentro('lectCompletarBank.filter(q => q.t === "las cinco").length') === 2,
       'las dos oraciones transversales van etiquetadas «las cinco»', 'faltan las oraciones etiquetadas «las cinco»');
    /* «Anillos para una dama» (1973) es drama, no comedia: el dato del examen
       tiene que ser inatacable, así que la palabra no puede volver al banco. */
    ok(dentro('JSON.stringify(lectComprensionBank).indexOf("comedia") < 0'),
       'el banco de comprensión no llama comedia a «Anillos para una dama»', 'volvió la «comedia» al banco de comprensión');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 200)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay preguntas de análisis sin pauta');
    ok(/faro_dorado_fuga/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/el acero primero/i.test(texto) && /no se audita lo que no se sabe defender/i.test(texto),
       'el acero primero, que es la regla que ordena la etapa', 'falta la regla que ordena la etapa');
    ok(/columna del haber/i.test(texto), 'la etapa se declara como la columna del haber', 'no se declara qué es esta etapa dentro del expediente');
    ok(/definir viene antes que juzgar/i.test(texto), 'definir viene antes que juzgar', 'falta la primera regla de la materia');
    ok(/mercados/i.test(texto) && /propiedad privada/i.test(texto) && /trabajo asalariado/i.test(texto) && /reinvertida/i.test(texto),
       'las cuatro piezas de la definición de Kocka', 'faltan piezas de la definición de Kocka');
    ok(/variedades/i.test(texto) && /(Mánchester|Manchester)/i.test(texto) && /Bismarck/i.test(texto) && /1883/.test(texto),
       'las variedades desde el arranque, con Bismarck y 1883', 'falta la advertencia de las variedades con su ejemplo fechado');
    ok(/en singular ya es una simplificación/i.test(texto), 'y la palabra en singular declarada como simplificación', 'no se declara que la palabra en singular simplifica');
    ok(/tercio/i.test(texto) && /1990/.test(texto) && /(décima|décima parte)/i.test(texto),
       'las cifras de pobreza, con su año', 'faltan las cifras de pobreza fechadas');
    ok(/(mitad)/i.test(texto) && /cinco años/i.test(texto) && /uno de cada veinte/i.test(texto),
       'las cifras de mortalidad de menores de cinco', 'faltan las cifras de mortalidad');
    ok(/esperanza de vida/i.test(texto) && /setenta/i.test(texto), 'la esperanza de vida, antes y después', 'falta la esperanza de vida');
    ok(/treinta/i.test(texto) && /gran enriquecimiento/i.test(texto), 'el gran enriquecimiento, con su factor', 'falta el gran enriquecimiento con su número');
    ok(/pelea de la línea/i.test(texto) && /pelea de la atribución/i.test(texto),
       'las dos disputas, nombradas y separadas', 'las dos disputas no están separadas');
    ok(/puente/i.test(texto), 'y las variedades como puente entre las dos', 'no se dice qué une las dos peleas');
    ok(/intercambio voluntario/i.test(texto) && /cooperación entre extraños/i.test(texto),
       'la mejor defensa moral, dicha entera', 'falta la defensa moral del sistema');
    ok(/qué mercados, con qué reglas y para qué bienes/i.test(texto),
       'la pregunta que sí rinde, escrita entera', 'falta la pregunta que ordena la materia');
    ok(/cifra suelta/i.test(texto), 'el modo de fallar de la etapa: la cifra suelta', 'falta el modo de fallar de la etapa');
    ok(/hoja de la cifra/i.test(texto) && /quién lo disputa/i.test(texto),
       'la hoja de la cifra, con su renglón más olvidado', 'falta la hoja de la cifra');
    ok(/regla del placer/i.test(texto) && /doble auditoría/i.test(texto),
       'la regla del placer: el dato cómodo paga doble auditoría', 'falta la regla del placer');
    ok(/no se compara con el paraíso/i.test(texto) && /alternativas reales/i.test(texto),
       'y la abstracción central: no se compara con el paraíso', 'falta la abstracción central de la materia');
    /* Las facturas se aplazan, pero con su número de etapa declarado. */
    ok(/etapa 2/i.test(texto) && /etapa 3/i.test(texto) && /(etapa 4|la 4)/i.test(texto),
       'las facturas quedan aplazadas con su etapa declarada', 'la etapa no dice dónde viven las facturas');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      ok(/doña Herminia/i.test(tg), 'el guion tiene personaje, y no es una clase hablada', 'el guion no tiene personaje');
      ok(/7:00|6:10 a 7:00/.test(tg), 'el guion cierra entre los seis y los ocho minutos', 'el guion no declara su duración');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      const antesDelGiro = tg.slice(0, tg.indexOf('Escena 4 · El giro'));
      ok(!/\b(18\d\d|19\d\d|20\d\d)\b/.test(antesDelGiro),
         'y no hay ninguna fecha ni definición antes del giro', 'entra una fecha antes del minuto dos');
      ok(/2013/.test(tg) && /2015/.test(tg) && /1963/.test(tg) && /2019/.test(tg), 'el guion trae las fechas de la etapa', 'al guion le faltan fechas');
      /* El guion no puede quedarse en la mitad bonita del argumento. */
      ok(/orígenes de la desigualdad/i.test(tg), 'y la segunda mitad del título, dicha en el giro', 'el guion se queda con medio título de Deaton');
      ok(/expediente/i.test(tg) && /(gemelo|rojo)/i.test(tg), 'y contesta la objeción con el expediente gemelo', 'el guion no contesta la objeción de la propaganda');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS CINCO LECTURAS (normas 5 y 5-quinquies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl), 'las tres voces están nombradas', 'faltan las voces');
      ok(/ejercicio(s)? de estilo/i.test(tl) && /(No son obra de esos autores|NO es obra de ese autor)/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(/El libro que fue adelgazando/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/bodas del rico/.test(tl) && /Sancho/.test(tl) && /don Quijote/.test(tl), 'el capítulo cervantino está, con Sancho adentro', 'falta el capítulo cervantino');
      ok(/La especie que se fugó de su propia historia/.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');

         es el error que se cazó en una misión anterior. */
      ok(/\(dijo don Quijote\)|\(dijo Sancho\)|\(respondió Sancho\)|\(replicó don Quijote\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL. En esta materia la
         sonda aprieta más, porque la trampa fácil sería una cifra inventada. */
      ok(/reales y comprobables/i.test(tl) && /citas inventadas/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/cifras/i.test(tl), 'y la declaración incluye expresamente las cifras', 'la declaración de datos reales no menciona las cifras');
      ok(/Deaton/.test(tl) && /2013/.test(tl) && /2015/.test(tl), 'ancla real: Deaton (2013) y su Nobel de 2015', 'falta Deaton dentro de los textos');
      ok(/1963/.test(tl), 'ancla real: la película de 1963 de la que sale el título', 'falta la película de 1963');
      ok(/McCloskey/.test(tl) && /2010/.test(tl) && /treinta/.test(tl), 'ancla real: McCloskey (2010) y el factor de treinta', 'falta McCloskey dentro de los textos');
      ok(/Kocka/.test(tl) && /Historia del capitalismo/.test(tl), 'ancla real: Kocka y su «Historia del capitalismo»', 'falta Kocka dentro de los textos');
      ok(/Bismarck/.test(tl) && /1883/.test(tl), 'ancla real: el seguro de enfermedad de Bismarck (1883)', 'falta el ancla de Bismarck');
      ok(/Hickel/.test(tl) && /Roser/.test(tl) && /2019/.test(tl), 'anclas reales: Hickel y Roser, con el año del cruce', 'faltan Hickel y Roser dentro de los textos');
      ok(/1980/.test(tl) && /China/.test(tl), 'ancla real: el tramo chino desde 1980', 'falta el dato de China dentro de los textos');
      ok(/Banco Mundial/.test(tl) && /Our World in Data/.test(tl), 'anclas reales: las dos series con su nombre', 'faltan las series dentro de los textos');
      ok(/Honduras/.test(tl) && /setenta/.test(tl), 'ancla real: la esperanza de vida en Honduras', 'falta el ancla hondureña');
      ok(/bodas de Camacho/i.test(tl) && /1615/.test(tl) && /(veinte y veintiuno|veinte|veintiuno)/i.test(tl),
         'ancla real declarada: las bodas de Camacho (Quijote II, 20 y 21, de 1615)', 'falta el ancla real del capítulo cervantino');
      /* Y las anclas cervantinas de las otras misiones NO se repiten. */
      ok(!/batanes|rebuzno|Samuel Johnson|yelmo de Mambrino|galeotes|Edad de Oro|Montesinos/i.test(tl),
         'no repite las anclas cervantinas ya usadas en otras misiones', 'repite un ancla ya usada en la serie');
      /* Las tres lecturas deben ENSEÑAR el tema, no solo sonar bonito */
      ok(/(cifra|número)/i.test(tl) && /(línea|umbral)/i.test(tl) && /(disput|discute)/i.test(tl),
         'las lecturas enseñan el tema de la etapa', 'las lecturas no tocan el tema');
      ok(/(alabar|acero|alabado)/i.test(tl), 'y traen la regla del acero puesta en escena', 'los textos no cargan la regla del acero');
      /* Las dos entrevistas de la norma 5-quinquies: existen con sus ids
         fijos, y su etiqueta dice con todas las letras que el encuentro

         fuera de verdad, que es la cita apócrifa más grande posible. */
      const cardEnt = d.getElementById('lect-entrevista');
      const cardGala = d.getElementById('lect-gala');
      ok(!!cardEnt, 'la entrevista de la casa está (id lect-entrevista)', 'falta la tarjeta lect-entrevista');
      ok(!!cardGala, 'la conversación del Loco de la Colina está (id lect-gala)', 'falta la tarjeta lect-gala');
      if (cardEnt) {
        const notaEnt = cardEnt.querySelector('.lect-nota');
        ok(!!notaEnt && /nunca ocurrió/i.test(notaEnt.textContent), 'la entrevista declara que el encuentro nunca ocurrió', 'la entrevista no declara la ficción');
        ok(/Deaton/.test(cardEnt.textContent) && /Évole/.test(cardEnt.textContent), 'con Deaton preguntado a la manera de Évole', 'faltan el entrevistado o el entrevistador');
        ok(/Salvados/.test(cardEnt.textContent) && /2008/.test(cardEnt.textContent), 'y la seña real del entrevistador (Salvados, desde 2008)', 'la presentación no dice quién es Évole de verdad');
        ok(!!notaEnt && /(vivo|persona viva)/i.test(notaEnt.textContent), 'y declara que el entrevistado está vivo y no dijo estas palabras', 'no se declara que Deaton está vivo');
        ok(cardEnt.querySelectorAll('.lect-p').length >= 12, 'la entrevista trae sus intercambios', 'la entrevista quedó corta: ' + cardEnt.querySelectorAll('.lect-p').length);
        ok(/Yorkshire/.test(cardEnt.textContent) && /Anne Case/.test(cardEnt.textContent) && /2020/.test(cardEnt.textContent), 'con las anclas biográficas reales de Deaton', 'faltan las anclas biográficas de Deaton');
      }
      if (cardGala) {
        const notaGala = cardGala.querySelector('.lect-nota');
        ok(!!notaGala && /nunca ocurrió/i.test(notaGala.textContent), 'la conversación declara que la charla nunca ocurrió', 'la conversación no declara la ficción');
        ok(/QUINTERO/.test(cardGala.textContent) && /GALA/.test(cardGala.textContent), 'con los hablantes marcados en mayúsculas (sin raya de diálogo)', 'faltan los hablantes marcados');
        ok(/\(Silencio/.test(cardGala.textContent), 'los silencios de Quintero van como acotación', 'no hay silencios en acotación');
        ok(/Anillos para una dama/.test(cardGala.textContent) && /1973/.test(cardGala.textContent) && /Troylo/.test(cardGala.textContent), 'con las anclas reales de Gala (Anillos para una dama, Troylo)', 'faltan las anclas reales de Gala');
        ok(/Séneca/.test(cardGala.textContent) && /2002/.test(cardGala.textContent), 'y Séneca cordobés y la Fundación de 2002', 'faltan Séneca o la Fundación');
        ok(cardGala.querySelectorAll('.lect-p').length >= 10, 'la conversación trae sus intercambios', 'la conversación quedó corta: ' + cardGala.querySelectorAll('.lect-p').length);
        /* El pliego fija 700 a 1100 palabras para esta pieza; una vez se coló
           con 1293 y hubo que adelgazarla. Se cuenta solo lo que se lee. */
        const palGala = Array.from(cardGala.querySelectorAll('.lect-p'))
          .reduce((n, el) => n + el.textContent.trim().split(/\s+/).length, 0);
        ok(palGala >= 700 && palGala <= 1100, 'la conversación cabe en su rango (' + palGala + ' de 700 a 1100 palabras)', 'la conversación se sale del rango: ' + palGala + ' palabras');
        ok(!/comedia/i.test(cardGala.textContent), 'y no llama comedia a «Anillos para una dama»', 'volvió la «comedia» a la conversación');
      }
      /* Los datos duros de la etapa entran también por las dos entrevistas. */
      const tEnt = (cardEnt ? cardEnt.textContent : '') + ' ' + (cardGala ? cardGala.textContent : '');
      ok(/2013/.test(tEnt) && /2015/.test(tEnt) && /1963/.test(tEnt), 'las entrevistas traen a Deaton fechado y su película', 'a las entrevistas les faltan las fechas de Deaton');
      ok(/1990/.test(tEnt) && /(tercio)/.test(tEnt) && /(décima)/.test(tEnt), 'y la cifra de pobreza con su año', 'falta la cifra de pobreza en las entrevistas');
      ok(/Hickel/.test(tEnt) && /Roser/.test(tEnt) && /2019/.test(tEnt), 'y el cruce de 2019, vivo', 'falta el cruce de la línea en las entrevistas');
      ok(/China/.test(tEnt) && /1980/.test(tEnt), 'y el dato de China desde 1980', 'falta China en las entrevistas');
      ok(/McCloskey/.test(tEnt) && /treinta/.test(tEnt), 'y el factor de treinta de McCloskey', 'falta McCloskey en las entrevistas');
      ok(/uno de cada veinte/.test(tEnt), 'y la mortalidad de menores de cinco', 'falta la mortalidad en las entrevistas');
      ok(!!d.querySelector('.nav-t[data-s="s-lecturas"]'), 'está en la barra de navegación', 'no aparece en la barra');

    log('\n── LAS PREGUNTAS DE LAS LECTURAS, EN PANTALLA ──');

    ok(d.querySelectorAll('#lcOpts .qz-opt').length === 4, 'con sus cuatro opciones', 'opciones: ' + d.querySelectorAll('#lcOpts .qz-opt').length);

    ok(/Oración 1 de 10/.test(d.getElementById('lfProg').textContent), 'y su contador de 10', 'contador: ' + d.getElementById('lfProg').textContent);

    ok(dentro('xp') === xpLa, 'y el análisis complejo va sin XP, a propósito', 'el análisis complejo regaló XP');
    w.toggleLectAPauta(); await esperar(80);

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón
       de imprimir y se lee el documento que se habría mandado a la
       impresora. Lo que no puede faltar en ninguna hoja es la etiqueta del
       estatus: un pastiche impreso sin declarar es la fuente inflada que
       esta materia enseña a cazar. */
    const abiertos = [];
    const openReal = w.open;
    w.open = function () {
      const doc = { write(s) { abiertos.push(s); }, close() {} };
      return { document: doc, print() {}, focus() {}, close() {} };
    };
    try {
      w.imprimirLectura('borges');
      const hb = abiertos[abiertos.length - 1] || '';
      ok(/El libro que fue adelgazando/.test(hb) && /archivo de una parroquia/.test(hb),
         'el cuento se imprime con su texto completo', 'el cuento no se imprime');
      ok(/Rehíce la crónica/.test(hb), 'y hasta su última página', 'la hoja del cuento sale cortada');
      ok(/NO es obra de ese autor/i.test(hb) && /Ejercicio de estilo de la casa/i.test(hb),
         'y con la etiqueta del estatus en la hoja', 'la hoja del cuento sale sin declarar el pastiche');
      ok(/real y comprobable/i.test(hb), 'y con la regla de la erudición real', 'la hoja no trae la regla de los datos reales');

      w.imprimirLectura('cervantes');
      const hc = abiertos[abiertos.length - 1] || '';
      ok(/bodas del rico/.test(hc) && /novillo entero/.test(hc) && /Sancho/.test(hc),
         'el capítulo cervantino se imprime completo', 'el capítulo no se imprime');
      ok(/NO es obra de ese autor/i.test(hc), 'y con su etiqueta', 'la hoja del capítulo sale sin etiqueta');
      ok(/Camacho/i.test(hc) && /1615/.test(hc), 'y con su ancla real declarada', 'la hoja del capítulo sale sin su ancla');
      ok(!/—/.test(hc), 'y sin guiones largos (norma 1-bis)', 'la hoja del capítulo trae guiones largos');

      w.imprimirLectura('harari');
      const hh = abiertos[abiertos.length - 1] || '';
      ok(/La especie que se fugó de su propia historia/.test(hh) && /orígenes de la desigualdad/.test(hh),
         'el ensayo se imprime completo', 'el ensayo no se imprime');
      ok(/NO es obra de ese autor/i.test(hh), 'y con su etiqueta', 'la hoja del ensayo sale sin etiqueta');

      /* Las dos entrevistas se imprimen sueltas, y su hoja lleva la etiqueta
         de la ficción con el «nunca ocurrió»: sin esa línea, la fotocopia
         circula como una entrevista de verdad. */
      w.imprimirLectura('entrevista');
      const hent = abiertos[abiertos.length - 1] || '';
      ok(/El economista que contó la fuga/.test(hent) && /Yorkshire/.test(hent),
         'la entrevista se imprime con su texto completo', 'la entrevista no se imprime');
      ok(/nunca ocurrió/i.test(hent), 'y con la etiqueta del encuentro que nunca ocurrió', 'la hoja de la entrevista sale sin declarar la ficción');
      ok(/real y comprobable/i.test(hent), 'y con la regla de la erudición real', 'la hoja de la entrevista no trae la regla de los datos reales');
      ok(!/—/.test(hent), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la entrevista trae guiones largos');

      w.imprimirLectura('gala');
      const hga = abiertos[abiertos.length - 1] || '';
      ok(/La noche de los que salieron/.test(hga) && /QUINTERO/.test(hga) && /GALA/.test(hga),
         'la conversación se imprime con sus dos voces', 'la conversación no se imprime');
      ok(/nunca ocurrió/i.test(hga), 'y con la etiqueta del encuentro que nunca ocurrió', 'la hoja de la conversación sale sin declarar la ficción');
      ok(/Cuide usted el agua/.test(hga), 'y hasta su última línea', 'la hoja de la conversación sale cortada');
      ok(!/—/.test(hga), 'y sin guiones largos ni rayas de diálogo', 'la hoja de la conversación trae guiones largos');

      w.imprimirTodasLasLecturas();
      const h3 = abiertos[abiertos.length - 1] || '';
      ok(/El libro que fue adelgazando/.test(h3) && /bodas del rico/.test(h3) && /La especie que se fugó/.test(h3),
         'las tres primeras lecturas van en el pliego junto', 'el pliego junto pierde alguna de las tres primeras');
      ok(/El economista que contó la fuga/.test(h3) && /La noche de los que salieron/.test(h3),
         'y las dos entrevistas también: las cinco juntas', 'el pliego junto no trae las dos entrevistas');
      ok(/Las cinco lecturas/.test(h3), 'y el pliego se titula de las cinco', 'el pliego no declara que son cinco');
      ok((h3.match(/page-break-before/g) || []).length >= 4, 'y cada una arranca en su propia hoja', 'las cinco salen pegadas');
      ok(/NO son obra de Jorge Luis Borges/i.test(h3), 'y el pliego declara el pastiche', 'el pliego no declara el pastiche');
      ok(/nunca ocurrieron/i.test(h3), 'y la etiqueta de la ficción de las entrevistas', 'el pliego no declara que los encuentros nunca ocurrieron');

      w.imprimirPreguntasLecturas();

      ok(/I\. Comprensión lectora \(25 preguntas\)/.test(hp) && /II\. Completa la oración \(10 preguntas\)/.test(hp) && /III\. Análisis complejo \(10 preguntas\)/.test(hp),
         'el pliego de preguntas trae las tres secciones, con las 25', 'al pliego de preguntas le falta una sección');
      ok(/con los cinco textos delante/i.test(hp) && /nunca ocurrieron/i.test(hp),
         'y declara los cinco textos y la ficción de las entrevistas', 'el pliego de preguntas no declara los cinco textos');
      ok(/Pauta completa de respuestas/.test(hp) && /class="pauta"/.test(hp),

      const nOps = (hp.match(/class="op"/g) || []).length;
      ok(nOps === 100, 'las 25 preguntas salen con sus 100 opciones', 'opciones impresas: ' + nOps);
      ok((hp.match(/_______________/g) || []).length === 10, 'las 10 de completar salen con su hueco', 'huecos impresos: ' + (hp.match(/_______________/g) || []).length);
      ok((hp.match(/class="ln-alta"/g) || []).length === 30, 'las 10 de análisis salen con tres renglones cada una', 'renglones: ' + (hp.match(/class="ln-alta"/g) || []).length);
      ok(!/—/.test(hp), 'y el pliego va sin guiones largos', 'el pliego trae guiones largos');

      /* Los rótulos de las DOS PRUEBAS IMPRESAS: es ahí donde vive el número
         de etapa, y es el sitio exacto donde el molde arrastró el nombre de
         la misión anterior en misiones pasadas. Se imprimen de verdad y se

      w.go('s-evaluacion'); await esperar(150);

      ok(/La gran fuga/i.test(he) && /Etapa 1 · Estudio Mayor/.test(he),
         'la evaluación impresa lleva el nombre y la etapa correctos', 'la evaluación impresa trae el rótulo de otra misión');
      ok(!/Etapa [2-9] · Estudio Mayor|Etapa [2-9] de \d|hombre máquina|base material|Átomos y los Ídolos/i.test(he),
         'y no arrastra el rótulo de otra etapa ni de la misión molde', 'la evaluación impresa dice otra etapa');
      ok(!/undefined/.test(he), 'y no imprime undefined', 'la evaluación impresa trae un undefined');
      w.printEvalCrit();
      const hec = abiertos[abiertos.length - 1] || '';
      ok(/La cifra sobre la mesa/.test(hec) && /La gran fuga/i.test(hec),

      ok(/Etapa 1 · Estudio Mayor/.test(hec), 'y su número de etapa correcto', 'la competencial impresa no dice etapa 1');
      ok(!/Etapa [2-9] · Estudio Mayor|Etapa [2-9] de \d|base sobre la mesa|familia en la mesa|miedo sobre la mesa/i.test(hec),
         'y tampoco arrastra el de otra misión', 'la competencial impresa arrastra el rótulo de otra etapa');
      ok(!/undefined/.test(hec), 'y no imprime undefined en ninguna pauta', 'la competencial impresa trae un undefined');
    } finally { w.open = openReal; }

    log('\n── EN PANTALLA ──');
    w.go('s-lab'); await esperar(150);
    ok(/La definición de Kocka/.test(d.getElementById('lab-sentence').textContent), 'el laboratorio abre en la definición de Kocka', 'abre en otra pieza');
    ok(!!d.querySelector('.lab-cont-btn[data-parte="definicion"]'), 'el botón de la pieza inicial existe', 'el laboratorio arrastra la pieza del molde');
    w.labShowParte('disputas'); await esperar(150);
    ok(/Hickel/.test(d.getElementById('lab-display').textContent) || /atribución/i.test(d.getElementById('lab-display').textContent),

    ok(d.getElementById('qzQ').textContent.length > 10, 'el quiz pinta su primera pregunta', 'quiz vacío');

    ok(/gran fuga/i.test(rotulos) && /La cifra sobre la mesa/.test(rotulos),

    ok(!/Etapa [2-9] · Estudio Mayor|Etapa [2-9] de \d/.test(rotulos), 'y no dicen otra etapa', 'los rótulos de pantalla dicen otra etapa');
    ok(!/hombre máquina|base sobre la mesa|mapa de las familias|miedo sobre la mesa|bisturí|vigía/i.test(rotulos),

    log('\n── CASOS DEL PROYECTO (norma 3) ──');
    const casos = d.getElementById('s-casos');
    ok(!!casos, 'existe la sección de casos', 'falta la sección de casos');
    if (casos) {
      ok(casos.querySelectorAll('.card').length === 10, '8 casos más la introducción y el cierre', 'tarjetas: ' + casos.querySelectorAll('.card').length);
      ok(casos.querySelectorAll('.ex-box').length === 9, 'y cada caso trae su caja de auditoría', 'cajas de auditoría: ' + casos.querySelectorAll('.ex-box').length);
      const txt = casos.textContent;
      ['300,000', '50', '150,000', 'Jael', 'Angelly', 'China', 'M.E.T.A.S']
        .forEach(k => { if (!new RegExp(k.replace(/\./g, '\\.'), 'i').test(txt)) { fallos++; log('  ✘ falta el caso de ' + k); } });
      ok((txt.match(/Lo que enseña/g) || []).length >= 6, 'los casos cierran con lo que enseñan', 'casos con lección: ' + (txt.match(/Lo que enseña/g) || []).length);
      ok(/M\.E\.T\.A\.S|F\.A\.R\.O/.test(txt), 'los casos son sobre la propia casa', 'los casos no mencionan los proyectos');
      ok(/L \d/.test(txt), 'los casos traen números en lempiras', 'los casos no traen lempiras');
      ok(/hoja de la cifra/i.test(txt), 'trae la hoja de la cifra', 'falta la hoja de la cifra');
      ok(/cinco reglas/i.test(txt), 'trae las cinco reglas de la etapa', 'faltan las cinco reglas');
      ok(/acero/i.test(txt), 'y el acero se hace también en los casos', 'los casos no aplican la regla del acero');
      /* El giro hacia adentro es el cuidado central del compendio: uno de los
         ocho casos tiene que auditar el proyecto propio. */
      ok(/alternativas reales/i.test(txt) && /(M\.E\.T\.A\.S|propio)/i.test(txt),
         'al menos un caso gira la vara hacia la propia casa', 'ningún caso audita el proyecto propio');
      /* Y la regla de selección de esta materia. */
      ok(/como categoría/i.test(txt) && /nombre propio/i.test(txt),
         'los casos declaran la regla de selección del patio', 'los casos no declaran la regla de selección');
      ok(!!d.querySelector('.nav-t[data-s="s-casos"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }
    const decisiones = dentro('critDecisionBank.join(" ")');
    ok(/300,000|150,000|Jael|Angelly|China|M\.E\.T\.A\.S/i.test(decisiones), 'el banco de decisiones usa los casos del proyecto', 'las decisiones siguen siendo genéricas');

    log('\n── EL WIDGET DE ORDENAR (arrastre y linterna) ──');
    w.go('s-widgets'); await esperar(200);
    const lista = d.getElementById('routeList');
    ok(!!lista && lista.children.length >= 5, 'la lista de pasos se pinta', 'la lista de pasos no se pintó');
    ok(!!d.querySelector('.sort-grip'), 'cada tarjeta trae su asa para arrastrar', 'falta el asa de arrastre');
    ok(w.getComputedStyle(lista.children[0]).touchAction === 'none',
       'arrastrar la tarjeta no arrastra la página (touch-action)', 'sin touch-action: el gesto se lo lleva el navegador');
    ok(typeof w.routeAgarra === 'function' && typeof w.routeArrastra === 'function' && typeof w.routeSuelta === 'function',
       'las tres piezas del arrastre existen', 'falta alguna función del arrastre');
    /* El arrastre de verdad: se toma la primera tarjeta y se suelta tres
       lugares más abajo, y se comprueba que el banco quedó reordenado.
       routeItems se declara con let, así que se lee con eval y no por
       window, igual que el resto de los bancos de esta sonda. */
    const antesOrden = dentro('routeItems.slice()');
    const filasW = [...lista.children];
    const altoW = filasW[1].getBoundingClientRect().top - filasW[0].getBoundingClientRect().top;
    filasW[0].dispatchEvent(new w.PointerEvent('pointerdown', { pointerId: 7, clientY: 100, bubbles: true, cancelable: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointermove', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    filasW[0].dispatchEvent(new w.PointerEvent('pointerup', { pointerId: 7, clientY: 100 + altoW * 3, bubbles: true }));
    await esperar(150);
    const despuesOrden = dentro('routeItems.slice()');
    ok(despuesOrden[3] === antesOrden[0] && despuesOrden[0] === antesOrden[1],
       'arrastrar tres lugares mueve el paso a su nuevo sitio', 'el arrastre no reordenó');
    ok(typeof w.linternaRoute === 'function', 'la linterna existe', 'falta linternaRoute');
    w.linternaRoute(); await esperar(150);
    ok(d.querySelectorAll('.sort-luz-chip').length === filasW.length, 'la linterna numera todas las tarjetas', 'la linterna no numeró');
    ok(!!d.querySelector('.sort-luz-ok, .sort-luz-no'), 'y marca cuáles están en su sitio', 'la linterna no marca aciertos');
    ok(/Apagar/.test(d.getElementById('btnLinterna').textContent), 'el botón avisa que está encendida', 'el botón no cambia de rótulo');
    const xpAntes = dentro('xp');
    dentro('routeItems = routeSets[currentRouteIdx].steps.slice()');
    w.renderRoute(); w.checkRoute(); await esperar(120);
    ok(dentro('xp') === xpAntes, 'el orden acertado con linterna no suma XP', 'la linterna regaló XP: ' + xpAntes + ' → ' + dentro('xp'));
    ok(/no suma XP/i.test(d.getElementById('fbRoute').textContent), 'y lo dice en pantalla, sin trampa', 'no avisa de que no suma');
    w.linternaRoute(); await esperar(120);
    ok(!d.querySelector('.sort-luz-chip'), 'la linterna se apaga', 'la linterna no se apaga');

    log('\n── EL ENCABEZADO ES DE ESTA MISIÓN (norma 5-ter) ──');
    /* La banda de palabras del encabezado vive en un ::before del CSS, así
       que no aparece en el texto de la página: por eso se arrastró de misión
       en misión desde la de Popper hasta que el autor la vio en pantalla. */
    const banda = w.getComputedStyle(d.querySelector('.hero'), '::before').content || '';
    ok(/DEATON 2013/.test(banda) && /LA GRAN FUGA/.test(banda), 'la banda del encabezado es de esta misión', 'banda ajena: ' + banda.slice(0, 60));
    ok(/KOCKA 2016/.test(banda) && /MERCADOS/.test(banda) && /TRABAJO ASALARIADO/.test(banda), 'y trae la definición de la etapa', 'la banda no nombra la definición');
    ok(/LA L[ÍI]NEA Y LA ATRIBUCI[ÓO]N/.test(banda) && /HICKEL CONTRA ROSER 2019/.test(banda), 'y las dos disputas', 'la banda no nombra las dos disputas');
    ok(/EL ACERO PRIMERO/.test(banda), 'y la regla que ordena la etapa', 'la banda no nombra el acero');
    ok(!/LA METTRIE|EL HOMBRE M[ÁA]QUINA|CONDICIONA|BROCHA GORDA|LOS MAZOS/.test(banda), 'sin las palabras de la misión molde', 'la banda sigue siendo la del hombre máquina');
    ok(!/DEM[ÓO]CRITO|EPICURO|LIBERALISMO|POPULISMO|SOCIEDAD ABIERTA|EL ACERO ANTES/.test(banda),
       'sin las palabras de las misiones viejas', 'la banda viene arrastrada de otra misión');

    log('\n── FICHA ──');
    const r = await fetch('/fichas/ficha-dorado-gran-fuga.html');
    const txtF = r.ok ? await r.text() : '';
    ok(r.ok, 'la ficha responde (' + r.status + ')', 'la ficha no responde: ' + r.status);
    ok((txtF.match(/class="pagina"/g) || []).length === 10, '10 páginas para imprimir (norma 6)', 'páginas: ' + (txtF.match(/class="pagina"/g) || []).length);
    ok(/La hoja de la cifra, para llenar a lápiz/i.test(txtF), 'la ficha trae la hoja de la cifra en blanco', 'falta la hoja de la cifra');
    ok(/Una hoja de la cifra ya llena/i.test(txtF), 'y una ya llena, como ejemplo', 'falta el ejemplo lleno');
    ok(/Tres avisos al llenarla/i.test(txtF), 'con sus avisos', 'faltan los avisos de la hoja');
    ok(/Cómo se usa, en tres reglas/i.test(txtF), 'y sus tres reglas de uso', 'faltan las reglas de uso de la hoja');
    ok(/Deaton/.test(txtF) && /2013/.test(txtF) && /2015/.test(txtF), 'la ficha trae a Deaton con su año y su Nobel', 'falta Deaton en la ficha');
    ok(/Kocka/.test(txtF) && /reinvertida/i.test(txtF), 'la ficha trae la definición de las cuatro piezas', 'falta la definición de Kocka');
    ok(/Hickel/.test(txtF) && /Roser/.test(txtF) && /2019/.test(txtF), 'la ficha trae la pelea de la línea con su año', 'falta la pelea de la línea');
    ok(/1980/.test(txtF) && /China/.test(txtF), 'la ficha trae la pelea de la atribución', 'falta la pelea de la atribución');
    ok(/Bismarck/.test(txtF) && /1883/.test(txtF), 'la ficha trae las variedades con su ejemplo fechado', 'faltan las variedades en la ficha');
    ok(/cifra suelta/i.test(txtF) && /regla del placer/i.test(txtF), 'la ficha explica el modo de fallar y la regla del placer', 'faltan el modo de fallar o la regla del placer');
    ok(/qué mercados, con qué reglas y para qué bienes/i.test(txtF), 'la ficha trae la pregunta que rinde', 'falta la pregunta que ordena la materia');
    ok(/Hoja de fuentes/i.test(txtF), 'la ficha trae su hoja de fuentes', 'falta la hoja de fuentes');
    ok(/Pauta completa de respuestas/.test(txtF), 'trae su pauta', 'sin pauta');
    ok(!/—/.test(txtF), 'la ficha va sin guiones largos', 'la ficha trae guiones largos');
    ok((txtF.match(/<table/g) || []).length === (txtF.match(/<\/table>/g) || []).length, 'ninguna tabla quedó partida entre dos hojas', 'hay tablas abiertas sin cerrar');
    ok(/clásico sólido reciente/i.test(txtF) && /síntesis académica breve/i.test(txtF) && /disputa viva/i.test(txtF), 'las fuentes de la ficha llevan etiqueta', 'la ficha cita sin estatus');
    ok(!/La Mettrie|hombre máquina|brocha gorda|Phineas/i.test(txtF),
       'la ficha no arrastra el temario del molde', 'la ficha trae restos de la etapa 2 de los Átomos');
    ok(!!d.querySelector('#s-recursos a[href*="ficha-dorado-gran-fuga"]'), 'la misión enlaza su ficha', 'la misión no enlaza la ficha');

    log('\n── EN LA APLICACIÓN ──');
    const da = appFrame.contentDocument, wa = appFrame.contentWindow;
    wa.switchView('view-rutas'); await esperar(400);
    const ruta = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Dorado/.test(c.textContent));
    ok(!!ruta, 'la Ruta del Expediente Dorado está en el mapa', 'no aparece la ruta');
    if (ruta) {
      ok(ruta.querySelectorAll('.re-link').length === 5, 'con sus cinco primeras etapas ya tocables', 'etapas tocables: ' + ruta.querySelectorAll('.re-link').length);
      ok(ruta.querySelectorAll('.ruta-etapa-futura').length === 2, 'y 2 etapas por construir con nombre', 'futuras: ' + ruta.querySelectorAll('.ruta-etapa-futura').length);
      ok(/La gran fuga/i.test(ruta.textContent), 'la etapa 1 sale con el título de su misión', 'la etapa construida no toma el título de MISSIONS');
      ok(/La palabra gastada/.test(ruta.textContent) && /Visto desde el patio/.test(ruta.textContent), 'las dos siguientes etapas ya tienen nombre', 'las futuras salen sin nombre');
      ok(!/Etapa por construir/.test(ruta.textContent), 'ninguna queda con el rótulo genérico', 'alguna etapa no tiene título');
    }
    /* El expediente gemelo tiene que seguir en pie al lado, porque la Bóveda
       no acepta uno sin el otro y eso vive en el mapa, no solo en el texto. */
    const rutaRoja = [...da.querySelectorAll('.ruta-card')].find(c => /Ruta del Expediente Rojo/.test(c.textContent));
    ok(!!rutaRoja, 'y la Ruta del Expediente Rojo sigue en el mapa, al lado', 'no aparece el expediente gemelo');
    wa.switchView('view-misiones'); await esperar(200);
    const chip = da.querySelector('.fam-chip[data-materia="mayor"]');
    ok(!!chip, 'la materia Estudio Mayor tiene su chip', 'no hay chip del Estudio Mayor');
    if (chip) {
      chip.click(); await esperar(250);
      const tarjetas = [...da.querySelectorAll('#missions-container .mission-card')];
      ok(tarjetas.length === 13, 'la materia muestra sus trece misiones', 'muestra ' + tarjetas.length);
      const t = tarjetas.find(x => /gran fuga/i.test(x.textContent));
      ok(!!t && /🔒/.test(t.textContent), 'la misión lleva el sello familiar (candado)', 'la misión no muestra el candado');
      ok(!!t && /📒/.test(t.textContent), 'y su emoji propio', 'la misión no muestra su emoji');
    }

    log('\n' + (fallos ? '✖ ' + fallos + ' fallos' : '✔ todo en orden'));
    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda gran fuga etapa 1';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda gran fuga etapa 1'; }
});
</script>
</body>
</html>
