<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda · Ruta de las Gafas a la Vista, etapa 2</title>
<style>body{font-family:system-ui;background:#222;color:#eee;margin:0;padding:10px}
iframe{width:380px;height:520px;border:0;background:#fff;margin-right:8px}
pre{background:#111;color:#7f7;padding:10px;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="m" src="/misiones/ruta-gafas-bisturi-freeden/bisturi-freeden.html"></iframe>
<iframe id="app" src="/index.html"></iframe>
<pre id="out">midiendo…</pre>
<script>
/* Comprueba la etapa 2 de la Ruta de las Gafas a la Vista (Estudio de las
   Ideologías, materia 25 del Estudio Mayor): bancos, laboratorio, pruebas
   impresas con su nombre, los ocho casos, la ficha, la ruta en el mapa, las
   dos secciones de la norma 5 (guion de video y las lecturas, que desde la
   norma 5-nonies son SEIS: las dos entrevistas imaginadas y el careo) y las
   TRES BATERÍAS, que ahora viven DENTRO de cada lectura y suman 30 de
   comprensión lectora, 12 de completar y 12 de análisis complejo, cinco,
   dos y dos por voz. Se comprueba de verdad el aparato compartido: que las
   seis empiecen plegadas con el alto calculado, que abrir una cierre la
   anterior, que cada tarjeta traiga sus tres baterías y pague XP donde
   debe, y que la marca de lectura se ponga sola y devuelva a su sitio. La
   impresión se lee interceptando window.open, y la etiqueta de la ficción
   («el encuentro nunca ocurrió») se exige en pantalla y en papel.

   La REGLA DEL ESTATUS del compendio rige también aquí: Gallie 1956 como
   clásico sólido de la filosofía, Berlin 1958 como clásico sólido y fuente
   canónica del ejemplo central (las dos libertades), Freeden 1996 como
   académico sólido y base del análisis morfológico, y su introducción de
   2003 como la rampa de entrada del propio dueño del instrumento; y el
   pastiche de las lecturas declarado como pastiche, porque una misión que
   enseñara a cazar cierres escondidos escondiendo el suyo sería el error
   que quiere evitar.

   Dos cuidados del compendio se comprueban a máquina porque gobiernan la
   misión: que el entrenamiento vaya con textos históricos o de fuera (cero
   etiquetas a políticos vivos del país) y que el bisturí se gire hacia
   adentro, porque un detector que no se prueba en casa no es un
   instrumento, es un arma. */
const out = document.getElementById('out');
const L = []; let fallos = 0, sembrado = false;
function log(s){ L.push(s); out.textContent = L.join('\n'); }
function ok(c, bien, mal){ if(c) log('  ✔ '+bien); else { fallos++; log('  ✘ '+mal); } }
/* La raya (guion largo) se busca escrita como \u2014 y nunca literal: la norma
   1-bis se comprueba con un grep sobre los archivos, y una sonda que llevara
   la raya de verdad en su propio código se acusaría a sí misma. */
const esperar = ms => new Promise(r => setTimeout(r, ms));

const appFrame = document.getElementById('app');
appFrame.onload = () => {
  if (sembrado) return;
  sembrado = true;
  try {
    appFrame.contentWindow.localStorage.setItem('faro_session', JSON.stringify({ user: 'josue', nombre: 'Josué Edmundo' }));
    appFrame.contentWindow.localStorage.removeItem('faro_v1');
  } catch (e) {}
  appFrame.contentWindow.location.reload();
};

window.addEventListener('load', async () => {
  await esperar(1600);
  const d = document.getElementById('m').contentDocument;
  const w = document.getElementById('m').contentWindow;
  const dentro = e => w.eval(e);
  try {
    log('── LA MISIÓN ──');
    ok(d.querySelectorAll('.sec').length === 17, '17 secciones (15 del molde + guion + lecturas)', 'secciones: ' + d.querySelectorAll('.sec').length);
    ok(/Ruta de las Gafas a la Vista · Etapa 2 de 7/.test(d.body.textContent), 'se presenta como etapa 2 de 7', 'no se presenta como etapa de la ruta');
    /* Restos del molde: se copió de la etapa 1 del Expediente Rojo. Se
       excluyen los puntos de Recursos que enlazan a las misiones hermanas a
       propósito; todo lo demás se mira entero. */
    const cuerpoSinEnlaces = (() => {
      const clon = d.body.cloneNode(true);
      clon.querySelectorAll('a[href*="ruta-gafas-palabra-expediente"], a[href*="ruta-rojo-acero-juicio"], a[href*="ruta-espejo-vigia-timon"], a[href*="ruta-atomos-contra-miedo"]').forEach(a => {
        const li = a.closest('li'); (li || a).remove();
      });
      return clon.textContent;
    })();
    /* Se copió de la etapa 1 de esta misma ruta, así que lo que hay que
       cazar es su temario: Destutt de Tracy, la cámara oscura, la carta de
       Mehring, el relacionismo y el mapa de Geertz. Los enlaces de Recursos
       a las misiones hermanas se excluyen porque están a propósito. */
    ok(!/Destutt|cámara oscura|falsa conciencia|Mehring|relacionismo|Mannheim/i.test(cuerpoSinEnlaces),
       'sin restos del temario de la etapa 1 de la ruta', 'queda vocabulario de la etapa 1 (la palabra con expediente)');
    /* Ojo con este: «Expediente Rojo» NO entra en la lista, porque el
       compendio manda declarar la conexión con la materia hermana y el caso 7
       la nombra a propósito («la regla del acero es la regla madre de este
       arco»). Lo que sigue prohibido es su TEMARIO, que es lo que se arrastra
       sin querer. */
    ok(!/hombre de acero|hombre de paja|Caplan|Farm to Factory|tetrafármaco|Epicuro|vigía|timón/i.test(cuerpoSinEnlaces),
       'sin restos de las otras misiones del Estudio Mayor', 'queda vocabulario de otra misión del arco');
    ok(!/\u2014/.test(d.body.textContent), 'sin guiones largos (norma 1-bis)', 'quedan ' + (d.body.textContent.match(/\u2014/g) || []).length + ' guiones largos');

    log('\n── LA REGLA DEL ESTATUS (la regla del Estudio Mayor) ──');
    const texto0 = d.body.textContent.replace(/\s+/g, ' ');
    ok(/Gallie/.test(texto0) && /1956/.test(texto0) && /clásico sólido de la filosofía/i.test(texto0),
       'Gallie (1956) con su etiqueta de clásico sólido de la filosofía', 'falta Gallie etiquetado');
    ok(/Essentially Contested Concepts/.test(texto0), 'y con el título exacto de su trabajo', 'falta el título del trabajo de Gallie');
    ok(/Berlin/.test(texto0) && /1958/.test(texto0) && /Dos conceptos de libertad/.test(texto0),
       'Berlin con su lección de 1958', 'falta Berlin con su obra y su año');
    ok(/fuente canónica/i.test(texto0), 'y declarado como la fuente canónica del ejemplo central', 'no se declara que Berlin es la fuente canónica');
    ok(/Freeden/.test(texto0) && /1996/.test(texto0) && /Ideologies and Political Theory/.test(texto0),
       'Freeden (1996) con el título de la obra base', 'falta Freeden 1996 con su obra');
    ok(/académico sólido/i.test(texto0) && /base del análisis morfológico/i.test(texto0),
       'y su etiqueta: académico sólido, base del análisis morfológico', 'falta la etiqueta de Freeden 1996');
    ok(/2003/.test(texto0) && /A Very Short Introduction/.test(texto0) && /rampa de entrada/i.test(texto0),
       'la introducción de 2003 como rampa de entrada', 'falta la rampa de entrada de 2003');
    ok(/propio dueño del instrumento/i.test(texto0),
       'y declarada como del propio dueño del instrumento', 'no se declara de quién es la rampa');
    /* La regla de la casa que no se negocia en este arco. */
    ok(/históricos o de fuera/i.test(texto0) && /(pol[íi]ticos? vivos?|pol[íi]tico vivo)/i.test(texto0),
       'el entrenamiento va con textos históricos o de fuera, sin políticos vivos', 'falta la regla del cero partidismo actual');

    log('\n── BANCOS ──');
    ok(dentro('fcData.length') === 16, '16 flashcards', 'flashcards: ' + dentro('fcData.length'));
    ok(dentro('qzData.length') === 10, '10 preguntas de quiz', 'quiz: ' + dentro('qzData.length'));
    ok(dentro('classGroups.length') === 4, '4 clasificaciones', 'clasificaciones: ' + dentro('classGroups.length'));
    ok(dentro('retoPairs.length') === 3, '3 parejas en el reto', 'parejas: ' + dentro('retoPairs.length'));
    ok(dentro('idData.length') === 8 && dentro('cmpData.length') === 8, 'identifica 8 y completa 8', 'identifica/completa incompletos');
    ok(dentro('routeSets.length') === 3, '3 secuencias para ordenar', 'secuencias: ' + dentro('routeSets.length'));
    ok(dentro('neuronPartes.length') === 8 && dentro('neuroPairs.length') === 5 && dentro('enfermedadData.length') === 6,
       'los tres widgets con sus bancos (8, 5 y 6)', 'bancos de widgets incompletos');
    ok(dentro('identifyTaskDB.length') === 10 && dentro('classifyTaskDB.length') === 10 && dentro('completeTaskDB.length') === 8 && dentro('explainQuestions.length') === 6,
       'los cuatro bancos del generador de tareas', 'bancos del generador incompletos');
    ok(dentro('evalTFBank.length') === 15 && dentro('evalMCBank.length') === 15 && dentro('evalCPBank.length') === 15 && dentro('evalPRBank.length') === 15, 'los cuatro bancos de la evaluación con 15 cada uno', 'bancos de evaluación incompletos');
    ok(dentro('evalMCBank.every(q => typeof q.a === "number" && q.o[q.a])'),
       'la evaluación final sabe cuál es la respuesta correcta', 'evalMCBank no trae la clave «a»');
    ok(dentro('critCaseBank.length') === 8 && dentro('critDecisionBank.length') === 8, 'la prueba competencial trae sus 8 casos y 8 decisiones', 'faltan casos o decisiones de la competencial');
    ok(dentro('critCaseQuestions.length') === 4 && dentro('critCaseGuides.length') === 4 && dentro('critErrorBank.length') === 6 && dentro('critCompareBank.length') === 4 && dentro('critCauseBank.length') === 6 && dentro('critEffectBank.length') === 6,
       'los ocho bancos de la prueba competencial completos', 'algún banco de la competencial quedó corto');
    ok(dentro('critCompareBank.every(c => c.gr)'), 'las comparaciones traen su cierre (gr) para la pauta', 'critCompareBank sin campo gr');
    ok(dentro('Object.keys(parteData).join(",")') === 'disputado,libertad,morfologia,descontesta', 'laboratorio con las 4 piezas', 'piezas: ' + dentro('Object.keys(parteData).join(",")'));
    ok(dentro('timelineData.length') === 7, 'los 7 momentos del camino del bisturí', 'momentos: ' + dentro('timelineData.length'));
    ok(dentro('lvls.length') === 7 && dentro('Object.keys(ACHIEVEMENTS).length') === 9, 'los 7 niveles de XP y los 9 logros', 'niveles o logros incompletos');
    /* Las tres baterías de las lecturas (norma 5-nonies): 30, 12 y 12, que
       es 5, 2 y 2 por cada una de las seis voces. */
    ok(dentro('lectComprensionBank.length') === 30, '30 preguntas de comprensión lectora (cinco por lectura)', 'comprensión: ' + dentro('lectComprensionBank.length'));
    ok(dentro('lectCompletarBank.length') === 12, '12 preguntas de completar (dos por lectura)', 'completar: ' + dentro('lectCompletarBank.length'));
    ok(dentro('lectAnalisisBank.length') === 12, '12 preguntas de análisis complejo (dos por lectura)', 'análisis: ' + dentro('lectAnalisisBank.length'));
    ok(dentro('lectComprensionBank.every(q => q.o.length === 4 && typeof q.c === "number" && q.o[q.c] && q.t)'),
       'cada pregunta de comprensión trae 4 opciones, su clave y de qué texto sale', 'el banco de comprensión está mal formado');
    /* Cinco de comprensión y dos de cada una de las otras dos POR LECTURA.
       Sin esto, una lectura se publica con su tarjeta de preguntas vacía y
       nadie se entera hasta que un alumno la abre. Y la etiqueta «t» tiene
       que estar escrita EXACTAMENTE así: js/lecturas.js filtra por ella, de
       modo que un «las cinco» o un «Borges y Harari» sueltos dejan esa
       pregunta fuera de las seis tarjetas y fuera de la vista. */
    ['Borges', 'Cervantes', 'Harari', 'Entrevista', 'Quintero y Gala', 'Debate'].forEach(voz => {
      const c = dentro('lectComprensionBank.filter(q => q.t === "' + voz + '").length');
      const f = dentro('lectCompletarBank.filter(q => q.t === "' + voz + '").length');
      const a = dentro('lectAnalisisBank.filter(q => q.t === "' + voz + '").length');
      ok(c === 5 && f === 2 && a === 2, voz + ': 5 de comprensión, 2 de completar y 2 de análisis',
         voz + ': ' + c + '/' + f + '/' + a + ' (se esperaba 5/2/2)');
    });
    ok(dentro('lectCompletarBank.every(q => q.a && q.q.indexOf("___") >= 0)'),
       'cada oración de completar trae su hueco y su respuesta', 'el banco de completar está mal formado');
    ok(dentro('lectAnalisisBank.every(q => q.guia && q.guia.length > 250)'),
       'cada pregunta de análisis trae su pauta de corrección', 'hay análisis con pauta corta o sin pauta');
    ok(dentro('lectAnalisisBank.every(q => q.t)'), 'y cada una dice a qué lectura pertenece', 'hay análisis sin etiqueta de voz');
    /* El número lo pone la hoja al imprimir, así que un «11.» escrito dentro
       del enunciado sale dos veces en el pliego global («11. 11. La
       objeción...»). En pantalla lo tapa sinNumero() de js/lecturas.js, y por
       eso esto se mira en el BANCO y no en una tarjeta: mirar solo la de
       Borges fue lo que dejó pasar las dos preguntas de Debate. */
    const numerados = dentro('lectComprensionBank.concat(lectCompletarBank, lectAnalisisBank).map(q => q.q)')
      .filter(q => /^\s*\d+\s*\./.test(q));
    ok(numerados.length === 0, 'y ningún enunciado de los tres bancos arrastra el número del banco viejo',
       'enunciados que empiezan por número: ' + numerados.length + (numerados[0] ? ': ' + numerados[0].slice(0, 45) : ''));
    ok(/faro_gafas_bisturi/.test(dentro('SAVE_KEY')), 'clave de progreso propia (' + dentro('SAVE_KEY') + ')', 'clave compartida: ' + dentro('SAVE_KEY'));
    let sopaOk = true;
    dentro('sopaSets').forEach(s => s.words.forEach(p => {
      if (p.cells.map(([r, c]) => s.grid[r][c]).join('') !== p.w) sopaOk = false;
    }));
    ok(sopaOk, 'las palabras se leen en la sopa', 'la sopa no cuadra');

    log('\n── LO QUE LA ETAPA TIENE QUE ENSEÑAR ──');
    const texto = texto0;
    ok(/esencialmente disputad/i.test(texto), 'los conceptos esencialmente disputados', 'falta el concepto de Gallie');
    ok(/modo de existir/i.test(texto), 'que la disputa no es un defecto: es su modo de existir', 'falta la pieza que ordena la etapa');
    ok(/libertad negativa/i.test(texto) && /que nadie me estorbe/i.test(texto), 'la libertad negativa, con su definición', 'falta la libertad negativa');
    ok(/libertad positiva/i.test(texto) && /poder de verdad hacer/i.test(texto), 'la libertad positiva, con su definición', 'falta la libertad positiva');
    ok(/morfolog/i.test(texto), 'la morfología como lo que es un ideario', 'falta la morfología');
    ok(/núcleo/i.test(texto) && /adyacent/i.test(texto) && /perif/i.test(texto), 'las tres capas nombradas', 'faltan las tres capas');
    ok(/descontestaci/i.test(texto), 'la descontestación', 'falta el movimiento clave');
    ok(/sentido común/i.test(texto), 'y que el cierre se vende como sentido común', 'no se dice cómo se vende el cierre');
    ok(/lista de opiniones/i.test(texto), 'el contraste con la lista de opiniones', 'falta el contraste que da sentido al dibujo');
    ok(/tres textos que no se parezcan/i.test(texto), 'la práctica: tres textos que no se parezcan', 'falta la práctica del módulo');
    ok(/en una (sola )?página/i.test(texto), 'y el dibujo en una página', 'falta el formato del producto');
    ok(/regla de pago/i.test(texto), 'la regla de pago (uno propio por cada ajeno)', 'falta la regla de pago');
    ok(/no es un instrumento, es un arma/i.test(texto),
       'el detector que no se prueba en casa es arma', 'falta el cuidado central del compendio');
    ok(/regla del acero/i.test(texto) && /muñeco/i.test(texto),
       'la regla del acero como regla madre, con la señal del muñeco', 'falta la regla madre del arco');

    log('\n── EL GUION DE VIDEO (norma 5) ──');
    const guion = d.getElementById('s-guion');
    ok(!!guion, 'existe la sección de guion', 'falta la sección s-guion');
    if (guion) {
      const tg = guion.textContent;
      ok(guion.querySelectorAll('.card').length >= 8, 'trae sus escenas en tarjetas', 'tarjetas del guion: ' + guion.querySelectorAll('.card').length);
      ok((tg.match(/VOZ/g) || []).length >= 7, 'cada escena trae su VOZ', 'faltan voces: ' + (tg.match(/VOZ/g) || []).length);
      ok((tg.match(/IMAGEN/g) || []).length >= 7, 'cada escena trae su IMAGEN', 'faltan imágenes');
      ok((tg.match(/TEXTO EN PANTALLA/g) || []).length >= 7, 'cada escena trae su TEXTO EN PANTALLA', 'faltan textos en pantalla');
      ok(/gancho/i.test(tg) && /giro/i.test(tg) && /cierre/i.test(tg), 'la estructura del relato está nombrada (gancho, giro, cierre)', 'falta la estructura de storytelling');
      ok(/espejo/i.test(tg) && /objeción/i.test(tg) && /herramienta/i.test(tg), 'y también el espejo, la herramienta y la objeción', 'falta alguna pieza de la estructura obligatoria');
      ok(/Escena 1/.test(tg) && /Escena 7/.test(tg), 'las escenas van numeradas de la 1 a la 7', 'faltan escenas numeradas');
      ok(/estructura del guion, desarmada/i.test(tg), 'la estructura queda desarmada para las siguientes misiones', 'falta la tabla normativa de estructura');
      /* Nada de definiciones antes del minuto dos: la escena del giro, donde
         entra la primera fecha, no puede empezar antes de 2:00. */
      ok(/2:40/.test(tg) && /Escena 4 · El giro/.test(tg), 'el giro con la primera definición llega pasado el minuto dos', 'la definición llega demasiado pronto');
      ok(/1956/.test(tg) && /1958/.test(tg) && /1996/.test(tg), 'el guion trae las tres fechas del instrumento', 'al guion le faltan fechas');
      ok(!!d.querySelector('.nav-t[data-s="s-guion"]'), 'está en la barra de navegación', 'no aparece en la barra');
    }

    log('\n── LAS SEIS LECTURAS (normas 5, 5-quinquies y 5-nonies) ──');
    const lect = d.getElementById('s-lecturas');
    ok(!!lect, 'existe la sección de lecturas', 'falta la sección s-lecturas');
    if (lect) {
      const tl = lect.textContent;
      ok(/Borges/.test(tl) && /Cervantes/.test(tl) && /Harari/.test(tl), 'las tres voces están nombradas', 'faltan las voces');
      ok(lect.querySelectorAll('.card[id^="lect-"]').length === 6, 'hay seis tarjetas de lectura', 'tarjetas de lectura: ' + lect.querySelectorAll('.card[id^="lect-"]').length);
      ok(/ejercicio(s)? de estilo/i.test(tl) && /No son obra de esos autores/i.test(tl), 'el pastiche va declarado (regla del estatus)', 'el pastiche no se declara');
      ok(/La palabra que no se deja cerrar/.test(tl), 'el cuento a la manera de Borges está', 'falta el cuento');
      ok(/Donde se cuenta/.test(tl) && /Sancho/.test(tl) && /don Quijote/.test(tl), 'el capítulo cervantino está, con Sancho adentro', 'falta el capítulo cervantino');
      ok(/La palabra que firmaron todos/.test(tl) && /sapiens/i.test(tl), 'el ensayo a la manera de Harari está', 'falta el ensayo');
      /* Las rayas de diálogo del capítulo cervantino son guiones largos y
         violan la norma 1-bis: van en paréntesis. Se comprueba aquí porque
         es el error que se cazó en una misión anterior. */
      ok(/\(dijo don Quijote\)|\(respondió Sancho\)/.test(tl), 'los diálogos cervantinos van en paréntesis, no con raya', 'el capítulo usa rayas de diálogo');
      /* La regla del autor: la erudición interna es REAL. La sonda exige las
         anclas comprobables y la declaración de datos reales. */
      ok(/reales/i.test(tl) && /citas (apócrifas|inventadas)/i.test(tl), 'declara los datos reales y el vicio quitado a Borges', 'no se declara la erudición real');
      ok(/Samuel Johnson/.test(tl) && /1755/.test(tl), 'ancla real: el diccionario de Samuel Johnson (1755)', 'falta el ancla de Johnson');
      ok(/Gallie/.test(tl) && /1956/.test(tl) && /Essentially Contested Concepts/.test(tl), 'ancla real: Gallie y su trabajo de 1956', 'falta Gallie dentro de los textos');
      ok(/Berlin/.test(tl) && /1958/.test(tl) && /Oxford/.test(tl), 'ancla real: Berlin en Oxford, 1958', 'falta Berlin con su año y su lugar');
      ok(/Freeden/.test(tl) && /1996/.test(tl) && /Ideologies and Political Theory/.test(tl), 'ancla real: Freeden y la obra de 1996', 'falta Freeden dentro de los textos');
      ok(/2003/.test(tl) && /A Very Short Introduction/.test(tl), 'ancla real: la introducción de 2003', 'falta la rampa de 2003 dentro de los textos');
      ok(/1615/.test(tl) && /(capítulo cincuenta y ocho|II, 58)/i.test(tl), 'ancla real: el elogio de la libertad (Quijote II, 58, de 1615)', 'falta el ancla del elogio de la libertad');
      ok(/1605/.test(tl) && /galeotes/i.test(tl) && /(capítulo veintidós|I, 22)/i.test(tl), 'ancla real: los galeotes (Quijote I, 22, de 1605)', 'falta el ancla de los galeotes');
      ok(/1948/.test(tl) && /Derechos Humanos/.test(tl) && /(cuarenta y ocho|48)/.test(tl), 'ancla real: la votación de la Declaración Universal (1948)', 'falta la votación de 1948');
      ok(/1789/.test(tl) && /1776/.test(tl), 'anclas reales: las declaraciones de 1776 y 1789', 'faltan las dos declaraciones');
      /* Las tres lecturas deben ENSEÑAR el tema, no solo sonar bonito */
      ok(/descontestaci/i.test(tl) && /núcleo/i.test(tl) && /perifer/i.test(tl), 'las lecturas explican el instrumento de la etapa', 'las lecturas no tocan el tema');
      ok(/libertad negativa/i.test(tl) || /que nadie me estorbe/i.test(tl), 'las dos libertades aparecen dentro de los textos', 'los textos no cargan el ejemplo central');
      /* Las dos entrevistas de la norma 5-quinquies: existen con sus ids
         fijos, declaran con todas las letras que el encuentro nunca ocurrió,
         presentan de verdad a las personas reales, dialogan sin raya (nombre
         en mayúsculas y punto) y ENSEÑAN el temario de la etapa. */
      const cardEnt = d.getElementById('lect-entrevista'), cardGala = d.getElementById('lect-gala');
      ok(!!cardEnt, 'la entrevista de la casa está (lect-entrevista)', 'falta la tarjeta lect-entrevista');
      ok(!!cardGala, 'la conversación del Loco de la Colina está (lect-gala)', 'falta la tarjeta lect-gala');
      const notaEnt = (d.querySelector('#lect-entrevista .lect-nota') || { textContent: '' }).textContent;
      const notaGala = (d.querySelector('#lect-gala .lect-nota') || { textContent: '' }).textContent;
      ok(/nunca ocurrió/i.test(notaEnt), 'la entrevista declara que el encuentro nunca ocurrió', 'la entrevista no declara la ficción');

    log('\n── EL CAREO, LA SEXTA LECTURA (norma 5-nonies) ──');

      ok(/no se le pone a nadie una palabra en la boca|A nadie se le pone una palabra en la boca|no personas/i.test(notaC),
         'y la nota declara que no se le pone palabra a nadie en la boca', 'el careo no declara cómo trata a las personas reales');
      ok(!/NO es obra de ese autor|ejercicio de estilo/i.test(notaC),
         'y no lleva la etiqueta del pastiche, porque no imita a nadie', 'el careo se declara como pastiche');
      ok(/mejor versión/i.test(tc), 'declara la regla del acero: cada postura en su mejor versión', 'el careo no declara la regla del acero');
      /* Las seis partes obligatorias, en su orden. */
      ok(/pregunta de este careo es una sola|pregunta en disputa/i.test(tc), '1. plantea la pregunta en disputa', 'al careo le falta la pregunta en disputa');
      ok(/La postura A sostiene/i.test(tc), '2. la postura A, en su mejor versión', 'al careo le falta la postura A');
      ok(/La postura B sostiene/i.test(tc), '3. la postura B, en su mejor versión', 'al careo le falta la postura B');

      ok(/Berlin/.test(tc) && /1958/.test(tc) && /Oxford/.test(tc) && /Four Essays on Liberty/.test(tc) && /1969/.test(tc),

      ok(/MacCallum/.test(tc) && /1967/.test(tc) && /Philosophical Review/.test(tc) && /Negative and Positive Freedom/.test(tc),

      ok(/triádica/i.test(tc) && /libre de/i.test(tc), 'y la fórmula de los tres términos que sostiene B', 'falta la relación de tres términos');

         'ancla real: Charles Taylor (1979)', 'falta la crítica de Taylor');
      ok(/Pettit/.test(tc) && /1997/.test(tc) && /Republicanism/.test(tc), 'ancla real: Pettit y el republicanismo (1997)', 'falta Pettit');
      ok(/Skinner/.test(tc) && /1998/.test(tc) && /Liberty before Liberalism/.test(tc) && /A Third Concept of Liberty/.test(tc),
         'ancla real: Skinner (1998) y su tercer concepto (2002)', 'falta Skinner con sus dos obras');
      ok(/Lochner/.test(tc) && /1905/.test(tc) && /198 U\.S\. 45/.test(tc), 'ancla real: «Lochner contra Nueva York» (1905)', 'falta el caso de 1905');
      ok(/Baldwin/.test(tc) && /Ratio/.test(tc) && /1984/.test(tc) && /Nelson/.test(tc) && /Political Theory/.test(tc) && /2005/.test(tc),
         'ancla real: la literatura posterior (Baldwin 1984, Nelson 2005)', 'falta la literatura posterior a 1967');
      ok(/Gallie/.test(tc) && /1956/.test(tc) && /Freeden/.test(tc) && /1996/.test(tc),
         'y el careo se ata a la etapa: Gallie (1956) y Freeden (1996)', 'el careo no se ata al instrumento de la etapa');
      /* Que las dos posturas estén de verdad, y no una y su caricatura, y que

      ok(/lectura de esta casa|lectura propia/i.test(tc),

    log('\n── EL PLEGADO Y EL ÍNDICE (norma 5-nonies) ──');

    /* Todas cerradas al entrar: es la mitad del encargo. Y se comprueba con

    log('\n── ABRIR UNA LECTURA, Y SUS PROPIAS PREGUNTAS ──');

    const careoCard = d.getElementById('lect-debate');
    ok(careoCard.classList.contains('lect-abierta'), 'tocar el índice abre esa lectura', 'no se abrió');
    ok(w.getComputedStyle(careoCard.querySelector('.lect-cuerpo')).display !== 'none', 'y su pliegue se ve', 'el pliegue sigue oculto');
    /* Acordeón: abrir una cierra la anterior, o volvemos a las veinte
       pantallas de alto que el encargo viene a quitar. */

    ok(!careoCard.classList.contains('lect-abierta'), 'y abrir otra cierra la anterior', 'quedan dos abiertas a la vez');

    ok(!d.querySelector('#lcQ, #lfQ, #laQ'), 'y ya no hay una batería suelta al final de la sección', 'sigue la batería vieja al final');

    /* Contestar de verdad, en la lectura de Borges, y que pague XP. */
    const borgesCard = d.getElementById('lect-borges');

    log('\n── LA BARRA SE ABRE JUNTO A LO SELECCIONADO (norma 5-sexies, revisada) ──');

    ok(!!d.querySelector('#lect-borges .fm-hl-idea'), 'y el subrayado se pinta en el texto', 'no se pintó el subrayado');

    /* Selecciona por posición GLOBAL del párrafo: al pintar marcas el
       texto queda repartido en varios nodos y firstChild ya no vale. */
    function seleccionar(parr, a, b) {
      const paseo = d.createTreeWalker(parr, NodeFilter.SHOW_TEXT, null);
      let off = 0, ini = null, fin = null;
      while (paseo.nextNode()) {
        const n = paseo.currentNode, len = n.nodeValue.length;
        if (!ini && a >= off && a <= off + len) ini = [n, a - off];
        if (!fin && b >= off && b <= off + len) fin = [n, b - off];
        off += len;
      }
      if (!ini || !fin) return false;
      const r = d.createRange();
      r.setStart(ini[0], ini[1]); r.setEnd(fin[0], fin[1]);
      const s = w.getSelection(); s.removeAllRanges(); s.addRange(r);
      d.dispatchEvent(new w.Event('selectionchange'));
      return true;
    }

    log('\n── LA MARCA DE LECTURA, QUE LA PONE EL LECTOR (norma 5-nonies) ──');
    ok(typeof w.FaroMarcador.lugar === 'function', 'el marcador sabe dónde se quedó uno', 'falta FaroMarcador.lugar');
    /* PRIMERO: que NO se ponga sola. La versión anterior la ponía un
       observador según qué párrafo cruzara la franja central de la
       pantalla, y el autor la mandó quitar porque una raya que se mueve
       al lado del texto desconcentra justo mientras se lee. Si alguien la
       devuelve, esto lo caza: aquí se recorre la lectura entera y no
       puede quedar marca ninguna. */
    w.localStorage.removeItem(dentro('SAVE_KEY') + '_lugar');
    const psL = [...d.querySelectorAll('#lect-borges .lect-cuerpo p.lect-p')];
    psL[Math.min(4, psL.length - 1)].scrollIntoView({ block: 'center' });

    ok(!d.querySelector('[data-fm-aqui]'), 'y la cinta vieja del margen ya no existe', 'sigue la cinta del margen izquierdo');

    /* LA PONE EL LECTOR, desde la misma barra con la que subraya, y va

    const parrL = psL[0];

    await esperar(420);

    ok(d.querySelectorAll('#lect-borges .fm-aqui-fin').length === 1, 'con un solo 🔖, aunque cruce una negrita', 'salió más de un marcador');
    const lug = w.FaroMarcador.lugar();
    ok(!!lug && lug.l === 'borges', 'el marcador la apunta', 'no apuntó nada: ' + JSON.stringify(lug));

    /* No puede añadir alto: en una ficha, un renglón de más parte una

       'y no le añade alto al párrafo', 'la marca empujó el texto: ' + altoAntes + ' → ' + parrL.getBoundingClientRect().height);

       marcado TIENE QUE SEGUIR SIENDO MARCABLE. En las fichas y en la

    ok(w.FaroMarcador.esMarcable(parrL), 'y el párrafo se sigue pudiendo subrayar', 'la marca deja el párrafo fuera del marcador');

    log('\n── IMPRESIÓN DE LAS LECTURAS Y DEL PLIEGO ──');
    /* Se comprueba de verdad: se intercepta window.open, se corre cada botón
       de imprimir y se lee el documento que se habría mandado a la
       impresora. Lo que no puede faltar en ninguna hoja es la etiqueta del
       estatus: un pastiche impreso sin declarar es la fuente inflada que
       esta materia enseña a cazar. */
    const abiertos = [];
    const openReal = w.open;
    w.open = function () {
      const doc = { write(s) { abiertos.push(s); }, close() {} };
      return { document: doc, print() {}, focus() {}, close() {} };
    };
    try {
      w.imprimirLectura('borges');
      const hb = abiertos[abiertos.length - 1] || '';
      ok(/La palabra que no se deja cerrar/.test(hb) && /corrigiendo pruebas de un diccionario/.test(hb),
         'el cuento se imprime con su texto completo', 'el cuento no se imprime');
      ok(/NO es obra de ese autor/i.test(hb) && /ejercicio de estilo de la casa/i.test(hb),
         'y con la etiqueta del estatus en la hoja', 'la hoja del cuento sale sin declarar el pastiche');
      ok(/real y comprobable/i.test(hb), 'y con la regla de la erudición real', 'la hoja no trae la regla de los datos reales');

    document.title = (fallos ? 'SUSPENDE' : 'APRUEBA') + ' · Sonda bisturí etapa 2';
  } catch (e) { log('✘ ' + e.message + '\n' + e.stack); document.title = 'SUSPENDE · Sonda bisturí etapa 2'; }
});
</script>
